<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"

    <!-- Meta, title, CSS, favicons, etc. -->

    <meta content="IE=edge" http-equiv="X-UA-Compatible">

    <title>DOCTOR</title>

    <!-- Bootstrap -->
    <link href="/vendors/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <!-- Font Awesome -->
    <link href="/vendors/font-awesome/css/font-awesome.min.css" rel="stylesheet">

    <link href="/vendors/nprogress/nprogress.css" rel="stylesheet">

    <!-- Custom Theme Style -->

<body class="login">
<div>
    <a class="hiddenanchor" id="signup"></a>
    <a class="hiddenanchor" id="signin"></a>

    <div class="login_wrapper">
        <div class="animate form login_form">
            <section class="login_content">
                <form method="POST" th:action="@{/login}">
                    <h1>Login Form</h1>
                    <div>
                        <input class="form-control" id="username" name="username" placeholder="Username" type="text"/>
                    </div>
                    <div>
                        <input class="form-control" id="password" name="password" placeholder="Password"
                               type="password"/>
                    </div>
                    <div>
                        <button class="btn btn-default" type="submit">Login</button>
                        <!-- <a class="reset_pass" href="#">Lost your password?</a> -->
                    </div>

                    <div class="clearfix"></div>

                    <div class="separator">
                        <!-- <p class="change_link">New to site?
                          <a href="#signup" class="to_register"> Create Account </a>
                        </p> -->

                        <div class="clearfix"></div>
                        <br/>

                        <!--    <div>
                             <h1><i class="fa fa-medium"></i> -TECH SOLUTIONS</h1>
                            <!--   <p>Copyright 2018 <a href="http://www.magroup.pk/">MA Group</a>| All Rights Reserved</p>
                           </div>-->
                    </div>
                </form>
            </section>
        </div>

        <div class="animate form registration_form" id="register">
            <section class="login_content">
                <form>
                    <h1>Create Account</h1>
                    <div>
                        <input class="form-control" placeholder="Username" required="" type="text"/>
                    </div>
                    <div>
                        <input class="form-control" placeholder="Email" required="" type="email"/>
                    </div>
                    <div>
                        <input class="form-control" placeholder="Password" required="" type="password"/>
                    </div>
                    <div>
                        <a class="btn btn-default submit" href="index.html">Submit</a>
                    </div>

                    <div class="clearfix"></div>

                    <div class="separator">
                        <p class="change_link">Already a member ?
                            <a class="to_register" href="#signin"> Log in </a>
                        </p>

                        <div class="clearfix"></div>
                        <br/>

                    </div>
                </form>
            </section>
        </div>
    </div>
