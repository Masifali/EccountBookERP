<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style type="text/css">
body {
	color: #73879C;
	background: #2A3F54;
	font-family: "Helvetica Neue", Roboto, Arial, "Droid Sans", sans-serif;
}

table {
	border: 1px solid #73879C;
	border-collapse: collapse;
}

table th, td {
	border: 1px solid #73879C;
	border-collapse: collapse;
}
</style>
</head>

<body class="nav-sm">
	<div class="container body">
		<div class="main_container">

			<!-- page content -->
			<div class="right_col" role="main">
				<div class="">

					<div class="row">
						<div class="col-md-12 col-sm-12 col-xs-12">
							<div class="x_panel" style="margin-bottom: 0px;">
								<div class="x_title">
									<div class="row invoice-header">
										<table class="col-sm-12" style="border: 1px solid black; border-collapse: collapse;">
											<tr style="border: 1px solid black; border-collapse: collapse;">
												<td style="border: 1px solid black; border-collapse: collapse;">
													<div class="col-sm-12 invoice-col"
														style="text-align: left;">
														<strong
															th:text="'SALE ORDER #:&emsp;' + ${saleOrder.saleOrderCode}"></strong>
														<br> <strong
															th:text="'SALE ORDER DATE:&emsp;' + ${#dates.format(saleOrder.saleOrderDate, 'dd-MM-yyyy')}"></strong>
														<br> <strong
															th:text="'FINANCIAL YEAR:&emsp;' + ${saleOrder.financialYear.name}"></strong>
														<br> <strong
															th:text="'STATUS:&emsp;' + ${saleOrder.voucherStatus.name}"></strong>
														
														<br> <strong th:text="'CREATED BY:&emsp;' + ${saleOrder.createdBy}"></strong>
														<br> <strong
															th:text="'CREATED AT:&emsp;' + ${#dates.format(saleOrder.createdAt, 'dd-MM-yyyy hh:mm:ss a')}"></strong>
														<br> <strong
															th:text="'UPDATED BY:&emsp;' + ${saleOrder.modifiedBy}"></strong>
														<br> <strong
															th:text="'UPDATED AT:&emsp;' + ${#dates.format(saleOrder.modifiedAt, 'dd-MM-yyyy hh:mm:ss a')}"></strong>
													</div>
												</td>
											</tr>
										</table>
									</div>
									<div class="clearfix"></div>
								</div>
								<br>
								<div class="x_content">

									<div class="row invoice-info">
										<table class="col-sm-12" style="border: 1px solid black; border-collapse: collapse;">
											<tr style="border: 1px solid black; border-collapse: collapse;">
												<td style="border: 1px solid black; border-collapse: collapse;">
													<div class="col-sm-12 invoice-col"
														style="text-align: left;">
														<strong>FROM,</strong>
														<address>
															<strong
																th:text="'COMPANY:&emsp;' + ${saleOrder.company.name}"></strong>
															<br> <strong
																th:text="'BRANCH:&emsp;' + ${saleOrder.branch.name}"></strong>
															<br> <strong
																th:text="'ADDRESS:&emsp;' + ${saleOrder.company.address}"></strong>
															<br> <strong
																th:text="'CONTACT NO:&emsp;' + ${saleOrder.company.contactNo}"></strong>
														</address>
													</div>
												</td>
												<td style="border: 1px solid black; border-collapse: collapse;">
													<div class="col-sm-12 invoice-col"
														style="text-align: left;">
														<strong>TO,</strong>
														<address>
															<strong
																th:text="'CUSTOMER:&emsp;' + ${saleOrder.customerAccount.formattedCode} + '&emsp;' + ${saleOrder.customerAccount.accountName}"></strong>
															<br> <strong
																th:text="'ADDRESS:&emsp;' + ${saleOrder.customerAccount.address}"></strong>
															<br> <strong
																th:text="'CONTACT NO:&emsp;' + ${saleOrder.customerAccount.mobile}"></strong>
														</address>
													</div>
												</td>
											</tr>
										</table>

									</div>

								</div>
							</div>
							
							<div class="x_panel" style="margin-bottom: 0px;">
								<div class="x_content">
									<br>
									<table id="sale_order_entry_table"
										class="table table-striped table-bordered" style="border: 1px solid black; border-collapse: collapse;">
										<thead>
											<tr style="border: 1px solid black; border-collapse: collapse;">
												<th style="border: 1px solid black; border-collapse: collapse;">#</th>
												<th style="border: 1px solid black; border-collapse: collapse;">CATEGORY</th>
												<th style="border: 1px solid black; border-collapse: collapse;">ITEM</th>
												<th style="border: 1px solid black; border-collapse: collapse;">QTY</th>
												<th style="border: 1px solid black; border-collapse: collapse;">STD PRICE</th>
												<th style="border: 1px solid black; border-collapse: collapse;">DISC/GAIN %</th>
												<th style="border: 1px solid black; border-collapse: collapse;">PRICE</th>
												<th style="border: 1px solid black; border-collapse: collapse;">UNIT WEIGHT</th>
												<th style="border: 1px solid black; border-collapse: collapse;">TOTAL WEIGHT</th>
												<th style="border: 1px solid black; border-collapse: collapse;">FEET</th>
												<th style="border: 1px solid black; border-collapse: collapse;">TOTAL FEET</th>
												<th style="border: 1px solid black; border-collapse: collapse;">AMOUNT</th>
											</tr>
										</thead>

										<tbody>
											<tr style="border: 1px solid black; border-collapse: collapse;"
												th:each="saleOrderEntry, rowStat : ${saleOrder.saleOrderEntries}">
												<td style="border: 1px solid black; border-collapse: collapse;"><span id="serial_no" th:text="${rowStat.count}"></span>
												</td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].itemCategory.name}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].itemDef.formattedCode + '&emsp;' + saleOrder.saleOrderEntries[__${rowStat.index}__].itemDef.itemSubCategory.name + ' ' + saleOrder.saleOrderEntries[__${rowStat.index}__].itemDef.name}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].itemQuantity}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].standardPrice}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].standardPrice}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${#numbers.formatDecimal(saleOrder.saleOrderEntries[__${rowStat.index}__].price, 2, 'DEFAULT', 4, 'DEFAULT')}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].unitWeight}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].totalWeight}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].feet}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${saleOrder.saleOrderEntries[__${rowStat.index}__].totalFeet}"></td>
												<td style="border: 1px solid black; border-collapse: collapse;"
													th:text="${#numbers.formatDecimal(saleOrder.saleOrderEntries[__${rowStat.index}__].amount, 2, 'DEFAULT', 2, 'DEFAULT')}"></td>
											</tr>
										</tbody>

										<tfoot>
											<tr style="border: 1px solid black; border-collapse: collapse;">
												<th class="hidden-print"></th>
												<th colspan="7"></th>
												<td style="border: 1px solid black; border-collapse: collapse;"><span
													th:text="${#numbers.formatDecimal(#aggregates.sum(saleOrder.saleOrderEntries.![totalWeight]), 2, 'DEFAULT', 2, 'DEFAULT')}"></span></td>
												<th style="border: 1px solid black; border-collapse: collapse;"></th>
												<td style="border: 1px solid black; border-collapse: collapse;"><span
													th:text="${#numbers.formatDecimal(#aggregates.sum(saleOrder.saleOrderEntries.![totalFeet]), 2, 'DEFAULT', 2, 'DEFAULT')}"></span></td>
												<td style="border: 1px solid black; border-collapse: collapse;"><span
													th:text="${#numbers.formatDecimal(#aggregates.sum(saleOrder.saleOrderEntries.![amount]), 2, 'DEFAULT', 2, 'DEFAULT')}"></span></td>
											</tr>
										</tfoot>

									</table>
									<!-- /.col -->
									<div class="row" id="po_footer">
										<div class="col-xs-7">
											<div class="table-responsive">
												<br>
												<table class="table" style="border: 1px solid black; border-collapse: collapse; width: auto; float: right;">
													<tbody>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${'FREIGHT CHARGES (' + saleOrder.freightRate + '%)'}"></th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.freightCharges, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${'LOADING CHARGES (' + saleOrder.loadingRate + '%)'}"></th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.loadingCharges, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<!-- <tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;">NET AMOUNT</th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.netAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${'SALES TAX PAYABLE (' + saleOrder.salesTax + '%)'}"></th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.salesTaxAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${'FURTHER SALES TAX ON SALES (' + saleOrder.furtherSalesTax + '%)'}"></th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.furtherSalesTaxAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;">AMOUNT INC. SALES TAX</th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.amountWithSalesTax, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${'ADVANCE INCOME TAX ON SALES (' + saleOrder.advanceIncomeTax + '%)'}"></th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.advanceIncomeTaxAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr> -->
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;">TOTAL AMOUNT</th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(saleOrder.totalAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;">PREVIOUS BALANCE</th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(additionalAttributes.accountBalance, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
														<tr style="border: 1px solid black; border-collapse: collapse;">
															<th style="border: 1px solid black; border-collapse: collapse;">TOTAL BALANCE</th>
															<th style="border: 1px solid black; border-collapse: collapse;"
																th:text="${#numbers.formatDecimal(additionalAttributes.accountBalance + saleOrder.totalAmount, 2, 'DEFAULT', 2, 'DEFAULT')}"></th>
														</tr>
													</tbody>
												</table>
											</div>
										</div>
									</div>

								</div>
							</div>

						</div>
					</div>

				</div>

			</div>
			<!-- /page content -->
		</div>
	</div>

</body>
</html>
