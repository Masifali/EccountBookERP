<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style type="text/css">
body {
	color: #73879C;
	background: #2A3F54;
	font-family: "Helvetica Neue", Roboto, Arial, "Droid Sans", sans-serif;
}

table {
	border: 1px solid #73879C;
	border-collapse: collapse
}

table td {
	border: 1px solid #73879C;
	border-collapse: collapse
}

table th {
	border: 1px solid #73879C;
	border-collapse: collapse
}
</style>
</head>

<body style="background-color:white;">
	<div>
		<h2 style="text-align: center; width: 100%">
			<strong th:text="${voucher.company.name}"></strong>
		</h2>
		<table style="align: center; margin: 0 auto;">
			<tr>
				<td width="50%"><strong
					th:text="'VOUCHER TYPE:&emsp;' + ${voucher.voucherType.name}"></strong></td>
				<td width="50%"><strong
					th:text="'VOUCHER STATUS:&emsp;' + ${voucher.voucherStatus.name}"></strong></td>
			</tr>
			<tr>
				<td width="50%"><strong
					th:text="'FINANCIAL YEAR:&emsp;' + ${voucher.financialYear.name}"></strong></td>
				<td width="50%"><strong
					th:text="'VOUCHER DATE:&emsp;' + ${#dates.format(voucher.voucherDate, 'dd-MM-yyyy')}"></strong></td>
			</tr>
			<tr>
				<td width="50%"><strong
					th:text="'VOUCHER NO.:&emsp;' + ${voucher.voucherCode}"></strong></td>
				<td width="50%"><strong
					th:text="'POST STATUS:&emsp;' + ${voucher.posted}"></strong></td>
			</tr>
			<tr>
				<td width="50%"><strong
					th:text="'CREATED BY:&emsp;' + ${voucher.createdBy}"></strong></td>
				<td width="50%"><strong
					th:text="'CREATED AT:&emsp;' + ${#dates.format(voucher.createdAt, 'dd-MM-yyyy hh:mm:ss a')}"></strong></td>
			</tr>
			<tr>
				<td width="50%"><strong
					th:text="'UPDATED BY:&emsp;' + ${voucher.modifiedBy}"></strong></td>
				<td width="50%"><strong
					th:text="'UPDATED AT:&emsp;' + ${#dates.format(voucher.modifiedAt, 'dd-MM-yyyy hh:mm:ss a')}"></strong></td>
			</tr>
		</table>
		<br>
		<table style="align: center; margin: 0 auto;">
			<tr>
				<td width="10%"><strong>NARRATION:</strong></td>
				<td width="90%" style="text-transform: uppercase"
					th:text="${voucher.voucherNarration}"></td>
			</tr>
		</table>
		<br>
		<table id="voucher_entry_table"
			class="table table-striped table-bordered" style="align: center; margin: 0 auto;">
			<thead>
				<tr>
					<th style="border: 1px solid black; border-collapse: collapse;">#</th>
					<th style="border: 1px solid black; border-collapse: collapse;" th:text="#{branch.label}"></th>
					<th style="border: 1px solid black; border-collapse: collapse;">ACCOUNT</th>
					<th style="border: 1px solid black; border-collapse: collapse;">NARRATION</th>
					
					<th style="border: 1px solid black; border-collapse: collapse;">DEBIT</th>
					<th style="border: 1px solid black; border-collapse: collapse;">CREDIT</th>
					<th style="border: 1px solid black; border-collapse: collapse;">BOOK NO.</th>
				</tr>
			</thead>

			<tbody>
				<tr style="border: 1px solid black; border-collapse: collapse;" th:each="vEntry, rowStat : ${voucher.voucherEntries}">
					<td style="border: 1px solid black; border-collapse: collapse;"><span id="serial_no" th:text="${rowStat.count}"></span></td>
					<td style="border: 1px solid black; border-collapse: collapse;"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].branch.name}"></td>
					<td style="border: 1px solid black; border-collapse: collapse;" id="voucherEntry_account"
						th:value="${voucher.voucherEntries[__${rowStat.index}__].account.code}"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].account.formattedCode} + '&emsp;' + ${voucher.voucherEntries[__${rowStat.index}__].account.accountName}"></td>
					<td style="border: 1px solid black; border-collapse: collapse; text-transform: uppercase;"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].narration}"></td>
					
					<!-- <td style="border: 1px solid black; border-collapse: collapse;"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].recBookNumber}"></td>
					<td style="border: 1px solid black; border-collapse: collapse;"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].recBookPageNumber}"></td> -->
					<td style="border: 1px solid black; border-collapse: collapse;" id="voucherEntry_debit"
						th:text="${#numbers.formatDecimal(voucher.voucherEntries[__${rowStat.index}__].debit, 0, 'DEFAULT', 0, 'DEFAULT')}"></td>
					<td style="border: 1px solid black; border-collapse: collapse;" id="voucherEntry_credit"
						th:text="${#numbers.formatDecimal(voucher.voucherEntries[__${rowStat.index}__].credit, 0, 'DEFAULT', 0, 'DEFAULT')}"></td>
						<td style="border: 1px solid black; border-collapse: collapse;"
						th:text="${voucher.voucherEntries[__${rowStat.index}__].recBookNumber}"></td>
				</tr>
			</tbody>

			<tfoot>
				<tr>
					<th></th>
					<th></th>
					<th></th>
					<th></th>
					
					<th style="border: 1px solid black; border-collapse: collapse;"><span id="debitTotal"
						th:text="${#numbers.formatDecimal(#aggregates.sum(voucher.voucherEntries.![debit]), 2, 'DEFAULT', 2, 'DEFAULT')}"></span></th>
					<th style="border: 1px solid black; border-collapse: collapse;"><span id="creditTotal"
						th:text="${#numbers.formatDecimal(#aggregates.sum(voucher.voucherEntries.![credit]), 2, 'DEFAULT', 2, 'DEFAULT')}"></span></th>
				  <th></th>
				</tr>
			</tfoot>

		</table>

	</div>
</body>
</html>
