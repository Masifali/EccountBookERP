<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Items</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-cube"></i> Items</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li>
                                    <a th:href="@{/inventory/items/add}" class="btn btn-success">
                                        <i class="fa fa-plus"></i> Add Item
                                    </a>
                                </li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered" id="dataTable">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>CODE</th>
                                    <th>NAME</th>
                                    <th>CATEGORY</th>
                                    <th>TYPE</th>
                                    <th>ACTIVE</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="i, stat : ${items}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${i.itemCode}"></td>
                                    <td th:text="${i.itemName}"></td>
                                    <td th:text="${i.itemCategory != null ? i.itemCategory.categoryDescription : ''}"></td>
                                    <td th:text="${i.itemType != null ? i.itemType.typeDescription : ''}"></td>
                                    <td th:text="${i.itemStatus} ? 'Yes' : 'No'"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a th:href="@{'/inventory/items/edit/' + ${i.id}}" title="Edit"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/inventory/items/delete/' + ${i.id}}" title="Delete" onclick="return confirm('Delete this item?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${items == null or items.isEmpty()}">
                                    <td colspan="7" style="text-align:center; color:#9aa3ae; padding:30px;">No items defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
