<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Party Processing Item Categories</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-tags"></i> Party Processing Item Categories</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li>
                                    <button type="button" class="btn btn-success" onclick="openModal(false)">
                                        <i class="fa fa-plus"></i> Add Category
                                    </button>
                                </li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered" id="dataTable">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>CODE</th>
                                    <th>DESCRIPTION</th>
                                    <th>SERIAL RANGE</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c, stat : ${categories}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${c.code}"></td>
                                    <td th:text="${c.description}"></td>
                                    <td th:text="${(c.serialFrom ?: '') + ' - ' + (c.serialTo ?: '')}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a href="javascript:void(0)" title="Edit" th:attr="onclick='editItem(' + ${c.id} + ')'"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/party_processing/item_categories/delete/' + ${c.id}}" title="Delete" onclick="return confirm('Delete this category?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${categories == null or categories.isEmpty()}">
                                    <td colspan="5" style="text-align:center; color:#9aa3ae; padding:30px;">No categories defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document" style="max-width:480px;">
        <div class="modal-content">
            <form th:action="@{/party_processing/item_categories/save}" th:object="${category}" method="post" id="itemForm">
                <input type="hidden" th:field="*{id}" id="modalItemId"/>
                <div class="modal-header">
                    <h4 id="itemModalLabel">Add Category</h4>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="form-group"><label>Code</label><input type="text" class="form-control" th:field="*{code}" required/></div>
                    <div class="form-group"><label>Description</label><input type="text" class="form-control" th:field="*{description}" required/></div>
                    <div class="row">
                        <div class="col-md-6"><div class="form-group"><label>Serial From</label><input type="text" class="form-control" th:field="*{serialFrom}"/></div></div>
                        <div class="col-md-6"><div class="form-group"><label>Serial To</label><input type="text" class="form-control" th:field="*{serialTo}"/></div></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:inline="javascript">
    function openModal(isEdit) {
        if (!isEdit) { $('#itemForm')[0].reset(); $('#modalItemId').val('0'); }
        $('#itemModalLabel').text(isEdit ? 'Edit Category' : 'Add Category');
        $('#itemModal').modal('show');
    }
    function editItem(id) { window.location.href = '/party_processing/item_categories/edit/' + id; }
    /*[# th:if="${category != null and category.id > 0}"]*/
    $(function () { openModal(true); });
    /*[/]*/
</script>
</body>
</html>
