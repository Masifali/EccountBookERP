<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Party Processing GDN</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/bootstrap-datepicker/css/bootstrap-datepicker.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-sign-out"></i> Party Processing GDN (Goods Received)</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li>
                                    <button type="button" class="btn btn-success" onclick="openModal(false)">
                                        <i class="fa fa-plus"></i> Add GDN
                                    </button>
                                </li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered" id="dataTable">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>DOC NO</th>
                                    <th>DATE</th>
                                    <th>SUPPLIER</th>
                                    <th>JOB LOT</th>
                                    <th>VEHICLE NO</th>
                                    <th>NET WEIGHT</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="t, stat : ${transactions}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${t.docNo}"></td>
                                    <td th:text="${t.docDate != null ? #dates.format(t.docDate, 'dd-MMM-yyyy') : ''}"></td>
                                    <td th:text="${t.supplier != null ? t.supplier.company : ''}"></td>
                                    <td th:text="${t.jobLot != null ? t.jobLot.code : ''}"></td>
                                    <td th:text="${t.vehicleNo}"></td>
                                    <td th:text="${t.netWeight}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a href="javascript:void(0)" title="Edit" th:attr="onclick='editItem(' + ${t.id} + ')'"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/party_processing/gdn/delete/' + ${t.id}}" title="Delete" onclick="return confirm('Delete this GDN?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${transactions == null or transactions.isEmpty()}">
                                    <td colspan="8" style="text-align:center; color:#9aa3ae; padding:30px;">No GDNs recorded yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form th:action="@{/party_processing/gdn/save}" th:object="${transaction}" method="post" id="itemForm">
                <input type="hidden" th:field="*{id}" id="modalItemId"/>
                <div class="modal-header">
                    <h4 id="itemModalLabel">Add GDN</h4>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-3"><div class="form-group"><label>Doc No</label><input type="text" class="form-control" th:field="*{docNo}"/></div></div>
                        <div class="col-md-3"><div class="form-group"><label>Doc Date</label><input type="text" class="form-control datepicker" th:field="*{docDate}"/></div></div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Supplier</label>
                                <select class="form-control modal-select2" th:field="*{supplier.id}">
                                    <option value="0">— Select —</option>
                                    <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.company}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Job Lot</label>
                                <select class="form-control modal-select2" th:field="*{jobLot.id}">
                                    <option value="0">— None —</option>
                                    <option th:each="j : ${jobLots}" th:value="${j.id}" th:text="${j.code}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Warehouse</label>
                                <select class="form-control modal-select2" th:field="*{warehouse.id}">
                                    <option value="0">— None —</option>
                                    <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Branch</label>
                                <select class="form-control modal-select2" th:field="*{branch.id}">
                                    <option value="0">— None —</option>
                                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3"><div class="form-group"><label>Vehicle No</label><input type="text" class="form-control" th:field="*{vehicleNo}"/></div></div>
                        <div class="col-md-3"><div class="form-group"><label>Gate Pass No</label><input type="text" class="form-control" th:field="*{gatePassNo}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Bilty No</label><input type="text" class="form-control" th:field="*{biltyNo}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Gross Wt</label><input type="number" step="0.01" class="form-control" th:field="*{grossWeight}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Net Wt</label><input type="number" step="0.01" class="form-control" th:field="*{netWeight}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Factory Wt</label><input type="number" step="0.01" class="form-control" th:field="*{factoryWeight}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Stock Wt</label><input type="number" step="0.01" class="form-control" th:field="*{stockWeight}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Additional Wt</label><input type="number" step="0.01" class="form-control" th:field="*{additionalWeight}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Empty Bags Used</label><input type="number" class="form-control" th:field="*{emptyBagsUsed}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Empty Bags Total</label><input type="number" class="form-control" th:field="*{emptyBagsTotal}"/></div></div>
                        <div class="col-md-2"><div class="form-group"><label>Carriage Amount</label><input type="number" step="0.01" class="form-control" th:field="*{carriageAmount}"/></div></div>
                        <div class="col-md-2">
                            <label style="display:flex; align-items:center; gap:8px; margin-top:32px; cursor:pointer;">
                                <input type="checkbox" th:field="*{addWages}"/> Add Wages
                            </label>
                        </div>
                        <div class="col-md-12"><div class="form-group"><label>Remarks</label><input type="text" class="form-control" th:field="*{remarks}"/></div></div>
                    </div>

                    <hr/>
                    <h4>Items</h4>
                    <table class="table table-bordered" id="linesTable">
                        <thead>
                        <tr>
                            <th style="width:40%;">Item</th>
                            <th style="width:20%;">Quantity</th>
                            <th style="width:30%;">Remarks</th>
                            <th style="width:10%;"></th>
                        </tr>
                        </thead>
                        <tbody id="linesTableBody">
                        <tr th:each="line, lineStat : *{lines}">
                            <td>
                                <select class="form-control line-select2" th:field="${transaction.lines[__${lineStat.index}__].item.id}">
                                    <option value="0">— Select —</option>
                                    <option th:each="it : ${items}" th:value="${it.id}" th:text="${it.code + ' - ' + it.name}"></option>
                                </select>
                            </td>
                            <td><input type="number" step="0.01" class="form-control" th:field="${transaction.lines[__${lineStat.index}__].quantity}"/></td>
                            <td><input type="text" class="form-control" th:field="${transaction.lines[__${lineStat.index}__].remarks}"/></td>
                            <td style="text-align:center;"><a href="javascript:void(0)" class="remove-row" title="Remove"><i class="fa fa-trash"></i></a></td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-default btn-sm" id="addRowBtn"><i class="fa fa-plus"></i> Add Item</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/vendors/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js}"></script>
<script th:inline="javascript">
    var itemOptions = /*[[${items}]]*/ [];

    function reindexLines() {
        $('#linesTableBody tr').each(function (i) {
            $(this).find('select, input').each(function () {
                var name = $(this).attr('name');
                if (name) {
                    $(this).attr('name', name.replace(/lines\[\d+\]/, 'lines[' + i + ']'));
                }
            });
        });
    }

    function addLineRow() {
        var idx = $('#linesTableBody tr').length;
        var options = '<option value="0">— Select —</option>';
        $.each(itemOptions, function (i, it) {
            options += '<option value="' + it.id + '">' + it.code + ' - ' + it.name + '</option>';
        });
        var row = '<tr>' +
            '<td><select class="form-control line-select2" name="lines[' + idx + '].item.id">' + options + '</select></td>' +
            '<td><input type="number" step="0.01" class="form-control" name="lines[' + idx + '].quantity" value="0"/></td>' +
            '<td><input type="text" class="form-control" name="lines[' + idx + '].remarks"/></td>' +
            '<td style="text-align:center;"><a href="javascript:void(0)" class="remove-row" title="Remove"><i class="fa fa-trash"></i></a></td>' +
            '</tr>';
        $('#linesTableBody').append(row);
        $('.line-select2').select2({dropdownAutoWidth: true, width: '100%'});
    }

    $(function () {
        $('.modal-select2, .line-select2').select2({dropdownAutoWidth: true, width: '100%'});
        $('.datepicker').datepicker({format: 'dd-M-yyyy', autoclose: true, todayHighlight: true});
        $('#addRowBtn').on('click', function () { addLineRow(); });
        $(document).on('click', '.remove-row', function () {
            $(this).closest('tr').remove();
            reindexLines();
        });
    });

    function openModal(isEdit) {
        if (!isEdit) {
            $('#itemForm')[0].reset();
            $('#modalItemId').val('0');
            $('.modal-select2').val('0').trigger('change');
            $('#linesTableBody').empty();
            addLineRow();
        }
        $('#itemModalLabel').text(isEdit ? 'Edit GDN' : 'Add GDN');
        $('#itemModal').modal('show');
    }
    function editItem(id) { window.location.href = '/party_processing/gdn/edit/' + id; }
    /*[# th:if="${transaction != null and transaction.id > 0}"]*/
    $(function () { openModal(true); });
    /*[/]*/
</script>
</body>
</html>
