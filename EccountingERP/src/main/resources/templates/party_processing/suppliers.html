<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Party Processing Suppliers</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-users"></i> Party Processing Suppliers</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li>
                                    <button type="button" class="btn btn-success" onclick="openModal(false)">
                                        <i class="fa fa-plus"></i> Add Supplier
                                    </button>
                                </li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered" id="dataTable">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>COMPANY</th>
                                    <th>CITY</th>
                                    <th>MOBILE</th>
                                    <th>GL ACCOUNT</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s, stat : ${suppliers}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${s.company}"></td>
                                    <td th:text="${s.city}"></td>
                                    <td th:text="${s.mobile}"></td>
                                    <td th:text="${s.glAccount != null ? s.glAccount.accountName : ''}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a href="javascript:void(0)" title="Edit" th:attr="onclick='editItem(' + ${s.id} + ')'"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/party_processing/suppliers/delete/' + ${s.id}}" title="Delete" onclick="return confirm('Delete this supplier?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${suppliers == null or suppliers.isEmpty()}">
                                    <td colspan="6" style="text-align:center; color:#9aa3ae; padding:30px;">No suppliers defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document" style="max-width:500px;">
        <div class="modal-content">
            <form th:action="@{/party_processing/suppliers/save}" th:object="${supplier}" method="post" id="itemForm">
                <input type="hidden" th:field="*{id}" id="modalItemId"/>
                <div class="modal-header">
                    <h4 id="itemModalLabel">Add Supplier</h4>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="form-group"><label>Company / Name</label><input type="text" class="form-control" th:field="*{company}" required/></div>
                    <div class="form-group"><label>Address</label><input type="text" class="form-control" th:field="*{address1}"/></div>
                    <div class="row">
                        <div class="col-md-6"><div class="form-group"><label>City</label><input type="text" class="form-control" th:field="*{city}"/></div></div>
                        <div class="col-md-6"><div class="form-group"><label>Country</label><input type="text" class="form-control" th:field="*{country}"/></div></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6"><div class="form-group"><label>CNIC No</label><input type="text" class="form-control" th:field="*{cnicNo}"/></div></div>
                        <div class="col-md-6"><div class="form-group"><label>Mobile</label><input type="text" class="form-control" th:field="*{mobile}"/></div></div>
                    </div>
                    <div class="form-group">
                        <label>GL Account (for billing)</label>
                        <select class="form-control modal-select2" th:field="*{glAccount.code}">
                            <option value="0">— None —</option>
                            <option th:each="a : ${accounts}" th:value="${a.code}" th:text="${a.code + ' - ' + a.accountName}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:inline="javascript">
    $(function () {
        $('.modal-select2').select2({dropdownAutoWidth: true, width: '100%'});
    });
    function openModal(isEdit) {
        if (!isEdit) {
            $('#itemForm')[0].reset();
            $('#modalItemId').val('0');
            $('.modal-select2').val('0').trigger('change');
        }
        $('#itemModalLabel').text(isEdit ? 'Edit Supplier' : 'Add Supplier');
        $('#itemModal').modal('show');
    }
    function editItem(id) { window.location.href = '/party_processing/suppliers/edit/' + id; }
    /*[# th:if="${supplier != null and supplier.id > 0}"]*/
    $(function () { openModal(true); });
    /*[/]*/
</script>
</body>
</html>
