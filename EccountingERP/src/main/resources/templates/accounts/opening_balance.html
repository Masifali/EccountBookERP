<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Account Opening Balance</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
    <style>
        .ob-input { width: 130px; text-align: right; }
    </style>
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-balance-scale"></i> Account Opening Balance</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li><a th:href="@{/accounts/opening_balance}" class="btn btn-default"><i class="fa fa-refresh"></i> Refresh</a></li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <p class="text-muted">Enter either a Debit or a Credit for each account, not both. Change any rows you need, then Save All.</p>
                            <form th:action="@{/accounts/opening_balance/save}" th:object="${form}" method="post">
                                <table class="table table-striped table-bordered">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>ACCOUNT CODE</th>
                                        <th>ACCOUNT TITLE</th>
                                        <th style="text-align:right;">OPENING DEBIT</th>
                                        <th style="text-align:right;">OPENING CREDIT</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="row, stat : *{rows}">
                                        <td th:text="${stat.index + 1}"></td>
                                        <td th:text="${row.accountCode}"></td>
                                        <td>
                                            <span th:text="${row.accountTitle}"></span>
                                            <input type="hidden" th:field="*{rows[__${stat.index}__].accountCode}"/>
                                            <input type="hidden" th:field="*{rows[__${stat.index}__].accountTitle}"/>
                                        </td>
                                        <td style="text-align:right;">
                                            <input type="number" step="0.01" class="form-control ob-input" th:field="*{rows[__${stat.index}__].openingDebit}"/>
                                        </td>
                                        <td style="text-align:right;">
                                            <input type="number" step="0.01" class="form-control ob-input" th:field="*{rows[__${stat.index}__].openingCredit}"/>
                                        </td>
                                    </tr>
                                    <tr th:if="${form.rows == null or form.rows.isEmpty()}">
                                        <td colspan="5" style="text-align:center; color:#9aa3ae; padding:30px;">No detail accounts defined yet - add some under Chart Of Accounts first.</td>
                                    </tr>
                                    </tbody>
                                </table>
                                <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save All</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
