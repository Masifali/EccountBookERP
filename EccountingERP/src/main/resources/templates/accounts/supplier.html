<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Define Supplier / Customer</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-address-book"></i> Define Supplier / Customer</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <form method="get" th:action="@{/accounts/supplier}" class="form-inline" style="margin-bottom:15px;">
                                <label style="margin-right:8px;">Type</label>
                                <select name="customerTypeId" class="form-control" onchange="this.form.submit()">
                                    <option value="" th:selected="${selCustomerTypeId == null}">-- All --</option>
                                    <option th:each="t : ${types}" th:value="${t.id}"
                                            th:selected="${selCustomerTypeId != null and selCustomerTypeId == t.id}"
                                            th:text="${t.supplierCustomerType}"></option>
                                </select>
                            </form>

                            <table class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>TYPE</th>
                                    <th>PARTY CODE</th>
                                    <th>NAME</th>
                                    <th>PHONE / WHATSAPP</th>
                                    <th>GL ACCOUNT</th>
                                    <th style="text-align:center; width:90px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p, stat : ${parties}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td>
                                        <span th:each="t : ${types}" th:if="${t.id == p.customerTypeId}" th:text="${t.supplierCustomerType}"></span>
                                    </td>
                                    <td th:text="${p.manualPartyCode ?: p.supCustCode}"></td>
                                    <td th:text="${p.companyName}"></td>
                                    <td th:text="${p.mobilePersonal ?: p.whatsAppNo}"></td>
                                    <td th:text="${p.glAccountId}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a href="javascript:void(0)" title="Edit" th:attr="onclick='editItem(' + ${p.id} + ')'"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/accounts/supplier/delete/' + ${p.id}}" title="Delete" onclick="return confirm('Delete this party?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${parties == null or parties.isEmpty()}">
                                    <td colspan="7" style="text-align:center; color:#9aa3ae; padding:30px;">No suppliers/customers defined yet.</td>
                                </tr>
                                </tbody>
                            </table>

                            <div class="x_panel">
                                <div class="x_title"><h2 id="formTitle">Add Party</h2><div class="clearfix"></div></div>
                                <div class="x_content">
                                    <form th:action="@{/accounts/supplier/save}" th:object="${party}" method="post" class="form-horizontal" id="partyForm">
                                        <input type="hidden" th:field="*{id}" id="partyId"/>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Type</label>
                                            <div class="col-sm-4">
                                                <select class="form-control" th:field="*{customerTypeId}">
                                                    <option value="">-- Select --</option>
                                                    <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.supplierCustomerType}"></option>
                                                </select>
                                            </div>
                                            <label class="col-sm-2 control-label">Party Code</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{manualPartyCode}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Customer Group</label>
                                            <div class="col-sm-4">
                                                <select class="form-control" th:field="*{customerGroupId}">
                                                    <option value="">-- None --</option>
                                                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.description}"></option>
                                                </select>
                                            </div>
                                            <label class="col-sm-2 control-label">GL Account</label>
                                            <div class="col-sm-4">
                                                <select class="form-control" th:field="*{glAccountId}">
                                                    <option value="">-- None --</option>
                                                    <option th:each="a : ${glAccounts}" th:value="${a.id}"
                                                            th:text="${a.accountCode} + ' - ' + ${a.accountTitle}"></option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Company / Name</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{companyName}" required/>
                                            </div>
                                            <label class="col-sm-2 control-label">Nick Name</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{nickName}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">First Name</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{firstName}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">Last Name</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{lastName}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Credit Limit</label>
                                            <div class="col-sm-4">
                                                <input type="number" step="0.01" class="form-control" th:field="*{creditLimit}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">Reporting Title</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{reportingTitle}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Address 1</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{address1}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">Address 2</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{address2}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Mobile</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{mobilePersonal}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">WhatsApp No</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{whatsAppNo}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">Phone</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{phone}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">Email</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{email}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">NTN #</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{ntnNo}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">STRN #</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{strnNo}"/>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">CNIC #</label>
                                            <div class="col-sm-4">
                                                <input type="text" class="form-control" th:field="*{cnic}"/>
                                            </div>
                                            <label class="col-sm-2 control-label">Status</label>
                                            <div class="col-sm-4">
                                                <select class="form-control" th:field="*{status}">
                                                    <option value="true">Active</option>
                                                    <option value="false">Inactive</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="col-sm-offset-2 col-sm-10">
                                                <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save</button>
                                                <button type="button" class="btn btn-default" onclick="resetForm()"><i class="fa fa-plus"></i> New</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:inline="javascript">
    function editItem(id) { window.location.href = '/accounts/supplier/edit/' + id; }
    function resetForm() { window.location.href = '/accounts/supplier'; }
    /*[# th:if="${party != null and party.id != null}"]*/
    $(function () { $('#formTitle').text('Edit Party'); });
    /*[/]*/
</script>
</body>
</html>
