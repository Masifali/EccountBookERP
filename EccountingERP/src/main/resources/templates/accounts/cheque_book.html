<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Cheque Book Registration</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-money"></i> Cheque Book Registration</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <form method="get" th:action="@{/accounts/cheque_book}" class="form-inline" style="margin-bottom:15px;">
                                <label style="margin-right:8px;">Cheque In Hand (Bank) Account</label>
                                <select name="chequeInHandAccount" class="form-control" onchange="this.form.submit()">
                                    <option value="">-- Select Bank Account --</option>
                                    <option th:each="b : ${bankAccounts}" th:value="${b.accountCode}" th:selected="${b.accountCode == selBank}"
                                            th:text="${b.accountCode} + ' - ' + ${b.accountTitle}"></option>
                                </select>
                            </form>

                            <table class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>CHEQUE NO</th>
                                    <th>CHEQUE DATE</th>
                                    <th>ACCOUNT</th>
                                    <th style="text-align:right;">AMOUNT</th>
                                    <th>NARRATION</th>
                                    <th style="text-align:center; width:80px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c, stat : ${cheques}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${c.chequeNo}"></td>
                                    <td th:text="${c.chequeDate}"></td>
                                    <td th:text="${c.account != null ? c.account.accountTitle : ''}"></td>
                                    <td style="text-align:right;" th:text="${c.amount}"></td>
                                    <td th:text="${c.narration}"></td>
                                    <td style="text-align:center;">
                                        <a th:href="@{/accounts/cheque_book/delete/{id}(id=${c.id},chequeInHandAccount=${selBank})}" title="Delete" onclick="return confirm('Delete this cheque record?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${selBank == ''}">
                                    <td colspan="7" style="text-align:center; color:#9aa3ae; padding:30px;">Select a bank account above to see its cheques.</td>
                                </tr>
                                <tr th:if="${selBank != '' and (cheques == null or cheques.isEmpty())}">
                                    <td colspan="7" style="text-align:center; color:#9aa3ae; padding:30px;">No cheques registered for this account yet.</td>
                                </tr>
                                </tbody>
                            </table>

                            <div th:if="${selBank != ''}" class="x_panel">
                                <div class="x_title"><h2>Add Cheque</h2><div class="clearfix"></div></div>
                                <div class="x_content">
                                    <form th:action="@{/accounts/cheque_book/save}" th:object="${chequeForm}" method="post" class="form-inline">
                                        <input type="hidden" th:field="*{chequeInHandAccount}"/>
                                        <div class="form-group" style="margin-right:10px;">
                                            <label style="margin-right:5px;">Cheque No</label>
                                            <input type="text" class="form-control" th:field="*{chequeNo}" required/>
                                        </div>
                                        <div class="form-group" style="margin-right:10px;">
                                            <label style="margin-right:5px;">Cheque Date</label>
                                            <input type="date" class="form-control" th:field="*{chequeDate}" required/>
                                        </div>
                                        <div class="form-group" style="margin-right:10px;">
                                            <label style="margin-right:5px;">Account</label>
                                            <select name="payeeAccountCode" class="form-control" required>
                                                <option value="">-- Select Account --</option>
                                                <option th:each="a : ${payeeAccounts}" th:value="${a.accountCode}" th:text="${a.accountCode} + ' - ' + ${a.accountTitle}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group" style="margin-right:10px;">
                                            <label style="margin-right:5px;">Amount</label>
                                            <input type="number" step="0.01" class="form-control" th:field="*{amount}" required/>
                                        </div>
                                        <div class="form-group" style="margin-right:10px;">
                                            <label style="margin-right:5px;">Narration</label>
                                            <input type="text" class="form-control" th:field="*{narration}"/>
                                        </div>
                                        <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
