<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Accounts</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
    <style>
        .accounts-home-header {
            background-color: #14746e;
            color: #fff;
            padding: 18px 25px;
            margin: -20px -15px 25px -15px;
            font-size: 22px;
            font-weight: bold;
        }
        .module-tile {
            display: block;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            text-decoration: none;
            color: inherit;
            background: #fff;
            overflow: hidden;
        }
        .module-tile:hover, .module-tile:focus {
            text-decoration: none;
            color: inherit;
        }
        .module-tile.selected {
            border: 2px solid #14746e;
        }
        .module-tile-count {
            background-color: #14746e;
            color: #fff;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 8px 0;
        }
        .module-tile-body {
            text-align: center;
            padding: 18px 10px;
        }
        .module-tile-body i {
            font-size: 32px;
            color: #14746e;
        }
        .module-tile-body div {
            margin-top: 10px;
            font-weight: bold;
            color: #222;
        }
        .screen-shortcut {
            display: block;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            background: #fff;
            text-decoration: none;
            color: inherit;
            padding: 18px 10px 14px 10px;
            text-align: center;
            min-height: 96px;
        }
        .screen-shortcut:hover, .screen-shortcut:focus {
            text-decoration: none;
            color: inherit;
            border-color: #14746e;
        }
        .screen-shortcut .fa-star-o {
            color: #e57373;
            font-size: 18px;
        }
        .screen-shortcut .screen-shortcut-name {
            margin-top: 10px;
            font-weight: bold;
            color: #222;
        }
        .no-screens-yet {
            color: #888;
            font-style: italic;
            padding: 20px 5px;
        }
    </style>
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">

            <div class="accounts-home-header">Accounts</div>

            <div class="row" style="margin-bottom: 25px;">
                <div class="col-md-3 col-sm-6 col-xs-12" th:each="t : ${tiles}" style="margin-bottom: 15px;">
                    <a class="module-tile" th:classappend="${t.id == selectedModule} ? ' selected' : ''"
                       th:href="@{/accounts(module=${t.id})}">
                        <div class="module-tile-count" th:text="${t.count}">0</div>
                        <div class="module-tile-body">
                            <i class="fa fa-university"></i>
                            <div th:text="${t.name}">Module</div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-2 col-sm-4 col-xs-6" th:each="s : ${screens}" style="margin-bottom: 15px;">
                    <a class="screen-shortcut" th:href="@{${s.targetUrl}}">
                        <i class="fa fa-star-o"></i>
                        <div class="screen-shortcut-name" th:text="${s.screenName}">Screen</div>
                    </a>
                </div>
                <div class="col-xs-12 no-screens-yet" th:if="${#lists.isEmpty(screens)}">
                    No screens built yet for this module.
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
