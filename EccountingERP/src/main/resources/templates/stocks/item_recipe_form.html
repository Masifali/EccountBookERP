    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>M-TECH</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <!-- NProgress -->
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <!-- iCheck -->
    <link rel="stylesheet" th:href="@{/vendors/iCheck/skins/flat/green.css}">
    <!-- Datatables -->
    <link rel="stylesheet" th:href="@{/vendors/datatables.net-bs/css/dataTables.bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/datatables.net-buttons-bs/css/buttons.bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/datatables.net-fixedheader-bs/css/fixedHeader.bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/datatables.net-responsive-bs/css/responsive.bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/datatables.net-scroller-bs/css/scroller.bootstrap.min.css}">

    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

    <link rel="stylesheet" th:href="@{/vendors/jquery-confirm-master/css/jquery-confirm.css}">

    <!-- Custom Theme Style -->
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">

    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-sm">
<div class="container body">
    <!-- sidebar and top navigation -->
    <div th:replace="fragments/fixed_sidebar :: div">
    </div>
    <!-- /sidebar and top navigation -->
    <div class="right_col" role="main">
        <div class="">

            <div class="row">
                <div class="col-md-12">
                    <ol class="breadcrumb">
                        <li><a th:href="@{/index}">STOCK</a></li>
                        <li>ITEM RECIPE FORM</li>
                    </ol>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2>ITEM RECIPE</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <form th:action="@{/stocks/add_or_update_recipe}" class="form-horizontal form-label-left" id="itemRecipeForm"
                                  method="post" th:object="${itemRecipe}">
                                <div class="col-md-12 col-sm-12 col-xs-12">
                                    <div class="alert alert-danger fade in" th:if="${#fields.hasErrors('*')}">
                                        <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        <div class="form-group">
                                            <label class="control-label col-md-3 col-sm-3 col-xs-12">COMPANY</label>
                                            <div class="col-md-9 col-sm-9 col-xs-12">
                                                <select class="form-control select2_single" required="required"
                                                        th:attr="style='pointer-events:' + ${disableEditControls == 'true' ? 'none' : ''}"
                                                        th:field="${itemRecipe.company.id}">
                                                    <option th:each="company : ${companies}"
                                                            th:text="${company.name}"
                                                            th:value="${company.id}">
                                                    </option>
                                                </select>
                                                <input id="itemRecipe_id" th:field="${itemRecipe.id}" type="hidden"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        <div class="form-group">
                                            <label class="control-label col-md-3 col-sm-3 col-xs-12">BRANCH</label>
                                            <div class="col-md-9 col-sm-9 col-xs-12">
                                                <select class="form-control branch select2_single" required="required"
                                                        th:field="${itemRecipe.branch}">
                                                    <option th:each="companyBranch : ${itemRecipe.company.branches}"
                                                            th:if="${itemRecipe.company}"
                                                            th:text="${companyBranch.name}"
                                                            th:value="${companyBranch.id}">
                                                    </option>
                                                    <option th:each="companyBranch : ${companyBranches}"
                                                            th:if="${companyBranches}"
                                                            th:text="${companyBranch.name}"
                                                            th:value="${companyBranch.id}">
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="row">
                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        <div class="form-group">
                                            <label class="control-label col-md-3 col-sm-3 col-xs-12">RECIPE ITEM</label>
                                            <div class="col-md-9 col-sm-9 col-xs-12">
                                                <select class="form-control select2_single" required="required"
                                                        th:field="${itemRecipe.itemDef.id}">
                                                    <option th:each="itemDef : ${itemDefs}"
                                                            th:text="${itemDef.formattedCode + '&emsp;' + itemDef.itemSubCategory.name + ' ' + itemDef.name}"
                                                            th:value="${itemDef.id}">
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        <div class="form-group">
                                            <label class="control-label col-md-3 col-sm-3 col-xs-12">RECIPE
                                                DATE</label>
                                            <div class="col-md-9 col-sm-9 col-xs-12">
                                                <input class="form-control" id="recipeDate" required="required"
                                                       th:field="${itemRecipe.recipeDate}" type="date">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 col-sm-6 col-xs-12">
                                        <div class="form-group">
                                            <div class="col-md-3 col-sm-3 col-xs-12"></div>
<!--                                            <label class="control-label col-md-3 col-sm-3 col-xs-12"></label>-->
                                            <div class="col-md-9 col-sm-9 col-xs-12">
                                                <label>
                                                    <input id="reverse" required="required"
                                                           th:field="${itemRecipe.reverse}" type="checkbox" />&nbsp;&nbsp;REVERSE
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-12 col-sm-12 col-xs-12">
                                        <div class="x_panel">
                                            <div class="x_title">
                                                <h2>RECIPE ENTRY FORM</h2>
                                                <div class="clearfix"></div>
                                            </div>
                                            <div class="x_content">
                                                <table class="table table-striped table-bordered"
                                                       id="voucher_entry_table">
                                                    <thead>
                                                    <tr>
                                                        <th class="col-md-1 col-sm-1 col-xs-1"
                                                            style="text-align: center; vertical-align: middle;">#
                                                        </th>
                                                        <th class="col-md-8 col-sm-8 col-xs-8">ITEM</th>
                                                        <th class="col-md-2 col-sm-2 col-xs-2">QUANTITY</th>
                                                        <th class="col-md-1 col-sm-1 col-xs-1"
                                                            style="text-align: center; vertical-align: middle;">
                                                            ADD/DELETE
                                                        </th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <tr th:each="vEntry, rowStat : ${itemRecipe.recipeEntries}">
                                                        <td style="text-align: center; vertical-align: middle;">
                                                            <span class="serial_no" th:text="${rowStat.count}"></span>
                                                            <input th:field="${itemRecipe.recipeEntries[__${rowStat.index}__].id}"
                                                                   type="hidden"/>
                                                            <input th:field="${itemRecipe.recipeEntries[__${rowStat.index}__].sequence}"
                                                                   type="hidden"/>
                                                        </td>
                                                        <td>
                                                            <select class="form-control select2_single recipeEntry_itemDef"
                                                                    required="required"
                                                                    th:field="${itemRecipe.recipeEntries[__${rowStat.index}__].itemDef.id}">
                                                                <option th:each="itemDef : ${itemDefs}"
                                                                        th:text="${itemDef.formattedCode + '&emsp;' + itemDef.itemSubCategory.name + ' ' + itemDef.name}"
                                                                        th:value="${itemDef.id}">
                                                                </option>
                                                            </select>
                                                        </td>
                                                        <td><input class="form-control quantityUsed"
                                                                   style="text-align: right;"
                                                                   onfocus="this.select()"
                                                                   step="any"
                                                                   th:field="${itemRecipe.recipeEntries[__${rowStat.index}__].quantityUsed}"
                                                                   type="number">
                                                        </td>
                                                        <td style="text-align: center; vertical-align: middle;">
                                                            <a class="entry_add" href="javascript:void(0)"
                                                               style="text-decoration: underline;"
                                                               th:if="${rowStat.count > 1}">ADD</a>

                                                            <span th:if="${rowStat.count > 1}"> | </span>

                                                            <a class="entry_delete" href="javascript:void(0)"
                                                               style="text-decoration: underline;"
                                                               th:if="${rowStat.count > 1}">DELETE</a>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <button class="btn btn-success" id="submitForm" style="float: right;"><i
                                            class="fa fa-credit-card"></i> Submit
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <!-- /page content -->
    </div>
    <!-- footer content -->
    <footer>
        <div class="pull-right">
            Gentelella - Bootstrap Admin Template by <a href="https://colorlib.com">Colorlib</a>
        </div>
        <div class="clearfix"></div>
    </footer>
    <!-- /footer content -->
</div>

<script th:src="@{/vendors/nprogress/nprogress.js}"></script>

<script th:src="@{/vendors/iCheck/icheck.min.js}"></script>
<!-- Datatables -->
<script th:src="@{/vendors/datatables.net/js/jquery.dataTables.min.js}"></script>
<script th:src="@{/vendors/datatables.net-bs/js/dataTables.bootstrap.min.js}"></script>
<script th:src="@{/vendors/datatables.net-buttons/js/dataTables.buttons.min.js}"></script>
<script th:src="@{/vendors/datatables.net-buttons-bs/js/buttons.bootstrap.min.js}"></script>
<script th:src="@{/vendors/datatables.net-buttons/js/buttons.flash.min.js}"></script>

<script th:src="@{/vendors/datatables.net-fixedheader/js/dataTables.fixedHeader.min.js}"></script>
<script th:src="@{/vendors/datatables.net-keytable/js/dataTables.keyTable.min.js}"></script>
<script th:src="@{/vendors/datatables.net-responsive/js/dataTables.responsive.min.js}"></script>
<script th:src="@{/vendors/datatables.net-responsive-bs/js/responsive.bootstrap.js}"></script>
<script th:src="@{/vendors/datatables.net-scroller/js/dataTables.scroller.min.js}"></script>
<script th:src="@{/vendors/jszip/dist/jszip.min.js}"></script>
<script th:src="@{/vendors/pdfmake/build/pdfmake.min.js}"></script>
<script th:src="@{/vendors/pdfmake/build/vfs_fonts.js}"></script>
<!-- Select2 -->
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<!-- confirm -->

<script th:src="@{/vendors/ctx-datatables/buttons.html5.min.js}"></script>

<script th:src="@{/vendors/ctx-datatables/buttons.print.min.js}"></script>

<!-- Custom Theme Scripts -->
<script th:src="@{/build/js/custom.min.js}"></script>

<script th:src="@{/build/js/countx_item_recipe_form.js}"></script>

    $(".select2_single").select2({
        dropdownAutoWidth: true,

</body>
