    <link rel="stylesheet"
          th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">

    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

<body class="nav-sm">
<div class="container body">
    <div class="main_container">

        <!-- side bar and top navigation -->
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <!-- /side bar and top navigation -->

        <!-- page content -->
        <div class="right_col" role="main">
            <div class="">

                <div class="row">
                    <div class="col-md-12">
                        <ol class="breadcrumb">
                            <li><a href="../index">REPORTS</a></li>
                            <li>MILL RATES REPORT</li>
                        </ol>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 col-sm-12 col-xs-12">
                        <div class="x_panel">
                            <div class="x_title">
                                <h2>MILL RATES REPORT FILTER </h2>
                                <div class="clearfix"></div>
                            </div>
                            <div class="x_content">
                                <form action="#" class="form-horizontal form-label-left"
                                      id="gPReportForm" method="post"
                                      th:action="@{/stock/mill-rates-view}"
                                      th:object="${filterRequest}">

                                    <div class="row">

                                        <div class="col-md-4 col-sm-4 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">MILL</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control select2_single itemCategory"
                                                            required="required" th:field="*{millId}">
                                                        <option value="0">ALL</option>
                                                        <option th:each="mill : ${mills}"
                                                                th:if="${mills}"
                                                                th:text="${mill.accountName}"
                                                                th:value="${mill.id}">
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-4 col-sm-4 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">ITEM</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control select2_single itemDef"
                                                            th:field="*{itemDefId}">
                                                        <option value="0">ALL</option>
                                                        <th:block
                                                                th:each="itemSubCategory : ${itemSubCategories}">
                                                            <option
                                                                    th:each="itemDef : ${itemSubCategory.itemDefs}"
                                                                    th:text="${itemDef.formattedCode + '&emsp;' + itemDef.itemSubCategory.name + ' ' + itemDef.name}"
                                                                    th:value="${itemDef.id}">
                                                            </option>
                                                        </th:block>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-4 col-sm-4 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-4 col-sm-4 col-xs-12">FROM
                                                    DATE</label>
                                                <div class="col-md-8 col-sm-8 col-xs-12">
                                                    <input class="form-control" th:field="*{fromDate}"
                                                           type="date">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">

                                        <div class="col-md-12 col-sm-12 col-xs-12">
                                            <div class="form-group">
                                                <button class="btn btn-success" id="submitGLForm" style="float: right;"
                                                        type="submit">SEARCH
                                                </button>
                                                <button class="btn btn-success" id="downloadMillRate"
                                                        style="float: left;"
                                                        type="button">Download_Mill_Rate
                                                </button>
                                                <img id="loading" style="display:none; float: right;"
                                                     th:src="@{/build/images/pac_man.gif}"></img>
                                            </div>
                                        </div>

                                    </div>

                                </form>
                            </div>

                        </div>

                        <div class="x_panel">
                            <div class="x_title">
                                <h2>RATES ENTRIES LIST</h2>
                                <div class="clearfix"></div>
                            </div>
                            <div class="x_content">
                                <table class="table table-striped table-bordered" id="gl_report_datatable">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>DATE</th>
                                        <th>ITEM NAME</th>
                                        <th>MILL NAME</th>
                                        <th>RATE</th>
                                        <th>CASH RATE</th>
                                        <th>REMARKS</th>
                                        <th>ACTION</th>

                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>

                            </div>
                        </div>

                    </div>

                </div>
            </div>
            <!--Model entryEdit  - -->
            <div aria-hidden="true" aria-labelledby="myModalLabel" class="modal fade" id="editMillRateModel"
                 role="dialog"
                 style="float:left" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button aria-hidden="true" class="close" data-dismiss="modal" type="button">×</button>
                            <h4 class="modal-title">ADD/UPDATE MILL RATE ENTRY</h4>
                        </div>
                        <div class="modal-body">
                            <form class="form-horizontal" id="millRateForm"
                                  method="post"
                                  th:action="@{/stock/update-mill-rate-entry}"
                                  th:object="${millRate}">

                                <div class="form-group">


                                    <label class="col-lg-1 control-label">ITEM</label>
                                    <div class="col-lg-6">
                                        <!--<input th:field="${purchaseOrderEntry.itemDef}" type="hidden"/>-->
                                        <input th:field="${millRate.id}" type="hidden"/>

                                        <select class="form-control   asifselect2_single"
                                                th:field="${millRate.itemDef}">
                                            <option value="-1"></option>
                                            <th:block
                                                    th:each="itemSubCategory : ${itemSubCategories}">
                                                <option
                                                        th:each="itemDef : ${itemSubCategory.itemDefs}"
                                                        th:text="${itemDef.formattedCode + '&emsp;' + itemDef.itemSubCategory.name + ' ' + itemDef.name}"
                                                        th:value="${itemDef.id}">
                                                </option>
                                            </th:block>
                                        </select>
                                    </div>
                                    <label class="col-lg-3 control-label" id="salam" style="color:red">السلام
                                        عليكم</label>
                                </div>

                                <div class="form-group">
                                    <label class="col-lg-1 control-label">MILL </label>
                                    <div class="col-lg-11">
                                        <!-- <input th:field="${purchaseOrderEntry.millKhata.id}" type="hidden">-->
                                        <select class="form-control asifselect2_single millKhata"
                                                required="required"
                                                style="width:'100%'" th:field="${millRate.mill.id}">
                                            <option value="0">SELECTE MILL</option>
                                            <option
                                                    th:each="mill : ${mills}"
                                                    th:text="${mill.accountName}"
                                                    th:value="${mill.id}">
                                            </option>

                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">

                                    <label class="col-lg-3 control-label">RATE</label>
                                    <div class="col-lg-3">
                                        <input class="form-control" required="required"
                                               th:field="${millRate.rate}"
                                               type="number">
                                    </div>

                                    <label class="col-lg-3 control-label">CashRate</label>
                                    <div class="col-lg-3">
                                        <input class="form-control" required="required"
                                               th:field="${millRate.cashRate}"
                                               type="number">
                                    </div>
                                </div>
                                <div class="form-group">

                                    <label class="col-lg-3 control-label">Remarks</label>
                                    <div class="col-lg-3">
                                        <input class="form-control"
                                               th:field="${millRate.remarks}"
                                               type="text">
                                    </div>

                                    <label class="col-lg-3 control-label">Date</label>
                                    <div class="col-lg-3">
                                        <input class="form-control" required="required"
                                               th:field="${millRate.entryDate}"
                                               type="date">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="col-lg-offset-2 col-lg-10" style="float: center;">
                                        <button class="btn btn-default" data-dismiss="modal" style="float: right;"
                                                type="button">CANCEL
                                        </button>
                                        <button class="btn btn-success" id="saved" style="float: right;"
                                                type="submit">SAVE
                                        </button>
                                        <button class="btn btn-success" id="deleteEntry" style="float: left;"
                                                type="button">DELETE
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>


            </div>
            <!--END Model entryEdit  - -->
        </div>
        <!-- /page content -->

        <!-- footer content -->
        <footer>
            <div class="pull-right">
                Gentelella - Bootstrap Admin Template by <a
                    href="https://colorlib.com">Colorlib</a>
            </div>
            <div class="clearfix"></div>
        </footer>
        <!-- /footer content -->
    </div>
</div>

<script
        th:src="@{/vendors/datatables.net-buttons/js/dataTables.buttons.min.js}"></script>
<script

<script>


    $(".select2_single").select2({
        width: '100%',
    });
    $(".asifselect2_single").select2({
        width: '100%',
        dropdownParent: $("#editMillRateModel"),
    });
    $(".select2_single").select2({});
    $(".asifselect2_single").select2({
        width: '100%',
        dropdownParent: $("#editMillRateModel"),
    });

</script>
