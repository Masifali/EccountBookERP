            <form class="form-horizontal form-label-left" id="voucherFilterForm" th:action="@{/vouchers/voucher_list}" method="post">
                  	
	            <div class="row">
	              <div class="col-md-12 col-sm-12 col-xs-12">
	              	<div class="x_panel">
	                  <div class="x_title">
	                    <h2>VOUCHER FILTER</h2>
	                    <div class="clearfix"></div>
	                  </div>
	                  <div class="x_content">
	                  
	                  	<div class="col-md-12 col-sm-12 col-xs-12">
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12" th:text="#{company.label}"></label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" required id="voucher_company">
											<option value="0">ALL</option>
											<option th:each="company : ${companies}"
												th:value="${company.id}"
												th:text="${company.name}">
											</option>
										</select>
			                        </div>
			                    </div>
			                </div>
			                <div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">VOUCHER TYPE</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" id="voucher_type">
											<option value="0">ALL</option>
											<option th:each="voucherType : ${voucherTypes}"
												th:value="${voucherType.id}"
												th:text="${voucherType.name}">
											</option>
										</select>
			                        </div>
			                    </div>
			                </div>
						</div>
						
						<div class="col-md-12 col-sm-12 col-xs-12">
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">VOUCHER STATUS</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" id="voucher_status">
											<option value="0">BOTH</option>
											<option th:each="voucherStatus : ${voucherStatuses}"
												th:value="${voucherStatus.id}"
												th:text="${voucherStatus.name}">
											</option>
										</select>
			                        </div>
			                    </div>
			                </div>
			                <div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">NARRATION</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<input type="text" class="form-control" id="voucher_narration">
			                        </div>
			                    </div>
			                </div>
						</div>
						
						<div class="col-md-12 col-sm-12 col-xs-12">
							
							<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">VOUCHER NO.</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<input type="text" class="form-control" id="voucher_code">
			                        </div>
			                    </div>
			                </div>
			                
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">SEARCH BY DATE</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" id="search_by_date">
											<!-- <option value="0"></option> -->
											<option value="1">VOUCHER DATE</option>
											<option value="2">CREATED DATE</option>
											<option value="3">UPDATED DATE</option>
										</select>
			                        </div>
			                    </div>
			                </div>
						</div>
						
						<div class="col-md-12 col-sm-12 col-xs-12">			                
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">FROM DATE</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
			                        	<input class="form-control" type="date" id="from_date">
			                        </div>
			                    </div>
			                </div>
			                <div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">TO DATE</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
			                        	<input class="form-control" type="date" id="to_date">
			                        </div>
			                    </div>
			                </div>
						</div>
						
						<div class="col-md-12 col-sm-12 col-xs-12">
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12" th:text="#{voucher.posted_unposted}"></label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" required id="voucher_posted">
											<option value="2">BOTH</option>
											<option value="P">POSTED</option>
											<option value="U">UNPOSTED</option>
										</select>
			                        </div>
			                    </div>
			                </div>
			                <div class="col-md-6 col-sm-6 col-xs-12">
		                  		<!-- <div class="form-group">
			                        <label class="control-label col-md-3 col-sm-3 col-xs-12">INVENTORY VOUCHER</label>
			                        <div class="col-md-9 col-sm-9 col-xs-12">
										<select class="form-control" id="inventory_voucher_type">
											<option value="0">ALL</option>
											<option value="PJV">PURCHASE JOURNAL VOUCHER</option>
											<option value="PRV">PURCHASE RETURN VOUCHER</option>
											<option value="SJV">SALE JOURNAL VOUCHER</option>
											<option value="SRV">SALE RETURN VOUCHER</option>
											<option value="STV">STOCK TRANSFER VOUCHER</option>
										</select>
			                        </div>
			                    </div> -->
			                </div>
						</div>
						
						<div class="col-md-12 col-sm-12 col-xs-12">			                
	                  		<div class="col-md-6 col-sm-6 col-xs-12">
			                </div>
			                <div class="col-md-6 col-sm-6 col-xs-12">
		                  		<div class="form-group">
									<button type="submit" id="getVoucherList" class="btn btn-success" style="float: right;">SEARCH</button>
								</div>
			                </div>
						</div>
						
	                  </div>         
	                </div>
	                
	                <div class="x_panel">
	                  <div class="x_title">
	                    <h2>VOUCHER LIST</h2>
	                    <div class="clearfix"></div>
	                  </div>
	                  <div class="x_content">
	                    <table id="voucher_datatable" class="table table-striped table-bordered">
	                      <thead>
	                        <tr>
	                          <th>#</th>
	                          <th>VOUCHER NO.</th>
	                          <th>VOUCHER DATE</th>
	                          <th>CREATED AT</th>
	                          <th>UPDATED AT</th>
	                          <th>VOUCHER AMOUNT</th>
	                          <th>USERNAME</th>
	                          <th>P/U</th>
	                          <th>VIEW</th>
	                        </tr>
	                      </thead>
	
	                      <tbody>	                        
	                      </tbody>
	                      
	                      <tfoot>
	                        <tr>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                          <th></th>
	                        </tr>
	                      </tfoot>
	                      
	                    </table>
						
	                  </div>
	                </div>
	                
	              </div>
