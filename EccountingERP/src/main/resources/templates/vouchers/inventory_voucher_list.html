<body class="nav-sm">
<div class="container body">
    <div class="main_container">

        <!-- side bar and top navigation -->
        <div th:replace="fragments/fixed_sidebar :: div">
        </div>
        <!-- /side bar and top navigation -->

        <!-- page content -->
        <div class="right_col" role="main">
            <div class="">

                <div class="row">
                    <div class="col-md-12">
                        <ol class="breadcrumb">
                            <li><a href="../index">VOUCHERS</a></li>
                            <li>VOUCHER FILTER</li>
                        </ol>
                    </div>
                </div>

                <form class="form-horizontal form-label-left" id="voucherFilterForm"
                      method="post" th:action="@{/receivables/inventory_voucher_list}">

                    <div class="row">
                        <div class="col-md-12 col-sm-12 col-xs-12">
                            <div class="x_panel">
                                <div class="x_title">
                                    <h2>VOUCHER FILTER</h2>
                                    <div class="clearfix"></div>
                                </div>
                                <div class="x_content">

                                    <div class="col-md-12 col-sm-12 col-xs-12">
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12"
                                                       th:text="#{company.label}"></label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control" id="voucher_company" required>
                                                        <option value="0">ALL</option>
                                                        <option th:each="company : ${companies}"
                                                                th:text="${company.name}"
                                                                th:value="${company.id}">
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">BRANCH</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control" id="company_branch">
                                                        <option value="0">ALL</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-12 col-sm-12 col-xs-12">

                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">VOUCHER
                                                    NO.</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <input class="form-control" id="voucher_code" type="text">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">SEARCH BY
                                                    DATE</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control" id="search_by_date">
                                                        <!-- <option value="0"></option> -->
                                                        <option value="1">VOUCHER DATE</option>
                                                        <option value="2">CREATED DATE</option>
                                                        <option value="3">UPDATED DATE</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-12 col-sm-12 col-xs-12">
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">FROM
                                                    DATE</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <input class="form-control" id="from_date" type="date">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">TO DATE</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <input class="form-control" id="to_date" type="date">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-12 col-sm-12 col-xs-12">
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12"
                                                       th:text="#{voucher.posted_unposted}"></label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control" id="voucher_posted" required>
                                                        <option value="2">BOTH</option>
                                                        <option value="P">POSTED</option>
                                                        <option value="U">UNPOSTED</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label class="control-label col-md-3 col-sm-3 col-xs-12">INVENTORY
                                                    VOUCHER</label>
                                                <div class="col-md-9 col-sm-9 col-xs-12">
                                                    <select class="form-control" id="inventory_voucher_type">
                                                        <option th:each="inventoryVoucherType : ${inventoryVoucherTypes}"
                                                                th:text="${inventoryVoucherType[1]}"
                                                                th:value="${inventoryVoucherType[0]}">
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-12 col-sm-12 col-xs-12">
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                        </div>
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <button class="btn btn-success" id="getVoucherList"
                                                        style="float: right;"
                                                        type="submit">SEARCH
                                                </button>
                                                <a class="btn btn-success" data-id="56633" id="updateBookNumber"
                                                   style="float: left">
                                                    updateBookNumber</a>
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="x_panel">
                                <div class="x_title">
                                    <h2>VOUCHER LIST</h2>
                                    <div class="clearfix"></div>
                                </div>
                                <div class="x_content">
                                    <table class="table table-striped table-bordered" id="voucher_datatable">
                                        <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>PARY NAME (CLICK SHOW LEDGER)</th>
                                            <th>VOUCHER NO.</th>
                                            <th>VOUCHER DATE</th>

                                            <th>UPDATED AT</th>
                                            <th> AMOUNT</th>
                                            <th>USERNAME</th>
                                            <th>P/U</th>
                                            <th>ACTION</th>

                                        </tr>
                                        </thead>

                                        <tbody>
                                        </tbody>

                                        <tfoot>
                                        <tr>

                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                            <th></th>
                                        </tr>
                                        </tfoot>

                                    </table>

                                </div>
                            </div>

                        </div>
                    </div>

                </form>

            </div>
            <!-- /page content -->

            <!-- footer content -->
            <footer>
                <div class="pull-right">
                    Gentelella - Bootstrap Admin Template by <a href="https://colorlib.com">Colorlib</a>
                </div>
                <div class="clearfix"></div>
            </footer>
            <!-- /footer content -->
        </div>
    </div>
</div>
