<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>User Rights</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
    <style>
        .rights-table td, .rights-table th { text-align: center; }
        .rights-table td:first-child, .rights-table th:first-child { text-align: left; }
    </style>
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-key"></i> User Rights</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <p class="text-muted">
                                Pick a user, tick which screens/actions they may use, then Save. A user whose Role
                                code is ADMIN always has every right, regardless of what's set here (see
                                CustomUserDetailsService).
                            </p>
                            <form method="get" th:action="@{/user-management/rights}" class="form-inline" style="margin-bottom:15px;">
                                <label style="margin-right:8px;">User</label>
                                <select name="userId" class="form-control" onchange="this.form.submit()">
                                    <option value="">-- Select User --</option>
                                    <option th:each="u : ${users}" th:value="${u.id}" th:selected="${u.id.toString() == selUserId}"
                                            th:text="${u.userName} + ' (' + ${u.firstName} + ' ' + ${u.lastName} + ')'"></option>
                                </select>
                            </form>

                            <form th:if="${selUserId != ''}" th:action="@{/user-management/rights/save}" method="post">
                                <input type="hidden" name="userId" th:value="${selUserId}"/>
                                <table class="table table-striped table-bordered rights-table">
                                    <thead>
                                    <tr>
                                        <th>SCREEN</th>
                                        <th th:each="rt : ${rightTypes}" th:text="${rt.label}"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="s : ${screens}">
                                        <td th:text="${s.moduleDescription} + ' - ' + ${s.screenName}"></td>
                                        <td th:each="rt : ${rightTypes}">
                                            <input type="checkbox" name="grant" th:value="${s.id} + ':' + ${rt}"
                                                   th:checked="${grants.get(s.id + ':' + rt)}"/>
                                        </td>
                                    </tr>
                                    <tr th:if="${screens == null or screens.isEmpty()}">
                                        <td colspan="5" style="text-align:center; color:#9aa3ae; padding:30px;">No screens seeded yet.</td>
                                    </tr>
                                    </tbody>
                                </table>
                                <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save Rights</button>
                            </form>
                            <p th:if="${selUserId == ''}" class="text-muted" style="padding:20px 0;">Select a user above to edit their rights.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
