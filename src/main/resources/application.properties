# ---------------------------------------------------------------------------
# Login
# ---------------------------------------------------------------------------
# Authentication goes through the desktop's own dbo.Sp_UserAccount_Login
# (DesktopUserAccountBll.login), so every condition inside that procedure applies
# on the web too - not just the password.
#
# If the procedure itself FAILS (renamed, signature changed, database unreachable)
# the login is refused with "Login verification is unavailable" rather than quietly
# dropping back to comparing the password in Java, which would apply the password
# rule and nothing else.
#
# Set this to true ONLY as a temporary measure to get back into a running system;
# every use is logged as a warning. Put it back to false once the procedure works.
app.login.fallback-to-local=false

# =============================================================================
# Crystal printing - the desktop's own print format
# =============================================================================
# /api/reports/{key}/print.pdf hands the rows this app already fetches to the REAL
# Crystal engine running the REAL .rpt, so the PDF is the desktop's output: same
# fonts, bands, group totals and formula fields. Nothing is redrawn.
#
# The bridge is a .NET console program, so this only works on a Windows host with
# the SAP Crystal runtime installed. It is OFF by default: with it off the data
# endpoints still work and the page says printing is unavailable and why, instead
# of failing in an obscure way.
#
# The bridge opens NO database. It receives rows and parameters as JSON only.
#
# Before switching this on, run migration/report-contracts/05_ddl_and_seed_template_files.sql
# so template names resolve to real files under template-root.
reports.crystal.enabled=false
reports.crystal.bridge-exe=D:/CShapEccorErp/EccountingERP/migration/six-reports/CrystalReportBridge.exe
reports.crystal.template-root=D:/CShapEccorErp/EccountingERP/GoldenAceRice
reports.crystal.timeout-seconds=120
# Scratch directory for the request/response files; blank uses the JVM temp dir.
reports.crystal.work-dir=
