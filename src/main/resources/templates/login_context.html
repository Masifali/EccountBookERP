<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Company - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, sans-serif; background-color: #d4d0c8; font-size: 12px; color: #000; }
        .ctx-card { max-width: 460px; margin: 6% auto; background: #fff; border: 1px solid #999; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
        .ctx-head { background-color: #008080; color: #fff; padding: 8px 14px; font-family: Tahoma, sans-serif; font-size: 11pt; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .ctx-head small { font-weight: normal; font-size: 9pt; color: #d6f2f0; }
        .ctx-body { padding: 14px 16px 16px; }
        .ctx-label { font-size: 8.5pt; font-weight: 600; color: #222; margin-bottom: 2px; display: block; }
        .ctx-field { margin-bottom: 10px; }
        .ctx-select { font-family: Verdana, sans-serif; font-size: 9pt; height: 26px; width: 100%; border: 1px solid #7a9a9e; padding: 2px 4px; background: #fff; border-radius: 0; }
        .ctx-select:focus { border-color: #008080; outline: 1px solid #008080; }
        .ctx-btn { background-color: #008080; color: #fff; font-family: Verdana, sans-serif; font-size: 9pt; font-weight: bold; border: 1px solid #004d40; height: 28px; padding: 0 16px; cursor: pointer; border-radius: 2px; }
        .ctx-btn:hover { background-color: #005959; }
        .ctx-btn[disabled] { opacity: .6; cursor: progress; }
        .ctx-msg { background: #fff3cd; border: 1px solid #e6c200; color: #7a5c00; padding: 6px 9px; font-size: 8.5pt; margin-bottom: 10px; }
        .ctx-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .ctx-foot a { font-size: 8.5pt; color: #004d40; }
        .ctx-single { font-size: 8.5pt; color: #555; margin-top: 2px; }
    </style>
</head>
<body>

<div class="ctx-card">
    <div class="ctx-head">
        <span><i class="fa fa-building-o"></i> Select Company</span>
        <small th:text="${userName}">user</small>
    </div>

    <div class="ctx-body">
        <div class="ctx-msg" th:if="${message}" th:text="${message}"></div>

        <!-- Changing the company re-reads branch, financial year and application for it, the way
             the desktop rebinds those combos. It is a GET so a stale branch id cannot ride along. -->
        <form method="get" th:action="@{/login/context}" id="companyForm">
            <div class="ctx-field">
                <label class="ctx-label" for="companySelect">Company</label>
                <select class="ctx-select" id="companySelect" name="companyId"
                        onchange="document.getElementById('companyForm').submit();">
                    <option value="0" th:if="${#lists.size(companies) > 1}">-- Select Company --</option>
                    <option th:each="c : ${companies}"
                            th:value="${c['CompanyId']}"
                            th:text="${c['CompName']}"
                            th:selected="${c['CompanyId'] != null and #strings.toString(c['CompanyId']) == #strings.toString(selectedCompanyId)}">
                    </option>
                </select>
                <div class="ctx-single" th:if="${#lists.size(companies) == 1}">
                    Only one company is allocated to you.
                </div>
            </div>
        </form>

        <form method="post" th:action="@{/login/context}" id="contextForm">
            <input type="hidden" name="companyId" th:value="${selectedCompanyId}"/>

            <div class="ctx-field">
                <label class="ctx-label" for="branchSelect">Branch</label>
                <select class="ctx-select" id="branchSelect" name="branchId">
                    <option value="0" th:if="${#lists.size(branches) > 1}">-- Select Branch --</option>
                    <option th:each="b : ${branches}"
                            th:value="${b['BranchId']}"
                            th:text="${b['BranchName']}"></option>
                </select>
            </div>

            <div class="ctx-field" th:if="${not #lists.isEmpty(financialYears)}">
                <label class="ctx-label" for="yearSelect">Financial Year</label>
                <select class="ctx-select" id="yearSelect" name="financialYearId">
                    <option value="0" th:if="${#lists.size(financialYears) > 1}">-- Select Financial Year --</option>
                    <option th:each="y : ${financialYears}"
                            th:value="${y['Id']}"
                            th:text="${y['FinancialYearCode']}"></option>
                </select>
            </div>

            <div class="ctx-field" th:if="${not #lists.isEmpty(applications)}">
                <label class="ctx-label" for="appSelect">Application</label>
                <select class="ctx-select" id="appSelect" name="appId">
                    <option value="0" th:if="${#lists.size(applications) > 1}">-- Select Application --</option>
                    <option th:each="a : ${applications}"
                            th:value="${a['AppId']}"
                            th:text="${a['AppName']}"></option>
                </select>
            </div>

            <div class="ctx-foot">
                <a th:href="@{/logout}">Sign in as someone else</a>
                <!-- The desktop's button reads "Continue" at this point, not "Login". -->
                <button type="submit" class="ctx-btn" id="continueBtn">Continue</button>
            </div>
        </form>
    </div>
</div>

<script>
    /* Disable on submit so a double click cannot post the choice twice. */
    document.getElementById('contextForm').addEventListener('submit', function () {
        var b = document.getElementById('continueBtn');
        b.disabled = true;
        b.textContent = 'Please wait...';
    });
</script>
</body>
</html>
