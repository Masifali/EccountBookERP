<!-- InvfrmAddTaxType.cs (Architecture.WinApp.Taxation), screen 178 "Add Tax Type" - ClientSize 964 x 661.
     panel4 (33, Top): toolStrip1 New / Refresh / Update(hidden) / Save.
     panel5 (29, Top, Teal): label1 "Add Tax Type".
     panel3 (66, Top, White): Name txtName (14,31) 220x23; Type cmbType (238,29) 220 (fixed rows 1 WithHoldingTax,
       2 SalesTax, first active); Gl Account cmbaccount (461,29) 330 (COAAllocation minus AccountTypeId 2/11/15).
     panel2 (Fill): panel6 (Teal) "History" + ctrlGrdBar1, then GridAddTaxType: Id (hidden), TaxName, AccountTitle. -->
<body class="pd-body" data-tax-page="tax-type">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:964px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="TaxPage.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" accesskey="r" onclick="TaxPage.btnrefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="TaxPage.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="TaxPage.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Add Tax Type</div>
    <div class="tx-entry">
        <div class="tx-field tx-w220"><label for="txtName">Name</label><input type="text" id="txtName" class="win-textbox" autocomplete="off" maxlength="100"/></div>
        <div class="tx-field tx-w220"><label for="cmbType">Type</label>
            <select id="cmbType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="TaxType"></select></div>
        <div class="tx-field tx-w330"><label for="cmbaccount">Gl Account</label>
            <select id="cmbaccount" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Title"></select></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>History</span><span id="gridBarMount" class="pd-gridbar-mount"></span></div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="GridAddTaxType" data-gridbar="InvfrmAddTaxType:GridAddTaxType" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="TaxName">TaxName</th><th data-col="AccountTitle">AccountTitle</th></tr></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_tax_define.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridheader}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
