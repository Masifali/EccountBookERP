<!-- frmSupplierCustomerExemptionSchedule.cs (Architecture.WinApp.Taxation), screen 173 "Supplier Customer Tax Exemption" -
     ClientSize 1023 x 609.
     panel2 (25, Top): tsItemType New / Refresh / Save / Update(hidden).
     panel3 (94, Top): panel5 (31, Teal) label6 "Supplier Customer Exemption Schedule"; FromDate (9,61) 120 short date;
       To Date (132,61) 120; Supplier / Customer SupplierCustomerId (255,59) 285 (SupplierCustomer.Getall -> Id, CompanyName);
       Tax Type TaxTypeId (542,59) 220 (TaxesTypes.Getall -> Id, TaxName); Tax % TaxPrcnt (764,61) 114 (decimal only).
     panel1 (Fill): panel6 (Teal) "History" + ctrlGrdBar1, then grdfrm: Id, SupplierCustomerId, TaxTypeId hidden;
       FromDate, ToDate, CompanyName, TaxName, TaxPrcnt shown. -->
<body class="pd-body" data-tax-page="exemption">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:1023px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="TaxPage.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" accesskey="r" onclick="TaxPage.btnrefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="TaxPage.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="TaxPage.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Supplier Customer Exemption Schedule</div>
    <div class="tx-entry">
        <div class="tx-field tx-w120"><label for="FromDate">FromDate</label><input type="date" id="FromDate" class="win-date"/></div>
        <div class="tx-field tx-w120"><label for="ToDate">To Date</label><input type="date" id="ToDate" class="win-date"/></div>
        <div class="tx-field tx-w285"><label for="SupplierCustomerId">Supplier / Customer</label>
            <select id="SupplierCustomerId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
        <div class="tx-field tx-w220"><label for="TaxTypeId">Tax Type</label>
            <select id="TaxTypeId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Tax Name"></select></div>
        <div class="tx-field tx-w114"><label for="TaxPrcnt">Tax %</label><input type="text" id="TaxPrcnt" class="win-textbox" data-guard="decimal" autocomplete="off"/></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>History</span><span id="gridBarMount" class="pd-gridbar-mount"></span></div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="grdfrm" data-gridbar="frmSupplierCustomerExemptionSchedule:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr>
                    <th data-col="Id" style="display:none;">Id</th><th data-col="FromDate">FromDate</th><th data-col="ToDate">ToDate</th>
                    <th data-col="SupplierCustomerId" style="display:none;">SupplierCustomerId</th><th data-col="CompanyName">CompanyName</th>
                    <th data-col="TaxTypeId" style="display:none;">TaxTypeId</th><th data-col="TaxName">TaxName</th><th data-col="TaxPrcnt">TaxPrcnt</th>
                </tr></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_tax_define.js?v=20260929a}"></script>

<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
