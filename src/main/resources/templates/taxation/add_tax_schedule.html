<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Tax Schedule - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_tax_define.css?v=20260929a}"/>
</head>
<!-- InvfrmAddTaxSchedule.cs (Architecture.WinApp.Taxation), screen 177 "Add Tax Schedule" - ClientSize 964 x 661.
     panel1 (Top): toolStrip1 New / Update(hidden) / Save; miniToolStrip "Tax Mapping With Business type" (opens
       frmTaxTypeAndBusinessTypeMapping - not ported). label1 "Add Tax Schedule".
     tabControl1 (Fill) tab "Form": panel2 (62, White): Effected Date dtpEffectedDate (13,33) 149 dd-MMM-yyyy;
       Tax Type cmbTaxType (166,33) 186 (TaxesTypes.Getall -> Id, TaxDescription); Tax Percent txtTaxPercent (355,33) 91
       (decimal only); ChkBoxIsActive "Is Active" (452,34) checked on load.
     panel3 (31, Teal) "History" + ctrlGrdBar1, then HistoryGrd (read-only): Id (hidden), TaxName, EffectedDate dd-MMM-yy, TaxPercent. -->
<body class="pd-body" data-tax-page="tax-schedule">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:964px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="TaxPage.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="TaxPage.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="TaxPage.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnDefineBusinessType" class="win-btn-tool" onclick="TaxPage.btnBusinessType()"><span>Tax Mapping With Business type</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Add Tax Schedule</div>
    <div class="tx-entry">
        <div class="tx-field tx-w149"><label for="dtpEffectedDate">Effected Date</label><input type="date" id="dtpEffectedDate" class="win-date"/></div>
        <div class="tx-field tx-w186"><label for="cmbTaxType">Tax Type</label>
            <select id="cmbTaxType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="TaxDescription"></select></div>
        <div class="tx-field tx-w91"><label for="txtTaxPercent">Tax Percent</label><input type="text" id="txtTaxPercent" class="win-textbox" data-guard="decimal" autocomplete="off"/></div>
        <div class="tx-field"><label>&nbsp;</label><label class="tx-check" for="ChkBoxIsActive"><input type="checkbox" id="ChkBoxIsActive" checked/> Is Active</label></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>History</span><span id="gridBarMount" class="pd-gridbar-mount"></span></div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="HistoryGrd" data-gridbar="InvfrmAddTaxSchedule:HistoryGrd" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="TaxName">TaxName</th><th data-col="EffectedDate">EffectedDate</th><th data-col="TaxPercent">TaxPercent</th></tr></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_tax_define.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
