<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Items Allocation To Tax Item - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_tax_define.css?v=20260930a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- RegularItemsAllocateToTaxItem.cs (Architecture.WinApp.Tax_Definition), screen 179 - ClientSize 802 x 586.
     panel2 (25, Top): tsItemType Refresh. panel6 (32, Teal): label15 "Items Allocation To Tax Item".
     panel7 (63, Top, White): Item Category CmbItemCategory (104,4) 230; Item Type CmbItemType (104,32) 230;
       "Tax Item *" CmbTaxableItem (409,4) 253 (Item.ReadAllItemsTaxable); Show btnshow (601,32) 61x26.
     panel3 (Left 400): "Pending Items For Allocation" + BtnAllocateItems (371,3) 25x25 -> GridUnAllocatedItems (Select, ItemName 340).
     panel4 (Left 400): "Allocated Items" + btnDeAllocate (371,3) 25x25 -> GridAllocatedItems (Select, ItemName 340). -->
<body class="pd-body" data-tax-page="allocation">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:802px;">
    <div class="win-tool-strip">
        <button type="button" id="btnRefresh" class="win-btn-tool" accesskey="r" onclick="TaxPage.refresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Items Allocation To Tax Item</div>
    <div class="tx-entry tx-alloc-entry">
        <div class="tx-col">
            <div class="tx-field tx-w230"><label for="CmbItemCategory">Item Category</label>
                <select id="CmbItemCategory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Category"></select></div>
            <div class="tx-field tx-w230"><label for="CmbItemType">Item Type</label>
                <select id="CmbItemType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Type"></select></div>
        </div>
        <div class="tx-col">
            <div class="tx-field tx-w253"><label for="CmbTaxableItem">Tax Item <span class="tx-req">*</span></label>
                <select id="CmbTaxableItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
            <div class="tx-field"><label>&nbsp;</label><button type="button" id="btnshow" class="win-btn-action tx-w61" onclick="TaxPage.show(this)">Show</button></div>
        </div>
    </div>
    <div class="tx-two-grids">
        <div class="tx-grid-panel">
            <div class="pd-caption pd-caption-teal tx-grid-caption"><span>Pending Items For Allocation</span>
                <button type="button" id="BtnAllocateItems" class="win-btn-icon" title="Allocate checked items (Ctrl+A)" onclick="TaxPage.allocate(this)"><i class="fa fa-arrow-right"></i></button></div>
            <div class="win-grid-scroll tx-grid-scroll">
                <table class="win-grid" id="GridUnAllocatedItems">
                    <thead><tr><th class="sel"><input type="checkbox" id="unallocAll" aria-label="Select all"></th><th style="display:none;">ItemId</th><th>ItemName</th></tr></thead>
                    <tbody id="unallocBody"></tbody>
                </table>
            </div>
        </div>
        <div class="tx-grid-panel">
            <div class="pd-caption pd-caption-teal tx-grid-caption"><span>Allocated Items</span>
                <button type="button" id="btnDeAllocate" class="win-btn-icon" title="Un-allocate checked items (Ctrl+D)" onclick="TaxPage.deallocate(this)"><i class="fa fa-arrow-left"></i></button></div>
            <div class="win-grid-scroll tx-grid-scroll">
                <table class="win-grid" id="GridAllocatedItems">
                    <thead><tr><th class="sel"><input type="checkbox" id="allocAll" aria-label="Select all"></th><th style="display:none;">ItemId</th><th>ItemName</th></tr></thead>
                    <tbody id="allocBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_tax_screens.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
