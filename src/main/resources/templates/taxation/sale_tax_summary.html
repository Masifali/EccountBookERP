<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Sale Tax Summary - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_tax_define.css?v=20260930a}"/>
</head>
<!-- frmSaleTaxSummaryRpt.cs (Architecture.WinApp.Taxation), screen 175 - ClientSize 1238 x 655.
     panel2 (25, Top): tsItemType New / Print (no click handler on the desktop).
     panel3 (85, Top): panel9 (29, Teal) "Sale Tax Summary"; Date From (13,51) 185 short date; Date To (203,51) 185; Show (394,50) 64x25.
     panel4 (Fill): panel7 (Left 615) "Input History" + InputCtrlBar -> gridInput; panel10 (Fill) "Output History" + OutputCtrlBar -> gridOutput.
       Both grids: TaxTypes, TaxNotesHeading, DebitAmount, CreditAmount, Amount (sum, right, stringFormatsingle).
     Sp_Accounts_GenerateSalesTaxSummery_Rpt is called once per grid on the desktop; the page calls it once and splits on TaxTypeInOut. -->
<body class="pd-body" data-tax-page="sale-tax-summary">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:1238px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="TaxPage.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" disabled title="No Print event is connected in the desktop source"><i class="fa fa-print"></i></button>
    </div>
    <div class="pd-caption pd-caption-teal">Sale Tax Summary</div>
    <div class="tx-entry">
        <div class="tx-field tx-w185"><label for="DateFrom">Date From</label><input type="date" id="DateFrom" class="win-date"/></div>
        <div class="tx-field tx-w185"><label for="DateTo">Date To</label><input type="date" id="DateTo" class="win-date"/></div>
        <div class="tx-field"><label>&nbsp;</label><button type="button" id="btnShow" class="win-btn-action tx-w64" onclick="TaxPage.show(this)">Show</button></div>
    </div>
    <div class="tx-two-grids">
        <div class="tx-grid-panel">
            <div class="pd-caption pd-caption-teal tx-grid-caption"><span>Input History</span><span id="inputBarMount" class="pd-gridbar-mount"></span></div>
            <div class="win-grid-scroll tx-grid-scroll">
                <table class="win-grid" id="gridInput" data-gridbar="frmSaleTaxSummaryRpt:gridInput" data-gridbar-mount="#inputBarMount" data-gridbar-reorder="false">
                    <thead><tr><th>TaxTypes</th><th>TaxNotesHeading</th><th class="num">DebitAmount</th><th class="num">CreditAmount</th><th class="num">Amount</th></tr></thead>
                    <tbody id="inputBody"></tbody>
                    <tfoot><tr id="inputFoot" class="pd-total-row"></tr></tfoot>
                </table>
            </div>
        </div>
        <div class="tx-grid-panel">
            <div class="pd-caption pd-caption-teal tx-grid-caption"><span>Output History</span><span id="outputBarMount" class="pd-gridbar-mount"></span></div>
            <div class="win-grid-scroll tx-grid-scroll">
                <table class="win-grid" id="gridOutput" data-gridbar="frmSaleTaxSummaryRpt:gridOutput" data-gridbar-mount="#outputBarMount" data-gridbar-reorder="false">
                    <thead><tr><th>TaxTypes</th><th>TaxNotesHeading</th><th class="num">DebitAmount</th><th class="num">CreditAmount</th><th class="num">Amount</th></tr></thead>
                    <tbody id="outputBody"></tbody>
                    <tfoot><tr id="outputFoot" class="pd-total-row"></tr></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_tax_screens.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
