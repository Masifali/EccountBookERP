<!-- frmTaxNotesAndGLMaping.cs (Architecture.WinApp.Taxation), screen 172 "Tax Notes and GL Maping" - ClientSize 619 x 554.

<body class="pd-body" data-tax-page="gl-maping">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:619px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="TaxPage.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" accesskey="r" onclick="TaxPage.btnrefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="TaxPage.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="TaxPage.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnTaxNotes" class="win-btn-tool" onclick="TaxPage.btnTaxNotes()"><span>TaxesNotes</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Tax Notes And GL Maping</div>
    <div class="tx-entry">
        <div class="tx-field tx-w200"><label for="TaxLookUpsId">Sale Tax Notes</label>
            <select id="TaxLookUpsId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="LookUp Name"></select></div>
        <div class="tx-field tx-w200"><label for="LookUpsTaxInOutId">Input / Output</label>
            <select id="LookUpsTaxInOutId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="LookUpName"></select></div>
        <div class="tx-field tx-w200"><label for="GLAccountId">GLAccount</label>
            <select id="GLAccountId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Title"></select></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>History</span><span id="gridBarMount" class="pd-gridbar-mount"></span></div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="grdfrm" data-gridbar="frmTaxNotesAndGLMaping:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr>
                    <th data-col="Id" style="display:none;">Id</th><th data-col="TaxLookUpsId" style="display:none;">TaxLookUpsId</th>
                    <th data-col="LookUpsTaxInOutId" style="display:none;">LookUpsTaxInOutId</th><th data-col="GLAccountId" style="display:none;">GLAccountId</th>
                    <th data-col="SortNo">SortNo</th><th data-col="EntryDate">EntryDate</th><th data-col="EntryUserId" style="display:none;">EntryUserId</th>
                    <th data-col="ModifyUserId">ModifyUserId</th><th data-col="ModifyDate">ModifyDate</th><th data-col="saletaxnotes">saletaxnotes</th>
                    <th data-col="inputoutput">inputoutput</th><th data-col="AccountTitle">AccountTitle</th>
                </tr></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
    </div>
