<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Fixed Asset Purchase - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_fixedassets.css?v=20260930a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.Account_Definition.frmFixedAssetPurchase (918) - base.Name "frmFixedAssetPurchase", DocumentTypeId 130,
     ClientSize 1166 x 711. tabControl1 (Bottom): tabPage1 "Form" | tabPage2 "History".
     Form: panel2 toolStrip1 New | Refresh | Save | SaveAs (hidden) | Update (hidden) | Delete (hidden) | Attachments | 102-Print |
       102_01-Print | Accounts Allocate To Custom | ShortCut Keys; label3 "Fixed Asset Purchase / Opening", Location Type,
       Custom Accounts, Preview (checked).
       groupBox1 "Main": Cost Center, Doc No (ReadOnly), Doc Date (dd-MMM-yyyy), Remarks | Entry Type, Bill No, Bill Date |
       Account Type, Account Title (Cr), Account Balance (ReadOnly) + Dr/Cr, Subsidiary A/C | Fcy Code, Exchange Rate, Fcy Amount.
       groupBox2 "Detail" (flowLayoutPanel1): Custom Group, Account (Dr) + Note Title + balance, Subsidiary Account, Job/Lot,
       Bill/Invoice #, Qty, Rate, Amount, Fcy Amount, Reference Account, Remarks, + | Update | Cancel.
       grd (AccId, SubsidiaryAccountId, SubsidiaryAccountTypeId, JobLotId, ReferenceAccountId hidden; Qty/Amount totals; X).
       panel19: "Amount Distribution" grdSchedule (DueDays, DueDate, Due%, Amount, X, +) | Voucher Amount, Sales Tax Type + %,
       Sales Tax Account, Sales Tax Amount, Advance Tax Account / Amount, Other Charges Account / Amount, Total Amount.
     History: toolStrip3 Reset | Refresh (| LoadAll hidden); label35 "Bills Payables History"; groupBox3 "Filters": From / To Date
       (ShowCheckBox), From Doc, To Doc, Account Title (Cr), Approved Status, Show, Doc / Entry / Modify / Approved Date;
       VoucherInfoBox; DataGridHistory (Print, PrintII, Edit, SaveAs, V.Type first); grdDetailHistory "Detail of above selected row". -->
<body class="pd-body hrm-body" data-fa="fixed-asset-purchase" data-screen="918">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="fa-tabs">
        <button type="button" class="hrm-tab is-active" data-fa-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-fa-tab="history">History</button>
    </div>

    <!-- ===================================================================== Form -->
    <div class="fa-page is-active" data-fa-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnnew" class="win-btn-tool" onclick="FaPur.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="FaPur.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="FaPur.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnSaveAs" class="win-btn-tool is-hidden" onclick="FaPur.btnSaveAs(this)"><i class="fa fa-files-o"></i> <span><u>S</u>aveAs</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="FaPur.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" disabled title="Attachments are not available on this page: the desktop copies the files to the configured Attachment Folder Path on the client's share."><i class="fa fa-paperclip"></i> <span>Attachments</span></button>
            <button type="button" id="Print" class="win-btn-tool" onclick="FaPur.Print(this)"><i class="fa fa-print"></i> <span>102-Print</span></button>
            <button type="button" id="BtnPrintII" class="win-btn-tool" onclick="FaPur.BtnPrintII(this)"><i class="fa fa-print"></i> <span>102_01-Print</span></button>
            <button type="button" id="BtnLookup" class="win-btn-tool" disabled title="frmAccountsAllocateToCustomAccountGroupByDocumentType has no web page."><i class="fa fa-list"></i> <span>Accounts Allocate To Custom</span></button>
            <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="FaPur.btnShortCutKey()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span>Fixed Asset Purchase / Opening</span></div>
        <div class="hrm-entry hrm-cols-3" style="padding-bottom:0">
            <div class="hrm-field"><label for="cmbLocationType">Location Type</label><select id="cmbLocationType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="chkCustomAccounts"/> Custom Accounts</label></div>
            <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="CHKPREVIEW" checked/> Preview</label></div>
        </div>
        <fieldset class="hrm-group">
            <legend>Main</legend>
            <div class="hrm-entry hrm-cols-4" style="padding:4px 0;align-items:start">
                <div class="hrm-field"><label for="CmbProjectId">Cost Center</label><select id="CmbProjectId" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="CmbEntryType">Entry Type</label><select id="CmbEntryType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="CmbAccountType">Account Type</label><select id="CmbAccountType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="cmbCurrency">Fcy Code</label><select id="cmbCurrency" class="win-combo dtcombo" data-dtcombo="single"></select></div>

                <div class="hrm-field"><label for="txtDocNo">Doc No</label><input type="text" id="txtDocNo" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="txtInvoiceNo">Bill No</label><input type="text" id="txtInvoiceNo" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="cmbAccount">Account Title (Cr)</label><select id="cmbAccount" class="win-combo dtcombo" data-columns="Credit Account|AccountCode|NoteTitle"></select></div>
                <div class="hrm-field"><label for="txtExchangeRate">Exchange Rate</label><input type="text" id="txtExchangeRate" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>

                <div class="hrm-field"><label for="txtDocDate">Doc Date</label><input type="date" id="txtDocDate" class="win-textbox"/></div>
                <div class="hrm-field"><label for="txtInvoiceDate">Bill Date</label><input type="date" id="txtInvoiceDate" class="win-textbox"/></div>
                <div class="hrm-field"><label for="lblCreditAcBalance">Account Balance</label>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><input type="text" id="lblCreditAcBalance" class="win-textbox hrm-grow" readonly tabindex="-1" value="0"/><span id="lblDrCrS" class="fa-bal"></span></div></div>
                <div class="hrm-field"><label for="txtFcyAmount">Fcy Amount</label><input type="text" id="txtFcyAmount" class="win-textbox hrm-al-right" disabled/></div>

                <div class="hrm-field hrm-span-2"><label for="txtRemarks">Remarks</label><textarea id="txtRemarks" class="win-textbox" rows="2"></textarea></div>
                <div class="hrm-field" id="rowSubsidiaryCr"><label for="CmbSubsidiaryAccountCr" id="lblSubsidiaryaccountCr">Subsidiary A/C</label><select id="CmbSubsidiaryAccountCr" class="win-combo dtcombo" data-columns="Account Title|SubsidiaryType|Code"></select></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group">
            <legend>Detail</legend>
            <div class="fa-detail">
                <div class="hrm-field"><label for="CmbCustomGroup">Custom Group</label><select id="CmbCustomGroup" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field fa-wide" id="PanelAccountTitleDetail"><label for="cmbAccountDetail">Account (Dr) <span id="label29" class="fa-bal"></span> <span id="lblbalancedetail" class="fa-bal"></span> <span id="lbldetaildrcr" class="fa-bal"></span></label>
                    <select id="cmbAccountDetail" class="win-combo dtcombo" data-columns="Account Title|AccountCode|AccountType|NoteTitle"></select></div>
                <div class="hrm-field fa-wide" id="PanelSubsidiaryDetail"><label for="CmbSubsidiaryAccount" id="lblSubsidiaryaccount">Subsidiary Account</label><select id="CmbSubsidiaryAccount" class="win-combo dtcombo" data-columns="Account Title|SubsidiaryType|Code"></select></div>
                <div class="hrm-field"><label for="cmbJobLotFile">Job/Lot</label><select id="cmbJobLotFile" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="txtInvoiceNoDetail">Bill/Invoice #</label><input type="text" id="txtInvoiceNoDetail" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtQtyDetial">Qty</label><input type="text" id="txtQtyDetial" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" value="0" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtRateDetail">Rate</label><input type="text" id="txtRateDetail" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" value="0" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtAmountDetail">Amount</label><input type="text" id="txtAmountDetail" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtFcyAmountDetail">Fcy Amount</label><input type="text" id="txtFcyAmountDetail" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field fa-wide"><label for="CmbReferenceAccount">Reference Account</label><select id="CmbReferenceAccount" class="win-combo dtcombo" data-columns="Reference Account|AccountCode|NoteTitle"></select></div>
                <div class="hrm-field fa-wide"><label for="txtRemarksDetail">Remarks</label><input type="text" id="txtRemarksDetail" class="win-textbox" autocomplete="off"/></div>
                <div class="fa-btns">
                    <button type="button" id="btnAdd" class="win-btn-action" title="Add" onclick="FaPur.btnAdd()">+</button>
                    <button type="button" id="btnUpdateDetail" class="win-btn-action is-hidden" onclick="FaPur.btnUpdateDetail()">Update</button>
                    <button type="button" id="btnCancelDetail" class="win-btn-action is-hidden" onclick="FaPur.btnCancelDetail()">Cancel</button>
                </div>
            </div>
        </fieldset>
        <div class="hrm-grid-box hrm-grid-short" id="boxDetail">
            <div class="hrm-subcaption"><span>Detail Grid</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="FixedAssetPurchase:grd" id="grd"></table></div>
        </div>
        <div class="fa-bottom">
            <div class="hrm-grid-box hrm-grid-short" style="min-height:160px">
                <div class="hrm-subcaption"><span>Amount Distribution</span></div>
                <div class="hrm-grid-wrap"><table data-gridbar="FixedAssetPurchase:grdSchedule" id="grdSchedule"></table></div>
            </div>
            <div class="fa-totals">
                <label for="txtVoucherAmountFooter">Voucher Amount</label><input type="text" id="txtVoucherAmountFooter" class="win-textbox hrm-al-right" disabled/><span></span>
                <label for="CmbTaxType">Sales Tax Type</label><select id="CmbTaxType" class="win-combo dtcombo" data-dtcombo="single"></select>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><input type="text" id="txtTaxPercent" class="win-textbox hrm-al-right hrm-grow" disabled aria-label="Tax percent"/><span>%</span></div>
                <label for="CmbTaxAccount">Sales Tax Account</label><select id="CmbTaxAccount" class="win-combo dtcombo" data-columns="Sales Tax Account|AccountCode|NoteTitle"></select><span></span>
                <label for="txtTaxAmount">Sales Tax Amount</label><input type="text" id="txtTaxAmount" class="win-textbox hrm-al-right" disabled/><span></span>
                <label for="CmbAdvanceTaxAccount">Advance Tax Account</label><select id="CmbAdvanceTaxAccount" class="win-combo dtcombo" data-columns="Advance Tax Account|AccountCode|NoteTitle"></select><span></span>
                <label for="txtAdvanceTaxAmount">Advance Tax Amount</label><input type="text" id="txtAdvanceTaxAmount" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/><span></span>
                <label for="CmbOtherChargesAccount">Other Charges Account</label><select id="CmbOtherChargesAccount" class="win-combo dtcombo" data-columns="Other Charges|AccountCode|AccountType|NoteTitle"></select><span></span>
                <label for="txtOtherChargesAmount">Other Charges Amount</label><input type="text" id="txtOtherChargesAmount" class="win-textbox hrm-al-right" data-guard="decimalMinus" inputmode="decimal" autocomplete="off"/><span></span>
                <label for="txtTotalAmount">Total Amount</label><input type="text" id="txtTotalAmount" class="win-textbox hrm-al-right" disabled/><span></span>
            </div>
        </div>
    </div>

    <!-- ===================================================================== History -->
    <div class="fa-page" data-fa-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="FaPur.btnNewHistory()"><i class="fa fa-eraser"></i> <span><u>R</u>eset</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="FaPur.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="hrm-caption">Bills Payables History</div>
        <div class="hrm-entry hrm-cols-2" style="align-items:start">
            <fieldset class="hrm-group" style="margin:0">
                <legend>Filters</legend>
                <div class="hrm-entry hrm-cols-2" style="padding:4px 0">
                    <div class="hrm-field"><label for="FromDateHistory">From Date</label>
                        <div class="fa-datechk"><input type="checkbox" id="chkFromDateHistory" checked aria-label="From Date on"/><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                    <div class="hrm-field"><label for="ToDateHistory">To Date</label>
                        <div class="fa-datechk"><input type="checkbox" id="chkToDateHistory" checked aria-label="To Date on"/><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                    <div class="hrm-field"><label for="txtFromDocNoHistory">From Doc</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
                    <div class="hrm-field"><label for="txtToDocNoHistory">To Doc</label><input type="text" id="txtToDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
                    <div class="hrm-field"><label for="CmbAccountTitleHistory">Account Title (Cr)</label><select id="CmbAccountTitleHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="cmbApproveStatus">Approved Status</label><select id="cmbApproveStatus" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field hrm-span-2"><label>Date</label>
                        <div class="hrm-inline">
                            <label class="hrm-check"><input type="radio" name="rdHistory" id="rdexpdocdate" checked/> Doc Date</label>
                            <label class="hrm-check"><input type="radio" name="rdHistory" id="rdexpentry"/> Entry Date</label>
                            <label class="hrm-check"><input type="radio" name="rdHistory" id="rdexpmodify"/> Modify Date</label>
                            <label class="hrm-check"><input type="radio" name="rdHistory" id="rdexpapproved"/> Approved Date</label>
                            <button type="button" id="btnShowHistory" class="win-btn-action" style="width:auto;min-width:71px" onclick="FaPur.btnShowHistory(this)">Show</button>
                        </div></div>
                </div>
            </fieldset>
            <div class="fa-info is-hidden" id="VoucherInfoBox" style="align-self:start;margin-top:8px">
                <span>Total Vouchers</span><b id="lblTotalVouchers">0</b>
                <span>Approved Vouchers</span><b id="lblApprovedVouchers">0</b>
                <span>UnApproved Vouchers</span><b id="lblUnApprovedVouchers">0</b>
            </div>
        </div>
        <div class="hrm-grid-box" id="boxHistory">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="FixedAssetPurchase:DataGridHistory" id="DataGridHistory"></table></div>
        </div>
        <div class="hrm-grid-box hrm-grid-short" id="boxDetailHistory">
            <div class="hrm-subcaption"><span>Detail of above selected row</span></div>
            <div class="hrm-grid-wrap"><table data-gridbar="FixedAssetPurchase:grdDetailHistory" id="grdDetailHistory"></table></div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_fixedassets_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_fixedassets_purchase.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
