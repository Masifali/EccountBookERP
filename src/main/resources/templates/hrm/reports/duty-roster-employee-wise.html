<!-- Architecture.WinApp.HRM_Reports.genDutyRosterEmployeeWise - ClientSize 955 x 450.
     toolStrip3: &Refresh | &1114-Print.  panel3 (28): "Duty Roaster Employee Wise".
     panel4 groupBox1 "Filters" (944 x 52): Date (47,21) DateTimePicker "MMM" 201 (its month and year are sent) | Employee (317,19) 291 | Show (613,19).
     panel5 ctrlGrdBar1; grd GridEX (Fill, filter row, total row). -->
<body class="pd-body hrm-body" data-hrm="duty-roster-employee-wise" data-screen="375">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="print" class="win-btn-tool" onclick="HrmReports.print(this)" data-rpt-own data-rpt="1114-DutyRosterEmployeeWise.rpt"><i class="fa fa-print"></i> <span>1114-Print</span></button>
    </div>
    <div class="hrm-caption">Duty Roaster Employee Wise</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-4">
            <div class="hrm-field"><label for="txtMonth">Date (Month)</label><select id="txtMonth" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtYear">Year</label><input type="number" id="txtYear" class="win-textbox" min="1900" max="2100" step="1"/></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnshow" class="win-btn-action" onclick="HrmReports.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'genDutyRosterEmployeeWise')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>

<script src="/js/print-rpt.js?v=20261001a"></script>
