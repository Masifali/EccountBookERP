<!-- Architecture.WinApp.HRM_Reports.genEmployeeAttendence - ClientSize 964 x 617.
     toolStrip3: &Refresh | 1004-Print | 1005-Print Summary (empty handler).  panel2: "Employee Attendance".
     panel3 groupBox1 "Filters" (944 x 80): From Date (75,18) dd-MMM-yyyy | Department (357,16) 291 /
     To Date (75,48) | Employee (357,46) 291 | Show (653,46).  panel1 ctrlGrdBar1; grd GridEX grouped by DepartmentName, EmployeeName. -->
<body class="pd-body hrm-body" data-hrm="employee-attendence" data-screen="376">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="print" class="win-btn-tool" onclick="HrmReports.print(this)" data-rpt-own data-rpt="1004-EmployeeAttendance.rpt"><i class="fa fa-print"></i> <span>1004-Print</span></button>
        <button type="button" id="btnSummaryPrint" class="win-btn-tool" onclick="HrmReports.btnSummaryPrint(this)"><i class="fa fa-print"></i> <span>1005-Print Summary</span></button>
    </div>
    <div class="hrm-caption">Employee Attendance</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-2">
            <div class="hrm-field"><label for="txtFromDate">From Date</label><input type="date" id="txtFromDate" class="win-textbox"/></div>
            <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDateTo">To Date</label><input type="date" id="txtDateTo" class="win-textbox"/></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnshow" class="win-btn-action" onclick="HrmReports.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'genEmployeeAttendence')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>

<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
