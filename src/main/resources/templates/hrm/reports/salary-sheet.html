<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Salary Sheet - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm_reports.css?v=20260929a}"/>
</head>
<!-- Architecture.WinApp.HRM_Reports.PayRollSalarySheetRpt - ClientSize 1002 x 661.
     toolStrip3: &Refresh | Print (drop-down of Reports\SalarySheet\*.rpt) | 1110-SalaryList | 1110B-SalarySlip.  panel2: "Salary Sheet".
     panel3 groupBox1 "Filters" (955 x 77): Month (82,18) 104 | Year (224,18) 105 | Section (400,15) 239 | Debit Account (740,15) 209 /
     Department (82,45) 247 | Employee (400,44) 239 | Salary with Financial Posting (493,29) | Salary without Financial Posting (737,29, Checked) | Show (893,44).
     panel4 ctrlGrdBar1; grd GridEX (EmployeeNo = Link column -> 1110B slip of that employee), HeaderLines 2. -->
<body class="pd-body hrm-body" data-hrm="salary-sheet" data-screen="378">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="tsDropDownPrint" class="win-btn-tool" onclick="HrmReports.tsDropDownPrint(this)"><i class="fa fa-print"></i> <span>Print</span></button>
        <button type="button" id="btn1110SalaryList" class="win-btn-tool" onclick="HrmReports.btn1110SalaryList(this)"><i class="fa fa-print"></i> <span>1110-SalaryList</span></button>
        <button type="button" id="btn1110ASalarySlip" class="win-btn-tool" onclick="HrmReports.btn1110ASalarySlip(this)"><i class="fa fa-print"></i> <span>1110B-SalarySlip</span></button>
    </div>
    <div class="hrm-caption">Salary Sheet</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-3">
            <div class="hrm-field"><label for="cmbMonth">Month</label><select id="cmbMonth" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbYear">Year</label><select id="cmbYear" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbSection">Section</label><select id="cmbSection" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbDebitAccount">Debit Account</label><select id="CmbDebitAccount" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnshow" class="win-btn-action" onclick="HrmReports.btnshow(this)">Show</button><label class="hrm-radio"><input type="radio" name="salaryKind" id="RadPosted"> Salary with Financial Posting</label><label class="hrm-radio"><input type="radio" name="salaryKind" id="RadUnPosted" checked> Salary without Financial Posting</label></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'PayRollSalarySheetRpt')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_reports.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
