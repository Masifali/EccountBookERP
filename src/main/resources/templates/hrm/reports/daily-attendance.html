<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Daily Attendance Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>

</head>
<!-- Architecture.WinApp.HRM_Reports.DailyAttendanceRpt - ClientSize 953 x 661.
     panel1 toolStrip3: &Refresh | 1003-&Print | 1003_01-Print.  panel4 (26): "Daily Attendance Report".
     panel2 groupBox1 "Filters" (863 x 52): Department (79,15) 201 | Employee (352,15) 201 | Duty Date (622,17) dd-MMM-yy | Show (794,15).
     panel3 ctrlGrdBar1; grd GridEX (Fill, filter row, total row). -->
<body class="pd-body hrm-body" data-hrm="daily-attendance" data-screen="373">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="Print" class="win-btn-tool" onclick="HrmReports.Print(this)" data-rpt-own data-rpt="1003-DailyAttendance.rpt"><i class="fa fa-print"></i> <span>1003-<u>P</u>rint</span></button>
        <button type="button" id="btnprint" class="win-btn-tool" onclick="HrmReports.btnprint(this)" data-rpt-own data-rpt="1003_01-DailyAttendance.rpt"><i class="fa fa-print"></i> <span>1003_01-Print</span></button>
    </div>
    <div class="hrm-caption">Daily Attendance Report</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-4">
            <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDate">Duty Date</label><input type="date" id="txtDate" class="win-textbox"/></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnshow" class="win-btn-action" onclick="HrmReports.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'DailyAttendanceRpt')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_reports.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260929a}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
