<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Employee Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm_reports.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.HRM_Reports.EmployeeHistoryRpt - ClientSize 982 x 450 (AutoScrollMinSize 980 x 700).
     panel2 toolStrip3: &Refresh | 1101-Print | 1101_01-Print.  panel4 (27): "Employee Register".
     panel3 groupBox1 "Filters" (944 x 87): Department (80,19) 201 | Section (336,19) 149 | Is Active (550,19) 296 /
     Designation (80,49) 201 | Shift (336,49) 149 | Employee (550,49) 296 | Show (851,49).  panel1 ctrlGrdBar1; grd GridEX (Fill,
     filter row, total row).  Every combo is an UltraCombo bound with ZeroIndex:false (empty until picked). -->
<body class="pd-body hrm-body" data-hrm="employee-register" data-screen="371">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="print" class="win-btn-tool" onclick="HrmReports.print(this)" data-rpt-own data-rpt="1101-EmployeeListDepartmentWiseActiveInactive.rpt"><i class="fa fa-print"></i> <span>1101-<u>P</u>rint</span></button>
        <button type="button" id="btnPrint1101_01" class="win-btn-tool" onclick="HrmReports.btnPrint1101_01(this)" data-rpt-own data-rpt="1101_01-EmployeeListDepartmentWiseActiveInactive.rpt"><i class="fa fa-print"></i> <span>1101_01-Print</span></button>
    </div>
    <div class="hrm-caption">Employee Register</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-3">
            <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbSection">Section</label><select id="cmbSection" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbIsActive">Is Active</label><select id="cmbIsActive" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbDesignation">Designation</label><select id="cmbDesignation" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbShift">Shift</label><select id="cmbShift" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnshow" class="win-btn-action" onclick="HrmReports.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'EmployeeHistoryRpt')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table data-gridbar="EmployeeRegister:grd" id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_reports.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body>
</html>
