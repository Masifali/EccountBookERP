<body class="pd-body hrm-body" data-hrm="employee-monthly-register" data-screen="372">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs"><button type="button" class="hrm-tab is-active" onclick="HrmReports.tab(0)">Detail Register</button><button type="button" class="hrm-tab" onclick="HrmReports.tab(1)">Short Register</button></div>
    <div class="hrm-tab-page is-active" id="tabPage1">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmReports.btnNew(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnprint101" class="win-btn-tool" onclick="HrmReports.btnprint101(this)" data-rpt-own data-rpt="1001-EmployeeAttendenceMonthly.rpt"><i class="fa fa-print"></i> <span>1001-Print</span></button>
        <button type="button" id="btnPrint1002" class="win-btn-tool" onclick="HrmReports.btnPrint1002(this)" data-rpt-own data-rpt="1002-AttendanceRegister.rpt"><i class="fa fa-print"></i> <span>1002-Print</span></button>
    </div>
    <div class="hrm-caption">Employee Attendance</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-3">
            <div class="hrm-field"><label for="txtDutyDate">Duty Date</label><input type="date" id="txtDutyDate" class="win-textbox"/></div>
            <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbPartyLocation">Party Location</label><select id="cmbPartyLocation" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDutyMonth">Duty Month</label><select id="txtDutyMonth" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbSection">Section</label><select id="cmbSection" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbEmployee">Employee</label><select id="cmbEmployee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDutyYear">Duty Year</label><input type="number" id="txtDutyYear" class="win-textbox" min="1900" max="2100" step="1"/></div>
            <div class="hrm-field"><label for="cmbShift">Shift</label><select id="cmbShift" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnShow" class="win-btn-action" onclick="HrmReports.btnShow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('DatagridHistory', 'HRM_Reports_DatagridHistory')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table data-gridbar="EmployeeMonthlyRegister:DatagridHistory" id="DatagridHistory"></table></div>
    </div>
    </div>
    <div class="hrm-tab-page" id="tabPage2">
    <div class="win-tool-strip">
        <button type="button" id="btnNewRegister" class="win-btn-tool" onclick="HrmReports.btnNewRegister(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="print" class="win-btn-tool" onclick="HrmReports.print(this)" data-rpt-own data-rpt="1004-EmployeeAttendance.rpt"><i class="fa fa-print"></i> <span>1004-Print</span></button>
    </div>
    <div class="hrm-caption">Employee Attendance</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-2">
            <div class="hrm-field"><label for="txtFromDateRegister">From Date</label><input type="date" id="txtFromDateRegister" class="win-textbox"/></div>
            <div class="hrm-field"><label for="cmbDepartmentRegister">Department</label><select id="cmbDepartmentRegister" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDateToRegister">To Date</label><input type="date" id="txtDateToRegister" class="win-textbox"/></div>
            <div class="hrm-field"><label for="cmbEmployeeRegister">Employee</label><select id="cmbEmployeeRegister" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label>&nbsp;</label><div class="hrm-show-cell"><button type="button" id="btnShowRegister" class="win-btn-action" onclick="HrmReports.btnShowRegister(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="HrmReports.exportGrid('grd', 'HRM_Reports_grd')"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table data-gridbar="EmployeeMonthlyRegister:grd" id="grd"></table></div>
    </div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
