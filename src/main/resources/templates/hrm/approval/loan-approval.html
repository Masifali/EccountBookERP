<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Loan Approval - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        /* grid button cells (GridEX ButtonDisplayMode.Always columns: Load / Print / Approve / Reject / Detail) */
        table.hrm-grid .hrm-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- Architecture.WinApp.HRM.ApprovalManagement.LoanApproval (667) - ClientSize 964 x 661, Maximized, KeyPreview.
     panel2 (Teal, 58): toolStrip1 New | Update (hidden) | Save | Print (Visible false); label4 "Employee Loan Approval".
     panel5 (68): Employee Name cmbEmployeeName (104,9) 200; Applied On datAppliedOn (104,39) 200 (disabled on Load);
       Loan Amount txtLoanAmount (419,11) 102 ReadOnly; Approved Amount txtApprovedAmount (419,39) 102;
       No Of Installments txtNoofInstallments (631,11) 116; btnGenerate "Generate" (660,37) teal.
     grd GridEX (installments, Fill of panel3 417): EmployeeLoanInstallmentId hidden, Installments, Month, Year, Amount "#,#.###" total.
     panel4 grdPendingForLoan (Fill, 212): FormHistory(IsApproved false) - EmployeeId / EmployeeLoanId / RecordNo hidden,
       LoanAmount / ApprovedAmount "#,##0.00" right with totals, "Load" button column (80). -->
<body class="pd-body hrm-body" data-hrm="loan-approval" data-screen="667">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmApproval.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmApproval.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmApproval.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="hrm-caption">Employee Loan Approval</div>
    <div class="hrm-entry hrm-cols-3">
        <div class="hrm-field"><label for="cmbEmployeeName">Employee Name</label><select id="cmbEmployeeName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field"><label for="txtLoanAmount">Loan Amount</label><input type="text" id="txtLoanAmount" class="win-textbox hrm-al-right" data-guard="decimal" readonly tabindex="-1"/></div>
        <div class="hrm-field"><label for="txtNoofInstallments">No Of Installments</label><input type="text" id="txtNoofInstallments" class="win-textbox hrm-al-right" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
        <div class="hrm-field"><label for="datAppliedOn">Applied On</label><input type="date" id="datAppliedOn" class="win-textbox" disabled/></div>
        <div class="hrm-field"><label for="txtApprovedAmount">Approved Amount</label><input type="text" id="txtApprovedAmount" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
        <div class="hrm-field"><span></span><div class="hrm-inline"><button type="button" id="btnGenerate" class="win-btn-action" onclick="HrmApproval.btnGenerate(this)">Generate</button></div></div>
    </div>
    <div class="hrm-grid-box hrm-grid-short">
        <div class="hrm-subcaption"><span>Installments</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="LoanApproval:grd" id="grd"></table></div>
    </div>
    <div class="hrm-grid-box" id="boxPending">
        <div class="hrm-subcaption"><span>Pending Loans For Approval</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grdPendingForLoan"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_approval.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
