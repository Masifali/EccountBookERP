<!-- Architecture.WinApp.HRM.ApprovalManagement.AdvanceApproval (669) - ClientSize 434 x 561 (AutoScrollMinSize 980 x 600), KeyPreview.

<body class="pd-body hrm-body" data-hrm="advance-approval" data-screen="669">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="HrmApproval.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
    </div>
    <div class="hrm-caption">Advance Approval</div>
    <div class="hrm-entry hrm-cols-3">
        <div class="hrm-field"><label for="cmbDepartment">Department</label><select id="cmbDepartment" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field"><label for="cmbDesignation">Designation</label><select id="cmbDesignation" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field"><label for="cmbEmployeeName">Employee Name</label><select id="cmbEmployeeName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
    </div>
    <div class="hrm-actions"><button type="button" id="btnSearch" class="win-btn-action" onclick="HrmApproval.btnSearch(this)">Search</button></div>
    <div class="hrm-grid-box" id="boxHistory">
        <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="AdvanceApproval:grdHistory" id="grdHistory"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
