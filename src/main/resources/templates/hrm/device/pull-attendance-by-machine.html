<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Pull Attendance By Machine - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        /* PullAttendanceByMachine: each band = a grid docked left (819) + an action panel (143) docked beside it. */
        .dv-band { display: flex; gap: 0; min-width: 0; flex-wrap: wrap; }
        .dv-band > .hrm-grid-box { flex: 1 1 520px; min-width: 0; min-height: 200px; }
        .dv-actions { flex: 0 0 150px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #c8c8c8; }
        .dv-actions .win-btn-action { width: auto; margin: 0 8px; height: 36px; white-space: normal; line-height: 1.1; }
        .dv-pull { background: royalblue !important; } .dv-download { background: mediumseagreen !important; }
        .dv-upload { background: peru !important; } .dv-delete { background: crimson !important; }
        .hrm-ping { height: 18px; min-width: 40px; padding: 0 4px; font-size: 8pt; }
        @media (max-width: 700px) { .dv-actions { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; border-left: 0; padding-bottom: 6px; } .dv-actions .hrm-subcaption { flex: 1 1 100%; } }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- Architecture.WinApp.HRM.DeviceManagement.PullAttendanceByMachine - ClientSize 964 x 461, Maximized, KeyPreview.
     panel2 (28): toolStrip1 New.
     panel3 (193): panel5 (819) "Data Syncronization" + grdMachineData (AtPull selector, Ping button, BranchName 150, DeviceName 120,
       DeviceLocation 180, IpAddress 100, PortNo 70, IsActive 70; Id / LocationId hidden) | panel7 (143) "General Action":
       btnPullAttendance (RoyalBlue) "Pull Attendance", btnDownloadTemplate (MediumSeaGreen) "Download Template".
     panel4: panel10 (819) "Employee List" + grdEmployeeList (Active selector with header selector, EmployeeName 220,
       EmployeeHistoryId / EmployeeId hidden) | panel12 (143) "Actions": button2 (Peru) "Upload Template", button1 (Crimson) "Delete Template". -->
<body class="pd-body hrm-body" data-hrm="pull-attendance-by-machine" data-screen="651">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmDevice.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
    </div>
    <div class="dv-band">
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Data Syncronization</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grdMachineData"></table></div>
        </div>
        <div class="dv-actions">
            <div class="hrm-subcaption"><span>General Action</span></div>
            <button type="button" id="btnPullAttendance" class="win-btn-action dv-pull" onclick="HrmDevice.btnPullAttendance(this)">Pull Attendance</button>
            <button type="button" id="btnDownloadTemplate" class="win-btn-action dv-download" onclick="HrmDevice.btnDownloadTemplate(this)">Download Template</button>
        </div>
    </div>
    <div class="dv-band">
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Employee List</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grdEmployeeList"></table></div>
        </div>
        <div class="dv-actions">
            <div class="hrm-subcaption"><span>Actions</span></div>
            <button type="button" id="button2" class="win-btn-action dv-upload" onclick="HrmDevice.button2(this)">Upload Template</button>
            <button type="button" id="button1" class="win-btn-action dv-delete" onclick="HrmDevice.button1(this)">Delete Template</button>
        </div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_device.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
