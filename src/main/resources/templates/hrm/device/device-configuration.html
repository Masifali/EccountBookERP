<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Device Configuration - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.HRM.DeviceManagement.frmDeviceManagement - ClientSize 434 x 561, KeyPreview.
     panel2 (28): toolStrip1 New | Update (hidden) | Save.
     panel3 (202): panel11 (Teal, 32) "Define Device"; Location cmbLocation (118,39) 231x26 UltraCombo + btnbenifit (+, 353,39) -> frmgenLocation;
       Device Name txtDeviceName (118,69) 265x23; Network Port txtNetworkPort (118,96); Network IP txtNetworkIP (118,123) (KeyPress: digits and '.');
       IsActive check box (118,152); Cancel (229,152), Save / Update (310,152) teal 73x28.
     panel4 (Teal, 27): "History"; panel5: datagrid GridEX (filter row): Id, LocationId, IsActive hidden; LocationName, DeviceName, NetworkPort, NetworkIP, Status. -->
<body class="pd-body hrm-body" data-hrm="device-configuration" data-screen="649">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-narrow">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmDevice.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmDevice.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmDevice.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="hrm-caption">Define Device</div>
    <div class="hrm-entry hrm-cols-2">
        <div class="hrm-field hrm-span-2"><label for="cmbLocation">Location</label>
            <div class="hrm-inline"><div class="hrm-grow"><select id="cmbLocation" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <button type="button" id="btnbenifit" class="win-btn-action" title="Define Location" onclick="HrmDevice.btnbenifit()" style="min-width:30px;width:30px;padding:0"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field hrm-span-2"><label for="txtDeviceName">Device Name</label><input type="text" id="txtDeviceName" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="txtNetworkPort">Network Port</label><input type="text" id="txtNetworkPort" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="txtNetworkIP">Network IP</label><input type="text" id="txtNetworkIP" class="win-textbox" autocomplete="off" inputmode="decimal"/></div>
        <div class="hrm-field hrm-span-2"><span class="hrm-lbl"></span><label class="hrm-check"><input type="checkbox" id="IsActive"/> Is Active</label></div>
    </div>
    <div class="hrm-actions">
        <button type="button" id="BtnCancel" class="win-btn-action" onclick="HRM.close()">Cancel</button>
        <button type="button" id="BtnSavef" class="win-btn-action" onclick="HrmDevice.btnsave(this)">Save</button>
        <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="HrmDevice.btnupdate(this)">Update</button>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="DeviceConfiguration:datagrid" id="datagrid"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_device.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
