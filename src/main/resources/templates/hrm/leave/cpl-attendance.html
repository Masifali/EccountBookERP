<!-- Architecture.WinApp.HRM.LeaveManagment.frmEmployeeCPLAttendance - ClientSize 754 x 361.
     panel3 toolStrip1: New | Save. panel4 (26): "CPL Attendance".
     panel5 (50): Employee Name cmbEmployee (105,11) 230 + BtnEmploye(+); Month cmbMonth (424,11) 104; Year cmbYear (567,11) 105;
       btnAdd "Show" (678,11) 57x26.
     panel10 + ctrlGrdBar1; grd (read-only): CPLAttendanceId / EmployeeId / EmployeeAttendanceId hidden, DutyDate, InDateTime,
       OutDateTime, CPLQuota (#,#.## + Sum), Delete button (35).
     tabPage2 "History": DataGridHistory = CPLAttendance.ReadAll ReqTypeId 2 (double-click loads the record). -->
<body class="pd-body hrm-body" data-hrm="cpl-attendance" data-screen="461">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-medium">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmLeave.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmLeave.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="hrm-caption">CPL Attendance</div>
    <div class="hrm-entry hrm-cols-4">
        <div class="hrm-field"><label for="cmbEmployee">Employee Name</label><div class="hrm-inline"><select id="cmbEmployee" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select><button type="button" id="BtnEmploye" class="win-btn-action" style="min-width:28px;width:28px;padding:0" tabindex="-1" title="Add" onclick="HrmLeave.employeeRegistration()"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field"><label for="cmbMonth">Month</label><div class="hrm-inline"><select id="cmbMonth" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select></div></div>
        <div class="hrm-field"><label for="cmbYear">Year</label><div class="hrm-inline"><select id="cmbYear" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select></div></div>
        <div class="hrm-field"><span></span><div class="hrm-inline"><button type="button" id="btnShow" class="win-btn-action" onclick="HrmLeave.btnShow(this)">Show</button></div></div>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_leave.js?v=20260929a}"></script>

<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
