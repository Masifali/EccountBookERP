<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Leave Opening - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
</head>
<!-- Architecture.WinApp.HRM.LeaveManagment.frmEmployeeLeaveOpening - ClientSize 964 x 661, Maximized.
     panel3 toolStrip1: New | Save | Update (hidden) | Refresh. panel4 (26): "Employee Leave Opening".
     panel5 (67): Leave Quota CmbLeaveQuota (12,32) 233 + btnQuata(+); LeaveType CmbLeaveType (280,32) 233 + btnLeaveType(+);
     Employee cmbEmployee (550,32) 233 + BtnEmploye(+); btnLoad "Load" (812,32) 67x26.
     panel10 "Detail" + ctrlGrdBar1; grd GridEX (Fill, filter row, AllowDelete, CellUpdated): EmployeeNo, EmployeeName, JoiningDate,
     DepartmentName, DesignationName, QuotaValue, TotalMonth, Assign, Availed (the only editable column), Balance.
     tabPage2 "history" is removed in Load - the form has no history. -->
<body class="pd-body hrm-body" data-hrm="leave-opening" data-screen="660">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmLeave.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmLeave.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="HrmLeave.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <span class="win-tool-sep" style="display:inline-block;width:1px;height:20px;background:#aaa;margin:0 3px"></span>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="HrmLeave.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="hrm-caption">Employee Leave Opening</div>
    <div class="hrm-entry hrm-cols-4">
        <div class="hrm-field"><label for="CmbLeaveQuota">Leave Quota</label><div class="hrm-inline"><select id="CmbLeaveQuota" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select><button type="button" id="btnQuata" class="win-btn-action" style="min-width:28px;width:28px;padding:0" tabindex="-1" title="Add" onclick="HrmLeave.btnQuata()"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field"><label for="CmbLeaveType">LeaveType</label><div class="hrm-inline"><select id="CmbLeaveType" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select><button type="button" id="btnLeaveType" class="win-btn-action" style="min-width:28px;width:28px;padding:0" tabindex="-1" title="Add" onclick="HrmLeave.btnLeaveType()"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field"><label for="cmbEmployee">Employee</label><div class="hrm-inline"><select id="cmbEmployee" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select><button type="button" id="BtnEmploye" class="win-btn-action" style="min-width:28px;width:28px;padding:0" tabindex="-1" title="Add" onclick="HrmLeave.employeeRegistration()"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field"><span></span><div class="hrm-inline"><button type="button" id="btnLoad" class="win-btn-action" onclick="HrmLeave.btnLoad(this)">Load</button></div></div>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_leave.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
