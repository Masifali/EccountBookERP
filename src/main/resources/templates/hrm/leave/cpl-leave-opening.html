<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>CPL Leave Opening - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>

</head>
<!-- Architecture.WinApp.HRM.LeaveManagment.frmEmployeeCPLLeaveOpening (screens 662 and 463) - ClientSize 1047 x 719, Maximized.
     panel3 toolStrip1: New | Save | Refresh. panel4 (30): "CPL Opening".
     panel5 (71): Employee Name cmbEmployee (9,31) 226 + BtnEmploye(+); Date datDate (273,33) dd-MMM-yyyy; InTime datInTime (389,33) HH:mm tt;
       OutTime datOutTime (514,33); CPL Quota txtCplQuota (636,33) (OnlytextdecimelFunction); btnAdd "Add" (758,32); btnUpdate "Update" (810,32)
       and btnCancel "Cancel" (880,32) hidden until a row is double-clicked.
     panel10 "Detail"; grd: Id / EmployeeId hidden, EmployeeName, CPLDate, InTime, OutTime, CPLQuota (#,#.## + Sum), Delete button (35).
     tabPage2 "History": DataGridHistory = CPLAttendance.ReadAll ReqTypeId 1 (double-click loads the record). -->
<body class="pd-body hrm-body" data-hrm="cpl-leave-opening" data-screen="662">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmLeave.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmLeave.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <span class="win-tool-sep" style="display:inline-block;width:1px;height:20px;background:#aaa;margin:0 3px"></span>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="HrmLeave.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="hrm-caption">CPL Opening</div>
    <div class="hrm-entry">
        <div class="hrm-field"><label for="cmbEmployee">Employee Name</label><div class="hrm-inline"><select id="cmbEmployee" class="win-combo dtcombo hrm-grow" data-dtcombo="single"></select><button type="button" id="BtnEmploye" class="win-btn-action" style="min-width:28px;width:28px;padding:0" tabindex="-1" title="Add" onclick="HrmLeave.employeeRegistration()"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field"><label for="datDate">Date</label><input type="date" id="datDate" class="win-textbox"/></div>
        <div class="hrm-field"><label for="datInTime">InTime</label><input type="time" id="datInTime" class="win-textbox"/></div>
        <div class="hrm-field"><label for="datOutTime">OutTime</label><input type="time" id="datOutTime" class="win-textbox"/></div>
        <div class="hrm-field"><label for="txtCplQuota">CPL Quota</label><input type="text" id="txtCplQuota" class="win-textbox" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
        <div class="hrm-field"><span></span><div class="hrm-inline">
            <button type="button" id="btnAdd" class="win-btn-action" onclick="HrmLeave.btnAdd(this)">Add</button>
            <button type="button" id="btnUpdateRow" class="win-btn-action is-hidden" onclick="HrmLeave.btnUpdateRow(this)">Update</button>
            <button type="button" id="btnCancel" class="win-btn-action is-hidden" onclick="HrmLeave.btnCancel(this)">Cancel</button>
        </div></div>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="CplLeaveOpening:grd" id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_leave.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
