<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Define Shift - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.HRM.EmployeeManagement.frmGenShift - ClientSize 434 x 561, KeyPreview; tabControl1 (bottom) with one page "Form".
     panel3 (Teal, 57): toolStrip1 New | Update (hidden) | Save | ShiftTiming (-> frmGenShiftTiming if "ShiftTiming" View right); label4 "Define Shift".
     panel4 (141): Shift Name txtShiftName (157,6) 226x23; Short Name txtShortName (157,35); Urdu Name txtShiftUrduName (157,64) hidden;
       Branch combranches / Project comproject hidden UltraCombos (first row activated); Cancel (229,93), Save / Update (308,93) teal 75x28.
     panel5 (Teal, 31): "History" + ctrlGrdBar2; grdShift GridEX (filter row): Id hidden, Shift 150, ShortName 100. -->
<body class="pd-body hrm-body" data-hrm="define-shift" data-screen="652">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-narrow">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmShift.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmShift.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmShift.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnShiftTiming" class="win-btn-tool" onclick="HrmShift.btnShiftTiming(this)"><i class="fa fa-clock-o"></i> <span>ShiftTiming</span></button>
    </div>
    <div class="hrm-caption">Define Shift</div>
    <div class="hrm-entry hrm-cols-2">
        <div class="hrm-field hrm-span-2"><label for="txtShiftName">Shift Name</label><input type="text" id="txtShiftName" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="txtShortName">Short Name</label><input type="text" id="txtShortName" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2 is-hidden"><label for="txtShiftUrduName">Urdu Name</label><input type="text" id="txtShiftUrduName" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field is-hidden"><label for="combranches">Branch</label><select id="combranches" class="win-combo"></select></div>
        <div class="hrm-field is-hidden"><label for="comproject">Project</label><select id="comproject" class="win-combo"></select></div>
    </div>
    <div class="hrm-actions">
        <button type="button" id="BtnCancel" class="win-btn-action" onclick="HRM.close()">Cancel</button>
        <button type="button" id="BtnSavef" class="win-btn-action" onclick="HrmShift.btnsave(this)">Save</button>
        <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="HrmShift.btnupdate(this)">Update</button>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="DefineShift:grdShift" id="grdShift"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_shift.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
