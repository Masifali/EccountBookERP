<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Profile Define - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.HRM.PolicyManagment.ProfileDefine (ScreenDefinition TargetUrl ...PolicyManagment.Profile) - ClientSize 434 x 561, KeyPreview.
     tsItemType: Save | Update | New.  panel4 (Teal, 58): "Profile Define".
     panel5 (141): "Profile Type" (51,11) + cmbprofiletype (127,5) 217x26 (TextChanged filters the grid) + btnbenifit "+" (343,5) -> ProfileTypes.Show();
                   "Profile Name" (51,39) + txtprofilename (127,35) 246x23; "Prefix" (51,66) + txtprefix (127,62); chkactive "Is Active" (127,89) unchecked;
                   Cancel (219,90), Save / Update (298,90).
     panel6 (Teal, 26): "History" + ctrlGrdBar1; grdfrm GridEX (FilterMode 2): Id (hidden), ProfileType, Profile, Prefix, IsActive.
     Opened from BenifitDefine (profileTypeId 1) / genDepartment (65) with ?profileTypeId=. -->
<body class="pd-body hrm-body" data-hrm="define-profile" data-screen="642">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-narrow">
    <div class="win-tool-strip">
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmProfile.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmProfile.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmProfile.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
    </div>
    <div class="hrm-caption">Profile Define</div>
    <div class="hrm-entry hrm-cols-2">
        <div class="hrm-field hrm-span-2"><label for="cmbprofiletype">Profile Type</label><div class="hrm-inline"><div class="hrm-grow"><select id="cmbprofiletype" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btnbenifit" class="win-btn-tool" title="Profile Types" onclick="HrmProfile.btnbenifit(this)"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field hrm-span-2"><label for="txtprofilename">Profile Name</label><input type="text" id="txtprofilename" class="win-textbox" maxlength="150" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="txtprefix">Prefix</label><input type="text" id="txtprefix" class="win-textbox" maxlength="10" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label></label><label class="hrm-check"><input type="checkbox" id="chkactive"/> Is Active</label></div>
    </div>
    <div class="hrm-actions">
        <button type="button" id="BtnCancel" class="win-btn-action" onclick="HrmProfile.BtnCancel()">Cancel</button>
        <button type="button" id="BtnSavef" class="win-btn-action" onclick="HrmProfile.btnsave(this)">Save</button>
        <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="HrmProfile.btnupdate(this)">Update</button>
    </div>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="DefineProfile:grdfrm" id="grdfrm"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_profile.js?v=20260929b}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
