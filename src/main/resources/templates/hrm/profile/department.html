<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Department - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- Architecture.WinApp.HRM.ProfileManagement.genDepartment - ClientSize 526 x 561, KeyPreview.
     panel4 (30): toolStrip1 New | Update (hidden) | Save | Refresh.  panel3 (Teal, 28): "Department".
     panel2 (208): "Department Type" (68,11) + cmbDepartmentType (182,5) 222x26 + btnDepartmenTtype "+" (408,5) -> ProfileDefine(profileTypeId 65);
                   "Short Name" (68,38) + txtShortName (182,34) 256x23; "Department Name" (68,64) + txtDepartmentName (182,60) 256x23;
                   "Salaries Payable Ac" (68,92) + CmbSalaryPayableAc (182,86) + btnCoa1 "+"; "Salaries Expense Ac" (68,122) + CmbSalariesExpensesAc (182,116) + btncoa2;
                   "Loan Ac" (68,152) + CmbSalaryLoanAc (182,146) + btncoa3 (all three -> AcfrmDefCoa when the user has its View right);
                   Cancel (284,175), Save / Update (363,175).
     panel5 (Teal, 30): "History"; grd GridEX (FilterMode 2, Tag "grd"): Id (hidden), Type, ShortName, Name, Payable Account, Expense Account, Loan Account. -->
<body class="pd-body hrm-body" data-hrm="department" data-screen="638">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-medium">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmProfile.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmProfile.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmProfile.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnrefresh" class="win-btn-tool" onclick="HrmProfile.btnrefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="hrm-caption">Department</div>
    <div class="hrm-entry hrm-cols-2">
        <div class="hrm-field hrm-span-2"><label for="cmbDepartmentType">Department Type</label><div class="hrm-inline"><div class="hrm-grow"><select id="cmbDepartmentType" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btnDepartmenTtype" class="win-btn-tool" title="Define Department Type" onclick="HrmProfile.btnDepartmenTtype(this)"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field hrm-span-2"><label for="txtShortName">Short Name</label><input type="text" id="txtShortName" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="txtDepartmentName">Department Name</label><input type="text" id="txtDepartmentName" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field hrm-span-2"><label for="CmbSalaryPayableAc">Salaries Payable Ac</label><div class="hrm-inline"><div class="hrm-grow"><select id="CmbSalaryPayableAc" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btnCoa1" class="win-btn-tool" title="Define Accounts" onclick="HrmProfile.btnCoa1(this)"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field hrm-span-2"><label for="CmbSalariesExpensesAc">Salaries Expense Ac</label><div class="hrm-inline"><div class="hrm-grow"><select id="CmbSalariesExpensesAc" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btncoa2" class="win-btn-tool" title="Define Accounts" onclick="HrmProfile.btncoa2(this)"><i class="fa fa-plus"></i></button></div></div>
        <div class="hrm-field hrm-span-2"><label for="CmbSalaryLoanAc">Loan Ac</label><div class="hrm-inline"><div class="hrm-grow"><select id="CmbSalaryLoanAc" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btncoa3" class="win-btn-tool" title="Define Accounts" onclick="HrmProfile.btncoa3(this)"><i class="fa fa-plus"></i></button></div></div>
    </div>
    <div class="hrm-actions">
        <button type="button" id="BtnCancel" class="win-btn-action" onclick="HrmProfile.BtnCancel()">Cancel</button>
        <button type="button" id="BtnSavef" class="win-btn-action" onclick="HrmProfile.btnsave(this)">Save</button>
        <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="HrmProfile.btnupdate(this)">Update</button>
    </div>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_profile.js?v=20260929b}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
