<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Location - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
</head>
<!-- Architecture.WinApp.HRM.ProfileManagement.frmgenLocation - ClientSize 964 x 661 (AutoScrollMinSize 980 x 500), KeyPreview.
     tsItemType: New | Update | Save | Refresh.  panel3 (Teal, 29): "Location Name".
     panel11 (181), three columns:
       (11..318)  "Location Name" txtLocationName; "Location Short Name" txtShortName; "Sub Location Name" txtSubLocationName; "Location Email" txtEmail
       (325..614) "Location Type" cmbLocationType (UltraCombo, genProfile type 61); "Mobile 1:"; "Mobile 2:"; "Portal URL:"
       (620..951) "License No:" txtLicenseNo; "Address Detail" txtAddressDetail (multiline 248x75)
       Cancel (797,143), Save / Update (876,143).  No City control exists on this form (nor in genLocation / its procs).
     panel2: panel4 (Teal, 29) "History" + ctrlGrdBar1; grd GridEX (FilterMode 2): Id (hidden), LocationType, LocationName, ShortName, SubName,
       Mobile1, Mobile2, Email, PortalURL, AddressDetail, LicenseNo. -->
<body class="pd-body hrm-body" data-hrm="location" data-screen="640">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form ">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmProfile.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmProfile.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmProfile.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnrefresh" class="win-btn-tool" onclick="HrmProfile.btnrefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="hrm-caption">Location Name</div>
    <div class="hrm-entry hrm-cols-3">
        <div class="hrm-field"><label for="txtLocationName">Location Name</label><input type="text" id="txtLocationName" class="win-textbox" maxlength="150" autocomplete="off"/></div>
        <div class="hrm-field"><label for="cmbLocationType">Location Type</label><select id="cmbLocationType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field"><label for="txtLicenseNo">License No:</label><input type="text" id="txtLicenseNo" class="win-textbox" maxlength="25" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtShortName">Location Short Name</label><input type="text" id="txtShortName" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtMobile1">Mobile 1:</label><input type="text" id="txtMobile1" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field" style="grid-row: span 3;"><label for="txtAddressDetail">Address Detail</label><textarea id="txtAddressDetail" class="win-textbox" rows="4" autocomplete="off"></textarea></div>
        <div class="hrm-field"><label for="txtSubLocationName">Sub Location Name</label><input type="text" id="txtSubLocationName" class="win-textbox" maxlength="150" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtMobile2">Mobile 2:</label><input type="text" id="txtMobile2" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtEmail">Location Email</label><input type="text" id="txtEmail" class="win-textbox" maxlength="50" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtPortalURL">Portal URL:</label><input type="text" id="txtPortalURL" class="win-textbox" maxlength="4000" autocomplete="off"/></div>
    </div>
    <div class="hrm-actions">
        <button type="button" id="BtnCancel" class="win-btn-action" onclick="HrmProfile.BtnCancel()">Cancel</button>
        <button type="button" id="BtnSavef" class="win-btn-action" onclick="HrmProfile.btnsave(this)">Save</button>
        <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="HrmProfile.btnupdate(this)">Update</button>
    </div>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_profile.js?v=20260929b}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
