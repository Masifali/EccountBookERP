    <style>
        .pr-x-btn, .pr-mini-btn { border: 1px solid #8aa; background: #f4f4f4; font: 8pt Verdana, sans-serif; line-height: 1; padding: 2px 5px; cursor: pointer; }
        .pr-x-btn { color: #b00; font-weight: bold; }
        .pr-x-btn:hover, .pr-mini-btn:hover { background: #cce8ff; }
        .pr-def-btn { width: 28px; height: 24px; padding: 0; border: 1px solid #7a9a9e; background: #f4f4f4; cursor: pointer; flex: 0 0 auto; }
        .pr-inline { display: flex; align-items: center; gap: 4px; min-width: 0; }

<body class="pd-body hrm-body" data-hrm="employee-short-adjustment" data-screen="674">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-medium">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmPayroll.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmPayroll.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmPayroll.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool is-hidden"><i class="fa fa-print"></i> <span><u>P</u>rint</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="HrmPayroll.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="hrm-caption">Employee Short Adjustment</div>
    <div class="adj-top" style="display:flex;flex-wrap:wrap;min-width:0">
        <div style="flex:3 1 440px;min-width:0">
            <div class="hrm-entry hrm-cols-4">
                <div class="hrm-field hrm-stack hrm-span-2"><label for="cmbEmployeeName">Employee Name</label>
                    <div class="pr-inline"><div class="pr-grow"><select id="cmbEmployeeName" class="win-combo dtcombo" data-dtcombo="single"></select></div><button type="button" id="btnEmployee" class="pr-def-btn" tabindex="-1" title="Employee Registration" onclick="HrmPayroll.btnEmployee(this)"><i class="fa fa-user-plus"></i></button></div></div>
                <div class="hrm-field hrm-stack"><label for="cmbMonth">Month</label><select id="cmbMonth" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="cmbYear">Year</label><select id="cmbYear" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtTotalHours">Total Hours</label><input type="text" id="txtTotalHours" class="win-textbox" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtTotalMinutes">Total Minutes</label><input type="text" id="txtTotalMinutes" class="win-textbox" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtDeductedShortHours">Deduct Short Hours</label><input type="text" id="txtDeductedShortHours" class="win-textbox" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtDeductionRate">Deduction Rate</label><input type="text" id="txtDeductionRate" class="win-textbox" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-span-2 pr-checks" style="grid-template-columns:none">
                    <label class="hrm-check"><input type="checkbox" id="IsDeduction"/> Is Deduction</label>
                    <label class="hrm-check"><input type="checkbox" id="IsLeaveAdjust"/> Is Leave Adjust</label>
                </div>
            </div>
        </div>
        <fieldset class="hrm-group" style="flex:2 1 320px;min-width:0">
            <legend>Employee Information</legend>
            <div class="hrm-entry hrm-cols-2" style="padding:4px 0">
                <div class="hrm-field"><label for="txtEmployeeNo">Employee No</label><input type="text" id="txtEmployeeNo" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="txtSalary">Employee Salary</label><input type="text" id="txtSalary" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtDesgination">Desgination</label><input type="text" id="txtDesgination" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtDepartment">Department</label><input type="text" id="txtDepartment" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtSection">Section</label><input type="text" id="txtSection" class="win-textbox" readonly tabindex="-1"/></div>
            </div>
        </fieldset>
    </div>
    <div class="hrm-grid-box" id="grdBox">
        <div class="hrm-subcaption" id="panel5"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
