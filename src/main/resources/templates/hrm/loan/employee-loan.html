<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Employee Loan - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        /* grid button cells (GridEX ButtonDisplayMode.Always columns: Load / Print / Approve / Reject / Detail) */
        table.hrm-grid .hrm-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
    </style>
</head>
<!-- Architecture.WinApp.HRM.LoanManagement.frmEmployeeLoan (663) - ClientSize 964 x 661, Maximized, KeyPreview.
     panel2 (30): toolStrip1 New | Refresh | Update (hidden) | Save | 102-Print.
     panel5 (180): panel4 (Teal, 33) "Employee Loan"; groupBox2 "Loan Information" (5,37) 580x139:
       Employee Name* cmbEmployeeName (115,16) 187x26 + btnEmployeeRegister (304,19); Loan Amount* txtLoanAmount (455,17) 118;
       Applied On* datAppliedOn (115,45) 216 dd-MMM-yyyy; No Of Installments* txtNoofInstallments (455,45) 118; Reason txtReason (115,74) 458x61.
     groupBox1 "Employee Information" (589,37) 357x139: Employee No (81,17) 87, Employee Salary (267,15) 81, Desgination, Department,
       Section (81,*) 267 - all ReadOnly.
     panel6 (Teal, 28) "History" + ctrlGrdBar1; panel7 grd GridEX (Fill): LoanId / DocumentTypeId / EmployeeId hidden, DocNo Link,
       EmployeeName 250, LoanAmount / ApprovedAmount "#,#" with totals. -->
<body class="pd-body hrm-body" data-hrm="employee-loan" data-screen="663">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="HrmLoan.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="HrmLoan.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="HrmLoan.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="HrmLoan.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" onclick="HrmLoan.btnPrint(this)" data-rpt-own data-rpt="102-ANewAcRptPaymentReceiptsVoucherSlip.rpt"><i class="fa fa-print"></i> <span>102-<u>P</u>rint</span></button>
    </div>
    <div class="hrm-caption">Employee Loan</div>
    <div class="hrm-entry hrm-cols-2" style="align-items:start">
        <fieldset class="hrm-group">
            <legend>Loan Information</legend>
            <div class="hrm-entry hrm-cols-2">
                <div class="hrm-field"><label for="cmbEmployeeName" class="hrm-req">Employee Name</label>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbEmployeeName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                        <button type="button" id="btnEmployeeRegister" class="win-btn-action" style="min-width:0;width:27px;height:23px;padding:0" title="Employee Registration" tabindex="-1" onclick="HrmLoan.btnEmployeeRegister(this)"><i class="fa fa-plus"></i></button></div></div>
                <div class="hrm-field"><label for="txtLoanAmount" class="hrm-req">Loan Amount</label><input type="text" id="txtLoanAmount" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field"><label for="datAppliedOn" class="hrm-req">Applied On</label><input type="date" id="datAppliedOn" class="win-textbox"/></div>
                <div class="hrm-field"><label for="txtNoofInstallments" class="hrm-req">No Of Installments</label><input type="text" id="txtNoofInstallments" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtReason">Reason</label><textarea id="txtReason" class="win-textbox" rows="3"></textarea></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group">
            <legend>Employee Information</legend>
            <div class="hrm-entry hrm-cols-2">
                <div class="hrm-field"><label for="txtEmployeeNo">Employee No</label><input type="text" id="txtEmployeeNo" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="txtSalary">Employee Salary</label><input type="text" id="txtSalary" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtDesgination">Desgination</label><input type="text" id="txtDesgination" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtDepartment">Department</label><input type="text" id="txtDepartment" class="win-textbox" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-span-2"><label for="txtSection">Section</label><input type="text" id="txtSection" class="win-textbox" readonly tabindex="-1"/></div>
            </div>
        </fieldset>
    </div>
    <div class="hrm-grid-box" id="boxHistory">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grd"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_hrm_loan.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260929a}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
