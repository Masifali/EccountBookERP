<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Financial Year Close - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_fyc.css?v=20261008a}"/>
</head>
<!--
  Architecture.WinApp.Account_Definition.frmFinancialYearClose (399), 991 wide.
  tabs 'Closing Year' | 'History'; toolStrip New | Refresh | Update | Save | Print | Attachment (Update and Save are both
  shown at start, as the designer leaves them); teal caption 'Financial Year Close'; Document No (read only) | Closing Date
  (dd-MMM-yy) | Branch Name | Show; grid; 'PL Amount' (disabled) at the bottom right.
-->
<body class="fyc-body" data-screen="frmFinancialYearClose">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fyc-form">
    <div class="fyc-tabs">
        <span class="fyc-tab is-active" id="tabClosing" data-tab="0">Closing Year</span>
        <span class="fyc-tab" id="tabHistory" data-tab="1">History</span>
    </div>
    <div class="fyc-page is-active" id="pageClosing">
        <div class="fyc-tool">
            <button type="button" id="btnNew" class="fyc-tool-btn"><i class="fa fa-file-o fyc-ic-blue"></i><span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="fyc-tool-btn"><i class="fa fa-refresh fyc-ic-green"></i><span><u>R</u>efresh</span></button>
            <button type="button" id="btnUpdate" class="fyc-tool-btn"><i class="fa fa-pencil-square-o fyc-ic-orange"></i><span><u>U</u>pdate</span></button>
            <button type="button" id="btnSave" class="fyc-tool-btn"><i class="fa fa-floppy-o fyc-ic-teal"></i><span><u>S</u>ave</span></button>
            <button type="button" id="printToolStripButton" class="fyc-tool-btn"><i class="fa fa-print fyc-ic-gray"></i><span>Print</span></button>
            <button type="button" id="btnattachment" class="fyc-tool-btn"><i class="fa fa-paperclip fyc-ic-gray"></i><span><u>A</u>ttachment</span></button>
        </div>
        <div class="fyc-cap"><span>Financial Year Close</span></div>
        <div class="fyc-filter">
            <span class="fyc-lbl" style="left:10px;">Document No</span>
            <input type="text" id="txtdocno" class="fyc-txt" readonly style="left:13px;width:127px;">
            <span class="fyc-lbl" style="left:139px;">Closing Date</span>
            <input type="date" id="ClosingDate" class="fyc-txt" style="left:142px;width:127px;">
            <span class="fyc-lbl" style="left:276px;">Branch Name</span>
            <select id="cmbBranchName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Branch Name" style="left:272px;top:28px;width:161px;"></select>
            <button type="button" id="btnShow" class="fyc-show">Show</button>
        </div>
        <div class="fyc-gridwrap"><table class="fyc-grid" id="grd"><thead></thead><tbody></tbody></table></div>
        <div class="fyc-plbar"><label for="txtPlAmount">PL Amount</label><input type="text" id="txtPlAmount" disabled></div>
    </div>
    <div class="fyc-page" id="pageHistory">
        <div class="fyc-gridwrap"><table class="fyc-grid" id="GridHistory"><thead></thead><tbody></tbody></table></div>
    </div>
</div>
<div class="fyc-toast" id="fycToast" role="status" aria-live="polite"></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_fyc.js?v=20261008a}"></script>
</body>
</html>
