<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Screens Allocate To Company - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_adm_panel.css?v=20261007a}"/>
</head>
<!--
  Architecture.WinApp.Templates.frmScreensAllocateToCompany (316), 969 wide.
  toolStrip: Reset | Define Template | ShortCut Keys; tab 'Screens Allocate To Company'.
  panel4 (39): Template * CmbTemplate | Show; panes: Company 244 | Modules of the selected template 244 | UnAllocated Screens 232 | Allocated Screens 232.
-->
<body class="pd-body ap-body" data-screen="frmScreensAllocateToCompany">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="ap-form" style="max-width:969px;">
    <div class="ap-tool">
        <button type="button" id="btnRefresh" class="ap-tool-btn" onclick="AP.refresh()"><i class="fa fa-refresh ap-ic-green"></i><span><u>R</u>eset</span></button>
        <button type="button" id="BtnTemplateDefine" class="ap-tool-btn" onclick="AP.defineTemplate()"><i class="fa fa-sitemap ap-ic-blue"></i><span>Define Template</span></button>
        <button type="button" id="btnshortcutkeys" class="ap-tool-btn" onclick="AP.shortcuts()"><i class="fa fa-keyboard-o ap-ic-gray"></i><span>ShortCut Keys</span></button>
    </div>
    <div class="ap-tabs"><span class="ap-tab is-active">Screens Allocate To Company</span></div>
    <div class="ap-abs" style="height:39px;">
            <label class="ap-lbl" style="left:6px;top:13px;">Template</label>
            <span class="ap-star" style="left:60px;top:10px;">*</span>
            <select id="CmbTemplate" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Template" style="left:80px;top:7px;width:214px;"></select>
            <button type="button" id="BtnShow" class="ap-teal-btn" style="left:298px;top:7px;width:64px;height:26px;font-size:10pt;" onclick="AP.show(this)">Show</button>
    </div>
    <div class="ap-fill"><div class="ap-panes">
        <div class="ap-pane" style="width:244px;">
            <div class="ap-phead ap-big" style="height:32px;"><span>Company</span></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="grdCompany"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:244px;">
            <div class="ap-phead" style="height:32px;"><span id="labelModulesOfSelectedTemplate">Allocated Modules Of Template : </span></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="grdModules"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:232px;">
            <div class="ap-phead" style="height:32px;"><span id="labelUnAllocateGridTemplateII">UnAllocated Screens Of Template : </span><button type="button" id="BtnSaveTemplateII" class="ap-headbtn" title="Allocate (Ctrl+A)" onclick="AP.allocate()"><i class="fa fa-check"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="GridUnAllocatedTemplateII"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:232px;">
            <div class="ap-phead" style="height:32px;"><span id="labelAllocateGridTemplateII">Allocated Screen Of Template : </span><button type="button" id="btnDeleteTemplateII" class="ap-headbtn" title="UnAllocate (Ctrl+U)" onclick="AP.unallocate()"><i class="fa fa-times"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="GridAllocatedTemplateII"><thead></thead><tbody></tbody></table></div>
        </div>
    </div></div>
</div>
<div class="ap-toast" id="apToast" role="status" aria-live="polite"></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_adm_panel.js?v=20261007a}"></script>
</body>
</html>
