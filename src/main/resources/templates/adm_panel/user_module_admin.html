<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Module Admin User - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_adm_panel.css?v=20261007a}"/>
</head>
<!--
  Architecture.WinApp.Configurations.frmUserModuleAdmin (319), 1184 wide.
  toolStrip: Refresh | Define User | ShortCut Keys; tab 'Module Allocatation To User';
  panes: User Name 430 | UnAllocated Modules Of User 370 | Allocated Modules Of User 370 (headers 33 high, teal).
-->
<body class="pd-body ap-body" data-screen="frmUserModuleAdmin">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="ap-form" style="max-width:1184px;">
    <div class="ap-tool">
        <button type="button" id="btnRefresh" class="ap-tool-btn" onclick="AP.refresh()"><i class="fa fa-refresh ap-ic-green"></i><span><u>R</u>efresh</span></button>
        <button type="button" id="BtnDefineUser" class="ap-tool-btn" onclick="AP.defineUser()"><i class="fa fa-user ap-ic-blue"></i><span>Define User</span></button>
        <button type="button" id="btnshortcutkeys" class="ap-tool-btn" onclick="AP.shortcuts()"><i class="fa fa-keyboard-o ap-ic-gray"></i><span>ShortCut Keys</span></button>
    </div>
    <div class="ap-tabs"><span class="ap-tab is-active">Module Allocatation To User</span></div>
    <div class="ap-fill"><div class="ap-panes">
        <div class="ap-pane" style="width:430px;">
            <div class="ap-phead ap-big" style="height:33px;"><span>User Name</span></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="grdItemName"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:370px;">
            <div class="ap-phead" style="height:33px;"><span id="labelUnAllocateGridTemplateII">UnAllocated Modules Of User : </span><button type="button" id="BtnSaveTemplateII" class="ap-headbtn" title="Allocate (Ctrl+A)" onclick="AP.allocate()"><i class="fa fa-check"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="GridUnAllocatedTemplateII"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:370px;">
            <div class="ap-phead" style="height:33px;"><span id="labelAllocateGridTemplateII">Allocated Modules Of User : </span><button type="button" id="BtnUpdateTemplateII" class="ap-headbtn" title="Update (Ctrl+U)" onclick="AP.update()"><i class="fa fa-times"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="GridAllocatedTemplateII"><thead></thead><tbody></tbody></table></div>
        </div>
    </div></div>
</div>
<div class="ap-toast" id="apToast" role="status" aria-live="polite"></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_adm_panel.js?v=20261007a}"></script>
</body>
</html>
