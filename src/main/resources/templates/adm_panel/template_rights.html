<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Allocation Organization Template Rights - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_adm_panel.css?v=20261007a}"/>
</head>
<!--
  Architecture.WinApp.Templates.AllocationOrganizationTemplateRights (314), 802 x 586.
  toolStrip: Refresh | ShortCut Keys | Template Name | All Screens In Project; panel6 (32, rgb 10,110,110) 'Screen Allocation To Comany Template';
  panel7 (37): Template Name * CmbTemplateName (108,5) 253x26 | Module Name CmbModuleName (463,5) 230x26 | Show (698,5) 61x26;
  panes 400 wide: Pending Screens For Allocation | Allocated Screen (headers 31 high, buttons at 371,3).
-->
<body class="pd-body ap-body" data-screen="AllocationOrganizationTemplateRights">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="ap-form" style="max-width:802px;">
    <div class="ap-tool">
        <button type="button" id="btnRefresh" class="ap-tool-btn" onclick="AP.refresh()"><i class="fa fa-refresh ap-ic-green"></i><span><u>R</u>efresh</span></button>
        <button type="button" id="btnshortcutkeys" class="ap-tool-btn" onclick="AP.shortcuts()"><i class="fa fa-keyboard-o ap-ic-gray"></i><span>ShortCut Keys</span></button>
        <button type="button" id="BtnTemplateName" class="ap-tool-btn" onclick="AP.defineTemplate()"><i class="fa fa-sitemap ap-ic-blue"></i><span>Template Name</span></button>
        <button type="button" id="BtnAllScreens" class="ap-tool-btn" onclick="AP.allScreens()"><i class="fa fa-list ap-ic-teal"></i><span>All Screens In Project</span></button>
    </div>
    <div class="ap-teal-rgb" style="height:32px;"><span class="ap-title" style="left:9px;top:5px;font:bold 12pt Tahoma,sans-serif;">Screen Allocation To Comany Template</span></div>
    <div class="ap-abs" style="height:37px;">
            <label class="ap-lbl" style="left:5px;top:11px;">Template Name</label>
            <span class="ap-star" style="left:93px;top:10px;">*</span>
            <select id="CmbTemplateName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Template Name" style="left:108px;top:5px;width:253px;"></select>
            <label class="ap-lbl" style="left:366px;top:10px;">Module Name</label>
            <select id="CmbModuleName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Module Name" style="left:463px;top:5px;width:230px;"></select>
            <button type="button" id="BtnShow" class="ap-teal-btn" style="left:698px;top:5px;width:61px;height:26px;" onclick="AP.show(this)">Show</button>
    </div>
    <div class="ap-fill"><div class="ap-panes">
        <div class="ap-pane" style="width:400px;">
            <div class="ap-phead" style="height:31px;"><span>Pending Screens For Allocation</span><button type="button" id="BtnAllocateItems" class="ap-headbtn" title="Allocate (Ctrl+A)" onclick="AP.allocate()"><i class="fa fa-check"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="grdPending"><thead></thead><tbody></tbody></table></div>
        </div>
        <div class="ap-pane" style="width:400px;">
            <div class="ap-phead" style="height:31px;"><span>Allocated Screen</span><button type="button" id="btnDeAllocate" class="ap-headbtn" title="De-Allocate (Ctrl+D)" onclick="AP.deallocate()"><i class="fa fa-times"></i></button></div>
            <div class="ap-scroll" tabindex="0"><table class="ap-grid" id="grdAllocated"><thead></thead><tbody></tbody></table></div>
        </div>
    </div></div>
</div>
<div class="ap-toast" id="apToast" role="status" aria-live="polite"></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_adm_panel.js?v=20261007a}"></script>
</body>
</html>
