<!--
Screen 762 OrderDashboard = Architecture.WinApp.PreBookingAndDelivery.MyOrdersStatus ("My Order's Status"), route /sale/reports/order-dashboard.
Module 2042 Booking Office / Customer Portal Report, port 2026-10-08 (key B), built on InitializeComponent() (909x673, BackColor White, no tool strip, no KeyPreview shortcuts):
  panel3 Dock Top 28 (10,110,110) = label23 4,4 Tahoma 12 bold white "My Order's Status"
  panel1 Dock Top 64 = groupBox1 "Filters" 0,0 539x64 (Tahoma 9.75 bold): label33 "From Date" 8,15 / fromdate 8,33 135x23 | label3 "To Date" 146,15 / ToDate 146,33 135x23 (dd-MMM-yyyy, Verdana 9.75)
    | lblCostCenter "Cost Center" 284,14 / CmbCostCenter 283,32 188x26 (visible only when AppId == 5, then first row and disabled) | btnShow "Show" 475,32 57x26 (10,110,110, Verdana 9.75 bold white)
  panel2 Dock Top 150 = CardsFlowLayoutPanel Fill (FixedSingle): one MyOrderStatusCard (178x143, white, FixedSingle; lblCaption Teal 43 high Tahoma 9.75 bold white centred, hand cursor = the only clickable part;
    picture 34x34 at 71,59; lblValue Tahoma 11.25 bold centred 42,106 88x22) per row of usp_PreBookingOrder_Dashboard
  PanelForCaptionIncludingBooking Dock Fill (hidden until a Booking / Pending card is clicked): CardsPanel Top 101 = four 131x94 FixedSingle boxes at x 25 / 205 / 385 / 565
    (label Teal 38 high Tahoma 9.75 bold white: Customer's / Qty / Weight / Amount; value label 3,56 Verdana 9.75 bold) + tabControl1 Dock Left 734 wide (Tahoma 9 bold):
    Item / Customer / Item_Customer / Customer_Item / Item_Pack / Pack_Item, each tab a GridEX (Verdana 8.25, no group-by box)
  panelTransitSale Dock Fill (hidden): grdSaleOrTransit GridEX (Verdana 8.25) for Delivery In Transit / Sales Bill.
Data /api/sale/bk/order-status/init|cards|booking|pending|transit|bills|confirm; slips use the shared /reports/print/* endpoints. Logic: /build/js/sale_bk_order_status.js.
-->
<style>
[hidden]{display:none !important;}
.mos-cards{display:flex;flex-wrap:wrap;align-content:flex-start;box-sizing:border-box;border:1px solid #767676;overflow:auto;height:150px;background:#fff;}
.mos-card{width:178px;height:143px;box-sizing:border-box;border:1px solid #767676;background:#fff;position:relative;margin:3px;flex:0 0 auto;}
.mos-card .cap{display:block;height:43px;background:teal;color:#fff;font:bold 13px Tahoma,Verdana,sans-serif;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mos-card .ico{position:absolute;left:70px;top:58px;width:34px;height:34px;}
.mos-card .val{position:absolute;left:41px;top:105px;width:88px;height:22px;font:bold 15px Tahoma,Verdana,sans-serif;text-align:center;line-height:22px;}
.mos-box{position:absolute;width:131px;height:94px;box-sizing:border-box;border:1px solid #767676;background:#fff;}
.mos-box .cap{display:block;height:38px;background:teal;color:#fff;font:bold 13px Tahoma,Verdana,sans-serif;}
.mos-box .val{position:absolute;left:2px;top:55px;width:123px;height:22px;font:bold 13px Verdana,Tahoma,sans-serif;}
#tabsHost .tabs button{font:bold 12px Tahoma,Verdana,sans-serif;}
#transitGrid td input.rem{width:100%;box-sizing:border-box;border:1px solid #7a7a7a;font:11px Verdana,Tahoma,sans-serif;height:19px;padding:0 3px;}
</style>
