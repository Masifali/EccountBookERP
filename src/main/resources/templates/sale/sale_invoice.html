<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:with="ctx=${session != null ? session['com.mst.security.LoginContext'] : null}"
           th:text="|${ctx != null and ctx.companyName != null ? ctx.companyName : ''} — Sale Invoice|">Sale Invoice</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css}">
    <link rel="stylesheet" th:href="@{/build/css/sale/sale_invoice.css?v=20260925a}">
</head>
<!-- =====================================================================================
     Sale Invoice - InvfrmSaleInvoice (DocumentTypeId 95), ported from the recovered desktop form.
     Layout follows InitializeComponent: toolStrip1 + panel2 (title, Location Type, check boxes),
     panel8 (header fields), panel4 (Transporter / Commission grids left, Party Add/Less / Other Item
     Expenses right), panel9 (Detail / Payment Detail tabs) and the History tab.
     ===================================================================================== -->
<body>
<div class="si-page">
    <div class="si-tabs" role="tablist">
        <button type="button" class="si-tab active" id="tabFormBtn" role="tab" aria-selected="true" data-tab="form">Form</button>
        <button type="button" class="si-tab" id="tabHistoryBtn" role="tab" aria-selected="false" data-tab="history">History</button>
    </div>

    <!-- ============================================================== tabForm -->
    <section id="tabForm" class="si-tabpage" role="tabpanel">
        <div class="si-toolstrip" id="toolStrip1">
            <button type="button" id="btnNew" title="Ctrl+N"><i class="fa fa-file-o"></i> <u>N</u>ew</button>
            <button type="button" id="btnRefresh" title="Ctrl+R"><i class="fa fa-refresh"></i> Refresh</button>
            <span class="si-sep"></span>
            <button type="button" id="btnSave" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
            <button type="button" id="btnUpdate" title="Ctrl+U" hidden><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <button type="button" id="btnDelete" title="Ctrl+Shift+Delete" hidden><i class="fa fa-trash"></i> Delete</button>
            <span class="si-sep"></span>
            <button type="button" id="btnAttachment" title="Ctrl+F10"><i class="fa fa-paperclip"></i> <u>A</u>ttachment</button>
            <span class="si-sep"></span>
            <button type="button" id="toolStripButton1" title="Ctrl+P"><i class="fa fa-print"></i> 301-Slip</button>
            <button type="button" id="BtnItemSlip" title="Alt+1"><i class="fa fa-print"></i> 303A-Item Slip</button>
            <button type="button" id="btnSlipFormat2" title="Alt+2"><i class="fa fa-print"></i> 303-Slip</button>
            <span class="si-sep"></span>
            <button type="button" id="btnPrint" title="Alt+3"><i class="fa fa-print"></i> 103-Voucher</button>
            <button type="button" id="toolStripButton3" title="Ctrl+L"><i class="fa fa-download"></i> Load <u>G</u>dn</button>
            <span class="si-sep"></span>
            <button type="button" id="btnshortcutkeys" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
        </div>

        <div class="si-panel2">
            <span class="si-title">Sale Invoice</span>
            <label for="cmbLocationType" class="si-lbl">Location Type</label>
            <select id="cmbLocationType" class="si-input si-location"></select>
            <span class="si-grow"></span>
            <input type="checkbox" id="ChkOpenADOForm" hidden aria-label="Open Advance DO form after save">
            <a href="#" id="AdvanceDoFormLink" hidden>AdvanceDO Form</a>
            <label class="si-chk"><input type="checkbox" id="chkCustomAccounts"> Custom Accounts</label>
            <label class="si-chk"><input type="checkbox" id="ChkPrintSlip"> Print Slip</label>
            <label class="si-chk"><input type="checkbox" id="ChkBok"> Print Voucher</label>
        </div>

        <div class="si-panel8">
            <div class="si-col si-c1">
                <label class="si-lbl" for="txtdocno">Br / Inv No &amp; Date</label>
                <div class="si-row3">
                    <input id="txtdocno" class="si-input si-ro" readonly aria-label="Invoice No">
                    <input id="txtBranchSrNo" class="si-input si-ro si-brsr" readonly hidden aria-label="Branch Sr No">
                    <input id="DocDate" type="date" class="si-input" aria-label="Invoice Date">
                </div>
                <label class="si-lbl" for="cmbsuppliername">Customer Name</label>
                <select id="cmbsuppliername" class="si-input dtcombo" data-dtcombo="party4" data-dtcombo-caption="Customer Name"></select>
                <label class="si-lbl" for="txtrefno">Customer Ref No</label>
                <input id="txtrefno" class="si-input">
            </div>
            <div class="si-col si-c2">
                <label class="si-lbl" for="txtDueDays">Due Days</label>
                <input id="txtDueDays" class="si-input" inputmode="numeric">
                <label class="si-lbl" for="DueDate">Due Date</label>
                <input id="DueDate" type="date" class="si-input">
                <label class="si-lbl" for="txtbillno">Manual Bill</label>
                <input id="txtbillno" class="si-input" maxlength="50">
            </div>
            <div class="si-col si-c3">
                <label class="si-lbl" for="txtLedgerBalance">Ledger Balance</label>
                <input id="txtLedgerBalance" class="si-input si-ro si-num" readonly value="0">
                <label class="si-lbl" for="txtBillAmount">Bill Amount</label>
                <input id="txtBillAmount" class="si-input si-ro si-num si-bill" readonly value="0">
                <label class="si-lbl" for="txtLedgerBalanceAfterBill">After Bill Balance</label>
                <input id="txtLedgerBalanceAfterBill" class="si-input si-ro si-num" readonly value="0">
            </div>
            <div class="si-col si-c4 si-mc" hidden>
                <label class="si-lbl" for="cmbCurrency">Fcy Code</label>
                <select id="cmbCurrency" class="si-input"></select>
                <label class="si-lbl" for="txtExchangeRate">Exchange Rate</label>
                <input id="txtExchangeRate" class="si-input si-num" inputmode="decimal">
                <label class="si-lbl" for="txtFcyAmount">Fcy Amount</label>
                <input id="txtFcyAmount" class="si-input si-num" disabled>
            </div>
            <div class="si-col si-c5">
                <label class="si-lbl" for="txtRemarks">Remarks</label>
                <textarea id="txtRemarks" class="si-input si-remarks"></textarea>
            </div>
        </div>

        <div class="si-panel4">
            <div class="si-panel15">
                <div class="si-gridbox" data-grid-box="freight">
                    <div class="si-gridbar"><span>Transporter Grid</span></div>
                    <div class="si-gridwrap"><table class="si-grid" id="grdFreight" aria-label="Transporter Grid"></table></div>
                </div>
                <div class="si-gridbox" data-grid-box="comm">
                    <div class="si-gridbar"><span>Commission Grid</span></div>
                    <div class="si-gridwrap"><table class="si-grid" id="grdComm" aria-label="Commission Grid"></table></div>
                </div>
            </div>
            <div class="si-panel10">
                <div class="si-gridbox" data-grid-box="gl">
                    <div class="si-gridbar"><span>Party Add/Less</span></div>
                    <div class="si-gridwrap"><table class="si-grid" id="grdGLedger" aria-label="Party Add/Less"></table></div>
                </div>
                <div class="si-gridbox" data-grid-box="exp">
                    <div class="si-gridbar"><span>Other Item Expenses</span></div>
                    <div class="si-gridwrap"><table class="si-grid" id="grdInvExp" aria-label="Other Item Expenses"></table></div>
                </div>
            </div>
        </div>

        <div class="si-panel9">
            <div class="si-subtabs" role="tablist">
                <button type="button" class="si-subtab active" data-subtab="detail" role="tab">Detail</button>
                <button type="button" class="si-subtab" data-subtab="payment" role="tab">Payment Detail</button>
            </div>
            <div class="si-gridbox si-subpage" id="tabDetail">
                <div class="si-gridbar"><span>Detail  Grid</span></div>
                <div class="si-gridwrap si-wide"><table class="si-grid" id="grd" aria-label="Detail Grid"></table></div>
            </div>
            <div class="si-gridbox si-subpage" id="tabPaymentDetail" hidden>
                <div class="si-gridbar"><span>Payment Detail Grid</span></div>
                <div class="si-gridwrap si-wide"><table class="si-grid" id="grdPaymentDetail" aria-label="Payment Detail Grid"></table></div>
            </div>
        </div>

        <div class="si-footer">
            <span id="siMessage" class="si-message" role="status" aria-live="polite"></span>
            <button type="button" id="btnFooterHistory" class="si-footer-history" title="Ctrl+T"><i class="fa fa-history"></i> History</button>
        </div>
    </section>

    <!-- ============================================================== tabHistory -->
    <section id="tabHistory" class="si-tabpage" role="tabpanel" hidden>
        <div class="si-toolstrip">
            <button type="button" id="btnNewHistory"><i class="fa fa-file-o"></i> <u>N</u>ew</button>
            <button type="button" id="btnRefreshHistory"><i class="fa fa-refresh"></i> Refresh</button>
        </div>
        <div class="si-title si-htitle">Sale Invoice History</div>
        <fieldset class="si-filters">
            <legend>Filters</legend>
            <div class="si-fcol si-fbranch">
                <span class="si-lbl">Branch Name</span>
                <div class="si-checklist" id="cmbBranchName" role="group" aria-label="Branch Name"></div>
            </div>
            <div class="si-fcol">
                <label class="si-lbl" for="FromDateHistory"><input type="checkbox" id="FromDateHistoryOn" checked aria-label="Use From Date"> From Date</label>
                <input id="FromDateHistory" type="date" class="si-input">
            </div>
            <div class="si-fcol">
                <label class="si-lbl" for="ToDateHistory"><input type="checkbox" id="ToDateHistoryOn" checked aria-label="Use To Date"> To Date</label>
                <input id="ToDateHistory" type="date" class="si-input">
            </div>
            <div class="si-fcol si-fnum">
                <label class="si-lbl" for="FromDocNoHistory">From Doc No</label>
                <input id="FromDocNoHistory" class="si-input" inputmode="numeric">
            </div>
            <div class="si-fcol si-fnum">
                <label class="si-lbl" for="ToDocNoHistory">To Doc No</label>
                <input id="ToDocNoHistory" class="si-input" inputmode="numeric">
            </div>
            <div class="si-fcol si-fcust">
                <label class="si-lbl" for="CmbCustomerHistory">Customer</label>
                <select id="CmbCustomerHistory" class="si-input"></select>
            </div>
            <div class="si-fcol si-fbtn">
                <button type="button" id="btnShowHistory" class="si-action">Show</button>
            </div>
            <div class="si-fcol si-radios" role="radiogroup" aria-label="Date type">
                <label><input type="radio" name="histDate" id="drdocdate" value="doc" checked> Doc Date</label>
                <label><input type="radio" name="histDate" id="rdmodifydate" value="modify"> Modify Date</label>
                <label><input type="radio" name="histDate" id="rdentrydate" value="entry"> Entry Date</label>
                <label><input type="radio" name="histDate" id="rdapproveddate" value="approved"> Approved Date</label>
            </div>
        </fieldset>
        <div class="si-gridbox">
            <div class="si-gridbar"><span>Main</span></div>
            <div class="si-gridwrap si-wide si-hist"><table class="si-grid" id="grdHistory" aria-label="History"></table></div>
        </div>
        <div class="si-gridbox">
            <div class="si-gridbar"><span>Invoice Detail Of Above Selected Row</span></div>
            <div class="si-gridwrap si-wide si-histdetail"><table class="si-grid" id="grdDetail" aria-label="Invoice detail"></table></div>
        </div>
    </section>
</div>

<!-- ============================================================== frmLoadGDN -->
<div class="si-dialog" id="frmLoadGDN" hidden role="dialog" aria-modal="true" aria-labelledby="loadGdnTitle">
    <div class="si-dialog-head"><span id="loadGdnTitle">Load GDN</span><button type="button" id="btnclose" aria-label="Close">×</button></div>
    <div class="si-dialog-filters">
        <div class="si-fcol si-fbranch"><span class="si-lbl">Branch</span><div class="si-checklist" id="CmbBranch" role="group" aria-label="Branch"></div></div>
        <div class="si-fcol"><label class="si-lbl" for="LoadFromDate">From Date</label><input id="LoadFromDate" type="date" class="si-input"></div>
        <div class="si-fcol"><label class="si-lbl" for="LoadToDate">To Date</label><input id="LoadToDate" type="date" class="si-input"></div>
        <div class="si-fcol si-fbtn"><button type="button" id="BtnShow" class="si-action">Show</button></div>
        <div class="si-fcol si-fbtn"><button type="button" id="BtnLoadGdn" class="si-action">Load</button></div>
    </div>
    <div class="si-gridwrap si-dialog-grid"><table class="si-grid" id="grdPendingGdn" aria-label="Pending GDN"></table></div>
    <div class="si-gridbar"><span>GDN Detail</span></div>
    <div class="si-gridwrap si-dialog-detail"><table class="si-grid" id="GridDetail" aria-label="GDN detail"></table></div>
</div>

<!-- ============================================================== ShortCutKeyPopUp -->
<div class="si-dialog si-small" id="shortcutDialog" hidden role="dialog" aria-modal="true" aria-labelledby="shortcutTitle">
    <div class="si-dialog-head"><span id="shortcutTitle">ShortCut Keys</span><button type="button" id="shortcutClose" aria-label="Close">×</button></div>
    <div class="si-gridwrap"><table class="si-grid" id="shortcutGrid"></table></div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js}"></script>
<script th:src="@{/build/js/countx_purchase_request.js}"></script>
<script th:src="@{/build/js/sale/sale_invoice.js?v=20260925a}"></script>
</body>
</html>
