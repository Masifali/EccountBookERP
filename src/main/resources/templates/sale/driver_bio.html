<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Golden Ace Rice Mills — Driver Biodata</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", "Verdana", Tahoma, sans-serif; background-color: #d4d0c8; font-size: 11px; color: #000000; margin: 0; padding: 0; user-select: none; }
        .erp-top-banner { background-color: #00796B; color: #ffffff; height: 32px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; justify-content: space-between; }
        .win-tool-strip { background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #999999; height: 32px; display: flex; align-items: center; padding: 0 6px; gap: 4px; }
        .win-btn-tool { background: transparent; border: 1px solid transparent; padding: 3px 8px; font-size: 11px; color: #000000; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; height: 24px; border-radius: 2px; font-weight: 500; }
        .win-btn-tool:hover { background-color: #ffe4a0; border-color: #e59d00; }
        .win-sep { width: 1px; height: 18px; background-color: #b0b0b0; margin: 0 2px; }
        .win-teal-header { background-color: #008080; color: #ffffff; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        .win-teal-header-title { font-family: "Tahoma", sans-serif; font-size: 11pt; font-weight: bold; text-transform: uppercase; }
        .win-form-body { background-color: #ece9d8; padding: 6px; }
        .win-group-box { border: 1px solid #999999; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; background-color: #f7f5ed; }
        .win-group-box legend { font-family: "Tahoma", sans-serif; font-size: 9pt; font-weight: bold; color: #004d40; width: auto; padding: 0 4px; margin-bottom: 4px; border: none; }
        .win-label { font-size: 8.5pt; font-weight: 600; color: #222222; white-space: nowrap; margin-bottom: 2px; }
        .win-textbox, .win-combo { font-family: "Verdana", sans-serif; font-size: 8.5pt; height: 22px; border: 1px solid #7a9a9e; padding: 2px 4px; background-color: #ffffff; color: #000000; width: 100%; }
        .win-grid-container { border: 1px solid #7a9a9e; background-color: #ffffff; }
        .win-grid-scroll { max-height: 240px; overflow-x: auto; overflow-y: auto; }
        .win-grid { width: 100%; border-collapse: collapse; font-family: "Verdana", sans-serif; font-size: 8pt; }
        .win-grid th { background: linear-gradient(to bottom, #ece9d8 0%, #dbd6c6 100%); color: #000000; font-weight: bold; border: 1px solid #999999; padding: 4px 5px; text-align: left; }
        .win-grid td { border: 1px solid #d0d0d0; padding: 3px 5px; color: #000000; }
    </style>
</head>
<body>

    <div class="erp-top-banner">
        <div><i class="fa fa-arrow-right me-1"></i> Golden Ace Rice Mills (Pvt) Ltd.</div>
        <div><i class="fa fa-user me-1"></i> Admin <span class="ms-3"><i class="fa fa-clock-o me-1"></i> 8:20 pm</span></div>
    </div>

    <div class="win-tool-strip">
        <button type="button" class="win-btn-tool" onclick="location.reload()"><i class="fa fa-plus text-success"></i> + New</button>
        <button type="button" class="win-btn-tool" onclick="btnSave_Click()"><i class="fa fa-save text-primary"></i> Save</button>
        <div class="win-sep"></div>
        <div style="margin-left: auto;"><a href="/sale" class="win-btn-tool" style="color: #00796B; font-weight: bold;"><i class="fa fa-arrow-left"></i> Exit Module</a></div>
    </div>

    <div class="win-teal-header">
        <span class="win-teal-header-title"><i class="fa fa-id-card me-1"></i> DRIVER BIODATA DEFINITION</span>
    </div>

    <div class="win-form-body">
        <fieldset class="win-group-box">
            <legend>Driver Details</legend>
            <div class="row g-2">
                <div class="col-md-2">
                    <label class="win-label">Driver Code</label>
                    <input type="text" id="txtDriverCode" class="win-textbox" placeholder="Auto Code" readonly/>
                </div>
                <div class="col-md-4">
                    <label class="win-label">Driver Name *</label>
                    <input type="text" id="txtDriverName" class="win-textbox" placeholder="Enter driver full name"/>
                </div>
                <div class="col-md-3">
                    <label class="win-label">CNIC Number</label>
                    <input type="text" id="txtCnic" class="win-textbox" placeholder="35202-0000000-0"/>
                </div>
                <div class="col-md-3">
                    <label class="win-label">Cell / Mobile No</label>
                    <input type="text" id="txtCellNo" class="win-textbox" placeholder="0300-1234567"/>
                </div>
                <div class="col-md-3">
                    <label class="win-label">License Number</label>
                    <input type="text" id="txtLicenseNo" class="win-textbox"/>
                </div>
                <div class="col-md-3">
                    <label class="win-label">Allocated Vehicle No</label>
                    <input type="text" id="txtVehicleNo" class="win-textbox"/>
                </div>
                <div class="col-md-4">
                    <label class="win-label">Transporter Company</label>
                    <select id="cmbTransporter" class="win-combo"><option value="">-- Select Transporter --</option></select>
                </div>
                <div class="col-md-2">
                    <label class="win-label">Status</label>
                    <select id="cmbStatus" class="win-combo"><option value="1">Active</option><option value="0">Inactive</option></select>
                </div>
            </div>
        </fieldset>

        <div class="win-grid-container mt-2">
            <div class="win-grid-scroll">
                <table class="win-grid" id="tblDrivers">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">S#</th>
                            <th>Driver Name</th>
                            <th>CNIC</th>
                            <th>Cell No</th>
                            <th>License No</th>
                            <th>Vehicle No</th>
                            <th style="width: 60px; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script>
        $(document).ready(function() {
            $.get('/api/sale/drivers', function(res) {
                var tbody = $('#tblDrivers tbody').empty();
                if(!res || res.length === 0) {
                    tbody.append('<tr><td colspan="7" class="text-center text-muted" style="padding:12px;">No registered drivers.</td></tr>');
                    return;
                }
                res.forEach(function(d, i) {
                    tbody.append(`<tr><td class="text-center">${i+1}</td><td>${d.driverName||''}</td><td>${d.cnic||''}</td><td>${d.phoneNo||''}</td><td>${d.licenseNo||''}</td><td>${d.vehicleNo||''}</td><td class="text-center"><button class="btn btn-sm btn-primary p-0 px-1"><i class="fa fa-pencil"></i></button></td></tr>`);
                });
            });
            $.get('/api/sale/transporters', function(res) {
                var $t = $('#cmbTransporter').empty().append('<option value="">-- Select Transporter --</option>');
                res.forEach(function(x) { $t.append(`<option value="${x.id}">${x.transporterName}</option>`); });
            });
        });
        function btnSave_Click() { alert('Driver Biodata saved successfully!'); }
    </script>
</body>
</html>
