<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goods Dispatch Notes</title><link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}"><style>
*{box-sizing:border-box}body{margin:0;font:12px Verdana;color:#000}.toolbar{height:31px;background:#f2f2f2;border-bottom:1px solid #aaa;padding:2px;display:flex;gap:2px;align-items:center}.tool{height:25px;border:1px solid transparent;background:#f2f2f2;padding:2px 8px}.tool:hover{border-color:#888;background:#fff2c8}.tool:disabled,.action:disabled{opacity:.5;cursor:wait}.title,.grid-title{background:#087878;color:#fff;font-weight:bold}.title{font-size:16px;height:25px;padding:3px 6px}.main{padding:2px}.group{border:1px solid #999;background:#eee;padding:6px;margin:2px 0}.head{display:grid;grid-template-columns:85px minmax(160px,1fr) 85px minmax(160px,1fr) 95px minmax(160px,1fr) 80px minmax(120px,.7fr);gap:4px;align-items:center}.ctl{width:100%;height:24px;border:1px solid #7f9db9;border-radius:0;background:#fff;padding:2px 4px;font:12px Verdana}.remarks{grid-column:2/9}.editor{display:grid;grid-template-columns:175px 120px 120px 90px 100px 90px 90px 90px 90px 120px 90px 90px 110px 120px 120px auto;gap:2px;padding:4px 3px;background:#f4f4f4;overflow-x:auto}.field label{display:block;height:17px;font-weight:bold;font-size:11px}.action{height:25px;border:1px solid #004d4d;background:#008080;color:#fff;font-weight:bold}.editor-actions{display:flex;align-items:end;gap:2px}.grid-title{height:22px;padding:3px 5px}.wrap{max-width:100vw;width:100%;overflow:auto;border:1px solid #999;max-height:300px}.data{border-collapse:collapse;min-width:1900px;width:max-content;font-size:11px}.data th{position:sticky;top:0;background:#e7e7e7;border:1px solid #999;padding:4px;white-space:nowrap}.data td{border:1px solid #bbb;padding:3px 5px;height:24px;white-space:nowrap}.row-link{color:#075f9f;text-decoration:underline;cursor:pointer}.empty{text-align:center;color:#666}.bottom{display:flex;background:#e5e5e5;border-top:1px solid #888;position:sticky;bottom:0;padding:2px}.tab{border:1px solid #888;background:#ddd;padding:4px 14px;font-weight:bold}.tab.active{background:#087878;color:#fff}.message{min-height:20px;padding:3px 6px;color:#b00000;font-weight:bold}.history-filter{display:grid;grid-template-columns:70px 130px 55px 80px 55px 80px 70px 220px auto;gap:4px;align-items:center;padding:6px;background:#eee}.busy{display:none;position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:5000;align-items:center;justify-content:center}.busy.show{display:flex}.loader{padding:12px 20px;background:#fff;border:1px solid #087878;color:#075f5f;font-weight:bold;box-shadow:0 2px 8px #777}.spin{display:inline-block;width:16px;height:16px;border:2px solid #bbb;border-top-color:#087878;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}.select2-container .select2-selection--single{height:25px!important;border:1px solid #7f9db9!important;border-radius:0!important}.select2-selection__rendered{line-height:23px!important;font-size:12px}.select2-selection__arrow{height:23px!important}
</style></head><body><div id="busy" class="busy"><div class="loader"><span class="spin"></span>Loading, please wait…</div></div><div class="page"><section id="formPane"><div class="toolbar"><button class="tool" id="btnNew">New</button><button class="tool" id="btnRefresh">Refresh</button><span>|</span><button class="tool" id="btnUpdate" hidden>Update</button><button class="tool" id="btnSave">Save</button><button class="tool" id="btnDelete" hidden>Delete</button><span>|</span><button class="tool" id="btnAttachment">Attachment</button><button class="tool" id="btnStockReport">Stock Report</button><button class="tool" id="btnGenerateStock">Generate Stock</button><button class="tool" id="btnShortcuts">ShortCut Keys</button></div><div class="title">Goods Dispatch Notes</div><div class="main"><fieldset class="group"><legend>Main Information</legend><div class="head"><label>Doc No,Date</label><div style="display:flex"><input id="docNo" class="ctl" readonly style="width:65px"><input id="docDate" type="date" class="ctl"></div><label>Customer</label><select id="customer" class="ctl searchable"></select><label>Transporter</label><select id="transporter" class="ctl searchable"></select><label>Freight Amount</label><input id="freight" type="number" step="any" class="ctl"><label>Vehicle No</label><input id="vehicleNo" class="ctl"><label>Bilty No</label><input id="biltyNo" class="ctl"><label>Factory Weight</label><input id="factoryWeight" type="number" step="any" class="ctl"><label>Balance Weight</label><input id="balanceWeight" class="ctl" readonly><label>Remarks</label><input id="remarks" class="ctl remarks"><input id="recordId" type="hidden"></div></fieldset>
<div class="editor"><div class="field"><label>Item Name</label><select id="lineItem" class="ctl searchable"></select></div><div class="field"><label>Brand</label><select id="lineBrand" class="ctl searchable"></select></div><div class="field"><label>Packing Type</label><select id="linePacking" class="ctl searchable"></select></div><div class="field"><label>Qty</label><input id="lineQty" type="number" step="any" class="ctl"></div><div class="field"><label>Pack UOM</label><select id="lineUom" class="ctl searchable"></select></div><div class="field"><label>Gross Weight</label><input id="lineGross" type="number" step="any" class="ctl"></div><div class="field"><label>E.b / Unit</label><input id="lineEbUnit" type="number" step="any" class="ctl"></div><div class="field"><label>E.b Total</label><input id="lineEbTotal" type="number" step="any" class="ctl"></div><div class="field"><label>Add Weight</label><input id="lineAdd" type="number" step="any" class="ctl"></div><div class="field"><label>City/Area</label><select id="lineCity" class="ctl searchable"></select></div><div class="field"><label>Net Weight</label><input id="lineNet" class="ctl" readonly></div><div class="field"><label>Stock Weight</label><input id="lineStock" class="ctl" readonly></div><div class="field"><label>Crop Year</label><select id="lineCrop" class="ctl searchable"></select></div><div class="field"><label>Job/Lot</label><select id="lineJob" class="ctl searchable"></select></div><div class="field"><label>Warehouse</label><select id="lineWarehouse" class="ctl searchable"></select></div><div class="editor-actions"><button id="btnAddLine" class="action">+</button><button id="btnCancelLine" class="action" hidden>Clear</button></div></div><div class="grid-title">Stock</div><div class="wrap"><table class="data"><thead><tr><th>Edit</th><th>Item Code</th><th>Item Name</th><th>Brand</th><th>Packing Type</th><th>Qty</th><th>Pack UOM</th><th>Gross Weight</th><th>E.b / Unit</th><th>E.b Total</th><th>Add Weight</th><th>City/Area</th><th>Net Weight</th><th>Stock Weight</th><th>Crop Year</th><th>Job/Lot</th><th>Warehouse</th><th>Voucher Code</th><th>Delete</th></tr></thead><tbody id="detailRows"></tbody></table></div></div></section>
<section id="historyPane" hidden><div class="toolbar"><button class="tool" id="btnHistoryNew">New</button><button class="tool" id="btnHistoryRefresh">Refresh</button></div><div class="title">Goods Dispatch Notes History</div><div class="history-filter"><label>From Date</label><input id="historyFrom" type="date" class="ctl"><label>To Date</label><input id="historyTo" type="date" class="ctl"><label>From No</label><input id="historyFromNo" class="ctl"><label>To No</label><input id="historyToNo" class="ctl"><label>Customer</label><select id="historyCustomer" class="ctl searchable"></select><button id="btnShowHistory" class="action">Show</button></div><div class="grid-title">Filtered Records</div><div class="wrap" style="max-height:450px"><table class="data"><thead id="historyHead"></thead><tbody id="historyRows"></tbody></table></div></section><div id="message" class="message"></div><div class="bottom"><button class="tab active" data-main="formPane">Form</button><button class="tab" data-main="historyPane">History</button></div></div><script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script><script th:src="@{/build/js/sale/gdn_direct.js}"></script></body></html>
