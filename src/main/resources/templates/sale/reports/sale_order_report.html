<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">

<title>Sale Order Report</title>
<link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}"><link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}"><style>/* 2026-10-02: Branch is the desktop checked UltraCombo cmbBranchName (countx_prod_combo.js checked mode) */.field .dtcombo-wrap.pcx-checked{width:100%;height:26px;min-width:0}.field .pcx-checked .dtcombo-input.pcx-field{height:26px;font:13px Verdana,Arial,sans-serif}select.dtcombo-native[multiple][data-dtcombo-checked]{display:none!important}</style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<h1>Sale Order Report</h1>
<nav aria-label="Report views"><button type="button" data-tab="detail" aria-selected="true">Detail Register</button><button type="button" data-tab="summary" aria-selected="false">Summary</button><a href="/sale/reports">Sales Reports</a></nav>
<div id="message" role="status" aria-live="polite"></div>
<section id="detailPanel">
<div class="toolbar"><button type="button" data-new="detail">New</button><button type="button" data-refresh="detail">Refresh</button></div>
<form id="detailForm"><fieldset><legend>Filters</legend><div class="filters" id="detailFilters"></div><button type="submit" class="show">Show</button></fieldset></form>
<div class="toolbar"><label>View <select id="detailView"><option value="header">Main / Detail</option><option value="detail">Detail Register</option></select></label><span id="detailCount">0 records</span></div>
<div id="orderActions" class="toolbar" hidden><button type="button" data-order-action="Complete" hidden>Complete Orders</button><button type="button" data-order-action="Cancel" hidden>Cancel Orders</button><button type="button" data-order-action="Open" hidden>Open Orders</button><button type="button" data-order-action="AutoComplete" hidden>Auto Complete Orders</button></div>
<div class="grid"><table id="detailTable"><thead></thead><tbody></tbody></table></div>
<section id="linesPanel"><h2>Order Detail</h2><div class="grid"><table id="linesTable"><thead></thead><tbody></tbody></table></div></section>
</section>
<section id="summaryPanel" hidden>
<div class="toolbar"><button type="button" data-new="summary">New</button><button type="button" data-refresh="summary">Refresh</button></div>
<form id="summaryForm"><fieldset><legend>Filters</legend><div class="filters" id="summaryFilters"></div><button type="submit" class="show">Show</button></fieldset></form>
<h2>Summary - <span id="summaryCount">0 records</span></h2><div class="grid"><table id="summaryTable"><thead></thead><tbody></tbody></table></div>
</section>
<div id="loader" role="status" aria-live="polite" hidden><span class="spinner"></span> Loading...</div>

<script th:src="@{/build/js/sale/report_approval_history.js?v=20260926a}"></script>
<script th:src="@{/build/js/sale/sale_order_report.js?v=20261002ck}"></script>
