<!--

<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm" id="DeliveryOrderHistory" style="min-width:1000px;min-height:560px;">

    <div class="p2"><div class="ts">
        <button type="button" id="reset" title="Ctrl+N"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#2e9b45"/><path d="M8 4v8M4 8h8" stroke="#fff" stroke-width="2"/></svg><span><u>N</u>ew</span></button><button type="button" id="refresh" title="Ctrl+R"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="#1f6fc5" stroke-width="2"/><path d="M13.5 1.5v4h-4z" fill="#1f6fc5"/></svg><span><u>R</u>efresh</span></button><button type="button" id="print" title="Ctrl+P"><svg viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="4" fill="#fff" stroke="#555"/><rect x="1.5" y="5.5" width="13" height="6" rx="1" fill="#6b7785"/><rect x="4" y="9.5" width="8" height="5" fill="#fff" stroke="#555"/></svg><span>263-Print</span></button><button type="button" id="shortcuts" title="Ctrl+Alt"><svg viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="1.5" fill="#fff" stroke="#555"/><path d="M4 7h1M7 7h1M10 7h1M4 10h8" stroke="#555"/></svg><span>ShortCut Keys</span></button>
    </div></div>

    <div class="teal" style="height:28px;"><span class="cap" style="left:6px;top:4px;">Delivery Order Register</span></div>
    <div class="pfx" style="height:112px;">
        <div class="gb" style="left:5px;top:2px;width:836px;height:103px;">
            <div class="gb-frame"></div><span class="gb-cap">Filters</span>
            <span class="lbl" style="left:6px;top:19px;">Date Type</span>
            <select id="cmbdatetype" data-dtcombo="single" data-dtcombo-caption="Date Type" style="position:absolute;left:70px;top:13px;width:134px;height:26px;"></select>
            <span class="lbl" style="left:6px;top:48px;">From</span>
            <input type="date" id="DateFrom" class="tb" style="left:70px;top:44px;width:134px;height:23px;">
            <span class="lbl" style="left:6px;top:76px;">To</span>
            <input type="date" id="DateTo" class="tb" style="left:70px;top:72px;width:134px;height:23px;">
            <span class="lbl" style="left:209px;top:19px;">Customer</span>
            <select id="cmbSupplier" data-dtcombo="single" data-dtcombo-caption="Customer" style="position:absolute;left:269px;top:13px;width:211px;height:26px;"></select>
            <span class="lbl" style="left:209px;top:48px;">Item</span>
            <select id="cmbItem" data-dtcombo="single" data-dtcombo-caption="Item" style="position:absolute;left:269px;top:42px;width:211px;height:26px;"></select>
            <span class="lbl" style="left:209px;top:76px;">Status</span>
            <select id="cmbStatus" data-dtcombo="single" data-dtcombo-caption="Status" style="position:absolute;left:269px;top:70px;width:211px;height:26px;"></select>
            <span class="lbl" style="left:485px;top:19px;">Delivery Type</span>
            <select id="cmbDeliveryType" data-dtcombo="single" data-dtcombo-caption="Delivery Type" style="position:absolute;left:566px;top:13px;width:157px;height:26px;"></select>
            <span class="lbl" style="left:485px;top:48px;">Invoice No</span>
            <select id="CmbInvoice" data-dtcombo="single" data-dtcombo-caption="Invoice No" style="position:absolute;left:566px;top:42px;width:157px;height:26px;"></select>
            <label class="rbx" style="left:728px;top:14px;"><input type="radio" name="rdWt" value="0" checked>All</label>
            <label class="rbx" style="left:728px;top:31px;"><input type="radio" name="rdWt" value="1">1st Wt Only</label>
            <label class="rbx" style="left:728px;top:48px;"><input type="radio" name="rdWt" value="2">With 2nd Wt</label>
            <button type="button" id="show" class="teal-btn vd" style="left:660px;top:70px;width:63px;height:26px;" title="Ctrl+S">Show</button>
        </div>
        <label class="rbx" style="left:847px;top:44px;"><input type="radio" name="rdRef" value="0" checked>All</label>
        <label class="rbx" style="left:847px;top:62px;"><input type="radio" name="rdRef" value="1">Reffered</label>
        <label class="rbx" style="left:847px;top:80px;"><input type="radio" name="rdRef" value="2">Not Reffered</label>
    </div>
    <div class="p4">
    <div class="teal" style="height:28px;"><span class="cap" style="left:6px;top:4px;">Detail</span></div>
    <div class="gridbox">
        <div class="grid" id="grid" tabindex="0"><table class="g sg" id="results"><colgroup></colgroup><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="nav" id="nav" hidden>
            <button type="button" data-nav="first" title="First">|&lt;</button><button type="button" data-nav="prev" title="Previous">&lt;</button>
            <span id="navText"></span>
            <button type="button" data-nav="next" title="Next">&gt;</button><button type="button" data-nav="last" title="Last">&gt;|</button>
        </div>
    </div>
    </div>
</div>
</div>

<dialog class="sck" id="shortcutDialog">
    <div class="hd">ShortCut Keys</div>
    <table><thead><tr><th>KeyCombination</th><th>Description</th></tr></thead><tbody id="shortcutRows"></tbody></table>
    <div class="ft"><button type="button" id="closeShortcuts">Close</button></div>
</dialog>
