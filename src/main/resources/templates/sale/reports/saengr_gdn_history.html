<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!--

Geometry from InitializeComponent(): toolStrip3 (New | Refresh | 1612-Register | ShortCut Keys), panel3 teal 26px "Good Dispatch Notes",
panel2 171px white holding groupBox1 "Filters" 4,4 1029x164, panel5 teal 29px "History", the grid under it.
Lookups /api/sale/saengr/gdn-history/lookups, rows via .../rows, print /sale/reports/saengr/print/gdn-history. Logic: /build/js/countx_saengr_555.js.
-->
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm" id="frmGDNHistory_Engr" style="min-width:1034px;min-height:560px;">

    <div class="p2"><div class="ts">
        <button type="button" id="reset" title="Ctrl+N"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#2e9b45"/><path d="M8 4v8M4 8h8" stroke="#fff" stroke-width="2"/></svg><span><u>N</u>ew</span></button><button type="button" id="refresh" title="Ctrl+R"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="#1f6fc5" stroke-width="2"/><path d="M13.5 1.5v4h-4z" fill="#1f6fc5"/></svg><span><u>R</u>efresh</span></button><button type="button" id="print" title="Ctrl+P"><svg viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="4" fill="#fff" stroke="#555"/><rect x="1.5" y="5.5" width="13" height="6" rx="1" fill="#6b7785"/><rect x="4" y="9.5" width="8" height="5" fill="#fff" stroke="#555"/></svg><span>1612-Register</span></button><button type="button" id="shortcuts" title="Ctrl+Alt"><svg viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="1.5" fill="#fff" stroke="#555"/><path d="M4 7h1M7 7h1M10 7h1M4 10h8" stroke="#555"/></svg><span>ShortCut Keys</span></button>
    </div></div>

    <div class="teal" style="height:26px;"><span class="cap" style="left:5px;top:3px;">Good Dispatch Notes</span></div>
    <div class="pfx" style="height:171px;">
        <div class="gb" style="left:4px;top:4px;width:1029px;height:164px;">
            <div class="gb-frame"></div><span class="gb-cap">Filters</span>
            <span class="lbl" style="left:4px;top:19px;">Date Type</span>
            <select id="cmbperemeter" data-dtcombo="single" data-dtcombo-caption="Date Type" style="position:absolute;left:119px;top:13px;width:240px;height:26px;"></select>
            <span class="lbl" style="left:4px;top:49px;">From &amp; To Date</span>
            <input type="date" id="datGdnFromDate" class="tb" style="left:119px;top:45px;width:112px;height:23px;">
            <input type="date" id="dateGdnToDate" class="tb" style="left:234px;top:45px;width:122px;height:23px;">
            <span class="lbl" style="left:4px;top:79px;">Gdn No From &amp; To</span>
            <input type="text" id="txtGdnNoFrom" class="tb" style="left:119px;top:75px;width:112px;height:23px;">
            <input type="text" id="txtGdnNoTo" class="tb" style="left:234px;top:75px;width:122px;height:23px;">
            <span class="lbl" style="left:4px;top:109px;">Order No From &amp; To</span>
            <input type="text" id="txtOrderNoFrom" class="tb" style="left:119px;top:105px;width:112px;height:23px;">
            <input type="text" id="txtOrderNoTo" class="tb" style="left:234px;top:105px;width:122px;height:23px;">
            <span class="lbl" style="left:4px;top:138px;">Parent Category</span>
            <select id="cmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Category" style="position:absolute;left:119px;top:132px;width:240px;height:26px;"></select>

            <span class="lbl" style="left:363px;top:19px;">Item Category</span>
            <select id="cmbCategory" data-dtcombo="single" data-dtcombo-caption="Item Categories" style="position:absolute;left:446px;top:13px;width:224px;height:26px;"></select>
            <span class="lbl" style="left:363px;top:49px;">Item Type</span>
            <select id="cmbItemtype" data-dtcombo="single" data-dtcombo-caption="Item Type" style="position:absolute;left:446px;top:43px;width:224px;height:26px;"></select>
            <span class="lbl" style="left:363px;top:79px;">Item class</span>
            <select id="cmbitemClass" data-dtcombo="single" data-dtcombo-caption="Item Class" style="position:absolute;left:446px;top:73px;width:224px;height:26px;"></select>
            <span class="lbl" style="left:363px;top:109px;">Item</span>
            <select id="cmbItem" data-dtcombo="single" data-dtcombo-caption="Item" style="position:absolute;left:446px;top:103px;width:224px;height:26px;"></select>
            <span class="lbl" style="left:363px;top:138px;">WareHouse</span>
            <select id="cmbware" data-dtcombo="single" data-dtcombo-caption="WareHouse" style="position:absolute;left:446px;top:132px;width:224px;height:26px;"></select>

            <span class="lbl" style="left:675px;top:19px;">JobLot</span>
            <select id="cmbjoblot" data-dtcombo="single" data-dtcombo-caption="JobLot" style="position:absolute;left:755px;top:13px;width:269px;height:26px;"></select>
            <span class="lbl" style="left:675px;top:49px;">Customer </span>
            <select id="CmbSupplier" data-dtcombo="single" data-dtcombo-caption="Supplier" style="position:absolute;left:755px;top:43px;width:269px;height:26px;"></select>
            <span class="lbl" style="left:675px;top:79px;">Requested By</span>
            <select id="CmbRequestedByHistory" data-dtcombo="single" data-dtcombo-caption="Requested By" style="position:absolute;left:755px;top:73px;width:269px;height:26px;"></select>
            <span class="lbl" style="left:675px;top:109px;">Delivery Type</span>
            <select id="CmbDeliveryType" data-dtcombo="single" data-dtcombo-caption="Delivery Type" style="position:absolute;left:755px;top:103px;width:269px;height:26px;"></select>

            <label class="rbx" style="left:675px;top:136px;"><input type="radio" name="rdRef" value="0" checked>All</label>
            <label class="rbx" style="left:725px;top:136px;"><input type="radio" name="rdRef" value="1">Reffered</label>
            <label class="rbx" style="left:809px;top:136px;"><input type="radio" name="rdRef" value="2">Not Reffered</label>
            <button type="button" id="show" class="teal-btn vd" style="left:962px;top:133px;width:62px;height:25px;" title="Ctrl+S">Show</button>
        </div>
    </div>
    <div class="p4">
    <div class="teal" style="height:29px;"><span class="cap" style="left:4px;top:3px;">History</span></div>
    <div class="gridbox">
        <div class="grid" id="grid" tabindex="0"><table class="g sg" id="results"><colgroup></colgroup><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="nav" id="nav" hidden>
            <button type="button" data-nav="first" title="First">|&lt;</button><button type="button" data-nav="prev" title="Previous">&lt;</button>
            <span id="navText"></span>
            <button type="button" data-nav="next" title="Next">&gt;</button><button type="button" data-nav="last" title="Last">&gt;|</button>
        </div>
    </div>
    </div>
</div>
</div>

<dialog class="sck" id="shortcutDialog">
    <div class="hd">ShortCut Keys</div>
    <table><thead><tr><th>KeyCombination</th><th>Description</th></tr></thead><tbody id="shortcutRows"></tbody></table>
    <div class="ft"><button type="button" id="closeShortcuts">Close</button></div>
</dialog>

<dialog class="sck" id="attachDialog">
    <div class="hd">Attachments</div>
    <table><thead><tr><th>AttachmentName</th><th>CustomName</th><th>EntryDate</th></tr></thead><tbody id="attachRows"></tbody></table>
    <div class="ft"><button type="button" id="closeAttach">Close</button></div>
</dialog>
