<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDN Report</title>
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"><link rel="stylesheet" th:href="@{/css/sale-gdn-report.css?v=20260926}"></head><body>
<div id="loading" hidden role="status"><span class="spinner"></span>Loading, please wait…</div>
<nav class="toolbar"><button id="new">New</button><button id="refresh">Refresh</button><button id="register">261-GDN Register</button><button id="shortcuts">ShortCut Keys</button><a href="/sale/reports">Exit to Sales Reports</a></nav>
<h1>Goods Dispatch Notes Report</h1>
<fieldset class="filters"><legend>Filters</legend>
<div class="filter-column first">
<label>Branch Name<details id="branchPicker"><summary id="branchCaption">Select Branch</summary><div class="branch-popup"><input id="branchSearch" type="search" placeholder="Search branches" aria-label="Search branches"><label><input type="checkbox" id="allBranches">Select all</label><div id="branchOptions"></div></div></details></label>
<label>Date Type<select id="dateType" data-dtcombo="single"><option value="1">This Day</option><option value="2" selected>This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select></label>
<label>From Date<input id="fromDate" type="date"></label><label>To Date<input id="toDate" type="date"></label></div>
<div class="filter-column second"><label>Gdn No From<input id="fromNo" inputmode="numeric" data-guard="integer"></label><label>Gdn No To<input id="toNo" inputmode="numeric" data-guard="integer"></label><label>Order No From<input id="orderNoFrom" inputmode="numeric" data-guard="integer"></label><label>Order No To<input id="orderNoTo" inputmode="numeric" data-guard="integer"></label></div>
<div class="filter-column third"><label>Parent Category<select id="parentCategoryId" data-activity="ParentCategories" data-dtcombo="single"></select></label><label>Item Category<select id="categoryId" data-activity="ItemCategories" data-dtcombo="single"></select></label><label>Item Type<select id="itemTypeId" data-activity="ItemTypes" data-dtcombo="single"></select></label><label>Item Class<select id="itemClassId" data-activity="ItemClassGroup" data-dtcombo="single"></select></label></div>
<div class="filter-column fourth"><label>Item Name<select id="itemId" data-activity="Item" data-dtcombo="single"></select></label><label>Customer Name<select id="customerId" data-activity="Supplier" data-dtcombo="single"></select></label><div class="split"><label>Crop Year<select id="cropYearId" data-activity="CropYear" data-dtcombo="single"></select></label><label>JobLot<select id="jobLotId" data-activity="JobLot" data-dtcombo="single"></select></label></div><div class="split last"><label>WareHouse<select id="warehouseId" data-activity="Warehouse" data-dtcombo="single"></select></label><button id="show" class="primary">Show</button></div></div>
</fieldset>
<div id="message" role="alert"></div><section id="gridSection"><div class="grid-title">History <span id="recordCount"></span><button id="fullscreen">Fullscreen</button></div><div class="table-wrap" tabindex="0"><table id="report"><colgroup id="columns"></colgroup><thead id="headers"></thead><tbody id="rows"><tr><td>Press Show to load.</td></tr></tbody><tfoot id="totals"></tfoot></table></div></section>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/build/js/sale/gdn_report.js?v=20260926}"></script><script th:src="@{/build/js/countx_desktop_combo.js?v=20260926layout}"></script><script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script></body></html>
