<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
<title>Outward Gate Pass Report</title>
<link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}"><link rel="stylesheet" th:href="@{/build/css/sale/sale_order_report.css}">
</head><body>
<h1>Outward Gate Pass Report</h1><nav><button type="button" id="newButton">New</button><button type="button" id="refreshButton">Refresh</button><a href="/sale/reports">Sales Reports</a></nav>
<form id="reportForm"><fieldset><legend>Filters</legend><div class="filters">
<label class="field">Date Type<select id="dateType" class="searchable"><option value="1">This Day</option><option value="2" selected>This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select></label>
<label class="field">From Date<input id="fromDate" type="date"></label><label class="field">To Date<input id="toDate" type="date"></label>
<label class="field wide">Branch<select id="branchIds" class="searchable" multiple></select></label>
<label class="field">GP From<input id="fromNo" type="number" step="1"></label><label class="field">GP To<input id="toNo" type="number" step="1"></label>
<label class="field">Customer<select id="customerId" class="searchable"></select></label><label class="field">Gate Pass Type<select id="gatePassType" class="searchable"></select></label>
<label class="field">Status<select id="status" class="searchable"><option value=""></option><option>Open</option><option>Accepted</option><option>Rejected</option></select></label>
</div><button type="submit" id="showButton" class="show">Show</button></fieldset></form>
<div id="message" role="status" aria-live="polite"></div><h2>Gate Pass Outward - <span id="recordCount">0 records</span></h2>
<div class="grid"><table id="reportTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
<div id="loader" role="status" aria-live="polite" hidden><span class="spinner"></span> Loading...</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_doc_link.js?v=20261001pr}"></script><script th:src="@{/build/js/sale/outward_report.js?v=20260926a}"></script>
</body></html>
