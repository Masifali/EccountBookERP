<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GatePass Vehicle Entry And Exit Time Analysis</title>
<link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f0f0;font:13px Tahoma,Arial,sans-serif;color:#111}
h1,h2{margin:0;background:#008080;color:white;padding:6px 8px}h1{font-size:19px}h2{font-size:14px}
nav{display:flex;gap:4px;padding:5px;align-items:center}nav a{margin-left:auto;color:#006565}
button,input,select{font:inherit;min-height:26px}button{cursor:pointer;border:1px solid #999;padding:3px 12px}
button:disabled{cursor:wait;opacity:.6}fieldset{margin:6px;border:1px solid #aaa;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:7px 12px;align-items:end}.field{display:flex;flex-direction:column;gap:3px;min-width:130px}
.wide{width:230px}.short{width:90px;min-width:90px}.field input,.field select{width:100%;border:1px solid #aaa;background:white}
.status{display:flex;gap:10px;align-items:center;padding:8px 0}.status label{display:flex;gap:4px;align-items:center}
#showButton{background:#008080;color:white;border:1px solid #006868}#message{padding:4px 8px;color:#a40000;min-height:22px}
.grid{margin:6px;overflow:auto;max-height:55vh;border:1px solid #aaa;background:white;max-width:calc(100% - 12px)}
table{border-collapse:collapse;width:100%;table-layout:auto}th,td{border:1px solid #c8c8c8;padding:4px 6px;white-space:nowrap;text-align:left}
th{background:#e8e8e8;position:sticky;top:0;z-index:1}td a{color:#006c83}.group td{background:#def0f0;font-weight:bold}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px}.summary section{min-width:0}.summary .grid{max-height:240px;margin:0;max-width:100%}
#loader{position:fixed;right:12px;top:8px;z-index:20;background:white;color:#006868;border:1px solid #008080;padding:8px 12px;box-shadow:0 2px 8px #0003}
#loader::before{content:"";display:inline-block;width:13px;height:13px;margin-right:7px;border:2px solid #d3e8e8;border-top-color:#008080;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.summary{grid-template-columns:1fr}}
.multi{position:relative;width:100%}.multi-btn{width:100%;height:26px;min-height:26px;background:white;border:1px solid #aaa;text-align:left;padding:0 4px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;white-space:nowrap;font:13px Tahoma,Arial,sans-serif}
.multi-btn .caret{color:#555;font-size:11px}.multi-list{position:absolute;z-index:60;top:26px;left:0;min-width:100%;max-height:240px;overflow:auto;background:white;border:1px solid #aaa;padding:3px 6px;box-shadow:0 2px 6px #0003;display:none}
.multi-list label{display:flex;gap:5px;align-items:center;white-space:nowrap;padding:1px 0}.multi.open .multi-list{display:block}
.select2-container{max-width:100%}.select2-container .select2-selection--single{min-height:26px;border-radius:0}.select2-container .select2-selection--multiple{border-radius:0;min-height:26px}
</style>
</head><body>
<h1>GatePass Vehicle Entry And Exit Time Analysis</h1>
<nav><button id="newButton" type="button">New</button><button id="refreshButton" type="button">Refresh</button><a href="/sale/reports">Sales Reports</a></nav>
<fieldset><legend>Filters</legend><div class="filters">
<label class="field">Date Type<select id="dateType"><option value="1">This Day</option><option value="2" selected>This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select></label>
<label class="field">From Date<input type="date" id="fromDate"></label><label class="field">To Date<input type="date" id="toDate"></label>
<div class="field wide">Branch Name<div class="multi" id="branchMulti"><button type="button" class="multi-btn" id="branchMultiBtn"><span id="branchMultiText"></span><span class="caret">&#9662;</span></button><div class="multi-list" id="branchMultiList"></div></div><select multiple id="branchIds" hidden></select></div>
<label class="field short">GP No From<input type="number" id="fromNo" min="0" step="1"></label><label class="field short">GP No To<input type="number" id="toNo" min="0" step="1"></label>
<label class="field wide">Party Name<select id="customerId" class="searchable"><option value="0">...Select Any Value...</option></select></label>
<label class="field wide">Gate Pass<select id="documentTypeId" class="searchable"><option value="0">...Select Any Value...</option></select></label>
<button type="button" id="showButton">Show</button></div>
<div class="status"><label><input type="radio" name="status" value="" checked>All GP</label><label><input type="radio" name="status" value="Open">In Process GP</label><label><input type="radio" name="status" value="Accepted,Rejected">Processed GP</label></div></fieldset>
<div id="message" role="status"></div><h2>Vehicle Time Analysis - <span id="recordCount">0</span> records</h2>
<div class="grid"><table id="detailTable"><thead></thead><tbody></tbody></table></div>
<div class="summary"><section><h2>Inward</h2><div class="grid"><table id="inwardTable"><thead></thead><tbody></tbody></table></div></section>
<section><h2>Outward</h2><div class="grid"><table id="outwardTable"><thead></thead><tbody></tbody></table></div></section></div>
<div id="loader" role="status" aria-live="polite" hidden>Loading...</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_doc_link.js?v=20260930so}"></script><script th:src="@{/build/js/sale/gatepass_time_analysis.js?v=20260930br}"></script>
</body></html>
