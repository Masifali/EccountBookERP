<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
<title>Sale Invoice Report (With Activities)</title>
<link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
<link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css}">
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}"><link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
<link rel="stylesheet" th:href="@{/build/css/sale/invoice_activities_report.css?v=20261004a}">
</head><body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<main id="invoiceActivitiesReport">
<header><h1>Sale Invoice Report (With Activities)</h1><a href="/sale/reports">Sales Reports</a></header>
<nav class="toolbar" aria-label="Report actions"><button type="button" id="newButton">⊕ Reset</button><button type="button" id="refreshButton">⟳ Refresh</button><button type="button" id="printButton" disabled>▣ Print</button><button type="button" id="shortcutsButton">ShortCut Keys</button></nav>
<form id="reportForm"><fieldset><legend>Filters</legend><div class="filters" id="filters">
<label class="field">Date Type<select id="dateType" class="searchable"><option value=""></option><option value="1">This Day</option><option value="2" selected>This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select></label>
<label class="field">From Date<input id="fromDate" name="fromDate" type="date"></label><label class="field">To Date<input id="toDate" name="toDate" type="date"></label>
<label class="field">From Doc No<input id="fromNo" name="fromNo" type="number" step="1"></label><label class="field">To Doc No<input id="toNo" name="toNo" type="number" step="1"></label>
<label class="field wide">Branch<select id="branchIds" name="branchIds" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Branch Name"></select></label>
</div><button type="submit" id="showButton" class="show">Show</button></fieldset></form>
<div id="message" role="status" aria-live="polite"></div><h2><span id="activityTitle">Sales Register</span><span id="recordCount">0 records</span><span id="gridTools"></span></h2>
<div id="groupStrip" class="group-strip">Drag a column header here to group by that column.<button type="button" id="clearGrouping" hidden>Clear grouping</button></div>
<div class="grid" id="reportGrid" data-gridbar-form="frmEvaulationDetailSalesReports" data-gridbar-grid="SalesRegister" data-gridbar-title="Sale Invoice Report" data-gridbar-mount="#gridTools" data-gridbar-reorder="false"><table id="reportTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
<dialog id="shortcutsDialog"><h2>ShortCut Keys</h2><p>Ctrl+S: Show · Ctrl+R: Refresh · Ctrl+N: Reset · Ctrl+P: Print</p><form method="dialog"><button>Close</button></form></dialog>
</main>
<div id="loader" role="status" aria-live="polite" hidden><span class="spinner"></span> Loading...</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}"></script><script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_doc_link.js?v=20261001pr}"></script><script th:src="@{/build/js/sale/report_approval_history.js?v=20260926a}"></script><script th:src="@{/build/js/sale/invoice_activities_report.js?v=20261004a}"></script><script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body></html>
