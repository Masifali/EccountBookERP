<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Account Transfer - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261003xa}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_account_movement.css?v=20261003a}"/>
</head>
<!--
  Admin Panel -> "Account Movement": DashboardNew.cs:3151 btnAccountMovement_Click -> Architecture.WinApp.AccountToAccountTransfer
  (Text "Account Transfer", ClientSize 537 x 156, KeyPreview).
  panel2 (0,0 537x29): toolStrip1 Verdana 9.75 - btnRefresh "&Refresh" (Segoe UI 9) | btnUpdate "Update".
  panel6 (0,29 537x29, rgb 10,110,110): label15 "Accounts To Transfer" Tahoma 12 bold white (5,4);
         chkAccountTransactionsMerge "Account Transactions Merge" Segoe UI 9 bold white (351,5), Anchor Top|Right.
  panel7 (0,58 537x98, White): label1 "From Parent" (32,9) CmbParentAccountToFilter (160,4) 295x26 [Leave];
         lbltocompany "Account Title" (32,36) CmbDetailAccount (160,31) [Leave];
         lblThirdLevelAccount "3rd Level Accounts" (32,63) CmbThirdLevelAccounts (160,58);
         lblToAccountTitle "To Account Title" (32,63) CmbToChartOfAccount (160,58) - shown instead when Merge is checked.
-->
<body class="am-body" data-screen="AccountToAccountTransfer">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="am-scroll">
<div class="am-form" id="AccountToAccountTransfer">
    <div class="am-panel2">
        <div class="am-toolstrip" id="toolStrip1">
            <button type="button" id="btnRefresh" class="am-tool" title="Refresh (Ctrl+R)"><i class="fa fa-refresh"></i><span><u>R</u>efresh</span></button>
            <button type="button" id="btnUpdate" class="am-tool"><i class="fa fa-pencil"></i><span>Update</span></button>
        </div>
    </div>
    <div class="am-panel6">
        <span id="label15">Accounts To Transfer</span>
        <label class="am-chk" for="chkAccountTransactionsMerge"><input type="checkbox" id="chkAccountTransactionsMerge"/><span>Account Transactions Merge</span></label>
    </div>
    <div class="am-panel7">
        <label class="am-lbl" id="label1" for="CmbParentAccountToFilter" style="left:32px;top:9px;">From Parent</label>
        <select id="CmbParentAccountToFilter" class="win-combo" data-columns="From Parent|AccountCode|AccountType|AccountClass|ParentAccount"
                style="position:absolute;left:160px;top:4px;width:295px;height:26px;"></select>

        <label class="am-lbl" id="lbltocompany" for="CmbDetailAccount" style="left:32px;top:36px;">Account Title</label>
        <select id="CmbDetailAccount" class="win-combo" data-columns="Account Title|AccountCode|AccountClass|AccountType|ParentAccountTitle"
                style="position:absolute;left:160px;top:31px;width:295px;height:26px;"></select>

        <label class="am-lbl" id="lblThirdLevelAccount" for="CmbThirdLevelAccounts" style="left:32px;top:63px;">3rd Level Accounts</label>
        <div id="boxThirdLevel" style="position:absolute;left:160px;top:58px;width:295px;height:26px;">
            <select id="CmbThirdLevelAccounts" class="win-combo" data-columns="3rd Level Account|AccountCode|AccountType|AccountClass|ParentAccount"
                    style="position:absolute;left:0;top:0;width:295px;height:26px;"></select>
        </div>

        <label class="am-lbl am-hidden" id="lblToAccountTitle" for="CmbToChartOfAccount" style="left:32px;top:63px;">To Account Title</label>
        <div id="boxToAccount" class="am-hidden" style="position:absolute;left:160px;top:58px;width:295px;height:26px;">
            <select id="CmbToChartOfAccount" class="win-combo" data-columns="To Account Title|AccountCode|AccountClass|AccountType|ParentAccountTitle"
                    style="position:absolute;left:0;top:0;width:295px;height:26px;"></select>
        </div>
    </div>
</div>
</div>
<div class="am-msg-back" id="amMsg" role="dialog" aria-modal="true">
    <div class="am-msg"><div class="am-msg-title">Account Transfer</div><div class="am-msg-body" id="amMsgText"></div>
        <div class="am-msg-foot"><button type="button" id="amMsgOk">OK</button></div></div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003xa}"></script>
<script th:src="@{/build/js/countx_account_movement.js?v=20261003a}"></script>
</body>
</html>
