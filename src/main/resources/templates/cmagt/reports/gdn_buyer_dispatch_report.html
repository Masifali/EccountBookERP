                inner += '<select class="fc" id="approved" style="' + s + '"><option value=""></option><option>UnApproved</option><option>Approved</option><option>All</option></select>';
            } else if (id === 'reportType') {
                inner += '<select class="fc" id="reportType" style="' + s + '">' + CFG.types.map(function (t) {
                    return '<option>' + esc(t) + '</option>'; }).join('') + '</select>';
            } else {
                var c = CFG.combos.filter(function (k) { return k[0] === id; })[0];
                inner += '<select class="fc" id="' + id + '" style="' + s + '"' + (c && /not applied/.test(c[1]) ? ' title="' + esc(c[1]) + '"' : '') + '></select>';
            }
        });
        var h = '<div class="rpt-band"><span>' + esc(LAYOUT.title) + '</span></div>';
        h += LAYOUT.group ? '<fieldset><legend>' + esc(LAYOUT.group) + '</legend><div class="inner">' + inner + '</div></fieldset>' : inner;
        el('filters').style.height = LAYOUT.h + 'px';
        el('filters').innerHTML = h;
        if (CFG.tb) Array.prototype.forEach.call(document.querySelectorAll('input[name="tbSide"]'), function (r) {
            r.addEventListener('change', function () { if (lastData.length) render(lastData); });
        });
        if (CFG.approval) el('approved').value = CFG.approvedDefault || '';
        if (!CFG.tb) {
            el('parentItemIds').addEventListener('change', function () { msSync(); bindCombos(); });
            el('parentMsBtn').addEventListener('click', function (e) { e.stopPropagation(); el('parentMs').classList.toggle('open'); });
            el('parentMsList').addEventListener('click', function (e) { e.stopPropagation(); });
            el('parentMsList').addEventListener('change', function (e) {
                var cb = e.target; if (!cb.classList || !cb.classList.contains('ms-cb')) return;
                Array.prototype.forEach.call(el('parentItemIds').options, function (o) { if (o.value === cb.value) o.selected = cb.checked; });
                el('parentItemIds').dispatchEvent(new Event('change'));
            });
            document.addEventListener('click', function () { var m = el('parentMs'); if (m) m.classList.remove('open'); });
            msSync();
        }
        if (CFG.tb) el('datePreset').addEventListener('change', applyPreset);
    }
    /* Rebuild the check-box list from the hidden <select multiple>. */
    function msSync() {
        var s = el('parentItemIds'), list = el('parentMsList'), btn = el('parentMsBtn'); if (!s || !list) return;
        var sel = [];
        list.innerHTML = Array.prototype.map.call(s.options, function (o) {
            if (o.selected) sel.push(o.text);
            return '<label><input type="checkbox" class="ms-cb" value="' + esc(o.value) + '"' + (o.selected ? ' checked' : '') + '> ' + esc(o.text) + '</label>';
        }).join('');
        btn.textContent = sel.join(', ');
        btn.title = sel.join(', ');
    }
    /* Styled replacement for window.prompt('Remarks'): resolves the text, or null on Cancel. */
    function askRemarks(reqType) {
        return new Promise(function (resolve) {
            var m = el('remarksModal'), t = el('remarksText'), err = el('remarksErr');
            el('remarksTitle').textContent = reqType + ' - Remarks';
            el('remarksPrompt').textContent = 'Action Remarks';
            t.value = ''; err.textContent = ''; m.classList.add('on'); setTimeout(function () { t.focus(); }, 0);
            function done(v) { m.classList.remove('on'); el('remarksOk').onclick = el('remarksCancel').onclick = null; m.onkeydown = null; resolve(v); }
            el('remarksOk').onclick = function () {
                if (!t.value.trim()) { err.textContent = 'Action Remarks Required'; t.focus(); return; }
                done(t.value.trim());
            };
            el('remarksCancel').onclick = function () { done(null); };
            m.onkeydown = function (e) { if (e.key === 'Escape') done(null); };
        });
    }

    function applyPreset() {
        /* cmbDateType_ValueChanged: 1 / 2 / 5 set only the From date; 3 / 4 set From and To. */
        var v = el('datePreset').value, t = new Date(), f = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        if (!el('toDate').value) el('toDate').value = iso(t);
        if (v === '1') { el('fromDate').value = iso(f); }
        else if (v === '2') { f.setDate(f.getDate() - 7); el('fromDate').value = iso(f); }
        else if (v === '3') { el('fromDate').value = iso(new Date(t.getFullYear(), t.getMonth(), 1)); el('toDate').value = iso(t); }
        else if (v === '4') { el('fromDate').value = iso(new Date(t.getFullYear(), 0, 1)); el('toDate').value = iso(t); }
        else if (v === '5') { if (meta.financialYearStart) el('fromDate').value = String(meta.financialYearStart).substring(0, 10); }
    }

    // ------------------------------------------------------------------ combos
    function selectedParents() {
        var s = el('parentItemIds'); if (!s) return [];
        return Array.prototype.filter.call(s.options, function (o) { return o.selected; }).map(function (o) { return o.value; });
    }
    function fill(sel, list, byText, keepFirst) {
        var keep = sel.value;
        sel.innerHTML = '<option value=""></option>' + list.map(function (r) {
            var v = byText ? r.name : r.id;
            return '<option value="' + esc(v) + '">' + esc(r.name) + '</option>';
        }).join('');
        if (keep && Array.prototype.some.call(sel.options, function (o) { return o.value === keep; })) sel.value = keep;
        else if (keepFirst && sel.options.length > 1) sel.selectedIndex = 1;
    }
    function listFor(activity, parents) {
        var seen = {}, out = [];
        rows.forEach(function (r) {
            if (String(r.Activity) !== activity) return;
            if (parents.length && parents.indexOf(String(r.ParentCategoryId)) < 0) return;
            if (seen[r.Id]) return; seen[r.Id] = 1;
            out.push({id: r.Id, name: r.ReferenceName});
        });
        return out;
    }
    var firstBind = true;
    function bindCombos() {
        var parents = selectedParents();
        CFG.combos.forEach(function (c) {
            /* CmbStatus.Rows[0].Activate() - the desktop pre-selects the first status. */
            fill(el(c[0]), listFor(c[2], parents), CFG.textValue.indexOf(c[0]) >= 0, firstBind && c[0] === 'statusId');
        });
        firstBind = false;
    }
    function loadFilters() {
        el('msg').textContent = '';
        return fetch(API + '/filters', {credentials: 'same-origin'}).then(function (r) {
            if (!r.ok) throw new Error('Filter lists could not be loaded (' + r.status + ')');
            return r.json();
        }).then(function (d) {
            meta = d || {};
            rows = (d && d.rows) || [];
            if (!CFG.tb) {
                var ps = el('parentItemIds'), keep = selectedParents();
                ps.innerHTML = listFor('ParentCategories', []).map(function (p) {
                    return '<option value="' + esc(p.id) + '"' + (keep.indexOf(String(p.id)) >= 0 ? ' selected' : '') + '>' + esc(p.name) + '</option>';
                }).join('');
                msSync();
                if (!el('fromDate').value) {
                    var days = d.defaultDaysToLessFromHistoryFromDate > 0 ? d.defaultDaysToLessFromHistoryFromDate : 3;
                    var t = new Date(), f = new Date(t.getTime()); f.setDate(t.getDate() - days);
                    el('fromDate').value = iso(f); el('toDate').value = iso(t);
                }
            }
            bindCombos();
        }).catch(function (e) { el('msg').textContent = e.message; });
    }

    // ------------------------------------------------------------------ grid
    function lc(row) { var m = {}; Object.keys(row).forEach(function (k) { m[k.toLowerCase()] = row[k]; }); return m; }
    function fmt(key, v) {
        if (v == null || v === '') return {t: '', n: false};
        if (typeof v === 'boolean') return {t: v ? '&#10003;' : '', n: false};
        if (/date/i.test(key)) {
            var d = typeof v === 'number' ? new Date(v) : new Date(String(v));
            if (!isNaN(d.getTime())) {
                var s = typeof v === 'string' ? v.substring(0, 10).split('-') : [d.getFullYear(), d.getMonth() + 1, d.getDate()];
                if (s.length === 3) return {t: ('0' + s[2]).slice(-2) + '/' + ('0' + s[1]).slice(-2) + '/' + s[0], n: false};
            }
        }
        if (typeof v === 'number') {
            return {t: (Math.round(v) === v) ? String(v) : v.toFixed(2), n: true};
        }
        return {t: esc(v), n: false};
    }
    function summable(key) { return !/(id|no|days|%|percent|year)$/i.test(key) && !/rate/i.test(key); }
    function render(data) {
        var type = el('reportType').value;
        var cols = (CFG.colsByType && CFG.colsByType[type]) || CFG.cols;
        var hid = {}; (CFG.hidden._base || []).concat(CFG.hidden[type] || []).forEach(function (h) { hid[h] = 1; });
        if (CFG.tb) {
            var side = (document.querySelector('input[name="tbSide"]:checked') || {}).value || 'all';
            var PUR = ['RatePurchase', 'PurchaseAmount', 'PurchaseFreight', 'PurchaseExpenses', 'BillWeight', 'EbCutTotal', 'EbCut'];
            var SAL = ['SaleEbCut', 'SaleEbCutTotal', 'AddLessSale', 'SaleBillWeight', 'RateSale', 'SaleAmount', 'SaleExpenses', 'SaleNetAmount'];
            if (type === 'Detail') (side === 'sale' ? PUR : side === 'purchase' ? SAL : []).forEach(function (h) { hid[h] = 1; });
            else if (type === 'DocumentWiseProfitAndLoss' || type === 'VehicleWiseProfitAndLoss') {
                if (side === 'sale') { hid.BillWeight = 1; hid.ProfitAndLoss = 1; }
                if (side === 'purchase') { hid.SaleBillWeight = 1; hid.SaleNetAmount = 1; }
            }
        }
        var idCol = cols.filter(function (c) { return c[0] === 'Id'; })[0];
        var idKey = idCol ? idCol[1].toLowerCase() : 'id';
        var shown = cols.filter(function (c) { return !hid[c[0]]; });
        var lrows = data.map(lc);
        /* PurchaseSaleRegister: ExpenseNameN / ExpenseAmountN pairs become one column per expense
           name (BindTradingRegisterActivity). */
        var extra = [];
        if (type === 'PurchaseSaleRegister') {
            lrows.forEach(function (r) {
                Object.keys(r).forEach(function (k) {
                    var m = /^expensename(.*)$/.exec(k);
                    if (!m || !(('expenseamount' + m[1]) in r)) return;
                    var n = r[k]; if (n == null || String(n).trim() === '') return;
                    n = String(n).trim(); if (extra.indexOf(n) < 0) extra.push(n);
                    r['__exp__' + n] = r['expenseamount' + m[1]];
                });
            });
            extra.forEach(function (n) { shown.push([n, '__exp__' + n]); });
        }
        /* GridSettings (Detail only): Select column + Complete / Cancel / Update Expiry Date / Open
           row buttons, each gated by approval = Approved, status Open / not Open, and the right. */
        var st = STATUS_REPORT && type === 'Detail' && ctx.type === 'Detail';
        var bComplete = st && ctx.isApproved && ctx.isOpen && right('CanChangeOrderStatusToComplete');
        var bCancel = st && ctx.isApproved && ctx.isOpen && right('CanChangeOrderStatusToCancel');
        var bExpiry = st && ctx.isApproved && ctx.isOpen && right('CanChangeOrderExpiryDate');
        var bOpen = st && ctx.isApproved && ctx.hasStatus && !ctx.isOpen && right('CanChangeOrderStatusToOpen');
        var bSelect = st && ctx.isApproved && (right('CanChangeOrderStatusToComplete') || right('CanChangeOrderStatusToCancel') || right('CanChangeOrderStatusToOpen'));
        el('btnCompleteOrders').style.display = bComplete ? 'inline-block' : 'none';
        el('btnCancelOrders').style.display = bCancel ? 'inline-block' : 'none';
        el('btnOpenOrders').style.display = bOpen ? 'inline-block' : 'none';
        var head = (bSelect ? '<th class="sel" style="' + wcss(BTNW.sel) + '"><input type="checkbox" id="selAll" title="Select all"></th>' : '') +
            (bComplete ? '<th style="' + wcss(BTNW.Complete) + '">Complete</th>' : '') + (bCancel ? '<th style="' + wcss(BTNW.Cancel) + '">Cancel</th>' : '') +
            (bExpiry ? '<th style="' + wcss(BTNW.Update) + '">Update Expiry Date</th>' : '') + (bOpen ? '<th style="' + wcss(BTNW.Open) + '">Open</th>' : '');
        var pcol = CFG.tb ? true : (type === 'Detail' || type === 'DocWise_Summary');
        var pth = pcol ? '<th style="' + wcss(CFG.tb ? 70 : 40) + '">' + (CFG.tb ? '1056 Slip' : 'Print') + '</th>' : '';
        el('grid').tHead.innerHTML = '<tr>' + (CFG.tb ? '' : pth) + head + shown.map(function (c, k) { return (CFG.tb && k === 1 ? pth : '') + '<th style="' + wcss(WIDTHS[c[0]]) + '">' + esc(CAPTION[c[0]] || c[0]) + '</th>'; }).join('') + '</tr>';
        printCaption(type);
        var tot = {}, any = {};
        el('grid').tBodies[0].innerHTML = lrows.map(function (r, i) {
            var id = r[idKey];
            var pre = (bSelect ? '<td class="sel"><input type="checkbox" class="rowsel" data-i="' + i + '"></td>' : '') +
                (bComplete ? '<td><button type="button" class="rowbtn" data-act="Complete" data-i="' + i + '">Complete</button></td>' : '') +
                (bCancel ? '<td><button type="button" class="rowbtn" data-act="Cancel" data-i="' + i + '">Cancel</button></td>' : '') +
                (bExpiry ? '<td><button type="button" class="rowbtn" data-act="Expiry" data-i="' + i + '">Update Expiry Date</button></td>' : '') +
                (bOpen ? '<td><button type="button" class="rowbtn" data-act="Open" data-i="' + i + '">Open</button></td>' : '');
            var ptd = pcol ? '<td><button type="button" class="rowbtn" data-act="Print" data-i="' + i + '">' + (CFG.tb ? '1056 Slip' : 'Print') + '</button></td>' : '';
            return '<tr>' + (CFG.tb ? '' : ptd) + pre + shown.map(function (c, k) {
                var lead = CFG.tb && k === 1 ? ptd : '';
                var v = c[1].indexOf('__exp__') === 0 ? r[c[1]] : r[c[1].toLowerCase()];
                var f = fmt(c[1], v);
                if (f.n && summable(c[0])) { tot[c[0]] = (tot[c[0]] || 0) + v; any[c[0]] = 1; }
                if (bExpiry && c[0] === 'ValidityDate') {
                    /* editableColumns.Add("ValidityDate") */
                    var dv = v == null ? '' : (typeof v === 'number' ? iso(new Date(v)) : String(v).substring(0, 10));
                    return lead + '<td><input type="date" class="valdate" data-i="' + i + '" value="' + esc(dv) + '"></td>';
                }
                if (c[0] === 'DocNo' && id != null && id !== '') {
                    return lead + '<td><a class="doclink" data-i="' + i + '">' + f.t + '</a></td>';
                }
                var pl = (CFG.tb && c[0] === 'ProfitAndLoss' && type !== 'Detail' && typeof v === 'number' && v >= 0) ? ' style="color:green;font-weight:bold"' : '';
                return lead + '<td' + (f.n ? ' class="num"' : '') + pl + '>' + f.t + '</td>';
            }).join('') + '</tr>';
        }).join('');
        var preCells = (pcol ? 1 : 0) + (bSelect ? 1 : 0) + (bComplete ? 1 : 0) + (bCancel ? 1 : 0) + (bExpiry ? 1 : 0) + (bOpen ? 1 : 0);
        el('grid').tFoot.innerHTML = lrows.length ? '<tr>' + new Array(preCells + 1).join('<td></td>') + shown.map(function (c) {
            return any[c[0]] ? '<td class="num">' + tot[c[0]].toFixed(2) + '</td>' : '<td></td>';
        }).join('') + '</tr>' : '';
        el('grid')._rows = lrows; el('grid')._idKey = idKey;
        var sa = el('selAll');
        if (sa) sa.addEventListener('change', function () {
            Array.prototype.forEach.call(document.querySelectorAll('.rowsel'), function (c) { c.checked = sa.checked; });
        });
        el('rowCount').textContent = lrows.length + ' row(s)';
    }
    function wcss(w) { return w ? 'width:' + w + 'px;min-width:' + w + 'px;max-width:' + w + 'px;white-space:normal' : ''; }
    /* PrintButtonManage: btnPrint.Text = the .rpt for the report type (TB: also the side radio). */
    function printCaption(type) {
        var b = el('btnPrint'); if (!b) return; var cap = '';
        if (CFG.tb) {
            var side = (document.querySelector('input[name="tbSide"]:checked') || {}).value || 'all';
            if (type === 'Detail') cap = side === 'purchase' ? '1558-CommissionTradePurchaseRpt' : side === 'sale' ? '1559-CommissionTradeSaleRpt' : '1560-CommissionTradeAllRpt';
            else if (type === 'DocumentWiseProfitAndLoss') cap = '1561-DocumentWiseProfitAndLossAll';
            else if (type === 'VehicleWiseProfitAndLoss') cap = side === 'purchase' ? '1564-VehicleWiseProfitAndLossPurchase' : side === 'sale' ? '1565-VehicleWiseProfitAndLossSale' : '1566-VehicleWiseProfitAndLossAll';
            else if (type === 'PurchaseSaleRegister') cap = '1567_CommissionAgentPurchaseSaleRegister';
        } else if (PRINTCAP.__list) { cap = PRINTCAP.__list[CFG.types.indexOf(type)] || ''; }
        else cap = PRINTCAP[type] || '';
        b.style.display = type ? '' : 'none';
        if (cap) { b.textContent = cap; b.title = cap + '.rpt'; }
    }
    /* grdfrm_ColumnButtonClick "Print": the document slip (CrystalReportPrint_Helper) for the row Id. */
    function printSlip(i, btn) {
        var id = rowId(i); if (id == null) return;
        if (!SLIPKEY) { el('msg').textContent = 'The document slip for this report is not available on the web yet.'; return; }
        return withButton(btn, function () {
            return fetch('/api/reports/' + SLIPKEY + '/print.pdf', {method: 'POST', credentials: 'same-origin',
                headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: id})}).then(function (r) {
                if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('Print failed (' + r.status + ')')); });
                return r.blob().then(function (b) { window.open(URL.createObjectURL(b), '_blank'); });
            });
        });
    }
    function show() {
        el('msg').textContent = '';
        var q = new URLSearchParams();
        var dt = document.querySelector('input[name="dateType"]:checked');
        q.set('dateType', dt ? dt.value : 'doc');
        ['fromDate', 'toDate', 'fromDocNo', 'toDocNo', 'approved', 'reportType'].forEach(function (k) {
            if (el(k) && el(k).value !== '') q.set(k, el(k).value);
        });
        CFG.combos.forEach(function (c) { var v = el(c[0]).value; if (v !== '') q.set(c[0], v); });
        if (CFG.parentSent) { var p = selectedParents(); if (p.length) q.set('parentItemIds', p.join(',')); }
        if (CFG.tb && !el('reportType').value) { el('msg').textContent = 'Please Select Activity First...'; return; }
        var sSel = el('statusId');
        ctx = {type: el('reportType').value,
               isApproved: !!(el('approved') && el('approved').value === 'Approved'),
               isOpen: !!(sSel && sSel.selectedIndex >= 0 && sSel.options[sSel.selectedIndex].text === 'Open'),
               hasStatus: !!(sSel && sSel.selectedIndex >= 0 && sSel.options[sSel.selectedIndex].text !== '')};
        return withButton(el('btnShow'), function () {
            return fetch(API + '?' + q.toString(), {credentials: 'same-origin'}).then(function (r) {
                return r.json().catch(function () { return null; }).then(function (b) {
                    if (!r.ok) throw new Error((b && b.message) || ('Report failed (' + r.status + ')'));
                    return b || [];
                });
            }).then(function (d) { lastData = d; render(d); }).catch(function (e) {
                el('msg').textContent = e.message; lastData = []; render([]);
            });
        });
    }

    // ------------------------------------------------------------------ grid events
    function rowAt(i) { return (el('grid')._rows || [])[+i]; }
    function rowId(i) { var r = rowAt(i); return r ? r[el('grid')._idKey] : null; }
    /* grdfrm_LinkClicked (Trade Bill Register: DocNo -> frmCommissionAgentTradeBillAgainstGdn for
       DocumentTypeId 1056, else CommissionAgentTradeBill_162). The desktop opens a new form and
       calls ReadById(Id); the web opens the document's own page with ?id=. */
    function openDoc(i) {
        var r = rowAt(i), id = rowId(i); if (!r || id == null) return;
        var url;
        if (CFG.tb) {
            if (Number(r.documenttypeid) === 1056) url = '/commission/trade-bill-against-gdn';
            else { el('msg').textContent = 'Commission Agent Trade Bill (CommissionAgentTradeBill_162) is not available on the web yet.'; return; }
        } else url = DOC_ROUTE[CFG.key];
        if (url) window.open(url + '?id=' + encodeURIComponent(id), '_blank');
    }
    /* UpdateOrderStatus (row button) / UpdateMultiOrderStatus (checked rows). */
    function changeStatus(reqType, items, btn) {
        if (!items.length) { alert('Please Check Rows first'); return; }
        return askRemarks(reqType).then(function (remarks) {
        if (remarks == null) return;
        if (!window.confirm('Are you sure to ' + reqType + ' Status?')) return;
        return withButton(btn, function () {
            return fetch(API + '/status', {method: 'POST', credentials: 'same-origin',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({reqType: reqType, remarks: remarks, items: items})}).then(function (r) {
                return r.json().catch(function () { return null; }).then(function (b) {
                    if (!r.ok) throw new Error((b && b.message) || ('Status change failed (' + r.status + ')'));
                    alert((b && b.message) || ('Record ' + reqType + ' Successfully'));
                });
            }).then(function () { el('btnShow').disabled = false; return show(); });
        });
        });
    }
    function checkedItems() {
        return Array.prototype.filter.call(document.querySelectorAll('.rowsel'), function (c) { return c.checked; })
            .map(function (c) { return {id: rowId(c.getAttribute('data-i'))}; });
    }
    el('grid').addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a.doclink') : null;
        if (a) { e.preventDefault(); openDoc(a.getAttribute('data-i')); return; }
        var b = e.target.closest ? e.target.closest('button.rowbtn') : null;
        if (!b) return;
        var i = b.getAttribute('data-i'), act = b.getAttribute('data-act'), it = {id: rowId(i)};
        if (act === 'Print') { printSlip(i, b); return; }
        if (act === 'Expiry') {
            var inp = document.querySelector('input.valdate[data-i="' + i + '"]');
            it.validityDate = inp ? inp.value : '';
        }
        changeStatus(act, [it], b);
    });
    el('btnCompleteOrders').addEventListener('click', function () { changeStatus('Complete', checkedItems(), el('btnCompleteOrders')); });
    el('btnCancelOrders').addEventListener('click', function () { changeStatus('Cancel', checkedItems(), el('btnCancelOrders')); });
    el('btnOpenOrders').addEventListener('click', function () { changeStatus('Open', checkedItems(), el('btnOpenOrders')); });
    el('btnFullscreen').addEventListener('click', function () { el('rptWrap').classList.toggle('fs'); });
    /* btnNewHistory_Click / btnNew_Click (Reset): clear the combos and the grid, reset dates. */
    el('btnNew').addEventListener('click', function () {
        CFG.combos.forEach(function (c) { if (el(c[0])) el(c[0]).value = ''; });
        if (el('parentItemIds')) { Array.prototype.forEach.call(el('parentItemIds').options, function (o) { o.selected = false; }); msSync(); }
        if (!CFG.tb) {
            el('reportType').selectedIndex = 0;
            var days = meta.defaultDaysToLessFromHistoryFromDate > 0 ? meta.defaultDaysToLessFromHistoryFromDate : 3;
            var t = new Date(), f = new Date(t.getFullYear(), t.getMonth(), t.getDate()); f.setDate(f.getDate() - days);
            el('fromDate').value = iso(f);
            if (!CFG.tb) bindCombos();
        } else { el('datePreset').value = '3'; applyPreset(); }
        lastData = []; ctx = {type: ''}; render([]); el('rowCount').textContent = ''; el('msg').textContent = '';
        el('fromDate').focus();
    });

    buildFilters();
    el('btnShortcut').addEventListener('click', function () { alert('Ctrl+S : Show\nCtrl+R : Refresh'); });
    if (CFG.tb) applyPreset();
    loadFilters();
    el('btnShow').addEventListener('click', show);
    el('btnRefresh').addEventListener('click', function () { withButton(el('btnRefresh'), loadFilters); });
    document.addEventListener('keydown', function (e) {
        if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); show(); }
        if (e.ctrlKey && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); loadFilters(); }
