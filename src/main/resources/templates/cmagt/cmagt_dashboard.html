<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Golden Ace Foods - Commission Trading</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/cmagt_screens.css}">
    <link rel="stylesheet" th:href="@{/build/css/cmagt_theme.css}">
</head>
<body class="cmagt">
<div class="cmagt-appbar">
    <span class="cmagt-title">Commission Trading</span>
    <span class="cmagt-crumb">7 screens</span>
</div>


<div class="erp-sub-bar">
    <i class="fa fa-window-maximize"></i>
    <span>Screens</span>
</div>

<div class="erp-module-banner">
    <div class="erp-module-title">Commission Trading</div>
</div>

<div class="erp-module-canvas">

    <div class="cards-row">
        <a th:href="@{/commission}" class="erp-card">
            <div class="erp-card-header-badge">7</div>
            <div class="erp-card-body">
                <div class="bank-icon"><i class="fa fa-university"></i></div>
                <div class="card-title">Commission Agent Portal</div>
            </div>
        </a>

        <a th:href="@{/commission/reports}" class="erp-card">
            <div class="erp-card-header-badge">5</div>
            <div class="erp-card-body">
                <div class="bank-icon"><i class="fa fa-university"></i></div>
                <div class="card-title">Commission Trading Reports</div>
            </div>
        </a>
    </div>

    <div class="tiles-row">
        <a th:href="@{/commission/buyer-inquiry-booking}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Buyer Inquiry Booking</div>
        </a>

        <a th:href="@{/commission/sale-order}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Sale Order / Deal With Buyer</div>
        </a>

        <a th:href="@{/commission/supplier-offer}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Supplier Offer</div>
        </a>

        <a th:href="@{/commission/purchase-order}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Purchase Order / Deal With Supplier</div>
        </a>

        <a th:href="@{/commission/grn-loading-challan}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">GRN Loading Challan</div>
        </a>

        <a th:href="@{/commission/goods-dispatching-note}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Goods Dispatching Note</div>
        </a>

        <a th:href="@{/commission/trade-bill-against-gdn}" class="module-tile">
            <i class="fa fa-star-o"></i>
            <div class="tile-title">Commission Agent Bill Against Gdn</div>
        </a>
    </div>

</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
</body>
</html>
