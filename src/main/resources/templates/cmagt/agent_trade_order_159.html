<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commission Agent Order</title>
<link rel="stylesheet" th:href="@{/build/css/cmagt_theme.css?v=20260930T}"><link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}">
<style>
html,body{margin:0;background:#d8e0e8;color:#111;font:11px Tahoma,"Segoe UI",Arial,sans-serif;overflow-x:hidden}.oa-toolbar{min-height:27px;display:flex;gap:4px;align-items:center;padding:2px 6px;background:linear-gradient(#fff,#dbe3ea);border-bottom:1px solid #9aaab8;flex-wrap:wrap}.oa-toolbar button{height:21px;padding:1px 8px;background:#f7f9fa;border:1px solid #8e9eab;font:600 11px Tahoma;cursor:pointer}.oa-toolbar button:disabled{opacity:.55;cursor:wait}.oa-title,.oa-band{height:25px;display:flex;align-items:center;padding:0 7px;background:#00796b;color:#fff;font:bold 13px Tahoma}.oa-form{margin:5px;padding:6px;background:#fff;border:1px solid #9caab5}.oa-head{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:4px 8px;align-items:end}.oa-field{display:flex;flex-direction:column;gap:2px;min-width:0}.oa-field label{font-weight:bold;white-space:nowrap}.oa-field input,.oa-field select{height:22px;box-sizing:border-box;width:100%;border:1px solid #96a5b1;background:#fff;padding:1px 4px;font:11px Tahoma}.oa-band{justify-content:space-between}.oa-gridbar{min-height:24px;display:flex;align-items:center;justify-content:flex-end;padding:0 5px}.oa-scroll{height:225px;overflow:auto;background:white;border:1px solid #9eafbf;margin:0 5px 5px}table.oa-grid{border-collapse:collapse;width:max-content;min-width:100%;white-space:nowrap;background:#fff;font:11px Tahoma} .oa-grid th{position:sticky;top:0;z-index:2;background:linear-gradient(#e4edf7,#ccd9ea);border:1px solid #aab9cd;padding:4px 5px;text-align:center}.oa-grid td{border:1px solid #d0d9e3;padding:2px 3px;height:24px}.oa-grid tbody tr:nth-child(even){background:#f6f8fa}.oa-grid input,.oa-grid select{height:21px;min-width:86px;width:100%;box-sizing:border-box;border:1px solid #a3afb8;padding:1px 3px;font:11px Tahoma}.oa-grid input[type=number]{text-align:right;min-width:62px;width:78px}.oa-grid .long{min-width:135px}.oa-grid .del{min-width:24px;width:24px;color:#a21;cursor:pointer}.oa-status{min-height:18px;padding:0 7px;color:#a11}.oa-history{height:calc(100vh - 500px);min-height:110px;overflow:auto;margin:0 5px 7px;border:1px solid #9eafbf;background:#fff}.oa-history table{border-collapse:collapse;width:max-content;min-width:100%;white-space:nowrap;font:11px Tahoma}.oa-history th{position:sticky;top:0;background:linear-gradient(#e4edf7,#ccd9ea);border:1px solid #aab9cd;padding:4px}.oa-history td{border:1px solid #d0d9e3;padding:3px 5px}.oa-history tr:hover{background:#e7f2f2;cursor:pointer}.oa-history .selected{background:#fff4d1!important}@media(max-width:900px){.oa-head{grid-template-columns:repeat(3,minmax(130px,1fr))}.oa-scroll{height:190px}.oa-history{height:220px}}@media(max-width:560px){.oa-head{grid-template-columns:repeat(2,minmax(120px,1fr))}}@media print{.oa-toolbar,.oa-form,.oa-status,.oa-gridbar,.cmagt-appbar{display:none!important}.oa-scroll,.oa-history{height:auto;overflow:visible;border:0}.oa-grid th,.oa-history th{position:static}}
</style></head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="cmagt-appbar"><a class="cmagt-back" th:href="@{/app/Commission%20Agent%20Trade?module=49}">Back to Commission Agent Trade</a><span class="cmagt-title">Commission Agent Order</span></div>
<div class="oa-toolbar"><button id="newBtn" type="button">✚ New</button><button id="refreshBtn" type="button">⟳ Refresh</button><button id="saveBtn" type="button">▣ Save</button><button id="updateBtn" type="button" hidden>▣ Update</button><button id="historyBtn" type="button">History</button><button id="printBtn" type="button">▣ Print</button><button id="shortcutsBtn" type="button">ShortCut Keys</button></div>
<div class="oa-title">Commission Agent Order</div>
<section class="oa-form"><div class="oa-head">
<div class="oa-field"><label for="docNo">Doc No</label><input id="docNo" inputmode="numeric"></div><div class="oa-field"><label for="docDate">Doc Date</label><input id="docDate" type="date"></div>
<div class="oa-field"><label for="supplierId">Supplier</label><select id="supplierId"></select></div><div class="oa-field"><label for="customerId">Customer</label><select id="customerId"></select></div><div class="oa-field"><label for="commissionAgentId">Commission Agent</label><select id="commissionAgentId"></select></div>
<div class="oa-field"><label for="brokerId">Broker A/c</label><select id="brokerId"></select></div><div class="oa-field"><label for="commPrcnt">Comm %</label><input id="commPrcnt" type="number" step="0.01"></div><div class="oa-field"><label for="brokeryPrcnt">Brokery %</label><input id="brokeryPrcnt" type="number" step="0.01"></div><div class="oa-field"><label for="invDueTermsId">Payment Terms</label><select id="invDueTermsId"></select></div><div class="oa-field"><label for="dueDays">Due Days</label><input id="dueDays" type="number" step="1"></div>
<div class="oa-field"><label for="deliveryTerm">Delivery Term</label><select id="deliveryTerm"></select></div><div class="oa-field"><label for="deliveryStartDate">Delivery Start Date</label><input id="deliveryStartDate" type="date"></div><div class="oa-field"><label for="deliveryDays">Delivery Days</label><input id="deliveryDays" type="number" step="1"></div><div class="oa-field"><label for="orderStatus">Status</label><input id="orderStatus" maxlength="100"></div><div class="oa-field"><label for="remarksHeader">Remarks</label><input id="remarksHeader" maxlength="500"></div>
</div></section>
<div class="oa-band"><span>Order Details</span><button id="addDetailBtn" type="button">Add Detail</button></div><div class="oa-gridbar" id="detailBar"></div>
<div class="oa-scroll" data-gridbar-form="frmCommissionAgentOrder" data-gridbar-grid="grdDetail" data-gridbar-mount="#detailBar" data-gridbar-placement="toolbar"><table class="oa-grid" id="detailTable"><thead><tr><th>Item</th><th>Crop Year</th><th>Pack Type</th><th>Pack UOM</th><th>Item Qty</th><th>Weight</th><th>Supplier Rate</th><th>Customer Rate</th><th>Supplier Amount</th><th>Customer Amount</th><th>City Name</th><th>Remarks Detail</th><th></th></tr></thead><tbody></tbody></table></div>
<div id="status" class="oa-status" role="status" aria-live="polite"></div>
<div class="oa-band"><span>History</span><span id="historyCount" style="font-weight:normal"></span></div><div class="oa-gridbar" id="historyBar"></div><div class="oa-history" data-gridbar-form="frmCommissionAgentOrder" data-gridbar-grid="GrdHistory" data-gridbar-mount="#historyBar" data-gridbar-placement="toolbar"><table id="historyTable"><thead></thead><tbody><tr><td>History is not loaded.</td></tr></tbody></table></div>
<script>
(()=>{'use strict';const api='/commission/agent-trade/api/order', $=id=>document.getElementById(id),key=(o,...ns)=>{if(!o)return null;for(const n of ns){const k=Object.keys(o).find(x=>x.toLowerCase()===n.toLowerCase());if(k)return o[k]}return null};let meta={},currentId=0,removedDetails=[];
async function req(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw new Error(d.message||'Request failed ('+r.status+').');return d}
function opts(id,rows,labels,values=['Id','ID'],placeholder='...Select Any Value...'){const s=$(id);if(!s)return;s.innerHTML='';const p=document.createElement('option');p.value='';p.textContent=placeholder;s.append(p);for(const r of rows||[]){const v=key(r,...values),l=key(r,...labels);if(v==null||l==null)continue;const o=document.createElement('option');o.value=String(v);o.textContent=String(l);s.append(o)}}
function listSelect(rows,labelNames,val){const s=document.createElement('select');fillSelect(s,rows,labelNames,val);return s}
function fillSelect(s,rows,labelNames,val){s.innerHTML='';const p=document.createElement('option');p.value='';p.textContent='...Select Any Value...';s.append(p);for(const r of rows||[]){const v=key(r,'Id','ID'),l=key(r,...labelNames);if(v==null||l==null)continue;const o=document.createElement('option');o.value=String(v);o.textContent=String(l);s.append(o)}if(val!=null)s.value=String(val)}
async function loadUoms(select,itemId,selected){const requestId=String(itemId||'');select.dataset.itemRequest=requestId;fillSelect(select,[],['UOMCode']);if(!itemId)return;const rows=await req(api+'/item-uoms?itemId='+encodeURIComponent(itemId));if(select.dataset.itemRequest===requestId&&String(select.closest('tr')?.cells[0].querySelector('select').value||'')===requestId)fillSelect(select,rows,['UOMCode','UomCode'],selected)}
function amount(tr){const c=tr.cells,q=Number(c[4].querySelector('input').value||0),sr=Number(c[6].querySelector('input').value||0),cr=Number(c[7].querySelector('input').value||0);c[8].querySelector('input').value=(q*sr).toFixed(2);c[9].querySelector('input').value=(q*cr).toFixed(2)}
function addDetail(d={}){const tr=document.createElement('tr');if(key(d,'Id'))tr.dataset.id=key(d,'Id');const cells=Array.of(['items',['ItemName'],'ItemId'],['cropYears',['CropYear'],'CropYearId'],['packingTypes',['PackTypeDesc'],'PackingTypeId']);const selects=[];for(const [k,names,field] of cells){const td=document.createElement('td'),s=listSelect(meta[k]||[],names,key(d,field));selects.push(s);td.append(s);tr.append(td)}const uomTd=document.createElement('td'),uom=listSelect([],['UOMCode'],key(d,'PackUomId','UomId'));uomTd.append(uom);tr.append(uomTd);selects[0].addEventListener('change',()=>loadUoms(uom,selects[0].value,'').catch(e=>$('status').textContent=e.message));
for(const [k,prop] of Array.of(['qty','ItemQty'],['weight','Weight'],['supplierRate','SupplierRate'],['customerRate','CustomerRate'],['supplierAmount','SupplierAmount'],['customerAmount','CustomerAmount'])){const td=document.createElement('td'),i=document.createElement('input');i.type='number';i.step='0.01';i.value=key(d,prop)??'';i.readOnly=k==='supplierAmount'||k==='customerAmount';if(['qty','supplierRate','customerRate'].includes(k))i.addEventListener('input',()=>amount(tr));td.append(i);tr.append(td)}
const city=document.createElement('td');city.append(listSelect(meta.cities||[],['CityName','Description'],key(d,'CityId')));tr.append(city);const rem=document.createElement('td'),ri=document.createElement('input');ri.className='long';ri.value=key(d,'RemarksDetail')??'';rem.append(ri);tr.append(rem);const del=document.createElement('td'),b=document.createElement('button');b.type='button';b.className='del';b.textContent='×';b.onclick=()=>{if(tr.dataset.id)removedDetails.push({...detail(tr),id:Number(tr.dataset.id)});tr.remove()};del.append(b);tr.append(del);$('detailTable').tBodies[0].append(tr);if(selects[0].value)loadUoms(uom,selects[0].value,key(d,'PackUomId','UomId')).catch(e=>$('status').textContent=e.message);return tr}
function detail(tr){const c=tr.cells;return{id:Number(tr.dataset.id||0),itemId:Number(c[0].querySelector('select').value||0),cropYearId:Number(c[1].querySelector('select').value||0),packingTypeId:Number(c[2].querySelector('select').value||0),packUomId:Number(c[3].querySelector('select').value||0),qty:c[4].querySelector('input').value,weight:c[5].querySelector('input').value,supplierRate:c[6].querySelector('input').value,customerRate:c[7].querySelector('input').value,supplierAmount:c[8].querySelector('input').value,customerAmount:c[9].querySelector('input').value,cityId:Number(c[10].querySelector('select').value||0),remarksDetail:c[11].querySelector('input').value,actionId:tr.dataset.id?2:1}}
async function initialize(){ $('status').textContent='Loading form values…';$('refreshBtn').disabled=true;try{meta=await req(api+'/init');for(const id of ['supplierId','customerId','commissionAgentId','brokerId'])opts(id,meta.parties,['CompanyName','Name','NickName']);opts('invDueTermsId',meta.paymentTerms,['TermsDescription','Name']);opts('deliveryTerm',[{Id:'Load',Name:'Load'},{Id:'Ponch',Name:'Ponch'},{Id:'Load & PartyWeight',Name:'Load & PartyWeight'},{Id:'Load & FactoryWeight',Name:'Load & FactoryWeight'},{Id:'Ponch & PartyWeight',Name:'Ponch & PartyWeight'},{Id:'Ponch & FactoryWeight',Name:'Ponch & FactoryWeight'}],['Name']);$('saveBtn').hidden=!meta.permissions?.save;$('printBtn').disabled=!meta.permissions?.print;await newCode();await loadHistory();if(!$('detailTable').tBodies[0].rows.length)addDetail();$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{$('refreshBtn').disabled=false}}
async function newCode(){try{const d=await req(api+'/code');$('docNo').value=d.docNo||''}catch(e){if(!$('docNo').value)$('status').textContent=e.message}}
function clear(){currentId=0;removedDetails=[];for(const id of ['docNo','docDate','supplierId','customerId','commissionAgentId','brokerId','commPrcnt','brokeryPrcnt','invDueTermsId','dueDays','deliveryTerm','deliveryStartDate','deliveryDays','orderStatus','remarksHeader'])$(id).value='';$('docDate').value=meta.today||new Date().toISOString().slice(0,10);$('deliveryStartDate').value=meta.today||new Date().toISOString().slice(0,10);$('detailTable').tBodies[0].innerHTML='';$('saveBtn').hidden=!meta.permissions?.save;$('updateBtn').hidden=true;addDetail();newCode();$('status').textContent=''}
async function loadHistory(){ $('historyCount').textContent='Loading…';try{const rows=await req(api+'/history'),t=$('historyTable');t.tHead.innerHTML='';t.tBodies[0].innerHTML='';$('historyCount').textContent=rows.length+' records';if(!rows.length){t.tBodies[0].innerHTML='<tr><td>No records found.</td></tr>';return}const keys=Object.keys(rows[0]),h=document.createElement('tr');keys.forEach(k=>{const th=document.createElement('th');th.textContent=k.replace(/([a-z])([A-Z])/g,'$1 $2');h.append(th)});t.tHead.append(h);rows.forEach(r=>{const tr=document.createElement('tr');keys.forEach(k=>{const td=document.createElement('td');td.textContent=r[k]==null?'':String(r[k]);tr.append(td)});tr.onclick=()=>loadRecord(key(r,'Id'));t.tBodies[0].append(tr)});if(window.GridBar?.refresh)window.GridBar.refresh(t)}catch(e){$('historyCount').textContent='';$('status').textContent=e.message}}
async function loadRecord(id){if(!id)return;$('status').textContent='Loading order…';try{const d=await req(api+'/'+encodeURIComponent(id)),h=d.header||{};currentId=Number(key(h,'Id')||id);removedDetails=[];const vals={docNo:key(h,'DocNo'),docDate:key(h,'DocDate'),supplierId:key(h,'SupplierId'),customerId:key(h,'CustomerId'),commissionAgentId:key(h,'CommissionAgentId'),brokerId:key(h,'BrokerId'),commPrcnt:key(h,'CommPrcnt'),brokeryPrcnt:key(h,'BrokeryPrcnt'),invDueTermsId:key(h,'InvDueTermsId'),dueDays:key(h,'DueDays'),deliveryTerm:key(h,'DeliveryTerm'),deliveryStartDate:key(h,'DeliveryStartDate'),deliveryDays:key(h,'DeliveryDays'),orderStatus:key(h,'OrderStatus'),remarksHeader:key(h,'RemarksHeader')};for(const [id,v]of Object.entries(vals))$(id).value=v==null?'':String(v).slice(0,id.toLowerCase().includes('date')?10:undefined);$('detailTable').tBodies[0].innerHTML='';for(const row of d.details||[]){const tr=addDetail(row);const uom=tr.cells[3].querySelector('select');if(tr.cells[0].querySelector('select').value)await loadUoms(uom,tr.cells[0].querySelector('select').value,key(row,'PackUomId','UomId'))}if(!$('detailTable').tBodies[0].rows.length)addDetail();$('saveBtn').hidden=true;$('updateBtn').hidden=!meta.permissions?.update;$('status').textContent='Order '+currentId+' loaded.'}catch(e){$('status').textContent=e.message}}
function validate(){if(!$('docNo').value.trim()||$('docNo').value.trim()==='0')throw new Error('DocNo Field is Required');for(const [id,msg]of Array.of(['supplierId','Supplier Field is Required'],['customerId','Customer Field is Required'],['commissionAgentId','Comm Agent Field is Required'],['invDueTermsId','Payment Term Field is Required'],['deliveryTerm','Delivery Term Field is Required'],['orderStatus','Status Field Required']))if(!$(id).value)throw new Error(msg);if(!$('commPrcnt').value.trim())throw new Error('Comm% Field Required');if(!$('dueDays').value.trim())throw new Error('Due Days Field Required');const rows=[...$('detailTable').tBodies[0].rows];if(!rows.length)throw new Error('Grid Record Not Found');for(let i=0;i<rows.length;i++){const d=detail(rows[i]);for(const [k,msg]of Array.of(['itemId','Item Field Required'],['cropYearId','Crop Year Field Required'],['packingTypeId','Pack Type Field Required'],['packUomId','Pack Uom Field Required'],['qty','Quantity Field Required'],['weight','Weight Field Required'],['supplierRate','Supplier Rate Field Required'],['customerRate','Customer Rate Field Required']))if(d[k]===''||d[k]===0)throw new Error(msg+' (row '+(i+1)+')')}return rows.map(detail)}
async function save(){const btn=currentId?$('updateBtn'):$('saveBtn');btn.disabled=true;$('status').textContent='Saving…';try{const details=validate(),body={id:currentId,docNo:$('docNo').value,docDate:$('docDate').value,supplierId:$('supplierId').value,customerId:$('customerId').value,commissionAgentId:$('commissionAgentId').value,brokerId:$('brokerId').value,commPrcnt:$('commPrcnt').value,brokeryPrcnt:$('brokeryPrcnt').value,invDueTermsId:$('invDueTermsId').value,dueDays:$('dueDays').value,deliveryTerm:$('deliveryTerm').value,deliveryStartDate:$('deliveryStartDate').value,deliveryDays:$('deliveryDays').value,orderStatus:$('orderStatus').value,remarksHeader:$('remarksHeader').value,details,removedDetails};const d=await req(api+'/save',{method:'POST',body:JSON.stringify(body)});currentId=Number(d.id);$('status').textContent=d.message||'Saved.';await loadHistory();await loadRecord(currentId)}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}}
$('newBtn').onclick=clear;$('refreshBtn').onclick=initialize;$('saveBtn').onclick=save;$('updateBtn').onclick=save;$('historyBtn').onclick=loadHistory;$('addDetailBtn').onclick=()=>addDetail();$('printBtn').onclick=()=>window.print();$('shortcutsBtn').onclick=()=>alert('Ctrl+S : Save / Update\nCtrl+N : New\nCtrl+R : Refresh');document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();clear()}if(e.ctrlKey&&e.key.toLowerCase()==='r'){e.preventDefault();initialize()}});$('docDate').value=new Date().toISOString().slice(0,10);$('deliveryStartDate').value=new Date().toISOString().slice(0,10);initialize();
})();
</script><script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script></body></html>
