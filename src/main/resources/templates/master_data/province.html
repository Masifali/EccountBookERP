<!-- DefineProvince.cs - ClientSize 660 x 450. New / Save / Update(hidden); "Provience Define"; Select Country combo (15,41) 220x27 (BindDDL ZeroIndex true -> "...Select Any Value..."), Provience Code (240,42) 151x25, Provience (394,42) 220x25; grdProviencedefine: Id (hidden), Country, Province, ProvinceCode. -->
<body class="pd-body" data-mdd="province" data-screen="753">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:660px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Provience Define</div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:220px;"><label for="cmbCountry">Select Country</label><select id="cmbCountry" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Country Name"></select></div>
        <div class="md-field" style="width:151px;"><label for="txtProviencecode">Provience Code</label><input type="text" id="txtProviencecode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:220px;"><label for="txtProvienceName">Provience</label><input type="text" id="txtProvienceName" class="win-textbox" autocomplete="off"/></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdProviencedefine"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Country">Country</th><th data-col="Province">Province</th><th data-col="ProvinceCode">ProvinceCode</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>
