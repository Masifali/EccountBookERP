    <title>Other Items - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>

<!-- InvOtherItems.cs - ClientSize 1026 x 450. New / Update(hidden) / Save; row 1: Code (114,7) 220, Item Name (424,7) 220; row 2: Purchase GL A/C (114,36) 220, Sale GL A/C (424,36) 220, CGS GL A/C (732,36) 220; row 3: Branches (114,65) 220, Project (424,65) 220; grdOtherItems: id (hidden), Item Type, Item Name, StockGLAc, SaleGLAc, CogsGLAc (150 each). No caption panel, no keyboard shortcuts on the desktop form. -->
<body class="pd-body" data-mdd="other-items" data-screen="742">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:1026px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:220px;"><label for="txtCode">Code</label><input type="text" id="txtCode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:220px;"><label for="txtItemName">Item Name</label><input type="text" id="txtItemName" class="win-textbox" autocomplete="off"/></div>
        <div class="md-break"></div>
        <div class="md-field" style="width:220px;"><label for="cmbPurchaseGL">Purchase GL A/C</label><select id="cmbPurchaseGL" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Title"></select></div>
        <div class="md-field" style="width:220px;"><label for="cmbSaleGL">Sale GL A/C</label><select id="cmbSaleGL" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Tile"></select></div>
        <div class="md-field" style="width:220px;"><label for="cmbCGSGL">CGS GL A/C</label><select id="cmbCGSGL" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Tile"></select></div>
        <div class="md-break"></div>
        <div class="md-field" style="width:220px;"><label for="cmbBranch">Branches</label><select id="cmbBranch" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></div>
        <div class="md-field" style="width:220px;"><label for="cmbProject">Project</label><select id="cmbProject" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Project Name"></select></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdOtherItems"><thead><tr><th data-col="id" style="display:none;">id</th><th data-col="Item Type">Item Type</th><th data-col="Item Name">Item Name</th><th data-col="StockGLAc">StockGLAc</th><th data-col="SaleGLAc">SaleGLAc</th><th data-col="CogsGLAc">CogsGLAc</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003}"></script>
<script th:src="@{/build/js/countx_master_data_grid.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
