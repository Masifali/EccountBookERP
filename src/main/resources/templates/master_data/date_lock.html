<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Date Lock - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>

</head>
<!-- DateLock.cs - ClientSize 689 x 450. New / Update(hidden) / Save; Branch combo (6,29) 220x27, Project combo (229,29) 220x27 (first rows activated), Select Date picker (452,31) 128 short date, Status ComboBox (583,30) 99 Lock/Unlock (index 0); grdfrm: Id (hidden), Date dd-MMM-yyyy, Status. No caption panel on the desktop form. -->
<body class="pd-body" data-mdd="date-lock" data-screen="754">
<div class="pd-form" style="max-width:689px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:220px;"><label for="cmbBranch">Branch</label><select id="cmbBranch" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></div>
        <div class="md-field" style="width:220px;"><label for="cmbProject">Project</label><select id="cmbProject" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Project Name"></select></div>
        <div class="md-field" style="width:128px;"><label for="txtDate">Select Date</label><input type="date" id="txtDate" class="win-textbox"/></div>
        <div class="md-field" style="width:99px;"><label for="cmbStatus">Status</label><select id="cmbStatus" class="win-combo"><option>Lock</option><option>Unlock</option></select></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdfrm"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Date">Date</th><th data-col="Status">Status</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
