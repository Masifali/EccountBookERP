<body class="pd-body" data-mdd="currency" data-screen="751">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:762px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Define Currency</div>
    <fieldset class="md-group"><legend> Currency</legend>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:220px;"><label for="txtCode">Currency Code</label><input type="text" id="txtCode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:187px;"><label for="txtCurrencyName">Currency Name</label><input type="text" id="txtCurrencyName" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:220px;"><label for="txtcurrencyRate">Currency Rate</label><input type="text" id="txtcurrencyRate" class="win-textbox" autocomplete="off" inputmode="decimal"/></div>
        <div class="md-field" style="width:184px;"><label for="txtCurrencySymbol">Currency Symbol</label><input type="text" id="txtCurrencySymbol" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:527px;"><label for="txtCurrencyURL">Currency URL</label><input type="text" id="txtCurrencyURL" class="win-textbox" autocomplete="off"/></div>
    </div>
    </fieldset>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdcurrency"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="CurrencyCode">CurrencyCode</th><th data-col="CurrencyName">CurrencyName</th><th data-col="CurrencyRate">CurrencyRate</th><th data-col="CurrencySymbol">CurrencySymbol</th><th data-col="URL">URL</th><th data-col="Status">Status</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
