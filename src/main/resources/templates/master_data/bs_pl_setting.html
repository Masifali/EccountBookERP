<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>BS & PL Setting - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_master_data.css?v=20261003layout}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Account_Definition/BsPlSettingForm.cs - ClientSize 964 x 561. tabControl1: "Change Notes For Group Accounts" (toolStrip New / Update / ShortCut Keys; Filters: PL (checked) / BS, Assets / Liabilities shown only for BS; Show; grdBsPl with an editable NoteTitle value list - PLNotes or BSNotes) and "Change Note Title" (toolStrip2 New / Update / ShortCut Keys; Filters: All (checked) / PL / BS; Show; grdNoteChange with an editable NoteTitle). -->
<body class="pd-body" data-mdd="bs-pl-setting" data-screen="414">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:964px;">
    <div class="md-tabs" id="tabControl1">
        <button type="button" class="md-tab is-active" data-tab="tab1" onclick="MDD.tab(0)">Change Notes For Group Accounts</button>
        <button type="button" class="md-tab" data-tab="tab2" onclick="MDD.tab(1)">Change Note Title</button>
    </div>
    <div id="tab1" class="md-tabpage">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span>Update</span></button>
        <button type="button" id="BtnShortCutkeys" class="win-btn-tool" onclick="MDD.BtnShortCutkeys(this)"><span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Change Notes For Group Accounts</div>
        <fieldset class="md-group md-filters"><legend>Filters</legend>
            <div class="md-radios">
                <label><input type="radio" name="bspl" id="radPL" value="PL" checked onchange="MDD.radChanged()"/> PL</label>
                <label><input type="radio" name="bspl" id="radBS" value="BS" onchange="MDD.radChanged()"/> BS</label>
            </div>
            <div class="md-radios" id="classRadios" style="display:none;">
                <label><input type="radio" name="bsclass" id="radAssets" value="2"/> Assets</label>
                <label><input type="radio" name="bsclass" id="radLiablities" value="3"/> Liabilities</label>
            </div>
            <button type="button" id="btnShow" class="win-btn-action" onclick="MDD.btnShow(this)">Show</button>
        </fieldset>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table data-gridbar="BsPlSetting:grdBsPl" class="win-grid" id="grdBsPl"><thead><tr><th data-col="PlBsId" style="display:none;">PlBsId</th><th data-col="ChartofAccountId" style="display:none;">ChartofAccountId</th><th data-col="AccountTitle">AccountTitle</th><th data-col="NoteTitle">NoteTitle</th><th data-col="NoteRole">NoteRole</th><th data-col="AccountClassId" style="display:none;">AccountClassId</th><th data-col="ClassName">ClassName</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
    </div>
    <div id="tab2" class="md-tabpage is-hidden">
    <div class="win-tool-strip">
        <button type="button" id="btnNewNote" class="win-btn-tool" onclick="MDD.btnNewNote(this)"><i class="fa fa-plus"></i> <span>New</span></button>
        <button type="button" id="btnUpdateNote" class="win-btn-tool" onclick="MDD.btnUpdateNote(this)"><i class="fa fa-pencil"></i> <span>Update</span></button>
        <button type="button" id="btnSkey" class="win-btn-tool" onclick="MDD.btnSkey(this)"><span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Change Note Title</div>
        <fieldset class="md-group md-filters"><legend>Filters</legend>
            <div class="md-radios">
                <label><input type="radio" name="note" id="radAllNote" value="" checked/> All</label>
                <label><input type="radio" name="note" id="radPLNote" value="PL"/> PL</label>
                <label><input type="radio" name="note" id="radBSNote" value="BS"/> BS</label>
            </div>
            <button type="button" id="btnShowNote" class="win-btn-action" onclick="MDD.btnShowNote(this)">Show</button>
        </fieldset>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table data-gridbar="BsPlSetting:grdNoteChange" class="win-grid" id="grdNoteChange"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="NoteTitle">NoteTitle</th><th data-col="NoteRole">NoteRole</th><th data-col="AccountClassId" style="display:none;">AccountClassId</th><th data-col="ClassName">ClassName</th></tr></thead><tbody id="gridBodyNote"></tbody></table>
    </div></div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003}"></script>
<script th:src="@{/build/js/countx_master_data_grid.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
