<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Define Bank - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>

</head>
<!-- AcfrmDefineBank.cs - ClientSize 1097 x 661. toolStrip: New / Refresh / Save / Update / Delete(hidden) / ShortCut Keys; "Bank Define"; groupBox "Main" 974x179 in three columns: (117,15) Is Home Land* (fixed: Foreign Country / Home Country, row 2 active), Bank Name*, Branch Code*, Account Number*, Account Title*, IBAN Number*; (436,17) Phone No (1), Phone No (2), Mobile No, Email, Email Alternate, Country Name; (719,15) City Name, SWIFT Code (txtotherinfor), Cheque Templete, GL Account, Address. "Bank  History" grid = Bank.GetAllDt rows with an Edit button when the user has Update. Save / Update rights enable the buttons. -->
<body class="pd-body" data-mdd="bank" data-screen="413">
<div class="pd-form" style="max-width:1097px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" accesskey="r" onclick="MDD.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span>Update</span></button>
        <button type="button" id="btnShortCutKeys" class="win-btn-tool" onclick="MDD.btnShortCutKeys(this)"><span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Bank Define</div>
    <fieldset class="md-absgroup" style="margin-left:6px;"><legend>Main</legend>
        <label class="md-abs md-lbl" style="left:4px;top:21px;" for="txtishomeland">Is Home Land</label>
        <span class="md-abs md-star" style="left:102px;top:20px;">*</span>
        <select id="txtishomeland" class="md-abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Country Name" style="left:117px;top:15px;width:227px;height:26px;"></select>
        <label class="md-abs md-lbl" style="left:4px;top:48px;" for="txtbankname">Bank Name</label>
        <span class="md-abs md-star" style="left:102px;top:47px;">*</span>
        <input type="text" id="txtbankname" class="md-abs win-textbox" style="left:117px;top:44px;width:227px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:4px;top:75px;" for="txtbranchcode">Branch Code</label>
        <span class="md-abs md-star" style="left:102px;top:74px;">*</span>
        <input type="text" id="txtbranchcode" class="md-abs win-textbox" style="left:117px;top:71px;width:227px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:4px;top:103px;" for="txtBankAccountno">Account Number</label>
        <span class="md-abs md-star" style="left:102px;top:102px;">*</span>
        <input type="text" id="txtBankAccountno" class="md-abs win-textbox" style="left:117px;top:99px;width:227px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:4px;top:128px;" for="txtAccountTitle">Account Title</label>
        <span class="md-abs md-star" style="left:102px;top:127px;">*</span>
        <input type="text" id="txtAccountTitle" class="md-abs win-textbox" style="left:117px;top:124px;width:227px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:4px;top:154px;" for="txtBankIBANNo">IBAN Number</label>
        <span class="md-abs md-star" style="left:102px;top:153px;">*</span>
        <input type="text" id="txtBankIBANNo" class="md-abs win-textbox" style="left:117px;top:150px;width:227px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:21px;" for="txtcontact1">Phone No (1)</label>
        <input type="text" id="txtcontact1" class="md-abs win-textbox" style="left:436px;top:17px;width:176px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:48px;" for="txtcontact2">Phone No (2)</label>
        <input type="text" id="txtcontact2" class="md-abs win-textbox" style="left:436px;top:44px;width:176px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:75px;" for="txtcellno">Mobile No</label>
        <input type="text" id="txtcellno" class="md-abs win-textbox" style="left:436px;top:71px;width:176px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:103px;" for="txtemail">Email</label>
        <input type="text" id="txtemail" class="md-abs win-textbox" style="left:436px;top:99px;width:176px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:128px;" for="txtemailalternate">Email Alternate</label>
        <input type="text" id="txtemailalternate" class="md-abs win-textbox" style="left:436px;top:124px;width:176px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:348px;top:154px;" for="combcountry">Country Name</label>
        <select id="combcountry" class="md-abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Country Name" style="left:436px;top:148px;width:176px;height:26px;"></select>
        <label class="md-abs md-lbl" style="left:616px;top:21px;" for="combcity">City Name</label>
        <select id="combcity" class="md-abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="City Name" style="left:719px;top:15px;width:249px;height:26px;"></select>
        <label class="md-abs md-lbl" style="left:616px;top:48px;" for="txtotherinfor">SWIFT Code</label>
        <input type="text" id="txtotherinfor" class="md-abs win-textbox" style="left:719px;top:44px;width:249px;height:23px;" autocomplete="off"/>
        <label class="md-abs md-lbl" style="left:616px;top:75px;" for="CmbChequeTemplete">Cheque Templete</label>
        <select id="CmbChequeTemplete" class="md-abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Cheque Templete" style="left:719px;top:69px;width:249px;height:26px;"></select>
        <label class="md-abs md-lbl" style="left:616px;top:103px;" for="combGlaccount">GL Account</label>
        <select id="combGlaccount" class="md-abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Title" style="left:719px;top:97px;width:249px;height:26px;"></select>
        <label class="md-abs md-lbl" style="left:616px;top:128px;" for="txtaddress">Address</label>
        <textarea id="txtaddress" class="md-abs win-textbox" style="left:719px;top:124px;width:249px;height:50px;"></textarea>
    </fieldset>
    <div class="pd-caption pd-caption-teal pd-history-bar">Bank  History</div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="GrdBankDefine"><thead><tr><th data-col="Edit" style="width:40px;">Edit</th><th data-col="Id" style="display:none;">Id</th><th data-col="BranchName" style="min-width:150px;">BranchName</th><th data-col="BranchCode" style="min-width:100px;">BranchCode</th><th data-col="BankAccountNo" style="min-width:130px;">BankAccountNo</th><th data-col="BankAccountTitle" style="min-width:180px;">BankAccountTitle</th><th data-col="BankIBANNo" style="min-width:160px;">BankIBANNo</th><th data-col="Phone No (1)" style="min-width:100px;">Phone No (1)</th><th data-col="Phone No (2)" style="min-width:100px;">Phone No (2)</th><th data-col="Mobile No" style="min-width:100px;">Mobile No</th><th data-col="EmailAlternate" style="min-width:120px;">EmailAlternate</th><th data-col="IsHomeland" style="min-width:80px;">IsHomeland</th><th data-col="CountryName" style="min-width:130px;">CountryName</th><th data-col="CityName" style="min-width:90px;">CityName</th><th data-col="Address" style="min-width:100px;">Address</th><th data-col="ChequeTemplete" style="min-width:100px;">ChequeTemplete</th><th data-col="SWIFTCode" style="min-width:90px;">SWIFTCode</th><th data-col="ChartOfAccountId" style="display:none;">ChartOfAccountId</th><th data-col="AccountCode" style="min-width:100px;">AccountCode</th><th data-col="AccountTitle" style="min-width:150px;">AccountTitle</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
