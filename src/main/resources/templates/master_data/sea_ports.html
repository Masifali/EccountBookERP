<!-- SeaPortsDefine.cs - ClientSize 474 x 369. menuStrip1: New / Refresh / Save / Update(hidden) / ShortCut Keys; label4 "Ports Definition"; Description (106,56) 212x23, Type combo (106,84) 212x26 (1 Destination, 2 Loading, "...Select Any Value..." first), btnAdd "Save" (224,113) 94x28 - its text becomes "Update" after ReadById; "History" bar; grdfrm: Id (hidden), PortName, PortType. Save/Update rights of frmExImSeaPorts enable the buttons. -->
<body class="pd-body" data-mdd="sea-ports" data-screen="752">
<div class="pd-form" style="max-width:474px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefreshMenu" class="win-btn-tool" onclick="MDD.btnRefreshMenu(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnSave" class="win-btn-tool" accesskey="s" onclick="MDD.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>

    </div>
    <div class="pd-caption pd-caption-teal">Ports Definition</div>

        <div class="md-field" style="width:212px;"><label for="txtDescription">Description</label><input type="text" id="txtDescription" class="win-textbox" autocomplete="off"/></div>

    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar">History</div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdfrm"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="PortName">PortName</th><th data-col="PortType">PortType</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>
