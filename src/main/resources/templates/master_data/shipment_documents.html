<!-- ExImShipmentDocuments.cs - ClientSize 620 x 369. menuStrip1: Refresh / Save; Code (10,37) 177x20, Description (193,38) 230x20, btnAdd "Save" (429,37); grdfrm = Sp_ExImShipmentDocuments_GetAllMethod ReadAll rows (Id hidden, exImDocCode, exImDocName). No validation on the desktop. -->
<body class="pd-body" data-mdd="shipment-documents" data-screen="430">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:620px;">
    <div class="win-tool-strip">
        <button type="button" id="btnRefreshMenu" class="win-btn-tool" onclick="MDD.btnRefreshMenu(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnSave" class="win-btn-tool" accesskey="s" onclick="MDD.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:177px;"><label for="txtCode">Code</label><input type="text" id="txtCode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:230px;"><label for="txtDescription">Description</label><input type="text" id="txtDescription" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field md-actions"><button type="button" id="btnAdd" class="win-btn-action" onclick="MDD.btnAdd(this)">Save</button></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdfrm"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="exImDocCode">exImDocCode</th><th data-col="exImDocName">exImDocName</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003}"></script>
<script th:src="@{/build/js/countx_master_data_grid.js?v=20261006-gridbar-mounts}"></script>

<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
