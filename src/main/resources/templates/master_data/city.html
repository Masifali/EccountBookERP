<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>City Define - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_master_data.css?v=20261003layout}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- DefineCity.cs - ClientSize 536 x 624. Save / Update(hidden) / New / "Define Tehsil" / "Refresh"; "City Define"; Tehsil combo (9,29) 220x26 (BindDDLNew ZeroIndex true), City Name (231,29) 234x26; grdDefineCity: Id (hidden), TehsilId (hidden), Tehsil, CityName - filled only when City.GetAll returned rows. -->
<body class="pd-body" data-mdd="city" data-screen="750">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:536px;">
    <div class="win-tool-strip">
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnDefineTehsil" class="win-btn-tool" onclick="MDD.btnDefineTehsil(this)"><span>Define Tehsil</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="MDD.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">City Define</div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:220px;"><label for="CmbTehsil">Tehsil</label><select id="CmbTehsil" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Tehsil Name"></select></div>
        <div class="md-field" style="width:234px;"><label for="txtcityname">City Name</label><input type="text" id="txtcityname" class="win-textbox" autocomplete="off"/></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table data-gridbar="City:grdDefineCity" class="win-grid" id="grdDefineCity"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="TehsilId" style="display:none;">TehsilId</th><th data-col="Tehsil">Tehsil</th><th data-col="CityName">CityName</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003}"></script>
<script th:src="@{/build/js/countx_master_data_grid.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
