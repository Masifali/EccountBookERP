<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Document Group - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>

</head>
<!-- DocumentGroup.cs - ClientSize 620 x 369. menuStrip1: Refresh / Save (its text becomes "Update" after a double-click); Code (10,37) 124x22, Description (136,37) 178x22, btnAdd "Save" (321,37); grdfrm: Id hidden, ExImDocGroupCode, ExImDocGroupName. No validation on the desktop. -->
<body class="pd-body" data-mdd="document-group" data-screen="429">
<div class="pd-form" style="max-width:620px;">
    <div class="win-tool-strip">
        <button type="button" id="btnRefreshMenu" class="win-btn-tool" onclick="MDD.btnRefreshMenu(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnSave" class="win-btn-tool" accesskey="s" onclick="MDD.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:124px;"><label for="txtCode">Code</label><input type="text" id="txtCode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:178px;"><label for="txtDescription">Description</label><input type="text" id="txtDescription" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field md-actions"><button type="button" id="btnAdd" class="win-btn-action" onclick="MDD.btnAdd(this)">Save</button></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdfrm"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="ExImDocGroupCode">ExImDocGroupCode</th><th data-col="ExImDocGroupName">ExImDocGroupName</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
