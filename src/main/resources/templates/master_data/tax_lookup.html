<!-- Lookups/TaxLookup.cs - ClientSize 454 x 450, form text "Lookup". toolStrip: "Lookup" label, New / Save / Update(hidden); Type combo (15,28) 168x22, Code (189,28) 81x22 DISABLED (filled by Proc_InvLookUpType_GenerateCodeByLookUpType on leaving the Type combo), Name (276,28) 154x22; grdlookups: Id hidden, Code (70), Type (150 - shows TaxLookUptypesId, as the desktop does), LookUpName (150). -->
<body class="pd-body" data-mdd="tax-lookup" data-screen="428">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:454px;">
    <div class="win-tool-strip">
        <span class="win-btn-tool" style="cursor:default;">Lookup&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
    </div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:168px;"><label for="cmbLookupTypeId">Type</label><select id="cmbLookupTypeId" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="LookUp Name "></select></div>
        <div class="md-field" style="width:81px;"><label for="txtCode">Code</label><input type="text" id="txtCode" class="win-textbox" autocomplete="off" disabled/></div>
        <div class="md-field" style="width:154px;"><label for="txtLookupName">Name</label><input type="text" id="txtLookupName" class="win-textbox" autocomplete="off"/></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdlookups" data-gridbar="Lookups/TaxLookup:grdlookups" data-gridbar-title="Lookup History" data-gridbar-mount=".md-grid-groupbar" data-gridbar-reorder="false"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Code">Code</th><th data-col="Type">Type</th><th data-col="LookUpName">LookUpName</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003}"></script>
<script th:src="@{/build/js/countx_master_data_grid.js?v=20261006-gridbar-mounts}"></script>
<script th:src="@{/build/js/countx_master_data.js?v=20261003layout}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
