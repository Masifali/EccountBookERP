<!-- DefineTehsil.cs - ClientSize 605 x 450. New / Save / Update(hidden) / "Define District" / "Refresh"; "Tehsil Define"; District combo (15,36) 201x24, Tehsil Name (222,36) 292x25; grd = Sp_Tehsil_GetAllMethod ReadAll rows: Id (hidden), Tehsil, DistrictId (hidden), District, EntryDate, EntryUser, ModifyDate, ModifyUser. -->
<body class="pd-body" data-mdd="tehsil" data-screen="755">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="--md-entry-width:605px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnDefineDistrict" class="win-btn-tool" onclick="MDD.btnDefineDistrict(this)"><span>Define District</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="MDD.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Tehsil Define</div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:201px;"><label for="CmbDistrict">District</label><select id="CmbDistrict" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="DistrictName"></select></div>
        <div class="md-field" style="width:292px;"><label for="txtTehsilName">Tehsil Name</label><input type="text" id="txtTehsilName" class="win-textbox" autocomplete="off"/></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grd" data-gridbar="DefineTehsil:grd" data-gridbar-title="Tehsil History" data-gridbar-mount=".md-grid-groupbar" data-gridbar-reorder="false"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Tehsil">Tehsil</th><th data-col="DistrictId" style="display:none;">DistrictId</th><th data-col="District">District</th><th data-col="EntryDate">EntryDate</th><th data-col="EntryUser">EntryUser</th><th data-col="ModifyDate">ModifyDate</th><th data-col="ModifyUser">ModifyUser</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>
