<!-- DefineCountry.cs (Architecture.WinApp) - ClientSize 605 x 450. toolStrip1 New / Save / Update(hidden) / "DefineCity"; panel6 rgb(10,110,110) "Country Define" Tahoma 12 bold; panel5 (55): Country Code (10,26) 182x23, Country (194,26) 207x23; grdcountrydefine: Id (hidden), CountryCode, Description. -->
<body class="pd-body" data-mdd="country" data-screen="749">
<div class="pd-form" style="max-width:605px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="MDD.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="MDD.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="MDD.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnDefineCity" class="win-btn-tool" onclick="MDD.btnDefineCity(this)"><span>DefineCity</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Country Define</div>
    <div class="pd-entry md-entry ">
        <div class="md-field" style="width:182px;"><label for="txtcountrycode">Country Code</label><input type="text" id="txtcountrycode" class="win-textbox" autocomplete="off"/></div>
        <div class="md-field" style="width:207px;"><label for="txtcountryName">Country</label><input type="text" id="txtcountryName" class="win-textbox" autocomplete="off"/></div>
    </div>
    <div class="pd-grid-box"><div class="win-grid-scroll">
        <table class="win-grid" id="grdcountrydefine"><thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="CountryCode">CountryCode</th><th data-col="Description">Description</th></tr></thead><tbody id="gridBody"></tbody></table>
    </div></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
