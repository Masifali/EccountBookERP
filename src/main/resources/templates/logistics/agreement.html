    <style>
        .lgsa-wrap { padding: 0 6px; }
        .lgsa-wrap .hrm-group { margin: 0 0 4px 0; }
        .lgsa-main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; padding: 2px 0; }
        .lgsa-main .hrm-field { grid-template-columns: 110px minmax(0, 1fr); }
        .lgsa-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px; }
        .lgsa-cells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px 4px; align-items: end; }
        .lgsa-cells > div { display: flex; flex-direction: column; min-width: 0; }
        .lgsa-cells .lgsa-w2 { grid-column: span 2; }
        .lgsa-cells .lgsa-w3 { grid-column: span 3; }
        .lgsa-cells label, .lgsa-radios label { font: bold 8.5pt "Segoe UI", sans-serif; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .lgsa-btns { display: flex; gap: 4px; align-items: end; }

        .lgsa-strip .lgsa-title { font: bold 12pt Tahoma, sans-serif; color: teal; }
        .lgsa-strip small { font: 8pt "Segoe UI", sans-serif; color: #444; }

        .lgsa-filters > div { display: flex; flex-direction: column; min-width: 0; }
        .lgsa-filters label { font: bold 9pt "Segoe UI", sans-serif; margin: 0; }
        .lgsa-filters .lgsa-dt { display: inline-flex; align-items: center; gap: 3px; }
        .lgsa-filters input[type=text] { width: 70px; }
        .lgsa-filters .dtcombo-wrap, .lgsa-filters select.win-combo { width: 160px; max-width: 100%; }
        table.hrm-grid .hrm-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 6px; font-size: 8pt; line-height: 18px; }
        @media (max-width: 1000px) { .lgsa-cells { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 800px) { .lgsa-main { grid-template-columns: 1fr; } }

<!-- 939 Architecture.WinApp.Service.lgstcm.frmLogisticAgreement (DocumentTypeId 1301). AutoScrollMinSize 1200 x 650, KeyPreview.
     tabControl1 "Form" | "History".
     Form: toolStrip1 New | Refresh | Save | SaveAs (hidden) | Update (hidden) | Delete (hidden) | Attachment | 1301-Print | ShortCut Keys;
       "Logistics Agreement :" + Preview.
       groupBox2 "Main Information": Doc No,Date; Service Type; Bill To Party (CmbBrokerAgentName); Broker Agent / Service Provider
       (CmbServiceProvider); Transaction Currency + Exchange Rate; Fcy Currency (disabled) + Fcy Rate; Effective Date From / To; Active; Remarks.
       groupBox3 "Detail Information": Party Ref Doc No, Ref Doc Date, Master Item / Category + CmbMasterItem, Service Item (Name / Code),
       Transaction Currency (disabled), Service Rate, Rate Base, Tcy Amount, Lcy Amount, Remarks, + / Update / Cancel.
       grdCustomerDetail: X, Edit; Id / ItemId / TransactionCurrencyId / RateBaseId hidden; ServiceRate and Remarks editable.
     History: New | Refresh; Filters Date Type, Date From / To, Doc From / To, Service Type, Service Provider, Show,
       Doc / Entry / Modify / Approved Date; grdHistory (Edit, Save As, Print) + detail. -->
<body class="pd-body hrm-body" data-screen="939">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs">
        <button type="button" class="hrm-tab is-active" data-tab="tabPage1">Form</button>
        <button type="button" class="hrm-tab" data-tab="tabPage3">History</button>
    </div>
    <!-- ====================================================================== Form -->
    <div class="hrm-tab-page is-active" id="tabPage1">
        <div class="win-tool-strip">
            <button type="button" id="btnnew" class="win-btn-tool" onclick="LgsAG.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="LgsAG.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="LgsAG.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnSaveAs" class="win-btn-tool is-hidden" onclick="LgsAG.btnSaveAs(this)"><i class="fa fa-files-o"></i> <span>SaveAs</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="LgsAG.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="LgsAG.btnDelete(this)"><i class="fa fa-trash"></i> <span><u>D</u>elete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" onclick="LgsAG.attachment()" title="Attachments are not ported on the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="btnPrint" class="win-btn-tool" onclick="LgsAG.btnPrint(this)"><i class="fa fa-print"></i> <span>1301-<u>P</u>rint</span></button>
            <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="LgsAG.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="lgsa-strip">
            <span><span class="lgsa-title">Logistics Agreement :</span>
                <small>A centralized record for creating, approving, and managing logistics and transportation agreements.</small></span>
            <label class="hrm-check"><input type="checkbox" id="ChkPreview"> Preview</label>
        </div>
        <div class="lgsa-wrap">
            <fieldset class="hrm-group">
                <legend>Main Information</legend>
                <div class="lgsa-main">
                    <div class="hrm-field"><label for="txtdocno">Doc No,Date</label>
                        <div class="lgsa-pair"><input type="text" id="txtdocno" class="win-textbox" readonly tabindex="-1"/><input type="date" id="txtdocdate" class="win-textbox"/></div></div>
                    <div class="hrm-field"><label for="CmbServiceProvider" title="Broker Agent / Service Provider">Broker Agent / Service Provider</label><select id="CmbServiceProvider" class="win-combo dtcombo" data-dtcombo="party4"></select></div>
                    <div class="hrm-field"><label for="txtEffectiveDateFrom">Effective Date From</label><input type="date" id="txtEffectiveDateFrom" class="win-textbox"/></div>
                    <div class="hrm-field"><label for="CmbServiceType">Service Type</label><select id="CmbServiceType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="CmbTransactionCurrency">Transaction Currency</label>
                        <div class="lgsa-pair"><select id="CmbTransactionCurrency" class="win-combo dtcombo" data-dtcombo="single"></select><input type="text" id="txtTransactionExchangeRate" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off" title="Exchange Rate"/></div></div>
                    <div class="hrm-field"><label for="txtEffectiveDateTo">Effective Date To</label><input type="date" id="txtEffectiveDateTo" class="win-textbox"/></div>
                    <div class="hrm-field"><label for="CmbBrokerAgentName">Bill To Party</label><select id="CmbBrokerAgentName" class="win-combo dtcombo" data-dtcombo="party4"></select></div>
                    <div class="hrm-field"><label for="CmbFcyCurrency">Fcy Currency</label>
                        <div class="lgsa-pair"><select id="CmbFcyCurrency" class="win-combo dtcombo" data-dtcombo="single" disabled></select><input type="text" id="txtFcyExchangeRate" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off" title="Fcy Rate"/></div></div>
                    <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="chkIsActive"> Active</label></div>
                    <div class="hrm-field hrm-span-all"><label for="txtRemarksHeader">Remarks</label><input type="text" id="txtRemarksHeader" class="win-textbox" autocomplete="off"/></div>
                </div>
            </fieldset>
            <fieldset class="hrm-group">
                <legend>Detail Information</legend>
                <div class="lgsa-cells">
                    <div><label for="txtPartyRefDocNo">Party Ref Doc No</label><input type="text" id="txtPartyRefDocNo" class="win-textbox" autocomplete="off"/></div>
                    <div><label for="txtPartyRefDocDate">Ref Doc Date</label><input type="date" id="txtPartyRefDocDate" class="win-textbox"/></div>
                    <div><span class="lgsa-radios"><label><input type="radio" name="radCatMaster" id="RadMasterItem" checked> Master Item</label><label><input type="radio" name="radCatMaster" id="RadCategory"> Category</label></span>
                        <select id="CmbMasterItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="lgsa-w2"><span class="lgsa-radios"><label for="CmbItemName" style="font-weight:bold">Service Item</label><label><input type="radio" name="radNameCode" id="RadItemNamePackListDetail" checked> Name</label><label><input type="radio" name="radNameCode" id="RadItemCodePackListDetail"> Code</label></span>
                        <select id="CmbItemName" class="win-combo dtcombo" data-dtcombo="lgsaItem"></select></div>
                    <div><label for="CmbTransactionCurrencyDetail">Transaction Currency</label><select id="CmbTransactionCurrencyDetail" class="win-combo dtcombo" data-dtcombo="single" disabled></select></div>
                    <div><label for="txtServiceRate">Service Rate</label><input type="text" id="txtServiceRate" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                    <div><label for="CmbRateBaseType">Rate Base</label><select id="CmbRateBaseType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div><label for="txtTcyAmount">Tcy Amount</label><input type="text" id="txtTcyAmount" class="win-textbox hrm-al-right" readonly disabled/></div>
                    <div><label for="txtLcyAmountDetail">Lcy Amount</label><input type="text" id="txtLcyAmountDetail" class="win-textbox hrm-al-right" readonly disabled/></div>
                    <div class="lgsa-w3"><label for="txtRemarksDetail">Remarks</label><input type="text" id="txtRemarksDetail" class="win-textbox" autocomplete="off"/></div>
                    <div class="lgsa-btns">
                        <button type="button" id="BtnAddCustomer" class="win-btn-action" style="min-width:39px;width:39px" onclick="LgsAG.BtnAddCustomer()">+</button>
                        <button type="button" id="BtnUpdateCustmer" class="win-btn-action is-hidden" style="min-width:64px" onclick="LgsAG.BtnUpdateCustmer()">Update</button>
                        <button type="button" id="BtnCancelCustomer" class="win-btn-action is-hidden" style="min-width:64px" onclick="LgsAG.BtnCancelCustomer()">Cancel</button>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="hrm-grid-box" id="boxDetail">
            <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="Agreement:grdCustomerDetail" id="grdCustomerDetail"></table></div>
        </div>
    </div>
    <!-- ====================================================================== History -->
    <div class="hrm-tab-page" id="tabPage3">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="LgsAG.btnHistoryRefresh()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefreshHistory" class="win-btn-tool" onclick="LgsAG.BtnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        </div>
        <div class="hrm-caption">Logistics Agreement History</div>
        <div class="lgsa-filters">
            <div><label for="cmbDateTypeHistory">Date Type</label><select id="cmbDateTypeHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div><label>Date From</label><span class="lgsa-dt"><input type="checkbox" id="chkFromDateHistory" checked title="Use Date From"><input type="date" id="FromDateHistory" class="win-textbox"/></span></div>
            <div><label>Date To</label><span class="lgsa-dt"><input type="checkbox" id="chkToDateHistory" checked title="Use Date To"><input type="date" id="ToDateHistory" class="win-textbox"/></span></div>
            <div><label for="FromDocNoHistory">Doc From</label><input type="text" id="FromDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
            <div><label for="ToDocNoHistory">Doc To</label><input type="text" id="ToDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
            <div><label for="CmbServiceTypeHistory">Service Type</label><select id="CmbServiceTypeHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div><label for="CmbServiceProviderHistory">Service Provider</label><select id="CmbServiceProviderHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div><button type="button" id="btnshow" class="win-btn-action" onclick="LgsAG.btnshow(this)">Show</button></div>
            <div><span class="lgsa-radios">
                <label><input type="radio" name="histDate" id="drdocdate" checked> Doc Date</label>
                <label><input type="radio" name="histDate" id="rdentrydate"> Entry Date</label>
                <label><input type="radio" name="histDate" id="rdmodifydate"> Modify Date</label>
                <label><input type="radio" name="histDate" id="rdapproveddate"> Approved Date</label>
            </span></div>
        </div>
        <div class="hrm-grid-box" id="boxHistory">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="Agreement:grdHistory" id="grdHistory"></table></div>
        </div>
        <div class="hrm-grid-box hrm-grid-short">
            <div class="hrm-subcaption"><span>Detail of the Above Selected Row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grdHistoryDetail"></table></div>
        </div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_logistics_agreement.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
