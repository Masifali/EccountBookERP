<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Freight Voucher Export (Multi Vehicles) - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.Service.lgstcm.frmFreightVoucherExportMultiVehicles (967, DocumentTypeId 1305, one voucher per vehicle under a master doc).
     toolStrip1: New | Refresh | Save | Update (hidden) | Delete (hidden) | Attachment | 1305_01-Print | Voucher | ShortCut Keys;
     ChkPreview "Preview 1305_01", chkVoucher "Voucher"; Charges To Account (Dr). groupBox2 "Voucher Main Information", groupBox3
     "Filters To Load Data", the city updater, grdVoucher. tabPage1 "Form", tabPage3 "History". -->
<body class="pd-body hrm-body" data-hrm="lgsb-freight-voucher-export-multi" data-screen="967">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="LgsFM.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="LgsFM.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="LgsFM.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="LgsFM.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="LgsFM.btnDelete(this)"><i class="fa fa-trash"></i> <span><u>D</u>elete</span></button>
        <button type="button" id="btnAttachment" class="win-btn-tool" onclick="LgsB.noAttachments()"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" onclick="LgsFM.btnPrint(this)" data-rpt-own data-rpt="1305_01_FreightVoucherOutward_Slip.rpt"><i class="fa fa-print"></i> <span>1305_01-<u>P</u>rint</span></button>
        <button type="button" id="btnPrintVoucher" class="win-btn-tool" onclick="LgsFM.btnPrintVoucher(this)" data-rpt-own data-rpt="102-ANewAcRptPaymentReceiptsVoucherSlip.rpt"><i class="fa fa-print"></i> <span>Voucher</span></button>
        <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="LgsFM.btnshortcutkeys(this)"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        <span class="lgsb-tools-right"><label><input type="checkbox" id="ChkPreview"> Preview 1305_01</label><label><input type="checkbox" id="chkVoucher"> Voucher</label></span>
    </div>
    <div class="hrm-caption">Freight Voucher Export</div>
    <div class="lgsb-row">
        <div class="hrm-field hrm-stack lgsb-w2"><label for="CmbChargesToDrAccount" class="hrm-req">Charges To Account (Dr)</label><select id="CmbChargesToDrAccount" class="win-combo dtcombo"></select></div>
    </div>
    <div class="hrm-tabs" data-tabs="main">
        <button type="button" class="hrm-tab is-active" data-tab="tabPage1">Form</button>
        <button type="button" class="hrm-tab" data-tab="tabPage3">History</button>
    </div>

    <!-- ============================================================ Form -->
    <div class="hrm-tab-page is-active" id="tabPage1" data-tabs-page="main">
        <fieldset class="hrm-group">
            <legend>Voucher Main Information</legend>
            <div class="lgsb-row">
                <div class="hrm-field hrm-stack lgsb-w2"><label>Voucher No &amp; Date</label>
                    <div class="lgsb-sub"><input type="text" id="txtdocno" class="win-textbox" readonly tabindex="-1" style="max-width:90px"/><input type="date" id="txtdocdate" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label for="CmbTransporter" class="hrm-req">Transporter</label><select id="CmbTransporter" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbLogisticPoNo">P.O No</label><select id="CmbLogisticPoNo" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtFreightRate">Freight Rate</label><input type="text" id="txtFreightRate" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="CmbRateUom">Rate Uom</label><select id="CmbRateUom" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtQtyForRate">Qty For Rate</label><input type="text" id="txtQtyForRate" class="win-textbox hrm-al-right" disabled/></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="BtnApplyRate" class="win-btn-action" onclick="LgsFM.BtnApplyRate(this)">Apply Rate</button></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label for="txtRemarksHeader">Remarks</label><input type="text" id="txtRemarksHeader" class="win-textbox" autocomplete="off"/></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group">
            <legend>Filters To Load Data</legend>
            <div class="lgsb-row">
                <div class="hrm-field hrm-stack lgsb-w2"><label>Gp Date From,To</label><div class="lgsb-sub"><input type="date" id="txtGpFromDateLoader" class="win-textbox"/><input type="date" id="txtGpToDateLoader" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label>Gp No From,To</label><div class="lgsb-sub"><input type="text" id="txtGpNoFromLoader" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/><input type="text" id="txtGpNoToLoader" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label for="CmbCustomerLoader">Customer</label><select id="CmbCustomerLoader" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="BtnShowLoader" class="win-btn-action" onclick="LgsFM.BtnShowLoader(this)">Show</button></div>
            </div>
            <div class="lgsb-row">
                <div class="hrm-field hrm-stack lgsb-w2"><div class="lgsb-radios"><label><input type="checkbox" id="chkLoadingCity" checked> Loading City</label><label><input type="checkbox" id="chkUnLoadingCity" checked> Un-Loading City</label></div>
                    <select id="CmbCityName" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="BtnUpdateCityInGrid" class="win-btn-action" onclick="LgsFM.BtnUpdateCityInGrid(this)">Update In Detail</button></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label>&nbsp;</label><small>Click to update the selected City or the same City Selected in the 1st row when this combo is empty, in all rows of grid</small></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Vouchers</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="FreightVoucherExportMulti:grdVoucher" id="grdVoucher"></table></div>
        </div>
    </div>

    <!-- ============================================================ History -->
    <div class="hrm-tab-page" id="tabPage3" data-tabs-page="main">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="LgsFM.btnHistoryRefresh(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefreshHistory" class="win-btn-tool" onclick="LgsFM.BtnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        </div>
        <div class="hrm-caption">Freight Voucher Export</div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="lgsb-row">
                <div class="hrm-field hrm-stack lgsb-w2"><label for="cmbDateTypeHistory">Date Type</label><select id="cmbDateTypeHistory" class="win-combo dtcombo"></select></div>
                <div class="hrm-field hrm-stack"><label><input type="checkbox" id="FromDateHistoryOn" checked> Date From</label><input type="date" id="FromDateHistory" class="win-textbox"/></div>
                <div class="hrm-field hrm-stack"><label><input type="checkbox" id="ToDateHistoryOn" checked> To</label><input type="date" id="ToDateHistory" class="win-textbox"/></div>
                <div class="hrm-field hrm-stack"><label for="FromDocNoHistory">Doc From</label><input type="text" id="FromDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="ToDocNoHistory">Doc To</label><input type="text" id="ToDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnshow" class="win-btn-action" onclick="LgsFM.btnshow(this)">Show</button></div>
                <div class="hrm-field hrm-stack lgsb-w2"><label>&nbsp;</label><div class="lgsb-radios">
                    <label><input type="radio" name="histDateKind" value="doc" checked> Doc Date</label><label><input type="radio" name="histDateKind" value="modify"> Modify Date</label>
                    <label><input type="radio" name="histDateKind" value="entry"> Entry Date</label><label><input type="radio" name="histDateKind" value="approved"> Approved Date</label></div></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box" id="boxHistory">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="FreightVoucherExportMulti:grdHistory" id="grdHistory"></table></div>
        </div>
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Detail of the Above Selected Row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grdHistoryDetail"></table></div>
        </div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_logistics_lgsb_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_logistics_freight_voucher_export_multi.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
