<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>User Roles</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-users"></i> User Roles</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ROLE NAME</th>
                                    <th>ROLE CODE</th>
                                    <th>STATUS</th>
                                    <th style="text-align:center; width:90px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="r, stat : ${roles}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${r.userGroupName}"></td>
                                    <td th:text="${r.userGroupRole}"></td>
                                    <td th:text="${r.status ? 'Active' : 'Inactive'}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a th:href="@{/user-management/roles/edit/{id}(id=${r.userGroupId})}" title="Edit"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{/user-management/roles/delete/{id}(id=${r.userGroupId})}" title="Delete" onclick="return confirm('Delete this role?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${roles == null or roles.isEmpty()}">
                                    <td colspan="5" style="text-align:center; color:#9aa3ae; padding:30px;">No roles defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-plus"></i> Add / Edit Role</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <form th:action="@{/user-management/roles/save}" th:object="${role}" method="post" class="form-horizontal">
                                <input type="hidden" th:field="*{userGroupId}"/>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Role Name</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{userGroupName}" placeholder="e.g. Accounts Officer" required/>
                                    </div>
                                    <label class="col-sm-2 control-label">Role Code</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{userGroupRole}" placeholder="e.g. ACCOUNTS (used as the login role)" required/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Active</label>
                                    <div class="col-sm-4">
                                        <input type="checkbox" th:field="*{status}"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-offset-2 col-sm-10">
                                        <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save</button>
                                        <a th:href="@{/user-management/roles}" class="btn btn-default"><i class="fa fa-plus"></i> New</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
