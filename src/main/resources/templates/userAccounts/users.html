<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>User Registration</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-user"></i> User Registration</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>USERNAME</th>
                                    <th>NAME</th>
                                    <th>ROLE</th>
                                    <th>STATUS</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="u, stat : ${users}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${u.userName}"></td>
                                    <td th:text="${u.firstName} + ' ' + ${u.lastName}"></td>
                                    <td th:text="${u.userGroup != null ? u.userGroup.userGroupName : ''}"></td>
                                    <td th:text="${u.isActive ? 'Active' : 'Inactive'}"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a th:href="@{/user-management/rights(userId=${u.id})}" title="Rights"><i class="fa fa-key"></i></a>
                                        &nbsp;
                                        <a th:href="@{/user-management/users/edit/{id}(id=${u.id})}" title="Edit"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{/user-management/users/delete/{id}(id=${u.id})}" title="Delete" onclick="return confirm('Delete this user?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${users == null or users.isEmpty()}">
                                    <td colspan="6" style="text-align:center; color:#9aa3ae; padding:30px;">No users defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-plus"></i> Add / Edit User</h2>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <form th:action="@{/user-management/users/save}" th:object="${user}" method="post" class="form-horizontal">
                                <input type="hidden" th:field="*{id}"/>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Username</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{userName}" required/>
                                    </div>
                                    <label class="col-sm-2 control-label">Password</label>
                                    <div class="col-sm-4">
                                        <input type="password" class="form-control" name="password" placeholder="Leave blank to keep current password"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">First Name</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{firstName}"/>
                                    </div>
                                    <label class="col-sm-2 control-label">Last Name</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{lastName}"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Role</label>
                                    <div class="col-sm-4">
                                        <select name="userGroupId" class="form-control">
                                            <option value="">-- None --</option>
                                            <option th:each="r : ${roles}" th:value="${r.userGroupId}"
                                                    th:selected="${user.userGroup != null and user.userGroup.userGroupId == r.userGroupId}"
                                                    th:text="${r.userGroupName} + ' (' + ${r.userGroupRole} + ')'"></option>
                                        </select>
                                    </div>
                                    <label class="col-sm-2 control-label">Cell No</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" th:field="*{cellNo}"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Active</label>
                                    <div class="col-sm-4">
                                        <input type="checkbox" th:field="*{isActive}"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-offset-2 col-sm-10">
                                        <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Save</button>
                                        <a th:href="@{/user-management/users}" class="btn btn-default"><i class="fa fa-plus"></i> New</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
