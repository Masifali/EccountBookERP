<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Branch Allocation To User - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_user_define.css?v=20261001a}"/>
</head>
<!--
  Architecture.WinApp.Lookups.frmBranchesAllocationToUser (opened by frmUserRights "Branches Allocation To User"), 802 x 586.
  panel2 toolStrip (25): Refresh | Define User | ShortCut Keys; panel6 (27, rgb 10,110,110) "Branch Allocation To User";
  panel7 (45, white): "User Name" (4,16) * (79,15) CmbUserName (94,10) 241x26 [Leave -> ShowData] Show (339,10) 61x26;
  panel3 (400 wide): "Un_Allocated Branch against Selected User" + allocate button (371,0); panel4 (400): "Allocated Branch against selected User" + de-allocate (371,0).
-->
<body class="pd-body ud-body" data-screen="frmBranchesAllocationToUser">
<div class="pd-form ud-form" style="max-width:802px;">
    <div class="win-tool-strip" id="tsItemType">
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="UB.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="BtnUser" class="win-btn-tool" onclick="UB.BtnUser()"><i class="fa fa-user"></i> <span>Define User</span></button>
        <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="UB.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="ud-caption ud-caption-27"><span>Branch Allocation To User</span></div>
    <div class="ud-userbar" style="height:45px;">
        <label for="CmbUserName" class="ud-userlbl" style="left:4px;top:16px;">User Name</label>
        <span class="ud-star" style="left:79px;top:15px;">*</span>
        <select id="CmbUserName" class="win-combo dtcombo ud-usercombo" data-dtcombo="single" data-dtcombo-caption="UserName" style="left:94px;top:10px;width:241px;"></select>
        <button type="button" id="btnshow" class="ud-teal-btn ud-showbtn" style="left:339px;top:10px;width:61px;height:26px;" onclick="UB.btnshow(this)">Show</button>
    </div>
    <div class="ud-three ud-two">
        <div class="ud-col" style="flex-basis:400px;">
            <div class="ud-colhead ud-colhead-25"><span>Un_Allocated Branch against Selected User</span>
                <button type="button" id="BtnAllocateItems" class="ud-headbtn" title="Allocate (Ctrl+A)" onclick="UB.allocate(this)"><i class="fa fa-check"></i></button></div>
            <div class="win-grid-scroll"><table class="win-grid ud-grid ud-grid-fill" id="GridUnAllocatedBranchs"><thead><tr><th style="width:60px;" class="ud-center"><input type="checkbox" data-all="GridUnAllocatedBranchs"/></th><th>BranchName</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="ud-col" style="flex-basis:400px;">
            <div class="ud-colhead ud-colhead-25"><span>Allocated Branch against selected User</span>
                <button type="button" id="btnDeAllocate" class="ud-headbtn" title="Un-Allocate (Ctrl+D)" onclick="UB.deallocate(this)"><i class="fa fa-times"></i></button></div>
            <div class="win-grid-scroll"><table class="win-grid ud-grid ud-grid-fill" id="GridAllocatedBranchs"><thead><tr><th style="width:60px;" class="ud-center"><input type="checkbox" data-all="GridAllocatedBranchs"/></th><th>BranchName</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>
</div>
<div class="ud-toast" id="udToast" role="status" aria-live="polite"></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_user_define.js?v=20261001a}"></script>
</body>
</html>
