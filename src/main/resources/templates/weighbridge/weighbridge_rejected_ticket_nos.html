<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WeighBridge History For Rejected Status - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_weighbridge_extras.css?v=20260924b}">
</head>
<body data-page="rejected">
<!-- Screen 359 frmWeighBridgeRejectedTicketNos — Move Order (74) tickets not yet used by a stock transfer. -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="WbExtras.reset()"><i class="fa fa-file-o"></i> New</button>
    <span class="sep"></span>
    <button type="button" class="win-btn-tool" onclick="WbExtras.close()"><i class="fa fa-times"></i> Close</button>
</div>
<div class="win-teal-header"><span class="win-teal-header-title">WeighBridge Move Order History</span></div>
<div class="win-form-body">
    <div class="grid-bar"><span>Tickets <span id="lblCount"></span></span></div>
    <div class="win-grid-scroll" id="grdHistory"></div>
</div>

<script th:src="@{/build/js/countx_weighbridge_extras.js?v=20260924b}"></script>
</body>
</html>
