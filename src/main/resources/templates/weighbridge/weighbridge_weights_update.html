<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WeighBridge_WeightsUpdate - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_weighbridge_extras.css?v=20260924b}">
</head>
<body data-page="weightupdate">
<!-- WeighBridge_WeightUpdate (Inventory_Reports) — Gear → Admin Panel → "WeighBridge_WeightsUpdate".
     Admin only (DashboardNew.cs:1191). Saves through USP_WbTransactions_WeightUpdation (ERP feature 22). -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="WbExtras.newClick()"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.printRegister()"><i class="fa fa-print"></i> 281-Register</button>
    <button type="button" class="win-btn-tool" id="btnUpdate" onclick="WbExtras.updateChecked()"><i class="fa fa-pencil"></i> Update</button>
    <span class="sep"></span>
    <button type="button" class="win-btn-tool" onclick="WbExtras.close()"><i class="fa fa-times"></i> Close</button>
</div>
<div class="win-teal-header"><span class="win-teal-header-title">Weigh Bridge History</span></div>
<div class="win-form-body">
    <div id="denied" class="is-hidden" style="color:#7f0000;background:#ffebee;border:1px solid #e57373;padding:5px 9px;margin-bottom:6px;"></div>
    <div class="filters">
        <div class="f"><label for="FromDate">From Date</label><input type="date" id="FromDate"></div>
        <div class="f"><label for="ToDate">To Date</label><input type="date" id="ToDate"></div>
        <div class="f pair"><label>Ticket From / To</label><input type="text" id="txtTicketNoFrom" inputmode="numeric"><input type="text" id="txtTicketNoTo" inputmode="numeric"></div>
        <div class="f pair"><label>Gp From / To</label><input type="text" id="GPNoFrom" inputmode="numeric"><input type="text" id="GpNoTo" inputmode="numeric"></div>
        <div class="f pair"><label>Po# From / To</label><input type="text" id="txtOrderNoFrom" inputmode="numeric"><input type="text" id="txtOrderNoTo" inputmode="numeric"></div>
        <div class="f"><label for="TxtVehicleNumber">Vehicle No.</label><input type="text" id="TxtVehicleNumber"></div>
        <div class="f"><label>Branch</label><details class="chk-combo" id="CmbBranch"><summary> </summary><div class="chk-list"></div></details></div>
        <!-- On the desktop these six combos are never filled (their Fill methods are never called),
             so they are always empty and never narrow the search. Shown the same way. -->
        <div class="f"><label>GatePass Type</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><label>WeighBridge Type</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><label>Party Name</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><label>Wb Party</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><label>Doc Type</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><label>Wb Status</label><select disabled title="Never filled on the desktop"></select></div>
        <div class="f"><span></span><button type="button" class="win-btn-action" onclick="WbExtras.show()">Show</button></div>
    </div>
    <div class="lform" style="grid-template-columns:150px minmax(200px,520px);">
        <label class="win-label" for="txtComments">Comments For Updation <span class="req">*</span></label>
        <input id="txtComments" class="win-textbox" type="text" maxlength="150" autocomplete="off">
    </div>
    <div class="grid-bar"><span>History <span id="lblCount"></span></span></div>
    <div class="win-grid-scroll" id="DataGridHistory"></div>
</div>

<script th:src="@{/build/js/countx_weighbridge_extras.js?v=20260924b}"></script>
</body>
</html>
