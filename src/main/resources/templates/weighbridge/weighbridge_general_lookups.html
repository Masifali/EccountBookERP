<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weigh Bridge Lookup - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_weighbridge_extras.css?v=20260924b}">
</head>
<body data-page="general">
<!-- WeighBridgeGeneralLookups (Architecture.WinApp) — parties and items typed on the weigh bridge. -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="WbExtras.reset()"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn-tool" id="btnsave" onclick="WbExtras.save()"><i class="fa fa-save"></i> Save</button>
    <button type="button" class="win-btn-tool is-hidden" id="btnUpdate" onclick="WbExtras.update()"><i class="fa fa-pencil"></i> Update</button>
    <span class="sep"></span>
    <button type="button" class="win-btn-tool" onclick="WbExtras.close()"><i class="fa fa-times"></i> Close</button>
</div>
<div class="win-teal-header"><span class="win-teal-header-title">Weigh Bridge Lookup</span></div>
<div class="win-form-body">
    <div class="lform">
        <label class="win-label" for="CmbType">Type <span class="req">*</span></label>
        <select id="CmbType" class="win-combo"></select>
        <label class="win-label" for="txtDescription">Description <span class="req">*</span></label>
        <input id="txtDescription" class="win-textbox" type="text" maxlength="250" autocomplete="off">
    </div>
    <div class="grid-bar"><span>Records</span></div>
    <div class="win-grid-scroll" id="grd" style="max-width:600px;"></div>
</div>

<script th:src="@{/build/js/countx_weighbridge_extras.js?v=20260924b}"></script>
</body>
</html>
