<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicle Weight Define - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_weighbridge_extras.css?v=20260924b}">
</head>
<body data-page="vehicle">
<!-- VehicleWeightLookUp (Architecture.WinApp.Lookups) — tare weight per vehicle. -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="WbExtras.reset()"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
    <button type="button" class="win-btn-tool" id="btnsave" onclick="WbExtras.save()"><i class="fa fa-save"></i> Save</button>
    <button type="button" class="win-btn-tool is-hidden" id="btnUpdate" onclick="WbExtras.update()"><i class="fa fa-pencil"></i> Update</button>
    <span class="sep"></span>
    <button type="button" class="win-btn-tool" onclick="WbExtras.shortcuts()"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.close()"><i class="fa fa-times"></i> Close</button>
</div>
<div class="win-teal-header"><span class="win-teal-header-title">Vehicle Weight Define</span></div>
<div class="win-form-body">
    <div class="lform">
        <label class="win-label" for="CmbVehicleType">Vehicle Type <span class="req">*</span></label>
        <select id="CmbVehicleType" class="win-combo"></select>
        <label class="win-label" for="txtVehicleNo">Vehicle No <span class="req">*</span></label>
        <input id="txtVehicleNo" class="win-textbox" type="text" maxlength="50" autocomplete="off">
        <label class="win-label" for="txtVehicleNetWeight">Net Weight</label>
        <input id="txtVehicleNetWeight" class="win-textbox num" type="text" inputmode="decimal" autocomplete="off">
        <label class="win-label" for="txtRemarks">Remarks</label>
        <input id="txtRemarks" class="win-textbox" type="text" maxlength="300" autocomplete="off">
    </div>
    <div class="grid-bar"><span>Vehicles</span></div>
    <div class="win-grid-scroll" id="Grd"></div>
</div>

<script th:src="@{/build/js/countx_weighbridge_extras.js?v=20260924b}"></script>
</body>
</html>
