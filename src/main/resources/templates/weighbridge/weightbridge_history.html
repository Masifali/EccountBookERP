<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weigh Bridge Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_weighbridge_extras.css?v=20260924b}">
</head>
<body data-page="history">
<!-- Screen 360 frmWeightBridgeHistory — Sp_WbTransactions_History; 281 register and 280 slip prints. -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="WbExtras.newClick()"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
    <button type="button" class="win-btn-tool" onclick="WbExtras.printRegister()"><i class="fa fa-print"></i> 281-Register</button>
    <span class="sep"></span>
    <button type="button" class="win-btn-tool" onclick="WbExtras.close()"><i class="fa fa-times"></i> Close</button>
</div>
<div class="win-teal-header"><span class="win-teal-header-title">Weigh Bridge History</span></div>
<div class="win-form-body">
    <div class="filters">
        <div class="f"><label for="FromDate">From Date</label><input type="date" id="FromDate"></div>
        <div class="f"><label for="ToDate">To Date</label><input type="date" id="ToDate"></div>
        <div class="f pair"><label>Ticket From / To</label><input type="text" id="txtTicketNoFrom" inputmode="numeric"><input type="text" id="txtTicketNoTo" inputmode="numeric"></div>
        <div class="f pair"><label>Gp From / To</label><input type="text" id="GPNoFrom" inputmode="numeric"><input type="text" id="GpNoTo" inputmode="numeric"></div>
        <div class="f pair"><label>Po# From / To</label><input type="text" id="txtOrderNoFrom" inputmode="numeric"><input type="text" id="txtOrderNoTo" inputmode="numeric"></div>
        <div class="f"><label for="TxtVehicleNumber">Vehicle No.</label><input type="text" id="TxtVehicleNumber"></div>
        <div class="f"><label>GatePass Type</label><details class="chk-combo" id="CmbGatePassType"><summary> </summary><div class="chk-list"></div></details></div>
        <div class="f"><label for="CmbWeighBridgeType">WeighBridge Type</label><select id="CmbWeighBridgeType"></select></div>
        <div class="f"><label>Branch</label><details class="chk-combo" id="CmbBranch"><summary> </summary><div class="chk-list"></div></details></div>
        <div class="f"><label for="CmbPartyName">Party Name</label><select id="CmbPartyName"></select></div>
        <div class="f"><label for="CmbWeighBridgeParty">Wb Party</label><select id="CmbWeighBridgeParty"></select></div>
        <div class="f"><label for="CmbDocType">Doc Type</label><select id="CmbDocType"></select></div>
        <div class="f"><span></span><button type="button" class="win-btn-action" onclick="WbExtras.show()">Show</button></div>
    </div>
    <div class="grid-bar"><span>History <span id="lblCount"></span></span></div>
    <div class="win-grid-scroll" id="DataGridHistory"></div>
</div>

<script th:src="@{/build/js/countx_weighbridge_extras.js?v=20260924b}"></script>
</body>
</html>
