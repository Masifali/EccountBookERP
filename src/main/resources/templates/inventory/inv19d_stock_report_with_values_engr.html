<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Report With Values (Engr) - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <style>
        /* frmStockReportWithValues_Engr designer geometry (InitializeComponent :1147-2925), 1:1 px. panel1 1194 wide:
           panel2 toolStrip1 (27) | panel3 filters (174, panel5 31 docked on its top) | panel4 teal (23) | grdfrm (Fill). */
        :root { --swv-teal: #008080; --swv-dark: #0a6e6e; }
        body { background: #fff; margin: 0; padding-bottom: 12px; }
        .fx-scroll { overflow-x: auto; }
        .fx-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .fx-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .fx-rel { position: relative; }
        .fx-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .fx-lbl.wrap { white-space: normal; width: 69px; }
        .fx-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; color: #000; }
        .fx-chk input { margin: 0; }
        .fx-rd-w { color: #fff; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-weight: normal; font-size: 11px; }
        .fx-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .fx-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; cursor: pointer; white-space: nowrap; color: #000; }
        .fx-tool.small { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; }
        .fx-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .fx-btn { background: var(--swv-dark); color: #fff; border: 1px solid #054d4d; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; padding: 0; cursor: pointer; }
        .fx-btn:hover:not(:disabled) { background: #054d4d; }
        .fx-multi { position: relative; }
        .fx-multi-btn { width: 100%; height: 26px; background: #fff; border: 1px solid #7a7a7a; text-align: left; padding: 0 4px; font-family: Verdana, sans-serif; font-size: 13px; display: flex; justify-content: space-between; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; }
        .fx-multi-btn span { overflow: hidden; text-overflow: ellipsis; }
        .fx-multi-list { position: absolute; z-index: 50; top: 26px; left: 0; min-width: 100%; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #7a7a7a; padding: 3px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.2); display: none; }
        .fx-multi-list label { display: block; white-space: nowrap; font: 12px Verdana, sans-serif; }
        .fx-multi-list label.all { border-bottom: 1px solid #ddd; margin-bottom: 2px; font-weight: bold; }
        .fx-dd { position: relative; display: inline-block; }
        .fx-dd-list { position: absolute; z-index: 60; top: 26px; left: 0; min-width: 220px; background: #fff; border: 1px solid #7a7a7a; box-shadow: 0 2px 6px rgba(0,0,0,.2); display: none; }
        .fx-dd-list button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 4px 10px; font: 12px "Segoe UI", Tahoma, sans-serif; cursor: pointer; }
        .fx-dd-list button:hover { background: #ffe4a0; }
        .fx-dd-list .empty { padding: 4px 10px; font: italic 11px Tahoma, sans-serif; color: #777; }
        .fx-grid-host { overflow: auto; background: #fff; height: calc(100vh - 300px); min-height: 337px; position: relative; }
        .fx-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; border-collapse: collapse; }
        .fx-grid-host .win-grid th { background: linear-gradient(to bottom, #e6f7f7 0%, #bfe6e6 100%); border: 1px solid #8fbcbc; font-weight: normal; white-space: nowrap; padding: 2px 4px; text-align: center; position: sticky; z-index: 2; }
        .fx-grid-host .win-grid thead tr:nth-child(1) th { top: 0; }
        .fx-grid-host .win-grid thead tr:nth-child(2) th { top: 20px; }
        .fx-grid-host .win-grid thead tr.flt td { position: sticky; top: 40px; z-index: 2; background: #f4fbfb; border: 1px solid #c8dede; padding: 0; }
        .fx-grid-host .win-grid thead tr.flt input { width: 100%; box-sizing: border-box; border: 0; height: 18px; font: 11px Verdana, sans-serif; background: transparent; }
        .fx-grid-host .win-grid td { border: 1px solid #d5e6e6; white-space: nowrap; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; }
        .fx-grid-host .win-grid td.n { text-align: right; }
        .fx-grid-host .win-grid td a { color: #0000ee; text-decoration: underline; cursor: pointer; }
        .fx-grid-host .win-grid tbody tr.sel td { background: #cde8ff; }
        .fx-grid-host .win-grid tfoot td { background: #e6e6e6; font-weight: bold; text-align: right; position: sticky; bottom: 0; }
        .fx-nav { font: 11px Verdana, sans-serif; padding: 2px 8px; border-top: 1px solid #c8dede; background: #f4f4f4; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:1194px;">
    <!-- panel2 / toolStrip1: btnRefresh, btnPrint, BtnUpdate (never shown :190/:668), tsDrowdown "Print" (ReportsLoad :244, StockReports_Engr folder) -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnRefresh" title="Ctrl+N"><i class="fa fa-repeat"></i> <span><u>R</u>efresh</span></button>
        <button type="button" class="fx-tool small is-hidden" id="btnPrint" title="Ctrl+P"><i class="fa fa-print"></i> <span id="btnPrintText">Print</span></button>
        <button type="button" class="fx-tool is-hidden" id="BtnUpdate" disabled><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <div class="fx-dd" id="tsDrowdown">
            <button type="button" class="fx-tool small" id="tsDrowdownBtn"><i class="fa fa-print"></i> Print <i class="fa fa-caret-down"></i></button>
            <div class="fx-dd-list" id="tsDrowdownList"><div class="empty">No dynamic reports (StockReports_Engr)</div></div>
        </div>
    </div>
    <!-- panel3 (174) -->
    <div class="fx-rel" style="height:174px;">
        <!-- panel5 (31, docked top, #0a6e6e) -->
        <div class="fx-abs" style="left:0;top:0;width:1194px;height:31px;background:#0a6e6e;">
            <span class="fx-abs" style="left:5px;top:5px;font:bold 16px Tahoma, sans-serif;color:#fff;white-space:nowrap;line-height:19px;">Stock Report With Value</span>
            <label class="fx-abs fx-chk fx-rd-w" style="left:1023px;top:6px;"><input type="radio" name="rdValue" id="RdCGSAmount" checked> CGS Value</label>
            <label class="fx-abs fx-chk fx-rd-w" style="left:1114px;top:7px;"><input type="radio" name="rdValue" id="RdSaleAmount"> Sale Value</label>
        </div>

        <label class="fx-abs fx-lbl" style="left:4px;top:41px;">Branch Name</label>
        <div class="fx-abs fx-multi" id="cmbBranchName" style="left:93px;top:35px;width:236px;">
            <button type="button" class="fx-multi-btn"><span id="cmbBranchNameText"></span><i class="fa fa-caret-down"></i></button>
            <div class="fx-multi-list" id="cmbBranchNameList"></div>
        </div>
        <label class="fx-abs fx-lbl" style="left:4px;top:68px;">Date From,To</label>
        <input type="date" id="txtDateFrom" class="fx-abs fx-dt" style="left:93px;top:64px;width:117px;">
        <input type="date" id="txtDateTo" class="fx-abs fx-dt" style="left:212px;top:64px;width:117px;">
        <label class="fx-abs fx-lbl" style="left:4px;top:95px;">Parent Category</label>
        <div class="fx-abs fx-multi" id="cmbMainType" style="left:93px;top:89px;width:236px;">
            <button type="button" class="fx-multi-btn"><span id="cmbMainTypeText"></span><i class="fa fa-caret-down"></i></button>
            <div class="fx-multi-list" id="cmbMainTypeList"></div>
        </div>
        <label class="fx-abs fx-lbl" style="left:4px;top:122px;" for="cmbCategory">Item Category</label>
        <select id="cmbCategory" class="fx-abs fx-cmb win-combo" style="left:93px;top:116px;width:236px;"></select>
        <label class="fx-abs fx-lbl" style="left:4px;top:149px;" for="cmbItemType">Item Type </label>
        <select id="cmbItemType" class="fx-abs fx-cmb win-combo" style="left:93px;top:143px;width:236px;"></select>

        <label class="fx-abs fx-lbl" style="left:332px;top:41px;" for="cmbWareHouse">WareHouse</label>
        <select id="cmbWareHouse" class="fx-abs fx-cmb win-combo" style="left:417px;top:35px;width:181px;"></select>
        <label class="fx-abs fx-lbl" style="left:332px;top:68px;" for="cmbItem">Item Name</label>
        <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:417px;top:62px;width:181px;"></select>
        <label class="fx-abs fx-lbl" style="left:332px;top:95px;" for="cmbStockAccounts">Stock Account</label>
        <select id="cmbStockAccounts" class="fx-abs fx-cmb win-combo" style="left:417px;top:89px;width:181px;"></select>
        <label class="fx-abs fx-lbl wrap" style="left:332px;top:114px;" for="CmbModalDescription">Modal Description</label>
        <select id="CmbModalDescription" class="fx-abs fx-cmb win-combo" style="left:417px;top:116px;width:181px;"></select>
        <label class="fx-abs fx-lbl" style="left:332px;top:149px;" for="CmbWorkOrder">Work Order</label>
        <select id="CmbWorkOrder" class="fx-abs fx-cmb win-combo" style="left:417px;top:143px;width:181px;"></select>

        <label class="fx-abs fx-lbl wrap" style="left:599px;top:33px;" for="CmbProductionStage">Production Stage</label>
        <select id="CmbProductionStage" class="fx-abs fx-cmb win-combo" style="left:672px;top:35px;width:204px;"></select>
        <label class="fx-abs fx-lbl" style="left:599px;top:68px;" for="CmbBatchNo">Batch No</label>
        <select id="CmbBatchNo" class="fx-abs fx-cmb win-combo" style="left:672px;top:62px;width:204px;"></select>
        <label class="fx-abs fx-lbl wrap" style="left:599px;top:87px;" for="CmbCastingType">Casting Type</label>
        <select id="CmbCastingType" class="fx-abs fx-cmb win-combo" style="left:672px;top:89px;width:204px;"></select>
        <label class="fx-abs fx-chk" style="left:672px;top:120px;"><input type="checkbox" id="chkSkipZero" checked> Skip Zero</label>
        <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:819px;top:116px;width:57px;height:26px;" title="Ctrl+S">Show</button>

        <label class="fx-abs fx-chk" style="left:878px;top:34px;"><input type="checkbox" id="ChkModalDescriptionWise" checked> Modal Description Wise Stock</label>
        <label class="fx-abs fx-chk" style="left:878px;top:53px;"><input type="checkbox" id="ChkProductionStageWise"> Production Stage Wise Stock</label>
        <label class="fx-abs fx-chk" style="left:878px;top:72px;"><input type="checkbox" id="ChkWarehouseWise" checked> Warehouse Wise Stock</label>
        <label class="fx-abs fx-chk" style="left:878px;top:91px;"><input type="checkbox" id="ChkWorkOrderWise"> Work Order Wise Stock</label>
        <label class="fx-abs fx-chk" style="left:878px;top:110px;"><input type="checkbox" id="ChkCastingTypeWise"> Casting Type Wise Stock</label>
        <label class="fx-abs fx-chk" style="left:878px;top:129px;"><input type="checkbox" id="ChkBatchNoWise"> Batch Wise</label>

        <!-- label11 / cmbReportType are Visible=false in the designer (:1526/:1591); ReportTypeFill :502 has one row -->
        <select id="cmbReportType" class="is-hidden"><option value="ItemStockSummary" selected>Item Stock Summary</option></select>
    </div>
    <!-- panel4 (23, Teal): ctrlGrdBar1 (MyGrid = grdfrm) -->
    <div class="fx-rel" style="height:23px;background:#008080;">
        <div id="gbMount" class="fx-abs" style="left:1149px;top:1px;width:38px;height:21px;"></div>
    </div>
    <div id="grdWrap" class="fx-grid-host" data-gridbar-form="frmStockReportWithValues_Engr" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv19d_stock_report_with_values_engr.js?v=20261013a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
