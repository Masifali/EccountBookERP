<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluation Transactions Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <style>
        /* EvaluationStockTransactionsReport designer geometry (InitializeComponent :769-2150), 1:1 px. panel1 964 wide:
           panel2 toolStrip3 (27) | panel3 teal "Inventory Transaction" (27) | panel5 filters (140, groupBox1 4,3 948x131) | panel7 teal "History" (27) | grd (Fill). */
        :root { --swv-teal: #008080; }
        body { background: #fff; margin: 0; padding-bottom: 12px; }
        .fx-scroll { overflow-x: auto; }
        .fx-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .fx-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .fx-rel { position: relative; }
        .fx-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .fx-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-strip { height: 27px; display: flex; align-items: center; background: #fff; border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .fx-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; cursor: pointer; white-space: nowrap; color: #000; }
        .fx-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .fx-teal { height: 27px; background: var(--swv-teal); position: relative; }
        .fx-teal .cap { position: absolute; left: 2px; top: 1px; font: bold 16px Tahoma, sans-serif; color: #fff; white-space: nowrap; line-height: 19px; }
        .fx-btn { background: var(--swv-teal); color: #fff; border: 1px solid #054d4d; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; padding: 0; cursor: pointer; }
        .fx-btn:hover:not(:disabled) { background: #054d4d; }
        .fx-grp { border: 1px solid #d0d0d0; border-radius: 2px; padding: 0; }
        .fx-grp legend { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; padding: 0 2px; margin-left: 6px; color: #000; }
        .fx-multi { position: relative; }
        .fx-multi-btn { width: 100%; height: 26px; background: #fff; border: 1px solid #7a7a7a; text-align: left; padding: 0 4px; font-family: Verdana, sans-serif; font-size: 13px; display: flex; justify-content: space-between; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; }
        .fx-multi-btn span { overflow: hidden; text-overflow: ellipsis; }
        .fx-multi-list { position: absolute; z-index: 50; top: 26px; left: 0; min-width: 100%; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #7a7a7a; padding: 3px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.2); display: none; }
        .fx-multi-list label { display: block; white-space: nowrap; font: 12px Verdana, sans-serif; }
        .fx-multi-list label.all { border-bottom: 1px solid #ddd; margin-bottom: 2px; font-weight: bold; }
        .fx-grid-host { overflow: auto; background: #fff; height: calc(100vh - 300px); min-height: 340px; position: relative; }
        .fx-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; border-collapse: collapse; }
        .fx-grid-host .win-grid th { background: linear-gradient(to bottom, #e6f7f7 0%, #bfe6e6 100%); border: 1px solid #8fbcbc; font-weight: normal; white-space: nowrap; padding: 2px 4px; text-align: center; position: sticky; top: 0; z-index: 2; }
        .fx-grid-host .win-grid thead tr.flt td { position: sticky; top: 20px; z-index: 2; background: #f4fbfb; border: 1px solid #c8dede; padding: 0; }
        .fx-grid-host .win-grid thead tr.flt input { width: 100%; box-sizing: border-box; border: 0; height: 18px; font: 11px Verdana, sans-serif; background: transparent; }
        .fx-grid-host .win-grid td { border: 1px solid #d5e6e6; white-space: nowrap; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; }
        .fx-grid-host .win-grid td.n { text-align: right; }
        .fx-grid-host .win-grid tbody tr.sel td { background: #cde8ff; }
        .fx-grid-host .win-grid tfoot td { background: #e6e6e6; font-weight: bold; text-align: right; position: sticky; bottom: 0; }
        .fx-nav { font: 11px Verdana, sans-serif; padding: 2px 8px; border-top: 1px solid #c8dede; background: #f4f4f4; }
        .fx-modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 200; }
        .fx-modal.is-open { display: flex; }
        .fx-modal .box { background: #fff; border: 1px solid #7a7a7a; min-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
        .fx-modal .box h3 { margin: 0; padding: 4px 8px; background: var(--swv-teal); color: #fff; font: bold 13px Tahoma, sans-serif; }
        .fx-modal table { border-collapse: collapse; width: 100%; font: 12px Verdana, sans-serif; }
        .fx-modal td, .fx-modal th { border: 1px solid #d5e6e6; padding: 3px 8px; text-align: left; }
        .fx-modal .foot { text-align: right; padding: 6px; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:964px;">
    <!-- panel2 / toolStrip3: btnNew (&Reset), btnRefresh, btnStockReport, btnShortCutKeys -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnNew" title="Ctrl+N resets via Refresh in the desktop"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <span><u>R</u>eset</span></button>
        <button type="button" class="fx-tool" id="btnRefresh" title="Ctrl+R"><i class="fa fa-repeat"></i> <span><u>R</u>efresh</span></button>
        <button type="button" class="fx-tool" id="btnStockReport" title="Ctrl+P"><i class="fa fa-print"></i> 417-Stock Report</button>
        <button type="button" class="fx-tool" id="btnShortCutKeys" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> ShortCutKeys</button>
    </div>
    <!-- panel3 (27, Teal) -->
    <div class="fx-teal"><span class="cap">Inventory Transaction</span></div>
    <!-- panel5 (140, White) with groupBox1 "Filters" (4,3) 948x131 -->
    <div class="fx-rel" style="height:140px;">
        <fieldset class="fx-abs fx-grp" style="left:4px;top:3px;width:948px;height:131px;">
            <legend>Filters</legend>
            <label class="fx-abs fx-lbl" style="left:13px;top:19px;" for="cmbperemeter">Date Type</label>
            <select id="cmbperemeter" class="fx-abs fx-cmb win-combo" style="left:104px;top:13px;width:148px;"></select>
            <label class="fx-abs fx-lbl" style="left:13px;top:47px;" for="fromdate">From Date</label>
            <input type="date" id="fromdate" class="fx-abs fx-dt" style="left:104px;top:43px;width:148px;">
            <label class="fx-abs fx-lbl" style="left:13px;top:76px;" for="todate">To Date</label>
            <input type="date" id="todate" class="fx-abs fx-dt" style="left:104px;top:72px;width:148px;">
            <label class="fx-abs fx-lbl" style="left:13px;top:105px;" for="cmbItemClaas">Item Class</label>
            <select id="cmbItemClaas" class="fx-abs fx-cmb win-combo" style="left:104px;top:99px;width:148px;"></select>

            <label class="fx-abs fx-lbl" style="left:262px;top:19px;" for="cmbParentCategory">Parent Category</label>
            <select id="cmbParentCategory" class="fx-abs fx-cmb win-combo" style="left:357px;top:13px;width:202px;"></select>
            <label class="fx-abs fx-lbl" style="left:262px;top:47px;" for="cmbCategory">Item Category</label>
            <select id="cmbCategory" class="fx-abs fx-cmb win-combo" style="left:357px;top:41px;width:203px;"></select>
            <label class="fx-abs fx-lbl" style="left:262px;top:76px;">Item Type</label>
            <div class="fx-abs fx-multi" id="cmbItemtype" style="left:357px;top:70px;width:202px;">
                <button type="button" class="fx-multi-btn"><span id="cmbItemtypeText"></span><i class="fa fa-caret-down"></i></button>
                <div class="fx-multi-list" id="cmbItemtypeList"></div>
            </div>
            <label class="fx-abs fx-lbl" style="left:262px;top:105px;" for="CmbJobLot">JobLot</label>
            <select id="CmbJobLot" class="fx-abs fx-cmb win-combo" style="left:357px;top:99px;width:202px;"></select>

            <label class="fx-abs fx-lbl" style="left:570px;top:19px;">WareHouse</label>
            <div class="fx-abs fx-multi" id="CmbWareHouse" style="left:659px;top:13px;width:228px;">
                <button type="button" class="fx-multi-btn"><span id="CmbWareHouseText"></span><i class="fa fa-caret-down"></i></button>
                <div class="fx-multi-list" id="CmbWareHouseList"></div>
            </div>
            <label class="fx-abs fx-lbl" style="left:570px;top:47px;" for="CmbItem">Item Name</label>
            <select id="CmbItem" class="fx-abs fx-cmb win-combo" style="left:659px;top:41px;width:228px;"></select>
            <label class="fx-abs fx-lbl" style="left:570px;top:76px;" for="CmbSupplier">Supplier Name</label>
            <select id="CmbSupplier" class="fx-abs fx-cmb win-combo" style="left:659px;top:70px;width:228px;"></select>
            <label class="fx-abs fx-lbl" style="left:570px;top:105px;" for="CmbDocumentType">DocumentType</label>
            <select id="CmbDocumentType" class="fx-abs fx-cmb win-combo" style="left:659px;top:99px;width:164px;"></select>
            <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:828px;top:99px;width:59px;height:26px;" title="Ctrl+S">Show</button>
        </fieldset>
    </div>
    <!-- panel7 (27, Teal): "History" + ctrlGrdBar1 (917,1) 39x24 -->
    <div class="fx-teal"><span class="cap">History</span><div id="gbMount" class="fx-abs" style="left:917px;top:1px;width:39px;height:24px;"></div></div>
    <div id="grdWrap" class="fx-grid-host" data-gridbar-form="EvaluationStockTransactionsReport" data-gridbar-grid="grd"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<!-- ShortCutKeyPopUp (MakeShortCutKeys :645) -->
<div class="fx-modal" id="shortcutModal">
    <div class="box">
        <h3>ShortCut Keys</h3>
        <table><thead><tr><th>KeyCombination</th><th>Description</th></tr></thead><tbody id="shortcutRows"></tbody></table>
        <div class="foot"><button type="button" class="fx-btn" id="shortcutClose" style="width:70px;height:24px;">Close</button></div>
    </div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv19d_evaluation_transactions_report.js?v=20261013a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
