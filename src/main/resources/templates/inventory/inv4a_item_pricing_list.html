<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Pricing List - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4a.css?v=20261013a}" href="/build/css/countx_inv4a.css?v=20261013a">
    <style>
        /* frmGetItemPricingList designer geometry (InitializeComponent :573-1156), 1:1 px. ClientSize 964 x 461:
           toolStrip3 (27) | panel3 teal (26) | panel2 filters (54, groupBox1 948 x 48) | panel4: panel5 teal (25) + DataGridHistory (Fill). */
        .fx-root { width: 964px; }
        #DataGridHistoryHost { height: calc(100vh - 230px); min-height: 329px; }
        .fx-grid-host .win-grid th { white-space: normal; }   /* GridWrappingAndColumnSettings(grid, 2): two header lines */
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root">
    <!-- toolStrip3: btnNew, toolStripButton1 (Refresh), btnRegister (325-Print), toolStripButton2 (ShortCut Keys) -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnNew" style="width:59px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
        <button type="button" class="fx-tool" id="toolStripButton1" style="width:80px" title="Ctrl+R"><i class="fa fa-repeat"></i> <u>R</u>efresh</button>
        <button type="button" class="fx-tool" id="btnRegister" style="width:92px" title="Ctrl+P" data-rpt="325_01-ItemPricingList.rpt"><i class="fa fa-print"></i> 325-Print</button>
        <button type="button" class="fx-tool" id="toolStripButton2" style="width:126px" title="Ctrl+Alt">ShortCut Keys</button>
        <a href="/app/Inventory?module=8" class="fx-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;" title="Ctrl+E / Esc"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>
    <!-- panel3 (26) teal: label23 (5,3) -->
    <div class="fx-teal" style="height:26px;">
        <span class="fx-teal-title" style="left:5px;top:3px;">Item Pricing List</span>
    </div>
    <!-- panel2 (54) white: groupBox1 (4,3) 948 x 48 "Filters" -->
    <div class="fx-rel" style="height:54px;background:#fff;">
        <fieldset class="fx-abs fx-grp" style="left:4px;top:3px;width:948px;height:48px;">
            <legend style="font-size:11px;font-weight:normal;">Filters</legend>
            <label class="fx-abs fx-lbl" style="left:5px;top:8px;font-size:13px;" for="cmbCategory">Item Category</label>
            <select id="cmbCategory" class="fx-abs fx-cmb win-combo" style="left:102px;top:4px;width:225px;"></select>
            <label class="fx-abs fx-lbl" style="left:331px;top:8px;font-size:13px;" for="cmbItemtype">Item Type</label>
            <select id="cmbItemtype" class="fx-abs fx-cmb win-combo" style="left:404px;top:4px;width:203px;"></select>
            <label class="fx-abs fx-lbl" style="left:610px;top:8px;font-size:13px;" for="CmbEffectedDate">Effected Date</label>
            <select id="CmbEffectedDate" class="fx-abs fx-cmb win-combo" style="left:703px;top:4px;width:175px;"></select>
            <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:882px;top:5px;width:62px;height:25px;" title="Ctrl+S">Show</button>
        </fieldset>
    </div>
    <!-- panel5 (25) teal: label2 (5,3) "Filtered Records"; ctrlGrdBar1 (924,1) is Visible = false on the desktop -->
    <div class="fx-teal" style="height:25px;">
        <span class="fx-teal-title" style="left:5px;top:3px;">Filtered Records</span>
    </div>
    <div id="DataGridHistoryHost" class="fx-grid-host">
        <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4a_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4a_item_pricing_list.js?v=20261013a}" src="/build/js/countx_inventory_inv4a_item_pricing_list.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
