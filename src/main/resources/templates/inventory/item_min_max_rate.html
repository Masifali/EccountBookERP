<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Min Max Rate Schedule - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 22px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .grid-container { height: 480px; overflow-y: auto; border: 1px solid #cbd5e1; background: white; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .filter-row input { width: 100%; font-size: 10px; padding: 1px 4px; height: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-sliders"></i> Item Min Max Rate Schedule (Inventory Management)</div>
        <div><a href="/inventory" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Inventory Dashboard</a></div>
    </div>
    
    <div class="erp-toolbar">
        <button type="button" class="btn-erp btn-erp-primary" id="btnSaveAll"><i class="fa fa-save"></i> Save All Rates & Levels</button>
        <button type="button" class="btn-erp" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh Schedule</button>
    </div>

    <div style="padding: 10px;">
        <div class="erp-fieldset">
            <legend>Items Rate & Stock Limits Matrix</legend>
            <div class="grid-container">
                <table class="erp-table" id="minMaxGrid">
                    <thead>
                        <tr>
                            <th style="width: 5%;">ID</th>
                            <th style="width: 15%;">Item Code</th>
                            <th style="width: 30%;">Item Name / Description</th>
                            <th style="width: 10%; text-align: right;">Min Rate (PKR)</th>
                            <th style="width: 10%; text-align: right;">Max Rate (PKR)</th>
                            <th style="width: 10%; text-align: right;">Min Stock</th>
                            <th style="width: 10%; text-align: right;">Max Stock</th>
                            <th style="width: 10%; text-align: right;">Reorder Level</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" data-col="0" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="1" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="2" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="3" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="4" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="5" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="6" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="7" placeholder="Filter..." /></th>
                        </tr>
                    </thead>
                    <tbody id="minMaxGridBody">
                        <tr><td colspan="8" style="text-align:center;">Loading min max rate schedule...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        var itemData = [];

        $(document).ready(function() {
            loadMinMaxGrid();

            $('#btnSaveAll').click(function() { saveMinMaxBatch(); });
            $('#btnRefresh').click(function() { loadMinMaxGrid(); });

            $('.filter-row input').on('keyup change', function() {
                filterGrid();
            });
        });

        function loadMinMaxGrid() {
            $.ajax({
                url: '/api/inventory/min-max/list',
                type: 'GET',
                success: function(data) {
                    itemData = data || [];
                    renderGrid(itemData);
                },
                error: function() {
                    $('#minMaxGridBody').html('<tr><td colspan="8" style="text-align:center; color:red;">Failed to load schedule.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="8" style="text-align:center;">No Items found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    html += '<tr data-id="' + item.id + '">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td>' + (item.itemCode || '') + '</td>';
                    html += '<td><strong>' + (item.itemName || '') + '</strong></td>';
                    html += '<td><input type="number" step="0.01" class="form-control-erp row-minrate" value="' + (item.minRate || 0) + '" style="text-align:right;" /></td>';
                    html += '<td><input type="number" step="0.01" class="form-control-erp row-maxrate" value="' + (item.maxRate || 0) + '" style="text-align:right;" /></td>';
                    html += '<td><input type="number" step="0.01" class="form-control-erp row-minstock" value="' + (item.minStockLevel || 0) + '" style="text-align:right;" /></td>';
                    html += '<td><input type="number" step="0.01" class="form-control-erp row-maxstock" value="' + (item.maxStockLevel || 0) + '" style="text-align:right;" /></td>';
                    html += '<td><input type="number" step="0.01" class="form-control-erp row-reorder" value="' + (item.reorderLevel || 0) + '" style="text-align:right;" /></td>';
                    html += '</tr>';
                });
            }
            $('#minMaxGridBody').html(html);
        }

        function saveMinMaxBatch() {
            var rows = $('#minMaxGridBody tr');
            if(rows.length === 0 || rows.find('td').length === 1) {
                alert('No rows available to save.');
                return;
            }

            var itemsToSave = [];
            rows.each(function() {
                var tr = $(this);
                var id = tr.data('id');
                if(id) {
                    itemsToSave.push({
                        id: parseInt(id),
                        minRate: parseFloat(tr.find('.row-minrate').val() || 0),
                        maxRate: parseFloat(tr.find('.row-maxrate').val() || 0),
                        minStockLevel: parseFloat(tr.find('.row-minstock').val() || 0),
                        maxStockLevel: parseFloat(tr.find('.row-maxstock').val() || 0),
                        reorderLevel: parseFloat(tr.find('.row-reorder').val() || 0)
                    });
                }
            });

            $.ajax({
                url: '/api/inventory/min-max/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(itemsToSave),
                success: function(res) {
                    alert('Min/Max Rates schedule saved successfully!');
                    loadMinMaxGrid();
                },
                error: function(xhr) {
                    alert('Failed to save rates: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }

        function filterGrid() {
            var filters = [];
            $('.filter-row input').each(function() {
                filters.push({ col: $(this).data('col'), val: $(this).val().toLowerCase() });
            });

            $('#minMaxGridBody tr').each(function() {
                var row = $(this);
                var show = true;
                $.each(filters, function(i, f) {
                    if(f.val) {
                        var text = row.find('td').eq(f.col).text().toLowerCase();
                        if(text.indexOf(f.val) === -1) {
                            show = false;
                            return false;
                        }
                    }
                });
                row.toggle(show);
            });
        }
    </script>
</body>
</html>
