<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Product Type - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc2626; color: white; border: 1px solid #991b1b; }
        .btn-erp-danger:hover { background-color: #991b1b; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .form-control-erp:focus { border-color: #00796B; outline: none; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr:hover { background-color: #e0f2f1; cursor: pointer; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-cubes"></i> Define Product Type</div>
        <div><a href="/inventory" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Inventory</a></div>
    </div>
    <div class="erp-toolbar">
        <button type="button" class="btn-erp" onclick="resetForm()"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary" onclick="submitSave()"><i class="fa fa-save"></i> Save (Ctrl+S)</button>
        <button type="button" class="btn-erp btn-erp-danger" onclick="submitDelete()"><i class="fa fa-trash"></i> Delete</button>
        <button type="button" class="btn-erp" onclick="location.reload()"><i class="fa fa-refresh"></i> Refresh</button>
    </div>
    <div style="padding: 10px;">
        <form th:action="@{/inventory/product_types/save}" th:object="${productType}" method="post" id="typeForm">
            <input type="hidden" th:field="*{id}" id="txtTypeId"/>
            <div class="erp-fieldset">
                <legend>Product Type Definition</legend>
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label-erp">Type Code</label>
                        <input type="text" th:field="*{productTypeCode}" id="txtTypeCode" class="form-control-erp" placeholder="e.g. PT-001"/>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label-erp">Type Description / Name</label>
                        <input type="text" th:field="*{productTypeDescription}" id="txtTypeDesc" class="form-control-erp" placeholder="Enter Product Type Description" required/>
                    </div>
                </div>
            </div>

            <div class="erp-fieldset">
                <legend>Product Types List</legend>
                <table class="erp-table">
                    <thead>
                        <tr>
                            <th style="width: 5%; text-align: center;">Sr #</th>
                            <th style="width: 25%;">Product Type Code</th>
                            <th style="width: 70%;">Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, stat : ${productTypes}" th:attr="onclick='selectType(' + ${p.id} + ', \'' + ${p.productTypeCode} + '\', \'' + ${p.productTypeDescription} + '\')'">
                            <td style="text-align: center;" th:text="${stat.index + 1}"></td>
                            <td th:text="${p.productTypeCode}"></td>
                            <td th:text="${p.productTypeDescription}"></td>
                        </tr>
                        <tr th:if="${productTypes == null or productTypes.isEmpty()}">
                            <td colspan="3" style="text-align: center; color: #64748b; padding: 20px;">No product types defined yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </div>
    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        function resetForm() {
            $('#txtTypeId').val('0');
            $('#txtTypeCode').val('');
            $('#txtTypeDesc').val('');
        }

        function selectType(id, code, desc) {
            $('#txtTypeId').val(id);
            $('#txtTypeCode').val(code);
            $('#txtTypeDesc').val(desc);
        }

        function submitSave() {
            if (!$('#txtTypeDesc').val()) { alert('Please enter Type Description.'); return; }
            $('#typeForm').submit();
        }

        function submitDelete() {
            const id = $('#txtTypeId').val();
            if (!id || id === '0') { alert('Please select a product type to delete.'); return; }
            if (confirm('Are you sure you want to delete this product type?')) {
                window.location.href = '/inventory/product_types/delete/' + id;
            }
        }

        $(document).keydown(function(e) {
            if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); resetForm(); }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); submitSave(); }
        });
    </script>
</body>
</html>
