<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Types - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc3545; color: white; border: 1px solid #bd2130; }
        .btn-erp-danger:hover { background-color: #c82333; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .grid-container { height: 440px; overflow-y: auto; border: 1px solid #cbd5e1; background: white; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
        .filter-row input { width: 100%; font-size: 10px; padding: 1px 4px; height: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-cubes"></i> Item Type Definition (InvenItemType - Inventory Management)</div>
        <div><a href="/inventory" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Inventory Dashboard</a></div>
    </div>
    
    <div class="erp-toolbar">
        <button type="button" class="btn-erp" id="btnNew"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary" id="btnSave"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="btn-erp" id="btnUpdate"><i class="fa fa-pencil"></i> Update</button>
        <button type="button" class="btn-erp btn-erp-danger" id="btnDelete"><i class="fa fa-trash"></i> Delete</button>
        <button type="button" class="btn-erp" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
    </div>

    <div style="padding: 10px;">
        <input type="hidden" id="typeId" value="" />

        <div class="erp-fieldset">
            <legend>Item Type Information</legend>
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label-erp">Type Code *</label>
                    <input type="text" id="typeCode" class="form-control-erp" placeholder="e.g. TYP-01" />
                </div>
                <div class="col-md-4">
                    <label class="form-label-erp">Type Description *</label>
                    <input type="text" id="typeDescription" class="form-control-erp" placeholder="e.g. Basmati Rice Extra Long" />
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Parent Item Category</label>
                    <select id="itemCategoryId" class="form-control-erp select2">
                        <option value="">-- Select Category --</option>
                    </select>
                </div>
                <div class="col-md-2" style="display: flex; align-items: flex-end; padding-bottom: 2px;">
                    <label style="font-weight: 600; cursor: pointer;">
                        <input type="checkbox" id="typeStatus" checked="checked" /> Active Type
                    </label>
                </div>
            </div>
        </div>

        <div class="erp-fieldset">
            <legend>Item Types Master Records</legend>
            <div class="grid-container">
                <table class="erp-table" id="typeGrid">
                    <thead>
                        <tr>
                            <th style="width: 10%;">ID</th>
                            <th style="width: 20%;">Type Code</th>
                            <th style="width: 40%;">Type Description</th>
                            <th style="width: 20%;">Parent Category</th>
                            <th style="width: 10%; text-align: center;">Status</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" data-col="0" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="1" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="2" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="3" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="4" placeholder="Filter..." /></th>
                        </tr>
                    </thead>
                    <tbody id="typeGridBody">
                        <tr><td colspan="5" style="text-align:center;">Loading item types...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/vendors/select2/dist/js/select2.min.js}"></script>
    <script>
        var typeData = [];

        $(document).ready(function() {
            $('.select2').select2({ width: '100%' });
            loadCategories();
            loadTypeGrid();

            $('#btnNew').click(function() { resetForm(); });
            $('#btnSave, #btnUpdate').click(function() { saveType(); });
            $('#btnDelete').click(function() { deleteType(); });
            $('#btnRefresh').click(function() { loadTypeGrid(); });

            $('.filter-row input').on('keyup change', function() {
                filterGrid();
            });
        });

        function loadCategories() {
            $.get('/api/inventory/categories/list', function(cats) {
                var html = '<option value="">-- Select Category --</option>';
                $.each(cats || [], function(i, c) {
                    html += '<option value="' + c.id + '">' + (c.categoryDescription || '') + '</option>';
                });
                $('#itemCategoryId').html(html).trigger('change.select2');
            });
        }

        function loadTypeGrid() {
            $.ajax({
                url: '/api/inventory/types/list',
                type: 'GET',
                success: function(data) {
                    typeData = data || [];
                    renderGrid(typeData);
                },
                error: function() {
                    $('#typeGridBody').html('<tr><td colspan="5" style="text-align:center; color:red;">Failed to load item types.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="5" style="text-align:center;">No Item Type records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td>' + (item.typeCode || '') + '</td>';
                    html += '<td><strong>' + (item.typeDescription || '') + '</strong></td>';
                    html += '<td>' + (item.categoryName || '-') + '</td>';
                    html += '<td style="text-align:center;">' + (item.typeStatus !== false ? '<span class="label label-success">Active</span>' : '<span class="label label-default">Inactive</span>') + '</td>';
                    html += '</tr>';
                });
            }
            $('#typeGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#typeGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = typeData[idx];
            if(item) {
                $('#typeId').val(item.id);
                $('#typeCode').val(item.typeCode || '');
                $('#typeDescription').val(item.typeDescription || '');
                $('#itemCategoryId').val(item.itemCategoryId || '').trigger('change');
                $('#typeStatus').prop('checked', item.typeStatus !== false);
            }
        }

        function resetForm() {
            $('#typeId').val('');
            $('#typeCode').val('');
            $('#typeDescription').val('');
            $('#itemCategoryId').val('').trigger('change');
            $('#typeStatus').prop('checked', true);
            $('#typeGridBody tr').removeClass('selected');
        }

        function saveType() {
            var desc = $('#typeDescription').val().trim();
            if(!desc) {
                alert('Please enter Type Description.');
                $('#typeDescription').focus();
                return;
            }

            var catId = $('#itemCategoryId').val();

            var payload = {
                id: $('#typeId').val() ? parseInt($('#typeId').val()) : null,
                typeCode: $('#typeCode').val(),
                typeDescription: desc,
                itemCategory: catId ? { id: parseInt(catId) } : null,
                typeStatus: $('#typeStatus').is(':checked')
            };

            $.ajax({
                url: '/api/inventory/types/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Item Type saved successfully!');
                    resetForm();
                    loadTypeGrid();
                },
                error: function(xhr) {
                    alert('Failed to save Item Type: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }

        function deleteType() {
            var id = $('#typeId').val();
            if(!id) {
                alert('Please select an Item Type from grid to delete.');
                return;
            }
            if(confirm('Are you sure you want to delete Item Type #' + id + '?')) {
                $.ajax({
                    url: '/api/inventory/types/' + id,
                    type: 'DELETE',
                    success: function() {
                        alert('Item Type deleted successfully!');
                        resetForm();
                        loadTypeGrid();
                    },
                    error: function(xhr) {
                        alert('Failed to delete item type: ' + xhr.responseText);
                    }
                });
            }
        }

        function filterGrid() {
            var filters = [];
            $('.filter-row input').each(function() {
                filters.push({ col: $(this).data('col'), val: $(this).val().toLowerCase() });
            });

            $('#typeGridBody tr').each(function() {
                var row = $(this);
                var show = true;
                $.each(filters, function(i, f) {
                    if(f.val) {
                        var text = row.find('td').eq(f.col).text().toLowerCase();
                        if(text.indexOf(f.val) === -1) {
                            show = false;
                            return false;
                        }
                    }
                });
                row.toggle(show);
            });
        }
    </script>
</body>
</html>
