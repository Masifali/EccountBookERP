<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Item Type - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        body { font-family: Tahoma, "Segoe UI", Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 10.5px; color: #000; margin: 0; padding: 0; }
        .win-title-bar { background-color: #00796B; color: #ffffff; padding: 2px 8px; font-size: 11.5px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; height: 23px; box-sizing: border-box; }
        .win-toolbar { background: linear-gradient(to bottom, #ffffff 0%, #d8e0e8 100%); border-bottom: 1px solid #a0b0c0; padding: 2px 6px; display: flex; gap: 4px; align-items: center; height: 25px; box-sizing: border-box; }
        .win-btn { background: linear-gradient(to bottom, #ffffff 0%, #e4e9ed 100%); border: 1px solid #849ca8; border-radius: 2px; padding: 1px 7px; font-size: 10.5px; font-weight: 600; color: #000; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; height: 20px; box-shadow: inset 0 1px 0 #fff; text-decoration: none; }
        .win-btn:hover { background: #e0f2f1; border-color: #00796B; text-decoration: none; color: #000; }
        .win-btn-primary { background: #00796B; color: #fff; border-color: #004d40; }
        .win-btn-primary:hover { background: #004d40; color: #fff; }
        
        .win-panel-header { background-color: #00796B; color: #ffffff; padding: 2px 8px; font-weight: bold; font-size: 11px; height: 20px; display: flex; align-items: center; }
        .form-section { background: #ffffff; border: 1px solid #94a3b8; padding: 8px; margin: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .win-label { font-weight: 600; color: #222; margin-bottom: 1px; font-size: 10px; white-space: nowrap; }
        .win-input { border: 1px solid #7f9db9; border-radius: 1px; padding: 1px 4px; font-size: 10.5px; font-family: Tahoma, sans-serif; height: 21px; width: 100%; background-color: #ffffff; box-sizing: border-box; }
        .win-input:focus { border-color: #00796B; outline: none; }
        
        .select2-container--default .select2-selection--single { height: 21px !important; padding: 0px 3px; font-size: 10.5px; font-family: Tahoma, sans-serif; border: 1px solid #7f9db9; border-radius: 1px; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 19px !important; padding-left: 0px; color: #000; }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 19px !important; }

        .grid-container { max-height: calc(100vh - 200px); overflow: auto; border: 1px solid #849ca8; margin: 4px; background: #fff; }
        .win-grid-table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: Tahoma, sans-serif; background: #ffffff; }
        .win-grid-table th { background: linear-gradient(to bottom, #dbe6f2 0%, #b0c4de 100%); color: #000000; font-weight: bold; padding: 3px 5px; border: 1px solid #849ca8; text-align: left; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
        .win-grid-table td { padding: 2px 5px; border: 1px solid #cbd5e1; vertical-align: middle; white-space: nowrap; height: 19px; }
        .win-grid-table tbody tr:nth-child(even) { background-color: #f7fafc; }
        .win-grid-table tbody tr:hover { background-color: #cbe5ff; cursor: pointer; }
        .win-grid-table tbody tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
    </style>
<link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-ui.css"><script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script></head>
<body>

    <div class="win-title-bar">
        <span><i class="fa fa-cubes"></i> Define Item Type</span>
        <a href="/inventory" style="color: #ffffff; text-decoration: none; font-size: 10.5px;">
            <i class="fa fa-arrow-left"></i> Back to Inventory
        </a>
    </div>

    <!-- WinForms Toolbar -->
    <div class="win-toolbar">
        <button type="button" class="win-btn" id="btnNew" onclick="resetForm()"><i class="fa fa-plus text-success"></i> New</button>
        <button type="button" class="win-btn" id="btnRefresh" onclick="loadTypeGrid()"><i class="fa fa-refresh text-primary"></i> Refresh</button>
        <button type="button" class="win-btn win-btn-primary" id="btnSave" onclick="saveType()"><i class="fa fa-save"></i> Save</button>
    </div>

    <!-- Header Panel: Item Type -->
    <div class="win-panel-header">Item Type</div>

    <!-- Form Section matching C# WinForms screenshot #4 -->
    <div class="form-section">
        <input type="hidden" id="typeId" value="" />
        
        <div class="row" style="margin-bottom: 4px;">
            <div class="col-md-3">
                <span class="win-label">Code</span>
                <input type="text" id="typeCode" class="win-input" placeholder="e.g. 10" />
            </div>
            <div class="col-md-3">
                <span class="win-label">Type</span>
                <select id="typeSelect" class="win-input select2">
                    <option value="1">Paddy</option>
                    <option value="2" selected>Rice</option>
                    <option value="3">By Product</option>
                    <option value="4">Work In Process</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3">
                <span class="win-label">Description</span>
                <input type="text" id="typeDescription" class="win-input" placeholder="e.g. KAINAT 1121 RICE" />
            </div>
            <div class="col-md-3">
                <span class="win-label">Parent Category</span>
                <select id="parentCategoryId" class="win-input select2">
                    <option value="0">-- Select Parent Category --</option>
                    <option th:each="c : ${itemCategories}" th:value="${c.id}" th:text="${c.categoryDescription}"></option>
                </select>
            </div>
            <div class="col-md-2" style="display: flex; align-items: flex-end; padding-bottom: 2px;">
                <label style="font-weight: bold; cursor: pointer; font-size: 10.5px; margin: 0;">
                    <input type="checkbox" id="isMother"> IsMother
                </label>
            </div>
        </div>
    </div>

    <!-- Header Panel: History -->
    <div class="win-panel-header">History</div>

    <!-- History Grid matching WinForms Screenshot #4 exact 6 columns -->
    <div class="grid-container">
        <table class="win-grid-table" id="typeGrid">
            <thead>
                <tr>
                    <th style="width: 5%;">Id</th>
                    <th style="width: 15%;">Code</th>
                    <th style="width: 35%;">Description</th>
                    <th style="width: 15%;">Type</th>
                    <th style="width: 15%;">Parent Category</th>
                    <th style="width: 15%;">Mother Status</th>
                </tr>
            </thead>
            <tbody id="typeGridBody">
                <tr><td colspan="6" style="text-align:center;">Loading item types...</td></tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/vendors/select2/dist/js/select2.min.js}"></script>
    <script>
        var typeData = [];

        $(document).ready(function() {
            $('.select2').select2({ width: '100%' });
            loadTypeGrid();
        });

        function loadTypeGrid() {
            $.ajax({
                url: '/api/inventory/types/list',
                type: 'GET',
                success: function(data) {
                    typeData = data || [];
                    renderGrid(typeData);
                },
                error: function() {
                    $('#typeGridBody').html('<tr><td colspan="6" style="text-align:center; color:red;">Failed to load item types.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="6" style="text-align:center;">No Item Type records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td>' + (item.typeCode || '') + '</td>';
                    html += '<td><strong>' + (item.typeDescription || '') + '</strong></td>';
                    html += '<td>' + (item.typeName || item.type || '') + '</td>';
                    html += '<td>' + (item.parentCategoryName || '') + '</td>';
                    html += '<td>' + (item.motherStatus || (item.isMother ? 'Mother' : 'Not Mother')) + '</td>';
                    html += '</tr>';
                });
            }
            $('#typeGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#typeGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = typeData[idx];
            if(item) {
                $('#typeId').val(item.id);
                $('#typeCode').val(item.typeCode || '');
                $('#typeDescription').val(item.typeDescription || '');
                $('#typeSelect').val(item.type || 2).trigger('change');
                $('#parentCategoryId').val(item.parentCategoryId || 0).trigger('change');
                $('#isMother').prop('checked', item.isMother === true || item.motherStatus === 'Mother');
            }
        }

        function resetForm() {
            $('#typeId').val('');
            $('#typeCode').val('');
            $('#typeDescription').val('');
            $('#typeSelect').val(2).trigger('change');
            $('#parentCategoryId').val(0).trigger('change');
            $('#isMother').prop('checked', false);
            $('#typeGridBody tr').removeClass('selected');
        }

        function saveType() {
            var desc = $('#typeDescription').val().trim();
            if(!desc) {
                alert('Please enter Type Description.');
                $('#typeDescription').focus();
                return;
            }

            var payload = {
                id: $('#typeId').val() ? parseInt($('#typeId').val()) : null,
                typeCode: $('#typeCode').val(),
                typeDescription: desc,
                type: parseInt($('#typeSelect').val() || 2),
                parentCategoryId: $('#parentCategoryId').val() ? parseInt($('#parentCategoryId').val()) : null,
                isMother: $('#isMother').is(':checked')
            };

            $.ajax({
                url: '/api/inventory/types/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Item Type saved successfully!');
                    resetForm();
                    loadTypeGrid();
                },
                error: function(xhr) {
                    alert('Failed to save Item Type: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }
    </script>
</body>
</html>
