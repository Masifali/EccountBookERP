<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Item Type - Inventory Definition</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
    <style>
        .win-toolbar {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 6px 12px;
            margin-bottom: 15px;
            border-radius: 3px;
        }
        .win-toolbar .btn {
            margin-right: 5px;
        }
        .form-section {
            background: #fff;
            padding: 15px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .table-history tbody tr:hover {
            background-color: #f0f7ff !important;
        }
    </style>
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-tags"></i> Item Type Definition <small>WinForms Golden Master Ditto Copy</small></h2>
                            <div class="clearfix"></div>
                        </div>

                        <!-- Top Toolbar matching Desktop WinForms -->
                        <div class="win-toolbar">
                            <button type="button" class="btn btn-primary btn-sm" id="btnNew">
                                <i class="fa fa-file-o"></i> New (Ctrl+N)
                            </button>
                            <button type="button" class="btn btn-default btn-sm" id="btnRefresh">
                                <i class="fa fa-refresh"></i> Refresh
                            </button>
                            <button type="button" class="btn btn-success btn-sm" id="btnSave">
                                <i class="fa fa-save"></i> Save (Ctrl+S)
                            </button>
                            <button type="button" class="btn btn-warning btn-sm" id="btnUpdate" style="display:none;">
                                <i class="fa fa-edit"></i> Update (Ctrl+U)
                            </button>
                        </div>

                        <div class="x_content">
                            <!-- Input Form Section -->
                            <div class="form-section">
                                <form id="itemTypeForm" onsubmit="return false;">
                                    <input type="hidden" id="recId" value="0"/>
                                    <div class="row">
                                        <div class="col-md-3 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label for="txtItemTypeCode">Item Type Code <span class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="txtItemTypeCode" placeholder="Auto-generated" readonly />
                                            </div>
                                        </div>
                                        <div class="col-md-5 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label for="txtTypeDescription">Description <span class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="txtTypeDescription" placeholder="Enter Item Type Description" required />
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label for="cmbItemTypeType">Type</label>
                                                <select class="form-control" id="cmbItemTypeType">
                                                    <option value="">-- Select Type --</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 col-sm-6 col-xs-12">
                                            <div class="form-group">
                                                <label for="cmbParentCategory">Parent Category</label>
                                                <select class="form-control" id="cmbParentCategory">
                                                    <option value="">-- Select Parent Category --</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6 col-sm-6 col-xs-12" style="padding-top: 25px;">
                                            <div class="checkbox">
                                                <label style="font-weight: bold; font-size: 14px;">
                                                    <input type="checkbox" id="chkIsMother" value="true"> Is Mother
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <!-- History Grid Section -->
                            <div class="x_panel">
                                <div class="x_title">
                                    <h3><i class="fa fa-history"></i> History / Records <small>(Double-click row to edit)</small></h3>
                                    <div class="clearfix"></div>
                                </div>
                                <div class="x_content">
                                    <div class="table-responsive">
                                        <table class="table table-striped table-bordered table-hover table-history" id="grdHistory">
                                            <thead>
                                            <tr style="background-color: #2A3F54; color: #fff;">
                                                <th style="width: 60px;">ID</th>
                                                <th style="width: 120px;">Code</th>
                                                <th>Description</th>
                                                <th>Type</th>
                                                <th>Parent Category</th>
                                                <th style="width: 100px;">Is Mother</th>
                                            </tr>
                                            </thead>
                                            <tbody id="historyTableBody">
                                            <tr>
                                                <td colspan="6" class="text-center text-muted">Loading history...</td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_item_type.js}"></script>
</body>
</html>
