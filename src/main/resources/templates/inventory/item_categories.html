<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Item Categories</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/nprogress/nprogress.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/custom.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_custom.css}">
</head>
<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="fragments/fixed_sidebar :: div"></div>
        <div class="right_col" role="main">
            <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><i class="fa fa-folder-open"></i> Item Categories</h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <li>
                                    <button type="button" class="btn btn-success" onclick="openModal(false)">
                                        <i class="fa fa-plus"></i> Add Item Category
                                    </button>
                                </li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <table class="table table-striped table-bordered" id="dataTable">
                                <thead>
                                <tr>
                                    <th>#</th>
                                    <th>CODE</th>
                                    <th>DESCRIPTION</th>
                                    <th>ACTIVE</th>
                                    <th style="text-align:center; width:110px;">ACTIONS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c, stat : ${itemCategories}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${c.categoryCode}"></td>
                                    <td th:text="${c.categoryDescription}"></td>
                                    <td th:text="${c.categoryStatus} ? 'Yes' : 'No'"></td>
                                    <td style="text-align:center; white-space:nowrap;">
                                        <a href="javascript:void(0)" title="Edit" th:attr="onclick='editItem(' + ${c.id} + ')'"><i class="fa fa-pencil"></i></a>
                                        &nbsp;
                                        <a th:href="@{'/inventory/item_categories/delete/' + ${c.id}}" title="Delete" onclick="return confirm('Delete this item category?')"><i class="fa fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${itemCategories == null or itemCategories.isEmpty()}">
                                    <td colspan="5" style="text-align:center; color:#9aa3ae; padding:30px;">No item categories defined yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document" style="max-width:640px;">
        <div class="modal-content">
            <form th:action="@{/inventory/item_categories/save}" th:object="${itemCategory}" method="post" id="itemForm">
                <input type="hidden" th:field="*{id}" id="modalItemId"/>
                <div class="modal-header">
                    <h4 id="itemModalLabel">Add Item Category</h4>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group"><label>Category Code</label><input type="text" class="form-control" th:field="*{categoryCode}"/></div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group"><label>Description</label><input type="text" class="form-control" th:field="*{categoryDescription}" required/></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group"><label>Serial From</label><input type="number" class="form-control" th:field="*{serialFrom}"/></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group"><label>Serial To</label><input type="number" class="form-control" th:field="*{serialTo}"/></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group" style="margin-top:26px;"><label><input type="checkbox" th:field="*{categoryStatus}"/> Active</label></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Revenue Account</label>
                                <select class="form-control modal-select2" th:field="*{revenueAccountId}">
                                    <option value="">— None —</option>
                                    <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.accountCode} + ' - ' + ${a.accountTitle}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>COGS Account</label>
                                <select class="form-control modal-select2" th:field="*{cgsAccountId}">
                                    <option value="">— None —</option>
                                    <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.accountCode} + ' - ' + ${a.accountTitle}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Inventory Account</label>
                                <select class="form-control modal-select2" th:field="*{inventoryAccountId}">
                                    <option value="">— None —</option>
                                    <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.accountCode} + ' - ' + ${a.accountTitle}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:inline="javascript">
    $(function () { $('.modal-select2').select2({dropdownAutoWidth: true, width: '100%'}); });
    function openModal(isEdit) {
        if (!isEdit) {
            $('#itemForm')[0].reset();
            $('#modalItemId').val('0');
            $('.modal-select2').val('').trigger('change');
        }
        $('#itemModalLabel').text(isEdit ? 'Edit Item Category' : 'Add Item Category');
        $('#itemModal').modal('show');
    }
    function editItem(id) { window.location.href = '/inventory/item_categories/edit/' + id; }
    /*[# th:if="${itemCategory != null and itemCategory.id != null and itemCategory.id > 0}"]*/
    $(function () { openModal(true); });
    /*[/]*/
</script>
</body>
</html>
