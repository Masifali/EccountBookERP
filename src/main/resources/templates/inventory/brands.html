<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Define Brand</title>
<link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-ui.css">
<style>
*{box-sizing:border-box}body{margin:0;min-width:1100px;background:#f0f0f0;font:13px Tahoma,sans-serif;color:#000}nav{height:27px;background:#fff;display:flex;gap:4px;align-items:center}button{font:13px Tahoma;cursor:pointer}nav button{height:23px;border:1px solid transparent;background:transparent}nav button:hover{border-color:#008080}.editor{position:relative;width:439px;height:138px;background:#fff}.editor h1{margin:0;height:50px;background:#008080;color:white;font-size:16px;padding:28px 3px 0}.editor label{position:absolute;left:39px;font-size:12px}.editor input{position:absolute;left:114px;width:235px;height:22px;border:1px solid #7f9db9;padding:1px 3px;font:13px Tahoma}#brandCode{top:56px}#brandName{top:80px}#save{position:absolute;left:256px;top:105px;width:93px;height:28px;background:#008080;color:white;border:1px solid #006666}.grid-container{margin:5px 0;height:calc(100vh - 225px);min-height:360px;background:#fff;overflow:auto;border:1px solid #aaa}table{border-collapse:collapse;min-width:100%;width:max-content}th,td{border:1px solid #ccc;white-space:nowrap;height:23px;padding:3px 6px}th{background:#e9e9e9;text-align:left;position:sticky;top:0}tbody tr:nth-child(even){background:#f4f4f4}tbody tr.selected{background:#cbe5ff}#status{margin:4px;min-height:18px}.error{color:#a40000}[hidden]{display:none!important}
</style><script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script></head><body>
<nav><button id="new" type="button">New</button><button id="saveToolbar" type="button">Save</button><button id="updateToolbar" type="button" hidden>Update</button><button id="shortcuts" type="button">ShortCutKeys</button><button id="history" type="button">History</button></nav>
<form id="editor" class="editor"><h1>Define Brand</h1><label for="brandCode" style="top:62px">Brand Code</label><input id="brandCode" maxlength="50" required><label for="brandName" style="top:86px">Brand Name</label><input id="brandName" maxlength="50" required><button id="save" type="submit">Save</button></form>
<p id="status" role="status"></p>
<div class="grid-container" tabindex="0" aria-label="Brand history"><table><thead><tr><th>BrandCode</th><th>BrandName</th><th>EntryUser</th><th>EntryDate</th><th>ModifyUser</th><th>ModifyDate</th></tr></thead><tbody id="brandRows"></tbody></table></div>
<script src="/js/inventory-brands.js"></script></body></html>
