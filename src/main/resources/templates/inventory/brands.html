<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Brand - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: Tahoma, "Segoe UI", Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 10.5px; color: #000; margin: 0; padding: 0; }
        .win-title-bar { background-color: #00796B; color: #ffffff; padding: 2px 8px; font-size: 11.5px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; height: 23px; box-sizing: border-box; }
        .win-toolbar { background: linear-gradient(to bottom, #ffffff 0%, #d8e0e8 100%); border-bottom: 1px solid #a0b0c0; padding: 2px 6px; display: flex; gap: 4px; align-items: center; height: 25px; box-sizing: border-box; }
        .win-btn { background: linear-gradient(to bottom, #ffffff 0%, #e4e9ed 100%); border: 1px solid #849ca8; border-radius: 2px; padding: 1px 7px; font-size: 10.5px; font-weight: 600; color: #000; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; height: 20px; box-shadow: inset 0 1px 0 #fff; text-decoration: none; }
        .win-btn:hover { background: #e0f2f1; border-color: #00796B; text-decoration: none; color: #000; }
        .win-btn-primary { background: #00796B; color: #fff; border-color: #004d40; }
        .win-btn-primary:hover { background: #004d40; color: #fff; }
        
        .win-panel-header { background-color: #00796B; color: #ffffff; padding: 2px 8px; font-weight: bold; font-size: 11px; height: 20px; display: flex; align-items: center; }
        .form-section { background: #ffffff; border: 1px solid #94a3b8; padding: 8px; margin: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .win-label { font-weight: 600; color: #222; margin-bottom: 1px; font-size: 10px; white-space: nowrap; }
        .win-input { border: 1px solid #7f9db9; border-radius: 1px; padding: 1px 4px; font-size: 10.5px; font-family: Tahoma, sans-serif; height: 21px; width: 100%; background-color: #ffffff; box-sizing: border-box; }
        .win-input:focus { border-color: #00796B; outline: none; }
        
        .grid-container { max-height: calc(100vh - 220px); overflow: auto; border: 1px solid #849ca8; margin: 4px; background: #fff; }
        .win-grid-table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: Tahoma, sans-serif; background: #ffffff; }
        .win-grid-table th { background: linear-gradient(to bottom, #dbe6f2 0%, #b0c4de 100%); color: #000000; font-weight: bold; padding: 3px 5px; border: 1px solid #849ca8; text-align: left; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
        .win-grid-table td { padding: 2px 5px; border: 1px solid #cbd5e1; vertical-align: middle; white-space: nowrap; height: 19px; }
        .win-grid-table tbody tr:nth-child(even) { background-color: #f7fafc; }
        .win-grid-table tbody tr:hover { background-color: #cbe5ff; cursor: pointer; }
        .win-grid-table tbody tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="win-title-bar">
        <span><i class="fa fa-bookmark-o"></i> Define Brand</span>
        <a href="/inventory" style="color: #ffffff; text-decoration: none; font-size: 10.5px;">
            <i class="fa fa-arrow-left"></i> Back to Inventory
        </a>
    </div>

    <!-- WinForms Toolbar matching Screenshot #5 -->
    <div class="win-toolbar">
        <button type="button" class="win-btn" id="btnNew" onclick="resetForm()"><i class="fa fa-plus text-success"></i> New</button>
        <button type="button" class="win-btn win-btn-primary" id="btnSaveToolbar" onclick="saveBrand()"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="win-btn" onclick="alert('Shortcuts:\nCtrl+S: Save\nCtrl+N: New')"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    </div>

    <!-- Header Panel: Define Brand -->
    <div class="win-panel-header">Define Brand</div>

    <!-- Form Section matching C# WinForms screenshot #5 -->
    <div class="form-section">
        <input type="hidden" id="brandId" value="" />
        
        <div class="row" style="margin-bottom: 4px;">
            <div class="col-md-3">
                <span class="win-label">Brand Code</span>
                <input type="text" id="brandCode" class="win-input" placeholder="e.g. BRD-01" />
            </div>
        </div>

        <div class="row" style="margin-bottom: 8px;">
            <div class="col-md-3">
                <span class="win-label">Brand Name</span>
                <input type="text" id="brandName" class="win-input" placeholder="e.g. Super Kernel Brand" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-3">
                <button type="button" class="win-btn win-btn-primary" style="height: 22px; padding: 2px 15px;" onclick="saveBrand()">Save</button>
            </div>
        </div>
    </div>

    <!-- Header Panel: History -->
    <div class="win-panel-header">History</div>

    <!-- History Grid matching WinForms Screenshot #5 -->
    <div class="grid-container">
        <table class="win-grid-table" id="brandGrid">
            <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 25%;">Brand Code</th>
                    <th style="width: 50%;">Brand Name</th>
                    <th style="width: 15%;">Status</th>
                </tr>
            </thead>
            <tbody id="brandGridBody">
                <tr><td colspan="4" style="text-align:center;">Loading brands...</td></tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        var brandData = [];

        $(document).ready(function() {
            loadBrandGrid();
        });

        function loadBrandGrid() {
            $.ajax({
                url: '/api/inventory/brands/list',
                type: 'GET',
                success: function(data) {
                    brandData = data || [];
                    renderGrid(brandData);
                },
                error: function() {
                    $('#brandGridBody').html('<tr><td colspan="4" style="text-align:center; color:red;">Failed to load brands.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="4" style="text-align:center;">No Brand records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td>' + (item.brandCode || '') + '</td>';
                    html += '<td><strong>' + (item.brandName || '') + '</strong></td>';
                    html += '<td>' + (item.isActive !== false ? 'Active' : 'Inactive') + '</td>';
                    html += '</tr>';
                });
            }
            $('#brandGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#brandGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = brandData[idx];
            if(item) {
                $('#brandId').val(item.id);
                $('#brandCode').val(item.brandCode || '');
                $('#brandName').val(item.brandName || '');
            }
        }

        function resetForm() {
            $('#brandId').val('');
            $('#brandCode').val('');
            $('#brandName').val('');
            $('#brandGridBody tr').removeClass('selected');
        }

        function saveBrand() {
            var name = $('#brandName').val().trim();
            if(!name) {
                alert('Please enter Brand Name.');
                $('#brandName').focus();
                return;
            }

            var payload = {
                id: $('#brandId').val() ? parseInt($('#brandId').val()) : null,
                brandCode: $('#brandCode').val(),
                brandName: name,
                isActive: true
            };

            $.ajax({
                url: '/api/inventory/brands/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Brand saved successfully!');
                    resetForm();
                    loadBrandGrid();
                },
                error: function(xhr) {
                    alert('Failed to save Brand: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }
    </script>
</body>
</html>
