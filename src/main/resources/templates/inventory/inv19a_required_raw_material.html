<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Required Raw Material Against Sale Orders - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv19a_reports.css?v=20261013a}" href="/build/css/countx_inv19a_reports.css?v=20261013a">
    <style>
        /* RequiredRawMaterialAgainstSaleOrders designer geometry (InitializeComponent :497-793), 1:1 px, panel1 1241 wide:
           toolStrip3 (27) | panel3 teal title (32) | panel4 filters (36) | panel2 left 768 (GridHistory) + panel6 right 473 (GridRawItems). */
        .rrm-grid { height: calc(100vh - 260px); min-height: 380px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:1241px;">
    <!-- toolStrip3: btnNew "&Reset" (no Click handler in the desktop designer :765-769) -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnNew" title="Desktop button has no handler"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <span><u>R</u>eset</span></button>
    </div>
    <!-- panel3 (32, #0a6e6e) -->
    <div class="fx-rel" style="height:32px;background:#0a6e6e;">
        <span class="fx-abs fx-title" style="left:8px;top:5px;">Required Raw Material Against Sale Orders</span>
    </div>
    <!-- panel4 (36) -->
    <div class="fx-rel" style="height:36px;">
        <label class="fx-abs fx-lbl" style="left:11px;top:11px;" for="datToDate">To Date</label>
        <input type="date" id="datToDate" class="fx-abs fx-dt" style="left:67px;top:7px;width:131px;height:22px;">
        <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:203px;top:5px;width:58px;height:26px;" title="Show">Show</button>
        <label class="fx-abs fx-lbl" style="left:770px;top:14px;" for="txtqtyUom">Pack Uom</label>
        <input type="text" id="txtqtyUom" class="fx-abs fx-txt" style="left:837px;top:10px;width:100px;" value="100" inputmode="decimal">
    </div>
    <div style="display:flex;">
        <!-- panel2 (768): label1 teal 23 + btnRegister + ctrlGrdBar1, panel5 GridHistory -->
        <div style="width:768px;">
            <div class="fx-teal-bar" style="height:23px;">This Grid Shows Brand Wise Required Material
                <button type="button" id="btnRegister" class="fx-abs fx-btn olive" style="left:662px;top:1px;width:58px;height:22px;" title="464-RequiredRawMaterialRegisterTwo.rpt">Print</button>
                <div id="gbMount1" class="fx-abs" style="left:726px;top:0;width:41px;height:23px;"></div>
            </div>
            <div class="fx-grid-host rrm-grid" data-gridbar-form="RequiredRawMaterialAgainstSaleOrders" data-gridbar-grid="GridHistory"
                 data-gridbar-mount="#gbMount1" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove">
                <table class="win-grid" id="GridHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
            </div>
            <div class="fx-nav" id="navHistory"></div>
        </div>
        <!-- panel6 (473): label2 teal 23 + txtSummPrint + ctrlGrdBar2, GridRawItems -->
        <div style="width:473px;">
            <div class="fx-teal-bar" style="height:23px;">This Grid Shows How Much Raw Item Required
                <button type="button" id="txtSummPrint" class="fx-abs fx-btn olive" style="left:359px;top:0;width:58px;height:22px;" title="463-RequiredRawMaterialRegister.rpt">Print</button>
                <div id="gbMount2" class="fx-abs" style="left:421px;top:0;width:37px;height:23px;"></div>
            </div>
            <div class="fx-grid-host rrm-grid" data-gridbar-form="RequiredRawMaterialAgainstSaleOrders" data-gridbar-grid="GridRawItems"
                 data-gridbar-mount="#gbMount2" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
                <table class="win-grid" id="GridRawItems"><thead></thead><tbody></tbody><tfoot></tfoot></table>
            </div>
            <div class="fx-nav" id="navRaw"></div>
        </div>
    </div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inv19a_common.js?v=20261013a}" src="/build/js/countx_inv19a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv19a_required_raw_material.js?v=20261013a}" src="/build/js/countx_inventory_inv19a_required_raw_material.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
