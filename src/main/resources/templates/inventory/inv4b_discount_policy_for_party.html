<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discount Policy For Party - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4b_definitions.css?v=20261013a}" href="/build/css/countx_inv4b_definitions.css?v=20261013a">
    <style>
        /* DiscountPolicyForParty designer (InitializeComponent :404-776), ClientSize 1042 x 694:
           panel2 34 (tsPriceSchedule at 1,4 + ctrlGrdBar1 at 995,3) | panel3 teal 40 "Discount Policy for Party" (Calibri 14.25 bold) |
           panel4 77 (panel8) | panel5 fill: grd (no history strip) */
        #grdHost { height: calc(100vh - 290px); min-height: 320px; }
        .fx-teal .cap.calibri { font: bold 19px Calibri, Carlito, "Segoe UI", sans-serif; line-height: 23px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:1042px;">
    <!-- panel2 (0,0) 1042 x 34: BtnNew, BtnEdit, BtnSave; ctrlGrdBar1 (995,3) -->
    <div class="fx-rel" style="height:34px;background:#fff;border-bottom:1px solid #b5b5b5;">
        <div class="fx-strip fx-abs" style="left:1px;top:4px;height:27px;border:0;">
            <button type="button" class="fx-tool" id="BtnNew" style="width:55px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool is-hidden" id="BtnEdit" style="width:69px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <button type="button" class="fx-tool" id="BtnSave" style="width:55px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
        </div>
        <div id="gbMount" class="fx-abs" style="left:995px;top:3px;width:43px;height:28px;"></div>
    </div>
    <!-- panel3 (0,34) 1042 x 40 teal; label13 (8,8) -->
    <div class="fx-teal" style="height:40px;"><span class="cap calibri" style="left:8px;top:8px;">Discount Policy for Party</span></div>
    <!-- panel4 (0,74) 1042 x 77 white (panel8) -->
    <div class="fx-rel" style="height:77px;background:#fff;">
        <label class="fx-abs fx-lbl reg" for="dtpEffectedDate" style="left:11px;top:11px;">Effected Date</label>
        <input type="date" id="dtpEffectedDate" class="fx-abs fx-dt" style="left:118px;top:8px;width:220px;font-family:Calibri,Carlito,sans-serif;">
        <label class="fx-abs fx-lbl reg" for="cmbDiscountType" style="left:11px;top:41px;">Discount Type</label>
        <select id="cmbDiscountType" class="fx-abs fx-cmb win-combo" style="left:118px;top:37px;width:220px;height:25px;font-family:'Microsoft Sans Serif',Tahoma,sans-serif;"></select>
        <label class="fx-abs fx-lbl reg" for="txtPolicyname" style="left:355px;top:11px;">Policy Name</label>
        <input type="text" id="txtPolicyname" class="fx-abs fx-txt mss" style="left:462px;top:8px;width:220px;" maxlength="50">
        <label class="fx-abs fx-lbl reg" for="txtDiscountRate" style="left:355px;top:41px;">Discount Rate</label>
        <input type="text" id="txtDiscountRate" class="fx-abs fx-txt mss" style="left:462px;top:38px;width:220px;" inputmode="decimal">
        <label class="fx-abs fx-chk" style="left:688px;top:44px;font-weight:normal;font-family:'Microsoft Sans Serif',Tahoma,sans-serif;font-size:11px;"><input type="checkbox" id="chkIsActive" checked> Is Active</label>
    </div>
    <!-- panel5 (0,151): grd fill -->
    <div id="grdHost" class="fx-grid-host" data-gridbar-form="DiscountPolicyForParty" data-gridbar-grid="grd"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}" src="/build/js/countx_store_common.js?v=20260928b"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_discount_policy_for_party.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_discount_policy_for_party.js?v=20261013a"></script>
</body>
</html>
