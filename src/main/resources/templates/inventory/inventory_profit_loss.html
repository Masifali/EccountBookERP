<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Stock Evaluation Profit &amp; Loss - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <style>
        /* frmInventoryProfitLoss designer geometry (InitializeComponent :494-1839), 1:1 px. ClientSize 895x595:
           panel2 toolStrip1 (35, ctrlGrdBar1 at 843,6) | panel3 white (215: panel5 42 docked top) | panel4 grdfrm (Fill). */
        :root { --ipl-dark: #0a6e6e; }
        body { background: #fff; margin: 0; padding-bottom: 12px; }
        .fx-scroll { overflow-x: auto; }
        .fx-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .fx-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .fx-rel { position: relative; }
        .fx-lbl { font-family: Calibri, "Segoe UI", Tahoma, sans-serif; font-size: 13px; white-space: nowrap; line-height: 15px; color: #000; }
        .fx-cmb { font-family: Calibri, "Segoe UI", Tahoma, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dt { font-family: Calibri, "Segoe UI", Tahoma, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; white-space: nowrap; color: #000; height: 17px; }
        .fx-chk input { margin: 0; }
        .fx-strip { height: 35px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; position: relative; }
        .fx-tool { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; height: 32px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; cursor: pointer; white-space: nowrap; color: #000; }
        .fx-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .fx-btn { background: var(--ipl-dark); color: #fff; border: 1px solid #054d4d; font-family: Calibri, "Segoe UI", Tahoma, sans-serif; font-size: 13px; padding: 0; cursor: pointer; }
        .fx-btn:hover:not(:disabled) { background: #054d4d; }
        .fx-grid-host { overflow: auto; background: #fff; height: calc(100vh - 340px); min-height: 345px; position: relative; }
        .fx-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; border-collapse: collapse; }
        .fx-grid-host .win-grid th { background: linear-gradient(to bottom, #e6f7f7 0%, #bfe6e6 100%); border: 1px solid #8fbcbc; font-weight: normal; white-space: nowrap; padding: 2px 4px; text-align: center; position: sticky; top: 0; z-index: 2; }
        .fx-grid-host .win-grid thead tr.flt td { position: sticky; top: 20px; z-index: 2; background: #f4fbfb; border: 1px solid #c8dede; padding: 0; }
        .fx-grid-host .win-grid thead tr.flt input { width: 100%; box-sizing: border-box; border: 0; height: 18px; font: 11px Verdana, sans-serif; background: transparent; }
        .fx-grid-host .win-grid td { border: 1px solid #d5e6e6; white-space: nowrap; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; }
        .fx-grid-host .win-grid td.n { text-align: right; }
        .fx-grid-host .win-grid td a { color: #0000ee; text-decoration: underline; cursor: pointer; }
        .fx-grid-host .win-grid tr.grp td { background: #e3f1f1; font-weight: bold; }
        .fx-grid-host .win-grid tr.gtot td { background: #f3f3f3; font-weight: bold; }
        .fx-grid-host .win-grid tbody tr.sel td { background: #cde8ff; }
        .fx-grid-host .win-grid tfoot td { background: #e6e6e6; font-weight: bold; text-align: right; position: sticky; bottom: 0; }
        .fx-nav { font: 11px Verdana, sans-serif; padding: 2px 8px; border-top: 1px solid #c8dede; background: #f4f4f4; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:895px;">
    <!-- panel2 / toolStrip1: btnRefresh (70x32); ctrlGrdBar1 (843,6) 45x21 -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnRefresh"><i class="fa fa-repeat"></i> <span><u>R</u>efresh</span></button>
        <div id="gbMount" class="fx-abs" style="left:843px;top:6px;width:45px;height:21px;"></div>
    </div>
    <!-- panel3 (215) -->
    <div class="fx-rel" style="height:215px;background:#fff;">
        <!-- panel5 (42, docked top, 10,110,110) -->
        <div class="fx-abs" style="left:0;top:0;width:895px;height:42px;background:#0a6e6e;">
            <span class="fx-abs" style="left:10px;top:8px;font:19px 'Microsoft Sans Serif', Tahoma, sans-serif;color:#fff;white-space:nowrap;line-height:24px;">Item Wise Profit And Loss</span>
        </div>
        <label class="fx-abs fx-lbl" style="left:10px;top:56px;" for="txtDateFrom">Date From</label>
        <input type="date" id="txtDateFrom" class="fx-abs fx-dt" style="left:10px;top:78px;width:101px;">
        <label class="fx-abs fx-lbl" style="left:114px;top:56px;" for="txtDateTo">Date To</label>
        <input type="date" id="txtDateTo" class="fx-abs fx-dt" style="left:114px;top:78px;width:108px;">
        <label class="fx-abs fx-lbl" style="left:225px;top:56px;" for="cmbMainType">Parent Category</label>
        <select id="cmbMainType" class="fx-abs fx-cmb win-combo" style="left:225px;top:76px;width:161px;"></select>
        <label class="fx-abs fx-lbl" style="left:389px;top:56px;" for="CmbClassGroup">Class Group</label>
        <select id="CmbClassGroup" class="fx-abs fx-cmb win-combo" style="left:389px;top:76px;width:151px;"></select>
        <label class="fx-abs fx-lbl" style="left:542px;top:56px;" for="cmbCategory">Item Category</label>
        <select id="cmbCategory" class="fx-abs fx-cmb win-combo" style="left:542px;top:76px;width:149px;"></select>
        <label class="fx-abs fx-lbl" style="left:694px;top:56px;" for="cmbItemType">Item Type </label>
        <select id="cmbItemType" class="fx-abs fx-cmb win-combo" style="left:694px;top:76px;width:161px;"></select>

        <label class="fx-abs fx-lbl" style="left:12px;top:106px;" for="cmbStockAccounts">Stock Account</label>
        <select id="cmbStockAccounts" class="fx-abs fx-cmb win-combo" style="left:10px;top:128px;width:212px;"></select>
        <label class="fx-abs fx-lbl" style="left:222px;top:110px;" for="cmbWareHouse">WareHouse</label>
        <select id="cmbWareHouse" class="fx-abs fx-cmb win-combo" style="left:224px;top:128px;width:162px;"></select>
        <label class="fx-abs fx-lbl" style="left:389px;top:109px;" for="cmbJobLot">JobLot</label>
        <select id="cmbJobLot" class="fx-abs fx-cmb win-combo" style="left:389px;top:128px;width:151px;"></select>
        <label class="fx-abs fx-lbl" style="left:542px;top:109px;" for="cmbCropYear">CropYear</label>
        <select id="cmbCropYear" class="fx-abs fx-cmb win-combo" style="left:542px;top:128px;width:149px;"></select>

        <label class="fx-abs fx-lbl" style="left:10px;top:164px;" for="cmbItem">Item Name</label>
        <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:10px;top:183px;width:376px;"></select>
        <label class="fx-abs fx-lbl" style="left:389px;top:163px;" for="cmbReportType">Report Type</label>
        <select id="cmbReportType" class="fx-abs fx-cmb win-combo" style="left:389px;top:183px;width:228px;"></select>
        <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:619px;top:183px;width:60px;height:26px;">Show</button>
        <label class="fx-abs fx-chk" style="left:689px;top:188px;"><input type="checkbox" id="ChkItemWiseStock" checked> Item Wise Stock</label>
    </div>
    <!-- panel4: grdfrm (Fill) -->
    <div id="grdWrap" class="fx-grid-host" data-gridbar-form="frmInventoryProfitLoss" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inventory_profit_loss.js?v=20261013a}"></script>
</body>
</html>
