<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Report With FIFO - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv19a_reports.css?v=20261013a}" href="/build/css/countx_inv19a_reports.css?v=20261013a">
    <style>
        /* StockReportyWithFIFO designer geometry (InitializeComponent :397-800), 1:1 px, 807 wide (AutoScrollMinSize 980x600):
           panel2 toolStrip1 (29) | panel3 filters (84; panel5 teal 31 docked top, ctrlGrdBar1 at 760,3) | panel4 grdfrm (Fill). */
        .swf-grid { height: calc(100vh - 260px); min-height: 320px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:980px;">
    <!-- toolStrip1: btnReset "&Reset" (btnRefresh_Click), btnRefreshCombo "&Refresh", btnPrint "390-&Print" -->
    <div class="fx-strip" style="height:29px;">
        <button type="button" class="fx-tool" id="btnReset" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <span><u>R</u>eset</span></button>
        <button type="button" class="fx-tool" id="btnRefreshCombo"><i class="fa fa-repeat"></i> <span><u>R</u>efresh</span></button>
        <button type="button" class="fx-tool" id="btnPrint" title="Ctrl+P"><i class="fa fa-print"></i> <span>390-<u>P</u>rint</span></button>
    </div>
    <!-- panel3 (84) -->
    <div class="fx-rel" style="height:84px;">
        <div class="fx-abs" style="left:0;top:0;width:980px;height:31px;background:#0a6e6e;">
            <span class="fx-abs fx-title" style="left:7px;top:5px;">Stock Report With FIFO</span>
            <div id="gbMount" class="fx-abs" style="left:760px;top:3px;width:45px;height:25px;"></div>
        </div>
        <label class="fx-abs fx-lbl" style="left:10px;top:34px;" for="txtDocDate">Date Date</label>
        <input type="date" id="txtDocDate" class="fx-abs fx-dt" style="left:9px;top:54px;width:110px;">
        <label class="fx-abs fx-lbl" style="left:124px;top:34px;" for="cmbItem">Item Name</label>
        <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:121px;top:52px;width:285px;"></select>
        <label class="fx-abs fx-lbl" style="left:406px;top:34px;" for="cmbWareHouse">WareHouse</label>
        <select id="cmbWareHouse" class="fx-abs fx-cmb win-combo" style="left:409px;top:52px;width:198px;"></select>
        <button type="button" id="btnshow" class="fx-abs fx-btn" style="left:612px;top:52px;width:60px;height:26px;font-size:13px;" title="Ctrl+S">Show</button>
    </div>
    <div class="fx-grid-host swf-grid" data-gridbar-form="StockReportyWithFIFO" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inv19a_common.js?v=20261013a}" src="/build/js/countx_inv19a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv19a_stock_report_with_fifo.js?v=20261013a}" src="/build/js/countx_inventory_inv19a_stock_report_with_fifo.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
