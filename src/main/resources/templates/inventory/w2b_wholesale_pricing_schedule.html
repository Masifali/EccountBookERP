<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whole Sale Pricing - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4a.css?v=20261013a}" href="/build/css/countx_inv4a.css?v=20261013a">
    <style>
        /* WholeSale/frmItemPricingSchedule designer geometry (InitializeComponent), 1:1 px. ClientSize 1015 x 719;
           tabPage1: panel3 toolStrip (28) | panel4 teal (31) | panel5 (149: groupBox2 12,6 540x138 + groupBox1 558,6 438x138) | panel7 grid (Fill). */
        .fx-root { width: 1015px; }
        #datagridHost { height: calc(100vh - 330px); min-height: 300px; }
        #DataGridHistoryHost { height: calc(100vh - 200px); min-height: 380px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" id="tabRoot">

    <!-- ===================================================== tabPage1 "Form" -->
    <div id="tabForm" class="fx-panel is-active">
        <!-- panel3 / toolStrip1: btnnew, btnsave, btnUpdate(hidden) -->
        <div class="fx-strip" style="height:28px;">
            <button type="button" class="fx-tool" id="btnnew" style="width:59px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool" id="btnsave" style="width:64px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
            <button type="button" class="fx-tool is-hidden" id="btnUpdate" style="width:78px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <a href="/app/Inventory?module=4" class="fx-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;" title="Ctrl+E / Esc"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
        <!-- panel4 (31) Teal; label15 (6,5) -->
        <div class="fx-teal" style="height:31px;background:#008080;">
            <span class="fx-teal-title" style="left:6px;top:5px;">Item Pricing Schedule</span>
        </div>
        <!-- panel5 (149) -->
        <div class="fx-rel" style="height:149px;">
            <!-- groupBox2 (12,6) 540 x 138 "By One by One Item" -->
            <fieldset class="fx-abs fx-grp" style="left:12px;top:6px;width:540px;height:138px;">
                <legend>By One by One Item</legend>
                <label class="fx-abs fx-lbl" style="left:6px;top:23px;" for="txtDescription">Schedule Description</label>
                <input type="text" id="txtDescription" class="fx-abs fx-txt" style="left:144px;top:20px;width:390px;">
                <label class="fx-abs fx-lbl" style="left:6px;top:51px;" for="txtEffectedDate">Effected Date</label>
                <input type="date" id="txtEffectedDate" class="fx-abs fx-dt" style="left:144px;top:48px;width:127px;">
                <label class="fx-abs fx-lbl" style="left:303px;top:51px;" for="datEffectedTime">Effected Time</label>
                <input type="time" id="datEffectedTime" class="fx-abs fx-dt" style="left:395px;top:48px;width:139px;" step="1">
                <label class="fx-abs fx-lbl" style="left:6px;top:79px;" for="cmbItem">Item Name</label>
                <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:144px;top:74px;width:390px;"></select>
                <button type="button" id="btnAdd" class="fx-abs fx-btn" style="left:144px;top:103px;width:69px;height:25px;background:#008080;color:#fff;">Add</button>
            </fieldset>
            <!-- groupBox1 (558,6) 438 x 138 "By Filter Item's" -->
            <fieldset class="fx-abs fx-grp" style="left:558px;top:6px;width:438px;height:138px;">
                <legend>By Filter Item's</legend>
                <label class="fx-abs fx-lbl" style="left:6px;top:23px;" for="cmbItemCategory">Item Category</label>
                <select id="cmbItemCategory" class="fx-abs fx-cmb win-combo" style="left:116px;top:18px;width:271px;"></select>
                <label class="fx-abs fx-lbl" style="left:6px;top:51px;" for="cmbItemType">Item Type</label>
                <select id="cmbItemType" class="fx-abs fx-cmb win-combo" style="left:116px;top:46px;width:271px;"></select>
                <button type="button" id="btnSearch" class="fx-abs fx-btn" style="left:116px;top:75px;width:69px;height:25px;background:#008080;color:#fff;">Search</button>
            </fieldset>
        </div>
        <!-- panel7: datagrid (Fill) -->
        <div id="datagridHost" class="fx-grid-host" data-gridbar-form="frmItemPricingSchedule_WholeSale" data-gridbar-grid="datagrid"
             data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
            <table class="win-grid" id="datagrid"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="fx-nav" id="lblNavigator"></div>
    </div>

    <!-- ===================================================== tabPage2 "history" -->
    <div id="tabHistory" class="fx-panel">
        <!-- panel8 (31) Teal: label2 (4,5) -->
        <div class="fx-teal" style="height:31px;background:#008080;">
            <span class="fx-teal-title" style="left:4px;top:5px;">Item Pricing Schedule History</span>
        </div>
        <div id="DataGridHistoryHost" class="fx-grid-host" data-gridbar-form="frmItemPricingSchedule_WholeSale" data-gridbar-grid="DataGridHistory"
             data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <!-- tab headers (TabAlignment.Bottom) -->
    <div class="fx-tabs">
        <div class="win-tab is-active" data-tab="tabForm">Form</div>
        <div class="win-tab" data-tab="tabHistory">history</div>
    </div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4a_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_w2b_wholesale_pricing_schedule.js?v=20261014a}" src="/build/js/countx_inventory_w2b_wholesale_pricing_schedule.js?v=20261014a"></script>
</body>
</html>
