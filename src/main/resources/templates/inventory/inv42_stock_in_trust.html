<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock In Trust - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_inv42.css?v=20261013a}">
    <style>
        /* frmGatePassForStockInTrust designer geometry (InitializeComponent), ClientSize 978 x 558:
           panel1 toolStrip (28) | panel3 teal (27) | panel5 filters (133) | panel4 teal (27) | grdfrm (Fill). */
        .r42-root { min-width: 978px; }
        #grdfrmHost { height: calc(100vh - 330px); min-height: 343px; }
        .fx-multi { position: absolute; }
        .fx-multi-btn { width: 100%; height: 26px; background: #fff; border: 1px solid #7a7a7a; text-align: left; padding: 0 4px; font-family: Verdana, sans-serif; font-size: 13px; display: flex; justify-content: space-between; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; }
        .fx-multi-btn span { overflow: hidden; text-overflow: ellipsis; }
        .fx-multi-list { position: absolute; z-index: 50; top: 26px; left: 0; min-width: 100%; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #7a7a7a; padding: 3px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.2); display: none; }
        .fx-multi-list label { display: block; white-space: nowrap; font: 12px Verdana, sans-serif; }
        .fx-multi-list label.all { border-bottom: 1px solid #ddd; margin-bottom: 2px; font-weight: bold; }
        .fx-multi.is-open .fx-multi-list { display: block; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="r42-scroll">
<div class="r42-root">
    <!-- panel1 white 28 / toolStrip1 -->
    <div class="r42-strip" style="height:28px;background:#fff;">
        <button type="button" class="r42-tool" id="btnReset" style="width:68px" onclick="SiT.reset()" title="Ctrl+N"><i class="fa fa-eraser"></i> Reset</button>
        <button type="button" class="r42-tool" id="toolStripButton1" style="width:80px" onclick="SiT.refresh()" title="Ctrl+R"><i class="fa fa-repeat"></i> Refresh</button>
        <button type="button" class="r42-tool" id="btnPrint" style="width:139px" onclick="SiT.print()" title="Ctrl+P"><i class="fa fa-print"></i> 253_01-Register</button>
        <button type="button" class="r42-tool" id="btnshortcut" style="width:106px" onclick="SiT.shortcutKeys()">ShortCut Keys</button>
        <a href="/app/Inventory?module=137" class="r42-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>
    <!-- panel3 teal 27: lblCaption (3,4) -->
    <div class="r42-teal" style="height:27px;">
        <span class="r42-teal-title" style="left:3px;top:4px;">Stock in Trust Report</span>
    </div>
    <!-- panel5 (133): groupBox1 "Filters" (3,2) 776 x 130 -->
    <div style="position:relative;height:133px;background:#fff;">
        <div class="r42-gb" style="left:3px;top:2px;width:776px;height:130px;">
            <span class="r42-cap">Filters</span>
            <label class="r42-abs r42-lbl" style="left:4px;top:19px;">Branch Name</label>
            <div class="fx-multi" id="cmbBranchName" style="left:87px;top:13px;width:169px;">
                <button type="button" class="fx-multi-btn" onclick="SiT.toggleBranches()"><span id="cmbBranchNameText"></span><i class="fa fa-caret-down"></i></button>
                <div class="fx-multi-list" id="cmbBranchNameList"></div>
            </div>
            <label class="r42-abs r42-lbl" for="cmbDateType" style="left:4px;top:47px;">Date Type</label>
            <select id="cmbDateType" class="r42-abs r42-cmb win-combo" style="left:87px;top:41px;width:169px;" onchange="SiT.dateTypeChanged()"></select>
            <label class="r42-abs r42-lbl" for="gpFromDate" style="left:4px;top:75px;">GP Date From</label>
            <input type="date" id="gpFromDate" class="r42-abs r42-dt" style="left:87px;top:71px;width:169px;">
            <label class="r42-abs r42-lbl" for="gpToDate" style="left:4px;top:103px;">GP Date To</label>
            <input type="date" id="gpToDate" class="r42-abs r42-dt" style="left:87px;top:99px;width:169px;">

            <label class="r42-abs r42-lbl" for="txtGpFrom" style="left:260px;top:19px;">GP From &amp; To</label>
            <input type="text" id="txtGpFrom" class="r42-abs r42-txt r" style="left:344px;top:15px;width:90px;" inputmode="numeric">
            <input type="text" id="txtGPTo" class="r42-abs r42-txt r" style="left:435px;top:15px;width:90px;" inputmode="numeric">
            <label class="r42-abs r42-lbl" for="cmbSupplierName" style="left:260px;top:47px;">Supplier </label>
            <select id="cmbSupplierName" class="r42-abs r42-cmb win-combo" style="left:344px;top:41px;width:181px;"></select>
            <label class="r42-abs r42-lbl" for="cmbgptype" style="left:260px;top:75px;">GatePass Type</label>
            <select id="cmbgptype" class="r42-abs r42-cmb win-combo" style="left:344px;top:69px;width:181px;"></select>
            <label class="r42-abs r42-lbl" for="cmbIsAccept" style="left:260px;top:103px;">Status</label>
            <select id="cmbIsAccept" class="r42-abs r42-cmb win-combo" style="left:344px;top:97px;width:181px;"></select>
            <button type="button" id="btnshow" class="r42-abs r42-btn" style="left:528px;top:99px;width:61px;height:23px;" onclick="SiT.show()" title="Ctrl+S">Show</button>
        </div>
    </div>
    <!-- panel4 teal 27: label7 (3,4), ctrlGrdBar1 (934,3) -->
    <div class="r42-teal" style="height:27px;">
        <span class="r42-teal-title" style="left:3px;top:4px;">Stock in Trust</span>
        <div id="gbMount" class="r42-abs" style="left:934px;top:3px;width:39px;height:21px;"></div>
    </div>
    <div class="r42-grid-host win-grid-scroll" id="grdfrmHost" data-gridbar-form="frmGatePassForStockInTrust" data-gridbar-grid="grdfrm" data-gridbar-mount="#gbMount" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
</div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_inventory_inv42_stock_in_trust.js?v=20261013a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
