<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricing Schedule For Booking - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4a.css?v=20261013a}" href="/build/css/countx_inv4a.css?v=20261013a">
    <style>
        /* frmItemPricingSchedule_New designer geometry (InitializeComponent :1259-3354), 1:1 px. ClientSize 1124 x 661;
           tabPage panels 1110 wide: panel3 toolStrip (28) | panel4 teal (33) | panel5 (141: groupBox1 559 x 134 + groupBox2 544 x 134)
           | panel7: label18 teal (30) with label25 / label23 / CmbCropYearForUpdateOfGridRows / ctrlGrdBar2 + grd (Fill). */
        .fx-root { width: 1110px; }
        #grdHost { height: calc(100vh - 335px); min-height: 300px; }
        #DataGridHistoryHost { height: calc(100vh - 285px); min-height: 360px; }
        .fx-note { position: absolute; left: 627px; top: 0; width: 254px; height: 30px; color: #fff; font: 11px Verdana, sans-serif; line-height: 15px; white-space: normal; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" id="tabRoot">

    <!-- ===================================================== tabPage1 "Form" -->
    <div id="tabForm" class="fx-panel is-active">
        <div class="fx-strip" style="height:28px;">
            <button type="button" class="fx-tool" id="btnnew" style="width:59px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool" id="btnsave" style="width:64px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
            <button type="button" class="fx-tool is-hidden" id="btnUpdate" style="width:78px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <span class="fx-sep"></span>
            <button type="button" class="fx-tool" id="btnrefresh" style="width:80px"><i class="fa fa-repeat"></i> Refresh</button>
            <a href="/app/Inventory?module=4" class="fx-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;" title="Ctrl+E / Esc"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
        <div class="fx-teal" style="height:33px;background:#0a6e6e;">
            <span class="fx-teal-title" style="left:7px;top:7px;">Item Pricing Schedule</span>
        </div>
        <div class="fx-rel" style="height:141px;">
            <!-- groupBox1 (4,2) 559 x 134 "By Filter Item's" -->
            <fieldset class="fx-abs fx-grp" style="left:4px;top:2px;width:559px;height:134px;">
                <legend>By Filter Item's</legend>
                <label class="fx-abs fx-lbl" style="left:12px;top:12px;" for="CmbParentCatagory">Parent Catagory</label>
                <select id="CmbParentCatagory" class="fx-abs fx-cmb win-combo" style="left:109px;top:6px;width:252px;"></select>
                <label class="fx-abs fx-lbl" style="left:12px;top:41px;" for="cmbItemCategory">Item Category</label>
                <select id="cmbItemCategory" class="fx-abs fx-cmb win-combo" style="left:109px;top:35px;width:252px;"></select>
                <label class="fx-abs fx-lbl" style="left:12px;top:70px;" for="cmbItemType">Item Type</label>
                <select id="cmbItemType" class="fx-abs fx-cmb win-combo" style="left:109px;top:64px;width:252px;"></select>
                <label class="fx-abs fx-lbl" style="left:12px;top:97px;" for="txtApplyRateUom">Apply Rate Uom</label>
                <input type="text" id="txtApplyRateUom" class="fx-abs fx-txt" style="left:109px;top:93px;width:252px;" inputmode="decimal">
                <label class="fx-abs fx-lbl" style="left:368px;top:12px;">Effected Date</label>
                <label class="fx-abs fx-chk" style="left:451px;top:10px;"><input type="checkbox" id="chkApplyDate"> Apply Date</label>
                <input type="date" id="datEffectedForFilter" class="fx-abs fx-dt" style="left:368px;top:37px;width:185px;" disabled>
                <label class="fx-abs fx-chk" style="left:368px;top:68px;"><input type="checkbox" id="CbOnlyShowRatedItems" checked> Show Only Rated Items</label>
                <button type="button" id="btnSearch" class="fx-abs fx-btn" style="left:487px;top:92px;width:66px;height:25px;">Search</button>
            </fieldset>
            <!-- groupBox2 (565,2) 544 x 134 "By One by One Item" -->
            <fieldset class="fx-abs fx-grp" style="left:565px;top:2px;width:544px;height:134px;">
                <legend>By One by One Item</legend>
                <label class="fx-abs fx-lbl" style="left:4px;top:10px;" for="txtEffectedDate">Effected Date</label>
                <input type="date" id="txtEffectedDate" class="fx-abs fx-dt" style="left:86px;top:6px;width:136px;">
                <label class="fx-abs fx-lbl" style="left:4px;top:37px;" for="datEffectedTime">Effected Time</label>
                <input type="time" id="datEffectedTime" class="fx-abs fx-dt" style="left:86px;top:33px;width:136px;" step="1">
                <label class="fx-abs fx-lbl" style="left:4px;top:64px;" for="txtLastRate">Last Rate</label>
                <input type="text" id="txtLastRate" class="fx-abs fx-txt" style="left:86px;top:60px;width:136px;" readonly tabindex="-1">
                <label class="fx-abs fx-lbl" style="left:4px;top:89px;" for="datPreviousDate">Previous Date</label>
                <input type="date" id="datPreviousDate" class="fx-abs fx-dt" style="left:86px;top:85px;width:136px;" disabled>
                <label class="fx-abs fx-lbl" style="left:228px;top:10px;" for="cmbItem">Item Name</label>
                <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:299px;top:4px;width:240px;"></select>
                <label class="fx-abs fx-lbl" style="left:228px;top:37px;" for="cmbCropYear">CropYear</label>
                <select id="cmbCropYear" class="fx-abs fx-cmb win-combo" style="left:299px;top:31px;width:240px;"></select>
                <label class="fx-abs fx-lbl" style="left:228px;top:64px;" for="CmbRateUom">Rate Uom</label>
                <select id="CmbRateUom" class="fx-abs fx-cmb win-combo" style="left:299px;top:58px;width:88px;"></select>
                <label class="fx-abs fx-lbl" style="left:392px;top:64px;" for="txtNewPrice">New Rate</label>
                <input type="text" id="txtNewPrice" class="fx-abs fx-txt" style="left:451px;top:60px;width:88px;" inputmode="decimal">
                <button type="button" id="btnAdd" class="fx-abs fx-btn" style="left:482px;top:83px;width:57px;height:26px;">Add</button>
            </fieldset>
        </div>
        <!-- panel7 top strip: label18 teal (30) "Detail Grid", label25 note, label23 + CmbCropYearForUpdateOfGridRows, ctrlGrdBar2 -->
        <div class="fx-teal" style="height:30px;">
            <span class="fx-teal-title" style="left:6px;top:5px;">Detail Grid</span>
            <span class="fx-note">This Selected Crop Year Will Update in All Rows of Grid Where Crop Year Not Selected</span>
            <label class="fx-abs fx-lbl" style="left:884px;top:8px;color:#fff;" for="CmbCropYearForUpdateOfGridRows">CropYear</label>
            <select id="CmbCropYearForUpdateOfGridRows" class="fx-abs fx-cmb win-combo" style="left:947px;top:2px;width:110px;"></select>
            <div id="gbMount2" class="fx-abs" style="left:1062px;top:2px;width:45px;height:25px;"></div>
        </div>
        <div id="grdHost" class="fx-grid-host" data-gridbar-form="frmItemPricingSchedule_New" data-gridbar-grid="grd"
             data-gridbar-mount="#gbMount2" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
            <table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="fx-nav" id="lblNavigator"></div>
    </div>

    <!-- ===================================================== tabPage2 "History" -->
    <div id="tabHistory" class="fx-panel">
        <!-- toolStrip2: btnNewHistory, btnRefreshHistory, btnPrint325 -->
        <div class="fx-strip" style="height:27px;">
            <button type="button" class="fx-tool" id="btnNewHistory" style="width:59px"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool" id="btnRefreshHistory" style="width:80px"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="fx-tool" id="btnPrint325" style="width:92px" data-rpt="325-ItemPricingList.rpt"><i class="fa fa-print"></i> Print-325</button>
        </div>
        <!-- panel8 (100): label11 teal (27) + groupBox3 (5,29) 986 x 68 "Filters" -->
        <div class="fx-teal" style="height:27px;">
            <span class="fx-teal-title" style="left:6px;top:3px;">Item Pricing Schedule History</span>
        </div>
        <div class="fx-rel" style="height:73px;">
            <fieldset class="fx-abs fx-grp" style="left:5px;top:2px;width:986px;height:68px;">
                <legend>Filters</legend>
                <label class="fx-abs fx-lbl" style="left:7px;top:9px;" for="CmbParentCategoryHistory">Parent Category</label>
                <select id="CmbParentCategoryHistory" class="fx-abs fx-cmb win-combo" style="left:7px;top:28px;width:154px;"></select>
                <label class="fx-abs fx-lbl" style="left:162px;top:10px;" for="CmbItemCategoryHistory">Item Category</label>
                <select id="CmbItemCategoryHistory" class="fx-abs fx-cmb win-combo" style="left:162px;top:28px;width:179px;"></select>
                <label class="fx-abs fx-lbl" style="left:342px;top:9px;" for="CmbItemTypeHistory">Item Type</label>
                <select id="CmbItemTypeHistory" class="fx-abs fx-cmb win-combo" style="left:342px;top:28px;width:150px;"></select>
                <label class="fx-abs fx-lbl" style="left:493px;top:9px;" for="CmbItemHistory">Item Name</label>
                <select id="CmbItemHistory" class="fx-abs fx-cmb win-combo" style="left:493px;top:28px;width:189px;"></select>
                <label class="fx-abs fx-lbl" style="left:687px;top:9px;" for="CmbCropYearHistory">Crop Year</label>
                <select id="CmbCropYearHistory" class="fx-abs fx-cmb win-combo" style="left:684px;top:28px;width:115px;"></select>
                <label class="fx-abs fx-lbl" style="left:800px;top:9px;" for="cmbEffectedDate">Effected Date</label>
                <select id="cmbEffectedDate" class="fx-abs fx-cmb win-combo" style="left:800px;top:28px;width:115px;"></select>
                <button type="button" id="btnShow" class="fx-abs fx-btn" style="left:916px;top:27px;width:65px;height:28px;">Show</button>
            </fieldset>
        </div>
        <div class="fx-teal" style="height:27px;">
            <span class="fx-teal-title sm" style="left:6px;top:4px;">History Grid</span>
            <div id="gbMount1" class="fx-abs" style="left:1062px;top:1px;width:45px;height:25px;"></div>
        </div>
        <div id="DataGridHistoryHost" class="fx-grid-host" data-gridbar-form="frmItemPricingSchedule_New" data-gridbar-grid="DataGridHistory"
             data-gridbar-mount="#gbMount1" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <div class="fx-tabs">
        <div class="win-tab is-active" data-tab="tabForm">Form</div>
        <div class="win-tab" data-tab="tabHistory">History</div>
    </div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4a_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4a_pricing_schedule_for_booking.js?v=20261013a}" src="/build/js/countx_inventory_inv4a_pricing_schedule_for_booking.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
