<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consumption Items - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc3545; color: white; border: 1px solid #bd2130; }
        .btn-erp-danger:hover { background-color: #c82333; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .grid-container { height: 440px; overflow-y: auto; border: 1px solid #cbd5e1; background: white; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
        .filter-row input { width: 100%; font-size: 10px; padding: 1px 4px; height: 20px; box-sizing: border-box; }
    </style>
<link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-ui.css"><script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script></head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-fire"></i> Consumption Items (ConsumptionItem - Inventory Management)</div>
        <div><a href="/inventory" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Inventory Dashboard</a></div>
    </div>
    
    <div class="erp-toolbar">
        <button type="button" class="btn-erp" id="btnNew"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary" id="btnSave"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="btn-erp" id="btnUpdate"><i class="fa fa-pencil"></i> Update</button>
        <button type="button" class="btn-erp btn-erp-danger" id="btnDelete"><i class="fa fa-trash"></i> Delete</button>
        <button type="button" class="btn-erp" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
    </div>

    <div style="padding: 10px;">
        <input type="hidden" id="consumptionId" value="" />

        <div class="erp-fieldset">
            <legend>Consumption Voucher Information</legend>
            <div class="row" style="margin-bottom: 6px;">
                <div class="col-md-2">
                    <label class="form-label-erp">Voucher No *</label>
                    <input type="text" id="voucherNo" class="form-control-erp" placeholder="e.g. CON-001" />
                </div>
                <div class="col-md-2">
                    <label class="form-label-erp">Voucher Date *</label>
                    <input type="date" id="voucherDate" class="form-control-erp" />
                </div>
                <div class="col-md-4">
                    <label class="form-label-erp">Department / Cost Center *</label>
                    <input type="text" id="departmentName" class="form-control-erp" placeholder="e.g. Production Department" />
                </div>
                <div class="col-md-4">
                    <label class="form-label-erp">Select Consumed Item *</label>
                    <select id="itemId" class="form-control-erp select2">
                        <option value="">-- Select Item --</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-2">
                    <label class="form-label-erp">Quantity *</label>
                    <input type="number" step="0.01" id="quantity" class="form-control-erp" placeholder="0.00" style="text-align: right;" />
                </div>
                <div class="col-md-2">
                    <label class="form-label-erp">Unit</label>
                    <input type="text" id="unitName" class="form-control-erp" value="Pcs" placeholder="e.g. Kg, Pcs, Bag" />
                </div>
                <div class="col-md-8">
                    <label class="form-label-erp">Remarks / Purpose</label>
                    <input type="text" id="remarks" class="form-control-erp" placeholder="Reason for internal consumption..." />
                </div>
            </div>
        </div>

        <div class="erp-fieldset">
            <legend>Consumption Register History Log</legend>
            <div class="grid-container">
                <table class="erp-table" id="consumptionGrid">
                    <thead>
                        <tr>
                            <th style="width: 5%;">ID</th>
                            <th style="width: 10%;">Voucher No</th>
                            <th style="width: 10%;">Date</th>
                            <th style="width: 25%;">Department</th>
                            <th style="width: 30%;">Consumed Item</th>
                            <th style="width: 10%; text-align: right;">Quantity</th>
                            <th style="width: 10%;">Unit</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" data-col="0" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="1" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="2" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="3" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="4" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="5" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="6" placeholder="Filter..." /></th>
                        </tr>
                    </thead>
                    <tbody id="consumptionGridBody">
                        <tr><td colspan="7" style="text-align:center;">Loading consumption logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/vendors/select2/dist/js/select2.min.js}"></script>
    <script>
        var consumptionData = [];

        $(document).ready(function() {
            $('.select2').select2({ width: '100%' });
            var today = new Date().toISOString().split('T')[0];
            $('#voucherDate').val(today);
            loadItems();
            loadConsumptionGrid();

            $('#btnNew').click(function() { resetForm(); });
            $('#btnSave, #btnUpdate').click(function() { saveConsumption(); });
            $('#btnDelete').click(function() { deleteConsumption(); });
            $('#btnRefresh').click(function() { loadConsumptionGrid(); });

            $('.filter-row input').on('keyup change', function() {
                filterGrid();
            });
        });

        function loadItems() {
            $.get('/api/inventory/items/list', function(items) {
                var html = '<option value="">-- Select Item --</option>';
                $.each(items || [], function(i, item) {
                    html += '<option value="' + item.id + '">' + (item.itemName || '') + '</option>';
                });
                $('#itemId').html(html).trigger('change.select2');
            });
        }

        function loadConsumptionGrid() {
            $.ajax({
                url: '/api/inventory/consumption/list',
                type: 'GET',
                success: function(data) {
                    consumptionData = data || [];
                    renderGrid(consumptionData);
                },
                error: function() {
                    $('#consumptionGridBody').html('<tr><td colspan="7" style="text-align:center; color:red;">Failed to load logs.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="7" style="text-align:center;">No Consumption records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    var qty = parseFloat(item.quantity || 0);
                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td><strong>' + (item.voucherNo || '') + '</strong></td>';
                    html += '<td>' + (item.voucherDate || '') + '</td>';
                    html += '<td>' + (item.departmentName || '-') + '</td>';
                    html += '<td>' + (item.itemName || ('Item #' + item.itemId)) + '</td>';
                    html += '<td style="text-align:right; font-weight:bold;">' + qty.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>';
                    html += '<td>' + (item.unitName || 'Pcs') + '</td>';
                    html += '</tr>';
                });
            }
            $('#consumptionGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#consumptionGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = consumptionData[idx];
            if(item) {
                $('#consumptionId').val(item.id);
                $('#voucherNo').val(item.voucherNo || '');
                $('#voucherDate').val(item.voucherDate || '');
                $('#departmentName').val(item.departmentName || '');
                $('#itemId').val(item.itemId || '').trigger('change');
                $('#quantity').val(item.quantity || '');
                $('#unitName').val(item.unitName || 'Pcs');
                $('#remarks').val(item.remarks || '');
            }
        }

        function resetForm() {
            var today = new Date().toISOString().split('T')[0];
            $('#consumptionId').val('');
            $('#voucherNo').val('');
            $('#voucherDate').val(today);
            $('#departmentName').val('');
            $('#itemId').val('').trigger('change');
            $('#quantity').val('');
            $('#unitName').val('Pcs');
            $('#remarks').val('');
            $('#consumptionGridBody tr').removeClass('selected');
        }

        function saveConsumption() {
            var voucherNo = $('#voucherNo').val().trim();
            var qty = $('#quantity').val();
            if(!voucherNo) {
                alert('Please enter Voucher Number.');
                $('#voucherNo').focus();
                return;
            }
            if(!qty || parseFloat(qty) <= 0) {
                alert('Please enter a valid Quantity.');
                $('#quantity').focus();
                return;
            }

            var payload = {
                id: $('#consumptionId').val() ? parseInt($('#consumptionId').val()) : null,
                voucherNo: voucherNo,
                voucherDate: $('#voucherDate').val(),
                departmentName: $('#departmentName').val(),
                itemId: $('#itemId').val() ? parseInt($('#itemId').val()) : 0,
                quantity: parseFloat(qty),
                unitName: $('#unitName').val(),
                remarks: $('#remarks').val()
            };

            $.ajax({
                url: '/api/inventory/consumption/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Consumption record saved successfully!');
                    resetForm();
                    loadConsumptionGrid();
                },
                error: function(xhr) {
                    alert('Failed to save consumption: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }

        function deleteConsumption() {
            var id = $('#consumptionId').val();
            if(!id) {
                alert('Please select a Consumption record from grid to delete.');
                return;
            }
            if(confirm('Are you sure you want to delete record #' + id + '?')) {
                $.ajax({
                    url: '/api/inventory/consumption/' + id,
                    type: 'DELETE',
                    success: function() {
                        alert('Record deleted successfully!');
                        resetForm();
                        loadConsumptionGrid();
                    },
                    error: function(xhr) {
                        alert('Failed to delete record: ' + xhr.responseText);
                    }
                });
            }
        }

        function filterGrid() {
            var filters = [];
            $('.filter-row input').each(function() {
                filters.push({ col: $(this).data('col'), val: $(this).val().toLowerCase() });
            });

            $('#consumptionGridBody tr').each(function() {
                var row = $(this);
                var show = true;
                $.each(filters, function(i, f) {
                    if(f.val) {
                        var text = row.find('td').eq(f.col).text().toLowerCase();
                        if(text.indexOf(f.val) === -1) {
                            show = false;
                            return false;
                        }
                    }
                });
                row.toggle(show);
            });
        }
    </script>
</body>
</html>
