<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Commission Policy - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4b_definitions.css?v=20261013a}" href="/build/css/countx_inv4b_definitions.css?v=20261013a">
    <style>
        /* CustomerCommissionPolicy designer (InitializeComponent :800-1540), ClientSize 1042 x 694:
           panel2 teal 55 (tsPriceSchedule 27 + label13 (2,29)) | panel4 white 66 | panel5 fill (panel6 teal 27 "History" + grd) */
        #grdHost { height: calc(100vh - 300px); min-height: 320px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:1042px;">
    <!-- panel2 (0,0) 1042 x 55 teal -->
    <div class="fx-teal" style="height:55px;">
        <div class="fx-strip">
            <button type="button" class="fx-tool" id="BtnNew" style="width:59px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool" id="BtnRefresh" style="width:80px"><i class="fa fa-repeat"></i> <u>R</u>efresh</button>
            <button type="button" class="fx-tool" id="BtnSave" style="width:64px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
            <button type="button" class="fx-tool is-hidden" id="BtnEdit" style="width:78px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <span class="fx-sep"></span>
            <button type="button" class="fx-tool" id="btnAllocateBrandToType" style="width:244px" title="Opens AllocateBrandItemToCommissionType (not ported to the web yet)">Allocate Brand To Commission Type</button>
            <span class="fx-sep"></span>
            <button type="button" class="fx-tool" id="btnAllocateDiscountItemToType" style="width:317px" title="Opens AllocateCommissionItemToCommissionType (not ported to the web yet)">Allocate Commission Item To Commission Type</button>
            <button type="button" class="fx-tool" id="btnshortcut" style="width:126px" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
        </div>
        <span class="cap" style="left:2px;top:29px;">Customer Commission Policy</span>
    </div>
    <!-- panel4 (0,55) 1042 x 66 white -->
    <div class="fx-rel" style="height:66px;background:#fff;">
        <label class="fx-abs fx-lbl" for="dtpEffectedDate" style="left:7px;top:11px;">Effected Date</label>
        <input type="date" id="dtpEffectedDate" class="fx-abs fx-dt" style="left:102px;top:7px;width:220px;">
        <label class="fx-abs fx-lbl" for="cmbCustomer" style="left:7px;top:40px;">Customer Name</label>
        <select id="cmbCustomer" class="fx-abs fx-cmb win-combo" style="left:102px;top:34px;width:220px;"></select>

        <label class="fx-abs fx-lbl" for="CmbCommissionType" style="left:324px;top:11px;">Commission Type</label>
        <select id="CmbCommissionType" class="fx-abs fx-cmb win-combo" style="left:427px;top:5px;width:220px;"></select>
        <label class="fx-abs fx-lbl" for="CmbCommissionItem" style="left:324px;top:40px;">Commission Item</label>
        <select id="CmbCommissionItem" class="fx-abs fx-cmb win-combo" style="left:427px;top:34px;width:220px;"></select>

        <label class="fx-abs fx-lbl" for="txtCommissionPercentage" style="left:654px;top:11px;">Commission %</label>
        <input type="text" id="txtCommissionPercentage" class="fx-abs fx-txt" style="left:765px;top:7px;width:143px;" disabled inputmode="decimal">
        <label class="fx-abs fx-lbl" for="CmbIncentiveAccount" style="left:654px;top:40px;">Incentive Account</label>
        <select id="CmbIncentiveAccount" class="fx-abs fx-cmb win-combo" style="left:765px;top:34px;width:220px;"></select>

        <label class="fx-abs fx-chk" style="left:914px;top:9px;"><input type="checkbox" id="chkIsActive" checked> Is Active</label>
    </div>
    <!-- panel5: panel6 teal 27 "History" (8,3) + ctrlGrdBar1 (996,-1); grd fill -->
    <div class="fx-teal" style="height:27px;"><span class="cap" style="left:8px;top:3px;">History</span><div id="gbMount" class="fx-abs" style="left:996px;top:-1px;width:43px;height:28px;"></div></div>
    <div id="grdHost" class="fx-grid-host" data-gridbar-form="CustomerCommissionPolicy" data-gridbar-grid="grd"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}" src="/build/js/countx_store_common.js?v=20260928b"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_customer_commission_policy.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_customer_commission_policy.js?v=20261013a"></script>
</body>
</html>
