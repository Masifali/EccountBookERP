<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Warehouses - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc3545; color: white; border: 1px solid #bd2130; }
        .btn-erp-danger:hover { background-color: #c82333; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .grid-container { height: 440px; overflow-y: auto; border: 1px solid #cbd5e1; background: white; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
        .filter-row input { width: 100%; font-size: 10px; padding: 1px 4px; height: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-building-o"></i> Define Warehouse (InvenWarehouse - Inventory Management)</div>
        <div><a href="/inventory" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Inventory Dashboard</a></div>
    </div>
    
    <div class="erp-toolbar">
        <button type="button" class="btn-erp" id="btnNew"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary" id="btnSave"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="btn-erp" id="btnUpdate"><i class="fa fa-pencil"></i> Update</button>
        <button type="button" class="btn-erp btn-erp-danger" id="btnDelete"><i class="fa fa-trash"></i> Delete</button>
        <button type="button" class="btn-erp" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
    </div>

    <div style="padding: 10px;">
        <input type="hidden" id="warehouseId" value="" />

        <div class="erp-fieldset">
            <legend>Warehouse Information</legend>
            <div class="row" style="margin-bottom: 6px;">
                <div class="col-md-3">
                    <label class="form-label-erp">Warehouse Code *</label>
                    <input type="text" id="warehouseCode" class="form-control-erp" placeholder="e.g. WH-01" />
                </div>
                <div class="col-md-5">
                    <label class="form-label-erp">Warehouse Name *</label>
                    <input type="text" id="warehouseName" class="form-control-erp" placeholder="e.g. Central Storage Warehouse" />
                </div>
                <div class="col-md-4">
                    <label class="form-label-erp">Incharge / Manager Name</label>
                    <input type="text" id="inchargeName" class="form-control-erp" placeholder="Manager Name" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label-erp">Contact Phone</label>
                    <input type="text" id="phoneNo" class="form-control-erp" placeholder="Phone Number" />
                </div>
                <div class="col-md-7">
                    <label class="form-label-erp">Address / Location</label>
                    <input type="text" id="address" class="form-control-erp" placeholder="Full Location Address" />
                </div>
                <div class="col-md-2" style="display: flex; align-items: flex-end; padding-bottom: 2px;">
                    <label style="font-weight: 600; cursor: pointer;">
                        <input type="checkbox" id="warehouseStatus" checked="checked" /> Active Warehouse
                    </label>
                </div>
            </div>
        </div>

        <div class="erp-fieldset">
            <legend>Warehouses Master Records</legend>
            <div class="grid-container">
                <table class="erp-table" id="whGrid">
                    <thead>
                        <tr>
                            <th style="width: 8%;">ID</th>
                            <th style="width: 15%;">WH Code</th>
                            <th style="width: 32%;">Warehouse Name</th>
                            <th style="width: 20%;">Manager</th>
                            <th style="width: 15%;">Phone</th>
                            <th style="width: 10%; text-align: center;">Status</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" data-col="0" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="1" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="2" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="3" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="4" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="5" placeholder="Filter..." /></th>
                        </tr>
                    </thead>
                    <tbody id="whGridBody">
                        <tr><td colspan="6" style="text-align:center;">Loading warehouses...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        var whData = [];

        $(document).ready(function() {
            loadWhGrid();

            $('#btnNew').click(function() { resetForm(); });
            $('#btnSave, #btnUpdate').click(function() { saveWh(); });
            $('#btnDelete').click(function() { deleteWh(); });
            $('#btnRefresh').click(function() { loadWhGrid(); });

            $('.filter-row input').on('keyup change', function() {
                filterGrid();
            });
        });

        function loadWhGrid() {
            $.ajax({
                url: '/api/inventory/warehouses/list',
                type: 'GET',
                success: function(data) {
                    whData = data || [];
                    renderGrid(whData);
                },
                error: function() {
                    $('#whGridBody').html('<tr><td colspan="6" style="text-align:center; color:red;">Failed to load warehouses.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="6" style="text-align:center;">No Warehouse records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td>' + (item.warehouseCode || '') + '</td>';
                    html += '<td><strong>' + (item.warehouseName || '') + '</strong></td>';
                    html += '<td>' + (item.inchargeName || '-') + '</td>';
                    html += '<td>' + (item.phoneNo || '-') + '</td>';
                    html += '<td style="text-align:center;">' + (item.warehouseStatus !== false ? '<span class="label label-success">Active</span>' : '<span class="label label-default">Inactive</span>') + '</td>';
                    html += '</tr>';
                });
            }
            $('#whGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#whGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = whData[idx];
            if(item) {
                $('#warehouseId').val(item.id);
                $('#warehouseCode').val(item.warehouseCode || '');
                $('#warehouseName').val(item.warehouseName || '');
                $('#inchargeName').val(item.inchargeName || '');
                $('#phoneNo').val(item.phoneNo || '');
                $('#address').val(item.address || '');
                $('#warehouseStatus').prop('checked', item.warehouseStatus !== false);
            }
        }

        function resetForm() {
            $('#warehouseId').val('');
            $('#warehouseCode').val('');
            $('#warehouseName').val('');
            $('#inchargeName').val('');
            $('#phoneNo').val('');
            $('#address').val('');
            $('#warehouseStatus').prop('checked', true);
            $('#whGridBody tr').removeClass('selected');
        }

        function saveWh() {
            var name = $('#warehouseName').val().trim();
            if(!name) {
                alert('Please enter Warehouse Name.');
                $('#warehouseName').focus();
                return;
            }

            var payload = {
                id: $('#warehouseId').val() ? parseInt($('#warehouseId').val()) : null,
                warehouseCode: $('#warehouseCode').val(),
                warehouseName: name,
                inchargeName: $('#inchargeName').val(),
                phoneNo: $('#phoneNo').val(),
                address: $('#address').val(),
                warehouseStatus: $('#warehouseStatus').is(':checked')
            };

            $.ajax({
                url: '/api/inventory/warehouses/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Warehouse saved successfully!');
                    resetForm();
                    loadWhGrid();
                },
                error: function(xhr) {
                    alert('Failed to save Warehouse: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }

        function deleteWh() {
            var id = $('#warehouseId').val();
            if(!id) {
                alert('Please select a Warehouse from grid to delete.');
                return;
            }
            if(confirm('Are you sure you want to delete Warehouse #' + id + '?')) {
                $.ajax({
                    url: '/api/inventory/warehouses/' + id,
                    type: 'DELETE',
                    success: function() {
                        alert('Warehouse deleted successfully!');
                        resetForm();
                        loadWhGrid();
                    },
                    error: function(xhr) {
                        alert('Failed to delete warehouse: ' + xhr.responseText);
                    }
                });
            }
        }

        function filterGrid() {
            var filters = [];
            $('.filter-row input').each(function() {
                filters.push({ col: $(this).data('col'), val: $(this).val().toLowerCase() });
            });

            $('#whGridBody tr').each(function() {
                var row = $(this);
                var show = true;
                $.each(filters, function(i, f) {
                    if(f.val) {
                        var text = row.find('td').eq(f.col).text().toLowerCase();
                        if(text.indexOf(f.val) === -1) {
                            show = false;
                            return false;
                        }
                    }
                });
                row.toggle(show);
            });
        }
    </script>
</body>
</html>
