<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Item - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc2626; color: white; border: 1px solid #991b1b; }
        .btn-erp-danger:hover { background-color: #991b1b; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .form-control-erp:focus { border-color: #00796B; outline: none; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-cube"></i> <span th:text="${item != null and item.id != null and item.id > 0} ? 'Edit Item Master' : 'Define Item Master'"></span></div>
        <div><a href="/inventory/items" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Items List</a></div>
    </div>
    <div class="erp-toolbar">
        <a href="/inventory/items/add" class="btn-erp"><i class="fa fa-file-o"></i> New (Ctrl+N)</a>
        <button type="button" class="btn-erp btn-erp-primary" onclick="submitForm()"><i class="fa fa-save"></i> Save (Ctrl+S)</button>
        <a href="/inventory/items" class="btn-erp"><i class="fa fa-list"></i> Items List</a>
        <button type="button" class="btn-erp" onclick="location.reload()"><i class="fa fa-refresh"></i> Refresh</button>
    </div>
    <div style="padding: 10px;">
        <form th:action="@{/inventory/items/save}" th:object="${item}" method="post" id="itemForm">
            <input type="hidden" th:field="*{id}"/>

            <div class="erp-fieldset">
                <legend>Identification & Basic Info</legend>
                <div class="row">
                    <div class="col-md-2">
                        <label class="form-label-erp">Item Code</label>
                        <input type="text" class="form-control-erp" th:field="*{itemCode}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">Item Name / Title *</label>
                        <input type="text" class="form-control-erp" th:field="*{itemName}" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Alias Name</label>
                        <input type="text" class="form-control-erp" th:field="*{itemAliasName}"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Name (Other Lingo)</label>
                        <input type="text" class="form-control-erp" th:field="*{itemNameOtherLingo}"/>
                    </div>
                </div>
                <div class="row" style="margin-top:6px;">
                    <div class="col-md-2">
                        <label class="form-label-erp">HS Code</label>
                        <input type="text" class="form-control-erp" th:field="*{hSCode}"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Barcode No</label>
                        <input type="text" class="form-control-erp" th:field="*{barcodeNo}"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Product No</label>
                        <input type="text" class="form-control-erp" th:field="*{productNo}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">Model Name</label>
                        <input type="text" class="form-control-erp" th:field="*{modelName}"/>
                    </div>
                </div>
                <div class="row" style="margin-top:6px;">
                    <div class="col-md-12">
                        <label class="form-label-erp">Specification</label>
                        <input type="text" class="form-control-erp" th:field="*{itemSpecification}"/>
                    </div>
                </div>
            </div>

            <div class="erp-fieldset">
                <legend>Classification & Racks</legend>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label-erp">Item Category</label>
                        <select class="form-control-erp" th:field="*{itemCategory.id}">
                            <option value="0">— Select Category —</option>
                            <option th:each="c : ${itemCategories}" th:value="${c.id}" th:text="${c.categoryCode} + ' - ' + ${c.categoryDescription}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">Item Type</label>
                        <select class="form-control-erp" th:field="*{itemType.id}">
                            <option value="0">— Select Type —</option>
                            <option th:each="t : ${itemTypes}" th:value="${t.id}" th:text="${t.typeCode} + ' - ' + ${t.typeDescription}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">Rack Location</label>
                        <select class="form-control-erp" th:field="*{rack.id}">
                            <option value="0">— Select Rack —</option>
                            <option th:each="r : ${racks}" th:value="${r.id}" th:text="${r.rackName}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="erp-fieldset">
                <legend>Pricing & Rates</legend>
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label-erp">Cost Price</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{costPrice}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Purchase Price</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{purchasePrice}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Retail Price</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{retailPrice}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Wholesale Price</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{wholeSalePrice}" style="text-align:right;"/>
                    </div>
                </div>
                <div class="row" style="margin-top:6px;">
                    <div class="col-md-3">
                        <label class="form-label-erp">Min Rate</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{minRate}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Max Rate</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{maxRate}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Min Stock Level</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{minStockLevel}" style="text-align:right;"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Max Stock Level</label>
                        <input type="number" step="any" class="form-control-erp" th:field="*{maxStockLevel}" style="text-align:right;"/>
                    </div>
                </div>
            </div>

            <div class="erp-fieldset">
                <legend>GL Accounts & Taxes</legend>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label-erp">Purchase GL Account ID</label>
                        <input type="number" class="form-control-erp" th:field="*{purchaseGLAC}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">Sale GL Account ID</label>
                        <input type="number" class="form-control-erp" th:field="*{saleGLAC}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-erp">COGS GL Account ID</label>
                        <input type="number" class="form-control-erp" th:field="*{cOGSGLAC}"/>
                    </div>
                </div>
                <div class="row" style="margin-top:6px;">
                    <div class="col-md-3">
                        <label style="font-weight:600; cursor:pointer;"><input type="checkbox" th:field="*{applyGST}"/> Apply GST</label>
                    </div>
                    <div class="col-md-3">
                        <label style="font-weight:600; cursor:pointer;"><input type="checkbox" th:field="*{applyVAT}"/> Apply VAT</label>
                    </div>
                    <div class="col-md-3">
                        <label style="font-weight:600; cursor:pointer;"><input type="checkbox" th:field="*{isTaxable}"/> Taxable</label>
                    </div>
                    <div class="col-md-3">
                        <label style="font-weight:600; cursor:pointer;"><input type="checkbox" th:field="*{itemStatus}"/> Active Item</label>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        function submitForm() {
            if (!$('#itemName').val()) { alert('Please enter Item Name.'); return; }
            $('#itemForm').submit();
        }
        $(document).keydown(function(e) {
            if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); window.location.href='/inventory/items/add'; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); submitForm(); }
        });
    </script>
</body>
</html>
