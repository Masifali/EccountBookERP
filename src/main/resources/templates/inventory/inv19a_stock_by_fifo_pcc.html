<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock By FiFo - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv19a_reports.css?v=20261013a}" href="/build/css/countx_inv19a_reports.css?v=20261013a">
    <style>
        /* StockReportByFifo (Pcc.Reports) designer geometry (InitializeComponent :545-1230), 1:1 px, 964 wide:
           panel2 toolStrip1 (27) | panel3 (126: panel5 teal 24 "Stock By FiFo", groupBox1 "Filters" at 4,24 947x98) | panel4: panel6 teal 25 "History" + ctrlGrdBar1 (906,0), grdfrm (Fill). */
        .sbf-grid { height: calc(100vh - 300px); min-height: 300px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:964px;">
    <!-- toolStrip1: btnNew "&New", btnRefresh "Refresh", btnPrint "1887-Print", btnshortcut "ShortCut Keys" -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnNew" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="fx-tool" id="btnRefresh" title="Ctrl+R"><i class="fa fa-repeat"></i> <span>Refresh</span></button>
        <button type="button" class="fx-tool" id="btnPrint" title="Ctrl+P"><i class="fa fa-print"></i> <span>1887-Print</span></button>
        <button type="button" class="fx-tool" id="btnshortcut" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <!-- panel3 (126) -->
    <div class="fx-rel" style="height:126px;">
        <div class="fx-abs" style="left:0;top:0;width:964px;height:24px;background:#008080;">
            <span class="fx-abs fx-title" style="left:2px;top:2px;">Stock By FiFo</span>
        </div>
        <fieldset class="fx-abs fx-grp" style="left:4px;top:24px;width:947px;height:98px;">
            <legend>Filters</legend>
            <label class="fx-abs fx-lbl" style="left:6px;top:18px;" for="txtDateFrom">Doc Date</label>
            <input type="date" id="txtDateFrom" class="fx-abs fx-dt" style="left:80px;top:14px;width:209px;">
            <label class="fx-abs fx-lbl" style="left:6px;top:46px;" for="cmbWareHouse">WareHouse</label>
            <select id="cmbWareHouse" class="fx-abs fx-cmb win-combo" style="left:80px;top:40px;width:209px;"></select>
            <label class="fx-abs fx-lbl" style="left:293px;top:18px;" for="cmbItem">Item Name</label>
            <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:364px;top:12px;width:210px;"></select>
            <label class="fx-abs fx-lbl" style="left:293px;top:46px;" for="cmbJobLot">JobLot</label>
            <select id="cmbJobLot" class="fx-abs fx-cmb win-combo" style="left:364px;top:40px;width:210px;"></select>
            <label class="fx-abs fx-lbl" style="left:586px;top:18px;" for="cmbPackUom">Varient</label>
            <select id="cmbPackUom" class="fx-abs fx-cmb win-combo" style="left:668px;top:12px;width:221px;"></select>
            <button type="button" id="btnshow" class="fx-abs fx-btn teal" style="left:834px;top:39px;width:55px;height:26px;" title="Ctrl+S">Show</button>
        </fieldset>
    </div>
    <!-- panel6 (25, Teal): label2 "History", ctrlGrdBar1 -->
    <div class="fx-rel" style="height:25px;background:#008080;">
        <span class="fx-abs fx-title" style="left:2px;top:2px;">History</span>
        <div id="gbMount" class="fx-abs" style="left:906px;top:0;width:45px;height:23px;"></div>
    </div>
    <div class="fx-grid-host sbf-grid" data-gridbar-form="StockReportByFifo" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inv19a_common.js?v=20261013a}" src="/build/js/countx_inv19a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv19a_stock_by_fifo_pcc.js?v=20261013a}" src="/build/js/countx_inventory_inv19a_stock_by_fifo_pcc.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
