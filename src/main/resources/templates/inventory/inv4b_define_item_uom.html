<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Define Item UOM - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4b_definitions.css?v=20261013a}" href="/build/css/countx_inv4b_definitions.css?v=20261013a">
    <style>
        /* InvDeffrmItemItemUom designer (InitializeComponent :422-736), ClientSize 484 x 461:
           tsItemUOM 27 | panel15 teal 29 "Item UOM" (8,6) | panel1 white 68 | panel2 teal 27 (ctrlGrdBar1 at 437,0) | grdfrm fill */
        #grdHost { height: calc(100vh - 290px); min-height: 310px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:484px;">
    <!-- tsItemUOM: btnnew, btnupdate, btnsave -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnnew" style="width:59px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
        <button type="button" class="fx-tool is-hidden" id="btnupdate" style="width:78px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
        <button type="button" class="fx-tool" id="btnsave" style="width:64px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
    </div>
    <!-- panel15 (0,27) 484 x 29 teal; label54 (8,6) -->
    <div class="fx-teal" style="height:29px;"><span class="cap" style="left:8px;top:6px;">Item UOM</span></div>
    <!-- panel1 (0,56) 484 x 68 white -->
    <div class="fx-rel" style="height:68px;background:#fff;">
        <label class="fx-abs fx-lbl" for="txtItemUOMCode" style="left:5px;top:12px;">Uom Code</label>
        <input type="text" id="txtItemUOMCode" class="fx-abs fx-txt" style="left:68px;top:8px;width:140px;" maxlength="20">
        <label class="fx-abs fx-lbl" for="txtEquivalent" style="left:5px;top:39px;">Equivalent</label>
        <input type="text" id="txtEquivalent" class="fx-abs fx-txt" style="left:68px;top:35px;width:140px;" inputmode="decimal">
        <label class="fx-abs fx-lbl" for="txtQtyEquivalent" style="left:212px;top:12px;">Qty Equivalent</label>
        <input type="text" id="txtQtyEquivalent" class="fx-abs fx-txt" style="left:295px;top:8px;width:120px;" inputmode="decimal">
        <label class="fx-abs fx-lbl" for="CmbParentUOM" style="left:212px;top:39px;">Parent UOM</label>
        <select id="CmbParentUOM" class="fx-abs fx-cmb win-combo" style="left:295px;top:33px;width:120px;"></select>
        <label class="fx-abs fx-chk" style="left:417px;top:37px;"><input type="checkbox" id="chkstatus" checked> Active</label>
    </div>
    <!-- panel2 (0,124) 484 x 27 teal: ctrlGrdBar1 (437,0) -->
    <div class="fx-teal" style="height:27px;"><div id="gbMount" class="fx-abs" style="left:437px;top:0;width:43px;height:27px;"></div></div>
    <!-- grdfrm (0,151) fill -->
    <div id="grdHost" class="fx-grid-host" data-gridbar-form="InvDeffrmItemItemUom" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}" src="/build/js/countx_store_common.js?v=20260928b"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_define_item_uom.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_define_item_uom.js?v=20261013a"></script>
</body>
</html>
