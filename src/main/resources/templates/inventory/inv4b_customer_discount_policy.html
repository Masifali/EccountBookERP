<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Discount Policy - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4b_definitions.css?v=20261013a}" href="/build/css/countx_inv4b_definitions.css?v=20261013a">
    <style>
        /* CustomerDiscountPolicy designer (InitializeComponent :621-1240), ClientSize 1042 x 694:
           panel2 34 (tsPriceSchedule at 1,4) | panel3 teal 27 "Customer Discount Policy" | panel4 white 92 | panel5 fill (panel6 teal 27 "History" + grd) */
        #grdHost { height: calc(100vh - 330px); min-height: 300px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:1042px;">
    <!-- panel2 (0,0) 1042 x 34: tsPriceSchedule BtnNew, BtnEdit, BtnSave | Allocate Brand | Allocate Discount Item -->
    <div class="fx-rel" style="height:34px;background:#fff;border-bottom:1px solid #b5b5b5;">
        <div class="fx-strip fx-abs" style="left:1px;top:4px;height:27px;border:0;">
            <button type="button" class="fx-tool" id="BtnNew" style="width:55px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
            <button type="button" class="fx-tool is-hidden" id="BtnEdit" style="width:69px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
            <button type="button" class="fx-tool" id="BtnSave" style="width:55px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
            <span class="fx-sep"></span>
            <button type="button" class="fx-tool" id="btnAllocateBrandToType" style="width:180px" title="Opens InvAllocateBrandItemToDiscType (not ported to the web yet)">Allocate Brand To Discount Type</button>
            <span class="fx-sep"></span>
            <button type="button" class="fx-tool" id="btnAllocateDiscountItemToType" style="width:223px" title="Opens InvAllocateDiscItemToDiscType (not ported to the web yet)">Allocate Discount Item To Discount Type</button>
        </div>
    </div>
    <!-- panel3 (0,34) 1042 x 27 teal; label13 (8,3) -->
    <div class="fx-teal" style="height:27px;"><span class="cap" style="left:8px;top:3px;">Customer Discount Policy</span></div>
    <!-- panel4 (0,61) 1042 x 92 white -->
    <div class="fx-rel" style="height:92px;background:#fff;">
        <label class="fx-abs fx-lbl" for="dtpEffectedDate" style="left:9px;top:12px;">Effected Date</label>
        <input type="date" id="dtpEffectedDate" class="fx-abs fx-dt" style="left:98px;top:9px;width:220px;">
        <label class="fx-abs fx-lbl" for="cmbDiscountType" style="left:9px;top:39px;">Discount Type</label>
        <select id="cmbDiscountType" class="fx-abs fx-cmb win-combo" style="left:98px;top:35px;width:220px;"></select>
        <label class="fx-abs fx-lbl" for="txtDiscountPercentage" style="left:9px;top:67px;">Discount %</label>
        <input type="text" id="txtDiscountPercentage" class="fx-abs fx-txt" style="left:98px;top:64px;width:220px;" disabled inputmode="decimal">

        <label class="fx-abs fx-lbl" for="cmbCustomer" style="left:341px;top:12px;">Customer Name</label>
        <select id="cmbCustomer" class="fx-abs fx-cmb win-combo" style="left:435px;top:8px;width:220px;"></select>
        <label class="fx-abs fx-lbl" for="cmbDiscItem" style="left:341px;top:39px;">Discount Item</label>
        <select id="cmbDiscItem" class="fx-abs fx-cmb win-combo" style="left:435px;top:35px;width:220px;"></select>
        <label class="fx-abs fx-chk" style="left:344px;top:67px;"><input type="checkbox" id="chkIsActive" checked> Is Active</label>
    </div>
    <!-- panel5 (0,153): panel6 teal 27 "History" (8,3) + ctrlGrdBar1 (996,-1); grd fill -->
    <div class="fx-teal" style="height:27px;"><span class="cap" style="left:8px;top:3px;">History</span><div id="gbMount" class="fx-abs" style="left:996px;top:-1px;width:43px;height:28px;"></div></div>
    <div id="grdHost" class="fx-grid-host" data-gridbar-form="CustomerDiscountPolicy" data-gridbar-grid="grd"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}" src="/build/js/countx_store_common.js?v=20260928b"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_customer_discount_policy.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_customer_discount_policy.js?v=20261013a"></script>
</body>
</html>
