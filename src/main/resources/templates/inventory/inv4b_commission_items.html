<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commission Items - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv4b_definitions.css?v=20261013a}" href="/build/css/countx_inv4b_definitions.css?v=20261013a">
    <style>
        /* CommissionItems designer (InitializeComponent :510-760), ClientSize 503 x 624:
           tsItemTaxSchedule 27 | panel7 teal 28 "Commission Items" | panel4 white 123 | panel1 fill (panel2 teal 28 "History" + grdfrm) */
        #grdHost { height: calc(100vh - 330px); min-height: 300px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:503px;">
    <!-- tsItemTaxSchedule: btnnew, btnupdate, btnsave, btnshortcut -->
    <div class="fx-strip">
        <button type="button" class="fx-tool" id="btnnew" style="width:60px" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <u>N</u>ew</button>
        <button type="button" class="fx-tool is-hidden" id="btnupdate" style="width:79px" title="Ctrl+U"><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
        <button type="button" class="fx-tool" id="btnsave" style="width:65px" title="Ctrl+S"><i class="fa fa-save"></i> <u>S</u>ave</button>
        <button type="button" class="fx-tool" id="btnshortcut" style="width:127px" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    </div>
    <!-- panel7 (0,27) 503 x 28 teal; label43 (4,5) -->
    <div class="fx-teal" style="height:28px;"><span class="cap" style="left:4px;top:5px;">Commission Items</span></div>
    <!-- panel4 (0,55) 503 x 123 white -->
    <div class="fx-rel" style="height:123px;background:#fff;">
        <label class="fx-abs fx-lbl" for="txtcode" style="left:28px;top:25px;">Commission Item Name</label>
        <input type="text" id="txtcode" class="fx-abs fx-txt" style="left:167px;top:21px;width:251px;" maxlength="500">
        <label class="fx-abs fx-lbl" for="txtDescription" style="left:28px;top:51px;">Percentage %</label>
        <input type="text" id="txtDescription" class="fx-abs fx-txt" style="left:167px;top:47px;width:251px;" inputmode="decimal">
        <label class="fx-abs fx-chk" style="left:167px;top:76px;"><input type="checkbox" id="ChkIsActive" checked> Is Active</label>
        <button type="button" id="BtnCancel" class="fx-abs fx-btn" style="left:264px;top:76px;width:75px;height:28px;">Cancel</button>
        <button type="button" id="BtnSavef" class="fx-abs fx-btn" style="left:343px;top:76px;width:75px;height:28px;font-family:Tahoma,sans-serif;">Save</button>
        <button type="button" id="btnUpdateF" class="fx-abs fx-btn is-hidden" style="left:344px;top:76px;width:75px;height:28px;">Update</button>
    </div>
    <!-- panel1 (0,178) fill: panel2 teal 28 "History" (4,4) + ctrlGrdBar1 (456,0) 43x27; grdfrm fill -->
    <div class="fx-teal" style="height:28px;"><span class="cap" style="left:4px;top:4px;">History</span><div id="gbMount" class="fx-abs" style="left:456px;top:0;width:43px;height:27px;"></div></div>
    <div id="grdHost" class="fx-grid-host" data-gridbar-form="CommissionItems" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}" src="/build/js/countx_store_common.js?v=20260928b"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_common.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv4b_commission_items.js?v=20261013a}" src="/build/js/countx_inventory_inv4b_commission_items.js?v=20261013a"></script>
</body>
</html>
