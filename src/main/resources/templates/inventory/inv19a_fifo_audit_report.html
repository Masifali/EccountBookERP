<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FIFO Audit Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}" href="/build/css/countx_grid_bar.css?v=20261007-gridbar-flow">
    <link rel="stylesheet" th:href="@{/build/css/countx_inv19a_reports.css?v=20261013a}" href="/build/css/countx_inv19a_reports.css?v=20261013a">
    <style>
        /* frmFiFoAuditReport designer geometry (InitializeComponent :301-434), 1:1 px, 964 wide:
           panel1 toolStrip1 (30) | panel4 teal title (29, ctrlGrdBar1 at 914,2) | panel6 grdfrm (Fill). */
        .fifo-grid { height: calc(100vh - 200px); min-height: 400px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="fx-scroll">
<div class="fx-root" style="width:964px;">
    <!-- toolStrip1: btnRefresh "&New" (btnNew_Click), BtnPrintRegister "Print-390" -->
    <div class="fx-strip" style="height:30px;">
        <button type="button" class="fx-tool" id="btnRefresh" title="Ctrl+N"><i class="fa fa-plus-circle" style="color:#2e9b45"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="fx-tool" id="BtnPrintRegister" title="Ctrl+P"><i class="fa fa-print"></i> <span>Print-390</span></button>
    </div>
    <!-- panel4 (29, Teal) -->
    <div class="fx-rel" style="height:29px;background:#008080;">
        <span class="fx-abs fx-title" style="left:5px;top:4px;">FIFO Audit Report</span>
        <div id="gbMount" class="fx-abs" style="left:914px;top:2px;width:45px;height:24px;"></div>
    </div>
    <div class="fx-grid-host fifo-grid" data-gridbar-form="frmFiFoAuditReport" data-gridbar-grid="grdfrm"
         data-gridbar-mount="#gbMount" data-gridbar-reorder="false" data-gridbar-hide="chooser,save,remove,collapse,expand">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="fx-nav" id="lblNavigator"></div>
</div>
</div>
<script th:src="@{/build/js/countx_store_common.js?v=20260928b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script th:src="@{/build/js/countx_inv19a_common.js?v=20261013a}" src="/build/js/countx_inv19a_common.js?v=20261013a"></script>
<script th:src="@{/build/js/countx_inventory_inv19a_fifo_audit_report.js?v=20261013a}" src="/build/js/countx_inventory_inv19a_fifo_audit_report.js?v=20261013a"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
