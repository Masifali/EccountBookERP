<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Import Invoice - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_imports_impb.css?v=20260930a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- Architecture.WinApp.Import.frmImportInvoice (783) - ClientSize 1060 x 711, KeyPreview.
     tabPage1 "Form": toolStrip4 New | Refresh | Save | Update (hidden) | Attachment | Print-902 | ShortCut Keys; panel10 "Import Invoice", Branch
     (feature 11 only), Preview (checked); HeaderGropBox "Main Header" (Doc No, Status | Importer, Exporter, Sales Person, Consignee, Performa No,Date,
     Contract No,Date, Invoice No,Date (each with a define button), Importer Reference # | Income Term, Payment Term, Currency Code, Exchange Rate,
     Invoice Value, No.Of Packages, Total Containers, Net MTon's, Gross MTon's | Importer Bank, Exporter Bank, Loading Port, Destination Port,
     B.L No,Date, G.D No,Date, G.D Value, Debit A/c (FinancialisActiveonCommercialInvoice), Import Company (feature 9)); tabControl2 "Invoice Detail",
     "Other Items", "Payment Detail". tabPage2 "History": Filters + DataGridHistory (Edit / Slip by right) + detail grid. -->
<body class="pd-body hrm-body" data-screen="783">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs" data-tabs="tc1">
        <button type="button" class="hrm-tab is-active" data-tab="tabPage1">Form</button>
        <button type="button" class="hrm-tab" data-tab="tabPage2">History</button>
    </div>
    <div class="hrm-tab-page is-active" id="tabPage1" data-tabs-page="tc1">
        <div class="win-tool-strip">
            <button type="button" id="btnNew" class="win-btn-tool" onclick="ImpBInvoice.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ImpBInvoice.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="ImpBInvoice.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="ImpBInvoice.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" onclick="ImpBInvoice.btnAttachment(this)"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="btnPrint" class="win-btn-tool" onclick="ImpBInvoice.btnPrint(this)"><i class="fa fa-print"></i> <span>Print-902</span></button>
            <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ImpBInvoice.btnShortCutKey(this)"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="impb-caption-row"><span class="impb-title">Import Invoice</span>
            <span class="hrm-inline is-hidden" id="boxBranch"><span class="hrm-lbl" id="labelBranchName">Branch</span><span style="min-width:180px"><select id="CmbBranchName" class="win-combo dtcombo" data-dtcombo="single"></select></span></span>
            <span class="impb-right"><label class="hrm-check"><input type="checkbox" id="ChkPrintPreview" checked> Preview</label></span></div>
        <fieldset class="hrm-group">
            <legend>Main Header</legend>
            <div class="hrm-entry hrm-cols-3" style="padding:4px 2px;align-items:start">
                <div class="hrm-entry" style="grid-template-columns:1fr;padding:0">
                    <div class="hrm-field"><label class="hrm-req" for="txtDocNo">Doc No</label>
                        <div class="impb-pair"><input type="text" id="txtDocNo" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off">
                            <select id="cmbStatus" class="win-combo dtcombo" data-dtcombo="single" disabled title="Status"></select></div></div>
                    <div class="hrm-field"><label class="hrm-req" for="CmbImporterName">Importer</label><select id="CmbImporterName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="CmbExporterName">Exporter</label><select id="CmbExporterName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="CmbSalesPerson">Sales Person</label><select id="CmbSalesPerson" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="cmbConsignee">Consignee</label><select id="cmbConsignee" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="CmbPerformaNo">Performa No,Date</label>
                        <div class="impb-pair"><select id="CmbPerformaNo" class="win-combo dtcombo" data-dtcombo="single"></select><input type="date" id="txtPerformaDate" class="win-textbox" disabled>
                            <button type="button" id="BtnDefinePerformaNo" class="win-btn-action impb-btn-sq" title="Define Proforma No" onclick="ImpBInvoice.BtnDefinePerformaNo(this)"><i class="fa fa-plus"></i></button></div></div>
                    <div class="hrm-field"><label class="hrm-req" for="CmbContractNo">Contract No,Date</label>
                        <div class="impb-pair"><select id="CmbContractNo" class="win-combo dtcombo" data-dtcombo="single"></select><input type="date" id="txtContractDate" class="win-textbox" disabled>
                            <button type="button" id="BtnDefineContractNo" class="win-btn-action impb-btn-sq" title="Define Contract No" onclick="ImpBInvoice.BtnDefineContractNo(this)"><i class="fa fa-plus"></i></button></div></div>
                    <div class="hrm-field"><label class="hrm-req" for="cmbInvoiceNo">Invoice No,Date</label>
                        <div class="impb-pair"><select id="cmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single"></select><input type="date" id="txtInvoiceDate" class="win-textbox" disabled>
                            <button type="button" id="BtnDefineInvoiceNo" class="win-btn-action impb-btn-sq" title="Define Invoice No" onclick="ImpBInvoice.BtnDefineInvoiceNo(this)"><i class="fa fa-plus"></i></button></div></div>
                    <div class="hrm-field"><label for="txtLotRef">Importer Reference #</label><input type="text" id="txtLotRef" class="win-textbox" autocomplete="off"></div>
                </div>
                <div class="hrm-entry" style="grid-template-columns:1fr;padding:0">
                    <div class="hrm-field"><label for="CmbIncomeTerm">Income Term</label><select id="CmbIncomeTerm" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="CmbPaymentTermsNew">Payment Term</label><select id="CmbPaymentTermsNew" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="CmbFcyCode">Currency Code</label><select id="CmbFcyCode" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="txtExRate">Exchange Rate</label><input type="text" id="txtExRate" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                    <div class="hrm-field"><label class="hrm-req" for="txtfcyAmountHeader">Invoice Value</label><input type="text" id="txtfcyAmountHeader" class="win-textbox hrm-al-right" value="0" readonly></div>
                    <div class="hrm-field"><label for="txtNoOfPackagesHeader">No.Of Packages</label><input type="text" id="txtNoOfPackagesHeader" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                    <div class="hrm-field"><label class="hrm-req" for="txtNoOfContainerHeader">Total Containers</label><input type="text" id="txtNoOfContainerHeader" class="win-textbox hrm-al-right" value="0" data-guard="integer" inputmode="numeric" autocomplete="off"></div>
                    <div class="hrm-field"><label class="hrm-req" for="txtNetWeightHeader">Net MTon's</label><input type="text" id="txtNetWeightHeader" class="win-textbox hrm-al-right" value="0" readonly></div>
                    <div class="hrm-field"><label class="hrm-req" for="txtGrossWeightHeader">Gross MTon's</label><input type="text" id="txtGrossWeightHeader" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                </div>
                <div class="hrm-entry" style="grid-template-columns:1fr;padding:0">
                    <div class="hrm-field"><label for="cmbimporterBankNew">Importer Bank</label><select id="cmbimporterBankNew" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="cmbexporterBankNew">Exporter Bank</label><select id="cmbexporterBankNew" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="cmbLoadingPort">Loading Port</label><select id="cmbLoadingPort" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label class="hrm-req" for="cmbDestinationPort">Destination Port</label><select id="cmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field"><label for="txtBLNo">B.L No,Date</label><div class="impb-pair"><input type="text" id="txtBLNo" class="win-textbox" autocomplete="off"><input type="date" id="txtBlDate" class="win-textbox"></div></div>
                    <div class="hrm-field"><label for="txtGdNo">G.D No,Date</label><div class="impb-pair"><input type="text" id="txtGdNo" class="win-textbox" autocomplete="off"><input type="date" id="txtGdDate" class="win-textbox"></div></div>
                    <div class="hrm-field"><label for="txtGdValue">G.D Value</label><input type="text" id="txtGdValue" class="win-textbox hrm-al-right" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                    <div class="hrm-field is-hidden" id="boxDebit"><label for="CmbDabitAccount" id="lblCreditAc">Debit A/c</label><select id="CmbDabitAccount" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-field is-hidden" id="boxCompany"><label class="hrm-req" for="CmbImportCompany" id="labelExportCompany">Import Company</label><select id="CmbImportCompany" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                </div>
            </div>
        </fieldset>
        <div class="hrm-tabs" data-tabs="tc2">
            <button type="button" class="hrm-tab is-active" data-tab="tabPage3">Invoice Detail</button>
            <button type="button" class="hrm-tab" data-tab="tabPage4">Other Items</button>
            <button type="button" class="hrm-tab" data-tab="tabPage5">Payment Detail</button>
        </div>
        <div class="hrm-tab-page is-active" id="tabPage3" data-tabs-page="tc2">
            <div class="hrm-entry hrm-cols-4">
                <div class="hrm-field hrm-stack"><label for="CmbItemName">Item Name</label><select id="CmbItemName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtitemDescription">Item Detail</label><input type="text" id="txtitemDescription" class="win-textbox" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobLot">Lot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtQtyMTon">Qty/M.Ton</label><input type="text" id="txtQtyMTon" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="CmbPackUom">Pack Size</label><select id="CmbPackUom" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtNoOfBags">Qty</label><input type="text" id="txtNoOfBags" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="txtWeightDetail">Weight(kg)</label><input type="text" id="txtWeightDetail" class="win-textbox hrm-al-right" value="0" readonly></div>
                <div class="hrm-field hrm-stack"><label for="txtCostMTon">Rate/M.Ton</label><input type="text" id="txtCostMTon" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="CmbRateUom">Rate UOM</label><select id="CmbRateUom" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtAmount">Amount</label><input type="text" id="txtAmount" class="win-textbox hrm-al-right" value="0" readonly></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label for="txtRemarksDetail">Remarks</label>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><input type="text" id="txtRemarksDetail" class="win-textbox hrm-grow" autocomplete="off">
                        <button type="button" id="btnAddinGrid" class="win-btn-action" style="min-width:34px;width:34px" onclick="ImpBInvoice.btnAddinGrid(this)">+</button>
                        <button type="button" id="btnGridUpdate" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btnGridUpdate(this)">Update</button>
                        <button type="button" id="btnCancel" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btnCancel(this)">Cancel</button></div></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="ImportInvoice:grdDetail" id="grdDetail"></table></div>
            </div>
        </div>
        <div class="hrm-tab-page" id="tabPage4" data-tabs-page="tc2">
            <div class="hrm-entry hrm-cols-4">
                <div class="hrm-field hrm-stack"><label for="CmbItemOtherItem">Item Name</label><select id="CmbItemOtherItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtQtyOtherItem">Qty</label><input type="text" id="txtQtyOtherItem" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="txtRateOtherItem">Rate</label><input type="text" id="txtRateOtherItem" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="txtAmountOtherItem">Amount</label><input type="text" id="txtAmountOtherItem" class="win-textbox hrm-al-right" value="0" readonly></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label for="txtRemarksOtherItem">Remarks</label>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><input type="text" id="txtRemarksOtherItem" class="win-textbox hrm-grow" autocomplete="off">
                        <button type="button" id="BtnAddOtherItem" class="win-btn-action" style="min-width:34px;width:34px" onclick="ImpBInvoice.btnoadd(this)">+</button>
                        <button type="button" id="BtnUpdateOtherItem" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btnoUpdate(this)">Update</button>
                        <button type="button" id="BtnCancelOtherItem" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btnoCancel(this)">Cancel</button></div></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Other Items</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="ImportInvoice:grdotheritems" id="grdotheritems"></table></div>
            </div>
        </div>
        <div class="hrm-tab-page" id="tabPage5" data-tabs-page="tc2">
            <div class="hrm-entry hrm-cols-4">
                <div class="hrm-field hrm-stack"><label for="CmbPaymentTermPaymentDetail">Payment Term</label><select id="CmbPaymentTermPaymentDetail" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbFinInstrumentsPaymentDetail">Financial Instruments No</label><select id="CmbFinInstrumentsPaymentDetail" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtBalanceFIPaymentDetail">Balance</label><input type="text" id="txtBalanceFIPaymentDetail" class="win-textbox hrm-al-right" value="0" readonly></div>
                <div class="hrm-field hrm-stack"><label for="dtxtpercentoftotal">% of Total</label><input type="text" id="dtxtpercentoftotal" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="txtFcyAmountPaymentDetail">Fcy Amount</label><input type="text" id="txtFcyAmountPaymentDetail" class="win-textbox hrm-al-right" value="0" data-guard="decimal" inputmode="decimal" autocomplete="off"></div>
                <div class="hrm-field hrm-stack"><label for="txtDueDaysPaymentDetail">Due Days</label><input type="text" id="txtDueDaysPaymentDetail" class="win-textbox hrm-al-right" value="0" data-guard="integer" inputmode="numeric" autocomplete="off"></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label for="txtRemarksPaymentDetail">Remarks</label>
                    <div class="hrm-inline" style="flex-wrap:nowrap"><input type="text" id="txtRemarksPaymentDetail" class="win-textbox hrm-grow" autocomplete="off">
                        <button type="button" id="BtnAddPaymentDetail" class="win-btn-action" style="min-width:34px;width:34px" onclick="ImpBInvoice.btndadd(this)">+</button>
                        <button type="button" id="BtnUpdatePaymentDetail" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btndupdate(this)">Update</button>
                        <button type="button" id="btnCancelPaymentDetail" class="win-btn-action is-hidden" style="min-width:0;width:auto;padding:0 8px" onclick="ImpBInvoice.btndcancel(this)">Cancel</button></div></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Payment Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="ImportInvoice:grdpaymentdetail" id="grdpaymentdetail"></table></div>
            </div>
        </div>
    </div>
    <div class="hrm-tab-page" id="tabPage2" data-tabs-page="tc1">
        <div class="win-tool-strip">
            <button type="button" id="btnResetHistory" class="win-btn-tool" onclick="ImpBInvoice.btnResetHistory(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="ImpBInvoice.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="hrm-caption">Import Invoice History</div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry hrm-cols-3" style="padding:4px 2px">
                <div class="hrm-field"><label for="hFromDate">From Date</label><div class="impb-date-chk"><input type="checkbox" id="hFromChk" checked><input type="date" id="hFromDate" class="win-textbox"></div></div>
                <div class="hrm-field"><label for="FromDocNoHistory">From Doc No</label><input type="text" id="FromDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"></div>
                <div class="hrm-field"><label for="CmbCustomerHistory">Importer Name</label><select id="CmbCustomerHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="hToDate">To Date</label><div class="impb-date-chk"><input type="checkbox" id="hToChk" checked><input type="date" id="hToDate" class="win-textbox"></div></div>
                <div class="hrm-field"><label for="ToDocNoHistory">To Doc No</label><input type="text" id="ToDocNoHistory" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"></div>
                <div class="hrm-field"><span class="hrm-lbl"></span><div class="hrm-inline"><div class="impb-radios">
                    <label class="hrm-check"><input type="radio" name="hDateType" value="doc" checked> Doc Date</label>
                    <label class="hrm-check"><input type="radio" name="hDateType" value="entry"> Entry Date</label>
                    <label class="hrm-check"><input type="radio" name="hDateType" value="modify"> Modify Date</label></div>
                    <button type="button" id="btnShowHistory" class="win-btn-action" onclick="ImpBInvoice.btnShowHistory(this)">Show</button></div></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box" id="boxHistory">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="ImportInvoice:DataGridHistory" id="DataGridHistory"></table></div>
        </div>
        <div class="hrm-grid-box hrm-grid-short">
            <div class="hrm-subcaption"><span>Detail of the Selected above Row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="gridDetailHistory"></table></div>
        </div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_imports_impb_core.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_imports_import_invoice.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
