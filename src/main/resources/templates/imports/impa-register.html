<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${impaTitle} + ' - EccountBookERP'">Import Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        .impa-filters { display: grid; grid-template-columns: 110px 120px minmax(0, 208px) minmax(0, 230px) auto; gap: 4px 6px; align-items: end; padding: 6px 10px; }
        .hrm-grid-box .hrm-grid-wrap { max-height: calc(100vh - 230px); }
        @media (max-width: 700px) { .impa-filters { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<!-- Architecture.WinApp.ImportReports.ImportInvoiceRegister (392) / ImportContractRegister (393) / ImportGrnRegister (394) /
     ImportPurchaseRegister (395) - one layout: panel2 toolStrip3 &Refresh (no handler) | <n>-Print | export (no handler) + ctrlGrdBar1;
     panel3 caption; panel4 (65): From Date (16,27) 109 | To Date (128,27) 118 | Supplier Name (250,26) 208 | Variety (462,25) 230 | Show;
     panel5 DataGridHistory (Fill; RetrieveStructure of the procedure's columns, the form's GridSettings for hidden columns / totals). -->
<body class="pd-body hrm-body" th:attr="data-hrm='register-' + ${impaKind},data-screen=${impaScreen},data-kind=${impaKind},data-key=${impaKey},data-rpt=${impaRpt}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" title="Refresh has no handler on the desktop form" disabled><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="print" class="win-btn-tool" onclick="ImpARg.print(this)" data-rpt-own th:attr="data-rpt=${impaRpt}"><i class="fa fa-print"></i> <span th:text="${impaPrintText}">Print</span></button>
    </div>
    <div class="hrm-caption" th:text="${impaTitle}">Import Register</div>
    <div class="impa-filters">
        <div class="hrm-field hrm-stack"><label for="GRNfromdate">From Date</label><input type="date" id="GRNfromdate" class="win-textbox"/></div>
        <div class="hrm-field hrm-stack"><label for="GRNToDate">To Date</label><input type="date" id="GRNToDate" class="win-textbox"/></div>
        <div class="hrm-field hrm-stack"><label for="CmbSupplier">Supplier Name</label><select id="CmbSupplier" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field hrm-stack"><label for="cmbitem">Variety</label><select id="cmbitem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div><button type="button" id="btnshow" class="win-btn-action" onclick="ImpARg.btnshow(this)">Show</button></div>
    </div>
    <div class="hrm-grid-box">
        <div class="hrm-subcaption"><span></span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="DataGridHistory"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_imports_impa.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_imports_registers.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
</body>
</html>
