<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>LicenseKey</title>
    <style>
        /* ------------------------------------------------------------------------------------
           Architecture.WinApp.LicenseKey.InitializeComponent, 1:1.
           Form BackColor White, ClientSize 415x361, Text "LicenseKey".
           panel1 (0,0) 411x361 holds everything; the coordinates below are the designer's.
           ------------------------------------------------------------------------------------ */
        html, body { margin: 0; padding: 0; background: #fff; }
        body { font-family: "Segoe UI", Tahoma, sans-serif; }

        #panel1 { position: relative; width: 411px; height: 361px; }

        /* label1 (0,0) 411x65  Teal / White / Segoe UI 24 Bold */
        #label1 { position: absolute; left: 0; top: 0; width: 411px; height: 65px;
                  background: #008080; color: #fff; font-size: 24pt; font-weight: bold;
                  display: flex; align-items: center; padding-left: 6px; box-sizing: border-box; }
        /* label3 (295,3) 46x25  Teal / White / Segoe UI 14 Bold */
        #label3 { position: absolute; left: 295px; top: 3px; width: 46px; height: 25px;
                  background: #008080; color: #fff; font-size: 14pt; font-weight: bold; line-height: 25px; }

        /* label5 (0,65) 411x40  Red band, MiddleCenter, no design-time text */
        #label5 { position: absolute; left: 0; top: 65px; width: 411px; height: 40px;
                  background: #ff0000; color: #000; font-size: 13.8pt;
                  display: flex; align-items: center; justify-content: center; }
        /* label2 (10,73) 223x25  Red / White / Segoe UI 13 Bold — sits on top of label5 */
        #label2 { position: absolute; left: 10px; top: 73px; width: 223px; height: 25px;
                  background: #ff0000; color: #fff; font-size: 13pt; font-weight: bold; line-height: 25px; }
        /* txtLicenseExpiryDate (238,72) 168x26  Verdana 11.25, DateTimePickerFormat.Short */
        #txtLicenseExpiryDate { position: absolute; left: 238px; top: 72px; width: 168px; height: 26px;
                                box-sizing: border-box; font-family: Verdana; font-size: 11.25pt;
                                border: 1px solid #7f9db9; padding: 0 3px; }

        /* PicLicanceKey (0,105) 411x116  White, SizeMode CenterImage — the form's own resource */
        #PicLicanceKey { position: absolute; left: 0; top: 105px; width: 411px; height: 116px;
                         background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* LblDayLeftMsg (0,221) 411x37  Segoe UI 16 Bold, ForeColor 245,65,65, MiddleCenter */
        #LblDayLeftMsg { position: absolute; left: 0; top: 221px; width: 411px; height: 37px;
                         color: rgb(245,65,65); font-size: 16pt; font-weight: bold;
                         display: flex; align-items: center; justify-content: center; }

        /* panel4 (0,258) 411x62 with txtLicense docked Fill, Multiline */
        #panel4 { position: absolute; left: 0; top: 258px; width: 411px; height: 62px; }
        #txtLicense { width: 411px; height: 62px; box-sizing: border-box; resize: none;
                      font-family: "Segoe UI"; font-size: 9pt; border: 1px solid #7f9db9; padding: 2px 3px; }

        /* btnSubmit (296,324) 108x32  Teal / White / Verdana 14.25 Bold, Text "Sumbit" */
        #btnSubmit { position: absolute; left: 296px; top: 324px; width: 108px; height: 32px;
                     background: #008080; color: #fff; font-family: Verdana; font-size: 14.25pt;
                     font-weight: bold; border: 1px solid #006666; cursor: pointer;
                     display: flex; align-items: center; justify-content: center; gap: 6px; }
        #btnSubmit:disabled { opacity: .6; cursor: default; }
        /* The spec's loading indicator — the only thing on this page the desktop does not draw. */
        #btnSubmit .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.4);
                           border-top-color: #fff; border-radius: 50%; display: none;
                           animation: sp .7s linear infinite; }
        #btnSubmit.busy .spin { display: inline-block; }
        @keyframes sp { to { transform: rotate(360deg); } }

        /* MessageBox.Show */
        #mbMask { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; }
        #mbForm { background: #f0f0f0; border: 1px solid #555; min-width: 300px; max-width: 480px; font-family: "Segoe UI"; font-size: 9pt; }
        #mbForm .cap { background: #008080; color: #fff; padding: 4px 8px; font-weight: bold; }
        #mbForm .body { padding: 14px 16px; }
        #mbForm .btns { padding: 8px 16px 12px; text-align: right; }
        #mbForm .btns button { min-width: 72px; height: 23px; background: #ece9d8; border: 1px solid #aca899; cursor: pointer; font-family: "Segoe UI"; font-size: 9pt; }
    </style>
</head>
