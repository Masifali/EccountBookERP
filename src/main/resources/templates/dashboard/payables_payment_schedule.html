<!-- ==========================================================================
     Payables And Payment Schedule
     ditto Architecture.WinApp.Account_Reports\PayablesAndPaymentSchedule.cs (1,864 lines)

     Controls, in the desktop's own order (groupBox1 "Filters"):
       label9  "Parent Category"  CmbParentCategory
       label27 "Date From"     datDateFrom       label1 "Date To"      datDateTo
       label3  "Due From"      datDueFrom        label2 "Due Up To"    datDueUpto
       label6  "Purchase From" datPurchaseFrom   label4 "Purchase To"  datPurchaseTo
       label5  "Interval Days" txtIntervalDays   ("30", :1473)
       label12 "Aging Days"    txtAgingDays      ("30", :1466)
       label11 "Control Account" cmbAccount      - multi-select, checked list
       label7  "Custom Group"    CmbCustomGroups
       label10 "Customer Group"  CmbCustomerGroup
       Branches "Branches"       CmbBranches     - shown only under ERP feature 17
       btnshow "Show"
     Two grids: grdPayablesAndSchedule (detail) and grdSummary (the aging summary, whose four
     bucket headings are data, not literals - :322-327).
     toolStrip3: btnNew "&New", print "121_01 Print", btnShortCut "ShortCut Keys"

     Events ported:
       PayablesAndPaymentSchedule_Load     :146-179
       btnshow_Click                       :182-197
       gridHistory                         :199-355   two result sets
       GridSetting                         :357-436   captions, hidden columns, links, sums
       btnNew_Click -> Reset               :624-649
       txtIntervalDays_TextChanged         :801-812   Purchase From = today - interval days
       PayablesAndPaymentSchedule_KeyDown  :668-714
       grdPayablesAndSchedule_LinkClicked  :813-897   AccountCode, BalQty, PurchaseAmount

     All six date pickers are tick boxes (:1550-1662); only datDueFrom starts unticked (:1624).
     An unticked date is NOT SENT AT ALL - see the service for the parameter contract, including
     the desktop's own defect where Due Up To is gated on the Date To tick box.

     Read-only screen: no save, update, delete or History button on the desktop form. PayToday is
     editable in the desktop grid but is never written back to the database, so editing it here
     only re-totals the column.
     R3 2026-09-30: Account Reports look (countx_acc_rpt_f.css) and searchable combos (countx_prod_combo.js);
     select2 and bootstrap removed. Element ids unchanged (countx_payables_payment_schedule.js).
     ========================================================================== -->
<div class="win-title-bar">
    <span><i class="fa fa-calendar"></i> Payables And Payment Schedule</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="psNew(this)"><i class="fa fa-plus text-success"></i> New</button>
    <button type="button" class="win-btn" id="btnPrint" onclick="psPrint(this)" data-rpt="121_01-ReceivablesByDueDates.rpt"><i class="fa fa-print"></i> 121_01 Print</button>
    <button type="button" class="win-btn" onclick="psShortcuts()"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    <a class="win-btn" href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a>
    <span class="sep"></span>
    <span class="ps-count" id="psCount"></span>
    <button type="button" class="win-btn" onclick="psToggleFullscreen()"><i class="fa fa-arrows-alt"></i> Fullscreen</button>
</div>
<div class="win-header-panel"><span>Payables And Payment Schedule</span></div>
<div id="psMessage"></div>

<div class="filters">
    <div class="gb" style="width:900px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 100px 190px 90px 150px 90px 150px;">
            <span class="lbl">Parent Category</span><div><select id="parentCategory" class="inp" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select></div>
            <span class="lbl">Custom Group</span><div style="grid-column: span 3;"><select id="customGroup" class="inp" data-dtcombo="single" data-dtcombo-caption="Custom Group"></select></div>

            <label class="chk"><input type="checkbox" id="chkFrom" onchange="psDateToggled('From')"> Date From</label><input type="date" id="fromDate" class="inp">
            <!-- NOTE: the Date To tick box also gates Due Up To, exactly as the desktop does at :222-225 -->
            <label class="chk"><input type="checkbox" id="chkTo" onchange="psDateToggled('To')"> Date To</label><input type="date" id="toDate" class="inp">
            <span class="lbl">Customer Group</span><div><select id="customerGroup" class="inp" data-dtcombo="single" data-dtcombo-caption="Customer Group"></select></div>

            <label class="chk"><input type="checkbox" id="chkDueFrom" onchange="psDateToggled('DueFrom')"> Due From</label><input type="date" id="dueFrom" class="inp">
            <label class="chk"><input type="checkbox" id="chkDueUpto" onchange="psDateToggled('DueUpto')"> Due Up To</label><input type="date" id="dueUpto" class="inp">
            <span class="lbl">Interval Days</span><input type="number" id="intervalDays" class="inp" value="30" oninput="psIntervalChanged()">

            <label class="chk"><input type="checkbox" id="chkPurchaseFrom" onchange="psDateToggled('PurchaseFrom')"> Purchase From</label><input type="date" id="purchaseFrom" class="inp">
            <label class="chk"><input type="checkbox" id="chkPurchaseTo" onchange="psDateToggled('PurchaseTo')"> Purchase To</label><input type="date" id="purchaseTo" class="inp">
            <span class="lbl">Aging Days</span><input type="number" id="agingDays" class="inp" value="30">

            <span class="lbl">Control Account</span><div><select id="controlAccounts" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Account Title"></select></div>
            <span class="lbl" id="branchLbl">Branches</span><div id="branchWrap" style="display:none;"><select id="branches" class="inp" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></div>
            <span></span><span style="text-align:right;"><button type="button" class="win-btn-show" id="btnShow" onclick="psShow(this)"><i class="fa fa-eye"></i> Show</button></span>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Payables And Payment Schedule</span></div>
<div class="ps-grid-wrap" id="psGridWrap">
    <table class="ps-grid" id="psGrid">
        <thead id="psHead"></thead>
        <tbody id="psBody"></tbody>
        <tfoot id="psFoot"></tfoot>
    </table>
</div>
<div id="psEmpty" class="ps-empty" style="display:none;">Press Show to read the schedule.</div>

<!-- grdSummary - hidden until the second result set comes back with rows (:317-321) -->
<div id="psSumSect" class="grid-caption" style="display:none;">Aging Summary</div>
<div class="ps-sum-wrap" id="psSumWrap" style="display:none;">
    <table class="ps-grid" id="psSummary">
        <thead id="psSumHead"></thead>
        <tbody id="psSumBody"></tbody>
        <tfoot id="psSumFoot"></tfoot>
    </table>
</div>
