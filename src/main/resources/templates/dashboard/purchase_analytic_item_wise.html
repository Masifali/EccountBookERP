<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Analytic Periodic ItemWise</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

    <style>
        html, body { max-width:100%; overflow-x:hidden; }
        body { font-family:"Segoe UI","Tahoma","Geneva","Verdana",sans-serif; background:#e4e9ed;
               font-size:11px; color:#222; margin:0; padding:0; }

        .win-title-bar { background:#0f5959; color:#fff; font-size:15px; font-weight:bold; padding:6px 12px; }
        .win-sub-header { font-size:10px; color:#4f5d65; padding:2px 10px; background:#d8e0e6;
                          border-bottom:1px solid #b0bec5; }
        .win-toolbar { background:linear-gradient(to bottom,#fff 0%,#e3e8ee 100%);
                       border-bottom:1px solid #b0bec5; padding:3px 8px; display:flex; gap:4px;
                       align-items:center; flex-wrap:wrap; }
        .win-btn { background:#fff; border:1px solid #90a4ae; border-radius:2px; padding:3px 10px;
                   font-size:11px; font-weight:600; color:#263238; cursor:pointer;
                   display:inline-flex; align-items:center; gap:5px; height:25px; text-decoration:none; }
        .win-btn:hover { background:#e0f2f1; border-color:#0f5959; color:#004d40; text-decoration:none; }
        .win-btn-teal { background:#0f5959; color:#fff; border-color:#083b3b; }
        .win-btn-teal:hover { background:#083b3b; color:#fff; }
        .win-btn:disabled { opacity:.55; cursor:default; }

        .win-form-card { background:#fff; border:1px solid #b0bec5; border-radius:3px;
                         padding:8px 10px; margin:8px; }
        .win-group-box { border:1px solid #c7d0d6; border-radius:2px; padding:10px 10px 8px;
                         position:relative; }
        .win-group-title { position:absolute; top:-8px; left:8px; background:#fff; padding:0 5px;
                           font-size:11px; font-weight:700; color:#0f5959; }
        .win-label { display:block; font-size:10px; color:#41525c; margin:0 0 2px; font-weight:600; }
        .win-input { border:1px solid #7f9db9; border-radius:0; font-size:11px; height:24px;
                     padding:1px 4px; width:100%; box-sizing:border-box; background:#fff; }
        .win-input[readonly], .win-input:disabled { background:#f2f4f6; color:#555; }

        .btn-busy { position:relative; color:transparent !important; pointer-events:none; }
        .btn-busy::after { content:""; position:absolute; top:50%; left:50%; width:11px; height:11px;
                           margin:-6px 0 0 -6px; border:2px solid rgba(0,0,0,.25);
                           border-top-color:#00564C; border-radius:50%;
                           animation:btnspin .6s linear infinite; }
        @keyframes btnspin { to { transform:rotate(360deg); } }

        #piMessage { display:none; margin:6px 8px; padding:4px 8px; font-size:11px; font-weight:bold; }
        #piMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        #piMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }

        .totals-bar { background:#e0f2f1; font-weight:bold; color:#0f5959; font-size:12px;
                      padding:4px 12px; border:1px solid #0f5959; border-radius:2px;
                      display:flex; justify-content:space-between; margin:6px 8px 0; }

        /* PurchaseAnalyticCard laid out in a FlowLayoutPanel, so the cards wrap. */
        .pi-wrap { display:flex; flex-wrap:wrap; gap:10px; padding:6px 8px 10px; }
        .pi-card { background:#fff; border:1px solid #b0bec5; border-radius:3px; flex:1 1 560px;
                   min-width:0; max-width:100%; display:flex; flex-direction:column; }
        .pi-card-head { background:#0f5959; color:#fff; padding:5px 10px; font-size:12px;
                        font-weight:700; display:flex; justify-content:space-between; gap:8px; }
        .pi-scroll { overflow:auto; max-height:320px; }
        table.pi-grid { width:max-content; min-width:100%; border-collapse:collapse; font-size:11px; background:#fff; }
        table.pi-grid th { background:#eef2f4; border:1px solid #cfd8dc; padding:3px 5px;
                           font-weight:700; color:#33454e; position:sticky; top:0; z-index:2;
                           white-space:nowrap; text-align:center; }
        table.pi-grid td { border:1px solid #e0e6ea; padding:2px 5px; white-space:nowrap; }
        table.pi-grid tbody tr:hover { background:#e0f2f1; }
        .num { text-align:right; }
        /* Descriptions is ColumnType 5 on this card - a link (:229). */
        .pi-link { color:#00564C; text-decoration:underline; cursor:pointer; }

        .pi-empty { background:#fff; border:1px dashed #b0bec5; color:#667; padding:14px;
                    text-align:center; margin:0 8px; font-size:11px; }
        .pi-full { position:fixed; inset:0; z-index:3000; background:#e4e9ed; overflow:auto; }
    </style>
</head>
<body>

<!-- ==========================================================================
     Purchase Analytic Periodic ItemWise
     ditto Architecture.WinApp.AnalyticDashboard\PurchaseAnalyticPeriodicItemWise.cs (715 lines)

     Controls, in the desktop's own order:
       DateFrom / DateTo, datSeasonStartDate / datSeasonEndDate (the season bounds)
       CmbParentCategory - a CHECKED list, so more than one category can be picked
       btnshow, btnSeasonYearSchedule
       flowLayoutPanel1 - the PurchaseAnalyticCard controls

     Events ported:
       PurchaseAnalyticPeriodic_Load  :95-124  season dates, categories, and - when opened from
                                               the periodic screen - the category is fixed and
                                               the report runs at once
       DateFrom_ValueChanged          :189-215
       DateTo_ValueChanged            :217-236
       btnshow_Click                  :238-341  refuses with no category: "Please Select a
                                                Parent Category"

     Read-only: no save, update, delete or History button on the desktop form.
     ========================================================================== -->
<div class="win-title-bar">Purchase Analytic Periodic ItemWise</div>
<div class="win-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard" style="color:#4f5d65;">DashBoard</a>
        &gt; Purchase Analytic Periodic ItemWise</span>
</div>

<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="piRefresh(this)">
        <i class="fa fa-refresh"></i> Refresh
    </button>
    <a class="win-btn" href="/dashboard/purchase-analytic-periodic">
        <i class="fa fa-arrow-left"></i> Purchase Analytics (Periodic)
    </a>
    <a class="win-btn" href="/accounts/vouchers/wages-rate-schedule" style="display:none;"></a>
    <a class="win-btn" href="/dashboard"><i class="fa fa-th"></i> DashBoard</a>
    <span style="flex:1;"></span>
    <button type="button" class="win-btn" onclick="piToggleFullscreen()">
        <i class="fa fa-arrows-alt"></i> Fullscreen
    </button>
</div>

<div id="piMessage"></div>

<div class="win-form-card">
    <div class="win-group-box">
        <div class="win-group-title">Date</div>
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="win-label">From</label>
                <input type="date" id="dateFrom" class="win-input" onchange="piDateFromChanged()">
            </div>
            <div class="col-md-2">
                <label class="win-label">To</label>
                <input type="date" id="dateTo" class="win-input" onchange="piDateToChanged()">
            </div>
            <div class="col-md-2">
                <label class="win-label">Season Start Date</label>
                <input type="date" id="seasonStart" class="win-input" readonly>
            </div>
            <div class="col-md-2">
                <label class="win-label">Season End Date</label>
                <input type="date" id="seasonEnd" class="win-input" readonly>
            </div>
            <!-- CmbParentCategory is a checked list on the desktop, so this is a multi-select -->
            <div class="col-md-3">
                <label class="win-label">Parent Categories</label>
                <select id="parentCats" class="win-input pi-select2" multiple></select>
            </div>
            <div class="col-md-1">
                <button type="button" class="win-btn win-btn-teal" id="btnShow"
                        onclick="piShow(this)" disabled>
                    <i class="fa fa-search"></i> Show
                </button>
            </div>
        </div>
    </div>
</div>

<div class="totals-bar">
    <span>Items: <b id="piCardCount">0</b></span>
    <span id="piRange"></span>
</div>

<div id="piCards" class="pi-wrap"></div>
<div id="piEmpty" class="pi-empty" style="display:none;">Press Show to load.</div>
<div style="height:16px;"></div>

<script th:inline="javascript">
    /* RequestedByOtherDocument: the parent category the periodic screen handed over, or null. */
    window.PI_PARENT_CATEGORY_ID = /*[[${parentCategoryId}]]*/ null;
</script>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_purchase_analytic_item_wise.js?v=20260920a}"></script>
</body>
</html>
