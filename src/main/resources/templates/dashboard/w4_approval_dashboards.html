<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${w4Title}">Approval Dashboard</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_w4_dashboards.css?v=20261014w4}">
</head>
<body th:attr="data-w4-mode=${w4Mode}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>

<!-- ==========================================================================
     364 Approval Dashboard (New)  - ApprovalDashboard\PendingDocumentForMultipleApprovals.cs (305 lines)
     368 Approval Dashboard Steel  - Steel.Approvals\ApprovalDashboard_St.cs (333 lines)

     Both: form text "Approval Dashboard", toolStrip3 with one button "&Refresh", two group boxes, "Accounts"
     (label1 "Accounts Dashboard") and "Inventory" (label2 "Inventory Dashboard"), each holding a flow of cards
     (a title and a count). Clicking a card opens another desktop screen; the dashboard then re-reads.
     Read-only: nothing is approved here.
     ========================================================================== -->
<div class="w4-title-bar">Approval Dashboard</div>
<div class="w4-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard">DashBoard</a> &gt; Approvals &amp; Undo Approvals &gt; <span th:text="${w4Title}"></span></span>
</div>

<div class="w4-toolbar">
    <button type="button" class="w4-btn" id="w4Refresh"><i class="fa fa-refresh"></i> Refresh</button>
    <a class="w4-btn" href="/dashboard"><i class="fa fa-arrow-left"></i> Back to DashBoard</a>
</div>

<div id="w4Message"></div>

<div class="w4-sect">Accounts Dashboard</div>
<div id="w4Accounts" class="w4-cardwrap"></div>

<div class="w4-sect">Inventory Dashboard</div>
<div id="w4Inventory" class="w4-cardwrap"></div>

<div id="w4Empty" class="w4-empty" style="display:none;">Loading...</div>
<div style="height:16px;"></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_pending_approval_vouchers_history_open.js?v=20261005approval}"></script>
<script th:src="@{/build/js/countx_w4_approval_dashboards.js?v=20261014w4}"></script>
</body>
</html>
