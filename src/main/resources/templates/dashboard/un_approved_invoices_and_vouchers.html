<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UnApproved Vouchers</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <style>
        html, body { max-width:100%; overflow-x:hidden; }
        body { font-family:"Segoe UI","Tahoma","Geneva","Verdana",sans-serif; background:#e4e9ed;
               font-size:11px; color:#222; margin:0; padding:0; }

        .win-title-bar { background:#0f5959; color:#fff; font-size:15px; font-weight:bold; padding:6px 12px; }
        .win-sub-header { font-size:10px; color:#4f5d65; padding:2px 10px; background:#d8e0e6;
                          border-bottom:1px solid #b0bec5; }
        .win-toolbar { background:linear-gradient(to bottom,#fff 0%,#e3e8ee 100%);
                       border-bottom:1px solid #b0bec5; padding:3px 8px; display:flex; gap:4px;
                       align-items:center; flex-wrap:wrap; }
        .win-btn { background:#fff; border:1px solid #90a4ae; border-radius:2px; padding:3px 10px;
                   font-size:11px; font-weight:600; color:#263238; cursor:pointer;
                   display:inline-flex; align-items:center; gap:5px; height:25px; text-decoration:none; }
        .win-btn:hover { background:#e0f2f1; border-color:#0f5959; color:#004d40; text-decoration:none; }
        .win-btn-teal { background:#0f5959; color:#fff; border-color:#083b3b; }
        .win-btn-teal:hover { background:#083b3b; color:#fff; }
        .win-btn:disabled { opacity:.55; cursor:default; }

        .win-form-card { background:#fff; border:1px solid #b0bec5; border-radius:3px;
                         padding:8px 10px; margin:8px; }
        .win-group-box { border:1px solid #c7d0d6; border-radius:2px; padding:10px 10px 8px;
                         position:relative; }
        .win-group-title { position:absolute; top:-8px; left:8px; background:#fff; padding:0 5px;
                           font-size:11px; font-weight:700; color:#0f5959; }
        .win-label { display:block; font-size:10px; color:#41525c; margin:0 0 2px; font-weight:600; }
        .win-input { border:1px solid #7f9db9; border-radius:0; font-size:11px; height:24px;
                     padding:1px 4px; width:100%; box-sizing:border-box; background:#fff; }
        .win-input:disabled { background:#f2f4f6; color:#888; }

        .btn-busy { position:relative; color:transparent !important; pointer-events:none; }
        .btn-busy::after { content:""; position:absolute; top:50%; left:50%; width:11px; height:11px;
                           margin:-6px 0 0 -6px; border:2px solid rgba(0,0,0,.25);
                           border-top-color:#00564C; border-radius:50%;
                           animation:btnspin .6s linear infinite; }
        @keyframes btnspin { to { transform:rotate(360deg); } }

        #uaMessage { display:none; margin:6px 8px; padding:4px 8px; font-size:11px; font-weight:bold; }
        #uaMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        #uaMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }

        .ua-sect { font-weight:700; color:#0f5959; font-size:12px; margin:12px 8px 4px;
                   padding-bottom:3px; border-bottom:1px solid #b0bec5; }
        .ua-wrap { display:flex; flex-wrap:wrap; gap:10px; padding:0 8px; }

        /* DynamicallyGenerateCards: a title bar over its count. */
        .ua-card { width:215px; background:#fff; border:1px solid #cfd8dc; border-radius:2px;
                   display:flex; flex-direction:column; cursor:pointer; text-align:center;
                   box-shadow:0 1px 2px rgba(0,0,0,.08); }
        .ua-card:hover { box-shadow:0 3px 10px rgba(0,0,0,.18); }
        .ua-card .t { background:#0f5959; color:#fff; font-size:11px; font-weight:700;
                      padding:5px 8px; line-height:1.25; min-height:32px;
                      display:flex; align-items:center; justify-content:center; }
        .ua-card .n { font-size:22px; font-weight:700; color:#0f5959; padding:8px 0 10px; }
        .ua-card.zero { cursor:default; opacity:.6; }
        .ua-card.zero:hover { box-shadow:0 1px 2px rgba(0,0,0,.08); }

        .ua-empty { background:#fff; border:1px dashed #b0bec5; color:#667; padding:12px;
                    text-align:center; margin:0 8px; font-size:11px; }
        .ua-full { position:fixed; inset:0; z-index:3000; background:#e4e9ed; overflow:auto; }
    </style>
</head>
<body>

<!-- ==========================================================================
     Undo Approval (Dashboard) - "UnApproved Vouchers"
     ditto Architecture.WinApp.ApprovalDashboard\UnApprovedInvoicesAndVouchers.cs (788 lines)

     Controls, in the desktop's own order:
       toolStrip3   btnNew "&Refresh"
       groupBox3 "Filters"  label33 "From Date", label3 "To Date", BtnShow "Show"
                            both pickers carry a tick box (ShowCheckBox, :700 and :716)
       label1 "Accounts UnApproval Dashboard"    accountsFlowLayout
       label2 "Inventory UnApproval Dashboard"   inventoryFlowLayout
       label5 "CommissionAgent Dashboard"        flowLayoutPanel1, inside
                                                 PanelExportAndCommissionAgent, which is hidden
                                                 when there are no ActionId = 2 rows (:143)

     Events ported:
       frmSaleTaxSummaryRpt_Load :85-99    From = today - 7, To = today, then the cards
       BtnShow_Click             :500-519
       btnNew_Click              :483-486
       UserControl_Click         :163-481  a card opens the approval screen for its TypeID

     Read-only here: the un-approval itself happens on the screen a card opens. None of those
     are ported yet, so nothing on this page un-approves anything - and each card says which
     desktop screen it belongs to rather than opening something unrelated.
     ========================================================================== -->
<div class="win-title-bar">UnApproved Vouchers</div>
<div class="win-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard" style="color:#4f5d65;">DashBoard</a>
        &gt; Approvals &amp; Undo Approvals &gt; Undo Approval (Dashboard)</span>
</div>

<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="uaRefresh(this)">
        <i class="fa fa-refresh"></i> Refresh
    </button>
    <a class="win-btn" href="/dashboard"><i class="fa fa-arrow-left"></i> Back to DashBoard</a>
    <span style="flex:1;"></span>
    <button type="button" class="win-btn" onclick="uaToggleFullscreen()">
        <i class="fa fa-arrows-alt"></i> Fullscreen
    </button>
</div>

<div id="uaMessage"></div>

<div class="win-form-card">
    <div class="win-group-box">
        <div class="win-group-title">Filters</div>
        <div class="row g-2 align-items-end">
            <!-- Both pickers have a tick box on the desktop; an unticked one is not sent. -->
            <div class="col-md-3">
                <label class="win-label">
                    <input type="checkbox" id="chkFrom" checked onchange="uaFromToggled()"> From Date
                </label>
                <input type="date" id="fromDate" class="win-input">
            </div>
            <div class="col-md-3">
                <label class="win-label">
                    <input type="checkbox" id="chkTo" checked onchange="uaToToggled()"> To Date
                </label>
                <input type="date" id="toDate" class="win-input">
            </div>
            <div class="col-md-2">
                <button type="button" class="win-btn win-btn-teal" id="btnShow" onclick="uaShow(this)">
                    <i class="fa fa-search"></i> Show
                </button>
            </div>
        </div>
    </div>
</div>

<!-- label1 (:673) -->
<div class="ua-sect">Accounts UnApproval Dashboard</div>
<div id="uaAccounts" class="ua-wrap"></div>

<!-- label2 (:644) -->
<div class="ua-sect">Inventory UnApproval Dashboard</div>
<div id="uaInventory" class="ua-wrap"></div>

<!-- label5 (:615), inside PanelExportAndCommissionAgent - hidden when empty -->
<div id="uaCommissionSect" class="ua-sect" style="display:none;">CommissionAgent Dashboard</div>
<div id="uaCommission" class="ua-wrap" style="display:none;"></div>

<div id="uaEmpty" class="ua-empty" style="display:none; margin-top:10px;">Loading...</div>
<div style="height:16px;"></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_un_approved_invoices_and_vouchers.js?v=20260920a}"></script>
</body>
</html>
