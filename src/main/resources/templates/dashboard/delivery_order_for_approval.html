<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Order Sale Approval</title>
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
<style>body{margin:0;background:#edf1f2;font:13px Arial;color:#17282a}main{padding:12px}h1,h2{background:teal;color:#fff;padding:9px;font-size:16px}nav,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}button,input,select{font:inherit;padding:6px;border:1px solid #9baeb0}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}.scroll{overflow:auto;max-height:380px;background:white;border:1px solid #bac8ca}table{border-collapse:collapse;white-space:nowrap;width:100%}td,th{border:1px solid #c9d2d4;padding:7px;text-align:left}th{background:#e0eeee;position:sticky;top:0}#message{min-height:22px}tr.selected{background:#d6f0ec}</style></head><body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div><main>
<nav><a href="/dashboard/approval-dashboard">← Back to Approval Dashboard</a><button id="refresh">Refresh</button><button id="approve">Approve Selected</button></nav>
<h1>Delivery Order Sale Approval</h1><div class="filters"><label>From Date <input type="date" id="fromDate"></label><label>To Date <input type="date" id="toDate"></label><label>Status <select id="status"><option>Not Approved</option><option>Approved</option><option>All</option></select></label><button id="show">Show</button></div>
<p id="message" role="status"></p><div class="scroll"><table id="orders"><thead><tr><th>Select</th><th>Doc No</th><th>Date</th><th>Customer</th><th>Vehicle</th><th>Quantity</th><th>Weight</th><th>Actions</th></tr></thead><tbody></tbody></table></div>
<h2>Selected Delivery Order Details</h2><div class="scroll"><table id="details"></table></div></main>
<script src="/build/js/delivery_order_for_approval.js?v=20261021"></script><script src="/js/print-rpt.js?v=20261003erp"></script></body></html>
