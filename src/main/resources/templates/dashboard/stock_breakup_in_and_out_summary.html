<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Breakup In &amp; Out Summary</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">

    <style>
        html, body { max-width:100%; overflow-x:hidden; }
        body { font-family:"Segoe UI","Tahoma","Geneva","Verdana",sans-serif; background:#e4e9ed;
               font-size:11px; color:#222; margin:0; padding:0; }

        .win-title-bar { background:#0f5959; color:#fff; font-size:15px; font-weight:bold; padding:6px 12px; }
        .win-sub-header { font-size:10px; color:#4f5d65; padding:2px 10px; background:#d8e0e6;
                          border-bottom:1px solid #b0bec5; }
        .win-toolbar { background:linear-gradient(to bottom,#fff 0%,#e3e8ee 100%);
                       border-bottom:1px solid #b0bec5; padding:3px 8px; display:flex; gap:4px;
                       align-items:center; flex-wrap:wrap; }
        .win-btn { background:#fff; border:1px solid #90a4ae; border-radius:2px; padding:3px 10px;
                   font-size:11px; font-weight:600; color:#263238; cursor:pointer;
                   display:inline-flex; align-items:center; gap:5px; height:25px; text-decoration:none; }
        .win-btn:hover { background:#e0f2f1; border-color:#0f5959; color:#004d40; text-decoration:none; }
        .win-btn-teal { background:#0f5959; color:#fff; border-color:#083b3b; }
        .win-btn-teal:hover { background:#083b3b; color:#fff; }
        .win-btn:disabled { opacity:.55; cursor:default; }

        .win-form-card { background:#fff; border:1px solid #b0bec5; border-radius:3px;
                         padding:8px 10px; margin:8px; }
        .win-group-box { border:1px solid #c7d0d6; border-radius:2px; padding:10px 10px 8px;
                         position:relative; }
        .win-group-title { position:absolute; top:-8px; left:8px; background:#fff; padding:0 5px;
                           font-size:11px; font-weight:700; color:#0f5959; }
        .win-label { display:block; font-size:10px; color:#41525c; margin:0 0 2px; font-weight:600; }
        .win-input { border:1px solid #7f9db9; border-radius:0; font-size:11px; height:24px;
                     padding:1px 4px; width:100%; box-sizing:border-box; background:#fff; }
        .win-input:disabled { background:#f2f4f6; color:#888; }
        .win-radio-inline { font-size:11px; display:inline-flex; align-items:center; gap:4px;
                            margin-right:14px; }

        .caption-bar { background:#0f5959; color:#fff; font-weight:700; font-size:12px;
                       padding:4px 12px; margin:0 8px; }
        .totals-bar { background:#e0f2f1; font-weight:bold; color:#0f5959; font-size:12px;
                      padding:4px 12px; border:1px solid #0f5959; border-radius:2px;
                      display:flex; justify-content:space-between; margin:6px 8px 0; }

        .btn-busy { position:relative; color:transparent !important; pointer-events:none; }
        .btn-busy::after { content:""; position:absolute; top:50%; left:50%; width:11px; height:11px;
                           margin:-6px 0 0 -6px; border:2px solid rgba(0,0,0,.25);
                           border-top-color:#00564C; border-radius:50%;
                           animation:btnspin .6s linear infinite; }
        @keyframes btnspin { to { transform:rotate(360deg); } }

        #sbMessage { display:none; margin:6px 8px; padding:4px 8px; font-size:11px; font-weight:bold; }
        #sbMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        #sbMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }

        /* Full available width; the table scrolls inside its own container, never the page. */
        .sb-scroll { margin:6px 8px 10px; border:1px solid #b5b5b5; background:#fff;
                     overflow:auto; max-height:calc(100vh - 300px); }
        table.sb-grid { width:max-content; min-width:100%; border-collapse:collapse; font-size:11px; background:#fff;
                        table-layout:auto; }
        table.sb-grid th { background:#eef2f4; border:1px solid #cfd8dc; padding:4px 6px;
                           font-weight:700; color:#33454e; position:sticky; top:0; z-index:2;
                           white-space:nowrap; }
        table.sb-grid td { border:1px solid #e0e6ea; padding:3px 6px; }
        table.sb-grid tbody tr:hover { background:#e0f2f1; }
        .num { text-align:right; white-space:nowrap; }
        .neg { color:#b00020; }

        /* RootTable.Groups.Add("TransType") with GroupTotals - a group header row, then its
           rows, then that group's own totals. */
        tr.grp td { background:#d8e0e6; font-weight:700; color:#173b41; border-top:2px solid #0f5959; }
        tr.grp-total td { background:#f2f6f8; font-weight:700; }
        tfoot td { background:#e0f2f1; font-weight:700; color:#0f5959; border:1px solid #0f5959; }

        /* Activity is ColumnType 5 - a link. */
        .act-link { color:#00564C; text-decoration:underline; cursor:pointer; }
        .act-flat { color:#333; }

        .sb-full { position:fixed; inset:0; z-index:3000; background:#e4e9ed; overflow:auto; }
        .sb-full .sb-scroll { max-height:calc(100vh - 120px); }
    </style>
</head>
<body>

<!-- ==========================================================================
     Stock Breakup In & Out Summary  -  the whole Audit Dashboard module.
     ditto Architecture.WinApp.Audit_Dashboard\StockBreakupInAndOutSummary.cs (625 lines)

     Controls, in the desktop's own order:
       toolStrip1     toolStripButton1 "&New" (Reset), btnPrint "Print-842", btnGenerate "Generate"
       lblCaption     "Stock Opening,Purchase,Production From Paddy Process and Sales Summary"
       panel5         Date From (with its tick box), Date To, btnshow "Show"
                      RdSystemRateAmount / RdCustomRateAmount, label1 "Short %", txtShortPercent
       grdfrm         the grid, grouped by TransType, with a Select checkbox column

     Events ported:
       Load / Reset                         :78-105
       btnSearch_Click  -> GridFill()       :205-215
       grdfrm_LinkClicked  Activity link    :259-282   (only when SortNo != 7)
       btnGenerate_Click  shortage row      :307-366
       txtShortPercent_KeyPress  decimals    :368-378

     btnPrint runs the Crystal report 842-StockBreakUpInOutSummary.rpt, which has no web
     equivalent in this application; the browser's own print is offered instead and says so.
     ========================================================================== -->
<div class="win-title-bar">Stock Breakup In &amp; Out Summary</div>
<div class="win-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard" style="color:#4f5d65;">DashBoard</a>
        &gt; Audit Dashboard &gt; Stock Breakup In &amp; Out Summary</span>
</div>

<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="sbReset(this)">
        <i class="fa fa-file-o"></i> New
    </button>
    <button type="button" class="win-btn" id="btnGenerate" onclick="sbGenerate(this)">
        <i class="fa fa-calculator"></i> Generate
    </button>
    <button type="button" class="win-btn" id="btnPrint" onclick="sbPrint()">
        <i class="fa fa-print"></i> Print-842
    </button>
    <a class="win-btn" href="/dashboard"><i class="fa fa-arrow-left"></i> Back to DashBoard</a>
    <span style="flex:1;"></span>
    <button type="button" class="win-btn" onclick="sbToggleFullscreen()">
        <i class="fa fa-arrows-alt"></i> Fullscreen
    </button>
</div>

<!-- lblCaption (:479) -->
<div class="caption-bar">Stock Opening, Purchase, Production From Paddy Process and Sales Summary</div>

<div id="sbMessage"></div>

<div class="win-form-card">
    <div class="win-group-box">
        <div class="win-group-title">Filters</div>
        <div class="row g-2 align-items-end">
            <!-- label2 "Date From". The desktop picker has a tick box and Reset() clears it
                 (:84), so the report runs with NO @FromDate until it is ticked. -->
            <div class="col-md-3">
                <label class="win-label">
                    <input type="checkbox" id="chkFrom" onchange="sbFromToggled()"> Date From
                </label>
                <input type="date" id="fromDate" class="win-input" disabled>
            </div>
            <!-- label4 "Date To" -->
            <div class="col-md-2">
                <label class="win-label">Date To</label>
                <input type="date" id="toDate" class="win-input">
            </div>
            <div class="col-md-5">
                <label class="win-label">Production From Paddy</label>
                <div>
                    <!-- RdSystemRateAmount (:528) is the default; RdCustomRateAmount sends ActionId 2 -->
                    <label class="win-radio-inline">
                        <input type="radio" name="rateMode" id="rdSystem" value="system" checked
                               onchange="sbRateModeChanged()"> System Rate &amp; Amount
                    </label>
                    <label class="win-radio-inline">
                        <input type="radio" name="rateMode" id="rdCustom" value="custom"
                               onchange="sbRateModeChanged()"> Custom Rate &amp; Amount
                    </label>
                </div>
            </div>
            <!-- label1 "Short %" -->
            <div class="col-md-1">
                <label class="win-label">Short %</label>
                <input type="text" id="shortPercent" class="win-input num" value="">
            </div>
            <div class="col-md-1">
                <button type="button" class="win-btn win-btn-teal" id="btnShow" onclick="sbShow(this)">
                    <i class="fa fa-search"></i> Show
                </button>
            </div>
        </div>
    </div>
</div>

<div class="totals-bar">
    <span>Rows: <b id="sbRowCount">0</b> &nbsp;|&nbsp; Checked: <b id="sbCheckedCount">0</b></span>
    <span id="sbRange"></span>
</div>

<div class="sb-scroll">
    <table class="sb-grid" id="sbGrid">
        <thead><tr id="sbHead"></tr></thead>
        <tbody id="sbBody">
            <tr><td style="text-align:center; padding:16px; color:#777;">Press Show to load.</td></tr>
        </tbody>
        <tfoot><tr id="sbFoot"></tr></tfoot>
    </table>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_stock_breakup_in_and_out_summary.js?v=20260920a}"></script>
</body>
</html>
