<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
    <style>
        /* R4 2026-09-30: Account Reports look (countx_acc_rpt_f.css); only the classes this page's script emits. */
        .accf #rsMessage { display:none; margin:4px; padding:3px 8px; font-weight:bold; }
        .accf #rsMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        .accf #rsMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }
        .accf .win-btn.btn-busy { opacity:.6; pointer-events:none; }
        .accf .fgrid .chk input { margin:0 3px 0 0; }
        .accf table.wg .rs-num { text-align:right; }
        .accf table.wg .rs-ctr { text-align:center; }
        .accf table.wg .rs-neg { color:#b00020; }
        .accf table.wg tr.rs-group td { font-weight:bold; background:#dbe7e5 !important; color:var(--f-teal-dark); border-top:1px solid var(--f-teal); }
        .accf table.wg a.rs-link { color:#0056b3; text-decoration:underline; cursor:pointer; }
        .accf table.wg .rs-link-off { color:#546e7a; text-decoration:underline dotted; cursor:pointer; }
        .accf .rs-empty { background:#fff; border:1px dashed var(--f-border); color:#667; padding:10px; text-align:center; margin:0 4px; }
        .accf .rs-count { font-size:10px; font-weight:bold; }
        body.accf.rs-full { position:fixed; inset:0; z-index:3000; overflow:auto; }
        body.accf.rs-full .grid-wrap { max-height:calc(100vh - 80px); }
    </style>
</head>
<body class="accf">

<!-- ==========================================================================
     Receivables And Receipt Schedule
     ditto Architecture.WinApp.Account_Reports\ReceivablesAndReceiptSchedule.cs (1,812 lines)

     The desktop file's methods are still called PayablesAndPaymentSchedule_* - the form was
     copied from that one and never renamed. Its caption (:1752, :1788) and its procedure are
     the receivables ones.

     Controls, in the desktop's own order (groupBox1 "Filters"):
       label9  "Parent Category"  CmbParentCategory
       label27 "Date From"  datDateFrom     label1 "Date To"    datDateTo
       label3  "Due From"   datDueFrom      label2 "Due Up To"  datDueUpto
       label6  "Sale From"  datSaleFrom     label4 "Sale To"    datSaleTo
       label5  "Interval Days" txtIntervalDays (designer default "15", :1430)
       label11 "Control Account" cmbAccount  - multi-select, checked list
       label7  "Custom Group"    CmbCustomGroups
       label10 "Customer Group"  CmbCustomerGroup
       Branches "Branches"       CmbBranches - shown only under ERP feature 17
       btnshow "Show"
     toolStrip3: btnNew "&New", print "121_02 Print", btnShortCut "ShortCut Keys"

     Events ported:
       PayablesAndPaymentSchedule_Load     :132-163
       btnshow_Click                       :165-181
       gridHistory                         :183-293
       GridSetting                         :295-442   captions, hidden columns, links, sums
       btnNew_Click -> Reset               :630-655
       txtIntervalDays_TextChanged         :807-818   Sale From = today - interval days
       PayablesAndPaymentSchedule_KeyDown  :674-720   Ctrl+S Show, Ctrl+P Print, Ctrl+N New,
                                                      Esc / Ctrl+E Close, Ctrl+F5 and Ctrl+Up
                                                      focus Date From, Ctrl+Down focus the grid
       grdPayablesAndSchedule_LinkClicked  :819-916   AccountCode, BalQty and SaleAmount links

     All six date pickers are tick boxes on the desktop (ShowCheckBox at :1500-1619); only
     datDueFrom starts unticked (:1518). An unticked date is NOT SENT AT ALL, which is not the
     same as sending NULL - see the service for the parameter contract.

     Read-only screen: the desktop form has no save, update, delete or History button, so this
     page has none either.
     ========================================================================== -->

<div class="win-title-bar">
    <span><i class="fa fa-calendar"></i> Receivables And Receipt Schedule</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="rsNew(this)"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn" id="btnPrint" onclick="rsPrint(this)" data-rpt="121_02_ReceivablesAndReceiptSchedule.rpt"><i class="fa fa-print"></i> 121_02 Print</button>
    <button type="button" class="win-btn" onclick="rsShortcuts()"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    <span style="flex:1;"></span>
    <span class="rs-count" id="rsCount"></span>
    <button type="button" class="win-btn" onclick="rsToggleFullscreen()"><i class="fa fa-arrows-alt"></i> Fullscreen</button>
</div>
<div class="win-header-panel"><span>Receivables And Receipt Schedule</span></div>
<div id="rsMessage"></div>

<div class="filters">
    <div class="gb" style="width:1000px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 90px 210px 80px 120px 80px 120px 80px 190px;">
            <span class="lbl">Parent Category</span>
            <select id="parentCategory" class="inp" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select>
            <label class="chk"><input type="checkbox" id="chkFrom" onchange="rsDateToggled('From')"> Date From</label>
            <input type="date" id="fromDate" class="inp">
            <label class="chk"><input type="checkbox" id="chkTo" onchange="rsDateToggled('To')"> Date To</label>
            <input type="date" id="toDate" class="inp">
            <span class="lbl">Control Account</span>
            <div style="grid-row: span 3; align-self:start;"><select id="controlAccounts" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Account Title"></select></div>

            <span class="lbl">Custom Group</span>
            <select id="customGroup" class="inp" data-dtcombo="single" data-dtcombo-caption="Custom Group"></select>
            <!-- datDueFrom starts UNTICKED (:1518) -->
            <label class="chk"><input type="checkbox" id="chkDueFrom" onchange="rsDateToggled('DueFrom')"> Due From</label>
            <input type="date" id="dueFrom" class="inp">
            <label class="chk"><input type="checkbox" id="chkDueUpto" onchange="rsDateToggled('DueUpto')"> Due Up To</label>
            <input type="date" id="dueUpto" class="inp">
            <span></span>

            <span class="lbl">Customer Group</span>
            <select id="customerGroup" class="inp" data-dtcombo="single" data-dtcombo-caption="Customer Group"></select>
            <label class="chk"><input type="checkbox" id="chkSaleFrom" onchange="rsDateToggled('SaleFrom')"> Sale From</label>
            <input type="date" id="saleFrom" class="inp">
            <label class="chk"><input type="checkbox" id="chkSaleTo" onchange="rsDateToggled('SaleTo')"> Sale To</label>
            <input type="date" id="saleTo" class="inp">
            <span></span>

            <span class="lbl">Interval Days</span>
            <input type="number" id="intervalDays" class="inp" value="15" oninput="rsIntervalChanged()" style="width:80px">
            <!-- Branches is hidden entirely when ERP feature 17 is off (:141-147) -->
            <span id="branchWrap" style="display:none; grid-column: span 4;">
                <span style="display:flex;gap:6px;align-items:center"><span class="lbl" style="width:74px">Branches</span>
                <span style="width:220px"><select id="branches" class="inp" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></span></span>
            </span>
            <span style="grid-column: -2 / -1;"><button type="button" class="win-btn-show" id="btnShow" onclick="rsShow(this)"><i class="fa fa-search"></i> Show</button></span>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Filtered Records</span></div>
<div class="grid-wrap" id="rsGridWrap">
    <table class="wg" id="rsGrid">
        <thead id="rsHead"></thead>
        <tbody id="rsBody"></tbody>
        <tfoot id="rsFoot"></tfoot>
    </table>
</div>
<div id="rsEmpty" class="rs-empty" style="display:none;">Press Show to read the schedule.</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
