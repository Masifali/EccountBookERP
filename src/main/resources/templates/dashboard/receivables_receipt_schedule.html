<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receivables And Receipt Schedule</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

    <style>
        html, body { max-width:100%; overflow-x:hidden; }
        body { font-family:"Segoe UI","Tahoma","Geneva","Verdana",sans-serif; background:#e4e9ed;
               font-size:11px; color:#222; margin:0; padding:0; }

        .win-title-bar { background:#0f5959; color:#fff; font-size:15px; font-weight:bold; padding:6px 12px; }
        .win-sub-header { font-size:10px; color:#4f5d65; padding:2px 10px; background:#d8e0e6;
                          border-bottom:1px solid #b0bec5; }
        .win-toolbar { background:linear-gradient(to bottom,#fff 0%,#e3e8ee 100%);
                       border-bottom:1px solid #b0bec5; padding:3px 8px; display:flex; gap:4px;
                       align-items:center; flex-wrap:wrap; }
        .win-btn { background:#fff; border:1px solid #90a4ae; border-radius:2px; padding:3px 10px;
                   font-size:11px; font-weight:600; color:#263238; cursor:pointer;
                   display:inline-flex; align-items:center; gap:5px; height:25px; text-decoration:none; }
        .win-btn:hover { background:#e0f2f1; border-color:#0f5959; color:#004d40; text-decoration:none; }
        .win-btn-teal { background:#0f5959; color:#fff; border-color:#083b3b; }
        .win-btn-teal:hover { background:#083b3b; color:#fff; }
        .win-btn:disabled { opacity:.55; cursor:default; }

        .win-form-card { background:#fff; border:1px solid #b0bec5; border-radius:3px;
                         padding:8px 10px; margin:8px; }
        .win-group-box { border:1px solid #c7d0d6; border-radius:2px; padding:12px 10px 8px;
                         position:relative; }
        .win-group-title { position:absolute; top:-8px; left:8px; background:#fff; padding:0 5px;
                           font-size:11px; font-weight:700; color:#0f5959; }
        .win-label { display:block; font-size:10px; color:#41525c; margin:0 0 2px; font-weight:600;
                     white-space:nowrap; }
        .win-label input[type=checkbox] { margin-right:3px; vertical-align:-1px; }
        .win-input { border:1px solid #7f9db9; border-radius:0; font-size:11px; height:24px;
                     padding:1px 4px; width:100%; box-sizing:border-box; background:#fff; }
        .win-input:disabled { background:#f2f4f6; color:#888; }

        .btn-busy { position:relative; color:transparent !important; pointer-events:none; }
        .btn-busy::after { content:""; position:absolute; top:50%; left:50%; width:11px; height:11px;
                           margin:-6px 0 0 -6px; border:2px solid rgba(0,0,0,.25);
                           border-top-color:#00564C; border-radius:50%;
                           animation:btnspin .6s linear infinite; }
        @keyframes btnspin { to { transform:rotate(360deg); } }

        #rsMessage { display:none; margin:6px 8px; padding:4px 8px; font-size:11px; font-weight:bold; }
        #rsMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        #rsMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }

        /* Full page width, and the only horizontal scrollbar is INSIDE this container. */
        .rs-grid-wrap { margin:0 8px 8px; background:#fff; border:1px solid #b0bec5;
                        max-height:calc(100vh - 300px); overflow:auto; }
        body.rs-full .rs-grid-wrap { max-height:calc(100vh - 86px); }

        table.rs-grid { border-collapse:separate; border-spacing:0; font-size:11px;
                        width:max-content; min-width:100%; }
        table.rs-grid thead th { position:sticky; top:0; z-index:2; background:#dde5ea;
                                 border-right:1px solid #c3ced6; border-bottom:1px solid #90a4ae;
                                 padding:3px 6px; font-weight:700; color:#23343c; text-align:center;
                                 white-space:nowrap; line-height:1.2; }
        table.rs-grid tbody td { border-right:1px solid #eceff1; border-bottom:1px solid #eceff1;
                                 padding:2px 6px; white-space:nowrap; }
        table.rs-grid tbody tr:nth-child(even) td { background:#f7f9fa; }
        table.rs-grid tbody tr:hover td { background:#e0f2f1; }
        table.rs-grid tbody tr.rs-group td { background:#cfd8dc !important; font-weight:700;
                                             color:#0f5959; }
        table.rs-grid tfoot td { position:sticky; bottom:0; z-index:2; background:#e0f2f1;
                                 border-top:1px solid #0f5959; font-weight:700; color:#0f5959;
                                 padding:3px 6px; white-space:nowrap; }
        .rs-num { text-align:right; }
        .rs-ctr { text-align:center; }
        .rs-neg { color:#b00020; }
        a.rs-link { color:#0d47a1; text-decoration:underline; cursor:pointer; }
        a.rs-link:hover { color:#b00020; }
        .rs-link-off { color:#546e7a; text-decoration:underline dotted; cursor:pointer; }

        .rs-empty { background:#fff; border:1px dashed #b0bec5; color:#667; padding:12px;
                    text-align:center; margin:0 8px; font-size:11px; }
        .rs-count { font-size:10px; color:#4f5d65; padding:2px 10px; }
        body.rs-full { position:fixed; inset:0; z-index:3000; overflow:auto; background:#e4e9ed; }
        .select2-container .select2-selection--single,
        .select2-container .select2-selection--multiple { border-radius:0; border-color:#7f9db9;
                                                          min-height:24px; font-size:11px; }
    </style>
</head>
<body>

<!-- ==========================================================================
     Receivables And Receipt Schedule
     ditto Architecture.WinApp.Account_Reports\ReceivablesAndReceiptSchedule.cs (1,812 lines)

     The desktop file's methods are still called PayablesAndPaymentSchedule_* - the form was
     copied from that one and never renamed. Its caption (:1752, :1788) and its procedure are
     the receivables ones.

     Controls, in the desktop's own order (groupBox1 "Filters"):
       label9  "Parent Category"  CmbParentCategory
       label27 "Date From"  datDateFrom     label1 "Date To"    datDateTo
       label3  "Due From"   datDueFrom      label2 "Due Up To"  datDueUpto
       label6  "Sale From"  datSaleFrom     label4 "Sale To"    datSaleTo
       label5  "Interval Days" txtIntervalDays (designer default "15", :1430)
       label11 "Control Account" cmbAccount  - multi-select, checked list
       label7  "Custom Group"    CmbCustomGroups
       label10 "Customer Group"  CmbCustomerGroup
       Branches "Branches"       CmbBranches - shown only under ERP feature 17
       btnshow "Show"
     toolStrip3: btnNew "&New", print "121_02 Print", btnShortCut "ShortCut Keys"

     Events ported:
       PayablesAndPaymentSchedule_Load     :132-163
       btnshow_Click                       :165-181
       gridHistory                         :183-293
       GridSetting                         :295-442   captions, hidden columns, links, sums
       btnNew_Click -> Reset               :630-655
       txtIntervalDays_TextChanged         :807-818   Sale From = today - interval days
       PayablesAndPaymentSchedule_KeyDown  :674-720   Ctrl+S Show, Ctrl+P Print, Ctrl+N New,
                                                      Esc / Ctrl+E Close, Ctrl+F5 and Ctrl+Up
                                                      focus Date From, Ctrl+Down focus the grid
       grdPayablesAndSchedule_LinkClicked  :819-916   AccountCode, BalQty and SaleAmount links

     All six date pickers are tick boxes on the desktop (ShowCheckBox at :1500-1619); only
     datDueFrom starts unticked (:1518). An unticked date is NOT SENT AT ALL, which is not the
     same as sending NULL - see the service for the parameter contract.

     Read-only screen: the desktop form has no save, update, delete or History button, so this
     page has none either.
     ========================================================================== -->
<div class="win-title-bar">Receivables And Receipt Schedule</div>
<div class="win-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard" style="color:#4f5d65;">DashBoard</a>
        &gt; Exective DashBoards &gt; Receivables And Receipt Schedule</span>
</div>

<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="rsNew(this)">
        <i class="fa fa-file-o"></i> New
    </button>
    <button type="button" class="win-btn" id="btnPrint" onclick="rsPrint(this)">
        <i class="fa fa-print"></i> Print
    </button>
    <button type="button" class="win-btn" onclick="rsShortcuts()">
        <i class="fa fa-keyboard-o"></i> ShortCut Keys
    </button>
    <a class="win-btn" href="/dashboard"><i class="fa fa-arrow-left"></i> Back to DashBoard</a>
    <span style="flex:1;"></span>
    <span class="rs-count" id="rsCount"></span>
    <button type="button" class="win-btn" onclick="rsToggleFullscreen()">
        <i class="fa fa-arrows-alt"></i> Fullscreen
    </button>
</div>

<div id="rsMessage"></div>

<div class="win-form-card">
    <div class="win-group-box">
        <div class="win-group-title">Filters</div>

        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="win-label">Parent Category</label>
                <select id="parentCategory" class="win-input rs-select2"></select>
            </div>

            <!-- datDateFrom, ticked by default -->
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkFrom" onchange="rsDateToggled('From')"> Date From
                </label>
                <input type="date" id="fromDate" class="win-input">
            </div>
            <!-- datDateTo, ticked by default. NOTE: this tick box also gates Due Up To,
                 exactly as the desktop does at :203-206. -->
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkTo" onchange="rsDateToggled('To')"> Date To
                </label>
                <input type="date" id="toDate" class="win-input">
            </div>
            <!-- datDueFrom, UNTICKED by default (:1518) -->
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkDueFrom" onchange="rsDateToggled('DueFrom')"> Due From
                </label>
                <input type="date" id="dueFrom" class="win-input">
            </div>
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkDueUpto" onchange="rsDateToggled('DueUpto')"> Due Up To
                </label>
                <input type="date" id="dueUpto" class="win-input">
            </div>
        </div>

        <div class="row g-2 align-items-end" style="margin-top:6px;">
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkSaleFrom" onchange="rsDateToggled('SaleFrom')"> Sale From
                </label>
                <input type="date" id="saleFrom" class="win-input">
            </div>
            <div class="col-md-2">
                <label class="win-label">
                    <input type="checkbox" id="chkSaleTo" onchange="rsDateToggled('SaleTo')"> Sale To
                </label>
                <input type="date" id="saleTo" class="win-input">
            </div>
            <div class="col-md-1">
                <label class="win-label">Interval Days</label>
                <input type="number" id="intervalDays" class="win-input" value="15"
                       oninput="rsIntervalChanged()">
            </div>
            <div class="col-md-3">
                <label class="win-label">Control Account</label>
                <select id="controlAccounts" class="win-input rs-select2" multiple></select>
            </div>
            <div class="col-md-2">
                <label class="win-label">Custom Group</label>
                <select id="customGroup" class="win-input rs-select2"></select>
            </div>
            <div class="col-md-2">
                <label class="win-label">Customer Group</label>
                <select id="customerGroup" class="win-input rs-select2"></select>
            </div>
        </div>

        <div class="row g-2 align-items-end" style="margin-top:6px;">
            <!-- Branches is hidden entirely when ERP feature 17 is off (:141-147) -->
            <div class="col-md-3" id="branchWrap" style="display:none;">
                <label class="win-label">Branches</label>
                <select id="branches" class="win-input rs-select2"></select>
            </div>
            <div class="col-md-2">
                <button type="button" class="win-btn win-btn-teal" id="btnShow" onclick="rsShow(this)">
                    <i class="fa fa-search"></i> Show
                </button>
            </div>
        </div>
    </div>
</div>

<div class="rs-grid-wrap" id="rsGridWrap">
    <table class="rs-grid" id="rsGrid">
        <thead id="rsHead"></thead>
        <tbody id="rsBody"></tbody>
        <tfoot id="rsFoot"></tfoot>
    </table>
</div>
<div id="rsEmpty" class="rs-empty" style="display:none;">Press Show to read the schedule.</div>
<div style="height:16px;"></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_receivables_receipt_schedule.js?v=20260920a}"></script>
</body>
</html>
