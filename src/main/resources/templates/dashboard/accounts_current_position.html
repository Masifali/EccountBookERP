<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts Current Postition (Dashboard)</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

    <style>
        html, body { max-width:100%; overflow-x:hidden; }
        body { font-family:"Segoe UI","Tahoma","Geneva","Verdana",sans-serif; background:#e4e9ed;
               font-size:11px; color:#222; margin:0; padding:0; }

        .win-title-bar { background:#0f5959; color:#fff; font-size:15px; font-weight:bold; padding:6px 12px; }
        .win-sub-header { font-size:10px; color:#4f5d65; padding:2px 10px; background:#d8e0e6;
                          border-bottom:1px solid #b0bec5; }
        .win-toolbar { background:linear-gradient(to bottom,#fff 0%,#e3e8ee 100%);
                       border-bottom:1px solid #b0bec5; padding:3px 8px; display:flex; gap:4px;
                       align-items:center; flex-wrap:wrap; }
        .win-btn { background:#fff; border:1px solid #90a4ae; border-radius:2px; padding:3px 10px;
                   font-size:11px; font-weight:600; color:#263238; cursor:pointer;
                   display:inline-flex; align-items:center; gap:5px; height:25px; text-decoration:none; }
        .win-btn:hover { background:#e0f2f1; border-color:#0f5959; color:#004d40; text-decoration:none; }
        .win-btn-teal { background:#0f5959; color:#fff; border-color:#083b3b; }
        .win-btn-teal:hover { background:#083b3b; color:#fff; }
        .win-btn:disabled { opacity:.55; cursor:default; }

        .win-form-card { background:#fff; border:1px solid #b0bec5; border-radius:3px;
                         padding:8px 10px; margin:8px; }
        .win-group-box { border:1px solid #c7d0d6; border-radius:2px; padding:10px 10px 8px;
                         position:relative; }
        .win-group-title { position:absolute; top:-8px; left:8px; background:#fff; padding:0 5px;
                           font-size:11px; font-weight:700; color:#0f5959; }
        .win-label { display:block; font-size:10px; color:#41525c; margin:0 0 2px; font-weight:600; }
        .win-input { border:1px solid #7f9db9; border-radius:0; font-size:11px; height:24px;
                     padding:1px 4px; width:100%; box-sizing:border-box; background:#fff; }
        .win-input:disabled { background:#f2f4f6; color:#888; }

        .btn-busy { position:relative; color:transparent !important; pointer-events:none; }
        .btn-busy::after { content:""; position:absolute; top:50%; left:50%; width:11px; height:11px;
                           margin:-6px 0 0 -6px; border:2px solid rgba(0,0,0,.25);
                           border-top-color:#00564C; border-radius:50%;
                           animation:btnspin .6s linear infinite; }
        @keyframes btnspin { to { transform:rotate(360deg); } }

        #apMessage { display:none; margin:6px 8px; padding:4px 8px; font-size:11px; font-weight:bold; }
        #apMessage.ok  { display:block; background:#e6f4ea; color:#0a6b2e; border:1px solid #a8d5b5; }
        #apMessage.err { display:block; background:#fdecea; color:#a3160b; border:1px solid #f0b3ad; }

        .ap-sect { font-weight:700; color:#0f5959; font-size:12px; margin:12px 8px 4px;
                   padding-bottom:3px; border-bottom:1px solid #b0bec5; }
        .ap-wrap { display:flex; flex-wrap:wrap; gap:10px; padding:0 8px; align-items:flex-start; }

        /* AccountsDashboardCard: a title, then Opening / Dr / Cr / Difference / Closing. */
        .ap-card { width:270px; background:#fff; border:1px solid #cfd8dc; border-radius:2px;
                   display:flex; flex-direction:column; cursor:pointer;
                   box-shadow:0 1px 2px rgba(0,0,0,.08); }
        .ap-card:hover { box-shadow:0 3px 10px rgba(0,0,0,.18); }
        .ap-card .t { background:#0f5959; color:#fff; font-size:11px; font-weight:700;
                      padding:5px 8px; line-height:1.25; }
        .ap-card .b { padding:6px 8px 8px; }
        .ap-row { display:flex; justify-content:space-between; gap:8px; padding:2px 0;
                  border-bottom:1px solid #eef2f4; }
        .ap-row:last-child { border-bottom:none; }
        .ap-row span:first-child { color:#5a6b73; }
        .ap-row span:last-child { font-weight:700; color:#23343c; }
        .ap-row.closing span:last-child { color:#0f5959; }
        .neg { color:#b00020 !important; }
        /* DiffStatus is text on the desktop, so it is shown as text with a dot, never colour alone. */
        .ap-status { font-size:10px; color:#5a6b73; padding:3px 8px 6px; }
        .ap-status i { width:8px; height:8px; border-radius:50%; display:inline-block;
                       margin-right:5px; background:#8a97a0; vertical-align:middle; }

        /* FcyPayablesReceivablesHeaderCard with its per-currency lines. */
        .ap-fcard { width:400px; background:#fff; border:1px solid #cfd8dc; border-radius:2px;
                    display:flex; flex-direction:column; cursor:pointer;
                    box-shadow:0 1px 2px rgba(0,0,0,.08); }
        .ap-fcard:hover { box-shadow:0 3px 10px rgba(0,0,0,.18); }
        .ap-fcard .t { background:#0f5959; color:#fff; font-size:11px; font-weight:700; padding:5px 8px; }
        table.ap-grid { width:max-content; min-width:100%; border-collapse:collapse; font-size:11px; }
        table.ap-grid th { background:#eef2f4; border-bottom:1px solid #cfd8dc; padding:3px 5px;
                           font-weight:700; color:#33454e; white-space:nowrap; }
        table.ap-grid td { border-bottom:1px solid #f0f4f6; padding:2px 5px; white-space:nowrap; }
        table.ap-grid tfoot td { background:#e0f2f1; font-weight:700; color:#0f5959;
                                 border-top:1px solid #0f5959; }
        .num { text-align:right; }

        .ap-empty { background:#fff; border:1px dashed #b0bec5; color:#667; padding:12px;
                    text-align:center; margin:0 8px; font-size:11px; }
        .ap-full { position:fixed; inset:0; z-index:3000; background:#e4e9ed; overflow:auto; }
    </style>
</head>
<body>

<!-- ==========================================================================
     Accounts Current Postition (Dashboard)
     ditto Architecture.WinApp.Account_Reports\AcFrmDashboard.cs (1,580 lines)

     The form lives in Account_Reports, not the Dashboard project - which is why an earlier
     search missed it. It backs TWO DashBoard entries: this screen appears under both
     Accounts Dashboard and Exective DashBoards.

     Controls, in the desktop's own order:
       label8 "Perameter" cmbperemeter, label17 "Date From", label18 "Date To",
       label2 "Company" CmbCompany, Branches CmbBranches, btnsearch "Search"
       flowLayoutPanel                 the AccountsDashboardCard cards
       label1 "Fcy Receivables Payables" + FcyPayablesRcvablesFlowLayout
                                        - the label is hidden when there are no FCY rows
                                          (:210, :258-262)

     Events ported:
       AcFrmDashboard_Load             :492-517
       cmbperemeter_SelectedIndexChanged :533-568
       btnsearch_Click                 :519-531
       UserControl_Click               :357-424  a card opens its account report
       FcyPayablesRcvablesControl_Click :267-314 an FCY card re-reads with its own type

     The Company picker is a checked list only for a head-office user; otherwise the desktop
     fixes it to the signed-in company and disables it (:452-462). Reproduced.

     Read-only: no save, update, delete or History button on the desktop form.
     ========================================================================== -->
<div class="win-title-bar">Accounts Current Postition (Dashboard)</div>
<div class="win-sub-header">
    <span>&#128193; Screens &gt; <a href="/dashboard" style="color:#4f5d65;">DashBoard</a>
        &gt; Accounts Dashboard &gt; Accounts Current Postition</span>
</div>

<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="apRefresh(this)">
        <i class="fa fa-refresh"></i> Refresh
    </button>
    <a class="win-btn" href="/dashboard"><i class="fa fa-arrow-left"></i> Back to DashBoard</a>
    <span style="flex:1;"></span>
    <button type="button" class="win-btn" onclick="apToggleFullscreen()">
        <i class="fa fa-arrows-alt"></i> Fullscreen
    </button>
</div>

<div id="apMessage"></div>

<div class="win-form-card">
    <div class="win-group-box">
        <div class="win-group-title">Filters</div>
        <div class="row g-2 align-items-end">
            <!-- label8 "Perameter" - the five choices are hard-coded on the desktop (:475-482) -->
            <div class="col-md-2">
                <label class="win-label">Perameter</label>
                <select id="parameter" class="win-input" onchange="apParameterChanged()">
                    <option value="1">This Day</option>
                    <option value="2">This Week</option>
                    <option value="3">This Month</option>
                    <option value="4">This Year</option>
                    <option value="5">Financial Year</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="win-label">Date From</label>
                <input type="date" id="fromDate" class="win-input">
            </div>
            <div class="col-md-2">
                <label class="win-label">Date To</label>
                <input type="date" id="toDate" class="win-input">
            </div>
            <div class="col-md-3">
                <label class="win-label">Company</label>
                <select id="companies" class="win-input ap-select2" multiple></select>
            </div>
            <div class="col-md-2" id="branchWrap">
                <label class="win-label">Branches</label>
                <select id="branches" class="win-input ap-select2" multiple></select>
            </div>
            <div class="col-md-1">
                <button type="button" class="win-btn win-btn-teal" id="btnSearch" onclick="apSearch(this)">
                    <i class="fa fa-search"></i> Search
                </button>
            </div>
        </div>
    </div>
</div>

<div id="apCards" class="ap-wrap"></div>
<div id="apEmpty" class="ap-empty" style="display:none;">Loading...</div>

<!-- label1, hidden when there are no FCY rows -->
<div id="apFcySect" class="ap-sect" style="display:none;">Fcy Receivables Payables</div>
<div id="apFcy" class="ap-wrap"></div>

<div style="height:16px;"></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_accounts_current_position.js?v=20260920a}"></script>
</body>
</html>
