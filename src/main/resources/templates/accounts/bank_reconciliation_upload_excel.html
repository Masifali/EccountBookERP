<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Reconciliation Upload Excel Sheet - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <!-- SheetJS for client-side Excel parse/download -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            font-size: 12px;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Top Header Bar */
        .erp-header {
            background-color: #00796B;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toolbar Bar */
        .erp-toolbar {
            background-color: #e2e8f0;
            border-bottom: 1px solid #cbd5e1;
            padding: 6px 15px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-erp {
            background-color: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 3px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-erp:hover {
            background-color: #f1f5f9;
            border-color: #64748b;
        }

        .btn-erp-primary {
            background-color: #00796B;
            color: white;
            border: 1px solid #004d40;
        }

        .btn-erp-primary:hover {
            background-color: #004d40;
            color: white;
        }

        /* Form Header Section */
        .erp-section {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 12px 15px;
            margin: 10px 15px;
        }

        .form-group-inline {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-group-inline label {
            font-weight: bold;
            color: #334155;
            margin-bottom: 0;
        }

        .form-control-erp {
            border: 1px solid #94a3b8;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 12px;
            height: 30px;
        }

        .icon-action-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #00796B;
        }

        .icon-action-btn:hover {
            background: #e2e8f0;
        }

        /* Tabs System */
        .tab-nav {
            display: flex;
            border-bottom: 2px solid #00796B;
            margin: 0 15px;
            background: #e2e8f0;
        }

        .tab-button {
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background: #cbd5e1;
            color: #475569;
        }

        .tab-button.active {
            background: #00796B;
            color: white;
            border-color: #00796B;
        }

        .tab-content {
            display: none;
            padding: 15px;
        }

        .tab-content.active {
            display: block;
        }

        /* Dual Grid Container */
        .dual-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-box {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 10px;
            min-height: 400px;
        }

        .grid-header {
            font-weight: bold;
            color: #00796B;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Data Tables */
        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .erp-table th {
            background-color: #00796B;
            color: white;
            padding: 6px 8px;
            text-align: left;
            border: 1px solid #004d40;
            position: sticky;
            top: 0;
        }

        .erp-table td {
            padding: 4px 6px;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
        }

        .erp-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .erp-table tr:hover {
            background-color: #e0f2f1;
        }

        .erp-table input {
            width: 100%;
            border: 1px solid #cbd5e1;
            padding: 2px 4px;
            font-size: 11px;
            box-sizing: border-box;
        }

        .btn-row-action {
            padding: 1px 6px;
            font-size: 11px;
            border-radius: 2px;
            border: none;
            cursor: pointer;
        }

        .btn-del { background-color: #ef4444; color: white; }
        .btn-add { background-color: #10b981; color: white; }

        /* Shortcut keys modal */
        .shortcut-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .shortcut-card {
            background: white;
            border-radius: 6px;
            padding: 20px;
            width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .shortcut-card h4 {
            margin-top: 0;
            color: #00796B;
            border-bottom: 2px solid #00796B;
            padding-bottom: 6px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
    <style>
        .br-tool { background: #f0f0f0; border-bottom: 1px solid #bbb; padding: 3px 8px; display: flex; gap: 4px; align-items: center; }
        .br-tool button { font-size: 11px; }
        .br-hdr { background: #008080; color: #fff; padding: 5px 10px; font-weight: bold; font-size: 13px; }
        .br-tabs { display: flex; gap: 2px; padding: 6px 8px 0 8px; }
        .br-tabs button { border: 1px solid #999; border-bottom: none; background: #ddd; padding: 4px 12px; font-size: 11px; }
        .br-tabs button.active { background: #fff; font-weight: bold; }
        .br-pane { display: none; background: #fff; margin: 0 8px 8px 8px; border: 1px solid #999; padding: 8px; font-size: 11px; }
        .br-pane.active { display: block; }
        .br-grid { width: 100%; border-collapse: collapse; font-size: 11px; }
        .br-grid th { background: #e8eef2; border: 1px solid #ccc; padding: 3px 5px; position: sticky; top: 0; white-space: nowrap; }
        .br-grid td { border: 1px solid #e0e0e0; padding: 1px 4px; white-space: nowrap; }
        .br-grid input { width: 100%; border: none; font-size: 11px; background: transparent; }
        .br-wrap { max-height: 420px; overflow: auto; border: 1px solid #ccc; }
        .br-sec { background: #008080; color: #fff; padding: 3px 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .br-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
        .br-row select, .br-row input[type=date] { height: 24px; font-size: 11px; }
    </style>

    <div class="br-tool">
        <button type="button" class="btn btn-default btn-xs" id="btnnew">New</button>
        <button type="button" class="btn btn-default btn-xs" id="BtnRefresh">Refresh</button>
        <button type="button" class="btn btn-default btn-xs" id="btnSave">Save</button>
        <button type="button" class="btn btn-default btn-xs" id="btnUpdate">Edit</button>
        <button type="button" class="btn btn-default btn-xs" id="btnUpdateRecords" style="display:none;">Update</button>
        <button type="button" class="btn btn-default btn-xs" id="btnShortCutKey">ShortCut Keys</button>
        <a th:href="@{/accounts/dashboard}" style="margin-left:auto; font-size:11px;"><i class="fa fa-arrow-left"></i> Back to Accounts Dashboard</a>
    </div>
    <div class="br-hdr">Chart Of Account Data Upload</div>
    <div class="br-tabs">
        <button type="button" class="active" data-pane="tabForm">Form</button>
        <button type="button" data-pane="tabhistory">History</button>
    </div>

    <div class="br-pane active" id="tabForm">
        <div class="br-row">
            <label style="margin:0;">Bank Account</label>
            <select id="cmbaccounttitle" style="min-width:280px;"></select>
            <button type="button" class="btn btn-default btn-xs" id="btndownload" title="Download Pic"><i class="fa fa-download"></i> Download Pic</button>
            <button type="button" class="btn btn-default btn-xs" id="btnUpload" title="Upload Pic"><i class="fa fa-upload"></i> Upload Pic</button>
            <input type="file" id="fileUpload" accept=".xlsx" style="display:none;"/>
            <span style="color:#555;">Click 'Download Pic' to download the template, or 'Upload Pic' to upload the sheet.</span>
        </div>
        <div class="row">
            <div class="col-md-7">
                <div class="br-sec">Sheet Data</div>
                <div class="br-wrap">
                    <table class="br-grid" id="grdExcelDataView"><thead></thead><tbody></tbody></table>
                </div>
            </div>
            <div class="col-md-5">
                <div class="br-sec">History Of Selected Record <button type="button" class="btn btn-default btn-xs" id="BtnShow" style="color:#000;">Show</button></div>
                <div class="br-wrap">
                    <table class="br-grid" id="grdAccountHistory"><thead></thead><tbody></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div class="br-pane" id="tabhistory">
        <div class="br-tool" style="border:1px solid #ccc;">
            <button type="button" class="btn btn-default btn-xs" id="BtnNewHistory">New</button>
            <button type="button" class="btn btn-default btn-xs" id="BtnRefreshHistory">Refresh</button>
        </div>
        <div class="br-hdr" style="margin-top:4px;">Bank Reconciliation With Vouchers History</div>
        <fieldset style="border:1px solid #bbb; padding:4px 8px; margin:4px 0;">
            <legend style="font-size:11px; width:auto; border:none; margin:0;">Filters</legend>
            <div class="br-row">
                <label style="margin:0;">Date Type</label>
                <select id="cmbDateTypeHistory">
                    <option value="0">Select...</option><option value="1">This Day</option><option value="2">This Week</option>
                    <option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option>
                </select>
                <label style="margin:0;">Date From,To</label>
                <input type="checkbox" id="chkFrom" checked/><input type="date" id="txtFromdateHistory"/>
                <input type="checkbox" id="chkTo" checked/><input type="date" id="txtToDateHistory"/>
                <label style="margin:0; font-weight:normal;"><input type="radio" name="rdDate" id="rdentrydate" value="entry" checked/> Entry Date</label>
                <label style="margin:0; font-weight:normal;"><input type="radio" name="rdDate" id="rdmodifydate" value="modify"/> Modify Date</label>
                <label style="margin:0;">Bank Account</label>
                <select id="CmbCustomerHistory" style="min-width:220px;"></select>
                <button type="button" class="btn btn-default btn-xs" id="BtnShowhistory">Show</button>
            </div>
        </fieldset>
        <div style="font-weight:bold; margin:4px 0;">Filtered Records</div>
        <div class="br-wrap">
            <table class="br-grid" id="grdHistory"><thead></thead><tbody></tbody></table>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        /* frmBankReconciliationUploadExcelSheet, event for event (see BankReconUploadDesktopService). */
        (function () {
            var API = '/accounts/api/bank-reconciliation-upload';
            var L = {}, sheet = [], removed = [], updateMode = false;
            var COLS = ['TransactionDate', 'ChequeNo', 'Particulars', 'Debit', 'Credit'];
            function v(r, k) { if (!r) return null; if (r[k] !== undefined) return r[k]; var l = k.toLowerCase(); for (var x in r) if (x.toLowerCase() === l) return r[x]; return null; }
            function s(x) { return x == null ? '' : String(x); }
            function esc(x) { return s(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
            function bind(sel, rows, idKey, textKey) {
                var cur = $(sel).val(), html = '<option value=""></option>';
                (rows || []).forEach(function (r) { html += '<option value="' + esc(v(r, idKey)) + '">' + esc(v(r, textKey)) + '</option>'; });
                $(sel).html(html);
                if (cur && $(sel).find('option[value="' + cur + '"]').length) $(sel).val(cur);
            }
            function selText(sel) { var o = $(sel).find('option:selected'); return o.length && o.val() !== '' ? o.text() : ''; }
            function toDateStr(x) {
                if (x instanceof Date) return isNaN(x.getTime()) ? '' : ymd(x);
                var d = new Date(x); return isNaN(d.getTime()) ? s(x).substring(0, 10) : ymd(d);
            }

            /* FillExcelGrid: sorted by TransactionDate; columns X, +, RNo(Id), TransactionDate, ChequeNo, Particulars, Debit, Credit */
            function fillSheet() {
                sheet.sort(function (a, b) { return s(a.transactionDate).localeCompare(s(b.transactionDate)); });
                $('#grdExcelDataView thead').html(sheet.length ? '<tr><th>X</th><th>+</th><th>RNo</th><th>TransactionDate</th><th>ChequeNo</th><th>Particulars</th><th>Debit</th><th>Credit</th></tr>' : '');
                $('#grdExcelDataView tbody').html(sheet.map(function (r, i) {
                    return '<tr data-i="' + i + '"><td><button type="button" class="btn btn-default btn-xs x-del">X</button></td><td><button type="button" class="btn btn-default btn-xs x-add">+</button></td>'
                        + '<td>' + esc(r.id) + '</td>'
                        + '<td><input type="date" data-k="transactionDate" value="' + esc(r.transactionDate) + '"/></td>'
                        + '<td><input type="text" data-k="chequeNo" value="' + esc(r.chequeNo) + '"/></td>'
                        + '<td><input type="text" data-k="particulars" value="' + esc(r.particulars) + '"/></td>'
                        + '<td><input type="text" data-k="debit" value="' + esc(r.debit) + '" style="text-align:right;"/></td>'
                        + '<td><input type="text" data-k="credit" value="' + esc(r.credit) + '" style="text-align:right;"/></td></tr>';
                }).join(''));
            }
            function addRow() { sheet.push({ transactionDate: ymd(new Date()), chequeNo: '', particulars: '', debit: 0, credit: 0, id: 0 }); fillSheet(); }
            function deleteRow(i) {
                if (!confirm('Are you sure to Delete?')) return;
                var r = sheet[i];
                if (parseInt(r.id || 0) > 0) removed.push(r);
                sheet.splice(i, 1);
                fillSheet();
            }

            function historyGrid(sel, rows, hideAccount) {
                var cols = ['AccountTitle', 'AccountCode', 'TransactionDate', 'ChequeNo', 'Particulars', 'Debit', 'Credit', 'IsReconciled', 'Remarks', 'EntryDate', 'EntryUser', 'ModifyDate', 'ModifyUser'];
                if (hideAccount) cols = cols.slice(2);
                if (!rows || rows.length === 0) { $(sel + ' thead, ' + sel + ' tbody').html(''); return; }
                $(sel + ' thead').html('<tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>');
                $(sel + ' tbody').html(rows.map(function (r) {
                    return '<tr>' + cols.map(function (c) {
                        var x = v(r, c);
                        if (c === 'TransactionDate') x = toDateStr(x);
                        if (c === 'IsReconciled') x = (x === true || s(x) === '1' || s(x).toLowerCase() === 'true') ? 'True' : 'False';
                        return '<td>' + esc(x) + '</td>';
                    }).join('') + '</tr>';
                }).join(''));
            }

            function load() {
                $.get(API + '/lookups', function (res) {
                    L = res;
                    bind('#cmbaccounttitle', res.bankAccounts, 'Id', 'AccountTitle');
                    bind('#CmbCustomerHistory', res.historyBanks, 'Id', 'name');
                    var days = parseInt(res.defaultDaysToLess || 0);
                    var f = new Date(); f.setDate(f.getDate() - (days > 0 ? days : 3));
                    $('#txtFromdateHistory').val(ymd(f));
                    $('#txtToDateHistory').val(ymd(new Date()));
                    $('#cmbaccounttitle').focus();
                });
            }

            /* Insert() */
            function insert(isUpdate) {
                updateMode = isUpdate;
                if ($.trim(selText('#cmbaccounttitle')) === '') { $('#cmbaccounttitle').focus(); alert('Exception From Insert Method:Please select an account title.'); return; }
                if (!confirm(isUpdate ? 'Are you sure to Update?' : 'Are you sure to Save?')) return;
                if (sheet.length <= 0) return;
                $.ajax({ url: API + '/save', type: 'POST', contentType: 'application/json',
                    data: JSON.stringify({ bankAccountId: parseInt($('#cmbaccounttitle').val() || 0), bankAccountText: selText('#cmbaccounttitle'),
                                           updateMode: isUpdate, rows: sheet, removed: isUpdate ? removed : [] }),
                    success: function (res) {
                        if (!res.success) { alert(res.message); return; }
                        if (res.message) { alert(res.message); sheet = []; fillSheet(); }
                        newForm();
                    },
                    error: function (x) { alert('Server error: ' + (x.responseText || x.status)); } });
            }

            /* btnnew_Click */
            function newForm() {
                removed = [];
                $('#btnSave').show(); $('#btnUpdateRecords').hide();
                $('#cmbaccounttitle').val('');
                sheet = []; fillSheet();
                $('#grdAccountHistory thead, #grdAccountHistory tbody').html('');
                $('#cmbaccounttitle').focus();
            }

            /* btnUpdate_Click ("Edit") */
            function edit() {
                if ($.trim(selText('#cmbaccounttitle')) === '') { $('#cmbaccounttitle').focus(); alert('Please select an account title.'); return; }
                if (sheet.length > 0 && !confirm('Are you sure to Edit! If yes then the data in sheet data grid will be clear?')) return;
                removed = []; sheet = [];
                $.get(API + '/history', { bankAccountId: parseInt($('#cmbaccounttitle').val() || 0), dateType: 'none' }, function (res) {
                    if (!res.success) { alert(res.message); return; }
                    var rows = res.rows || [];
                    if (rows.length > 0) {
                        sheet = rows.map(function (r) {
                            return { transactionDate: toDateStr(v(r, 'TransactionDate')), chequeNo: s(v(r, 'ChequeNo')), particulars: s(v(r, 'Particulars')),
                                     debit: v(r, 'Debit') || 0, credit: v(r, 'Credit') || 0, id: v(r, 'Id') || 0 };
                        });
                        fillSheet();
                        $('#btnSave').hide(); $('#btnUpdateRecords').show();
                    } else { fillSheet(); }
                });
            }

            /* BtnDownloadPic_Click: the template, header row + today's date in A2 */
            function download() {
                if (sheet.length > 0 && !confirm('Downloading the template will clear the current data in the grid. Do you want to continue?')) return;
                if (typeof XLSX === 'undefined') { alert('The Excel library could not be loaded.'); return; }
                var ws = XLSX.utils.aoa_to_sheet([COLS, [new Date(new Date().toDateString())]], { cellDates: true });
                var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                XLSX.writeFile(wb, 'BankReconciliation_ExcelTemplate(AccountBookERP).xlsx');
                alert('Excel file created successfully!');
                sheet = []; fillSheet();
                $('#cmbaccounttitle').focus();
            }

            /* BtnUploadPic_Click: every sheet, header row required, case-insensitive column match */
            function upload(file) {
                if (typeof XLSX === 'undefined') { alert('The Excel library could not be loaded.'); return; }
                var reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
                        var combined = [];
                        for (var n = 0; n < wb.SheetNames.length; n++) {
                            var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[n]], { defval: null, raw: true });
                            var hdr = (XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[n]], { header: 1 })[0] || []).map(function (h) { return s(h).trim().toLowerCase(); });
                            var missing = COLS.map(function (c) { return c.toLowerCase(); }).filter(function (c) { return hdr.indexOf(c) < 0; });
                            if (missing.length) { alert('The uploaded Excel file is missing the following required columns:\n' + missing.join(', ')); return; }
                            rows.forEach(function (r) {
                                var m = {}; Object.keys(r).forEach(function (k) { m[k.trim().toLowerCase()] = r[k]; });
                                combined.push({ transactionDate: toDateStr(m['transactiondate']), chequeNo: s(m['chequeno']), particulars: s(m['particulars']),
                                                debit: m['debit'] == null ? 0 : m['debit'], credit: m['credit'] == null ? 0 : m['credit'], id: 0 });
                            });
                        }
                        if (combined.length > 0) { sheet = combined; fillSheet(); }
                        else { sheet = []; fillSheet(); alert('No data found in the uploaded Excel file.'); }
                    } catch (ex) { alert('Failed to upload Excel file.\n' + ex.message); }
                };
                reader.readAsArrayBuffer(file);
            }

            function dateTypeChanged() {
                var t = parseInt($('#cmbDateTypeHistory').val() || 0), now = new Date();
                if (t === 1) $('#txtFromdateHistory').val(ymd(now));
                else if (t === 2) { var d = new Date(); d.setDate(d.getDate() - 7); $('#txtFromdateHistory').val(ymd(d)); }
                else if (t === 3) { $('#txtFromdateHistory').val(ymd(new Date(now.getFullYear(), now.getMonth(), 1))); $('#txtToDateHistory').val(ymd(now)); }
                else if (t === 4) { $('#txtFromdateHistory').val(ymd(new Date(now.getFullYear(), 0, 1))); $('#txtToDateHistory').val(ymd(now)); }
                else if (t === 5 && L.financialYearStart) $('#txtFromdateHistory').val(toDateStr(L.financialYearStart));
            }

            $(function () {
                $('.br-tabs button').on('click', function () {
                    $('.br-tabs button').removeClass('active'); $(this).addClass('active');
                    $('.br-pane').removeClass('active'); $('#' + $(this).data('pane')).addClass('active');
                });
                $('#btnnew').on('click', newForm);
                $('#BtnRefresh').on('click', function () { $.get(API + '/bank-accounts', function (rows) { bind('#cmbaccounttitle', rows, 'Id', 'AccountTitle'); }); });
                $('#btnSave').on('click', function () { insert(false); });
                $('#btnUpdateRecords').on('click', function () { insert(true); });
                $('#btnUpdate').on('click', edit);
                $('#btndownload').on('click', download);
                $('#btnUpload').on('click', function () {
                    if (sheet.length > 0 && !confirm('Uploading the template will clear the current data in the grid and then load new data if found. Do you want to continue?')) return;
                    $('#fileUpload').val('').click();
                });
                $('#fileUpload').on('change', function () {
                    if (!this.files || !this.files[0]) { alert('Please choose a valid .xlsx file.'); return; }
                    upload(this.files[0]);
                });
                $('#grdExcelDataView').on('click', '.x-del', function () { deleteRow(parseInt($(this).closest('tr').data('i'))); });
                $('#grdExcelDataView').on('click', '.x-add', addRow);
                $('#grdExcelDataView').on('change input', 'input', function () {
                    var i = parseInt($(this).closest('tr').data('i')); sheet[i][$(this).data('k')] = $(this).val();
                });
                /* BtnShow_Click */
                $('#BtnShow').on('click', function () {
                    if ($.trim(selText('#cmbaccounttitle')) === '') { $('#cmbaccounttitle').focus(); alert('Please select an account title.'); return; }
                    $.get(API + '/history', { bankAccountId: parseInt($('#cmbaccounttitle').val() || 0), dateType: 'none' }, function (res) {
                        if (!res.success) { alert(res.message); return; }
                        historyGrid('#grdAccountHistory', res.rows, true);
                    });
                });
                /* History tab */
                $('#cmbDateTypeHistory').on('change', dateTypeChanged);
                $('#BtnNewHistory').on('click', function () { $('#cmbDateTypeHistory').val('3'); dateTypeChanged(); $('#CmbCustomerHistory').val(''); });
                $('#BtnRefreshHistory').on('click', function () { $.get(API + '/lookups', function (res) { L = res; bind('#CmbCustomerHistory', res.historyBanks, 'Id', 'name'); }); });
                $('#BtnShowhistory').on('click', function () {
                    $.get(API + '/history', {
                        bankAccountId: parseInt($('#CmbCustomerHistory').val() || 0),
                        dateType: $('input[name="rdDate"]:checked').val(),
                        from: $('#chkFrom').is(':checked') ? $('#txtFromdateHistory').val() : '',
                        to: $('#chkTo').is(':checked') ? $('#txtToDateHistory').val() : ''
                    }, function (res) {
                        if (!res.success) { alert(res.message); return; }
                        historyGrid('#grdHistory', res.rows, false);
                    });
                });
                $('#btnShortCutKey').on('click', function () {
                    alert('Ctrl+S  For Save\nCtrl+U  For Update\nCtrl+Shift+Delete  For Delete\nCtrl+E  For Close\nCtrl+R  For Refresh\nCtrl+N  For New\nCtrl+F5  For Focus on Account\nCtrl+T  For Tab Transfer\nCtrl+alt  To Show ShortCut Keys Form\nCtrl+D  For Adding an row in Focused Grid\nCtrl+Delete  For Deleting an row of Focused Grid\nCtrl+ArrowDown  For Focus On Detail Grid\nCtrl+ArrowRight  For Change Focus from one Grid To another Grid');
                });
                $(document).on('keydown', function (e) {
                    if (!e.ctrlKey) return;
                    if (e.keyCode === 84) { e.preventDefault(); $('.br-tabs button:not(.active)').click(); }
                    if (!$('#tabForm').hasClass('active')) return;
                    if (e.keyCode === 83 && $('#btnSave').is(':visible')) { e.preventDefault(); insert(false); }
                    if (e.keyCode === 78) { e.preventDefault(); newForm(); }
                    if (e.keyCode === 82) { e.preventDefault(); $('#BtnRefresh').click(); }
                    if (e.keyCode === 116) { e.preventDefault(); $('#cmbaccounttitle').focus(); }
                    var $tr = $(document.activeElement).closest('#grdExcelDataView tr');
                    if (e.keyCode === 68 && $('#grdExcelDataView').has(document.activeElement).length) { e.preventDefault(); addRow(); }
                    if (e.keyCode === 46 && $tr.length && $tr.data('i') !== undefined) { e.preventDefault(); deleteRow(parseInt($tr.data('i'))); }
                });
                load();
            });
        })();
    </script>
</body>
</html>
