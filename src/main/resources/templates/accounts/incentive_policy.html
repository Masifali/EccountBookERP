<style>
    :root { --ban: #0a6e6e; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { display: flex; flex-direction: column; min-height: 100vh; font: 13px Calibri, Carlito, "Segoe UI", sans-serif; color: #000; }
    body > .erp-navigation { flex: 0 0 auto; }
    #frm { flex: 1 0 auto; display: flex; flex-direction: column; min-width: 1328px; background: #fff; }
    #pages { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 640px; border: 1px solid #acacac; border-bottom: 0; margin: 2px 2px 0 2px; box-sizing: border-box; }
    .page { flex: 1 1 auto; display: none; flex-direction: column; min-height: 0; background: #fff; }
    .page.on { display: flex; }
    #tabsBar { flex: 0 0 24px; display: flex; align-items: flex-start; padding-left: 2px; margin: 0 2px; border: 1px solid #acacac; border-top: 0; background: #f0f0f0; box-sizing: border-box; }
    #tabsBar .tab { height: 22px; padding: 0 9px; margin-right: -1px; line-height: 20px; font: 12px "Microsoft Sans Serif", Tahoma, sans-serif; cursor: pointer; border: 1px solid #acacac; border-top: 0; background: #f0f0f0; box-sizing: border-box; }
    #tabsBar .tab.on { background: #fff; height: 24px; margin-top: -1px; border-top: 1px solid #fff; }
    /* panel3 / toolstrip */
    #panel3 { flex: 0 0 30px; height: 30px; background: #fff; }
    #toolstrip { display: flex; align-items: center; height: 27px; padding-left: 2px; white-space: nowrap; background: linear-gradient(#fbfcfe, #e9eef6); border-bottom: 1px solid #c5d3e2; font: 12px "Segoe UI", sans-serif; }
    #toolstrip button { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 5px; margin: 0 1px; font: inherit; color: #000; background: transparent; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    #toolstrip button:hover:not(:disabled) { background: #cce8ff; border-color: #99d1ff; }
    #toolstrip button[hidden] { display: none; }
    #toolstrip svg { width: 16px; height: 16px; flex: 0 0 16px; }
    /* panel4 */
    #panel4 { flex: 0 0 263px; height: 263px; position: relative; background: #fff; }
    #panel6, #panel5 { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: var(--ban); color: #fff; }
    #panel5 { position: relative; height: 33px; flex: 0 0 33px; }
    .ban { position: absolute; font: 24px "Microsoft Sans Serif", Arimo, Tahoma, sans-serif; color: #fff; line-height: 29px; white-space: nowrap; }
    .lbl { position: absolute; font: 13px Calibri, Carlito, "Segoe UI", sans-serif; line-height: 15px; color: #000; white-space: nowrap; }
    .tx, .dt { position: absolute; box-sizing: border-box; height: 23px; font: 13px Calibri, Carlito, "Segoe UI", sans-serif; border: 1px solid #7a7a7a; padding: 0 3px; background: #fff; }
    .tx.r { text-align: right; }
    .flat { position: absolute; box-sizing: border-box; height: 23px; padding: 0; background: #fff; border: 0; font: 13px Calibri, Carlito, sans-serif; color: #000; cursor: pointer; }
    .flat:hover { background: #e5f1fb; }
    .flat[hidden] { display: none; }
    #groupBox1 { position: absolute; left: 5px; top: 109px; width: 1097px; height: 136px; box-sizing: border-box; }
    #groupBox1 .gb-line { position: absolute; left: 0; top: 7px; right: 0; bottom: 0; border: 1px solid #dcdcdc; border-radius: 3px; }
    #groupBox1 .gb-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font: 11px "Microsoft Sans Serif", Arimo, Tahoma, sans-serif; line-height: 14px; }
    .dtcombo-wrap .dtcombo-input { font: 13px Calibri, Carlito, "Segoe UI", sans-serif !important; }
    #gridDetailsWrap { flex: 1 1 auto; min-height: 250px; display: flex; flex-direction: column; }
    #gridDetailsWrap .cjg { flex: 1 1 auto; }
    /* history */
    #panel17 { flex: 0 0 27px; height: 27px; position: relative; background: #f0f0f0; }
    #gbMount { position: absolute; right: 0; top: 2px; height: 21px; min-width: 45px; display: flex; align-items: center; justify-content: flex-end; }
    #panel18 { flex: 0 0 376px; height: 376px; display: flex; flex-direction: column; }
    #panel18 .cjg { flex: 1 1 auto; }
    #panel7 { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; }
    #panel7 .cjg { flex: 1 1 auto; }
</style>

                <input type="text" class="tx r" id="txtRangeFrom" value="0" style="left:519px;top:40px;width:121px" autocomplete="off">
                <span class="lbl" style="left:642px;top:22px">Range To</span>
                <input type="text" class="tx r" id="txtRangeTo" value="0" style="left:642px;top:40px;width:121px" autocomplete="off">

                <select id="cmbIncentiveType" data-dtcombo="single" data-dtcombo-caption="Incentive Type" style="position:absolute;left:766px;top:40px;width:130px;height:26px"></select>
                <span class="lbl" style="left:8px;top:84px">Incentive Rate</span>

                <span class="lbl" style="left:139px;top:83px">Incentive Calc On</span>
                <select id="cmbIncentiveCalcOn" data-dtcombo="single" data-dtcombo-caption="Incentive Calc On" style="position:absolute;left:142px;top:100px;width:130px;height:26px"></select>
                <span class="lbl" style="left:272px;top:82px">Remarks</span>
                <input type="text" class="tx" id="txtDetailRemarks" style="left:275px;top:100px;width:621px" autocomplete="off">

        <div id="gridDetailsWrap"><div class="cjg"><div class="cjg-wrap"><table id="grdDetails"></table></div><div class="cjg-nav" id="navDetails"></div></div></div>

    <div class="page" id="pageHistory">
        <div id="panel17"><div id="gbMount"></div></div>
        <div id="panel18">
            <div id="panel5"><span class="ban" id="label51" style="left:5px;top:2px">Incentive Policy History</span></div>
            <div class="cjg"><div class="cjg-wrap" data-gridbar-form="frmIncentivePolicy" data-gridbar-grid="DataGridHistory" data-gridbar-mount="#gbMount" data-gridbar-nullgrid="true" data-gridbar-reorder="false" data-gridbar-title="Incentive Policy History"><table id="DataGridHistory"></table></div><div class="cjg-nav" id="navHistory"></div></div>
