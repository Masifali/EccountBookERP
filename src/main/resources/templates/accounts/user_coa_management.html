<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Chart Of Account Management - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 24px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 12px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -15px -15px 15px -15px;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: 600;
            border: 1px solid #004d40;
            text-align: left;
        }

        .erp-table td {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-arrow-right" style="margin-right:8px;"></i> Golden Ace ERP</div>
        <div class="header-item"><i class="fa fa-user" style="margin-right:6px;"></i> Numan Rasheed (Admin)</div>
        <div class="header-item" style="margin-left:auto; color:#ffeb3b;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <i class="fa fa-window-maximize" style="margin-right: 6px;"></i>
        <span>Screens &gt; Accounts &gt; <strong>User Chart Of Account Management</strong></span>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header">
                <span><i class="fa fa-users"></i> User Chart Of Account Management</span>
                <span style="font-size:12px; font-weight:normal; background:#004d40; padding:2px 8px; border-radius:2px;">Rights & Security</span>
            </div>

            <!-- User Selector & Filters -->
            <form method="get" th:action="@{/accounts/user-coa-management}" class="form-inline" style="margin-bottom:15px; background:#f5f5f5; padding:10px; border:1px solid #e0e0e0;">
                <label style="margin-right:8px; font-weight:bold;">Select System User:</label>
                <select name="userId" class="form-control" onchange="this.form.submit()" style="min-width:240px; margin-right:15px;">
                    <option value="0">-- Select User --</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:selected="${u.id == selUserId}" th:text="${u.userName}"></option>
                </select>

                <button type="button" class="btn-erp" onclick="toggleCheckboxes(true)"><i class="fa fa-check-square-o"></i> Select All</button>
                <button type="button" class="btn-erp" onclick="toggleCheckboxes(false)" style="margin-left:6px;"><i class="fa fa-square-o"></i> Unselect All</button>
            </form>

            <!-- Save Form -->
            <form th:action="@{/accounts/user-coa-management/save}" method="post">
                <input type="hidden" name="userId" th:value="${selUserId}"/>

                <div style="overflow-x:auto; max-height:450px;">
                    <table class="erp-table">
                        <thead>
                            <tr>
                                <th style="width:40px; text-align:center;">Assign</th>
                                <th style="width:140px;">Account Code</th>
                                <th>Account Title</th>
                                <th>Account Group</th>
                                <th>Account Level</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="acc : ${allAccounts}">
                                <td style="text-align:center;">
                                    <input type="checkbox" name="allocatedAccountCodes" class="chk-account" th:value="${acc.accountCode}" th:checked="${allocatedAccountCodes != null and allocatedAccountCodes.contains(acc.accountCode)}"/>
                                </td>
                                <td style="font-weight:bold; color:#00796B;" th:text="${acc.accountCode}"></td>
                                <td th:text="${acc.accountTitle}"></td>
                                <td th:text="${acc.accountGroup}"></td>
                                <td th:text="${acc.accountLevel}"></td>
                            </tr>
                            <tr th:if="${allAccounts == null or allAccounts.isEmpty()}">
                                <td colspan="5" style="text-align:center; color:#94a3b8; padding:20px;">No accounts found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div style="margin-top:15px;">
                    <button type="submit" class="btn-erp" style="background:#00796B; color:white;"><i class="fa fa-save"></i> Save Rights</button>
                    <a th:href="@{/accounts/dashboard}" class="btn-erp" style="text-decoration:none;"><i class="fa fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        function toggleCheckboxes(check) {
            $('.chk-account').prop('checked', check);
        }
    </script>
</body>
</html>
