<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Chart Of Account Management - EccountBookERP</title>
    
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #dbe4eb;
            margin: 0;
            padding: 0;
            font-size: 11.5px;
            color: #333;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 32px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 22px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 10px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 12px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -12px -12px 12px -12px;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 2px;
            font-size: 11.5px;
            transition: all 0.15s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
            text-decoration: none;
        }

        .btn-erp-primary {
            background-color: #00796B;
            color: white;
            border: 1px solid #004d40;
        }
        .btn-erp-primary:hover {
            background-color: #004d40;
            color: white;
        }

        .select2-container--default .select2-selection--single {
            height: 26px !important;
            line-height: 24px !important;
            font-size: 11px !important;
            border: 1px solid #94a3b8 !important;
            border-radius: 2px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 24px !important;
            padding-left: 6px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 24px !important;
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: bold;
            border: 1px solid #004d40;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .erp-table td {
            padding: 4px 10px;
            border: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr:hover { background-color: #e0f2fe; }
    </style>
</head>
<body>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-arrow-right"></i> Golden Ace ERP</div>
        <div class="header-item"><i class="fa fa-user"></i> Numan Rasheed (Admin)</div>
        <div class="header-item" style="margin-left:auto;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <i class="fa fa-window-maximize" style="margin-right: 6px;"></i>
        <span>Screens &gt; Accounts &gt; <strong>User Chart Of Account Management</strong></span>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header">
                <span><i class="fa fa-users"></i> User Chart Of Account Management</span>
                <span style="font-size:11px; font-weight:normal; background:#004d40; padding:2px 8px; border-radius:2px;">Rights & Security</span>
            </div>

            <!-- User Selector & Filters -->
            <form method="get" th:action="@{/accounts/user-coa-management}" id="formUserSelect" class="form-inline" style="margin-bottom:10px; background:#f5f5f5; padding:8px 12px; border:1px solid #e0e0e0; display:flex; align-items:center; gap:12px;">
                <label style="margin:0; font-weight:bold;">Select System User:</label>
                <div style="width:240px;">
                    <select name="userId" id="cmbUser" class="form-control select2" onchange="document.getElementById('formUserSelect').submit()">
                        <option value="0">-- Select User --</option>
                        <option th:each="u : ${users}" th:value="${u.id}" th:selected="${u.id == selUserId}" th:text="${u.userName}"></option>
                    </select>
                </div>

                <button type="button" class="btn-erp" onclick="toggleCheckboxes(true)"><i class="fa fa-check-square-o"></i> Select All</button>
                <button type="button" class="btn-erp" onclick="toggleCheckboxes(false)"><i class="fa fa-square-o"></i> Unselect All</button>
            </form>

            <!-- Save Form -->
            <form th:action="@{/accounts/user-coa-management/save}" method="post">
                <input type="hidden" name="userId" th:value="${selUserId}"/>

                <div style="overflow-y:auto; max-height:520px; border:1px solid #cbd5e1;">
                    <table class="erp-table">
                        <thead>
                            <tr>
                                <th style="width:40px; text-align:center;">Assign</th>
                                <th style="width:140px;">Account Code</th>
                                <th>Account Title</th>
                                <th style="width:140px;">Account Group</th>
                                <th style="width:120px;">Account Level</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="acc : ${allAccounts}">
                                <td style="text-align:center;">
                                    <input type="checkbox" name="allocatedAccountCodes" class="chk-account" th:value="${acc.accountCode}" th:checked="${allocatedAccountCodes != null and allocatedAccountCodes.contains(acc.accountCode)}"/>
                                </td>
                                <td style="font-weight:bold; color:#00796B;" th:text="${acc.accountCode}"></td>
                                <td th:text="${acc.accountTitle}"></td>
                                <td th:text="${acc.accountGroup != null ? acc.accountGroup : (acc.accountLevel == 4 ? 'Detail' : 'Group')}"></td>
                                <td th:text="${acc.accountLevel}"></td>
                            </tr>
                            <tr th:if="${allAccounts == null or allAccounts.isEmpty()}">
                                <td colspan="5" style="text-align:center; color:#94a3b8; padding:30px;">No accounts found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button type="submit" class="btn-erp btn-erp-primary"><i class="fa fa-save"></i> Save Rights</button>
                    <a th:href="@{/accounts/dashboard}" class="btn-erp" style="text-decoration:none;"><i class="fa fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
    <script>
        $(document).ready(function() {
            $('.select2').select2({ width: '100%' });
        });

        function toggleCheckboxes(check) {
            $('.chk-account').prop('checked', check);
        }
    </script>
</body>
</html>
