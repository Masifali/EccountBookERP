<style>

    .tx, .dt { position: absolute; box-sizing: border-box; height: 23px; font: 13px Calibri, Carlito, "Segoe UI", sans-serif; border: 1px solid #7a7a7a; padding: 0 3px; background: #fff; }
    .tx[readonly] { background: #f0f0f0; }
    .btn { position: absolute; box-sizing: border-box; height: 23px; padding: 0; font: 12px "Microsoft Sans Serif", Arimo, Tahoma, sans-serif; color: #000; cursor: pointer;

    .vsum { display: flex; gap: 14px; padding: 4px 8px; background: #fff; border-bottom: 1px solid #acacac; font: 12px "Microsoft Sans Serif", Tahoma, sans-serif; }

    #gridsRow { flex: 1 1 auto; display: flex; flex-direction: row; min-height: 230px; background: #f0f0f0; }
