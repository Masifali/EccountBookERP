<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Banking - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 24px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 12px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -15px -15px 15px -15px;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
        }

        .erp-form-group {
            margin-bottom: 10px;
        }

        .erp-form-group label {
            font-weight: bold;
            color: #37474f;
            margin-bottom: 3px;
            display: block;
        }

        .erp-input {
            width: 100%;
            height: 28px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid #b0bec5;
            border-radius: 2px;
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: 600;
            border: 1px solid #004d40;
            text-align: left;
        }

        .erp-table td {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-arrow-right" style="margin-right:8px;"></i> Golden Ace ERP</div>
        <div class="header-item"><i class="fa fa-user" style="margin-right:6px;"></i> Numan Rasheed (Admin)</div>
        <div class="header-item" style="margin-left:auto; color:#ffeb3b;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <i class="fa fa-window-maximize" style="margin-right: 6px;"></i>
        <span>Screens &gt; Accounts &gt; Banking &gt; <strong th:text="${moduleTitle}">Banking Module</strong></span>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header">
                <span th:text="${moduleTitle}"><i class="fa fa-university"></i> Banking Management</span>
                <span style="font-size:12px; font-weight:normal; background:#004d40; padding:2px 8px; border-radius:2px;">Banking Engine</span>
            </div>

            <!-- Controls -->
            <div class="row" style="margin-bottom:15px; background:#f5f5f5; padding:10px; border:1px solid #e0e0e0; margin-left:0; margin-right:0;">
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Select Bank Account</label>
                    <select class="erp-input">
                        <option>ALL BANKS</option>
                    </select>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>As Of Date</label>
                    <input type="date" class="erp-input" value="2026-09-07"/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group" style="display:flex; align-items:flex-end; gap:6px;">
                    <button type="button" class="btn-erp" style="background:#00796B; color:white; height:28px;"><i class="fa fa-refresh"></i> Load Data</button>
                    <button type="button" class="btn-erp" style="height:28px;"><i class="fa fa-check"></i> Process</button>
                </div>
            </div>

            <div style="overflow-x:auto;">
                <table class="erp-table">
                    <thead>
                        <tr>
                            <th>Bank Name</th>
                            <th>Account No</th>
                            <th>Cheque No</th>
                            <th>Voucher No</th>
                            <th>Date</th>
                            <th style="text-align:right;">Amount (PKR)</th>
                            <th style="text-align:center;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="7" style="text-align:center; color:#78909c; padding:20px;">
                                <i class="fa fa-university" style="font-size:18px;"></i> Select bank account and click <strong>Load Data</strong> to view details.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
