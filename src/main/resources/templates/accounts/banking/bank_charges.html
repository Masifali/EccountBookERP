<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Charges - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc3545; color: white; border: 1px solid #bd2130; }
        .btn-erp-danger:hover { background-color: #c82333; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .grid-container { height: 440px; overflow-y: auto; border: 1px solid #cbd5e1; background: white; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        .erp-table td { padding: 4px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr.selected { background-color: #b2dfdb !important; font-weight: bold; }
        .filter-row input { width: 100%; font-size: 10px; padding: 1px 4px; height: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-money"></i> Bank Charges (FcYBankChargesTypes - Banking Management)</div>
        <div><a href="/accounts/dashboard" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Accounts Dashboard</a></div>
    </div>
    
    <div class="erp-toolbar">
        <button type="button" class="btn-erp" id="btnNew"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary" id="btnSave"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="btn-erp" id="btnUpdate"><i class="fa fa-pencil"></i> Update</button>
        <button type="button" class="btn-erp btn-erp-danger" id="btnDelete"><i class="fa fa-trash"></i> Delete</button>
        <button type="button" class="btn-erp" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
    </div>

    <div style="padding: 10px;">
        <input type="hidden" id="chargesId" value="" />

        <div class="erp-fieldset">
            <legend>Bank Charges Information</legend>
            <div class="row" style="margin-bottom: 6px;">
                <div class="col-md-4">
                    <label class="form-label-erp">Bank Account *</label>
                    <select id="bankAccountId" class="form-control-erp select2">
                        <option value="">-- Select Bank Account --</option>
                        <option th:each="acc : ${bankAccountsList}" th:value="${acc.id}" th:text="${acc.accountTitle}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Charge Date *</label>
                    <input type="date" id="chargeDate" class="form-control-erp" />
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Charge Type *</label>
                    <select id="chargeType" class="form-control-erp">
                        <option value="Bank Service Fee">Bank Service Fee</option>
                        <option value="Cheque Book Fee">Cheque Book Fee</option>
                        <option value="Online Transfer Fee">Online Transfer Fee</option>
                        <option value="WHT / Tax Fee">WHT / Tax Fee</option>
                        <option value="Foreign Exchange Fee">Foreign Exchange Fee</option>
                        <option value="Other Charges">Other Charges</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label-erp">Ref / Voucher No</label>
                    <input type="text" id="refNo" class="form-control-erp" placeholder="Ref No" />
                </div>
            </div>

            <div class="row" style="margin-bottom: 6px;">
                <div class="col-md-3">
                    <label class="form-label-erp">Charge Amount (PKR) *</label>
                    <input type="number" step="0.01" id="amount" class="form-control-erp calc-trigger" placeholder="0.00" style="text-align: right;" />
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Sales Tax / WHT (PKR)</label>
                    <input type="number" step="0.01" id="taxAmount" class="form-control-erp calc-trigger" placeholder="0.00" style="text-align: right;" />
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Net Total Charge (PKR)</label>
                    <input type="number" step="0.01" id="totalAmount" class="form-control-erp" readonly="readonly" style="text-align: right; font-weight: bold; background-color: #f1f5f9; color: #00796B;" />
                </div>
                <div class="col-md-3">
                    <label class="form-label-erp">Remarks / Description</label>
                    <input type="text" id="remarks" class="form-control-erp" placeholder="Remarks" />
                </div>
            </div>
        </div>

        <div class="erp-fieldset">
            <legend>Bank Charges Register Records</legend>
            <div class="grid-container">
                <table class="erp-table" id="chargesGrid">
                    <thead>
                        <tr>
                            <th style="width: 5%;">ID</th>
                            <th style="width: 25%;">Bank Account</th>
                            <th style="width: 10%;">Date</th>
                            <th style="width: 15%;">Charge Type</th>
                            <th style="width: 10%;">Ref No</th>
                            <th style="width: 10%; text-align: right;">Amount</th>
                            <th style="width: 10%; text-align: right;">Tax Amount</th>
                            <th style="width: 15%; text-align: right;">Net Total (PKR)</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" data-col="0" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="1" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="2" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="3" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="4" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="5" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="6" placeholder="Filter..." /></th>
                            <th><input type="text" data-col="7" placeholder="Filter..." /></th>
                        </tr>
                    </thead>
                    <tbody id="chargesGridBody">
                        <tr><td colspan="8" style="text-align:center;">Loading bank charges...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/vendors/select2/dist/js/select2.min.js}"></script>
    <script>
        var chargesData = [];

        $(document).ready(function() {
            $('.select2').select2({ width: '100%' });
            var today = new Date().toISOString().split('T')[0];
            $('#chargeDate').val(today);

            loadChargesGrid();

            $('.calc-trigger').on('input keyup change', function() {
                calculateNetTotal();
            });

            $('#btnNew').click(function() { resetForm(); });
            $('#btnSave, #btnUpdate').click(function() { saveCharges(); });
            $('#btnDelete').click(function() { deleteCharges(); });
            $('#btnRefresh').click(function() { loadChargesGrid(); });

            $('.filter-row input').on('keyup change', function() {
                filterGrid();
            });
        });

        function calculateNetTotal() {
            var amt = parseFloat($('#amount').val() || 0);
            var tax = parseFloat($('#taxAmount').val() || 0);
            var total = amt + tax;
            $('#totalAmount').val(total.toFixed(2));
        }

        function loadChargesGrid() {
            $.ajax({
                url: '/api/banking/bank-charges/list',
                type: 'GET',
                success: function(data) {
                    chargesData = data || [];
                    renderGrid(chargesData);
                },
                error: function() {
                    $('#chargesGridBody').html('<tr><td colspan="8" style="text-align:center; color:red;">Failed to load bank charges.</td></tr>');
                }
            });
        }

        function renderGrid(list) {
            var html = '';
            if(!list || list.length === 0) {
                html = '<tr><td colspan="8" style="text-align:center;">No bank charges records found.</td></tr>';
            } else {
                $.each(list, function(idx, item) {
                    var amt = parseFloat(item.amount || 0);
                    var tax = parseFloat(item.taxAmount || 0);
                    var total = parseFloat(item.totalAmount || (amt + tax));

                    html += '<tr data-id="' + item.id + '" onclick="selectRow(this, ' + idx + ')">';
                    html += '<td>' + (item.id || '') + '</td>';
                    html += '<td><strong>' + (item.bankAccountTitle || ('Account #' + item.bankAccountId)) + '</strong></td>';
                    html += '<td>' + (item.chargeDate || '') + '</td>';
                    html += '<td>' + (item.chargeType || 'Service Fee') + '</td>';
                    html += '<td>' + (item.refNo || '-') + '</td>';
                    html += '<td style="text-align:right;">' + amt.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>';
                    html += '<td style="text-align:right;">' + tax.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>';
                    html += '<td style="text-align:right; font-weight:bold; color:#00796B;">' + total.toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>';
                    html += '</tr>';
                });
            }
            $('#chargesGridBody').html(html);
        }

        function selectRow(tr, idx) {
            $('#chargesGridBody tr').removeClass('selected');
            $(tr).addClass('selected');
            var item = chargesData[idx];
            if(item) {
                $('#chargesId').val(item.id);
                $('#bankAccountId').val(item.bankAccountId).trigger('change');
                $('#chargeDate').val(item.chargeDate || '');
                $('#chargeType').val(item.chargeType || 'Bank Service Fee');
                $('#refNo').val(item.refNo || '');
                $('#amount').val(item.amount || '0.00');
                $('#taxAmount').val(item.taxAmount || '0.00');
                $('#totalAmount').val(item.totalAmount || '0.00');
                $('#remarks').val(item.remarks || '');
            }
        }

        function resetForm() {
            var today = new Date().toISOString().split('T')[0];
            $('#chargesId').val('');
            $('#bankAccountId').val('').trigger('change');
            $('#chargeDate').val(today);
            $('#chargeType').val('Bank Service Fee');
            $('#refNo').val('');
            $('#amount').val('');
            $('#taxAmount').val('');
            $('#totalAmount').val('');
            $('#remarks').val('');
            $('#chargesGridBody tr').removeClass('selected');
        }

        function saveCharges() {
            var bankAccountId = $('#bankAccountId').val();
            var amount = $('#amount').val();
            if(!bankAccountId) {
                alert('Please select a Bank Account.');
                $('#bankAccountId').focus();
                return;
            }
            if(!amount || parseFloat(amount) <= 0) {
                alert('Please enter Charge Amount.');
                $('#amount').focus();
                return;
            }

            var payload = {
                id: $('#chargesId').val() ? parseInt($('#chargesId').val()) : null,
                bankAccountId: parseInt(bankAccountId),
                chargeDate: $('#chargeDate').val(),
                chargeType: $('#chargeType').val(),
                refNo: $('#refNo').val(),
                amount: parseFloat(amount),
                taxAmount: parseFloat($('#taxAmount').val() || 0),
                totalAmount: parseFloat($('#totalAmount').val() || amount),
                remarks: $('#remarks').val()
            };

            $.ajax({
                url: '/api/banking/bank-charges/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert('Bank Charges saved successfully!');
                    resetForm();
                    loadChargesGrid();
                },
                error: function(xhr) {
                    alert('Failed to save Bank Charges: ' + (xhr.responseText || 'Error occurred'));
                }
            });
        }

        function deleteCharges() {
            var id = $('#chargesId').val();
            if(!id) {
                alert('Please select a Bank Charge record to delete.');
                return;
            }
            if(confirm('Are you sure you want to delete Bank Charge record #' + id + '?')) {
                $.ajax({
                    url: '/api/banking/bank-charges/' + id,
                    type: 'DELETE',
                    success: function() {
                        alert('Record deleted successfully!');
                        resetForm();
                        loadChargesGrid();
                    },
                    error: function(xhr) {
                        alert('Failed to delete: ' + xhr.responseText);
                    }
                });
            }
        }

        function filterGrid() {
            var filters = [];
            $('.filter-row input').each(function() {
                filters.push({ col: $(this).data('col'), val: $(this).val().toLowerCase() });
            });

            $('#chargesGridBody tr').each(function() {
                var row = $(this);
                var show = true;
                $.each(filters, function(i, f) {
                    if(f.val) {
                        var text = row.find('td').eq(f.col).text().toLowerCase();
                        if(text.indexOf(f.val) === -1) {
                            show = false;
                            return false;
                        }
                    }
                });
                row.toggle(show);
            });
        }
    </script>
</body>
</html>
