<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Reconciliation With Vouchers</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Verdana, sans-serif; font-size: 12px; background: #f0f0f0; margin: 0; color: #222; }
        .tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #dcdcdc; }
        .tabs button { border: 1px solid #aaa; border-bottom: none; background: #e9e9e9; padding: 4px 16px; cursor: pointer; font-size: 12px; }
        .tabs button.on { background: #fff; font-weight: bold; }
        .page { background: #fff; border: 1px solid #aaa; margin: 0 6px 6px; padding: 4px; }
        .toolbar { display: flex; gap: 4px; padding: 3px; background: linear-gradient(#fdfdfd, #e6e6e6); border: 1px solid #c8c8c8; flex-wrap: wrap; }
        .toolbar button { font-size: 12px; padding: 3px 10px; border: 1px solid #aaa; background: #fafafa; cursor: pointer; }
        .toolbar button:disabled { color: #999; cursor: default; }
        .strip { background: #00796b; color: #fff; font-weight: bold; font-size: 14px; padding: 4px 8px; margin-top: 3px; display: flex; justify-content: space-between; align-items: center; }
        .strip label { font-size: 12px; }
        fieldset { border: 1px solid #b5b5b5; margin: 4px 0; padding: 4px 8px 8px; }
        legend { font-weight: bold; font-size: 12px; padding: 0 4px; width: auto; }
        .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
        .fld { display: flex; flex-direction: column; }
        .fld label { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
        input[type=text], input[type=date], select { font-size: 12px; border: 1px solid #9a9a9a; padding: 2px 4px; height: 24px; box-sizing: border-box; }
        input:disabled, select:disabled { background: #eee; }
        .num { text-align: right; }
        .bar { background: #00796b; color: #fff; font-weight: bold; padding: 3px 6px; }
        .grid { border: 1px solid #aaa; overflow: auto; background: #fff; }
        table.g { border-collapse: collapse; width: 100%; font-size: 11px; }
        table.g th { background: #e4e4e4; border: 1px solid #b9b9b9; padding: 3px 4px; text-align: center; position: sticky; top: 0; white-space: nowrap; }
        table.g td { border: 1px solid #d3d3d3; padding: 2px 4px; white-space: nowrap; }
        table.g tfoot td { font-weight: bold; background: #f3f3f3; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="tabs">
    <button type="button" id="tabForm" class="on" onclick="BR.tab(0)">Form</button>
    <button type="button" id="tabHistory" onclick="BR.tab(1)">History</button>
</div>

<div class="page" id="pageForm">
    <div class="toolbar">
        <button type="button" onclick="BR.newForm()">New</button>
        <button type="button" onclick="BR.refresh()">Refresh</button>
        <button type="button" id="btnSave" onclick="BR.save(false)">Save</button>
        <button type="button" id="btnUpdate" hidden onclick="BR.save(true)">Update</button>
        <button type="button" id="btnDelete" hidden onclick="BR.del()">Delete</button>
        <button type="button" id="btnSlip" onclick="BR.slipClick()" data-rpt="920_BankReconciliation_Slip.rpt">920-Print</button>
        <button type="button" onclick="window.open('/accounts/bank-reconciliation-upload-excel','_blank')">Upload Reconciliation Data</button>
        <button type="button" onclick="BR.shortcuts()">ShortCut Keys</button>
    </div>
    <div class="strip"><span>Bank Reconciliation With Vouchers</span><label><input type="checkbox" id="ChkPrintslip"> Print Slip</label></div>

    <div class="row" style="margin-top:4px;align-items:flex-start;">
        <div>
            <div class="row">
                <div class="fld"><label>Bank Account</label>
                    <select id="CmbSupplier" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="AccountTitle" style="width:259px;"></select>
                </div>
                <button type="button" onclick="BR.show()">Show</button>
            </div>
        </div>
        <fieldset style="margin:0;">
            <legend>Voucher Information</legend>
            <div class="row">
                <div class="fld"><label>Voucher No</label><select id="CmbVoucher" disabled style="width:116px;"></select></div>
                <div class="fld"><label>Voucher Amount Cr</label><input type="text" id="txtVoucherAmountCr" class="num" disabled style="width:139px;"></div>
            </div>
            <div class="row">
                <div class="fld"><label>Voucher Date</label><input type="date" id="txtVoucherDate" disabled style="width:130px;"></div>
                <div class="fld"><label>Voucher Amount Dr</label><input type="text" id="txtVoucherAmountDr" class="num" disabled style="width:139px;"></div>
            </div>
        </fieldset>
    </div>

    <div class="bar">Detail</div>
    <div class="grid" style="height:284px;"><table class="g" id="grd"></table></div>
    <div class="bar" style="margin-top:4px;">Pending Vouchers For Bank Reconciliation</div>
    <div class="grid" style="height:160px;"><table class="g" id="grdPendingVouchers"></table></div>
</div>

<div class="page" id="pageHistory" hidden>
    <div class="toolbar">
        <button type="button" onclick="BR.resetHistory()">New</button>
        <button type="button" onclick="BR.historyBanks()">Refresh</button>
    </div>
    <div class="strip">Bank Reconciliation With Vouchers History </div>
    <fieldset>
        <legend>Filters</legend>
        <div class="row">
            <div class="fld"><label>Date Type</label>
                <select id="cmbDateTypeHistory" style="width:130px;" onchange="BR.dateTypeChanged()">
                    <option value="0">Select...</option><option value="1">This Day</option><option value="2">This Week</option>
                    <option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option>
                </select>
            </div>
            <div class="fld"><label>Date From</label><span><input type="checkbox" id="chkFrom" checked><input type="date" id="txtFromdateHistory" style="width:125px;"></span></div>
            <div class="fld"><label>Date To</label><span><input type="checkbox" id="chkTo" checked><input type="date" id="txtToDateHistory" style="width:125px;"></span></div>
            <div class="fld"><label>Voucher From</label><input type="text" id="txtFromNoHistory" style="width:82px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="fld"><label>Voucher To</label><input type="text" id="txtToDocNoHistory" style="width:82px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="fld"><label>Bank Account</label><select id="CmbCustomerHistory" style="width:200px;"></select></div>
            <button type="button" onclick="BR.history()">Show</button>
            <div class="fld">
                <label><input type="radio" name="histDate" value="doc" checked> Voucher Date</label>
                <label><input type="radio" name="histDate" value="entry"> Voucher Entry Date</label>
                <label><input type="radio" name="histDate" value="modify"> Voucher Modify Date</label>
                <label><input type="radio" name="histDate" value="approved"> Voucher Approve Date</label>
            </div>
        </div>
    </fieldset>
    <div class="bar">Filtered Records</div>
    <div class="grid" style="height:424px;"><table class="g" id="grdHistory"></table></div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_accounts_groupd.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_bank_reconciliation_vouchers.js?v=20260930s}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
