<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cheque Printing</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_button_busy.css?v=20261002gf}">
    <!--
      2026-10-02 BANKING I-CHEQUE-PRINTING: 1:1 port of Architecture.WinApp.ChequePrinting.ChequePrinting
      (screen 700, ClientSize 1251x686, WindowState Maximized). Replaces the earlier page, which was not
      ported from the desktop (Bank Account / Payee / Amount-in-words entry form, "Template Format",
      "Cross", "Printed Cheque History Log" saved with raw SQL into a ChequePrinting table the desktop
      never uses). The desktop form only LISTS the unprinted dbo.ChequePrintList rows that the voucher
      saves wrote, prints the selected ones with the bank's cheque .rpt and marks them printed.
        toolStrip3 (Dock Top, 27, White): [Load All - hidden] [attachment "0" - hidden] Print Selected | Select All | SelectedCount "0"
        panel2     (Dock Top, 65, White): label1 "Cheque Printing List" @495,9 Segoe UI Semibold 21.75pt Bold Italic
                                         (label64 "Bank", cmbBanks, btnLoad: Visible = false)
        splitContainer1 (Fill, Panel1 fixed 300): grdChequeCount (Janus, Verdana 8.25pt, filter row, record navigator,
                                         total row bottom; Id hidden, BranchName 250, Counts) | flowLayoutPanel1 of cheque cards
      Cards (DynamicCards.ChequePrint / ABL / AskariBank / ... 428x259 each, Margin 15,5,5,5): their designer positions are in
      countx_cheque_printing.js (CARDS). Backend: ChequePrintingDesktopController /accounts/api/banking/cheque-printing.
    -->
    <style>
        :root { --teal: #0a6e6e; --frame: #a0a0a0; }
        html, body { margin: 0; height: 100%; }
        body { background: #f0f0f0; color: #000; overflow: hidden; font: 11px "Microsoft Sans Serif", Tahoma, Arial, sans-serif; }
        [hidden] { display: none !important; }
        .frm-scroll { position: absolute; inset: 0; overflow: auto; }
        .frm { position: relative; min-width: 1251px; min-height: 686px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }

        /* toolStrip3: BackColor White, 27 px, ImageScalingSize 20 */
        .ts { flex: 0 0 27px; height: 27px; display: flex; align-items: center; padding: 0 2px; box-sizing: border-box;
              background: #fff; border-bottom: 1px solid #e3e3e3; }
        .ts button { font: 12px "Segoe UI", Tahoma, sans-serif; height: 24px; padding: 0 4px 0 3px; margin: 0 1px; border: 1px solid transparent;
                     background: transparent; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; color: #000; }
        .ts button:hover:not(:disabled) { border-color: #3399ff; background: #cce8ff; }
        .ts button:disabled { color: #8d8d8d; cursor: default; }
        .ts button svg { width: 16px; height: 16px; flex: 0 0 16px; }
        .ts .cnt { font: 12px "Segoe UI", Tahoma, sans-serif; padding: 0 4px; }

        /* panel2 */
        .p2 { flex: 0 0 65px; height: 65px; position: relative; background: #fff; }
        .p2 .title { position: absolute; left: 495px; top: 9px; height: 40px; line-height: 40px; white-space: nowrap; color: #000;
                     font: italic 600 29px "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; }

        /* splitContainer1 */
        .split { flex: 1 1 auto; min-height: 0; display: flex; background: #f0f0f0; }
        .pnl1 { flex: 0 0 300px; width: 300px; display: flex; flex-direction: column; min-height: 0; }
        .splitter { flex: 0 0 4px; background: #f0f0f0; }
        .pnl2 { flex: 1 1 auto; min-width: 0; overflow: auto; background: #f0f0f0; }

        /* Janus GridEX */
        .grid { flex: 1 1 auto; min-height: 0; overflow: auto; background: #fff; border: 1px solid var(--frame); box-sizing: border-box; outline: none; }
        table.g { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; font: 11px Verdana, Tahoma, sans-serif; }
        table.g th { position: sticky; top: 0; z-index: 2; background: linear-gradient(#fdfdfd, #e3e8ef); border-right: 1px solid #c3c9d1;
                     border-bottom: 1px solid #a9b3bf; padding: 1px 4px; height: 20px; text-align: left; font-weight: normal; box-sizing: border-box; }
        table.g tr.flt td { position: sticky; top: 20px; z-index: 2; background: #f7f9fb; padding: 1px; border-bottom: 1px solid #a9b3bf; }
        table.g tr.flt input { width: 100%; box-sizing: border-box; height: 17px; border: 1px solid #c3c9d1; font: 11px Verdana, Tahoma, sans-serif; padding: 0 2px; }
        table.g tbody { user-select: none; }
        table.g td { border-right: 1px solid #e1e4e8; border-bottom: 1px solid #e1e4e8; padding: 1px 4px; height: 19px; white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; background: #fff; box-sizing: border-box; cursor: default; }
        table.g tbody tr.cur td { background: #cde6f7; }
        table.g td.num { text-align: right; }
        table.g tfoot td { position: sticky; bottom: 0; z-index: 1; background: #f1f3f6; border-top: 1px solid #a9b3bf; height: 19px; }
        .nav { flex: 0 0 22px; height: 22px; display: flex; align-items: center; gap: 2px; padding: 0 3px; border: 1px solid var(--frame); border-top: 0;
               background: linear-gradient(#fdfdfd, #e3e8ef); font: 11px Verdana, Tahoma, sans-serif; box-sizing: border-box; }
        .nav button { width: 18px; height: 17px; padding: 0; font: 9px Verdana, sans-serif; border: 1px solid #b7c0cb; background: #fff; cursor: pointer; }

        /* flowLayoutPanel1 cards: UserControl BorderStyle FixedSingle, BackColor WhiteSmoke, 428x259, Margin 15,5,5,5 */
        .flow { display: flex; flex-wrap: wrap; align-content: flex-start; padding: 0; }
        .card { position: relative; width: 428px; height: 259px; margin: 5px 5px 5px 15px; background: #f5f5f5; border: 1px solid #646464;
                box-sizing: border-box; overflow: hidden; font: 11px "Microsoft Sans Serif", Tahoma, Arial, sans-serif; }
        .card > * { position: absolute; box-sizing: border-box; margin: 0; }
        .card .pic { background: teal; object-fit: fill; }
        .card .lb { white-space: nowrap; line-height: 13px; height: 13px; }
        .card .amt { font: 9.3px Verdana, Tahoma, sans-serif; text-align: right; line-height: 20px; overflow: hidden; white-space: nowrap; direction: rtl; unicode-bidi: plaintext; }
        .card textarea { border: 0; resize: none; padding: 1px 2px; overflow: hidden; font: 11px "Microsoft Sans Serif", Tahoma, Arial, sans-serif; outline: none; }
        .card textarea.typ { background: var(--teal); color: #fff; font: bold 13.3px "Microsoft Sans Serif", Tahoma, Arial, sans-serif; text-align: center; padding: 1px 0; line-height: 17px; }
        .card label.sel { display: flex; align-items: center; gap: 3px; height: 17px; cursor: pointer; white-space: nowrap; }
        .card label.sel input { margin: 0; width: 13px; height: 13px; }
        .card button.prt { font: 11px "Microsoft Sans Serif", Tahoma, Arial, sans-serif; border: 1px solid #adadad; background: #e1e1e1; cursor: pointer; padding: 0; }
        .card button.prt:hover:not(:disabled) { border-color: #0078d7; background: #e5f1fb; }
        #printFrame { position: absolute; width: 0; height: 0; border: 0; left: -9999px; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm">
    <div class="ts" id="toolStrip3">
        <button type="button" id="BtnLoadAll" hidden>Load All</button>
        <button type="button" id="btnAttachment" hidden>0</button>
        <button type="button" id="btn294APrint" title="Print All">
            <svg viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="4" fill="#fff" stroke="#555"/><rect x="1.5" y="5.5" width="13" height="6" rx="1" fill="#6b7b8c" stroke="#3d4955"/><rect x="4" y="9.5" width="8" height="5" fill="#fff" stroke="#555"/><circle cx="12.5" cy="7.5" r=".8" fill="#9fe39f"/></svg>
            Print Selected</button>
        <button type="button" id="btnCheckAll" title="Select All">Select All</button>
        <span class="cnt" id="SelectedCount">0</span>
    </div>
    <div class="p2" id="panel2">
        <div class="title" id="label1">Cheque Printing List</div>
    </div>
    <div class="split" id="splitContainer1">
        <div class="pnl1">
            <div class="grid" id="grdChequeCountWrap" tabindex="0">
                <table data-gridbar="ChequePrinting:grdChequeCount" class="g" id="grdChequeCount">
                    <colgroup><col style="width:250px"><col style="width:46px"></colgroup>
                    <thead>
                        <tr><th>BranchName</th><th>Counts</th></tr>
                        <tr class="flt"><td><input type="text" data-col="BranchName" aria-label="Filter BranchName"></td><td><input type="text" data-col="Counts" aria-label="Filter Counts"></td></tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot><tr><td></td><td></td></tr></tfoot>
                </table>
            </div>
            <div class="nav" id="grdNav">
                <button type="button" data-nav="first" title="First">|&#9664;</button>
                <button type="button" data-nav="prev" title="Previous">&#9664;</button>
                <span id="navText">Record 0 of 0</span>
                <button type="button" data-nav="next" title="Next">&#9654;</button>
                <button type="button" data-nav="last" title="Last">&#9654;|</button>
            </div>
        </div>
        <div class="splitter"></div>
        <div class="pnl2" id="splitPanel2">
            <div class="flow" id="flowLayoutPanel1"></div>
        </div>
    </div>
</div>
</div>
<iframe id="printFrame" title="print"></iframe>
<script th:src="@{/build/js/countx_cheque_printing.js?v=20261002ia}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
