<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>General Ledger Statement</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
</head>
<!--
  "General Ledger Statement" - Architecture.WinApp.Account_Reports.GeneralLedgerStatment (base.Name "GeneralLedgerStatment").
  Load (VoucherValidation_Load): CompanyFill (Sp_Company_GetAllMethod ReadByOrganizationId, Rows[0]), AccountTitleFill
  (Sp_COAAllocation_GetAllMethod COAForCombobindig), BranchFill (Sp_Branches_GetAllMethod GetAll, Rows[0]), ProjectFill (the SAME
  branch table bound with display member "ProjectName", Rows[0]); fromdate = ActiveYr.Start_Period, todate = today.
  Show (btnshow_Click): "Account Title Field Required............" without an account; VoucherReports.GeneralLedgerStatement ->
  Sp_GeneralLedgerStatement_Rpt (@ReportType 'Account Statment By Date', @BranchesId / @ProjectsId when != 0) through
  /accounts/api/reports-desktop/general-ledger-statement. Grid: RetrieveStructure (every returned column), VoucherCode a link column.
  Toolbar (toolStrip3): Refresh (reset: account cleared, focus From Date), 109-Print (Crystal 109-AcRptGeneralLedgerStatement.rpt, not ported).
-->
<body class="accf">
<div class="win-title-bar">
    <span><i class="fa fa-line-chart"></i> General Ledger Statement</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" onclick="resetGLS()"><i class="fa fa-refresh text-primary"></i> Refresh</button>
    <button type="button" class="win-btn" onclick="printGLS()" data-rpt="109-AcRptGeneralLedgerStatement.rpt"><i class="fa fa-print"></i> 109-Print</button>
</div>
<div class="win-header-panel"><span>General Ledger Statement</span></div>

<div class="filters">
    <div class="gb" style="width:760px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 1fr 1fr 1fr 90px;">
            <span class="lbl">Company</span><span class="lbl">Branch</span><span class="lbl">Project</span><span></span>
            <select id="cmbcomp" class="inp" data-dtcombo-caption="Comapny Name"></select>
            <select id="cmbbranch" class="inp" data-dtcombo-caption="Branch Name"></select>
            <select id="cmbproject" class="inp" data-dtcombo-caption="Project Name"></select>
            <span></span>
            <span class="lbl">From Date</span><span class="lbl">To Date</span><span class="lbl">Account Title</span><span></span>
            <input type="date" id="fromdate" class="inp">
            <input type="date" id="todate" class="inp">
            <select id="cmbAccountTitle" class="inp" data-dtcombo-caption="Account Title"></select>
            <button type="button" id="btnshow" class="win-btn-show inline" onclick="executeGLS()"><i class="fa fa-eye"></i> Show</button>
        </div>
    </div>
</div>

<div class="grid-caption"><span>General Ledger Statement</span><span id="lblStatus"></span></div>
<div class="grid-wrap"><table class="wg" id="grd"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20260930s}"></script>
<script>
    let CTX = null, glsRows = [];
    const AMOUNT = { Opening: 1, Closing: 1, DebitAmount: 1, CreditAmount: 1 };
    const DATES = { VoucherDate: 1, ForGroup: 1 };

    function lookup(name) { return AccF.get('/ledger-lookups/' + name); }
    function firstValue(sel) { const o = $(sel).find('option').filter(function () { return this.value !== ''; }).first(); if (o.length) $(sel).val(o.val()); }

    /* btnshow_Click + GridSettings (RetrieveStructure: every column the procedure returns) */
    async function executeGLS() {
        const acc = $('#cmbAccountTitle').val();
        if (!(parseInt(acc, 10) > 0)) { alert('Account Title Field Required............'); return; }
        const btn = $('#btnshow');
        AccF.busy(btn, true);
        try {
            glsRows = (await AccF.post('/general-ledger-statement', {
                accountId: acc, fromDate: $('#fromdate').val(), toDate: $('#todate').val(),
                branchId: $('#cmbbranch').val() || null, projectId: $('#cmbproject').val() || null
            })) || [];
            if (!glsRows.length) { $('#lblStatus').text(''); return; }   /* lst.Rows.Count == 0: the grid keeps what it had */
            const cols = Object.keys(glsRows[0]).map(function (k) {
                return { key: k, type: AMOUNT[k] ? 'single' : (DATES[k] ? 'date' : undefined) };
            });
            AccF.renderGrid({ table: '#grd', rows: glsRows, columns: cols, emptyText: '' });
            $('#lblStatus').text('Records: ' + glsRows.length);
        } catch (e) { alert(e.message); }
        finally { AccF.busy(btn, false); }
    }

    /* reset(): account cleared, focus From Date */
    function resetGLS() { $('#cmbAccountTitle').val(''); document.getElementById('fromdate').focus(); }
    /* print_Click_1: "Not Record Found For Display" when the statement is empty; the Crystal report itself is not ported */
    function printGLS() { if (!glsRows.length) { alert('Not Record Found For Display'); return; } window.print(); }

    $(document).on('keydown', function (e) {
        if (!e.ctrlKey) return;
        const k = (e.key || '').toLowerCase();
        if (k === 'n') { e.preventDefault(); resetGLS(); }
        else if (k === 'p') { e.preventDefault(); printGLS(); }
    });

    $(function () { (async function () {
        $('#todate').val(AccF.today());
        try {
            CTX = await AccF.context();
            AccF.fillSelect('#cmbcomp', await lookup('companies'), 'Id', 'CompName', null);
            firstValue('#cmbcomp');
            AccF.fillSelect('#cmbAccountTitle', await lookup('coa'), 'Id', 'AccountTitle', '');
            const branches = await lookup('branches');
            AccF.fillSelect('#cmbbranch', branches, 'Id', 'BranchName', null);
            firstValue('#cmbbranch');
            /* ProjectFill binds the branch table with display member "ProjectName", a column Sp_Branches_GetAllMethod 'GetAll'
               does not return; the row's value (Id) is what the combo can show. */
            AccF.fillSelect('#cmbproject', branches.map(function (b) { return { Id: b.Id, T: b.ProjectName != null ? b.ProjectName : String(b.Id) }; }), 'Id', 'T', null);
            firstValue('#cmbproject');
            $('#fromdate').val((CTX.activeYear && CTX.activeYear.startPeriod) || AccF.today());
            document.getElementById('fromdate').focus();
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
