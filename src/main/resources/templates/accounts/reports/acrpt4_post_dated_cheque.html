<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm" id="frmPostDatedChequeReports">

    <!-- FormPanel (Top 185) -->
    <div class="fp">
        <div class="ts">
            <button type="button" id="refresh" title="Refresh"><svg viewBox="0 0 16 16"><path d="M2 14l1-4 8-8 3 3-8 8z" fill="#f0c040" stroke="#7a5b00"/><path d="M2 14l1-4 3 3z" fill="#444"/></svg><span><u>R</u>efresh</span></button>

        </div>
        <div class="bar"><span class="cap">Post Dated Cheque Report</span></div>

        <div class="gb">
            <div class="gb-frame"></div><span class="gb-cap">Criteria's</span>
            <span class="lbl" style="left:11px;top:19px;">Cheque From Date</span>
            <input type="date" id="chqFrom" class="tb" style="left:135px;top:15px;width:153px;height:23px;" autocomplete="off">
            <span class="lbl" style="left:11px;top:46px;">Cheque To Date</span>
            <span class="dtp off" id="toWrap" style="left:135px;top:42px;width:153px;height:23px;"><input type="checkbox" id="toChk" title="Cheque to date"><input type="date" id="chqTo"></span>
            <span class="lbl" style="left:11px;top:73px;">Cheque No From</span>
            <input id="noFrom" class="tb" inputmode="numeric" style="left:135px;top:69px;width:153px;height:23px;" autocomplete="off">
            <span class="lbl" style="left:12px;top:101px;">Cheque No To</span>
            <input id="noTo" class="tb" inputmode="numeric" style="left:135px;top:97px;width:153px;height:23px;" autocomplete="off">

            <span class="lbl" style="left:289px;top:19px;">Bank GL Account</span>
            <select id="bank" data-dtcombo="single" data-dtcombo-caption="Bank Gl Account Name" style="position:absolute;left:394px;top:13px;width:281px;height:26px;"></select>
            <span class="lbl" style="left:289px;top:46px;">Cheque Account</span>
            <select id="acct" data-dtcombo="single" data-dtcombo-caption="Account Name" style="position:absolute;left:394px;top:40px;width:281px;height:26px;"></select>

            <label class="rb" style="left:395px;top:99px;"><input type="radio" name="st" id="rbUnclear" checked>Unclear</label>
            <label class="rb" style="left:466px;top:99px;"><input type="radio" name="st" id="rbClear">Clear</label>
            <button type="button" id="show" class="teal-btn dk" style="left:613px;top:95px;width:62px;height:26px;" title="Show">Show</button>
        </div>
    </div>

    <!-- DataGridHistory Fill -->
    <div class="gridbox">
