<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bills Payables Report</title>
<link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
<link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
<link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
<link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_pay.css?v=20260930s}">
<style>.accf table.wg th { white-space: normal; }</style>
</head>
<!--
  "Bills Payables Report" hub entry (route /accounts/reports/bills-payables-report; replaces a static mock-up with invented bills).
  No ScreenDefinition row carries this name: "Bills Payable" (screen 38 frmBillsPayables) is a voucher form, already at
  /accounts/vouchers/bills-payables. The desktop's payables report built on bill amounts is
  Architecture.WinApp.Account_Reports.PayablesWithBillAmount ("Payables Report" - payables with the last bill and last paid amount,
  141-Print), opened from the Accounts dashboard (CommonServices.GoToPayablesWithBillAmountFromLinkedEvent); this page ports it.
  Receivables_Load: branch feature 17 -> BranchesFill (GetBranchesFromVouchersByAccountId(org, CompanyIdFromBreakUp = 0) -> no @CompanyId;
  checked list with 18; UserAccount.BranchName pre-selected), AccountFill3rdLevel (ReadAllAccountgroup level 3 / type 3 / class 3,
  value column AccountCode), From Date = ActiveYr.Start_Period, To Date = today (designer), then GetData() at once.
  GetData -> VoucherReports.PayablesWithLastBillAndPaidAmount -> Sp_Accounts_PayablesWithLastBillAndPaidAmount_Rpt
  (@AccountType 3, @ParentAccountCode = checked group accounts' codes, @BalanceFrom/@BalanceTo = Conversion.ToInt of the Closing boxes
  when non-zero, @BranchesIds by GetBranchesIdsByFeature). GridSettings: BranchesId / AccountId / ObDebit / ObCredit hidden,
  BranchName only with feature 17 and a branch chosen; Opening / Closing "#,#;(#,#);0", Debit / Credit / bill and paid amounts "#,#",
  all summed; AccountCode links to the General Ledger (AccountId, From, To, 0, BranchesId).
  btnNew_Click (Reset): dates back to year start / today, Closing boxes cleared, Group Account text AND list cleared, grid cleared.
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-file-text-o"></i> Payables Report</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<ul class="win-tabs"><li class="active"><a>Payables Report</a></li></ul>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew" onclick="resetForm()"><i class="fa fa-plus text-success"></i> Reset</button>
    <button type="button" class="win-btn" id="btnPrint" onclick="printReport()" data-rpt="141-AccountPayablesWithLastBillAmountAndDate.rpt"><i class="fa fa-print"></i> 141-Print</button>
    <a class="win-btn" href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a>
</div>
<div class="win-header-panel"><span>Payables Report</span></div>

<div class="filters">
    <div class="gb" style="width:960px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 112px 112px 89px 89px 220px 210px 70px;">
            <span class="lbl">From Date</span><span class="lbl">To Date</span><span class="lbl">Closing From</span><span class="lbl">Closing To</span>
            <span class="lbl">Group Account</span><span class="lbl br-f">Branches</span><span></span>
            <input type="date" id="fromdate" class="inp"><input type="date" id="todate" class="inp">
            <input type="text" id="txtBalanceFrom" class="inp" style="text-align:right;" inputmode="numeric">
            <input type="text" id="txtBalanceTo" class="inp" style="text-align:right;" inputmode="numeric">
            <div><select id="cmbAccount" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Account Title"></select></div>
            <div class="br-f"><select id="CmbBranches" class="inp" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></div>
            <button type="button" id="btnshow" class="win-btn-show" onclick="getData()"><i class="fa fa-eye"></i> Show</button>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Payables Report</span><span id="lblStatus"></span></div>
<div class="grid-wrap fill"><table class="wg" id="grd"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20261002gv}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}"></script>
<script>
    'use strict';
    let CTX = null, LK = null, rows = [], branchFeature = false, consolidated = false, ranFrom = '', ranTo = '', branchShown = false;

    /* With feature 18 the enhanced single Branches combo is unwrapped and re-enhanced as the desktop's CHECKED combo
       (multiple + data-dtcombo-checked, countx_prod_combo.js checked mode, 2026-10-02). */
    function nativeMulti(s) {
        const c = s.__dtcombo;
        if (c && c.wrap && c.wrap.parentNode) {
            c.wrap.parentNode.insertBefore(s, c.wrap); if (c.destroy) c.destroy(); c.wrap.remove();
            s.classList.remove('dtcombo-native'); s.removeAttribute('aria-hidden'); s.removeAttribute('tabindex');
            delete s.value; delete s.selectedIndex; delete s.__dtcombo; delete s.__dtcomboHooked;
            const l = window.DesktopCombo && DesktopCombo.instances, i = l ? l.indexOf(c) : -1; if (i >= 0) l.splice(i, 1);
        }
        s.multiple = true; s.setAttribute('data-dtcombo-checked', '');
        if (window.DesktopCombo) DesktopCombo.enhance(s);
    }
    function columns() {
        return [
            { key: 'BranchName', caption: 'BranchName', visible: branchShown },
            { key: 'AccountCode', link: function (r) { AccF.openLedger(r.AccountId, ranFrom, ranTo, 0, r.BranchesId); } },
            { key: 'AccountTitle', wrap: true },
            { key: 'CityName' },
            { key: 'Opening', type: 'hashboth', sum: true },
            { key: 'CurrDebit', caption: 'Debit', type: 'hash', sum: true },
            { key: 'CurrCredit', caption: 'Credit', type: 'hash', sum: true },
            { key: 'ClDebit', caption: 'Closing', type: 'hashboth', sum: true },
            { key: 'LastBillDate', type: 'date' },
            { key: 'LastBillsAmount', type: 'hash', sum: true },
            { key: 'BillDays', align: 'r' },
            { key: 'LastRcvdDate', caption: 'Last Paid Date', type: 'date' },
            { key: 'LastRcvdAmount', caption: 'Last Paid Amount', type: 'hash', sum: true },
            { key: 'RcvdDays', caption: 'Paid Days', align: 'r' }
        ];
    }
    function render() {
        if (!rows.length) { $('#grd').empty(); $('#lblStatus').text(''); return; }   /* grd.ClearStructure() */
        AccF.renderGrid({ table: '#grd', columns: columns(), rows: rows });
        $('#lblStatus').text('Records: ' + rows.length);
    }
    function branchValue() { const v = $('#CmbBranches').val(); return v ? (Array.isArray(v) ? v : [v]).filter(Boolean).join(',') : ''; }
    async function getData() {
        const btn = $('#btnshow');
        AccF.busy(btn, true);
        try {
            const q = new URLSearchParams({ fromDate: $('#fromdate').val(), toDate: $('#todate').val(),
                balanceFrom: $('#txtBalanceFrom').val(), balanceTo: $('#txtBalanceTo').val(),
                parentAccountCodes: ($('#cmbAccount').val() || []).join(','), branches: branchFeature ? branchValue() : '' });
            const r = await fetch('/api/accounts/bills-payables?' + q, { headers: { Accept: 'application/json' } });
            const data = await r.json().catch(function () { return null; });
            if (!r.ok) throw new Error((data && data.message) || ('HTTP ' + r.status));
            rows = data || []; ranFrom = $('#fromdate').val(); ranTo = $('#todate').val();
            branchShown = branchFeature && branchValue() !== '';
            render();
        } catch (e) { alert(e.message); }
        finally { AccF.busy(btn, false); }
    }
    function fillAccounts() { AccF.fillSelect('#cmbAccount', (LK && LK.controls) || [], 'AccountCode', 'AccountTitle', null); }
    /* btnNew_Click_1 */
    function resetForm() {
        $('#fromdate').val((CTX && CTX.activeYear && CTX.activeYear.startPeriod) || AccF.today());
        $('#todate').val(AccF.today());
        $('#txtBalanceFrom, #txtBalanceTo').val('');
        $('#cmbAccount').empty();                                    /* cmbAccount.Text = ""; DataSource = null */
        rows = []; render();
    }
    /* print_Click: 141-AccountPayablesWithLastBillAmountAndDate.rpt */
    function printReport() {
        if (!rows.length) { alert('Record Not Found For Display'); return; }
        window.print();
    }
    /* txtBalanceFrom/To_KeyPress: CommonServices.OnlytextNumberFunction - digits only */
    $('#txtBalanceFrom, #txtBalanceTo').on('keypress', function (e) { if (e.key.length === 1 && !/[0-9.\-]/.test(e.key)) e.preventDefault(); });
    $(document).on('keydown', function (e) {
        if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); printReport(); }
        if ((e.ctrlKey && (e.key === 'e' || e.key === 'E')) || e.key === 'Escape') { window.location.href = '/accounts/dashboard'; }
    });

    $(function () { (async function () {
        try {
            CTX = await AccF.context();
            const r = await fetch('/api/accounts/payables-sub-bills/lookups', { headers: { Accept: 'application/json' } });
            LK = await r.json();
            if (!r.ok) throw new Error(LK.message || ('HTTP ' + r.status));
            const f = LK.features || [];
            branchFeature = f.indexOf(17) >= 0; consolidated = branchFeature && f.indexOf(18) >= 0;
            if (!branchFeature) { $('.br-f').hide(); }
            else {
                if (consolidated) nativeMulti(document.getElementById('CmbBranches'));
                AccF.fillSelect('#CmbBranches', LK.branches || [], 'Id', 'BranchName', consolidated ? null : '');
                if ((LK.branches || []).length) $('#CmbBranches').val(consolidated ? [String(LK.branchId)] : String(LK.branchId));
            }
            fillAccounts();
            $('#fromdate').val((CTX.activeYear && CTX.activeYear.startPeriod) || AccF.today());
            $('#todate').val(AccF.today());
            await getData();                                           /* Receivables_Load ends with GetData() */
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
