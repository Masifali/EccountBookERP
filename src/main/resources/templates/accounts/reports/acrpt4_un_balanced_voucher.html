<style>

    .p5 { flex: 0 0 60px; height: 60px; position: relative; background: #fff; }

<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm" id="AuditDashboard">

    <!-- panel2: toolStrip3 -->
