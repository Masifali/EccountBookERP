<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wages Report (With Activities) - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-excel { background-color: #166534; color: white; border: 1px solid #14532d; }
        .btn-erp-excel:hover { background-color: #14532d; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .form-control-erp:focus { border-color: #00796B; outline: none; }
        .erp-table-container { background: white; border: 1px solid #cbd5e1; border-radius: 3px; overflow-x: auto; max-height: calc(100vh - 200px); }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .erp-table th { background-color: #00796B; color: white; padding: 6px 8px; text-align: left; border: 1px solid #004d40; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        .erp-table td { padding: 4px 8px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .erp-table tr:hover { background-color: #e0f2f1; }
        .totals-bar { background: #e0f2f1; font-weight: bold; color: #004d40; font-size: 12px; padding: 6px 12px; border: 1px solid #00796B; border-radius: 2px; display: flex; justify-content: space-between; margin-top: 8px; }
    </style>
</head>
<body>

<!-- ==========================================================================
     Wages Report (With Activities)
     Ditto Architecture.WinApp.Pcc.Reports\WagesReportWithActivities.cs (116 KB).
     label23 "Wages Report With Activities" (:2033); groupBox1 "Filters" (:1503).

     What stood here before was a generic 4-filter page with nine hard-coded columns that POSTed to
     /accounts/api/reports/wages-report - the PLAIN Wages Report's endpoint, backed by a different
     procedure - and carried no Report Type selector at all, which is this report's whole point.
     ========================================================================== -->
<div class="erp-header">
    <span>Wages Report With Activities</span>
    <span th:text="${moduleTitle}">Wages Report (With Activities)</span>
</div>

<!-- btnNew, btnPrint, btnshortcutkeys (:2046-2067) -->
<div class="erp-toolbar">
    <button type="button" class="btn-erp" id="btnNew" onclick="wraNew()"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="btn-erp" id="btnPrint" onclick="window.print()"><i class="fa fa-print"></i> Print</button>
    <button type="button" class="btn-erp btn-erp-excel" id="btnExport" onclick="wraExportCsv()"><i class="fa fa-file-excel-o"></i> Export CSV</button>
    <button type="button" class="btn-erp" id="btnShortcuts" onclick="wraShortcuts()"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
    <span style="flex:1;"></span>
    <a class="btn-erp" href="/wages"><i class="fa fa-arrow-left"></i> Contractor Wages</a>
</div>

<div style="padding:10px;">

    <fieldset class="erp-fieldset">
        <legend>Filters</legend>

        <div class="row g-2">
            <!-- label2 "Date Type" - CommonServices.DateType(), Rows[2] active = "This Month" (:432) -->
            <div class="col-md-2">
                <label class="form-label-erp">Date Type</label>
                <select id="cmbDateType" class="form-control-erp" onchange="wraApplyDateType()"></select>
            </div>
            <!-- label1 "Date From" / label4 "Date To" -->
            <div class="col-md-2">
                <label class="form-label-erp">Date From</label>
                <input type="date" id="txtDateFrom" class="form-control-erp"/>
            </div>
            <div class="col-md-2">
                <label class="form-label-erp">Date To</label>
                <input type="date" id="txtDateTo" class="form-control-erp"/>
            </div>
            <!-- label3 "From Doc && To" - txtFromDoc / txtDocTo -->
            <div class="col-md-3">
                <label class="form-label-erp">From Doc &amp; To</label>
                <div style="display:flex; gap:4px;">
                    <input type="number" id="txtFromDoc" class="form-control-erp" placeholder="From"/>
                    <input type="number" id="txtDocTo"   class="form-control-erp" placeholder="To"/>
                </div>
            </div>
            <!-- RadSales -> ActionId 2, RadProduction -> ActionId 1 (:513-519). Neither checked
                 leaves ActionId 0, which the BLL omits - kept here as "Both". -->
            <div class="col-md-3">
                <label class="form-label-erp">Source</label>
                <div style="display:flex; gap:10px; align-items:center; height:24px;">
                    <label style="font-weight:normal; margin:0;"><input type="radio" name="radSource" id="RadBoth" value="0" checked> Both</label>
                    <label style="font-weight:normal; margin:0;"><input type="radio" name="radSource" id="RadSales" value="2"> Sales</label>
                    <label style="font-weight:normal; margin:0;"><input type="radio" name="radSource" id="RadProduction" value="1"> Production</label>
                </div>
            </div>
        </div>

        <div class="row g-2" style="margin-top:6px;">
            <!-- label7 "Plant Name" -->
            <div class="col-md-2">
                <label class="form-label-erp">Plant Name</label>
                <select id="Cmbplant" class="form-control-erp wra-select2"><option value="">...Select Any Value...</option></select>
            </div>
            <!-- label9 "Item Name" -->
            <div class="col-md-2">
                <label class="form-label-erp">Item Name</label>
                <select id="cmbItem" class="form-control-erp wra-select2"><option value="">...Select Any Value...</option></select>
            </div>
            <!-- label5 "Contractor" -->
            <div class="col-md-2">
                <label class="form-label-erp">Contractor</label>
                <select id="cmbContractor" class="form-control-erp wra-select2"><option value="">...Select Any Value...</option></select>
            </div>
            <!-- label6 "Service Activity" -->
            <div class="col-md-2">
                <label class="form-label-erp">Service Activity</label>
                <select id="cmbServiceActivity" class="form-control-erp wra-select2"><option value="">...Select Any Value...</option></select>
            </div>
            <!-- label11 "Report Type" - the twelve types from ReportTypeFill() (:338-353) -->
            <div class="col-md-3">
                <label class="form-label-erp">Report Type</label>
                <select id="cmbReportType" class="form-control-erp wra-select2"></select>
            </div>
            <div class="col-md-1" style="display:flex; align-items:flex-end;">
                <!-- btnshow "Show" (:1613) -->
                <button type="button" class="btn-erp btn-erp-primary" id="btnShow" onclick="wraShow()" style="width:100%; justify-content:center;">Show</button>
            </div>
        </div>
    </fieldset>

    <div id="wraMessage" style="display:none; margin-bottom:8px; padding:5px 9px; font-size:11px; font-weight:bold;"></div>

    <!-- Columns are whatever [pcc].[USP_WagesReportWithActivities] returns for the chosen Report
         Type - the procedure shapes its own result set per @ActivityName, so no per-type column
         list is hand-written here and none can drift from the procedure. -->
    <div class="erp-table-container">
        <table class="erp-table" id="tblWagesActivityReport">
            <thead><tr id="tblHead"><th>Choose a Report Type and press Show.</th></tr></thead>
            <tbody id="tblBody">
                <tr><td style="text-align:center; padding:16px; color:#64748b;">No data yet.</td></tr>
            </tbody>
            <tfoot><tr id="tblFoot"></tr></tfoot>
        </table>
    </div>

    <div class="totals-bar">
        <span>Records: <b id="lblTotalRecords">0</b></span>
        <span>Qty: <b id="lblTotalQty">0.00</b> &nbsp;|&nbsp; Amount: <b id="lblTotalAmount">0.00</b></span>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_wages_report_activities.js}"></script>
</body>
</html>
