<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payables Report Invoice Wise</title>
<link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
<style>body{margin:0;background:#f0f0f0;font:13px Tahoma,Arial}header{background:teal;color:white;padding:8px;font-weight:bold}header a{float:right;color:white}main{padding:10px}fieldset{border:1px solid #aaa;display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px}label{display:block}input,select,button{font:inherit;box-sizing:border-box;min-height:26px}select{width:230px}button{padding:4px 12px;cursor:pointer}button:disabled{cursor:wait;opacity:.6}#show{background:teal;color:white;border:1px solid #006060}.grid{max-width:100%;overflow:auto;background:white}table{border-collapse:collapse;min-width:100%;white-space:nowrap}th,td{border:1px solid #bbb;padding:5px 8px}th{background:teal;color:white;text-align:left}#status{padding:10px 0}#status[aria-busy=true]:before{content:'◌ ';display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toolbar{padding:8px;display:flex;gap:8px}.select2-container{max-width:100%}</style></head><body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<header>Payables Report Invoice Wise <a href="/accounts/dashboard">Accounts</a></header>
<div class="toolbar"><button id="reset">New / Reset</button><button id="refresh">Refresh</button><button id="export">Export CSV</button></div>
<main><fieldset><legend>Filters</legend>
<div><label><input type="checkbox" id="useFrom" checked> From Date</label><input type="date" id="fromDate"></div>
<div><label><input type="checkbox" id="useTo" checked> To Date</label><input type="date" id="toDate"></div>
<div><label for="partyId">Party Name</label><select id="partyId"></select></div>
<div><label for="agentId">Commission Agent</label><select id="agentId"></select></div>
<div><label for="parentId">Parent Account</label><select id="parentId"></select></div>
<div><label for="groupId">Custom Group</label><select id="groupId"></select></div>
<div><label for="actionId">Status</label><select id="actionId"><option value="0">All</option><option value="1">Paid</option><option value="2">Balance</option></select></div>
<button id="show">Show</button></fieldset>
<div id="status" role="status" aria-live="polite">Select filters and press Show.</div>
<div class="grid"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></main>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_payables_invoice_wise.js}"></script></body></html>
