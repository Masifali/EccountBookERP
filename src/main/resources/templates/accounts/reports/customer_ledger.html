<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Party Ledger</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!--
  Screen 49 "Customer Ledger" - Architecture.WinApp.Account_Reports.CustomerLedger (shown as the "Party_Ledger" tab of GeneralLedger).
  Load (VoucherValidation_Load): GlInfoBox hidden; suppliercustomer() = SupplierCustomerGetforComboServiceBind
  (Sp_SupplierCustomer_GetAllMethod ReadByOrganizationIdCompanyIdForBinding: Id / CompanyName / GlAccountId);
  DateTypeFill() = CommonServices.DateType() (5 fixed rows); CmbDateType.Rows[1] activated -> "This Week":
  from = today - 7, to keeps today.
  comSupplier_Leave / Show -> LedgerDetailByAccountId(GlAccountId): Sp_ChartofAccount_GetAllMethodFromCOA GetCoaDetailByAccountId +
  Sp_Vouchers_GetMethods GetAccountsBalancesOpeningCurrentAndClosing (/accounts/api/reports-desktop/account-info).
  Show (CustomerLedgerFill): "Party Name required. Please Check!" when no party; InventoryStockEvalautionDetail
  .GeneralLedgerSupplierCustomerQuantative -> Sp_GeneralLedger_SupplierCustomerQuantative (/accounts/api/reports-desktop/customer-ledger).
  Grid (grdCustomerLedgerSettings): V-Type, V-Date, V-No, Description, VehicleNo, Qty, Weight, OrderNo, RateCut, NetRate,
  Debit Amount, Credit Amount, RunningBalance, BalType, ManualBillNo, GpNo, GpDate; Qty / Weight / Debit / Credit summed "#,#";
  RunningBalance "#,#;(#,#);0"; RefDocNoId / RefDocumentTypeId hidden.
  Toolbar (toolStrip3): Reset, Refresh (reloads the party list), 130-Print, ShortCut Keys.
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-address-book"></i> Ledgers</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<ul class="win-tabs">
    <li><a href="/accounts/reports/general-ledger">General Leder</a></li>
    <li class="active"><a>Party_Ledger</a></li>
</ul>
<div class="win-toolbar">
    <button type="button" class="win-btn" onclick="resetCL()"><i class="fa fa-plus text-success"></i> Reset</button>
    <button type="button" class="win-btn" onclick="refreshCL()"><i class="fa fa-refresh text-primary"></i> Refresh</button>
    <button type="button" class="win-btn" onclick="printCL()" data-rpt="130-RptAcSupplierCustomerQuantativeGL.rpt" data-rpt-own><i class="fa fa-print"></i> 130-Print</button>
    <button type="button" class="win-btn" onclick="shortcutKeys()"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
</div>
<div class="win-header-panel"><span>Party  Ledger</span></div>

<div class="filters">
    <div class="gb" style="width:470px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 70px 1fr 55px 1fr;">
            <span class="lbl">Date Type</span>
            <select id="CmbDateType" class="inp" style="grid-column: span 3;" data-dtcombo-caption="Date Type"></select>

            <span class="lbl">From Date</span><input type="date" id="txtfromdate" class="inp">
            <span class="lbl">To Date</span><input type="date" id="txttodate" class="inp">

            <span class="lbl">Party Name</span>
            <select id="comSupplier" class="inp" style="grid-column: span 2;" data-dtcombo-caption="Party Name"></select>
            <span style="text-align:right;"><button type="button" id="btnshow" class="win-btn-show inline" onclick="executeCL()"><i class="fa fa-eye"></i> Show</button></span>
        </div>
    </div>

    <div class="gb" id="GlInfoBox" style="display:none;">
        <span class="gb-title">GL Information</span>
        <div class="info-grid">
            <span>Account Code</span><span id="lblAccountCode"></span><span>Opening</span><span class="v" id="lblOpening">0</span><span id="OpeningDrCr"></span>
            <span>Account Class</span><span id="lblAccountClass"></span><span>Total Debit</span><span class="v" id="lblCurrDebit">0</span><span></span>
            <span>Account Type</span><span id="lblAccountType"></span><span>Total Credit</span><span class="v" id="lblCurrCredit">0</span><span></span>
            <span></span><span></span><span>Closing</span><span class="v" id="lblClosingBal">0</span><span id="lblBalType"></span>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Party Ledger</span><span id="lblStatus"></span></div>
<div class="grid-wrap"><table data-gridbar="CustomerLedger:grd" class="wg" id="grd"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20260930s}"></script>
<script>
    const QS = new URLSearchParams(window.location.search);
    let CTX = null, PARTIES = [], clRows = [];

    /* suppliercustomer(): BindDDL(dt, comSupplier, "Id", "CompanyName", "Party Name", ZeroIndex false) */
    async function suppliercustomer() {
        const cur = $('#comSupplier').val();
        PARTIES = await AccF.lookup('supplier-customers');
        AccF.fillSelect('#comSupplier', PARTIES, 'Id', 'CompanyName', '');
        if (cur) $('#comSupplier').val(cur);
    }
    function glAccountIdOf(id) {
        const p = PARTIES.find(function (x) { return String(x.Id) === String(id); });
        return p ? AccF.num(p.GlAccountId) : 0;
    }
    function drCr(v) { return v > 0 ? 'Dr' : (v < 0 ? 'Cr' : 'Nill'); }

    /* LedgerDetailByAccountId */
    async function ledgerDetail() {
        const accountId = glAccountIdOf($('#comSupplier').val());
        const info = await AccF.post('/account-info', { accountId: accountId, fromDate: $('#txtfromdate').val(), toDate: $('#txttodate').val() });
        const coa = info && info.coa, bal = info && info.balances;
        let show = false;
        if (coa) {
            show = true;
            $('#lblAccountCode').text(coa.AccountCode == null ? '' : coa.AccountCode);
            $('#lblAccountClass').text(coa.ClassName == null ? '' : coa.ClassName);
            $('#lblAccountType').text(coa.AccountType == null ? '' : coa.AccountType);
        } else { $('#lblAccountCode, #lblAccountClass, #lblAccountType').text(''); }
        if (bal) {
            const o = AccF.num(bal.OpeningBalance), d = AccF.num(bal.DebitAmount), c = AccF.num(bal.CreditAmount), cl = AccF.num(bal.ClosingBalance);
            $('#lblBalType').text(drCr(cl)); $('#OpeningDrCr').text(drCr(o));
            if (o > 0 || d > 0 || c > 0 || cl > 0) show = true;
            $('#lblOpening').text(AccF.hashBoth(o)); $('#lblCurrDebit').text(AccF.hashBoth(d));
            $('#lblCurrCredit').text(AccF.hashBoth(c)); $('#lblClosingBal').text(AccF.hashBoth(cl));
        } else {
            show = false;
            $('#lblOpening, #lblCurrDebit, #lblCurrCredit, #lblClosingBal').text('0');
        }
        $('#GlInfoBox').toggle(show);
    }

    /* grdCustomerLedgerSettings */
    function render() {
        const rows = clRows.map(function (r) {
            const rb = AccF.num(r.RunningBalance);
            return {
                DocumentTypeCode: r.DocumentTypeCode, 'V-Date': r.DocDate, 'V-No': r.DocNo, RefDocNoId: r.RefDocNoId,
                RefDocumentTypeId: r.RefDocumentTypeId, Description: r.ItemName, VehicleNo: r.VehicleNo, Qty: r.QtyIn,
                Weight: r.WeightIn, OrderNo: r.OrderNo, RateCut: r.RateCut, NetRate: r.NetRate, DebitAmt: r.DebitAmt,
                CreditAmt: r.CreditAmt, RunningBalance: rb, BalType: drCr(rb), ManualBillNo: r.MnBillNo, GpNo: r.GpNo, GpDate: r.GpDate
            };
        });
        AccF.renderGrid({
            table: '#grd', rows: rows, emptyText: '',
            columns: [
                { key: 'DocumentTypeCode', caption: 'V-Type', width: 55 },
                { key: 'V-Date', type: 'date', width: 70 },
                { key: 'V-No', width: 60 },
                { key: 'RefDocNoId', visible: false }, { key: 'RefDocumentTypeId', visible: false },
                { key: 'Description', width: 200, wrap: true },
                { key: 'VehicleNo', width: 75 },
                { key: 'Qty', type: 'hash', sum: true, width: 75 },
                { key: 'Weight', type: 'hash', sum: true, width: 75 },
                { key: 'OrderNo', align: 'r', width: 65 },
                { key: 'RateCut', type: 'hash', width: 65 },
                { key: 'NetRate', type: 'hash', width: 65 },
                { key: 'DebitAmt', caption: 'Debit Amount', type: 'hash', sum: true, width: 100 },
                { key: 'CreditAmt', caption: 'Credit Amount', type: 'hash', sum: true, width: 100 },
                { key: 'RunningBalance', type: 'hashboth', width: 100 },
                { key: 'BalType', width: 55 },
                { key: 'ManualBillNo', width: 70 },
                { key: 'GpNo', width: 60 },
                { key: 'GpDate', type: 'date', width: 75 }
            ]
        });
        $('#lblStatus').text(clRows.length ? 'Records: ' + clRows.length : '');
    }

    /* btnshow_Click -> CustomerLedgerFill */
    async function executeCL() {
        const id = $('#comSupplier').val();
        if (!(parseInt(id, 10) > 0)) { alert('Party Name required. Please Check!'); AccF.focus('#comSupplier'); return; }
        const btn = $('#btnshow');
        AccF.busy(btn, true);
        try {
            await ledgerDetail();
            clRows = (await AccF.post('/customer-ledger', { supplierCustomerId: id, fromDate: $('#txtfromdate').val(), toDate: $('#txttodate').val() })) || [];
            if (clRows.length) render(); else { $('#grd').empty(); $('#lblStatus').text(''); }
        } catch (e) {
            clRows = []; $('#grd').empty();
            alert(e.message);
        } finally { AccF.busy(btn, false); }
    }

    /* reset(): Date Type Rows[1] (This Week), focus Date Type, party cleared, GlInfoBox hidden, grid cleared */
    function resetCL() {
        $('#CmbDateType').val('2').trigger('change');
        $('#comSupplier').val('');
        $('#GlInfoBox').hide();
        clRows = []; $('#grd').empty(); $('#lblStatus').text('');
        AccF.focus('#CmbDateType');
    }
    /* btnRefresh_Click: suppliercustomer() */
    async function refreshCL() { try { await suppliercustomer(); } catch (e) { alert(e.message); } }
    /* Both the toolbar and Ctrl+P use report 130 with the selected party and dates. */
    function printCL() {
        if (!clRows.length) { alert('Record Not Found For Display'); return; }
        const supplierCustomerId = parseInt($('#comSupplier').val(), 10);
        if (!(supplierCustomerId > 0)) { alert('Party Name required. Please Check!'); return; }
        const fromDate = $('#txtfromdate').val(), toDate = $('#txttodate').val();
        if (!fromDate || !toDate || fromDate > toDate) { alert('Select a valid From Date and To Date.'); return; }
        return window.printRpt('130-RptAcSupplierCustomerQuantativeGL.rpt', {
            supplierCustomerId: supplierCustomerId, fromDate: fromDate, toDate: toDate
        });
    }
    function shortcutKeys() {
        alert(['Ctrl+N  For Reset', 'Ctrl+R  For Refresh', 'Ctrl+E  For Close', 'Ctrl+P  For Print', 'Ctrl+S  For Show Data',
            'Ctrl+F5  For Focus on Date Type', 'Ctrl+alt  To Show ShortCut Keys Form', 'Ctrl+ArrowDown  For Focus On Grids'].join('\n'));
    }

    $(document).on('keydown', function (e) {
        if (!e.ctrlKey) return;
        const k = (e.key || '').toLowerCase();
        if (k === 'n') { e.preventDefault(); resetCL(); }
        else if (k === 'r') { e.preventDefault(); refreshCL(); }
        else if (k === 'p') { e.preventDefault(); printCL(); }
        else if (k === 's') { e.preventDefault(); executeCL(); }
        else if (e.key === 'F5') { e.preventDefault(); AccF.focus('#CmbDateType'); }
        else if (e.altKey && (e.key === 'Alt' || e.key === 'Control')) { shortcutKeys(); }
    });

    $(function () { (async function () {
        $('#txttodate').val(AccF.today());
        $('#txtfromdate').val(AccF.today());
        try {
            CTX = await AccF.context();
            await suppliercustomer();
            AccF.fillSelect('#CmbDateType', AccF.DATE_TYPES, 'Id', 'Parameters', null);
            $('#CmbDateType').on('change', function () { AccF.applyDateType($(this).val(), '#txtfromdate', '#txttodate', CTX); });
            /* CmbDateType.Rows[1].Activate() -> "This Week" */
            $('#CmbDateType').val('2').trigger('change');
            /* comSupplier_Leave: LedgerDetailByAccountId when a party is chosen, else GlInfoBox hidden */
            $('#comSupplier').on('change', function () {
                if (parseInt($(this).val(), 10) > 0) ledgerDetail().catch(function (e) { alert(e.message); });
                else $('#GlInfoBox').hide();
            });
            /* A report drill-through (supplierCustomerId, fromDate, toDate) selects the party and shows its ledger */
            const sid = QS.get('supplierCustomerId');
            if (sid && PARTIES.some(function (p) { return String(p.Id) === sid; })) {
                $('#comSupplier').val(sid);
                if (/^\d{4}-\d{2}-\d{2}$/.test(QS.get('fromDate') || '')) $('#txtfromdate').val(QS.get('fromDate'));
                if (/^\d{4}-\d{2}-\d{2}$/.test(QS.get('toDate') || '')) $('#txttodate').val(QS.get('toDate'));
                executeCL();
            }
            AccF.focus('#CmbDateType');
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
