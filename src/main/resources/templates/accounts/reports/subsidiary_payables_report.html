<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subsidiary Payables Report</title>
<link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
<link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
<link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
<link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_pay.css?v=20260930s}">
</head>
<!--
  Screen 89 "Subsidiary Payable Receiveables Report" - Architecture.WinApp.Account_Reports.SubsidiaryPayableReceiveables
  (route /accounts/reports/subsidiary-payables-report; replaces a static mock-up with invented rows).
  On the desktop the form has NO filters of its own: TradeDebitorsReport's (hidden) SubsidiaryBreakUp column button opens it with
  ControlAccountId = the row's AccountId, PartyTypeId = 1 (payables, class 3) / 2 (receivables, class 2) and the report's From/To dates,
  and _Load reads only when ControlAccountId > 0. Those four values are taken from the query string
  (?controlAccountId=&fromDate=&toDate=&partyTypeId=) and the form then reads at once, exactly like the desktop.
  Opened from the hub without them, the web page shows a "Filters" box (Account = the payables party accounts the trade report lists,
  AccountTypeId 3 / AccountClass 3; From = ActiveYr.Start_Period, To = today, as TradeDebitorsReport) - web-only, the desktop has no
  standalone entry. GetData -> VoucherHead.GetSubsidiaryPayablesReceivables -> USP_GetSubsidiaryPayablesReceivables
  (@BranchId = UserAccount.BranchesId, @UserId). Grid (GrdSetting): AccountId / SubReferenceId / SubsidiaryTypeId hidden,
  Four Columns (default): Opening, Debit, Credit, Closing; Six Columns: Opening Dr/Cr, Debit, Credit, Closing Dr/Cr; all summed,
  stringFormatboth; AccountCode is a link to the General Ledger (account + subsidiary account). Toolbar: 375-Print, Ctrl+P.
-->
<body class="accf">
<div class="win-title-bar">
    <span><i class="fa fa-sitemap"></i> Subsidiary Payable Receiveables</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnPrint" onclick="printReport()" data-rpt="375-GetSubsidiaryAccountFromVouchers.rpt"><i class="fa fa-print"></i> 375-Print</button>
    <a class="win-btn" href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a>
</div>
<div class="win-header-panel"><span id="label1">Payable Control Account Wise</span>
    <span><label><input type="radio" name="rdCols" id="rdSixColumns"> Six Columns</label>
          <label><input type="radio" name="rdCols" id="rdFourColumns" checked> Four Columns</label></span></div>

<div class="filters" id="webFilters">
    <div class="gb" style="width:760px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 60px 125px 50px 125px 50px 1fr 70px;">
            <span class="lbl">From Date</span><input type="date" id="fromDate" class="inp">
            <span class="lbl">To Date</span><input type="date" id="toDate" class="inp">
            <span class="lbl">Account</span><div><select id="cmbAccount" class="inp" data-dtcombo="single" data-dtcombo-caption="Account Title"></select></div>
            <button type="button" id="btnShow" class="win-btn-show" onclick="getData()"><i class="fa fa-eye"></i> Show</button>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Subsidiary Accounts</span><span id="lblStatus"></span></div>
<div class="grid-wrap fill"><table class="wg" id="DataGridHistory"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script>
    'use strict';
    const QS = new URLSearchParams(window.location.search);
    let rows = [], partyTypeId = 1, ranFrom = '', ranTo = '';

    function columns() {
        const six = $('#rdSixColumns').is(':checked');
        return [
            { key: 'PartyCode' },
            { key: 'SupplierCustomer' },
            { key: 'AccountCode', link: function (r) { AccF.openLedger(r.AccountId, null, null, r.SubReferenceId, 0); } },
            { key: 'AccountTitle' },
            { key: 'ODebit', caption: 'OpeningDebit', type: 'both', sum: true, visible: six },
            { key: 'OCredit', caption: 'OpeningCredit', type: 'both', sum: true, visible: six },
            { key: 'Opening', type: 'both', sum: true, visible: !six },
            { key: 'CurrDebit', caption: 'Debit', type: 'both', sum: true },
            { key: 'CurCredit', caption: 'Credit', type: 'both', sum: true },
            { key: 'CDebit', caption: 'ClosingDebit', type: 'both', sum: true, visible: six },
            { key: 'CCredit', caption: 'ClosingCredit', type: 'both', sum: true, visible: six },
            { key: 'Closing', type: 'both', sum: true, visible: !six }
        ];
    }
    function render() {
        if (!rows.length) { $('#DataGridHistory').empty(); $('#lblStatus').text(''); return; }
        AccF.renderGrid({ table: '#DataGridHistory', columns: columns(), rows: rows });
        $('#lblStatus').text('Records: ' + rows.length);
    }
    async function getData() {
        const acc = parseInt($('#cmbAccount').val() || QS.get('controlAccountId') || '0', 10) || 0;
        if (acc <= 0) { rows = []; render(); return; }                 /* _Load: if (ControlAccountId > 0) GetData() */
        const btn = $('#btnShow');
        AccF.busy(btn, true);
        try {
            const q = new URLSearchParams({ fromDate: $('#fromDate').val(), toDate: $('#toDate').val(), controlAccountId: acc, partyTypeId: partyTypeId });
            const r = await fetch('/api/accounts/subsidiary-payables?' + q, { headers: { Accept: 'application/json' } });
            const data = await r.json().catch(function () { return null; });
            if (!r.ok) throw new Error((data && data.message) || ('HTTP ' + r.status));
            rows = data || []; ranFrom = $('#fromDate').val(); ranTo = $('#toDate').val();
            render();
        } catch (e) { rows = []; render(); alert(e.message); }
        finally { AccF.busy(btn, false); }
    }
    /* btnPrint_Click: 375-GetSubsidiaryAccountFromVouchers.rpt, "No Record Found For Display" when empty. */
    function printReport() {
        if (!rows.length) { alert('No Record Found For Display'); return; }
        window.print();
    }
    $('input[name="rdCols"]').on('change', render);                 /* rdSixColumns_CheckedChanged -> GrdSetting() */
    $(document).on('keydown', function (e) {
        if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); printReport(); }
    });

    $(function () { (async function () {
        try {
            const ctx = await AccF.context();
            partyTypeId = parseInt(QS.get('partyTypeId') || '1', 10) || 1;
            if (partyTypeId === 2) $('#label1').text('Receivables Control Account Wise');
            $('#fromDate').val(QS.get('fromDate') || (ctx.activeYear && ctx.activeYear.startPeriod) || AccF.today());
            $('#toDate').val(QS.get('toDate') || AccF.today());
            const r = await fetch('/api/accounts/payables-sub-bills/lookups', { headers: { Accept: 'application/json' } });
            const lk = await r.json();
            if (!r.ok) throw new Error(lk.message || ('HTTP ' + r.status));
            const cls = partyTypeId === 2 ? 2 : 3, seen = {};
            const accs = (lk.accounts || []).filter(function (a) {
                const id = a.ChartOfAccountId;
                if (Number(a.AccountTypeId) !== 3 || Number(a.AccountClass) !== cls || seen[id]) return false;
                seen[id] = true; return true;
            });
            AccF.fillSelect('#cmbAccount', accs, 'ChartOfAccountId', 'AccountTitle', '');
            if (QS.get('controlAccountId')) {
                $('#cmbAccount').val(QS.get('controlAccountId'));
                await getData();
            }
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
