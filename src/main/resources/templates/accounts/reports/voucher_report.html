<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voucher Report</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
</head>
<!--
  Screen 53 "Voucher Report" - Architecture.WinApp.Account_Reports.VoucherReport.
  Load (VoucherValidation_Load): RdAll; AllowEditOnVoucherNoinReports; VouchertypeFill (multi, checked list),
  GetAllDetailAccount, MultiLanguagesGetAll (hidden, Ctrl+L), CustomeGroupsDefine(1); fromdate = Now (todate keeps today).
  Show: VoucherReports.VoucherValidationReport -> Sp_Accounts_VouchersValidation_Rpt (/accounts/api/reports-desktop/voucher-report).
  Grid: grouped on VoucherCode (V.Code); Debit/Credit summed in stringFormatsingle; ChequePartyName shown only when the
  last row carries one; AccountCode -> General Ledger; V.Code -> the voucher when AllowEditOnVoucherNoinReports.
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-file-text-o"></i> Voucher Report</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" onclick="resetFilters()"><i class="fa fa-plus text-success"></i> Reset</button>
    <button type="button" class="win-btn" onclick="refreshLists()"><i class="fa fa-refresh text-primary"></i> Refresh</button>
    <button type="button" class="win-btn" onclick="window.print()" data-rpt="118-AcRptVoucherSlip.rpt"><i class="fa fa-print"></i> 118-Print</button>
    <button type="button" class="win-btn" onclick="window.print()" data-rpt="118A-VoucherReport.rpt"><i class="fa fa-print"></i> 118A-Print</button>
    <button type="button" class="win-btn" onclick="window.print()" data-rpt="102-ANewAcRptPaymentReceiptsVoucherSlip.rpt"><i class="fa fa-print"></i> 102-Print</button>
    <button type="button" class="win-btn" onclick="exportToExcel()" data-rpt-grid="Voucher Report" data-grid="tblVoucherReport" data-title="Voucher Report"><i class="fa fa-print"></i> Dynamic_Print</button>
</div>
<div class="win-header-panel">
    <span>Voucher Report</span>
    <label class="vr-lang hidden-ctl">Language <select id="CmbLanguage" class="inp" style="width:170px;" data-dtcombo-caption="Language Name"></select></label>
</div>

<div class="filters">
    <div class="gb" style="width:620px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 95px 150px 80px 1fr;">
            <span class="lbl">From Date</span><input type="date" id="txtFromDate" class="inp">
            <span class="lbl">Manual No</span><input type="text" id="txtManualNo" class="inp">

            <span class="lbl">To Date</span><input type="date" id="txtToDate" class="inp">
            <span class="lbl">Account Title</span><select id="cmbAccountTitle" class="inp" data-dtcombo-caption="AccountTitle"></select>

            <span class="lbl">Document Type</span><select id="cmbDocumentType" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Document Type"></select>
            <span class="lbl">Custom Group</span><select id="cmbCustomGroup" class="inp" data-dtcombo-caption="Custome Group"></select>

            <span class="lbl">Doc No From &amp; To</span>
            <span style="display:flex; gap:4px;"><input type="text" id="txtDocNoFrom" class="inp"><input type="text" id="txtDocNoTo" class="inp"></span>
            <span></span>
            <span style="text-align:right;"><button type="button" id="btnshow" class="win-btn-show" onclick="executeVoucherReport()"><i class="fa fa-eye"></i> Show</button></span>
        </div>
    </div>
    <div class="gb">
        <span class="gb-title">Approval</span>
        <div class="fcol" style="gap:5px; margin-top:3px;">
            <label class="chk"><input type="radio" name="rdApproved" value="approved"> Approved</label>
            <label class="chk"><input type="radio" name="rdApproved" value="unapproved"> Un Approved</label>
            <label class="chk"><input type="radio" name="rdApproved" value="all" checked> All</label>
            <label class="chk"><input type="checkbox" id="chkSkipCgs"> Skip CGS Entries</label>
        </div>
    </div>
    <div class="gb">
        <span class="gb-title">Filter Type</span>
        <div class="fcol" style="gap:5px; margin-top:3px;">
            <label class="chk"><input type="radio" name="rdFilterType" value="doc" checked> Doc Date</label>
            <label class="chk"><input type="radio" name="rdFilterType" value="entry"> Entry Date</label>
            <label class="chk"><input type="radio" name="rdFilterType" value="modify"> Modify Date</label>
            <label class="chk"><input type="radio" name="rdFilterType" value="approved"> Approve Date</label>
        </div>
    </div>
</div>

<div class="grid-caption"><span>History</span><span id="lblStatus"></span></div>
<div class="grid-wrap"><table class="wg" id="tblVoucherReport"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}"></script>
<script th:src="@{/build/js/countx_doc_link.js?v=20261001pr}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20261002gv}"></script>
<script>
    let VR_CTX = null, vrRows = [];

    async function fillLists() {
        AccF.fillSelect('#cmbDocumentType', await AccF.lookup('document-types'), 'Id', 'DocumentTypeDescription', null);
        AccF.fillSelect('#cmbAccountTitle', await AccF.lookup('detail-accounts'), 'Id', 'AccountTitle', '');
        AccF.fillSelect('#CmbLanguage', await AccF.lookup('languages'), 'Id', 'LanguageDescription', '');
        AccF.fillSelect('#cmbCustomGroup', await AccF.lookup('custom-groups'), 'Id', 'AcLookUpsDescription', '');
    }

    async function executeVoucherReport() {
        const req = {
            dateFilter: $('input[name="rdFilterType"]:checked').val() || 'doc',
            fromDate: $('#txtFromDate').val() || null, toDate: $('#txtToDate').val() || null,
            fromDocNo: $('#txtDocNoFrom').val() || null, toDocNo: $('#txtDocNoTo').val() || null,
            accountId: $('#cmbAccountTitle').val() || null, customGroupId: $('#cmbCustomGroup').val() || null,
            manualBillNo: $('#txtManualNo').val() || null,
            approval: $('input[name="rdApproved"]:checked').val() || 'all',
            skipCgs: $('#chkSkipCgs').is(':checked'),
            languageId: $('#CmbLanguage').val() || null,
            documentTypeIds: AccF.selectedIds('#cmbDocumentType') || null
        };
        const btn = $('#btnshow');
        AccF.busy(btn, true);
        try {
            vrRows = (await AccF.post('/voucher-report', req)) || [];
            render();
        } catch (e) {
            vrRows = []; $('#tblVoucherReport').empty(); $('#lblStatus').text('');
            alert(e.message);
        } finally { AccF.busy(btn, false); }
    }

    /* GridSettings */
    function render() {
        const chqParty = vrRows.length ? (vrRows[vrRows.length - 1].ChequePartyName || '') : '';
        const voucherLink = VR_CTX && VR_CTX.allowEditOnVoucherNoinReports;
        const rows = vrRows.map(function (r) { return Object.assign({ print: 'print' }, r); });
        AccF.renderGrid({
            table: '#tblVoucherReport', rows: rows, emptyText: '', groupBy: 'VoucherCode', groupCaption: 'V.Code', groupTotals: true,
            columns: [
                { key: 'DocumentType' },
                { key: 'VoucherDate', type: 'date' },
                { key: 'AccountCode', link: function (r) { AccF.openLedger(r.AccountId, $('#txtFromDate').val(), $('#txtToDate').val()); } },
                { key: 'AccountTitle' },
                { key: 'AgainstAccountTitle', caption: 'Offset Account' },
                { key: 'DebitAmount', type: 'single', sum: true },
                { key: 'CreditAmount', type: 'single', sum: true },
                { key: 'ChequeNo' },
                { key: 'ChequePartyName', visible: chqParty !== '' },
                { key: 'ManualBillNo' },
                { key: 'Comments', wrap: true },
                { key: 'EntryUser' }, { key: 'EntryDate', type: 'date' },
                { key: 'ModifyUser' }, { key: 'ModifyDate', type: 'date' },
                { key: 'ApprovedUser' }, { key: 'ApprovedDate', type: 'date' },
                { key: 'NoOfAttachments', align: 'c' },
                { key: 'print', caption: 'print', align: 'c' }
            ]
        });
        if (voucherLink) {
            /* V.Code group rows open the voucher (EditMethodFromLinked) */
            $('#tblVoucherReport tr.grp').each(function () {
                const $td = $(this).find('td').first();
                const code = $td.text().replace(/^.*V\.Code:\s*/, '').replace(/\s*\(\d+\)\s*$/, '');
                const first = vrRows.find(function (r) { return String(r.VoucherCode) === code; });
                if (!first) return;
                const $a = $('<a class="lnk" style="margin-left:8px;">').text('open').on('click', function (e) {
                    e.preventDefault(); e.stopPropagation(); AccF.editLinked(first.DocumentTypeId, first.Id, first.DocumentTypeSrNo, 0);
                });
                $td.append($a);
            });
        }
        $('#lblStatus').text(vrRows.length ? 'Records: ' + vrRows.length : '');
    }

    /* reset(): clear the doc-no range, All approvals, focus the document types */
    function resetFilters() {
        $('#txtDocNoFrom, #txtDocNoTo').val('');
        $('input[name="rdApproved"][value="all"]').prop('checked', true);
        AccF.focus('#cmbDocumentType');
    }
    /* btnRefresh_Click: the four fills again */
    async function refreshLists() { try { await fillLists(); } catch (e) { alert(e.message); } }

    function exportToExcel() {
        const html = document.getElementById('tblVoucherReport').outerHTML;
        const a = document.createElement('a');
        a.href = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
        a.download = 'Voucher_Report.xls';
        a.click();
    }

    $(document).on('keydown', function (e) {
        if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); resetFilters(); }
        if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); $('.vr-lang').removeClass('hidden-ctl'); AccF.focus('#CmbLanguage'); }
    });

    $(function () { (async function () {
        /* VoucherValidation_Load: RdAll; fromdate = Now (todate keeps its default, today) */
        $('#txtFromDate').val(AccF.today());
        $('#txtToDate').val(AccF.today());
        try {
            VR_CTX = await AccF.context();
            await fillLists();
            document.getElementById('txtFromDate').focus();
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
