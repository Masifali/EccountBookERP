<!doctype html>

<title>Trade Accounts</title><link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font:13px 'Segoe UI',sans-serif;background:#f0f0f0;color:#111;height:100vh;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}nav{height:29px;display:flex;gap:8px;align-items:center;padding:2px 6px;background:#eee;border-bottom:1px solid #aaa}h1{font-size:16px;margin:0;color:#174378;height:28px;padding:4px}#filters{flex:none;position:relative;height:117px;min-width:0}.field{position:absolute;height:26px;display:flex;align-items:center}.field>label{width:97px;flex:none}.field select{width:225px}.dates input{width:112px;height:23px;padding:0}input[type=number]{height:23px;min-width:0}.select2-container .select2-selection--single,.select2-container .select2-selection--multiple{height:26px;min-height:26px;border-radius:0}.select2-container .select2-selection__rendered{line-height:24px!important}.select2-selection--multiple .select2-selection__rendered{overflow:auto!important;white-space:nowrap!important;max-height:25px}.options{position:absolute;left:664px;top:2px;display:flex;flex-direction:column;font-size:12px}.options label{height:18px}.mode{position:absolute;left:808px;top:0;display:flex;flex-direction:column;padding:4px;border:1px solid #aaa}.sortbar{display:flex;align-items:center;gap:10px;height:29px;padding:3px;border-block:1px solid #bbb}.grid{flex:1;min-height:0;overflow:auto;background:white}table{border-collapse:collapse;table-layout:fixed;width:max-content;font-size:13px}th,td{border:1px solid #ccc;height:24px;padding:2px 5px;overflow:hidden;white-space:nowrap}th{background:#e4e9ef;height:38px;text-align:center;position:sticky;top:0;z-index:1;white-space:normal}tr.selected td{background:#316ac5;color:#fff}tr.selected a{color:#fff}.num{text-align:right}tfoot{font-weight:bold;background:#e4e9ef}#status{min-height:24px;padding:4px;color:#9b1c1c}a{color:#174378}footer{height:28px;display:flex;gap:4px}footer button.active{background:white;border-bottom:2px solid #174378}#followup{display:none;flex:1;min-height:0;padding:12px}#followup h2{font-size:16px}.notice{padding:10px;border:1px solid #aaa;background:white}#show{position:absolute;left:906px;top:78px;width:62px;height:28px} @media(max-width:1000px){#filters{height:auto;display:flex;flex-wrap:wrap;gap:6px;padding:6px}.field,.options,.mode,#show{position:static}.options{flex-direction:row;flex-wrap:wrap;max-width:320px}.mode{max-width:200px}.sortbar{height:auto;flex-wrap:wrap}h1{height:auto}}
[hidden]{display:none!important}button:disabled{cursor:wait;opacity:.65}tfoot td{position:sticky;bottom:0;background:#e4e9ef;z-index:2}.trade-total{font-weight:bold}</style><link rel="stylesheet" href="/css/report-loading.css"><script src="/js/report-loading.js"></script></head><body th:attr="data-account-class=${accountClass}">
<nav><button id="newReport">New</button><button id="printReport">122-Print</button><button id="cityPrint">122-CityWise</button><a href="/accounts/reports/receivables-new">Receivables Aging Report</a><a href="/accounts/reports/payables-aging">Payables Aging Report</a><a href="/accounts/dashboard">Close</a></nav>
<div style="position:relative;min-height:28px"><h1 id="heading"></h1><label id="costField" style="position:absolute;left:414px;top:0">Cost Center <select id="costCenter" style="width:167px"></select></label></div>
<section id="filters">
<div class="field dates" style="left:3px;top:3px"><label>From &amp; To Date</label><input id="fromDate" type="date"><input id="toDate" type="date"></div>
<div class="field" style="left:3px;top:30px"><label for="controls">Control Account</label><select id="controls" multiple></select></div>
<div class="field" style="left:3px;top:57px"><label for="accounts">Account Title</label><select id="accounts"></select></div>
<div class="field" style="left:3px;top:84px"><label for="customGroups">Custom Group</label><select id="customGroups"></select></div>
<div class="field" style="left:329px;top:3px"><label for="inventoryGroups" style="width:95px">Inventory Group</label><select id="inventoryGroups" multiple style="width:234px"></select></div>
<div class="field" style="left:329px;top:30px"><label for="cities" style="width:95px">City Name</label><select id="cities" style="width:234px"></select></div>
<div class="field" style="left:329px;top:57px"><label style="width:95px">Closing From &amp; To</label><input id="balanceFrom" type="number" value="0" step="any" style="width:115px"><input id="balanceTo" type="number" step="any" style="width:117px"></div>
<div class="field" id="branchField" style="left:329px;top:84px"><label for="branches" style="width:95px">Branches</label><select id="branches" style="width:234px"></select></div>
<div class="options"><label><input id="credit" type="checkbox">Only Credit Balance</label><label><input id="debit" type="checkbox">Only Debit Balance</label><label><input id="tradeOnly" type="checkbox">Trade Parties</label><label><input id="approved" type="checkbox">Approved Transactions</label><label><input name="classification" type="radio" value="account" checked>Account Classification</label><label><input name="classification" type="radio" value="balance">Balance Classification</label></div>
<div class="mode"><label><input name="reportClass" type="radio" value="3">Payables Report</label><label><input name="reportClass" type="radio" value="2">Receivables Report</label><div id="balanceClass"><label><input name="balanceClass" type="radio" value="0" checked>All</label><label><input name="balanceClass" type="radio" value="2">Assets</label><label><input name="balanceClass" type="radio" value="3">Liability</label></div></div>
<button id="show">Show</button></section>
<div class="sortbar"><span>Filtered Records</span><label><input class="sort" value="AccountCode" type="checkbox">Account Code</label><label><input class="sort" value="AccountTitle" type="checkbox" checked>Account Title</label><label><input class="sort" value="Closing" type="checkbox">Closing</label><label><input name="direction" value="1" type="radio" checked>Ascending</label><label><input name="direction" value="-1" type="radio">Descending</label><button id="sort">Apply Sorting</button><input id="search" aria-label="Filter records" placeholder="Filter records"></div>
<div class="grid" id="reportGrid"><table><thead></thead><tbody></tbody></table></div>
<section id="followup"><h2>Account FollowUp</h2></section>
<div id="status" role="status"></div><footer><button class="active" data-tab="report">Report</button><button data-tab="followup">Follow Up</button></footer>
<script src="/js/report-decimal.js"></script><script src="/js/trade-grid.js"></script><script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/vendors/select2/dist/js/select2.full.min.js"></script>
<script th:inline="none">
'use strict';
let lookup={},rows=[],requestId=0,aborter;const $id=id=>document.getElementById(id),number=v=>Number(v||0),value=id=>$id(id).value,selected=id=>($('#'+id).val()||[]),flag=id=>$id(id).checked;
const columns=[['lvl03_Title','Parent Account',145],['ClassName','Account Class',75],['AccountCode','Account Code',80],['AccountTitle','Account Title',180],['AccountType','Account Type',65],['Opening','Opening',102],['CurrDebit','Debit',102],['CurrCredit','Credit',102],['Closing','Closing',102],['Increase/Decrease','Increase/Decrease',102],['LastBillDate','Last Bill Date',80],['LastBillsAmount','Last Bill Amount',90],['BillDays','Bill Days',50],['LastRcvdDate','Last Paid Date',80],['LastRcvdAmount','Last Paid Amount',90],['RcvdDays','Paid Days',75],['CityName','City Name',120],['MobilePersonal','Mobile#',110]];
const numeric=new Set(['Opening','CurrDebit','CurrCredit','Closing','Increase/Decrease','LastBillsAmount','LastRcvdAmount']);
function displayDate(raw){const match=String(raw??'').match(/^(\d{4})-(\d{2})-(\d{2})/);return match?match[3]+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(match[2])-1]+'-'+match[1].slice(-2):String(raw??'')}
function message(t){$id('status').textContent=t}
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('Report request failed ('+r.status+'). Check the server log for the database error.');return r.json()}
function bind(id,data,text,key='Id'){const e=$id(id),old=$('#'+id).val();e.replaceChildren();if(!e.multiple)e.add(new Option('',''));data.forEach(r=>e.add(new Option(r[text]??'',r[key])));$('#'+id).val(old).trigger('change.select2')}
function currentClass(){return number(document.querySelector('[name=reportClass]:checked').value)}
function modes(){const cls=currentClass();$id('costField').hidden=cls!==2;const balance=document.querySelector('[name=classification]:checked').value==='balance';$id('heading').textContent=(cls===3?'Payables':'Receivables')+' Report '+(balance?'Balance':'Accounts')+' Classification Wise';['credit','debit'].forEach(id=>{$id(id).disabled=balance;if(balance)$id(id).checked=false});document.querySelectorAll('[name=balanceClass]').forEach(e=>e.disabled=!balance);bind('controls',(lookup.controls||[]).filter(r=>number(r.AccountClass)===cls),'AccountTitle');}
function params(){return new URLSearchParams({fromDate:value('fromDate'),toDate:value('toDate'),accountClass:currentClass(),costCenterId:value('costCenter')||0,balanceClassification:document.querySelector('[name=classification]:checked').value==='balance',balanceClass:document.querySelector('[name=balanceClass]:checked').value,credit:flag('credit'),debit:flag('debit'),tradeOnly:flag('tradeOnly'),approved:flag('approved'),balanceFrom:value('balanceFrom')||0,balanceTo:value('balanceTo')||0,controlAccounts:selected('controls').join(','),inventoryGroups:selected('inventoryGroups').join(','),branches:[selected('branches')].flat().filter(Boolean).join(','),cityId:value('cities')||0,customGroupId:value('customGroups')||0,accountId:value('accounts')||0})}
function render(){TradeGrid.render({table:document.querySelector('#reportGrid table'),columns,rows,numeric,decimals:lookup.amountDecimals||0,term:value('search'),sort:[...document.querySelectorAll('.sort:checked')].map(e=>e.value),direction:number(document.querySelector('[name=direction]:checked').value),accountClass:currentClass(),ledger:r=>'/accounts/reports/general-ledger?'+new URLSearchParams({accountId:r.AccountId,fromDate:value('fromDate'),toDate:value('toDate'),branchId:r.BranchesId||0,subsidiaryAccountId:r.SubsidiaryAccountId||0}),date:displayDate,status:message})}
async function show(){if($id('show').disabled)return;$id('show').disabled=true;$id('show').setAttribute('aria-busy','true');const id=++requestId;if(aborter)aborter.abort();aborter=new AbortController();rows=[];render();message('Loading…');try{const data=await api('/api/accounts/trade-report?'+params(),{signal:aborter.signal});if(id!==requestId)return;rows=data;render()}catch(e){if(e.name!=='AbortError')message(e.message)}finally{if(id===requestId){$id('show').disabled=false;$id('show').removeAttribute('aria-busy')}}}
let accountRequest=0;async function reloadAccounts(){const token=++accountRequest;$id('accounts').disabled=true;try{const data=await api('/api/accounts/trade-report/accounts?costCenter='+encodeURIComponent(value('costCenter')||0));if(token===accountRequest)bind('accounts',data,'AccountTitle')}catch(e){if(token===accountRequest){bind('accounts',[],'AccountTitle');message(e.message)}}finally{if(token===accountRequest)$id('accounts').disabled=false}}$('#costCenter').on('change',reloadAccounts);
$id('show').onclick=show;$id('sort').onclick=render;$id('search').oninput=render;$id('newReport').onclick=()=>{$('#controls').val(null).trigger('change');$id('fromDate').focus()};
document.querySelectorAll('[name=classification],[name=reportClass]').forEach(e=>e.onchange=modes);
document.querySelectorAll('footer button').forEach(e=>e.onclick=()=>{const report=e.dataset.tab==='report';$id('followup').style.display=report?'none':'block';$id('reportGrid').style.display=report?'block':'none';document.querySelectorAll('footer button').forEach(b=>b.classList.toggle('active',b===e))});
['printReport','cityPrint'].forEach(id=>$id(id).onclick=()=>message('The desktop Crystal print template has not yet been verified in Java.'));
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();$id('newReport').click()}if(e.key==='Escape')location.href='/accounts/dashboard';if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();$id('printReport').click()}});
(async()=>{document.querySelector('[name=reportClass][value="'+document.body.dataset.accountClass+'"]').checked=true;$id(document.body.dataset.accountClass==='3'?'credit':'debit').checked=true;$('select').select2({placeholder:'',allowClear:true});modes();try{lookup=await api('/api/accounts/trade-report/lookups');const today=new Date();$id('toDate').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');$id('fromDate').value=String(lookup.year.Start_Period).slice(0,10);bind('costCenter',lookup.costCenters,'CostCenterName');if(Number(lookup.appId)===5&&lookup.costCenters.length){$('#costCenter').val(String(lookup.costCenters[0].Id)).trigger('change.select2');$id('costCenter').disabled=true}bind('cities',lookup.cities,'CityName');bind('customGroups',lookup.customGroups,'AcLookUpsDescription');bind('inventoryGroups',lookup.inventoryGroups,'Description');bind('accounts',lookup.accounts,'AccountTitle');const features=new Set(lookup.features.map(r=>number(r.Id)));$id('branchField').hidden=!features.has(17);if(features.has(18)){$('#branches').select2('destroy');$id('branches').multiple=true;$('#branches').select2()}bind('branches',lookup.branches,'BranchName');$('#branches').val(String(lookup.branchId)).trigger('change');modes();await reloadAccounts();message('Choose filters and click Show')}catch(e){message(e.message)}})();
</script><script src="/js/trade-followup.js"></script></body></html>
