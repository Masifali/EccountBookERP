<!--
  Screens 73 (Account Reports) / 702 (Banking Managment) "Bank Balances Report" -
  desktop Architecture.WinApp.Account_Reports.BankBalances (base.Name "BankBalances", ClientSize 1317x670,
  WindowState Maximized, KeyPreview). 1:1 port of InitializeComponent (2026-10-02, group K):
    panel1 Dock Fill
      panel2  Dock Top 55, Teal
         toolStrip3 (0,0) 27 high, white, Verdana 9.75: &Reset | &Refresh | &593_Print Summary | &593_01_Print Summary |
                    &590_Print Receipt and Payment | &590_01_Print | Bank Manual Balance (no image)
         label1 "Bank Balances " (1,30) Tahoma 12 bold white
         Branches (158,34) Segoe UI 9 bold white + CmbBranches (217,28) 200x26   [only with ERP feature 17]
      panel3  Dock Top 53, white
         label12 Date Type (9,3)      cmbperemeter (7,21) 120x26
         label27 From Date (132,3)    txtFromDate (129,23) 116x23 dd-MMM-yy
         label33 To Date (249,3)      txtToDate (246,23) 114x23 dd-MMM-yy
         label3 Available Balances (362,3)   textBox1 (362,24) 105x20
         label6 OverBrawn Balances (468,3)   textBox2 (468,24) 125x20
            -> textBox1 / textBox2 are designer placeholders: NO line of BankBalances.cs reads or writes them
               (they are not ReadOnly, not bound, and neither proc returns an available / overdrawn column).
               They are reproduced empty and editable, exactly as the desktop shows them.
         chkFilterSummaryOnlyTransactional (597,4) 105x43 "Exclude 0\nDebit/Credit\nFrom Summary" Segoe UI 8.25 bold
         btnshow "Show" (700,24) 55x23 flat rgb(10,110,110) Tahoma 9.75 bold white
         RadGroupbyBankName (759,1) checked | RadGroupbyParty "Group By Account" (759,18) | RadNoGroup "None" (759,33)
         lblLanguage (914,5) + CmbLanguage (915,21) 156x26 - Visible=false until Ctrl+L
      tabControl1 Dock Fill, Tahoma 8.25 bold, tabs on top
         "Summary": panel4 teal 25 (label5 "Summary" Calibri 12 bold, ctrlGrdSummary gear) + grdHistory
         "Payment/Receipts Detail": panel7 Dock Left 757 (panel8 teal "Payment" + gear, grdPayment)
                                    panel6 Dock Fill (panel9 teal "Receipts" + gear, grdReceipt)
  Procs (AccountReportsDesktopService.bankBalances, POST /accounts/api/reports-desktop/bank-balances):
    ReciptandPaymentGrid -> VoucherReports.BankBalances -> Sp_Accounts_BankBalances_Rpt
    SummeryGrd           -> VoucherReports.CashandBankBalancesSummery (AccountTypeId 15, ApprovedFilter All) -> Sp_Accounts_CashBankBalancesSummery_Rpt
    Load / Refresh       -> CommonServices.Vouchers_GetLastRecord(15) -> USP_Vouchers_GetLastRecord
  Prints hand the desktop's own DataTable to the .rpt through the Jasper layer (POST /reports/print/grid):
    593 / 593_01 <- dtSummery (proc rows after Exclude-0), 590 / 590_01 <- dtReciptandPayment (proc rows).
-->

<script>
(function ($) {
    'use strict';
    var CTX = null, LAST_RECORD = null;
    var QS = new URLSearchParams(window.location.search);
    var summary = [];          // grdHistory DataSource (dtcol)
    var summaryRaw = [];       // dtSummery - what 593 / 593_01 print
    var receipts = [], payments = [];
    var detailRaw = [];        // dtReciptandPayment - what 590 / 590_01 print (btnNew does not clear it)
    var branchShown = false;

    /* ------------------------------------------------------------------ helpers */
    function busy(btn, on) {
        var $b = $(btn);
        if (on) { $b.prop('disabled', true).addClass('btn-busy'); }
        else { $b.removeClass('btn-busy').prop('disabled', false); }
    }
    function isBusy(btn) { return $(btn).hasClass('btn-busy'); }
    function fmt(type, v) {
        if (type === 'both') return AccF.both(v);
        if (type === 'single') return AccF.single(v);
        if (type === 'date') return AccF.dmy(v);
        return v == null ? '' : String(v);
    }
    function esc(v) { return AccF.esc(v); }

    /* ------------------------------------------------------------------ Janus-style grid */
    var GRIDS = {};
    function Grid(id, opts) {
        this.id = id; this.$t = $('#' + id); this.opts = opts;
        this.rows = []; this.view = []; this.filters = {}; this.cur = -1; this.curCol = null; this.collapsed = {};
        this.$nav = $('.jg-nav[data-for="' + id + '"]');
        this.$nav.html('<button type="button" data-nav="first" title="First">|&#9664;</button><button type="button" data-nav="prev" title="Previous">&#9664;</button>'
            + '<span class="t">Record 0 of 0</span><button type="button" data-nav="next" title="Next">&#9654;</button><button type="button" data-nav="last" title="Last">&#9654;|</button>');
        var self = this;
        this.$nav.on('click', 'button', function () {
            var a = $(this).data('nav'), n = self.view.length;
            self.setCur(a === 'first' ? 0 : a === 'last' ? n - 1 : a === 'prev' ? self.cur - 1 : self.cur + 1);
        });
        this.$t.on('click', 'tr.row td', function () {
            self.curCol = $(this).data('k') || null;
            self.setCur(+$(this).closest('tr').data('i'));
        });
        this.$t.on('click', 'a.lnk', function (e) {
            e.preventDefault();
            var r = self.view[+$(this).closest('tr').data('i')], k = $(this).closest('td').data('k');
            if (r && self.opts.onLink) self.opts.onLink(k, r);
        });
        this.$t.on('click', 'tr.grp', function () {
            var g = $(this).data('g'); self.collapsed[g] = !self.collapsed[g]; self.render(true);
        });
        this.$t.on('input', 'tr.flt input', function () {
            self.focusKey = $(this).data('k'); self.filters[self.focusKey] = $(this).val(); self.render(true);
        });
        /* grid KeyDown: Ctrl+Space on a link column runs that link (the grid's own key handler) */
        this.$t.on('keydown', function (e) {
            if ($(e.target).is('input')) return;
            if (e.ctrlKey && (e.key === ' ' || e.code === 'Space')) {
                e.preventDefault();
                var r = self.view[self.cur];
                if (r && self.curCol && self.opts.onKey) self.opts.onKey(self.curCol, r);
            } else if (e.key === 'ArrowDown' && !e.ctrlKey) { e.preventDefault(); self.setCur(self.cur + 1); }
            else if (e.key === 'ArrowUp' && !e.ctrlKey) { e.preventDefault(); self.setCur(self.cur - 1); }
        });
    }
    Grid.prototype.columns = function () { return this.opts.columns().filter(function (c) { return c.visible !== false; }); };
    Grid.prototype.load = function (rows) { this.rows = rows || []; this.filters = {}; this.focusKey = null; this.collapsed = {}; this.cur = this.rows.length ? 0 : -1; this.render(false); };
    Grid.prototype.clear = function () { this.rows = []; this.view = []; this.cur = -1; this.$t.empty(); this.nav(); };   // ClearStructure / DataSource = null
    Grid.prototype.render = function (keepFilters) {
        var self = this, cols = this.columns(), group = this.opts.groupBy ? this.opts.groupBy() : null;
        var fl = this.filters;
        var view = this.rows.filter(function (r) {
            return cols.every(function (c) {
                var f = fl[c.key]; if (!f) return true;
                return fmt(c.type, r[c.key]).toLowerCase().indexOf(String(f).toLowerCase()) >= 0;
            });
        });
        if (group) {           // Janus groups sort by the group value, rows keep their order inside a group
            var order = [], by = {};
            view.forEach(function (r) { var g = r[group.key] == null ? '' : String(r[group.key]); if (!by[g]) { by[g] = []; order.push(g); } by[g].push(r); });
            order.sort(function (a, b) { return a.localeCompare(b); });
            view = []; order.forEach(function (g) { view = view.concat(by[g]); });
            cols = cols.filter(function (c) { return !(self.opts.hideGrouped && c.key === group.key); });   // HideColumnsWhenGrouped
        }
        this.view = view;
        var h = '<colgroup>' + cols.map(function (c) { return '<col style="width:' + (c.width || 100) + 'px">'; }).join('') + '</colgroup>';
        h += '<thead><tr>' + cols.map(function (c) { return '<th class="' + (c.sum || c.right ? 'r' : '') + '" title="' + esc(c.caption || c.key) + '">' + esc(c.caption || c.key) + '</th>'; }).join('') + '</tr>';
        h += '<tr class="flt">' + cols.map(function (c) { return '<td><input type="text" data-k="' + esc(c.key) + '" value="' + esc(fl[c.key] || '') + '"></td>'; }).join('') + '</tr></thead><tbody>';
        var totals = {};
        function add(acc, r) { cols.forEach(function (c) { if (c.sum) acc[c.key] = (acc[c.key] || 0) + AccF.num(r[c.key]); }); }
        function rowHtml(r, i) {
            return '<tr class="row' + (i === self.cur ? ' cur' : '') + '" data-i="' + i + '">' + cols.map(function (c) {
                var txt = fmt(c.type, r[c.key]);
                var cell = c.link && txt !== '' ? '<a class="lnk">' + esc(txt) + '</a>' : esc(txt);
                return '<td data-k="' + esc(c.key) + '" class="' + (c.sum || c.right ? 'r' : '') + (self.curCol === c.key && i === self.cur ? ' cc' : '') + '" title="' + esc(txt) + '">' + cell + '</td>';
            }).join('') + '</tr>';
        }
        function totalCells(acc, label) {
            return cols.map(function (c, idx) {
                if (c.sum) return '<td class="r">' + esc(fmt(c.totalType || c.type, acc[c.key] || 0)) + '</td>';
                return '<td>' + (idx === 0 ? esc(label) : '') + '</td>';
            }).join('');
        }
        if (group) {
            var i = 0;
            while (i < view.length) {
                var g = view[i][group.key] == null ? '' : String(view[i][group.key]), gt = {}, start = i, body = '';
                while (i < view.length && String(view[i][group.key] == null ? '' : view[i][group.key]) === g) { add(gt, view[i]); add(totals, view[i]); body += rowHtml(view[i], i); i++; }
                var col = !!this.collapsed[g];
                h += '<tr class="grp" data-g="' + esc(g) + '"><td colspan="' + cols.length + '"><span class="tg">' + (col ? '+' : '&minus;') + '</span>'
                    + esc(group.caption + ': ' + g) + ' (' + (i - start) + ')</td></tr>';
                if (!col) { h += body; if (this.opts.groupTotals) h += '<tr class="gt">' + totalCells(gt, 'Total') + '</tr>'; }
            }
        } else {
            view.forEach(function (r, idx) { add(totals, r); h += rowHtml(r, idx); });
        }
        h += '</tbody>';
        if (cols.some(function (c) { return c.sum; })) h += '<tfoot><tr>' + totalCells(totals, 'Total') + '</tr></tfoot>';   // TotalRow, BottomFixed
        this.$t.html(h).css('width', cols.reduce(function (a, c) { return a + (c.width || 100); }, 0) + 'px');
        if (keepFilters && this.focusKey) { var foc = this.$t.find('tr.flt input').filter(function () { return $(this).data('k') === self.focusKey; }); if (foc.length) { var v = foc.val(); foc.focus().val('').val(v); } }
        if (this.cur >= view.length) this.cur = view.length - 1;
        if (this.cur < 0 && view.length) this.cur = 0;
        this.nav();
        var hdr = this.$t.find('thead tr:first th').outerHeight() || 20;
        this.$t.find('tr.flt td').css('top', hdr + 'px');
    };
    Grid.prototype.setCur = function (i) {
        if (!this.view.length) { this.cur = -1; this.nav(); return; }
        this.cur = Math.max(0, Math.min(this.view.length - 1, i));
        this.$t.find('tr.row').removeClass('cur').find('td').removeClass('cc');
        var $tr = this.$t.find('tr.row[data-i="' + this.cur + '"]').addClass('cur');
        if (this.curCol) $tr.find('td[data-k="' + this.curCol + '"]').addClass('cc');
        if ($tr.length && $tr[0].scrollIntoView) $tr[0].scrollIntoView({ block: 'nearest' });
        this.nav();
    };
    Grid.prototype.nav = function () {
        var n = this.view.length;
        this.$nav.find('.t').text('Record ' + (this.cur >= 0 ? this.cur + 1 : 0) + ' of ' + n);
        this.$nav.find('[data-nav=first],[data-nav=prev]').prop('disabled', this.cur <= 0);
        this.$nav.find('[data-nav=next],[data-nav=last]').prop('disabled', this.cur < 0 || this.cur >= n - 1);
    };

    function from() { return $('#txtFromDate').val(); }
    function to() { return $('#txtToDate').val(); }

    /* grdHistory: GridSetting() - grouped on CustomGroup (hidden), group totals, total row, HeaderLines 3 centred */
    GRIDS.grdHistory = new Grid('grdHistory', {
        groupBy: function () { return { key: 'CustomGroup', caption: 'CustomGroup' }; },
        groupTotals: true, hideGrouped: true,
        columns: function () {
            return [
                { key: 'BranchName', width: 120, visible: branchShown },
                { key: 'AccountCode', width: 80, link: true },
                { key: 'AccountTitle', width: 250 },
                { key: 'Opening', width: 110, type: 'both', sum: true },
                { key: 'Debit', width: 110, type: 'single', sum: true },
                { key: 'Credit', width: 110, type: 'single', sum: true },
                { key: 'Closing', width: 110, type: 'both', sum: true },
                { key: 'PendingPrematureReceipts', width: 110, type: 'both', sum: true },
                { key: 'PendingPrematurePayments', width: 110, type: 'both', sum: true },
                { key: 'BalanceAfterPrematureReceiptsClearance', width: 130, type: 'both', sum: true },
                { key: 'PostDateCheqsReceipts', width: 110, type: 'both', sum: true },
                { key: 'PostDateCheqsPayments', width: 110, type: 'both', sum: true },
                { key: 'BalanceAfterCheqClearance', width: 110, type: 'both', sum: true },
                { key: 'PostDatedCheqAmount', width: 110, type: 'both', sum: true },
                { key: 'BalanceTime', width: 65 },
                { key: 'ManualBalance', width: 90, type: 'both', sum: true },
                { key: 'Source', width: 140 },
                { key: 'ConfirmBy', width: 140 }
            ];
        },
        /* grdHistory_LinkClicked: AccountCode -> GoToGeneralLedgerFromLinkedEvent(AccountId, From, To, 0, BranchesId) */
        onLink: function (k, r) { if (k === 'AccountCode') AccF.openLedger(r.AccountId, from(), to(), 0, r.BranchesId); },
        /* grdHistory_KeyDown: Ctrl+Space on AccountCode, same call */
        onKey: function (k, r) { if (k === 'AccountCode') AccF.openLedger(r.AccountId, from(), to(), 0, r.BranchesId); }
    });

    /* GetSlipsByDocumentTypeId (CommonServices.cs) for the document types a bank voucher row can carry:
       16/24/29/39/40 -> VoucherReport_118(Id); 8/9 -> DayBookSlip(Id) (144); every other accounting type -> 102 slip (default case). */
    var INV_SLIP_TYPES = [56, 166, 172, 1502, 46, 137, 68, 86, 124, 170, 145, 205, 210, 806, 451, 701, 1503, 1509, 1510, 95, 171, 99, 139,
        98, 57, 138, 61, 131, 64, 58, 59, 452, 66, 70, 80, 112, 181, 111, 110, 101, 810, 702, 204, 162, 1056, 1603, 1604, 1654, 1608, 1609,
        1660, 1661, 1662, 1611, 1859, 1865, 1856, 1861, 1862, 1850, 1104, 155, 1304];
    function slip(r) {
        var t = parseInt(r.DocumentTypeId, 10) || 0, id = parseInt(r.Id, 10) || 0;
        if (!window.printRpt) { alert('Print layer not loaded.'); return; }
        if ([16, 24, 29, 39, 40].indexOf(t) >= 0) {
            if (!id) { alert('VoucherId Not Found'); return; }
            window.printRpt('118-AcRptVoucherSlip.rpt', { id: id });
        } else if (t === 8 || t === 9) {
            window.printRpt('144-DayBookSlip.rpt', { id: id });
        } else if (INV_SLIP_TYPES.indexOf(t) >= 0) {
            alert('The slip of document type ' + t + ' is not available from this report on the web.');
        } else {
            if (!id) { alert('VoucherId Not Found'); return; }
            window.printRpt('102-ANewAcRptPaymentReceiptsVoucherSlip.rpt', { id: id });
        }
    }
    function detailGrid(id, accountCol, keyCol) {
        return new Grid(id, {
            /* BindAndSetupGrid / GroupBySettingOfReceiptPaymentGrid: BankName or the account column, group totals; None = no group */
            groupBy: function () {
                var g = $('input[name="rdGrp"]:checked').val();
                return g === 'bank' ? { key: 'BankName', caption: 'BankName' } : (g === 'account' ? { key: accountCol, caption: accountCol } : null);
            },
            groupTotals: true, hideGrouped: true,
            columns: function () {
                return [
                    { key: 'BranchName', width: 120, visible: branchShown },
                    { key: 'V.Date', width: 90, type: 'date' },
                    { key: 'V.Type', width: 68, link: true },
                    { key: 'V.No', width: 40, link: true },
                    { key: 'BankName', width: 180 },
                    { key: accountCol, width: 180, link: true },
                    { key: 'Amount', width: 100, type: 'both', sum: true },
                    { key: 'ChequeNo', width: 80 }
                ];
            },
            onLink: function (k, r) { linkAction(k, r, accountCol); },
            /* grdReceipt_KeyDown tests "RecivedFrom" (typo), so Ctrl+Space on ReceivedFrom does nothing there */
            onKey: function (k, r) { if (k === 'V.No' || k === 'V.Type' || k === keyCol) linkAction(k, r, keyCol); }
        });
    }
    function linkAction(k, r, accountCol) {
        if (k === 'V.No') AccF.editLinked(r.DocumentTypeId, r.Id, r.DocumentTypeSrNo, 0);          // EditMethodFromLinked
        else if (k === 'V.Type') slip(r);                                                            // GetSlipsByDocumentTypeId
        else if (k === accountCol) AccF.openLedger(r.AgainstAccountId, from(), to(), r.SubsidiaryAccountId, r.BranchesId);
    }
    GRIDS.grdPayment = detailGrid('grdPayment', 'PaidTo', 'PaidTo');
    GRIDS.grdReceipt = detailGrid('grdReceipt', 'ReceivedFrom', 'RecivedFrom');

    function mapDetail(list, accountCol) {
        return (list || []).map(function (r) { var o = $.extend({}, r); o[accountCol] = r.Account; delete o.Account; return o; });
    }

    /* ------------------------------------------------------------------ requests */
    function branchIds() { return AccF.selectedIds('#CmbBranches'); }
    function request(withDetail) {
        return {
            fromDate: from(), toDate: to(), withDetail: withDetail,
            branchesIds: CTX && CTX.branchFeature ? (branchIds() || null) : null,
            languageId: $('#CmbLanguage').val() || null,
            excludeZero: $('#chkFilterSummaryOnlyTransactional').is(':checked')
        };
    }
    /* BranchName visible = BranchFeature && CmbBranches.Text != "" */
    function setBranchShown() { branchShown = !!(CTX && CTX.branchFeature && branchIds()); }
    /* SummeryGrd(): rows -> grid; no rows -> ClearStructure; Exclude-0 leaving nothing -> CopyToDataTable throws,
       the catch shows the message and the grid keeps what it had (dtSummery is already empty). */
    function applySummary(res) {
        summaryRaw = res.summaryRaw || [];
        if (res.excludedAll) { alert('The source contains no DataRows.'); return; }
        summary = res.summary || [];
        if (summary.length) GRIDS.grdHistory.load(summary); else GRIDS.grdHistory.clear();
    }
    /* ReciptandPaymentGrid(): no rows -> ClearStructure on both grids */
    function applyDetail(res) {
        detailRaw = res.detailRaw || [];
        receipts = mapDetail(res.receipts, 'ReceivedFrom');
        payments = mapDetail(res.payments, 'PaidTo');
        if (detailRaw.length) { GRIDS.grdReceipt.load(receipts); GRIDS.grdPayment.load(payments); }
        else { GRIDS.grdReceipt.clear(); GRIDS.grdPayment.clear(); }
    }
    /* btnshow_Click: ReciptandPaymentGrid + SummeryGrd */
    function show(btn) {
        btn = btn || '#btnshow';
        if (isBusy(btn)) return $.Deferred().resolve().promise();
        busy(btn, true);
        setBranchShown();
        return AccF.post('/bank-balances', request(true))
            .then(function (res) { applyDetail(res); applySummary(res); })
            .catch(function (e) { alert(e.message); })
            .then(function () { busy(btn, false); });
    }
    function summaryOnly() {
        setBranchShown();
        return AccF.post('/bank-balances', request(false)).then(applySummary).catch(function (e) { alert(e.message); });
    }
    /* btnNew_Click: From = ActiveYr.Start_Period, To = Now, focus From, Payment/Receipt DataSource = null, SummeryGrd */
    function reset() {
        var b = '#btnNew'; if (isBusy(b)) return;
        busy(b, true);
        $('#txtFromDate').val(CTX && CTX.activeYear && CTX.activeYear.startPeriod ? CTX.activeYear.startPeriod : AccF.today());
        $('#txtToDate').val(AccF.today());
        $('#txtFromDate').focus();
        GRIDS.grdPayment.clear(); GRIDS.grdReceipt.clear(); receipts = []; payments = [];
        summaryOnly().then(function () { busy(b, false); });
    }
    /* BtnRefresh_Click: only Vouchers_GetLastRecord(15) -> LastRecordDate */
    function refresh() {
        var b = '#BtnRefresh'; if (isBusy(b)) return;
        busy(b, true);
        AccF.lookup('last-record-date', { accountTypeId: 15 }).then(function (d) { if (d) LAST_RECORD = d; })
            .catch(function (e) { alert(e.message); }).then(function () { busy(b, false); });
    }
    /* cmbperemeter_ValueChanged */
    function onParameter() {
        var id = parseInt($('#cmbperemeter').val(), 10);
        if (id === 1) $('#txtFromDate').val(AccF.today());
        else if (id === 2) $('#txtFromDate').val(AccF.addDays(-7));
        else if (id === 3) $('#txtFromDate').val(AccF.monthStart());
        else if (id === 4) $('#txtFromDate').val(AccF.yearStart());
        else if (id === 5) $('#txtFromDate').val(CTX && CTX.activeYear ? CTX.activeYear.startPeriod || '' : '');
        else if (id === 6) $('#txtFromDate').val(LAST_RECORD || '');
        if (id >= 1 && id <= 6) $('#txtToDate').val(AccF.today());
    }

    /* ------------------------------------------------------------------ prints (ShowReportWithDataTable -> Jasper) */
    function printRows(btn, rpt, rows) {
        if (isBusy(btn)) return;
        var win = window.open('about:blank', '_blank');
        busy(btn, true);
        fetch('/reports/print/grid', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rpt: rpt, title: null, rows: rows }) })
            .then(function (r) {
                var type = r.headers.get('Content-Type') || '';
                if (r.ok && type.indexOf('application/pdf') === 0) return r.blob().then(function (b) { win.location = URL.createObjectURL(b); });
                return r.text().then(function (t) { try { win.close(); } catch (x) { } alert(t || ('Print failed (' + r.status + ')')); });
            })
            .catch(function (e) { try { win.close(); } catch (x) { } alert(e.message); })
            .then(function () { busy(btn, false); });
    }
    /* btnPrintSummery_Click / BtnPrintII_Click: only when dtSummery has rows (otherwise nothing happens) */
    function printSummary(btn, rpt) { if (summaryRaw.length > 0) printRows(btn, rpt, summaryRaw); }
    /* btnPrintReceiptandPayment_Click / BtnPrint590II_Click */
    function printDetail(btn, rpt) {
        if (!detailRaw.length) { alert('Not Record Found For Display'); return; }
        printRows(btn, rpt, detailRaw);
    }

    /* MakeShortCutKeys (the desktop's own list, text unchanged) */
    var SHORTCUTS = [['Ctrl+S', 'For Shoe Record'], ['Ctrl+E', 'For Close'], ['Ctrl+R', 'For Refresh'], ['Ctrl+N', 'For New'],
        ['Alt+1', 'For Print 334-Register'], ['Alt+2', 'For Print 335-Register'], ['Ctrl+F5', 'For Focus on Combo Date'],
        ['Ctrl+alt', 'To Show ShortCut Keys Form'], ['Ctrl+ArrowDown', 'For Focus On Grid History'],
        ['Ctrl+ArrowUp', 'For Focus On Date combo in Filters Box'], ['Ctrl+Space', "When Focus On Any Grid To Call Function's On Button Or Link"]];
    function shortcuts() {
        $('#scBody').html(SHORTCUTS.map(function (s) { return '<tr><td>' + esc(s[0]) + '</td><td>' + esc(s[1]) + '</td></tr>'; }).join(''));
        $('#scModal').css('display', 'flex');
    }

    function tab(id) {
        $('#tabStrip a').removeClass('on').filter('[data-tab="' + id + '"]').addClass('on');
        $('.tabPage').removeClass('on'); $('#' + id).addClass('on');
    }
    function comboOpen() { return $('.dtcombo-pop').filter(function () { return this.style.display === 'block'; }).length > 0; }

    /* ------------------------------------------------------------------ wiring */
    $('#tabStrip').on('click', 'a', function () { tab($(this).data('tab')); });
    $('#btnshow').on('click', function () { show(this); });
    $('#btnNew').on('click', reset);
    $('#BtnRefresh').on('click', refresh);
    $('#btnPrintSummery').on('click', function () { printSummary(this, '593-CashBankBalancesSummery_Rpt.rpt'); });
    $('#BtnPrintII').on('click', function () { printSummary(this, '593_01_CashBankBalancesSummeryReport.rpt'); });
    $('#btnPrintReceiptandPayment').on('click', function () { printDetail(this, '590-BankBalances.rpt'); });
    $('#BtnPrint590II').on('click', function () { printDetail(this, '590_01_BankBalancesWithSummary.rpt'); });
    /* btnBankManualBalance_Click: new BankBalanceManualEntry(UserAccount).Show() */
    $('#btnBankManualBalance').on('click', function () { window.open('/accounts/bank-balance-manual-entry', '_blank'); });
    /* RadGroupbyBankName / RadGroupbyParty / RadNoGroup CheckedChanged -> GroupBySettingOfReceiptPaymentGrid (only grids with rows) */
    $('input[name="rdGrp"]').on('change', function () {
        if (GRIDS.grdReceipt.rows.length) GRIDS.grdReceipt.render(true);
        if (GRIDS.grdPayment.rows.length) GRIDS.grdPayment.render(true);
    });
    $('#scClose').on('click', function (e) { e.preventDefault(); $('#scModal').hide(); });

    /* BankBalances_KeyDown (KeyPreview) */
    $(document).on('keydown', function (e) {
        var k = e.key, K = (k || '').toUpperCase();
        if ($('#scModal').is(':visible')) { if (k === 'Escape') { e.preventDefault(); $('#scModal').hide(); } return; }
        if (k === 'Enter' && !e.ctrlKey && !e.altKey && !e.shiftKey && !comboOpen() && !$(e.target).is('button, a, tr.flt input')) {
            /* SendKeys.Send("{TAB}") */
            var f = $('#panel1').find('input:visible:not([readonly]), .dtcombo-input:visible, button:visible:enabled').toArray();
            var i = f.indexOf(e.target); if (i >= 0 && i < f.length - 1) { e.preventDefault(); f[i + 1].focus(); }
        }
        if ((e.ctrlKey && !e.altKey && K === 'E') || (k === 'Escape' && !comboOpen())) { e.preventDefault(); window.location.href = '/accounts/dashboard'; return; }
        if (e.ctrlKey && !e.altKey && K === 'S') { e.preventDefault(); show('#btnshow'); }
        if (e.ctrlKey && k === 'F5') { e.preventDefault(); AccF.focus('#cmbperemeter'); }
        if (e.ctrlKey && !e.altKey && K === 'N') { e.preventDefault(); reset(); }
        if (e.altKey && !e.ctrlKey && e.code === 'Digit1') { e.preventDefault(); $('#btnPrintSummery').click(); }
        if (e.altKey && !e.ctrlKey && e.code === 'Numpad1') { e.preventDefault(); $('#btnPrintReceiptandPayment').click(); }
        if (e.ctrlKey && !e.altKey && K === 'R') { e.preventDefault(); refresh(); }
        if (e.ctrlKey && k === 'ArrowDown') { e.preventDefault(); tab('tabPage1'); $('#grdHistory').focus(); }
        if (e.ctrlKey && k === 'ArrowUp') { e.preventDefault(); AccF.focus('#cmbperemeter'); }
        if (e.ctrlKey && !e.altKey && K === 'L') { e.preventDefault(); $('#lblLanguage').show(); $('#CmbLanguageBox').show(); }
        if (e.ctrlKey && e.altKey && (k === 'Control' || k === 'Alt')) { e.preventDefault(); shortcuts(); }
    });

    /* ------------------------------------------------------------------ BankBalances_Load */
    $(function () {
        (async function () {
            try {
                CTX = await AccF.context();
                if (CTX.branchFeature) {
                    /* BranchesFill: GetBranchesFromVouchersByAccountId; feature 18 -> checked combo, Text = UserAccount.BranchName */
                    if (CTX.branchConsolidated) { $('#CmbBranches').attr({ multiple: 'multiple', 'data-dtcombo-checked': '' }); }
                    var brs = await AccF.lookup('branches');
                    AccF.fillSelect('#CmbBranches', brs, 'Id', 'BranchName', CTX.branchConsolidated ? null : '');
                    var pre = QS.get('branchesIds');
                    if (pre) $('#CmbBranches').val(CTX.branchConsolidated ? pre.split(',') : pre.split(',')[0]);
                    else if (CTX.userBranchId) $('#CmbBranches').val(CTX.branchConsolidated ? [String(CTX.userBranchId)] : String(CTX.userBranchId));
                    $('#Branches').show(); AccF.ctl('#CmbBranches').show(); $('#CmbBranches').trigger('change');
                } else {
                    AccF.ctl('#CmbBranches').hide();
                }
                /* MultiLanguages */
                AccF.fillSelect('#CmbLanguage', await AccF.lookup('languages'), 'Id', 'LanguageDescription', '');
                /* the DateTimePickers start at Now; a drill-in hands FromDate / ToDate and fills Payment/Receipts first */
                $('#txtFromDate, #txtToDate').val(AccF.today());
                if (QS.get('fromDate') && QS.get('toDate')) {
                    $('#txtFromDate').val(QS.get('fromDate')); $('#txtToDate').val(QS.get('toDate'));
                    await show('#btnshow');
                } else {
                    await summaryOnly();
                }
                /* Vouchers_GetLastRecord(15), then ParameterFill: Rows[5] "Last Record Date" -> From = LastRecordDate, To = today */
                LAST_RECORD = await AccF.lookup('last-record-date', { accountTypeId: 15 });
                AccF.fillSelect('#cmbperemeter', [{ Id: 1, P: 'This Day' }, { Id: 2, P: 'This Week' }, { Id: 3, P: 'This Month' },
                    { Id: 4, P: 'This Year' }, { Id: 5, P: 'Financial Year' }, { Id: 6, P: 'Last Record Date' }], 'Id', 'P', null);
                $('#cmbperemeter').val('6');
                onParameter();
                $('#cmbperemeter').on('change', onParameter);
            } catch (e) { alert(e.message); }
        })();
    });
})(window.jQuery);
