<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payables Report</title>
<link rel="stylesheet" href="/build/css/countx_desktop_combo.css?v=20261007r1">

<!--
  Screen 48 "Payables Report" = Architecture.WinApp.Account_Reports.Payables ("Accounts Payables Balance Classification Wise"),
  route /accounts/reports/payables-balance-classification. Group R1 2026-10-07, built 1:1 on InitializeComponent():
    ClientSize 1299x693, KeyPreview, Maximized.
    panel1 Fill = panel2 (Top 27: toolStrip3 - btnNew "&Refresh" | print "121-Print", Verdana 9.75)
                | panel3 (Top 28 Teal: label23 5,4 Tahoma 12 bold white + ctrlGrdBar at the right)
                | panel4 Fill = panel5 (Top 90 White, the controls below) + panel6 Fill (grd).
  panel5 children (designer Location / Size / TabIndex):
    label27 "From && To Date" 7,10 | datFromDate 112,7 115x23 (0) | datToDate 228,7 115x23 (1) dd-MMM-yy
    label9 "City Name" 7,38 | CmbCityName 112,32 231x26 (2) | label8 "Control Account" 7,65 | cmbAccount 112,59 231x26 (3, checked)
    label10 "Custom Group" 348,11 | CmbCustomGroup 445,5 224x26 (4) | label6 "Inventory Group" 348,38 | cmbCustomerGroup 445,32 224x26 (5, checked)
    Branches 348,65 | CmbBranches 445,59 224x26 (6; only with ERP feature 17, checked with feature 18)
    SkipZero 672,9 (7) | ChkTradeParties "Trade/Parties" 672,28 61x34 (8) | groupBox1 672,58 191x29 { rdAll 6,8 | RdAssests 57,8 | RdLiability 121,8 }
    RdFourColumns 746,9 (9, checked) | RdSixColumns 746,36 (10) | label4 "Closing From" 843,11 | txtBalanceFrom 924,7 114x23 (12)
    label5 "Closing To" 843,38 | txtBalanceTo 924,34 114x23 (13) | btnshow "Show" 924,60 52x24 (14, Teal flat Tahoma 9.75 bold white)
  Lists: GET /api/accounts/acrpt1/payables/lookups. Report: GET /api/accounts/acrpt1/payables (Sp_Accounts_Payables_Rpt).
  Print 121: /accounts/reports/acrpt1/print/payables. Page logic: /build/js/countx_acrpt1_48.js (+ countx_acrpt1_core.js).
-->
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="frm-scroll">
<div class="frm" id="frmPayables" style="min-width:1050px;">

    <!-- panel2 / toolStrip3 -->
    <div class="p2"><div class="ts">
        <button type="button" id="reset" title="Ctrl+N"><svg viewBox="0 0 16 16"><path d="M2 14l1-4 8-8 3 3-8 8z" fill="#e0a526" stroke="#7a5a10"/><path d="M10 3l3 3" stroke="#7a5a10"/></svg><span><u>R</u>efresh</span></button>
        <button type="button" id="print" title="Ctrl+P"><svg viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="4" fill="#fff" stroke="#555"/><rect x="1.5" y="5.5" width="13" height="6" rx="1" fill="#6b7785"/><rect x="4" y="9.5" width="8" height="5" fill="#fff" stroke="#555"/></svg><span>121-Print</span></button>
    </div></div>

    <!-- panel3 (Top 28, Teal) -->
    <div class="teal" style="height:28px;"><span class="cap" style="left:5px;top:4px;">Accounts Payables Balance Classification Wise</span><span class="gbmount" id="gbMount"></span></div>

    <div class="p4">
    <!-- panel5 (Top 90, White) -->
    <div class="pf" style="height:90px;min-width:1050px;">
        <span class="lbl l975" style="left:7px;top:10px;">From &amp; To Date</span>
        <input type="date" id="datFromDate" class="tb" style="left:112px;top:7px;width:115px;height:23px;">
        <input type="date" id="datToDate" class="tb" style="left:228px;top:7px;width:115px;height:23px;">

        <span class="lbl" style="left:7px;top:38px;">City Name</span>
        <select id="cmbCityName" data-dtcombo="single" data-dtcombo-caption="City Name" style="position:absolute;left:112px;top:32px;width:231px;height:26px;"></select>
        <span class="lbl" style="left:7px;top:65px;">Control Account</span>
        <select id="cmbAccount" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Account Title" style="position:absolute;left:112px;top:59px;width:231px;height:26px;"></select>

        <span class="lbl" style="left:348px;top:11px;">Custom Group</span>
        <select id="cmbCustomGroup" data-dtcombo="single" data-dtcombo-caption="Custom Group" style="position:absolute;left:445px;top:5px;width:224px;height:26px;"></select>
        <span class="lbl" style="left:348px;top:38px;">Inventory Group</span>
        <select id="cmbCustomerGroup" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Customer Group" style="position:absolute;left:445px;top:32px;width:224px;height:26px;"></select>
        <span class="lbl" id="lblBranches" style="left:348px;top:65px;" hidden>Branches</span>
        <select id="cmbBranchesChecked" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Branch Name" style="position:absolute;left:445px;top:59px;width:224px;height:26px;"></select>
        <select id="cmbBranches" data-dtcombo="single" data-dtcombo-caption="Branch Name" style="position:absolute;left:445px;top:59px;width:224px;height:26px;"></select>

        <label class="cbx" style="left:672px;top:9px;width:73px;height:19px;"><input type="checkbox" id="skipZero">SkipZero</label>
        <label class="cbx two" style="left:672px;top:28px;width:61px;height:34px;"><input type="checkbox" id="chkTradeParties"><span>Trade<br>Parties</span></label>
        <div class="gb" style="left:672px;top:58px;width:191px;height:29px;">
            <div class="gb-frame"></div>
            <label class="cbx" style="left:6px;top:8px;"><input type="radio" name="al" id="rdAll" checked>ALL</label>
            <label class="cbx" style="left:57px;top:8px;"><input type="radio" name="al" id="rdAssets">Assets</label>
            <label class="cbx" style="left:121px;top:8px;"><input type="radio" name="al" id="rdLiability">Liability</label>
        </div>
        <label class="cbx" style="left:746px;top:9px;"><input type="radio" name="cols" id="rdFour" checked>Four Columns</label>
        <label class="cbx" style="left:746px;top:36px;"><input type="radio" name="cols" id="rdSix">Six Columns</label>

        <span class="lbl" style="left:843px;top:11px;">Closing From</span>
        <input id="txtBalanceFrom" class="tb" autocomplete="off" style="left:924px;top:7px;width:114px;height:23px;">
        <span class="lbl" style="left:843px;top:38px;">Closing To</span>
        <input id="txtBalanceTo" class="tb" autocomplete="off" style="left:924px;top:34px;width:114px;height:23px;">
        <button type="button" id="show" class="teal-btn" style="left:924px;top:60px;width:52px;height:24px;" title="Show">Show</button>
    </div>

    <!-- panel6 Fill: grd -->
    <div class="gridbox">
        <div class="grid" id="grid" tabindex="0"><table data-gridbar="Payables:grd" data-gridbar-mount="#gbMount" data-gridbar-title="Accounts Payables Balance Classification Wise" class="g" id="results"><colgroup></colgroup><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="nav" id="nav" hidden>
            <button type="button" data-nav="first" title="First">|&lt;</button><button type="button" data-nav="prev" title="Previous">&lt;</button>
            <span id="navText"></span>
            <button type="button" data-nav="next" title="Next">&gt;</button><button type="button" data-nav="last" title="Last">&gt;|</button>
        </div>
    </div>
    </div>
</div>
</div>

<dialog class="sck" id="shortcutDialog">
    <div class="hd">ShortCut Keys</div>
    <table><thead><tr><th>KeyCombination</th><th>Description</th></tr></thead><tbody id="shortcutRows"></tbody></table>
    <div class="ft"><button type="button" id="closeShortcuts">Close</button></div>
</dialog>

<script src="/build/js/countx_prod_combo.js?v=20261007r1"></script>
<script src="/build/js/countx_acrpt1_core.js?v=20261007r1"></script>
<script src="/build/js/countx_acrpt1_48.js?v=20261007r1"></script>

</html>
