<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supplier Customer Limits</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_grid_js.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
</head>
<!--
  Account Reports tile "Party Limits & Balances". The desktop has no report of that name; its "Party Limits" screen is
  738 frmInvSupCustLimits = Architecture.WinApp.SupfrmSupplierLimits (lblCaption "Supplier / Customer Limits").
  The page this replaces was a static mock-up (Party Type / Limit Status filters, one fabricated customer row, no data call).
  Form (SupfrmSupplierLimits.cs): toolStrip New / Update (hidden until a History row is double-clicked) / Save / Refresh;
  panel3: Supplier/Customer (cmbsup) - Credit (txtcredit) - Debit (txtdebit) - Effected Date (txteffecteddate, dd-MMM-yy);
  "History" grid: Id hidden, CompanyName, CreditLimits, DebitLimits (summed, stringFormatsingle), EffectedDate.
  Keys: Ctrl+N New, Ctrl+S Save (always a new row - updateMood is never set on the desktop), Ctrl+E / Esc Close.
  PartyLimitsController + PartyLimitsRepository (R4, 2026-09-30).
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-sliders"></i> Party Limits</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="btnNew"><i class="fa fa-file-o"></i> New</button>
    <button type="button" class="win-btn" id="btnUpdate" hidden><i class="fa fa-pencil"></i> Update</button>
    <button type="button" class="win-btn" id="btnSave"><i class="fa fa-save"></i> Save</button>
    <button type="button" class="win-btn" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
    <a class="win-btn" href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a>
</div>
<div class="win-header-panel"><span>Supplier / Customer Limits</span></div>

<div class="filters">
    <div class="gb" style="width:1080px">
        <span class="gb-title">Limits</span>
        <div class="fgrid" style="grid-template-columns: 107px 220px 38px 163px 36px 164px 78px 161px;">
            <span class="lbl">Supplier/Customer</span>
            <select id="cmbsup" class="inp" data-dtcombo="single" data-dtcombo-caption="Supplier/Customer"></select>
            <span class="lbl">Credit</span><input type="text" id="txtcredit" class="inp" style="text-align:right" inputmode="decimal">
            <span class="lbl">Debit</span><input type="text" id="txtdebit" class="inp" style="text-align:right" inputmode="decimal">
            <span class="lbl">Effected Date</span><input type="date" id="txteffecteddate" class="inp">
        </div>
    </div>
</div>

<div class="grid-caption"><span>History</span><span id="count"></span></div>
<div class="grid-wrap"><table id="grid" class="wg"></table></div>
<div id="status" class="status-bar" role="status"></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20260930s}"></script>
<script>
(function () {
    'use strict';
    var el = function (id) { return document.getElementById(id); };
    var API = '/api/accounts/party-limits';
    var recId = 0, decimals = 2, rows = [], busy = false;

    function status(text, err) { var s = el('status'); s.textContent = text || ''; s.classList.toggle('msg-err', !!err); }
    function today() { return AccF.today(); }
    function json(url, opts) {
        return fetch(url, Object.assign({ headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' } }, opts || {}))
            .then(function (r) {
                return r.text().then(function (t) {
                    var body = null; try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
                    if (!r.ok) throw new Error((body && body.message) || ('Request failed (' + r.status + ')'));
                    return body;
                });
            });
    }
    /* clsGlobalVariables.stringFormatsingle "#,##0.dd" */
    function single(v) {
        var n = parseFloat(v); if (isNaN(n)) n = 0;
        return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function renderGrid() {
        var totals = { CreditLimits: 0, DebitLimits: 0 };
        var cols = [
            { key: 'CompanyName', caption: 'CompanyName', width: 300 },
            { key: 'CreditLimits', caption: 'CreditLimits', width: 130, align: 'r', sum: true, render: function (r) { return single(r.CreditLimits); } },
            { key: 'DebitLimits', caption: 'DebitLimits', width: 130, align: 'r', sum: true, render: function (r) { return single(r.DebitLimits); } },
            { key: 'EffectedDate', caption: 'EffectedDate', width: 110, type: 'date' }
        ];
        AccF.renderGrid({ table: '#grid', columns: cols, rows: rows, emptyText: '' });
        rows.forEach(function (r) { totals.CreditLimits += parseFloat(r.CreditLimits) || 0; totals.DebitLimits += parseFloat(r.DebitLimits) || 0; });
        var $f = $('#grid tfoot td');
        if ($f.length) { $f.eq(1).text(single(totals.CreditLimits)); $f.eq(2).text(single(totals.DebitLimits)); }
        $('#grid tbody tr').each(function (i) {
            var r = rows[i]; if (!r) return;
            $(this).css('cursor', 'pointer').on('dblclick', function () { edit(r.Id); });
        });
        el('count').textContent = rows.length ? rows.length + ' records' : '';
    }
    /* datagridviewform(): the desktop only rebinds when the proc returns rows. */
    function loadHistory() {
        return json(API).then(function (list) { if (list && list.length) { rows = list; renderGrid(); } });
    }
    /* cmbsupplierfill(): BindDDL(dt, cmbsup, "Id", "CompanyName", ...), ZeroIndex false. */
    function fillParties() {
        return json(API + '/lookups').then(function (d) {
            decimals = (d && typeof d.amountDecimals === 'number') ? d.amountDecimals : 0;
            var s = el('cmbsup'), old = s.value;
            s.innerHTML = '';
            s.add(new Option('', ''));
            (d.parties || []).forEach(function (p) { s.add(new Option(p.CompanyName == null ? '' : p.CompanyName, p.Id)); });
            $(s).val(old);
        });
    }
    function reset() {
        recId = 0;
        $('#cmbsup').val('');
        el('txtdebit').value = ''; el('txtcredit').value = '';
        el('txteffecteddate').value = today();
        el('btnUpdate').hidden = true; el('btnSave').hidden = false;
    }
    function focusParty() { var i = $('#cmbsup').closest('.dtcombo-wrap').find('.dtcombo-input'); (i.length ? i : $('#cmbsup')).focus(); }
    function edit(id) {
        json(API + '/' + encodeURIComponent(id)).then(function (b) {
            el('btnSave').hidden = true; el('btnUpdate').hidden = false;
            recId = Number(b.Id);
            $('#cmbsup').val(String(b.SuplierCustomerId));
            el('txtcredit').value = b.CreditLimit == null ? '' : String(b.CreditLimit);
            el('txtdebit').value = b.DebitLimit == null ? '' : String(b.DebitLimit);
            el('txteffecteddate').value = b.EffectedDate || '';
            return loadHistory();
        }).catch(function (e) { status(e.message, true); alert(e.message); });
    }
    /* Insert(): formvalidation() (server repeats it), Save, message box, datagridviewform(), Reset(). */
    function insert() {
        if (busy) return;
        var v = { id: recId, partyId: Number(el('cmbsup').value || 0), debit: el('txtdebit').value.trim(), credit: el('txtcredit').value.trim(), effectedDate: el('txteffecteddate').value };
        if (!v.partyId) { alert('Please Select Supplier'); focusParty(); return; }
        if (!(parseFloat(v.debit) || 0)) { alert('Please Select Debit Credit'); el('txtdebit').focus(); return; }
        if (!(parseFloat(v.credit) || 0)) { alert('Please Select  Credit'); el('txtcredit').focus(); return; }
        if (!v.effectedDate) { alert('Please Select Effected Date'); el('txteffecteddate').focus(); return; }
        busy = true;
        json(API, { method: 'POST', body: JSON.stringify(v) }).then(function (r) {
            alert(r.message); status(r.message);
            return loadHistory().then(reset);
        }).catch(function (e) { status(e.message, true); alert(e.message); })
          .then(function () { busy = false; });
    }
    /* CommonServices.OnlytextNumberFunction: digits, one decimal point, control keys. */
    ['txtcredit', 'txtdebit'].forEach(function (id) {
        el(id).addEventListener('keypress', function (e) {
            if (e.ctrlKey || e.key.length > 1) return;
            if (/[0-9]/.test(e.key)) return;
            if (e.key === '.' && this.value.indexOf('.') < 0) return;
            e.preventDefault();
        });
    });
    el('btnSave').onclick = function () { recId = 0; insert(); };
    el('btnUpdate').onclick = function () { insert(); };
    el('btnNew').onclick = function () { reset(); };
    el('btnRefresh').onclick = function () { fillParties().catch(function (e) { status(e.message, true); }); };
    /* cmbsup_Leave -> datagridviewform() */
    $(document).on('focusout', '.dtcombo-wrap', function (e) {
        var w = $('#cmbsup').closest('.dtcombo-wrap')[0];
        if (w && this === w && !w.contains(e.relatedTarget)) loadHistory().catch(function (x) { status(x.message, true); });
    });
    document.addEventListener('keydown', function (e) {
        var k = (e.key || '').toLowerCase();
        if (e.ctrlKey && k === 'n') { e.preventDefault(); el('btnNew').click(); }
        else if (e.ctrlKey && k === 's') { e.preventDefault(); recId = 0; insert(); }
        else if ((e.ctrlKey && k === 'e') || e.key === 'Escape') { if (!document.querySelector('.dtcombo-pop[style*="block"]')) location.href = '/accounts/dashboard'; }
    });
    /* SupfrmSupplierLimits_Load: Save visible, Update hidden, datagridviewform(), cmbsupplierfill(), focus the combo.
       txteffecteddate keeps its designer value (DateTime.Now). */
    $(function () {
        el('txteffecteddate').value = today();
        renderGrid();
        loadHistory().catch(function (e) { status(e.message, true); })
            .then(function () { return fillParties(); })
            .then(function () { renderGrid(); focusParty(); })
            .catch(function (e) { status(e.message, true); });
    });
})();
</script>
</body>
</html>
