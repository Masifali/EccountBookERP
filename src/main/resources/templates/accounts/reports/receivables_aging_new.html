<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Aging Document Wise</title><link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/document-aging.css"><style>fieldset{width:846px;height:71px}#account{width:204px}</style><link rel="stylesheet" href="/css/report-loading.css"><script src="/js/report-loading.js"></script></head>
