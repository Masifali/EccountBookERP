<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Profit &amp; Loss</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_h.css?v=20260930a}">
    <style>
        /* frmProfitLossHararical.cs (screen 64 "Profit & Loss 01") - ClientSize 1152 x 707,
           AutoScrollMinSize 980 x 700. panel2 (toolStrip3 + ctrlGrdBar1) / panel3 (Left 443: panel5 63
           filters + grdHistory) / panel4 (Fill, White: the statement group boxes). */
        .pl { min-width: 1152px; }
        #body { display: flex; height: 681px; }
        #panel3 { flex: 0 0 443px; display: flex; flex-direction: column; border-right: 1px solid #c9d1da; }
        #panel5 { flex: 0 0 63px; }
        #panel4 { flex: 0 0 709px; position: relative; background: #fff; }
        .gb { position: absolute; border: 1px solid #c3c9d0; border-radius: 3px; }
        .gb > .lg { position: absolute; top: -9px; left: 6px; background: #fff; padding: 0 3px; font: bold 9.75pt Tahoma, sans-serif; color: #0000cd; }
        .c { position: absolute; background: #008080; color: #fff; font: bold 12pt Calibri, sans-serif; padding: 0 3px; cursor: pointer; line-height: 19px; height: 19px; width: 263px; white-space: nowrap; overflow: hidden; }
        .c:hover { background: #fff; color: #00f; }
        .a { position: absolute; width: 159px; text-align: right; font: bold 11.25pt Calibri, sans-serif; line-height: 21px; }
        .ln { position: absolute; border-top: 2px solid #999; width: 689px; }
        .tl { position: absolute; background: #add8e6; font: bold 12pt Calibri, sans-serif; padding: 0 3px; height: 23px; width: 186px; line-height: 23px; }
        .tl.sky { background: #87ceeb; }
        .ta { position: absolute; background: #008080; color: #fff; text-align: right; font: bold 12pt Calibri, sans-serif; padding: 0 3px; height: 23px; width: 167px; line-height: 23px; }
        .fl { position: absolute; background: #add8e6; font: bold 12pt Calibri, sans-serif; padding: 0 3px; height: 18px; width: 133px; line-height: 18px; }
        .fa2 { position: absolute; background: #008080; color: #fff; text-align: right; font: bold 11pt Calibri, sans-serif; padding: 0 3px; height: 18px; width: 126px; line-height: 18px; }
    </style>
</head>
<body>
<div class="h-form pl" id="frmProfitLossHararical">
    <div class="h-tool" id="toolStrip3">
        <span class="lbl">Profit And Loss</span><span class="sep"></span>
        <button type="button" id="btnNew"><i class="fa fa-refresh"></i><u>R</u>efresh</button>
        <span class="dd"><button type="button" id="tsDropDown"><i class="fa fa-print"></i>143-Print &#9662;</button>
            <div class="dd-menu is-hidden" id="tsDropDownMenu"><div data-none="1" style="color:#666;cursor:default">(reports from the desktop's HararicalProfitAndLoss folder)</div></div></span>
        <button type="button" id="btnProfitAndLoss"><i class="fa fa-print"></i>166-Profit &amp; Loss</button>
        <button type="button" id="btnProfitLossBreakUp"><i class="fa fa-list"></i>ProfitLoss BreakUp</button>
    </div>
    <div id="body">
        <div id="panel3">
            <div class="h-filters" id="panel5">
                <span class="g h-lbl" id="label27" style="left:7px;top:10px">From &amp; To Date</span>
                <input type="date" id="txtFromDate" class="g h-in" style="left:103px;top:7px;width:99px">
                <input type="date" id="txtToDate" class="g h-in" style="left:205px;top:7px;width:99px">
                <label class="g h-ck" style="left:369px;top:13px"><input type="radio" name="grp" id="rdGroupCollapsed" checked>Collapse</label>
                <label class="g h-ck" style="left:369px;top:37px"><input type="radio" name="grp" id="rdGroupeExpand">Expand</label>
                <span class="g h-lbl" id="lblBranch" style="left:7px;top:38px">Branch</span>
                <div class="g" id="cmbbranch" style="left:103px;top:32px;width:199px"></div>
                <button type="button" id="btnshow" class="g h-btn" style="left:304px;top:32px;width:58px;height:26px">Show</button>
            </div>
            <div class="h-gridwrap"><table class="h-grid" id="grdHistory" style="width:100%"></table></div>
        </div>
        <div id="panel4"></div>
    </div>
</div>
<script th:src="@{/build/js/countx_acc_rpt_h.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_bs_pl_breakup.js?v=20260930a}"></script>
<script>
(function () {
    'use strict';
    var H = AccH, API = '/accounts/api/reports/profit-loss-64';
    var ctx = {}, branch = null, dec = 0, dt = [], dtFinal = [], open = {};

    /* [id, AccountNoteId, caption, groupbox-relative top, amount id, amount top] */
    var GB = [
        ['groupBox1', '', 6, 88, [['lblSalesnet', 2, 'Sales Net', 14, 'lblsalesnetamt', 14], ['lblcostofsale', 4, 'Cost Of Sale', 38, 'lblcostofsaleamt', 38]],
            58, ['lblGrosProf', 'Gross Profit', 60, 'lblGrossprofit', 60]],
        ['groupBox2', 'Non Operating Income', 94, 87, [['lblotherincome', 3, 'Other Income', 29, 'lblotherincomeamt', 29]],
            54, ['lblNoOperIncomeTotal', 'T. Non Operating Income', 59, 'lblToNonOperatingIncome', 59]],
        ['groupBox3', 'Operating Expense', 220, 167, [['lblotherexpense', 5, 'Other Expenses', 33, 'lblotherexpenseamt', 33], ['lblSellingExp', 7, 'Selling Expenses', 54, 'lblsellingexpamt', 58],
            ['lblAdmiExp', 8, 'Administration Expnses', 85, 'lbladministratorexpamt', 85], ['lblOperExp', 32, 'Operating Expense', 108, 'lbloperatingexpenseamt', 108]],
            129, ['lblTotOperExp', 'Total Operating Expense', 132, 'lblToOperatingExpense', 132]],
        ['groupBox4', 'Financial Expense', 422, 105, [['lblFinanExp', 9, 'Financial Expenses', 30, 'lblfinancialexpamt', 30], ['lblMarkupLoan', 1, 'Mark Up On Loans ', 53, 'lblmarkuploadAmount', 57]],
            73, ['lblTotFinanExp', 'Total Financial Expense', 76, 'lblTotalFinancialExpense', 76]],
        ['groupBox14', 'Taxation', 563, 51, [['lblTaxexpense', 6, 'Tax Expenses', 26, 'lbltaxexpenseamt', 26]], 0, null]
    ];

    function build() {
        var h = '';
        GB.forEach(function (g) {
            h += '<div class="gb" id="' + g[0] + '" style="left:6px;top:' + g[2] + 'px;width:694px;height:' + g[3] + 'px">' + (g[1] ? '<span class="lg">' + H.esc(g[1]) + '</span>' : '');
            g[4].forEach(function (i) {
                h += '<div class="c" id="' + i[0] + '" style="left:4px;top:' + i[3] + 'px">' + H.esc(i[2]) + '</div><div class="a" id="' + i[4] + '" style="left:529px;top:' + i[5] + 'px">0</div>';
            });
            if (g[6]) {
                h += '<div class="ln" style="left:4px;top:' + g[5] + 'px"></div><div class="tl" style="left:337px;top:' + g[6][2] + 'px">' + H.esc(g[6][1]) + '</div>'
                   + '<div class="ta" id="' + g[6][3] + '" style="left:524px;top:' + g[6][4] + 'px">0</div>';
            }
            h += '</div>';
        });
        [['Total Profit', 182, 'lblTotalProfit'], ['Total Operating Profit', 390, 'lblToOperatingProfit'], ['Profit Before Taxation', 535, 'lblProfitBeforeTax'], ['Profit After Taxation', 617, 'lblProfitAfterTax']]
            .forEach(function (t) {
                h += '<div class="tl sky" style="left:343px;top:' + t[1] + 'px">' + H.esc(t[0]) + '</div><div class="ta" id="' + t[2] + '" style="left:530px;top:' + t[1] + 'px' + (t[2] === 'lblProfitAfterTax' ? ';width:170px' : '') + '">0</div>';
            });
        [['Total Income', 617, 'lblTotalIncomeFoterAmt'], ['Total Expense', 638, 'lblTotalExpFoterAmt'], ['Net Profit', 658, 'lblNetProfitFoterAmt']].forEach(function (t) {
            h += '<div class="fl" style="left:9px;top:' + t[1] + 'px">' + H.esc(t[0]) + '</div><div class="fa2" id="' + t[2] + '" style="left:143px;top:' + t[1] + 'px">0</div>';
        });
        H.$('panel4').innerHTML = h;
        H.$('panel4').addEventListener('click', function (e) {
            var c = e.target.closest('.c'); if (!c) return;
            /* AccountNotefilter: dt.Select("AccountsNotes='" + caption + "'") -> ItemArray[5] */
            var r = dt.filter(function (x) { return String(H.ci(x, 'AccountsNotes')) === c.textContent; });
            if (!r.length) return;
            AccHBreakup.open({ status: 1, noteId: +H.ci(r[0], 'AccountNoteId') || 0, rows: dt, dec: dec,
                               fromDate: H.$('txtFromDate').value, toDate: H.$('txtToDate').value });
        });
    }

    function body() {
        return { fromDate: H.$('txtFromDate').value, toDate: H.$('txtToDate').value,
                 branchText: branch ? branch.text() : '', branchId: branch ? branch.id() : 0 };
    }

    /* GridBind (:124): RowId / ParentId built from AcLevel 1..5, visible AccountTitle + Amount (Closing). */
    function gridBind(rows) {
        dtFinal = [];
        var p2 = null, p3 = null, p4 = null, p5 = null, id = 0;
        (rows || []).forEach(function (r) {
            id++;
            var lvl = +H.ci(r, 'AcLevel') || 0, parent;
            if (lvl === 1) { p2 = id; parent = null; }
            else if (lvl === 2) { p3 = id; parent = p2; }
            else if (lvl === 3) { p4 = id; parent = p3; }
            else if (lvl === 4) { p5 = id; parent = p4; }
            else if (lvl === 5) { parent = p5; }
            else return;
            dtFinal.push({ RowId: id, ParentId: parent, AccountId: H.ci(r, 'AccountId'), AccountCode: H.ci(r, 'AccountCode'), AccountTitle: H.ci(r, 'AccountTitle'),
                           AcLevel: lvl, Debit: H.toNum(H.ci(r, 'Debit')), Credit: H.toNum(H.ci(r, 'Credit')), Amount: H.toNum(H.ci(r, 'Closing')), IsGroupDetail: H.ci(r, 'IsGroupDetail') });
        });
        open = {};
        if (H.$('rdGroupeExpand').checked) dtFinal.forEach(function (r) { open[r.RowId] = true; });
        drawGrid();
    }
    function drawGrid() {
        var g = H.$('grdHistory');
        if (!dtFinal.length) { g.innerHTML = ''; return; }
        var kids = {};
        dtFinal.forEach(function (r) { var k = r.ParentId == null ? 'root' : r.ParentId; (kids[k] = kids[k] || []).push(r); });
        var h = '<thead><tr><th style="width:350px">AccountTitle</th><th>Amount</th></tr></thead><tbody>', total = 0;
        function walk(list, depth) {
            (list || []).forEach(function (r) {
                var has = !!kids[r.RowId];
                h += '<tr class="' + (String(r.IsGroupDetail) === 'Group' ? 'bold' : '') + '"><td style="padding-left:' + (4 + depth * 16) + 'px">'
                   + (has ? '<span class="tg" data-id="' + r.RowId + '">' + (open[r.RowId] ? '&#9662;' : '&#9656;') + '</span>' : '<span class="tg"></span>')
                   + H.esc(r.AccountTitle) + '</td><td class="num">' + H.esc(H.both(r.Amount, dec)) + '</td></tr>';
                if (has && open[r.RowId]) walk(kids[r.RowId], depth + 1);
            });
        }
        (kids.root || []).forEach(function (r) { total += r.Amount; });
        walk(kids.root, 0);
        h += '</tbody><tfoot><tr><td></td><td class="num">' + H.esc(H.both(total, dec)) + '</td></tr></tfoot>';
        g.innerHTML = h;
    }
    H.$('grdHistory').addEventListener('click', function (e) {
        var t = e.target.closest('.tg[data-id]'); if (!t) return;
        var id = t.getAttribute('data-id'); open[id] = !open[id]; drawGrid();
    });
    function expandAll(on) { open = {}; if (on) dtFinal.forEach(function (r) { open[r.RowId] = true; }); drawGrid(); }
    H.$('rdGroupCollapsed').addEventListener('change', function () { expandAll(!this.checked); });
    H.$('rdGroupeExpand').addEventListener('change', function () { expandAll(this.checked); });

    function t(id, v) { H.$(id).textContent = H.both(v, dec); }
    /* ProfitAndLossStatic */
    function statics(rows) {
        dt = rows || [];
        if (!dt.length) return;
        var s = {}, map = {};
        GB.forEach(function (g) { g[4].forEach(function (i) { s[i[1]] = 0; map[i[1]] = i; }); });
        dt.forEach(function (r) {
            var n = +H.ci(r, 'AccountNoteId') || 0;
            if (map[n]) { s[n] += H.toNum(H.ci(r, 'Amount')); H.$(map[n][0]).textContent = H.ci(r, 'AccountsNotes') == null ? '' : String(H.ci(r, 'AccountsNotes')); }
        });
        Object.keys(map).forEach(function (n) { t(map[n][4], s[n]); });
        var sales = s[2], cos = s[4], oexp = s[5], tax = s[6], sell = s[7], adm = s[8], fin = s[9], opx = s[32], mk = s[1], oinc = s[3];
        var opTot = oexp + sell + adm + opx, finTot = fin + mk;
        t('lblGrossprofit', sales + cos); t('lblToNonOperatingIncome', oinc); t('lblToOperatingExpense', opTot);
        t('lblTotalFinancialExpense', finTot); t('lblTotalProfit', sales + cos + oinc);
        t('lblToOperatingProfit', sales + cos + oinc + opTot);
        t('lblProfitBeforeTax', sales + cos + oinc + opTot + finTot);
        t('lblProfitAfterTax', sales + cos + oinc + opTot + finTot + tax);
        var inc = sales + oinc, exp = cos + oexp + sell + adm + opx + fin + mk + tax;
        t('lblTotalIncomeFoterAmt', inc); t('lblTotalExpFoterAmt', exp); t('lblNetProfitFoterAmt', inc + exp);
    }

    function show() {
        return H.api('POST', API + '/show', body()).then(function (d) { gridBind(d.grid); statics(d.pl); });
    }

    build();
    H.$('txtToDate').value = H.today();
    H.$('btnshow').addEventListener('click', function () { show().catch(function (e) { H.box(e.message); }); });
    /* btnNew_Click: dates reset, GridBind only */
    H.$('btnNew').addEventListener('click', function () {
        H.$('txtFromDate').value = (ctx.financialYearStart || '').substring(0, 10);
        H.$('txtToDate').value = H.today();
        H.api('POST', API + '/refresh', body()).then(function (d) { gridBind(d.grid); }).catch(function (e) { H.box(e.message); });
    });
    /* tsDropDown: the .rpt files of the desktop's HararicalProfitAndLoss report folder, filled with dtFinal */
    H.$('tsDropDown').addEventListener('click', function () { H.$('tsDropDownMenu').classList.toggle('is-hidden'); });
    document.addEventListener('click', function (e) { if (!e.target.closest('.dd')) H.$('tsDropDownMenu').classList.add('is-hidden'); });
    H.$('tsDropDownMenu').addEventListener('click', function () {
        if (!dtFinal.length) { H.box('Record Not Found For Display'); return; }
        H.printRows('143 - Profit And Loss', 'Browser output of dtFinal - the desktop fills the .rpt chosen from its HararicalProfitAndLoss folder.',
            ['AccountCode', 'AccountTitle', 'AcLevel', 'Debit', 'Credit', 'Amount', 'IsGroupDetail'], dtFinal,
            function (c, v) { return typeof v === 'number' && c !== 'AcLevel' ? H.both(v, dec) : (v == null ? '' : v); });
    });
    /* btnProfitAndLoss_Click - 166-ProfitLossNewReport.rpt */
    H.$('btnProfitAndLoss').addEventListener('click', function () {
        H.api('POST', API + '/print166', body()).then(function (rows) {
            H.printRows('166 - Profit & Loss', 'Browser output of SpAccounts_ProfitLoss_ForCrystal - not the Crystal layout.', Object.keys(rows[0]), rows,
                function (c, v) { return typeof v === 'number' && /Amount|Debit|Credit|Balance/i.test(c) ? H.both(v, dec) : (v == null ? '' : v); });
        }).catch(function (e) { H.box(e.message); });
    });
    /* btnProfitLossBreakUp_Click opens frmProfitLossBreakUp - a separate form, not ported with this screen. */
    H.$('btnProfitLossBreakUp').addEventListener('click', function () {
        H.box('ProfitLoss BreakUp (frmProfitLossBreakUp) is not available on the web yet.');
    });

    /* frmTrialBalancesAllLevel_Load */
    H.api('GET', API + '/init').then(function (c) {
        ctx = c; dec = c.amountDecimals || 0;
        if (!c.branchFeature) {
            H.$('lblBranch').classList.add('is-hidden'); H.$('cmbbranch').classList.add('is-hidden');
            H.$('label27').style.top = '20px'; H.$('txtFromDate').style.top = '15px'; H.$('txtToDate').style.top = '15px';
            H.$('btnshow').style.top = '15px';
        } else {
            branch = H.branchCombo(H.$('cmbbranch'), c);
        }
        H.$('txtFromDate').value = (c.financialYearStart || '').substring(0, 10);
        return show();
    }).catch(function (e) { H.box(e.message); });
})();
</script>
</body>
</html>
