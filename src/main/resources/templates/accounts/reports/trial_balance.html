<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trial Balance</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
    <style>
        .accf .sort-bar { background: var(--f-teal); color: #fff; padding: 2px 8px; display: flex; align-items: center; gap: 10px; margin: 4px 4px 0 4px; }
        .accf .sort-bar .chk { color: #fff; }
        .accf .sort-bar .win-btn { height: 18px; }
    </style>
</head>
<!--
  Screen 51 "Trial Balance" - Architecture.WinApp.Account_Reports.TrialBalance (base.Name "TrialBalance").
  Load: VouchertypeFill (Sp_Vouchers_GetMethods GetDocumentTypesFromVouchers, multi), BranchesFill when feature 17
  (multi when 18), MultiLanguagesGetAll (BindDDLNew ZeroIndex true, hidden, Ctrl+L), GroupAccountFill (ReadAllAccountgroup),
  CustomGroupsDefine(1); SkipZero + ChkBoxPost ticked; fromdate = ActiveYr.Start_Period; todate = End_Period when earlier
  than today, else today.
  Show: VoucherReports.TrialBalanceReport -> Sp_TrialBalance_Rpt via /accounts/api/reports-desktop/trial-balance.
  Grid: GridSettings - grouped on ParentTitle when "Group On Parent Ac", four / six column modes, sums in stringFormatboth,
  sorted "ParentAccountTitle ASC" + the chosen sort columns; AccountCode links to the General Ledger (Detail) or the
  Trial Balance Selected (Group).
-->
<body class="accf">
<div class="win-title-bar">
    <span><i class="fa fa-balance-scale"></i> Trial Balance</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<ul class="win-tabs">
    <li class="active"><a>Trial Balance</a></li>
    <li><a href="/accounts/reports/selected-trial-balance">Trial Balance Selected</a></li>
    <!-- TrialBalance.tabControl1 has only tabTrialBalance + tabTrialbalanceselected; "Trial Balances All Level" is a separate form (screen 82) -->
</ul>
<div class="win-toolbar">
    <button type="button" class="win-btn" onclick="resetTB()"><i class="fa fa-plus text-success"></i> Reset</button>
    <!-- toolStrip3: Reset, Print (tsDrowdownTrial), [131-TrialBalance, 135-TrialBalanceUpto5thLevel: Visible=false], 111A&Print
         (btntrialMultisubPrint), Level Wise (tsDropDownLevelWise), [Load For Vouchers: Visible=false] -->
    <span class="tbp-dd"><button type="button" class="win-btn" id="tsDrowdownTrial"><i class="fa fa-print"></i> Print <i class="fa fa-caret-down"></i></button><div class="tbp-menu" hidden></div></span>
    <button type="button" class="win-btn" id="btntrialMultisubPrint" data-rpt="111A-AcRptTrialBalances.rpt" data-rpt-own accesskey="p"><i class="fa fa-print"></i> 111A<u>P</u>rint</button>
    <span class="tbp-dd"><button type="button" class="win-btn" id="tsDropDownLevelWise"><i class="fa fa-print"></i> Level Wise <i class="fa fa-caret-down"></i></button><div class="tbp-menu" hidden></div></span>
</div>
<div class="win-header-panel"><span>Trial Balance</span></div>

<div class="filters">
    <div class="gb" style="width:600px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 95px 130px 55px 90px 1fr;">
            <span class="lbl">From Date</span><input type="date" id="fromdate" class="inp">
            <span class="lbl">Cl_Debit</span><input type="text" id="txtClosingDebit" class="inp" value="0" style="text-align:right;">
            <label class="chk"><input type="checkbox" id="ChkBoxPost" checked> Include UnPost Voucher</label>

            <span class="lbl">To Date</span><input type="date" id="todate" class="inp">
            <span class="lbl">Cl_Credit</span><input type="text" id="txtClosingCredit" class="inp" value="0" style="text-align:right;">
            <label class="chk"><input type="checkbox" id="SkipZero" checked> Skip Zero</label>

            <span class="lbl">Documents Not To Include</span>
            <select id="cmbDocumentTypeIds" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Document Type" style="grid-column: span 3;"></select>
            <label class="chk"><input type="checkbox" id="chkSkipCGSAc"> Skip CGS Accounts</label>

            <span class="lbl">Group Account</span>
            <select id="CmbGroupAccount" class="inp" style="grid-column: span 3;" data-dtcombo-caption="Account Title"></select>
            <label class="chk"><input type="checkbox" id="chkGroupOnParent" checked> Group On Parent Ac</label>

            <span class="lbl">Custom Groups</span>
            <select id="CmbCustomeGroups" class="inp" style="grid-column: span 3;" data-dtcombo-caption="Custom Group"></select>
            <span><label class="chk"><input type="radio" name="rdColumns" id="rdFourColumns" checked> Four Columns</label>
                  <label class="chk"><input type="radio" name="rdColumns" id="rdSixColumns"> Six Columns</label></span>

            <span class="lbl tb-branch" style="display:none;">Branches</span>
            <select id="CmbBranches" class="inp tb-branch" style="grid-column: span 3; display:none;" data-dtcombo-caption="Branch Name"></select>
            <span class="tb-branch" style="display:none;"></span>

            <span class="lbl tb-lang" style="display:none;">Language</span>
            <select id="CmbLanguage" class="inp tb-lang" style="grid-column: span 3; display:none;" data-dtcombo-caption="LanguageName"></select>
            <span class="tb-lang" style="display:none;"></span>
        </div>
        <div style="text-align:right; margin-top:6px;">
            <button type="button" id="btnshow" class="win-btn-show" onclick="executeTB()"><i class="fa fa-eye"></i> Show</button>
        </div>
    </div>
    <div class="gb" style="width:150px;">
        <span class="gb-title">Group Accounts Show</span>
        <div class="fcol" style="gap:8px; margin-top:4px;">
            <label class="chk"><input type="checkbox" id="chkStockGroupAccountShow" checked> Stock</label>
            <label class="chk"><input type="checkbox" id="ChkSaleGroupAccountShow" checked> Sale</label>
            <label class="chk"><input type="checkbox" id="ChkCGSGroupAccountShow" checked> CGS</label>
        </div>
    </div>
</div>

<div class="sort-bar">
    <label class="chk"><input type="checkbox" id="chkAccountCodeSorting"> Account Code</label>
    <label class="chk"><input type="checkbox" id="chkAccountTitleSorting"> Account Title</label>
    <label class="chk"><input type="checkbox" id="chkClosingSorting"> Closing</label>
    <button type="button" class="win-btn" onclick="applySorting()">Apply Sorting</button>
    <label class="chk"><input type="radio" name="rdSortDir" id="rdAscending" checked> Ascending</label>
    <label class="chk"><input type="radio" name="rdSortDir" id="rdDescending"> Descending</label>
    <span id="lblSortingCritera" style="font-weight:bold; margin-left:auto;">(ParentAccountTitle ASC)</span>
</div>
<div class="grid-caption"><span>Trial Balance</span><span id="lblStatus"></span></div>
<div class="grid-wrap"><table class="wg" id="tbTable"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20261002gv}"></script>
<script th:src="@{/build/js/countx_tb_family_print.js?v=20261002gl}"></script>
<script>
    let TB_CTX = null, tbData = [], tbBranchShown = false;
    /* 2026-10-02: the filters of the last successful Show (dtTrial was built from them). 111A&Print sends them as the
       arguments of the 111a contract (VoucherReports.TrialBalanceReport -> Sp_TrialBalance_Rpt); before, the button sent none. */
    let tbPrintArgs = null;

    function sortCols() {
        const cols = [];
        if ($('#chkAccountCodeSorting').is(':checked')) cols.push('AccountCode');
        if ($('#chkAccountTitleSorting').is(':checked')) cols.push('AccountTitle');
        if ($('#chkClosingSorting').is(':checked')) cols.push('Closing');
        return cols;
    }
    function applySorting() {
        const dir = $('#rdAscending').is(':checked') ? 'ASC' : 'DESC';
        const dyn = sortCols().map(function (c) { return c + ' ' + dir; }).join(', ');
        $('#lblSortingCritera').text('(' + (dyn ? 'ParentAccountTitle ASC, ' + dyn : 'ParentAccountTitle ASC') + ')');
        if (tbData.length) renderTb();
    }
    /* DataView.Sort "ParentAccountTitle ASC[, AccountCode|AccountTitle|Closing ASC|DESC]" */
    function sortedRows() {
        const cols = sortCols(), asc = $('#rdAscending').is(':checked');
        function cmp(a, b) { return String(a == null ? '' : a).localeCompare(String(b == null ? '' : b), undefined, { numeric: true }); }
        return tbData.slice().sort(function (a, b) {
            const p = cmp(a.ParentAccountTitle, b.ParentAccountTitle);
            if (p) return p;
            for (const c of cols) {
                const d = c === 'Closing' ? AccF.num(a.Closing) - AccF.num(b.Closing) : cmp(a[c], b[c]);
                if (d) return asc ? d : -d;
            }
            return 0;
        });
    }

    /* GridSettings */
    function renderTb() {
        const six = $('#rdSixColumns').is(':checked');
        const onParent = $('#chkGroupOnParent').is(':checked');
        const rows = sortedRows().map(function (r) { return Object.assign({ ParentTitle: r.ParentAccountTitle }, r); });
        AccF.renderGrid({
            table: '#tbTable', rows: rows, emptyText: '',
            groupBy: onParent ? 'ParentTitle' : null, groupCaption: 'ParentTitle',
            columns: [
                { key: 'BranchName', visible: tbBranchShown },
                { key: 'ParentTitle', visible: !onParent },
                { key: 'AccountCode', link: function (r) { onAccountCodeClick(r); } },
                { key: 'AccountTitle' },
                { key: 'AccountType' },
                { key: 'Opening', type: 'both', sum: true, visible: !six },
                { key: 'OpeningDr', type: 'both', sum: true, visible: six },
                { key: 'OpeningCr', type: 'both', sum: true, visible: six },
                { key: 'Debit', type: 'both', sum: true },
                { key: 'Credit', type: 'both', sum: true },
                { key: 'Closing', type: 'both', sum: true, visible: !six },
                { key: 'ClosingDr', type: 'both', sum: true, visible: six },
                { key: 'ClosingCr', type: 'both', sum: true, visible: six }
            ]
        });
        $('#lblStatus').text(tbData.length ? 'Records: ' + tbData.length : '');
    }

    /* grd_LinkClicked on AccountCode: Detail -> General Ledger, else Trial Balance Selected (GroupId, From, To) */
    function onAccountCodeClick(r) {
        const fd = $('#fromdate').val(), td = $('#todate').val();
        if (String(r.AccountGroup || '').toLowerCase() === 'detail') AccF.openLedger(r.AccountId, fd, td, r.SubsidiaryAccoutId, r.BranchesId);
        else window.open('/accounts/reports/selected-trial-balance?groupAccountId=' + encodeURIComponent(r.AccountId) + '&fromDate=' + fd + '&toDate=' + td, '_blank');
    }

    function buildTbRequest() {
        const acTypes = [];
        if ($('#chkStockGroupAccountShow').is(':checked')) acTypes.push('4');
        if ($('#ChkSaleGroupAccountShow').is(':checked')) acTypes.push('10');
        if ($('#ChkCGSGroupAccountShow').is(':checked')) acTypes.push('12');
        const br = $('#CmbBranches').val();
        return {
            fromDate: $('#fromdate').val(), toDate: $('#todate').val(),
            skipZero: $('#SkipZero').is(':checked'),
            clDebit: $('#txtClosingDebit').val() || '0', clCredit: $('#txtClosingCredit').val() || '0',
            includeUnposted: $('#ChkBoxPost').is(':checked'),
            languageId: $('#CmbLanguage').val() || 0,
            documentTypeIds: AccF.selectedIds('#cmbDocumentTypeIds') || null,
            branchesIds: br ? (Array.isArray(br) ? br.join(',') : br) : null,
            accountTypeIds: acTypes.length ? acTypes.join(',') : null,
            customGroupId: $('#CmbCustomeGroups').val() || null,
            groupAccountId: $('#CmbGroupAccount').val() || null,
            skipCgs: $('#chkSkipCGSAc').is(':checked')
        };
    }

    async function executeTB() {
        const btn = $('#btnshow');
        AccF.busy(btn, true);
        try {
            const req = buildTbRequest();
            tbData = (await AccF.post('/trial-balance', req)) || [];
            tbPrintArgs = {
                fromDate: req.fromDate, toDate: req.toDate,
                zeroBalanceType: req.skipZero ? 1 : 0,                       // always sent
                languageId: req.languageId || 0,                             // always sent
                isApproved: req.includeUnposted ? '' : 1,                    // ApprovedFilter "All" -> not sent
                documentTypeIds: req.documentTypeIds || '', branchesIds: (TB_CTX && TB_CTX.branchFeature && req.branchesIds) || '',
                debit: req.clDebit || '', credit: req.clCredit || '', accountTypeIds: req.accountTypeIds || '',
                groupAccountId: req.groupAccountId || '', customGroupId: req.customGroupId || '',
                skipCgsAccounts: req.skipCgs ? 1 : '', pageNumber: '', pageSize: ''
            };
            const br = $('#CmbBranches').val();
            tbBranchShown = !!(TB_CTX && TB_CTX.branchFeature && br && br.length);
            renderTb();
        } catch (e) {
            tbData = []; tbPrintArgs = null; $('#tbTable').empty(); $('#lblStatus').text('');
            alert(e.message);
        } finally { AccF.busy(btn, false); }
    }

    /* TrialBalance.reset(): SkipZero ticked; fromdate = ActiveYr.Start_Period */
    function resetTB() {
        $('#SkipZero').prop('checked', true);
        if (TB_CTX && TB_CTX.activeYear.startPeriod) $('#fromdate').val(TB_CTX.activeYear.startPeriod);
    }

    $('input[name="rdColumns"], #chkGroupOnParent').on('change', function () { if (tbData.length) renderTb(); });

    /* btntrialMultisubPrint_Click (111A&Print): dtTrial -> 111A-AcRptTrialBalances.rpt, or "Record not found for Display" */
    $('#btntrialMultisubPrint').on('click', function () {
        if (!tbData.length || !tbPrintArgs) { alert('Record not found for Display'); return; }
        window.printRpt('111A-AcRptTrialBalances.rpt', Object.assign({}, tbPrintArgs));
    });
    /* tsDrowdownTrial (DynamicReportsLoad("TrialBalance")) and tsDropDownLevelWise (DynamicReportsLoad("Trial Balance Level Wise")):
       dtTrial (the Show rows, in the DataView.Sort order) -> the clicked .rpt; the desktop's messages when the grid is empty */
    TbPrint.menu('#tsDrowdownTrial', 'TrialBalance', function (item) {
        if (!tbData.length) { alert('Record not found for Display'); return; }
        TbPrint.rows(item, sortedRows(), '#tsDrowdownTrial');
    });
    TbPrint.menu('#tsDropDownLevelWise', 'Trial Balance Level Wise', function (item) {
        if (!tbData.length) { alert('Record Not Found For Display'); return; }
        TbPrint.rows(item, sortedRows(), '#tsDropDownLevelWise');
    });
    $('#rdAscending, #rdDescending, #chkAccountCodeSorting, #chkAccountTitleSorting, #chkClosingSorting').on('change', applySorting);

    $(document).on('keydown', function (e) {
        if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); $('.tb-lang').show(); AccF.focus('#CmbLanguage'); }
        if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); resetTB(); }
    });

    $(function () { (async function () {
        try {
            TB_CTX = await AccF.context();
            /* TrialBalance_Load dates */
            const t = AccF.today(), ay = TB_CTX.activeYear || {};
            $('#fromdate').val(ay.startPeriod || t);
            $('#todate').val(ay.endPeriod && ay.endPeriod < t ? ay.endPeriod : t);
            AccF.fillSelect('#cmbDocumentTypeIds', await AccF.lookup('document-types'), 'Id', 'DocumentTypeDescription', null);
            if (TB_CTX.branchFeature) {
                const brs = await AccF.lookup('branches');
                if (TB_CTX.branchConsolidated) $('#CmbBranches').attr({ multiple: 'multiple', 'data-dtcombo-checked': '' }); /* 2026-10-02: checked combo */
                AccF.fillSelect('#CmbBranches', brs, 'Id', 'BranchName', TB_CTX.branchConsolidated ? null : '');
                $('#CmbBranches').val(TB_CTX.branchConsolidated ? [String(TB_CTX.userBranchId)] : String(TB_CTX.userBranchId));
                AccF.ctl('#CmbBranches'); $('.tb-branch').show();
            }
            /* MultiLanguagesGetAll: BindDDLNew(..., ZeroIndex true) -> "...Select Any Value..." (0) selected */
            AccF.fillSelect('#CmbLanguage', await AccF.lookup('languages'), 'Id', 'LanguageDescription', null);
            $('#CmbLanguage').prepend($('<option>').val('0').text('...Select Any Value...')).val('0');
            AccF.fillSelect('#CmbGroupAccount', await AccF.lookup('account-groups'), 'Id', 'AccountTitle', '');
            AccF.fillSelect('#CmbCustomeGroups', await AccF.lookup('custom-groups'), 'Id', 'AcLookUpsDescription', '');
            document.getElementById('fromdate').focus();
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
