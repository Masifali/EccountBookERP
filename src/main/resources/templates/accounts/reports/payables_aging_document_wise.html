                | panel4 Fill (panel6 teal 29 "Filtered Records" + DataGridHistory Fill, Janus Verdana 8.25pt).
  groupBox1 children (designer Location/Size): label1 "As On Date" 6,18 | datAsOnDate 6,38 121x23 (dd-MMM-yy) |

<style>
    :root { --teal: #008080; --tsb-border: #c3cbd6; --frame: #a0a0a0; }
    html, body { margin: 0; height: 100%; }
    body { background: #f0f0f0; color: #000; overflow: hidden; font: 13px Verdana, Tahoma, sans-serif; }
    [hidden] { display: none !important; }
    /* The designer layout keeps its pixels; when the browser is narrower than the form THIS box scrolls, never the page. */
    .frm-scroll { position: absolute; inset: 0; overflow: auto; }
    .frm { position: relative; min-width: 903px; min-height: 560px; height: 100%; display: flex; flex-direction: column; background: #fff; }

    /* panel2 (Dock Top 29) - toolStrip3 (27 high, professional renderer) */
    .p2 { flex: 0 0 29px; height: 29px; background: #f0f0f0; }
    .ts { height: 27px; display: flex; align-items: center; padding: 0 2px; box-sizing: border-box;
          background: linear-gradient(#ffffff, #e9eef4); border-bottom: 1px solid var(--tsb-border); }
    .ts button { font: 13px Verdana, Tahoma, sans-serif; height: 24px; padding: 0 4px 0 3px; margin: 0 1px 0 0; border: 1px solid transparent;
                 background: transparent; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; color: #000; box-sizing: border-box; }
    .ts button:hover:not(:disabled) { border-color: #3399ff; background: #cce8ff; }
    .ts button:disabled { color: #8d8d8d; cursor: progress; }
    .ts button svg { width: 16px; height: 16px; flex: 0 0 16px; }
    .ts button.busy svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .teal { background: var(--teal); color: #fff; position: relative; box-sizing: border-box; }
    .teal .cap { position: absolute; left: 7px; top: 5px; white-space: nowrap; font: bold 16px Tahoma, Verdana, sans-serif; line-height: 19px; color: #fff; }

    /* panel3 (Dock Top 103, White) */
    .p3 { flex: 0 0 103px; height: 103px; position: relative; background: #fff; }
    .p5 { position: absolute; left: 0; right: 0; top: 0; height: 29px; }
    /* GroupBox: caption on the frame line, Tahoma 9.75pt bold */
    .gb { position: absolute; box-sizing: border-box; font: bold 13px Tahoma, Verdana, sans-serif; }
    .gb > .gb-frame { position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d0d0d0; border-radius: 3px; }
    .gb > .gb-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; white-space: nowrap; line-height: 14px; }
    .lbl { position: absolute; white-space: nowrap; font: 600 12px "Segoe UI Semibold", "Segoe UI", Calibri, Carlito, Arial, sans-serif; line-height: 15px; color: #000; }
    input.tb { position: absolute; box-sizing: border-box; border: 1px solid #7a7a7a; padding: 1px 3px; margin: 0; background: #fff; color: #000;
               font: 13px Verdana, Tahoma, sans-serif; }
    input.tb[type=date] { padding: 0 0 0 3px; }
    input.tb[type=date]::-webkit-calendar-picker-indicator { margin: 0; padding: 0 1px; }
    .teal-btn { position: absolute; background: var(--teal); color: #fff; font: bold 13px Tahoma, Verdana, sans-serif; border: 1px solid #006666;
                padding: 0; cursor: pointer; box-sizing: border-box; white-space: nowrap; overflow: hidden; }
    .teal-btn:hover:not(:disabled) { background: #006d6d; }
    .teal-btn:focus-visible { outline: 1px dotted #fff; outline-offset: -4px; }
    .teal-btn:disabled { cursor: progress; }
    .teal-btn.busy { color: transparent; }
    .teal-btn.busy::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -7px 0 0 -7px;
                            border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    .pcx-wrap .dtcombo-input.pcx-field { font: 13px Verdana, Tahoma, sans-serif; }   /* UltraCombo Verdana 9.75pt */

    /* panel4 Fill: panel6 teal 29 + DataGridHistory (Janus GridEX, Office look, Verdana 8.25pt) */
    .p4 { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .p6 { flex: 0 0 29px; height: 29px; }
    .gridbox { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; border: 1px solid var(--frame); box-sizing: border-box; background: #fff; }
    .grid { flex: 1 1 auto; min-height: 0; position: relative; overflow: auto; background: #fff; }
    .grid:focus { outline: 1px dotted var(--teal); outline-offset: -2px; }
    table.g { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; font: 11px Verdana, Tahoma, sans-serif; }
    table.g th { position: sticky; top: 0; z-index: 2; height: 32px; background: linear-gradient(#fdfdfd, #e3e8ef); border-right: 1px solid #c3c9d1;
                 border-bottom: 1px solid #a9b3bf; padding: 1px 4px; text-align: center; font-weight: normal; white-space: normal;
                 overflow: hidden; box-sizing: border-box; cursor: default; user-select: none; }   /* HeaderLines 2, HeaderAlignment Center */
    table.g th .sort { font-size: 8px; margin-left: 3px; color: #555; }
    table.g tr.flt td { position: sticky; top: 32px; z-index: 2; height: 22px; padding: 1px; background: #f7f9fb; border-bottom: 1px solid #a9b3bf; }
    table.g tr.flt input { width: 100%; height: 19px; box-sizing: border-box; border: 1px solid #c5ccd4; font: 11px Verdana, Tahoma, sans-serif; padding: 0 2px; }
    table.g td { border-right: 1px solid #e1e4e8; border-bottom: 1px solid #e1e4e8; padding: 1px 4px; height: 30px; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; background: #fff; box-sizing: border-box; }   /* RowHeight 30 */
    table.g td.num { text-align: right; }
    table.g td.wrap { white-space: normal; line-height: 13px; }          /* Remarks WordWrap */
    table.g tbody tr.r:hover td { background: #eaf3fb; }
    table.g tbody tr.r.sel td { background: #cde6f7; }
    table.g tbody tr.r:focus { outline: none; }
    table.g a.lnk { color: #0645ad; text-decoration: underline; cursor: pointer; }
    table.g tr.grp td { height: 22px; background: #e6ebf1; border-bottom: 1px solid #c3c9d1; font-weight: bold; cursor: pointer; }
    table.g tr.grp .tg { display: inline-block; width: 11px; height: 11px; line-height: 9px; text-align: center; border: 1px solid #8a96a3;
                         background: #fff; font: 10px Verdana, sans-serif; margin-right: 5px; vertical-align: -1px; }
    table.g tr.gtot td { height: 22px; background: #f4f6f8; font-weight: bold; border-bottom: 1px solid #c3c9d1; }
    table.g tfoot td { position: sticky; bottom: 0; z-index: 1; height: 22px; background: #eef1f4; font-weight: bold; border-top: 1px solid #a9b3bf; }
    /* RecordNavigator */
    .nav { flex: 0 0 20px; height: 20px; display: flex; align-items: center; gap: 2px; padding: 0 4px; border-top: 1px solid #c3c9d1;
           background: #f4f6f8; font: 11px Verdana, Tahoma, sans-serif; }
    .nav button { font: 10px Verdana, sans-serif; height: 16px; min-width: 18px; padding: 0 2px; border: 1px solid #b8c0c9; background: #fff; cursor: pointer; }

    /* ShortCutKeyPopUp */
    dialog.sck { padding: 0; border: 1px solid #6d7b8a; width: 470px; font: 12px Verdana, Tahoma, sans-serif; }
    dialog.sck .hd { background: var(--teal); color: #fff; font: bold 13px Tahoma, Verdana, sans-serif; padding: 5px 8px; }
    dialog.sck table { width: 100%; border-collapse: collapse; }
    dialog.sck th, dialog.sck td { border: 1px solid #d5dbe2; padding: 3px 6px; text-align: left; }
    dialog.sck th { background: linear-gradient(#fdfdfd, #e3e8ef); font-weight: normal; }
    dialog.sck .ft { text-align: right; padding: 6px; }
    dialog.sck .ft button { font: 12px Verdana, sans-serif; padding: 2px 14px; }
</style>
