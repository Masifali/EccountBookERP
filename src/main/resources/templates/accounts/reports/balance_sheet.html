<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Balance Sheet</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_h.css?v=20260930s}">
</head>
<!--
  Screen 62 "Balance Sheet" - Architecture.WinApp.Account_Reports.BalanceSheet (BalanceSheet.cs, ScreenName frmBalanceSheet).
  Read-only. Data: /accounts/api/reports/balance-sheet-62 (BalanceSheetReportService):
    Load / Show  BindDatainGrid -> SpAccounts_BalanceSheetFormatA_Report (@OrganizationId, @CompanyId, @UserId, @ToDate,
                 @BranchesIds only when GetBranchesIdsByFeature returned one). The statement is the form's own sums per AccountNoteId.
    153-Print    SpAccounts_BalanceSheetFormatA_ForCrystal (@ClassIds '1,2,3') - browser output, not the Crystal layout.
    Caption click AccountNotefilter -> BS and PL Breakup (screen 84) as a dialog; "Net Profit/Loss" opens Profit & Loss 01.
  To Date: the DateTimePicker default (today). Rebuilt 2026-09-30 (R5) after the page was rolled back to the old mock-up.
-->
<body class="accf">
<div class="win-title-bar">
    <span><i class="fa fa-balance-scale"></i> Balance Sheet</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<ul class="win-tabs">
    <li class="active"><a>Balance Sheet</a></li>
    <li><a href="/accounts/reports/profit-and-loss">Profit &amp; Loss 01</a></li>
</ul>
<div class="win-toolbar" id="toolStrip3">
    <button type="button" class="win-btn" id="btnNew"><i class="fa fa-refresh text-success"></i> <span><u>R</u>efresh</span></button>
    <button type="button" class="win-btn" id="toolStripButton1" data-rpt="153-BalanceSheetStatementRpt.rpt"><i class="fa fa-print"></i> 153-Print</button>
</div>
<div class="win-header-panel" id="panel3"><span>Balance Sheet</span></div>

<div class="filters" id="panel5">
    <div class="gb" style="width:560px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 50px 132px 44px 204px 1fr;">
            <span class="lbl" id="label33">To Date</span>
            <input type="date" id="todate" class="inp">
            <span class="lbl" id="lblBranch">Branch</span>
            <div id="cmbbranch"></div>
            <div class="show-cell"><button type="button" id="btnshow" class="win-btn-show"><i class="fa fa-eye"></i> Show</button></div>
        </div>
    </div>
</div>

<div class="grid-caption"><span>Balance Sheet</span><span id="lblStatus"></span></div>
<div class="stmt-wrap"><div class="stmt" id="panel6" style="width:916px;height:640px;"></div></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_rpt_h.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_bs_pl_breakup.js?v=20260930s}"></script>
<script>
(function () {
    'use strict';
    var H = AccH, API = '/accounts/api/reports/balance-sheet-62';
    var ctx = {}, branch = null, dec = 0, dt = [];

    /* BalanceSheet.InitializeComponent: [groupbox, caption, left, top, width, height, caption width, amount left,
       rows [captionId, AccountNoteId, default text, top, amountId, amount top, tall],
       line top, total [label, labelWidth, amountId, amount left, top]] */
    var GB = [
        ['groupBox1', 'Owner Equity', 22, 5, 468, 185, 258, 311, [
            ['lblShareCapitalCaption', 29, 'Share Capital', 31, 'lblCapitalShareAmt', 31],
            ['lblSharDepositCaption', 36, 'Shared Deposit', 56, 'lblShareDepositAmt', 56],
            ['lblUnAppropriatedCaption', 34, 'Un-Appropriated P/L', 81, 'lblUnAppropriatedAmt', 81],
            ['lblReserveCaption', 35, 'Reserves', 106, 'lblReserveAmt', 106],
            ['lblNetPLCaption', 'PL', 'Net Profit/Loss', 130, 'lblNetPLAmount', 130]],
            153, ['Total Owner Equity', 258, 'lblToOwnerEquityAmt', 309, 156]],
        ['groupBox2', 'Non Current Liabilities', 22, 196, 468, 122, 258, 311, [
            ['lblfinancialLeaseCaption', 37, 'Financial Lease', 26, 'lblFinancialLeaseAmt', 26],
            ['lblLongTermLoanCaption', 21, 'Long Term Loans', 48, 'lblongTermLoansAmt', 49],
            ['lblTaxationCaption', 17, 'Taxation', 70, 'lblTaxationAmt', 71]],
            91, ['Total Non Curr Liabilities', 258, 'lblToNonCurrLiabilitiesAmt', 309, 94]],
        ['groupBox4', 'Current Liabilities', 22, 319, 468, 276, 258, 312, [
            ['lblShortTermBorrowingCaption', 22, 'Short Term Borrowings', 32, 'lblShorttermBorrowingAmt', 32],
            ['lblSalariesPayableCaption', 23, 'Salaries Payables', 55, 'lblSalariesPayablesAmt', 55],
            ['lblCreditorSuppCaption', 24, 'Crediters Suppliers', 78, 'lblCreditorsSupplierAmt', 78],
            ['lblTradeCreditorServiceCaption', 25, 'Trade Creditors -Service', 100, 'lblTradeCreditorsServiceAmt', 100],
            ['lblOtherCreditorCaption', 27, 'Other Creditors', 123, 'lblOtherCreditorsAmt', 123],
            ['lbltradeOthPayableCaption', 28, 'Trade Others Payables', 146, 'lblOtherPayablesAmt', 146],
            ['lblLoanAndAdvanceCaption', 16, 'Loan And Advances', 169, 'lblLoanAndAdvancesAmt', 169],
            ['lblCreditorStoreCaption', 26, 'Creditor Store', 192, 'lblCreditorStoreAmt', 192],
            ['lblAccuredLiabiltyCaption', 38, 'Accrued Liabilty', 216, 'lblAccuredLiabiltyAmt', 216]],
            245, ['Total Current Liabilities', 258, 'lblToCurrLiabilitiesAmt', 309, 249]],
        ['groupBox6', 'Non Current Assets', 496, 5, 408, 185, 199, 255, [
            ['lblIntangibleassetCaption', 10, 'Intangible Assets', 31, 'lblIntangibleAssestAmt', 31],
            ['lblLongTermInvestCaption', 31, 'Long Term Investment', 56, 'lblAsLongTrmInvestmentAmt', 56],
            ['lblPropPlantEquipCaption', 30, 'Property, Plant  Equipment', 81, 'lblAsPropertyPlantAmt', 81],
            ['lblCWIPCaption', 11, 'Capital Work In Progress', 106, 'lblAcCWIPAmt', 106]],
            129, ['Total Non Current Assest', 210, 'lblToNonCurrAssestsAmt', 253, 131]],
        ['groupBox5', 'Current assets', 496, 196, 408, 399, 199, 255, [
            ['lblCashBankBlncCaption', 20, 'Cash and Bank Balances', 26, 'lblCashBankAmt', 26],
            ['lblAdvancePrePaymCaption', 19, 'Advances & PrePayments', 48, 'lblAdvPrePaymentsAmt', 49],
            ['lblStockTradeCaption', 12, 'Stock - In -Trade', 70, 'lblStockInTradeAmt', 71],
            ['lblAdvanceOtherCaption', 18, 'Advance Others', 93, 'lblAsAdvancesOtherAmt', 94],
            ['lblTradeLocalCaption', 13, 'Trade Debtors -Local', 115, 'lblTradeDebitorsLocalAmt', 116],
            ['lblTradeExportCaption', 14, 'Trade Debtors -Export', 138, 'lblTradeDebitorExportAmt', 139],
            ['lblSundryDebitorCaption', 15, 'Sundry Debitors', 159, 'lblSundaryDebitorAmt', 160],
            ['lblStoreSparePartsCaption', 39, 'Store Spare Parts and Loose Tools', 183, 'lblStoreSpareAmt', 184, true]],
            318, ['Total Current Assests', 210, 'lblToCurrAssestsAmt', 253, 321]]
    ];

    function build() {
        var h = '';
        GB.forEach(function (g) {
            h += '<div class="sgb" id="' + g[0] + '" style="left:' + g[2] + 'px;top:' + (g[3] + 4) + 'px;width:' + g[4] + 'px;height:' + g[5] + 'px">'
               + '<span class="gb-title">' + H.esc(g[1]) + '</span>';
            g[8].forEach(function (r) {
                h += '<div class="cap' + (r[6] ? ' tall' : '') + '" id="' + r[0] + '" data-note="' + r[1] + '" style="left:' + (r[0] === 'lblStoreSparePartsCaption' ? 6 : (g[0] === 'groupBox4' ? 4 : 6))
                   + 'px;top:' + r[3] + 'px;width:' + g[6] + 'px' + (r[6] ? ';height:38px' : '') + '">' + H.esc(r[2]) + '</div>'
                   + '<div class="amt" id="' + r[4] + '" style="left:' + g[7] + 'px;top:' + r[5] + 'px">0</div>';
            });
            var t = g[10];
            h += '<div class="ln" style="left:4px;top:' + g[9] + 'px;width:' + (g[4] - 10) + 'px"></div>'
               + '<div class="tl" style="left:6px;top:' + t[4] + 'px;width:' + t[1] + 'px">' + H.esc(t[0]) + '</div>'
               + '<div class="ta" id="' + t[2] + '" style="left:' + t[3] + 'px;top:' + t[4] + 'px;width:150px">0</div>';
            h += '</div>';
        });
        /* panel7 (Teal, 0,600 904x33) */
        h += '<div class="grand" id="panel7" style="left:0;top:604px;width:904px;height:33px">'
           + '<span style="left:25px;width:255px">Total Capital and Liabilites</span>'
           + '<span class="v" id="lblToCapitalAndLiabilitiesAmt" style="left:324px;width:157px">0</span>'
           + '<span style="left:502px;width:216px">Total Assets</span>'
           + '<span class="v" id="lblTotalAssestsAmt" style="left:744px;width:156px">0</span></div>';
        H.$('panel6').innerHTML = h;
    }

    /* AccountNotefilter(caption.Text): dt.Select("AccountsNotes='" + Notes + "'") -> ItemArray[5] (AccountNoteId) -> GetBsBreakup */
    H.$('panel6').addEventListener('click', function (e) {
        var c = e.target.closest('.cap'); if (!c) return;
        if (c.id === 'lblNetPLCaption') { window.open('/accounts/reports/profit-and-loss', '_blank'); return; }   /* new frmProfitLossHararical(UserAccount).Show() */
        var r = dt.filter(function (x) { return String(H.ci(x, 'AccountsNotes')) === c.textContent; });
        if (!r.length) return;
        AccHBreakup.open({ status: 0, noteId: +H.ci(r[0], 'AccountNoteId') || 0, rows: dt, dec: dec,
                           fromDate: ctx.financialYearStart || '', toDate: H.$('todate').value });
    });

    function body() {
        return { toDate: H.$('todate').value, branchText: branch ? branch.text() : '', branchId: branch ? branch.id() : 0 };
    }
    function t(id, v) { H.$(id).textContent = H.both(v, dec); }

    /* BindDatainGrid (:261): the sums per AccountNoteId; the caption takes the row's AccountsNotes. dt.Rows.Clear() first;
       an empty result returns before any label is touched (the previous figures stay). */
    function bind(rows) {
        dt = rows || [];
        H.$('lblStatus').textContent = 'Records: ' + dt.length;
        if (!dt.length) return;
        var s = {}, cap = {};
        GB.forEach(function (g) { g[8].forEach(function (r) { if (r[1] !== 'PL') { s[r[1]] = 0; cap[r[1]] = r; } }); });
        var net = 0;
        dt.forEach(function (r) {
            if (H.toNum(H.ci(dt[0], 'NetProfitLoss')) !== 0) net = H.toNum(H.ci(dt[0], 'NetProfitLoss'));
            var n = +H.ci(r, 'AccountNoteId') || 0;
            if (cap[n]) { s[n] += H.toNum(H.ci(r, 'Amount')); H.$(cap[n][0]).textContent = H.ci(r, 'AccountsNotes') == null ? '' : String(H.ci(r, 'AccountsNotes')); }
        });
        Object.keys(cap).forEach(function (n) { t(cap[n][4], s[n]); });
        t('lblNetPLAmount', net);
        var ShareCapital = s[29], SharedDeposit = s[36], UnAppropriated = s[34], Reserves = s[35];
        var LongTermLoans = s[21], FinancialLease = s[37], Taxation = s[17];
        var ShortTermBorrowings = s[22], SaleriesPayables = s[23], CreditorsPaddyRice = s[24], TradeCreditorService = s[25], OtherCreditors = s[27],
            CreditorsAccrued = s[38], TradeOthersPayables = s[28], LoanAndAdvances = s[16], CreditorsStore = s[26];
        var IntangibleAssets = s[10], LongTermInvestment = s[31], PropertyPlantEquipment = s[30], CWIP = s[11];
        var CashandBank = s[20], AdvancesAndPrePayments = s[19], StockInTrade = s[12], SundryDebtors = s[15], StoresSpare = s[39], AdvanceOthers = s[18],
            TradeDebtorLocal = s[13], TradeDebtorsExport = s[14];
        var equity = ShareCapital + SharedDeposit + UnAppropriated + Reserves + net;
        var nonCurrLiab = LongTermLoans + FinancialLease + Taxation;
        var currLiab = ShortTermBorrowings + SaleriesPayables + CreditorsPaddyRice + TradeCreditorService + OtherCreditors + CreditorsAccrued + TradeOthersPayables + LoanAndAdvances + CreditorsStore;
        var nonCurrAssets = IntangibleAssets + (LongTermInvestment + (PropertyPlantEquipment + CWIP));
        var currAssets = CashandBank + AdvancesAndPrePayments + StockInTrade + SundryDebtors + StoresSpare + AdvanceOthers + TradeDebtorLocal + TradeDebtorsExport;
        t('lblToOwnerEquityAmt', equity);
        t('lblToNonCurrLiabilitiesAmt', nonCurrLiab);
        t('lblToCurrLiabilitiesAmt', currLiab);
        t('lblToCapitalAndLiabilitiesAmt', nonCurrLiab + currLiab + equity);
        t('lblToNonCurrAssestsAmt', nonCurrAssets);
        t('lblToCurrAssestsAmt', currAssets);
        t('lblTotalAssestsAmt', currAssets + nonCurrAssets);
    }

    function show() {
        var btn = H.$('btnshow'); btn.disabled = true;
        return H.api('POST', API + '/show', body()).then(bind)
            .catch(function (e) { H.box(e.message); })
            .then(function () { btn.disabled = false; });
    }
    /* toolStripButton1_Click - 153-BalanceSheetStatementRpt.rpt over SpAccounts_BalanceSheetFormatA_ForCrystal */
    function print153() {
        H.api('POST', API + '/print153', body()).then(function (rows) {
            H.printRows('153 - Balance Sheet', 'Browser output of SpAccounts_BalanceSheetFormatA_ForCrystal - not the Crystal layout.', Object.keys(rows[0]), rows,
                function (c, v) { return typeof v === 'number' && /Amount|Debit|Credit|Balance|NetProfit/i.test(c) ? H.both(v, dec) : (v == null ? '' : v); });
        }).catch(function (e) { H.box(e.message); });
    }

    build();
    /* todate: DateTimePicker default = today; reset() (Refresh) only focuses it */
    H.$('todate').value = H.today();
    H.$('btnshow').addEventListener('click', show);
    H.$('btnNew').addEventListener('click', function () { H.$('todate').focus(); });
    H.$('toolStripButton1').addEventListener('click', print153);

    /* BalanceSheet_Load: features 17/18, BranchFill when 17 is on (else the Branch label/combo are hidden), then BindDatainGrid */
    H.api('GET', API + '/init').then(function (c) {
        ctx = c; dec = c.amountDecimals || 0;
        if (!c.branchFeature) { H.$('lblBranch').classList.add('is-hidden'); H.$('cmbbranch').classList.add('is-hidden'); }
        else branch = H.branchCombo(H.$('cmbbranch'), c);
        H.$('todate').focus();
        return show();
    }).catch(function (e) { H.box(e.message); });
})();
</script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
