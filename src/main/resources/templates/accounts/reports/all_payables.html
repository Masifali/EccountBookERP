<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payables &amp; Receivables Reports</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#f0f0f0;font:13px 'Segoe UI',sans-serif}header{height:27px;display:flex;align-items:center;justify-content:space-between}h1{font-size:16px;margin:0 3px;color:#174378}#menu{height:66px;position:relative;flex:none}#menu button{position:absolute;height:26px;border:0;background:#174378;color:white;font:inherit;cursor:pointer}#menu button.active{background:#366aab}#forms{flex:1;min-height:0;position:relative}iframe{width:100%;height:100%;border:0;display:none}iframe.active{display:block}dialog{max-width:500px}@media(max-width:1050px){#menu{height:auto;display:flex;gap:4px;flex-wrap:wrap;padding:6px}#menu button{position:static!important;max-width:100%}}button{cursor:pointer}
#menu button{background:#0a6e6e;font: bold 13px Tahoma,sans-serif;text-align:left;padding:2px 6px}#menu button.active{outline:2px solid #174378;outline-offset:-2px;background:#0a6e6e}#menu button:disabled{cursor:wait;opacity:.65}#forms{background:#ababab}</style></head><body><header><h1>Payables &amp; Receivables Reports</h1><div><button id="shortcuts">ShortCut Keys</button><a href="/accounts/dashboard">Close</a></div></header><section id="menu">
<button data-key="1" data-route="trade-payables" style="left:10px;top:7px;width:159px">1001 Trade Creditors</button>
<button data-key="2" data-route="trade-receivables" style="left:10px;top:36px;width:159px">1002 Trade Debtors</button>
<button data-key="3" data-route="payables-payment-schedule" style="left:173px;top:7px;width:276px">1003 Payables &amp; Payment Schedule</button>
<button data-key="4" data-route="receivables-receipt-schedule" style="left:173px;top:36px;width:276px">1004 Receivables &amp; Receipts Schedule</button>
<button data-key="5" data-route="payables-aging" style="left:453px;top:7px;width:173px">1005 Payables Aging</button>
<button data-key="6" data-route="receivables-new" style="left:453px;top:36px;width:173px">1006 Receivables Aging</button>
<button data-key="7" data-route="receivables-by-due-dates" style="left:630px;top:7px;width:271px">1007 Receivables By Due Dates New</button>
<button data-key="8" data-route="due-date-analysis" style="left:630px;top:36px;width:271px">1008 Payables &amp; Receivable Forecast</button>
<button data-route="receivables-report" style="left:903px;top:6px;width:137px">1009 Receivables</button>
<button data-route="payables-report" style="left:903px;top:35px;width:137px">1010 Payables</button>
</section><main id="forms"></main><dialog id="help"><h2>Shortcut Keys</h2><p>Alt+1 through Alt+8 open the corresponding numbered report.<br>Ctrl+E / Escape: Close<br>Ctrl+Alt: Shortcut Keys<br>Enter: Next control</p><button id="closeHelp">Close</button></dialog>
<script>
const frames=new Map();function openReport(button){if(button.disabled)return;const route=button.dataset.route;let frame=frames.get(route);if(!frame){frame=document.createElement('iframe');frame.title=button.textContent;button.disabled=true;button.setAttribute('aria-busy','true');const done=()=>{button.disabled=false;button.removeAttribute('aria-busy')};frame.addEventListener('load',done,{once:true});frame.addEventListener('error',done,{once:true});frame.src='/accounts/reports/'+route;document.getElementById('forms').append(frame);frames.set(route,frame)}frames.forEach(f=>f.classList.toggle('active',f===frame));document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b===button))}
document.querySelectorAll('#menu button').forEach(button=>button.onclick=()=>openReport(button));document.getElementById('shortcuts').onclick=()=>document.getElementById('help').showModal();document.getElementById('closeHelp').onclick=()=>document.getElementById('help').close();document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey){e.preventDefault();document.getElementById('shortcuts').click()}else if(e.altKey&&/^[1-8]$/.test(e.key)){e.preventDefault();document.querySelector('[data-key="'+e.key+'"]').click()}else if(e.key==='Escape'||e.ctrlKey&&e.key.toLowerCase()==='e'){location.href='/accounts/dashboard'}});
</script></body></html>
