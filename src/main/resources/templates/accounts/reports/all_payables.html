<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payables &amp; Receivables Reports</title>
<link rel="stylesheet" href="/vendors/font-awesome/css/font-awesome.min.css">
<link rel="stylesheet" href="/build/css/countx_acc_rpt_f.css?v=20260930s">
<link rel="stylesheet" href="/build/css/countx_acc_rpt_pay.css?v=20260930s">
<link rel="stylesheet" href="/css/report-loading.css"><script src="/js/report-loading.js"></script>
<style>
body.accf { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.accf #menu { display: grid; grid-template-rows: auto auto; grid-auto-flow: column; gap: 3px 4px; padding: 4px 6px; background: var(--f-bg); border-bottom: 1px solid #99aab8; justify-content: start; }
.accf #menu .win-btn { justify-content: flex-start; }
.accf #menu .win-btn.active { background: var(--f-teal); color: #fff; border-color: var(--f-teal-dark); }
.accf #menu .win-btn:disabled { cursor: wait; }
.accf #forms { flex: 1; min-height: 0; position: relative; background: #fff; border-top: 1px solid #849ca8; }
.accf #forms iframe { width: 100%; height: 100%; border: 0; display: none; }
.accf #forms iframe.active { display: block; }
.accf dialog { max-width: 500px; }
</style>
</head>
<!--
  Screen 787 "Payables & Receivables Reports" - Architecture.WinApp.Account_Reports.frmPayablesReports: a hub whose buttons open
  the numbered reports inside the form (here one iframe per report, kept alive). Alt+1..Alt+8 open the numbered reports.
  R3 2026-09-30: Account Reports look (countx_acc_rpt_f.css); buttons, routes, keys and script unchanged.
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-th-large"></i> Payables &amp; Receivables Reports</span>
    <span><button type="button" class="win-btn" id="shortcuts" style="height:18px;">ShortCut Keys</button> <a href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a></span>
</div>
<section id="menu">
<button type="button" class="win-btn" data-key="1" data-route="trade-payables">1001 Trade Creditors</button>
<button type="button" class="win-btn" data-key="2" data-route="trade-receivables">1002 Trade Debtors</button>
<button type="button" class="win-btn" data-key="3" data-route="payables-payment-schedule">1003 Payables &amp; Payment Schedule</button>
<button type="button" class="win-btn" data-key="4" data-route="receivables-receipt-schedule">1004 Receivables &amp; Receipts Schedule</button>
<button type="button" class="win-btn" data-key="5" data-route="payables-aging">1005 Payables Aging</button>
<button type="button" class="win-btn" data-key="6" data-route="receivables-new">1006 Receivables Aging</button>
<button type="button" class="win-btn" data-key="7" data-route="receivables-by-due-dates">1007 Receivables By Due Dates New</button>
<button type="button" class="win-btn" data-key="8" data-route="due-date-analysis">1008 Payables &amp; Receivable Forecast</button>
<button type="button" class="win-btn" data-route="receivables-report">1009 Receivables</button>
<button type="button" class="win-btn" data-route="payables-report">1010 Payables</button>
</section>
<main id="forms"></main>
<dialog id="help"><h2>Shortcut Keys</h2><p>Alt+1 through Alt+8 open the corresponding numbered report.<br>Ctrl+E / Escape: Close<br>Ctrl+Alt: Shortcut Keys<br>Enter: Next control</p><button type="button" class="win-btn" id="closeHelp">Close</button></dialog>
<script>
const frames=new Map();function openReport(button){if(button.disabled)return;const route=button.dataset.route;let frame=frames.get(route);if(!frame){frame=document.createElement('iframe');frame.title=button.textContent;const endLoading=ReportLoading.begin();button.setAttribute('aria-busy','true');const done=()=>{endLoading();button.removeAttribute('aria-busy');setTimeout(()=>{if(frame.dataset.requestBusy==='true'){button.disabled=true;button.setAttribute('aria-busy','true')}},0)};frame.addEventListener('load',done,{once:true});frame.addEventListener('error',done,{once:true});frame.src='/accounts/reports/'+route;document.getElementById('forms').append(frame);frames.set(route,frame)}frames.forEach(f=>f.classList.toggle('active',f===frame));document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b===button))}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='report-request-state')return;for(const [route,frame] of frames){if(frame.contentWindow!==event.source)continue;const busy=event.data.busy===true;frame.dataset.requestBusy=String(busy);const button=document.querySelector('[data-route="'+route+'"]');button.disabled=busy;button.setAttribute('aria-busy',String(busy));}});
document.querySelectorAll('#menu button').forEach(button=>button.onclick=()=>openReport(button));document.getElementById('shortcuts').onclick=()=>document.getElementById('help').showModal();document.getElementById('closeHelp').onclick=()=>document.getElementById('help').close();document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey){e.preventDefault();document.getElementById('shortcuts').click()}else if(e.altKey&&/^[1-8]$/.test(e.key)){e.preventDefault();document.querySelector('[data-key="'+e.key+'"]').click()}else if(e.key==='Escape'||e.ctrlKey&&e.key.toLowerCase()==='e'){location.href='/accounts/dashboard'}});
</script>
</body>
</html>
