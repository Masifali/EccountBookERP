<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Payables and Receivables</title>
<link rel="stylesheet" href="/vendors/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendors/font-awesome/css/font-awesome.min.css">
<link rel="stylesheet" href="/build/css/countx_acc_rpt_f.css?v=20260930s">
<link rel="stylesheet" href="/build/css/countx_acc_rpt_grid_js.css?v=20260930s">
<link rel="stylesheet" href="/build/css/countx_desktop_combo.css?v=20260930s">
    <link rel="stylesheet" href="/build/css/countx_prod_combo.css?v=20261002gv">
<link rel="stylesheet" href="/css/report-loading.css"><script src="/js/report-loading.js"></script>

</head>
<!--
  Screen 61 Inventory Payables and Receivables = Architecture.WinApp.Account_Reports.InventoryPayablesandReceivables.
  Read-only; logic in /js/inventory-payables-receivables.js (InventoryPayablesReceivablesController).
  R4 2026-09-30: Account Reports look (countx_acc_rpt_f.css), searchable combos (countx_prod_combo.js), select2 removed.
-->
<body class="accf">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="win-title-bar">
    <span><i class="fa fa-cubes"></i> Inventory Payables &amp; Receivables</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" id="refresh"><i class="fa fa-refresh"></i> Refresh</button>
    <button type="button" class="win-btn" id="print" data-rpt="134-InventoryPayablesandReceivables.rpt"><i class="fa fa-print"></i> 134-Print</button>
    <button type="button" class="win-btn" id="print134A" data-rpt="134A-InventoryPayablesandReceivables.rpt"><i class="fa fa-print"></i> 134A-Print</button>
    <a class="win-btn" href="/accounts/dashboard"><i class="fa fa-times"></i> Close</a>
</div>
<div class="win-header-panel">
    <span>Inventory Payables &amp; Receivables</span>
    <label id="branchField">Branch <span style="display:inline-block;width:203px;color:#000"><select id="branches" class="inp" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></span></label>
</div>

<section id="filters" class="filters">
    <div class="gb">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 60px 125px 90px 190px 72px 210px 120px 160px auto;">
            <span class="lbl">Date From</span><input type="date" id="fromDate" class="inp">
            <span class="lbl">Custom Group</span><select id="customGroup" class="inp" data-dtcombo="single" data-dtcombo-caption="Custom Group"></select>
            <span class="lbl">TradeType</span><select id="tradeTypes" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="TradeType"></select>
            <span class="radio-col" style="grid-row: span 2">
                <label class="chk"><input type="radio" name="tran" value="1" checked> Purchase</label>
                <label class="chk"><input type="radio" name="tran" value="2"> Sale</label>
                <label class="chk"><input type="radio" name="tran" value="3"> Purchase &amp; Sale</label>
            </span>
            <span class="radio-col" style="grid-row: span 2">
                <label class="chk"><input type="checkbox" id="payables" checked> Payables</label>
                <label class="chk"><input type="checkbox" id="receivables"> Receivables</label>
                <label class="chk"><input type="checkbox" id="approved"> Approved Transactions</label>
            </span>
            <span style="grid-row: span 2; align-self:center"><button type="button" id="show" class="win-btn-show">Show</button></span>

            <span class="lbl">Date To</span><input type="date" id="toDate" class="inp">
            <span class="lbl">Inventory Group</span><select id="inventoryGroups" class="inp" multiple data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Inventory Group"></select>

            <span style="grid-column: 5; grid-row: 3; line-height:11px" class="lbl">Closing Debit<br>&amp; Credit</span>
            <span style="grid-column: 6 / 8; grid-row: 3; display:flex; gap:4px"><input type="number" id="clDebit" class="inp" step="any" value="0" style="width:120px"><input type="number" id="clCredit" class="inp" step="any" value="0" style="width:120px"></span>
        </div>
    </div>
</section>
<div class="grid-caption gridbar"><span>Filtered Records</span><input id="search" placeholder="Filter records" aria-label="Filter records"></div>
<div class="grid-wrap"><table data-gridbar="InventoryPayablesReceivables:results" id="results" class="wg"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
<div id="status" class="status-bar" role="status"></div>
<script src="/vendors/jquery/dist/jquery.min.js"></script>
<script src="/build/js/countx_prod_combo.js?v=20261002gv"></script>
<script src="/js/report-decimal.js"></script>
<script src="/js/inventory-payables-receivables.js?v=20261002gv"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
