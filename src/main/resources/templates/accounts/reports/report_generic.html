<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 24px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 12px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -15px -15px 15px -15px;
        }

        .erp-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            background: #eceff1;
            padding: 6px;
            border: 1px solid #cfd8dc;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
        }

        .erp-form-group {
            margin-bottom: 10px;
        }

        .erp-form-group label {
            font-weight: bold;
            color: #37474f;
            margin-bottom: 3px;
            display: block;
        }

        .erp-input {
            width: 100%;
            height: 28px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid #b0bec5;
            border-radius: 2px;
        }

        .erp-input:focus {
            border-color: #00796B;
            outline: none;
            box-shadow: 0 0 4px rgba(0,121,107,0.4);
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: 600;
            border: 1px solid #004d40;
            text-align: left;
        }

        .erp-table td {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
        }

        .erp-table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-arrow-right" style="margin-right:8px;"></i> Golden Ace ERP</div>
        <div class="header-item"><i class="fa fa-user" style="margin-right:6px;"></i> Numan Rasheed (Admin)</div>
        <div class="header-item" style="margin-left:auto; color:#ffeb3b;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <i class="fa fa-window-maximize" style="margin-right: 6px;"></i>
        <span>Screens &gt; Accounts &gt; Reports &gt; <strong th:text="${moduleTitle}">Report</strong></span>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header">
                <span th:text="${moduleTitle}"><i class="fa fa-file-text-o"></i> Account Report</span>
                <span style="font-size:12px; font-weight:normal; background:#004d40; padding:2px 8px; border-radius:2px;">Reporting Engine</span>
            </div>

            <!-- Filter Controls -->
            <div class="row" style="margin-bottom:15px; background:#f5f5f5; padding:10px; border:1px solid #e0e0e0; margin-left:0; margin-right:0;">
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>From Date</label>
                    <input type="date" class="erp-input" value="2026-09-01"/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>To Date</label>
                    <input type="date" class="erp-input" value="2026-09-07"/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Account Filter</label>
                    <input type="text" class="erp-input" placeholder="All Accounts..."/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group" style="display:flex; align-items:flex-end; gap:6px;">
                    <button type="button" class="btn-erp" style="background:#00796B; color:white; height:28px;"><i class="fa fa-search"></i> Generate</button>
                    <button type="button" class="btn-erp" style="height:28px;"><i class="fa fa-file-pdf-o"></i> Export PDF</button>
                    <button type="button" class="btn-erp" style="height:28px;"><i class="fa fa-file-excel-o"></i> Excel</button>
                </div>
            </div>

            <!-- Report Live Preview Grid -->
            <div style="overflow-x:auto;">
                <table class="erp-table">
                    <thead>
                        <tr>
                            <th>Account Code</th>
                            <th>Account Title</th>
                            <th>Opening Balance</th>
                            <th>Debit (PKR)</th>
                            <th>Credit (PKR)</th>
                            <th>Closing Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" style="text-align:center; color:#78909c; padding:20px;">
                                <i class="fa fa-info-circle" style="font-size:18px;"></i> Select report date range and click <strong>Generate</strong> to view live report data.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
