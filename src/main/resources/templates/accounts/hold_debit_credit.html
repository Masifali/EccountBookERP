<!--

  (ClientSize 436x593, WindowState Maximized, BackColor White). 1:1 port of InitializeComponent:
    toolStrip1 (0,0) 25   New | Save | Update (Verdana 9.75; Update hidden until a row is loaded)
    panel1     Dock Top 261
       panel3 Dock Top 28 Teal, label4 "Accounts Hold For Debit / Credit" (4,3) Tahoma 12 bold white

       checkBoxDebit "Debit Hold" (269,39) TabIndex 5; checkBoxCredit "Credit Hold" (269,66) TabIndex 6 (Segoe UI Semibold 9.75 bold)
       label1 "Debit Remarks" (12,94) 412x17; txtDebitRemarks (12,114) 412x42 multiline Verdana 9.75
       label3 "Credit Remarks" (12,159) 412x17; txtCreditRemarks (12,179) 412x42 multiline
       btnCancel (269,227) TabIndex 618, btnSavef (349,227) 617, btnUpdatef (348,227) 619 (hidden): 75x28 Teal, flat, Tahoma 9.75 bold white
       tab order: combo 4, debit 5, credit 6, Save 617, Cancel 618, Update 619, txtCredit/txtDebit 621
    panel2     Dock Top 28 Teal: label6 "History" (4,3) Tahoma 12 bold white; ctrlGrdBar (right, 43x28; FormName=null, MyGrid=null)
    grdHistory Janus GridEX Dock Fill, Verdana 8.25, Office2007, filter row, RecordNavigator, double-click loads the row.
  API: /accounts/hold_debit_credit/{init,history,{id},save} (AccountsHoldDebitCreditController).

    #panel2 { flex: 0 0 28px; height: 28px; position: relative; background: var(--teal); }

                     overflow: hidden; text-overflow: ellipsis; cursor: pointer;

    #grdHistory tr.flt input { width: 100%; height: 18px; box-sizing: border-box; border: 0; background: transparent; font: 11px Verdana, sans-serif; padding: 0 3px; }
    #grdHistory td { height: 20px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

<script th:src="@{/vendors/jquery/dist/jquery.min.js}" src="/vendors/jquery/dist/jquery.min.js"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}" src="/build/js/countx_prod_combo.js"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}" src="/build/js/countx_grid_bar.js?v=20261007-gridbar-flow"></script>
<script>
(function ($) {
    'use strict';
    var API = '/accounts/hold_debit_credit';
    var COLS = ['AccountTitle', 'CreditHoldStatus', 'CreditHoldReason', 'DebitHoldStatus', 'DebitHoldReason', 'EntryUser', 'EntryDate', 'ModifyUser', 'ModifyDate'];
    var rights = { save: false, update: false };
    var recId = 0;                     // public int RecId
    var rows = [], view = [], cur = -1, sortCol = null, sortDir = 1;
    var busyNow = false;

    function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function getJson(url) { return $.ajax({ url: url, type: 'GET', dataType: 'json', cache: false }); }
    function failText(x) {
        try { var j = x.responseJSON || JSON.parse(x.responseText); if (j && j.message) return j.message; } catch (e) { /* ignore */ }
        return x && x.status ? 'HTTP ' + x.status : 'Request failed';
    }
    function focusCombo() { var $i = $('#cmbWrap .dtcombo-input'); if ($i.length) $i.focus(); else $('#CmbAccountTitle').focus(); }

    /* Save / Update visibility - btnSave+btnSavef vs btnUpdate+btnUpdatef; rights gate the enabled state */
    function showSave(isSave) {
        $('#btnSave, #btnSavef').toggleClass('hidden', !isSave);
        $('#btnUpdate, #btnUpdatef').toggleClass('hidden', isSave);
        applyRights();
    }
    function applyRights() {
        $('#btnSave, #btnSavef').prop('disabled', !rights.save || busyNow);
        $('#btnUpdate, #btnUpdatef').prop('disabled', !rights.update || busyNow);
    }
    function busy(on) {
        busyNow = on;
        $('#frm').toggleClass('is-busy', on);
        $('#btnSave, #btnSavef, #btnUpdate, #btnUpdatef').toggleClass('btn-busy', on);
        applyRights();
    }

    /* checkBoxDebit_CheckedChanged / checkBoxCredit_CheckedChanged */
    function debitChanged() {
        if ($('#checkBoxDebit').prop('checked')) $('#txtDebitRemarks').prop('disabled', false);
        else $('#txtDebitRemarks').prop('disabled', true).val('');
    }
    function creditChanged() {
        if ($('#checkBoxCredit').prop('checked')) $('#txtCreditRemarks').prop('disabled', false);
        else $('#txtCreditRemarks').prop('disabled', true).val('');
    }

    /* Reset() */
    function reset() {
        $('#CmbAccountTitle').val('0').trigger('change');
        if (window.DesktopCombo && window.DesktopCombo.refresh) window.DesktopCombo.refresh();
        $('#txtCreditRemarks, #txtDebitRemarks').val('');
        showSave(true);
        $('#txtDebitRemarks, #txtCreditRemarks').prop('disabled', true);
        $('#checkBoxDebit, #checkBoxCredit').prop('checked', false);
        gridHistoryFill();
        focusCombo();
    }

    /* ---------------------------------------------------------------- GridHistoryfill */
    function gridHistoryFill() {
        return getJson(API + '/history').done(function (r) {
            if (!r || r.success === false) { alert((r && r.message) || 'Error'); return; }
            /* if (lst.Rows.Count > 0) { grdHistory.DataSource = dt ... } - an empty result leaves the grid as it was */
            if ((r.rows || []).length > 0) { rows = r.rows; applyView(); }
        }).fail(function (x) { alert(failText(x)); });
    }
    function applyView() {
        var f = {};
        $('#grdHistory tr.flt input').each(function () { var v = $.trim($(this).val()).toLowerCase(); if (v) f[$(this).data('f')] = v; });
        view = rows.filter(function (r) {
            for (var k in f) if (String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(f[k]) < 0) return false;
            return true;
        });
        if (sortCol) view.sort(function (a, b) {
            var x = String(a[sortCol] == null ? '' : a[sortCol]), y = String(b[sortCol] == null ? '' : b[sortCol]);
            return x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }) * sortDir;
        });
        cur = view.length ? Math.min(Math.max(cur, 0), view.length - 1) : -1;
        render();
    }
    function render() {
        var $b = $('#grdBody').empty();
        if (!view.length) $b.append('<tr><td class="empty" colspan="' + COLS.length + '">No records</td></tr>');
        view.forEach(function (r, i) {
            var tr = '<tr data-i="' + i + '"' + (i === cur ? ' class="cur"' : '') + '>';
            COLS.forEach(function (c) { tr += '<td title="' + esc(r[c]) + '">' + esc(r[c]) + '</td>'; });
            $b.append(tr + '</tr>');
        });
        nav();
    }
    function setCur(i) {
        if (!view.length) { cur = -1; nav(); return; }
        cur = Math.max(0, Math.min(view.length - 1, i));
        var $tr = $('#grdBody tr').removeClass('cur').filter('[data-i="' + cur + '"]').addClass('cur');
        if ($tr.length) $tr[0].scrollIntoView({ block: 'nearest' });
        nav();
    }
    function nav() {
        var n = view.length;
        $('#recNavText').text('Record ' + (cur >= 0 ? cur + 1 : 0) + ' of ' + n);
        $('#recNav [data-nav=first], #recNav [data-nav=prev]').prop('disabled', cur <= 0);
        $('#recNav [data-nav=next], #recNav [data-nav=last]').prop('disabled', cur < 0 || cur >= n - 1);
    }

    /* ---------------------------------------------------------------- ReadById (grdHistory_DoubleClick) */
    function readById(id) {
        recId = id;
        getJson(API + '/' + id).done(function (r) {
            if (!r || r.success === false) { alert((r && r.message) || 'Error'); return; }
            var o = r.row;
            $('#CmbAccountTitle').val(String(o.CoaAccountId)).trigger('change');
            if (window.DesktopCombo && window.DesktopCombo.refresh) window.DesktopCombo.refresh();
            $('#checkBoxCredit').prop('checked', !!o.CreditHoldStatus); creditChanged();
            $('#checkBoxDebit').prop('checked', !!o.DebitHoldStatus); debitChanged();
            $('#txtCreditRemarks').val(o.CreditHoldReason || '');
            $('#txtDebitRemarks').val(o.DebitHoldReason || '');
            showSave(false);
        }).fail(function (x) { alert(failText(x)); });
    }

    /* ---------------------------------------------------------------- Insert() */
    function formValidation() {
        if (!($('#CmbAccountTitle').val() && $('#CmbAccountTitle').val() !== '0')) {
            alert("Please enter a value for 'Account Title'."); focusCombo(); return false;
        }
        if ($('#txtDebitRemarks').val() === '' && $('#checkBoxDebit').prop('checked')) {
            alert('Remarks / Reason Required For Holding Debit Entry.'); $('#txtDebitRemarks').focus(); return false;
        }
        if ($('#txtCreditRemarks').val() === '' && $('#checkBoxCredit').prop('checked')) {
            alert('Remarks / Reason Required For Holding Credit Entry.'); $('#txtCreditRemarks').focus(); return false;
        }
        return true;
    }
    function insert() {
        if (busyNow) return;
        if (!formValidation()) return;
        if (recId > 0) { if (!confirm('Are you sure to Update Record?')) return; }
        else if (!confirm('Are you sure to Save Record?')) return;
        busy(true);
        $.ajax({ url: API + '/save', type: 'POST', contentType: 'application/json', dataType: 'json',
                 data: JSON.stringify({ id: recId, coaAccountId: parseInt($('#CmbAccountTitle').val(), 10) || 0,
                     debitHold: $('#checkBoxDebit').prop('checked'), creditHold: $('#checkBoxCredit').prop('checked'),
                     debitReason: $('#txtDebitRemarks').val(), creditReason: $('#txtCreditRemarks').val() }) })
            .done(function (r) {
                if (!r || r.success === false) { alert((r && r.message) || 'Error'); return; }
                alert(r.message);
                reset();
            })
            .fail(function (x) { alert(failText(x)); })
            .always(function () { busy(false); });
    }
    function doSave() { recId = 0; insert(); }      /* btnSave_Click / btnSavef_Click: RecId = 0; Insert() */
    function doUpdate() { insert(); }               /* btnUpdate_Click / btnUpdatef_Click */

    /* ---------------------------------------------------------------- wiring */
    /* Tab order by TabIndex: combo 4, Debit 5, Credit 6, Save 617, Cancel 618, Update 619, remarks 621 (the combo's native select is hidden) */
    var ORDER = ['CmbAccountTitle', 'checkBoxDebit', 'checkBoxCredit', 'btnSavef', 'btnCancel', 'btnUpdatef', 'txtDebitRemarks', 'txtCreditRemarks'];
    function tabOrder() {
        return ORDER.map(function (id) { return document.getElementById(id); })
            .filter(function (el) { return el && !el.disabled && !$(el).hasClass('hidden') && !$(el).closest('.hidden').length; });
    }
    $(function () {
        $('#btnNew').on('click', function () { reset(); });
        $('#btnSave, #btnSavef').on('click', doSave);
        $('#btnUpdate, #btnUpdatef').on('click', doUpdate);
        $('#btnCancel').on('click', function () { window.location.href = '/accounts/dashboard'; });       /* Close() */
        $('#checkBoxDebit').on('change', debitChanged);
        $('#checkBoxCredit').on('change', creditChanged);

        $(document).on('keydown', function (e) {
            if (e.altKey && !e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); $('#btnNew').click(); return; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); if (!$('#btnSave').hasClass('hidden') && !$('#btnSave').prop('disabled')) doSave(); return; }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); if (!$('#btnUpdatef').hasClass('hidden') && !$('#btnUpdatef').prop('disabled')) doUpdate(); return; }
            if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
                /* btnn() throws NotImplementedException -> catch -> MessageBox.Show(ex.Message) */
                e.preventDefault(); alert('The method or operation is not implemented.'); return;
            }
            /* Return -> SendKeys "{TAB}" (KeyPreview: also inside the remarks boxes, which do not AcceptsReturn; not on a button) */
            if (e.key === 'Enter' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
                var t = e.target, tag = (t.tagName || '').toLowerCase();
                if (tag === 'button' || $(t).closest('#recNav, tr.flt').length) return;
                var list = tabOrder(), cmb = $('#CmbAccountTitle')[0];
                var cur = $(t).hasClass('dtcombo-input') || $(t).closest('#cmbWrap').length ? cmb : t;
                var i = list.indexOf(cur);
                if (i >= 0) {
                    e.preventDefault();
                    setTimeout(function () { var n = list[(i + 1) % list.length]; if (n === cmb) focusCombo(); else n.focus(); }, 0);
                }
            }
        });

        $('#grdHistory thead th').on('click', function () {
            var c = $(this).data('col'); if (sortCol === c) sortDir = -sortDir; else { sortCol = c; sortDir = 1; }
            applyView();
        });
        $('#grdHistory tr.flt input').on('input', function () { cur = 0; applyView(); });
        $('#grdBody').on('click', 'tr[data-i]', function () { setCur(+$(this).data('i')); })
            .on('dblclick', 'tr[data-i]', function () {
                var r = view[+$(this).data('i')]; if (r) readById(r.Id);
            });
        $('#recNav').on('click', 'button', function () {
            var a = $(this).data('nav');
            setCur(a === 'first' ? 0 : a === 'last' ? view.length - 1 : a === 'prev' ? cur - 1 : cur + 1);
        });

        /* AccountsHoldForDebitOrCredit_Load */
        showSave(true);
        getJson(API + '/init').done(function (r) {
            if (!r || r.success === false) { alert((r && r.message) || 'Error'); return; }
            rights = r.rights || rights; applyRights();
            var h = '<option value="0"></option>';
            (r.accounts || []).forEach(function (a) { h += '<option value="' + esc(a.Id) + '">' + esc(a.AccountTitle) + '</option>'; });
            $('#CmbAccountTitle').html(h).val('0');
            if (window.DesktopCombo && window.DesktopCombo.refresh) window.DesktopCombo.refresh();
            focusCombo();
        }).fail(function (x) { alert(failText(x)); });
        gridHistoryFill();
    });
})(window.jQuery);
</script>
</body>
</html>
