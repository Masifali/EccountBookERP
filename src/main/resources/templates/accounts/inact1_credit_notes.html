<script>
(function () {
    'use strict';
    var API = '/api/accounts/credit-notes';
    var RecId = 0, saving = false;     /* RecId stays 0: the form's ReadById is never called */

    function esc(s) { return AccF.esc(s == null ? '' : s); }
    function busy(on) { $('#waitForm').prop('hidden', !on); $('#btnnew,#btnsave,#btnUpdate,#btnShowDetail').prop('disabled', on); }
    function call(method, path, body) {
        return new Promise(function (resolve, reject) {
            $.ajax({ url: API + path, type: method, contentType: 'application/json', dataType: 'json', headers: (function () { var t = $('meta[name="_csrf"]').attr('content'), h = $('meta[name="_csrf_header"]').attr('content'), o = {}; if (t && h) o[h] = t; return o; })(), data: body ? JSON.stringify(body) : undefined })
                .done(function (r) { if (r && r.success === false) reject(new Error(r.message)); else resolve(r.data); })
                .fail(function (x) { reject(new Error((x.responseJSON && x.responseJSON.message) || ('HTTP ' + x.status))); });
        });
    }
    function today() { var d = new Date(), m = d.getMonth() + 1, k = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (k < 10 ? '0' : '') + k; }
    function n0(v) { var x = parseFloat(v); return isNaN(x) ? '' : Math.round(x).toLocaleString('en-US'); }     /* FormatString "0,0" */
    function nT(v) { return (Math.round(v * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 }); }  /* TotalFormatString "#,##0.##" */

    /* ---------- generic Janus-like grid: columns [{k, cap, hidden, num, fmt, total, edit}] ---------- */
    function Grid(ids, cols, opts) {
        var self = this; self.rows = []; self.shown = []; self.filters = {}; self.cur = -1; self.cols = cols; self.ids = ids; self.opts = opts || {};
        var vis = cols.filter(function (c) { return !c.hidden; });
        self.vis = vis;
        $(ids.head).html(vis.map(function (c) { return '<th' + (c.w ? ' style="width:' + c.w + 'px"' : '') + '>' + esc(c.cap || c.k) + '</th>'; }).join(''));
        $(ids.filt).html(vis.map(function (c) { return '<td>' + (c.button ? '' : '<input data-f="' + c.k + '">') + '</td>'; }).join(''));
        $(ids.filt).on('input', 'input', function () { self.filters[$(this).data('f')] = this.value; self.cur = -1; self.render(); });
        $(ids.body).on('focus click', 'tr', function () {
            self.cur = $(this).data('i'); $(ids.body).find('tr').removeClass('cur'); $(this).addClass('cur');
            $(ids.nav).text('Record ' + (self.cur + 1) + ' of ' + self.shown.length);
        });
        if (self.opts.onEdit) $(ids.body).on('input', 'input[data-edit]', function () { self.opts.onEdit(self.shown[$(this).data('edit')], $(this).data('col'), this.value); });
    }
    Grid.prototype.set = function (rows) { this.rows = rows; this.filters = {}; $(this.ids.filt).find('input').val(''); this.cur = -1; this.render(); };
    Grid.prototype.render = function () {
        var self = this;
        self.shown = self.rows.filter(function (r) {
            return self.vis.every(function (c) {
                if (c.button) return true;
                var t = (self.filters[c.k] || '').toLowerCase(); return !t || String(r[c.k] == null ? '' : r[c.k]).toLowerCase().indexOf(t) >= 0;
            });
        });
        var h = [];
        self.shown.forEach(function (r, i) {
            h.push('<tr data-i="' + i + '"' + (i === self.cur ? ' class="cur"' : '') + '>' + self.vis.map(function (c) {
                if (c.button) return '<td style="text-align:center"><button type="button" class="btn-detail" data-i="' + i + '">' + esc(c.cap) + '</button></td>';
                if (c.edit) return '<td class="ed"><input data-edit="' + i + '" data-col="' + c.k + '" value="' + esc(r[c.k]) + '"></td>';
                var v = r[c.k]; if (c.fmt === '0,0') v = n0(v);
                return '<td' + (c.num ? ' class="num"' : '') + '>' + esc(v) + '</td>';
            }).join('') + '</tr>');
        });
        $(self.ids.body).html(h.join(''));
        if (!self.rows.length || !self.vis.some(function (c) { return c.total; })) $(self.ids.foot).html('');
        else $(self.ids.foot).html(self.vis.map(function (c, i) {
            if (!c.total) return '<td>' + (i === 0 ? self.shown.length + ' records' : '') + '</td>';
            var t = 0; self.shown.forEach(function (r) { var x = parseFloat(r[c.k]); if (!isNaN(x)) t += x; });
            return '<td class="num">' + nT(t) + '</td>';
        }).join(''));
        $(self.ids.nav).text('Record ' + (self.shown.length ? Math.max(self.cur, 0) + 1 : 0) + ' of ' + self.shown.length);
    };

    /* grdDetails columns (grdSettings): ids hidden; totals "#,##0.##" on the five Total* columns; RemarksDetail is the only editable column */
    var det = new Grid({ head: '#grdHead', filt: '#grdFilt', body: '#grdBody', foot: '#grdFoot', nav: '#navText' }, [
        { k: 'PolicyId', hidden: 1 }, { k: 'SupplierCustomerId', hidden: 1 }, { k: 'SupplierCustomer', w: 200 }, { k: 'ItemId', hidden: 1 }, { k: 'ItemName', w: 160 },
        { k: 'TargetBaseTypeId', hidden: 1 }, { k: 'TargetBaseType', w: 110 }, { k: 'TargetFrom', w: 100 }, { k: 'TargetTo', w: 100 },
        { k: 'TargetRangeFrom', w: 100 }, { k: 'TargetRangeTo', w: 100 }, { k: 'IncentiveTypeId', hidden: 1 }, { k: 'IncentiveType', w: 110 },
        { k: 'TotalInvoices', num: 1, fmt: '0,0', total: 1, w: 90 }, { k: 'TotalQty', num: 1, fmt: '0,0', total: 1, w: 90 }, { k: 'TotalWeight', num: 1, fmt: '0,0', total: 1, w: 90 },
        { k: 'TotalItemAmount', num: 1, fmt: '0,0', total: 1, w: 110 }, { k: 'TotalNetAmount', num: 1, fmt: '0,0', total: 1, w: 110 }, { k: 'AvgRate', num: 1, fmt: '0,0', w: 80 },
        { k: 'IncentiveRate', num: 1, w: 90 }, { k: 'IncentiveCalcOnId', hidden: 1 }, { k: 'IncentiveCalcOn', w: 110 }, { k: 'IncentiveAmount', num: 1, w: 100 },
        { k: 'RemarksDetail', edit: 1, w: 200 }
    ], { onEdit: function (r, c, v) { r[c] = v; } });
    var hist = new Grid({ head: '#hHead', filt: '#hFilt', body: '#hBody', foot: '#hFoot', nav: '#hNav' }, [
        { k: 'Id', hidden: 1 }, { k: 'DocDate' }, { k: 'DocNo' }, { k: 'PeriodFrom' }, { k: 'PeriodTo' }, { k: 'DebitAccount' }, { k: 'IncentiveAmount', num: 1 }, { k: 'Remarks' }, { k: 'EntryUser' },
        { k: 'Detail', cap: 'Detail', button: 1, w: 50 }
    ]);
    var hdet = new Grid({ head: '#dHead', filt: '#dFilt', body: '#dBody', foot: '#dFoot', nav: '#dNav' }, [
        { k: 'SupplierCustomer' }, { k: 'TargetBaseType' }, { k: 'TargetFrom' }, { k: 'TargetTo' }, { k: 'TargetAchieved' }, { k: 'IncentiveType' },
        { k: 'IncentiveRate', num: 1 }, { k: 'IncentiveCalcOn' }, { k: 'IncentiveAmount', num: 1, total: 1 }, { k: 'RemarksDetail' }
    ]);
    det.render(); hist.render(); hdet.render();

    function showSave(on) { $('#btnsave').prop('hidden', !on); $('#btnUpdate').prop('hidden', on); }

    /* GenerateCode: a code > 0 fills the box, nothing otherwise */
    function generateCode() {
        return call('GET', '/generate-code').then(function (n) { if (n > 0) $('#txtDocNo').val(n); }).catch(function (e) { alert(e.message); });
    }

    /* Reset */
    function reset() {
        $('#txtDocNo').val('');
        $('#txtDocDate,#txtFromDate,#txtToDate').val(today());
        $('#cmbDebitAccount').val('').trigger('change');
        $('#txtRemarks').val('');
        RecId = 0; det.set([]); showSave(true);
        $('#txtDocDate').focus();
        return generateCode();
    }

    /* FrmExportSalesContract_Load */
    function load() {
        $('#txtDocDate,#txtFromDate,#txtToDate').val(today());
        busy(true);
        return call('GET', '/load').then(function (d) {
            if (d.docNo > 0) $('#txtDocNo').val(d.docNo);
            AccF.fillSelect('#cmbDebitAccount', d.debitAccounts || [], 'Id', 'AccountTitle', null);
            $('#cmbDebitAccount').val('').trigger('change');
            showSave(true);
        }).catch(function (e) { alert(e.message); }).then(function () { busy(false); $('#txtDocDate').focus(); });
    }

    /* btnShowDetail_Click: ignored while RecId > 0; an empty result clears the grid structure */
    $('#btnShowDetail').on('click', function () {
        if (RecId > 0) return;
        busy(true);
        call('GET', '/show-detail?fromDate=' + encodeURIComponent($('#txtFromDate').val()) + '&toDate=' + encodeURIComponent($('#txtToDate').val()))
            .then(function (rows) { det.set(rows || []); })
            .catch(function (e) { alert(e.message); })
            .then(function () { busy(false); });
    });

    /* btnsave_Click: confirm, FormValidation, per-row checks (server), Save */
    function save() {
        if (saving) return;
        if (!window.confirm(RecId === 0 ? 'Are you sure to Save?' : 'Are you sure to Update?')) return;
        if (!$('#txtDocNo').val()) { alert('DocNo Required'); $('#txtDocNo').focus(); return; }
        if (!$('#cmbDebitAccount').val()) { alert('Debit Account Required'); AccF.focus('#cmbDebitAccount'); return; }
        saving = true; busy(true);
        call('POST', '/save', { docNo: $('#txtDocNo').val(), docDate: $('#txtDocDate').val(), fromDate: $('#txtFromDate').val(), toDate: $('#txtToDate').val(),
            debitAccountId: $('#cmbDebitAccount').val(), remarks: $('#txtRemarks').val(), rows: det.rows })
            .then(function (m) { alert(m); return reset(); })
            .catch(function (e) { alert(e.message); })
            .then(function () { saving = false; busy(false); });
    }
    $('#btnsave').on('click', save);
    $('#btnUpdate').on('click', save);
    $('#btnnew').on('click', reset);

    /* tabControl1_SelectedIndexChanged: History -> HistoryFill (an empty result leaves the grid as it was) */
    function selectTab(id) {
        $('.tabs button').removeClass('on'); $('.tabs button[data-tab=' + id + ']').addClass('on');
        $('.page').removeClass('on'); $('#' + id).addClass('on');
        if (id === 'tabPage2') call('GET', '/history').then(function (rows) { if (rows && rows.length) hist.set(rows); }).catch(function (e) { alert(e.message); });
    }
    $('.tabs').on('click', 'button', function () { selectTab($(this).data('tab')); });

    /* DataGridHistory_ColumnButtonClick "Detail" */
    $('#hBody').on('click', 'button.btn-detail', function () {
        var r = hist.shown[$(this).data('i')];
        if (!r) return;
        call('GET', '/history-detail?id=' + encodeURIComponent(r.Id)).then(function (rows) { hdet.set(rows || []); }).catch(function (e) { alert(e.message); });
    });

    /* FrmExportSalesContract_KeyDown */
    function focusables() {
        return $('.page.on').find('input:not([type=hidden]):not(:disabled):not([readonly]):visible, button:not(:disabled):visible, .dtcombo-input:visible')
            .filter(function () { return !$(this).closest('.grid-scroll').length && !$(this).hasClass('ts-btn'); })
            .toArray().sort(function (a, b) { return (parseInt(a.tabIndex, 10) || 999) - (parseInt(b.tabIndex, 10) || 999); });
    }
    $(document).on('keydown', function (e) {
        if (e.key === 'Enter' && !$(e.target).is('button, textarea, a') && !$(e.target).closest('.grid-scroll').length && !e.defaultPrevented) {
            var list = focusables(), i = list.indexOf(e.target);
            if (i < 0) { var $w = $(e.target).closest('.dtcombo-wrap'); if ($w.length) i = list.indexOf($w.find('.dtcombo-input')[0]); }
            if (i >= 0) { e.preventDefault(); list[(i + 1) % list.length].focus(); }
        }
        if (e.ctrlKey && (e.key === 'n' || e.key === 'N') && $('#tabPage1').hasClass('on')) { e.preventDefault(); reset(); }
        if (e.ctrlKey && (e.key === 's' || e.key === 'S') && !$('#btnsave').prop('hidden') && !$('#btnsave').prop('disabled')) { e.preventDefault(); save(); }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U') && !$('#btnUpdate').prop('hidden') && !$('#btnUpdate').prop('disabled')) { e.preventDefault(); save(); }
        if (e.ctrlKey && (e.key === 't' || e.key === 'T')) { e.preventDefault(); selectTab($('#tabPage2').hasClass('on') ? 'tabPage1' : 'tabPage2'); }
        if ((e.ctrlKey && (e.key === 'e' || e.key === 'E')) || e.key === 'Escape') { e.preventDefault(); window.location.href = '/accounts/dashboard'; }
    });

    $(function () { load(); });
})();
</script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
