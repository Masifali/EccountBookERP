<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Voucher New</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_payment_receipt_voucher.css?v=20261002ga}">
    <link rel="stylesheet" th:href="@{/build/css/countx_expense_tax_voucher.css?v=20261007a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body class="prv-body">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
    <!-- Screen 862 (ExpenseVoucherNew): Architecture.WinApp.Account_Definition.VouchersWithTax.ExpenseVoucherNew, DocumentTypeId 26.
         The Form tab and the History tab are drawn by countx_expense_tax_voucher.js at the InitializeComponent
         coordinates; the tab strip is at the bottom as on the desktop (TabAlignment.Bottom). -->
    <div class="prv-caption">
        <span>Expense Voucher New</span>
        <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="prv-pages" id="prvPages">
        <div id="tabFormContent" class="prv-page prv-rec exn-form">
            <!-- toolStrip2: New, Refresh, Update, Save, Attachment, Delete (Visible = false, empty handler), 102-Print, 102-Print II,
                 Cost Center (hidden in Load), ShortCut Keys, MultiCurrencyInfo (Multi Currency feature only - not on the web) -->
            <div class="prv-ts"><div class="prv-ts-in" id="prvToolStrip">
                <button type="button" class="prv-ts-btn" id="btnNew"><i class="fa fa-plus-circle" style="color:#2e7d32"></i><span><u>N</u>ew</span></button>
                <button type="button" class="prv-ts-btn" id="btnRefresh"><i class="fa fa-refresh" style="color:#2e7d32"></i><span>Refresh</span></button>
                <button type="button" class="prv-ts-btn" id="btnUpdate" style="display:none;"><i class="fa fa-pencil" style="color:#e65100"></i><span><u>U</u>pdate</span></button>
                <button type="button" class="prv-ts-btn" id="btnSave"><i class="fa fa-floppy-o" style="color:#1565c0"></i><span><u>S</u>ave</span></button>
                <button type="button" class="prv-ts-btn" id="btnAttachment"><i class="fa fa-paperclip" style="color:#455a64"></i><span><u>A</u>ttachment</span></button>
                <button type="button" class="prv-ts-btn" id="btnPrint"><i class="fa fa-print" style="color:#37474f"></i><span>102-Print</span></button>
                <button type="button" class="prv-ts-btn" id="btnPrint2"><i class="fa fa-print" style="color:#37474f"></i><span>102-Print II</span></button>
                <button type="button" class="prv-ts-btn" id="btnShortcuts"><span>ShortCut Keys</span></button>
            </div></div>
            <!-- panel4 (teal strip), panel17 (Main / Detail group boxes + tabControl2) and panel24 (cost centre grids) -->
            <div id="prvForm"></div>
        </div>
        <div id="tabHistContent" class="prv-page prv-rec exn-hist" style="display: none;">
            <!-- HistoryFill / USP_VoucherFormHistory: toolbar, teal title, Filters box, history grid, detail grid -->
            <div id="exnHist"></div>
        </div>
    </div>

    <div class="prv-tabs">
        <button type="button" class="win-tab-btn active" id="tabBtnForm">Form</button>
        <button type="button" class="win-tab-btn" id="tabBtnHist">History</button>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/build/js/countx_voucher_desktop_config.js?v=20260930s}"></script>
    <script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
    <script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
    <script th:src="@{/build/js/countx_expense_tax_voucher.js?v=20261007a}"></script>
    <script>
        /* Form and history tab: countx_expense_tax_voucher.js (EXN). */
        EXN.init();
    </script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<div hidden data-gridbar-dynamic="ExpenseVoucherNew" data-gridbar-tables="#exnGrid,#exnHGrid,#exnHDetail"></div>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body>
</html>
