<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Journal Voucher (without Offset)</title>

    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_payment_receipt_voucher.css?v=20261002ga}">
    <link rel="stylesheet" th:href="@{/build/css/countx_journal_no_offset_voucher.css?v=20261007a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<body class="prv-body">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
    <!-- Screen 914 (JournalVoucher_New): Architecture.WinApp.Account_Definition.VouchersWithTax.JournalVoucher_New, DocumentTypeId 17.
         The Form tab and the History tab are drawn by countx_journal_no_offset_voucher.js at the InitializeComponent
         coordinates; the tab strip is at the bottom as on the desktop (TabAlignment.Bottom). -->
    <div class="prv-caption">
        <span>Journal Voucher (without Offset)</span>
        <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="prv-pages" id="prvPages">
        <div id="tabFormContent" class="prv-page prv-rec jno-form">
            <!-- toolStrip2: New, Refresh, Save, Update, Delete (Visible = false, its handler only throws), Attachment, 102-Print, ShortCut Keys,
                 Generate Remarks and Load Trial Balance (both hidden until Alt+Shift+T) -->
            <div class="prv-ts"><div class="prv-ts-in" id="prvToolStrip">
                <button type="button" class="prv-ts-btn" id="btnNew"><i class="fa fa-plus-circle" style="color:#2e7d32"></i><span><u>N</u>ew</span></button>
                <button type="button" class="prv-ts-btn" id="btnRefresh"><i class="fa fa-refresh" style="color:#2e7d32"></i><span>Refresh</span></button>
                <button type="button" class="prv-ts-btn" id="btnSave"><i class="fa fa-floppy-o" style="color:#1565c0"></i><span><u>S</u>ave</span></button>
                <button type="button" class="prv-ts-btn" id="btnUpdate" style="display:none;"><i class="fa fa-pencil" style="color:#e65100"></i><span><u>U</u>pdate</span></button>
                <button type="button" class="prv-ts-btn" id="btnAttachment"><i class="fa fa-paperclip" style="color:#455a64"></i><span><u>A</u>ttachment</span></button>
                <button type="button" class="prv-ts-btn" id="btnPrint"><i class="fa fa-print" style="color:#37474f"></i><span>102-Print</span></button>
                <button type="button" class="prv-ts-btn" id="btnShortcuts"><span>ShortCut Keys</span></button>
                <button type="button" class="prv-ts-btn" id="btnGenerateRemarks" style="display:none;"><span>Generate Remarks</span></button>
                <button type="button" class="prv-ts-btn" id="btnLoadTrialBalance" style="display:none;"><span>Load Trial Balance</span></button>
            </div></div>
            <!-- panel3 (teal strip), panel4 (Main / Detail group boxes), panel5 (Detail grid) -->
            <div id="prvForm"></div>
        </div>
        <div id="tabHistContent" class="prv-page prv-rec jno-hist" style="display: none;">
            <!-- HistoryGridFill / USP_VoucherFormHistory: toolbar, teal title, Filters box, history grid, detail grid -->
            <div id="jnoHist"></div>
        </div>
    </div>

    <div class="prv-tabs">
        <button type="button" class="win-tab-btn active" id="tabBtnForm">Form</button>
        <button type="button" class="win-tab-btn" id="tabBtnHist">History</button>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script th:src="@{/build/js/countx_voucher_desktop_config.js?v=20260930s}"></script>
    <script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
    <script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
    <script th:src="@{/build/js/countx_journal_no_offset_voucher.js?v=20261007a}"></script>
    <script>
        /* Form and history tab: countx_journal_no_offset_voucher.js (JNO). */
        JNO.init();
    </script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<div hidden data-gridbar-dynamic="JournalVoucher_New" data-gridbar-tables="#jnoGrid,#jnoHGrid,#jnoHDetail"></div>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
