<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${adjTitle}">Payment Adjustment Voucher</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Verdana, sans-serif; font-size: 12px; background: #f0f0f0; margin: 0; color: #222; }
        .tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #dcdcdc; }
        .tabs button { border: 1px solid #aaa; border-bottom: none; background: #e9e9e9; padding: 4px 16px; cursor: pointer; font-size: 12px; }
        .tabs button.on { background: #fff; font-weight: bold; }
        .page { background: #fff; border: 1px solid #aaa; margin: 0 6px 6px; padding: 4px; }
        .toolbar { display: flex; gap: 4px; padding: 3px; background: linear-gradient(#fdfdfd, #e6e6e6); border: 1px solid #c8c8c8; }
        .toolbar button { font-size: 12px; padding: 3px 10px; border: 1px solid #aaa; background: #fafafa; cursor: pointer; }
        .toolbar button:disabled { color: #999; cursor: default; }
        .strip { background: #00796b; color: #fff; font-weight: bold; font-size: 14px; padding: 4px 8px; margin-top: 3px; display: flex; justify-content: space-between; align-items: center; }
        .strip button { background: #00c0c0; color: #400000; border: none; font-weight: bold; padding: 3px 10px; cursor: pointer; }
        .strip label { font-size: 12px; }
        fieldset { border: 1px solid #b5b5b5; margin: 4px 0; padding: 4px 8px 8px; }
        legend { font-weight: bold; font-size: 12px; padding: 0 4px; width: auto; }
        .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
        .fld { display: flex; flex-direction: column; }
        .fld label { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
        input[type=text], input[type=date], select { font-size: 12px; border: 1px solid #9a9a9a; padding: 2px 4px; height: 24px; box-sizing: border-box; }
        input:disabled, select:disabled { background: #eee; }
        .num { text-align: right; }
        .bar { background: #00796b; color: #fff; font-weight: bold; padding: 3px 6px; display: flex; justify-content: space-between; align-items: center; }
        .bar button { font-size: 11px; }
        .grid { border: 1px solid #aaa; overflow: auto; background: #fff; }
        table.g { border-collapse: collapse; width: 100%; font-size: 11px; }
        table.g th { background: #e4e4e4; border: 1px solid #b9b9b9; padding: 3px 4px; text-align: center; position: sticky; top: 0; white-space: nowrap; }
        table.g td { border: 1px solid #d3d3d3; padding: 2px 4px; white-space: nowrap; }
        table.g tfoot td { font-weight: bold; background: #f3f3f3; }
        table.g input.cell { width: 100%; border: 1px solid #ccc; height: 20px; font-size: 11px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body th:attr="data-kind=${adjKind},data-slip=${adjSlipName}">
<div class="tabs">
    <button type="button" id="tabForm" class="on" onclick="ADJ.tab(0)">Form</button>
    <button type="button" id="tabHistory" onclick="ADJ.tab(1)">History</button>
</div>

<!-- ====================================================== tabPage1 "Form" -->
<div class="page" id="pageForm">
    <div class="toolbar">
        <button type="button" onclick="ADJ.newForm()">New</button>
        <button type="button" onclick="ADJ.refresh()">Refresh</button>
        <button type="button" id="btnSave" onclick="ADJ.save(false)">Save</button>
        <button type="button" id="btnUpdate" hidden onclick="ADJ.save(true)">Update</button>
        <button type="button" id="btnDelete" hidden onclick="ADJ.del()">Delete</button>
        <button type="button" id="btnSlip" onclick="ADJ.slipClick()" th:text="${adjSlipCaption}" data-rpt="901_VoucherInvoicesAdjustment_Slip.rpt">901-Print</button>
        <button type="button" onclick="ADJ.shortcuts()">ShortCut Keys</button>
    </div>
    <div class="strip">
        <span th:text="${adjTitle}">Payment Adjustment Voucher</span>
        <span>
            <button type="button" onclick="ADJ.autoAll()">Auto Utilize All Pending Vouchers</button>
            <label><input type="checkbox" id="ChkPrintslip"> Print Slip</label>
        </span>
    </div>

    <fieldset>
        <legend>Main</legend>
        <div class="row">
            <div class="fld"><label>Voucher No,Date</label>
                <div style="display:flex;gap:2px;">
                    <select id="CmbVoucher" style="width:116px;" onchange="ADJ.voucherLeave()"></select>
                    <input type="date" id="txtVoucherDate" disabled style="width:130px;">
                </div>
            </div>
            <div class="fld"><label>Payment Type</label><select id="CmbPaymentType" style="width:250px;" onblur="ADJ.supplierLeave()"></select></div>
            <div class="fld"><label>Party City /<br>Cell</label>
                <div style="display:flex;gap:2px;">
                    <input type="text" id="txtPartyCity" disabled style="width:124px;">
                    <input type="text" id="txtPartyCellNo" disabled style="width:133px;">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="fld"><label>Voucher Amount</label><input type="text" id="txtVoucherAmountRegular" class="num" disabled style="width:248px;"></div>
            <div class="fld"><label>Party Name</label>
                <select id="CmbSupplier" class="dtcombo" data-dtcombo="single" data-dtcombo-caption="Party Name" style="width:250px;" onchange="ADJ.supplierLeave()"></select>
            </div>
            <div class="fld"><label>Party Name</label>
                <select id="CmbAccountFilter" class="dtcombo" data-dtcombo="single" data-dtcombo-caption="Party Name" style="width:255px;"></select>
            </div>
            <button type="button" onclick="ADJ.showRecords(true)">Show</button>
        </div>
    </fieldset>

    <div class="bar"><span>Detail</span><button type="button" onclick="ADJ.autoUtilize()" th:text="${adjAutoCaption}">Auto Utilize Voucher Amount</button></div>
    <div class="grid" style="height:284px;"><table class="g" id="grd"></table></div>

    <div class="bar" style="margin-top:4px;"><span>Pending Vouchers For Adjustment</span></div>
    <div class="grid" style="height:180px;"><table class="g" id="grdPendingVouchers"></table></div>
</div>

<!-- ====================================================== tabPage2 "History" -->
<div class="page" id="pageHistory" hidden>
    <div class="toolbar">
        <button type="button" onclick="ADJ.resetHistory()">New</button>
        <button type="button" onclick="ADJ.historyParties()">Refresh</button>
    </div>
    <div class="strip">Adjustment Vouchers History </div>
    <fieldset>
        <legend>Filters</legend>
        <div class="row">
            <div class="fld"><label>Date Type</label>
                <select id="cmbDateTypeHistory" style="width:130px;" onchange="ADJ.dateTypeChanged()">
                    <option value="1">This Day</option><option value="2">This Week</option><option value="3">This Month</option>
                    <option value="4">This Year</option><option value="5">Financial Year</option>
                </select>
            </div>
            <div class="fld"><label>Date From</label><span><input type="checkbox" id="chkFrom" checked><input type="date" id="txtFromdateHistory" style="width:125px;"></span></div>
            <div class="fld"><label>Date To</label><span><input type="checkbox" id="chkTo" checked><input type="date" id="txtToDateHistory" style="width:125px;"></span></div>
            <div class="fld"><label>Voucher From</label><input type="text" id="txtFromNoHistory" style="width:82px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="fld"><label>Voucher To</label><input type="text" id="txtToDocNoHistory" style="width:82px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="fld"><label>Party</label>
                <select id="CmbCustomerHistory" class="dtcombo" data-dtcombo="single" data-dtcombo-caption="Party Name" style="width:200px;"></select>
            </div>
            <button type="button" onclick="ADJ.history()">Show</button>
            <div class="fld">
                <label><input type="radio" name="histDate" value="doc" checked> Voucher Date</label>
                <label><input type="radio" name="histDate" value="entry"> Voucher Entry Date</label>
                <label><input type="radio" name="histDate" value="modify"> Voucher Modify Date</label>
            </div>
        </div>
    </fieldset>
    <div class="bar"><span>Filtered Records</span></div>
    <div class="grid" style="height:420px;"><table class="g" id="grdHistory"></table></div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_accounts_groupd.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_adjustment_voucher.js?v=20260930s}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
