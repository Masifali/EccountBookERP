<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advance Adjustment</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gv}">
    <style>
        /* frmAdvanceAdjustment.InitializeComponent - ClientSize 1051x625, Maximized, tabControl1 Alignment Bottom (Form | History), tabPage Padding 3:
           panel3 (Top 28) toolStrip2 = New, Save, Print, Refresh;
           panel4 (Top 187): Doc Date (8,25 151x23), Doc No (162,25 100x23), Supplier combo (265,25 248x26), Adjusted Amount (516,25 111x23, disabled),
                             Remarks (629,25 254x23); labels at y=6/7, Calibri 9.75. Account / WithHoldingAc / WithHoldingTax / Tax % / Amount /
                             Tax Amount / Total Amount are all Visible=false on the form and stay hidden here;
           panel5 (Top 124) grdAdvancesAdjustment; panel6 (Fill) grdInvoices (Janus, Verdana 8.25, filter row on grdInvoices only). */
        :root { --grid-line: #c5d3dc; --grid-head: #e9eef3; --alt: #f3f7fa; --sel: #cfe3f5; }
        html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow-x: hidden; }
        body { font-family: Tahoma, "Microsoft Sans Serif", sans-serif; font-size: 12px; color: #000; display: flex; flex-direction: column; }
        [hidden] { display: none !important; }
        .nav-bar { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; border-bottom: 1px solid #c9c9c9; padding: 2px 8px; font: 11px "Segoe UI", sans-serif; color: #333; }
        .nav-bar a { color: #0b5c86; text-decoration: none; }
        .form-scroll { flex: 1 1 auto; min-height: 0; overflow-x: auto; overflow-y: hidden; display: flex; flex-direction: column; }
        .form { min-width: 900px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #fff; position: relative; }
        .page { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; padding: 3px; }
        .page.on { display: flex; }
        .panel3 { position: relative; height: 28px; flex: 0 0 auto; background: linear-gradient(#fbfcfd, #e3e8ee); border-bottom: 1px solid #b9c4cf; display: flex; align-items: center; padding-left: 2px; font: 13px Verdana, sans-serif; }
        .ts-btn { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid transparent; background: transparent; font: 13px Verdana, sans-serif; color: #000; cursor: pointer; }
        .ts-btn:hover:not(:disabled) { border-color: #7fb5d6; background: #dcecf8; }
        .ts-btn:disabled { color: #8a8a8a; cursor: default; }
        .ts-btn .ico-add { color: #2e9d3a; font-size: 15px; } .ts-btn .ico-save { color: #c0842b; } .ts-btn .ico-print { color: #44576a; } .ts-btn .ico-ref { color: #2e9d3a; }
        .ts-btn u { text-decoration: underline; }
        .panel4 { position: relative; height: 187px; flex: 0 0 auto; background: #fff; }
        .panel4 .lbl { position: absolute; white-space: nowrap; font: 13px Calibri, "Segoe UI", sans-serif; }
        .panel4 input[type=text], .panel4 input[type=date] { position: absolute; box-sizing: border-box; height: 23px; border: 1px solid #7a7a7a; font: 13px Calibri, "Segoe UI", sans-serif; padding: 0 3px; background: #fff; }
        .panel4 input:disabled { background: #f0f0f0; color: #6d6d6d; }
        .panel4 select, .panel4 .dtcombo-wrap { position: absolute; box-sizing: border-box; }
        .panel5 { flex: 0 0 124px; height: 124px; position: relative; display: flex; flex-direction: column; border: 1px solid #7f9db9; }
        .panel6 { flex: 1 1 auto; min-height: 120px; position: relative; display: flex; flex-direction: column; border: 1px solid #7f9db9; border-top: 0; }
        .grid-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; outline: none; }
        table.jg { border-collapse: separate; border-spacing: 0; table-layout: fixed; font: 11px Verdana, sans-serif; width: 100%; }
        table.jg th { position: sticky; top: 0; z-index: 2; background: linear-gradient(#f7f9fb, var(--grid-head)); border-right: 1px solid var(--grid-line); border-bottom: 1px solid #9fb3c4; padding: 3px 4px; font-weight: normal; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        table.jg tr.flt td { position: sticky; top: 22px; z-index: 2; background: #fff; border-right: 1px solid var(--grid-line); border-bottom: 1px solid #9fb3c4; padding: 0; height: 18px; }
        table.jg tr.flt input { width: 100%; box-sizing: border-box; border: 0; font: 11px Verdana, sans-serif; padding: 1px 3px; background: #fffff0; }
        table.jg td { border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; background: #fff; }
        table.jg tbody tr:nth-child(even) td { background: var(--alt); }
        table.jg tbody tr:hover td { background: var(--sel); }
        table.jg tbody tr.cur td { background: var(--sel); }
        table.jg td.n { text-align: right; }
        table.jg td.sel { text-align: center; padding: 0; }
        table.jg td.sel input { margin: 0; vertical-align: middle; }
        table.jg td.ed { padding: 0; }
        table.jg td.ed input { width: 100%; box-sizing: border-box; border: 0; background: transparent; font: 11px Verdana, sans-serif; padding: 2px 4px; height: 20px; }
        table.jg td.ed.n input { text-align: right; }
        table.jg td.ed input:focus { background: #fff; outline: 1px solid #0078d7; }
        table.jg tfoot td { position: sticky; bottom: 0; z-index: 2; background: #e3e9ef; border-top: 1px solid #9fb3c4; font-weight: bold; height: 14px; text-align: right; }
        .navr { flex: 0 0 auto; height: 22px; display: flex; align-items: center; padding: 0 6px; background: #eef2f6; border-top: 1px solid #b8c6d3; font: 11px Verdana, sans-serif; color: #333; }
        .tabs { flex: 0 0 auto; display: flex; padding: 0 4px; background: #f0f0f0; border-top: 1px solid #a0a0a0; }
        .tabs button { border: 1px solid #a0a0a0; border-top: 0; background: #ece9d8; padding: 3px 12px 4px; font: 12px Tahoma, sans-serif; cursor: pointer; margin-right: -1px; }
        .tabs button.on { background: #fff; position: relative; top: -1px; padding-bottom: 5px; }
        .wait { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .wait .box { background: #fff; border: 1px solid #0a6e6e; box-shadow: 0 2px 8px rgba(0,0,0,.25); padding: 12px 18px; font: 12px Verdana, sans-serif; color: #035; }
        .wait .box i { color: #0a6e6e; margin-right: 6px; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!--
  Screen 4 "Advance Adjustment" - Architecture.WinApp.Account_Definition.frmAdvanceAdjustment (Text "EccountBook").
  frmAdvanceAdjustment.cs map: Load :60, AccountsComboBind :68, SupplierCustomerFill :100, GenerateDocNo :123, GetInvoiceNoByPaymentByInvoice :145,
  GetAdvanceAmountByAccountId :190, grdInvoiceSetting :224, grdAccoutsSetting :263, ChkBoxWthHolding_CheckedChanged :288 (control is invisible),
  btnSave_Click :343, cmbSupplier_Leave :446, grdAdvancesAdjustment_CellValueChanged :458, CellUpdated/CellEdited :481-505,
  grdInvoices_CellUpdated/CellEdited :507-515, Reset :517, BtnNew_Click :540, validation() :552. Print and Refresh have no click handler on the desktop;
  the form wires no KeyDown handler (KeyPreview only), so there are no shortcut keys and no Enter-as-Tab.
-->
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="nav-bar"><span>EccountBook</span><a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a></div>
<div class="form-scroll">
<div class="form">
    <div class="page on" id="tabPage1">
        <div class="panel3" id="toolStrip2">
            <button type="button" class="ts-btn" id="BtnNew" accesskey="n" title="New (Alt+N)"><i class="fa fa-plus-circle ico-add"></i><span><u>N</u>ew</span></button>
            <button type="button" class="ts-btn" id="btnSave" accesskey="s" title="Save (Alt+S)"><i class="fa fa-pencil ico-save"></i><span><u>S</u>ave</span></button>
            <button type="button" class="ts-btn" id="BtnPrint" accesskey="p" title="Print (no handler on the desktop)"><i class="fa fa-print ico-print"></i><span><u>P</u>rint</span></button>
            <button type="button" class="ts-btn" id="toolStripButton1" title="Refresh (no handler on the desktop)"><span>Refresh</span></button>
        </div>
        <div class="panel4">
            <span class="lbl" style="left:8px; top:7px;">Doc Date</span>
            <input type="date" id="txtDocDate" style="left:8px; top:25px; width:151px;" tabindex="1">
            <span class="lbl" style="left:162px; top:6px;">Doc No</span>
            <input type="text" id="txtDocNo" style="left:162px; top:25px; width:100px;" tabindex="2" autocomplete="off">
            <span class="lbl" style="left:265px; top:6px;">Supplier</span>
            <select id="cmbSupplier" data-dtcombo="single" data-dtcombo-caption="Supplier" style="left:265px; top:25px; width:248px; height:26px;" tabindex="3"></select>
            <span class="lbl" style="left:516px; top:6px;">Adjusted Amount</span>
            <input type="text" id="txtAdjustedAmount" style="left:516px; top:25px; width:111px;" disabled tabindex="49">
            <span class="lbl" style="left:629px; top:6px;">Remarks</span>
            <input type="text" id="txtRemarks" style="left:629px; top:25px; width:254px;" tabindex="51" autocomplete="off">
            <!-- Visible = false on the desktop form: bound (AccountsComboBind) but never shown or read with a value -->
            <select id="CmbAgainstAc" data-dtcombo-skip hidden></select>
            <select id="CmbWithHoldingAc" data-dtcombo-skip hidden></select>
        </div>
        <div class="panel5">
            <div class="grid-scroll" id="scrAdv" tabindex="0">
                <table data-gridbar="frmAdvanceAdjustment:grdAdvancesAdjustment" class="jg" id="grdAdvancesAdjustment">
                    <colgroup><col style="width:34px"><col style="width:200px"><col style="width:150px"><col style="width:150px"><col style="width:250px"><col></colgroup>
                    <thead><tr><th><input type="checkbox" id="advAll" title="Select all"></th><th>AccountTitle</th><th>AvailableAmount</th><th>Adjustment Amount</th><th>Remarks</th><th></th></tr></thead>
                    <tbody id="advBody"></tbody>
                    <tfoot><tr id="advFoot"></tr></tfoot>
                </table>
            </div>
            <div class="navr"><span id="advNav">Record 0 of 0</span></div>
        </div>
        <div class="panel6">
            <div class="grid-scroll" id="scrInv" tabindex="0">
                <table data-gridbar="frmAdvanceAdjustment:grdInvoices" class="jg" id="grdInvoices">
                    <colgroup><col style="width:34px"><col style="width:100px"><col style="width:100px"><col style="width:100px"><col style="width:130px"><col style="width:120px"><col style="width:120px"><col style="width:250px"><col></colgroup>
                    <thead>
                        <tr><th><input type="checkbox" id="invAll" title="Select all"></th><th>VoucherDate</th><th>DocumentType</th><th>DueDate</th><th>ManualBillNo</th><th>BalanceAmount</th><th>Paid Amount</th><th>Remarks</th><th></th></tr>
                        <tr class="flt"><td></td><td><input data-f="VoucherDate"></td><td><input data-f="DocumentType"></td><td><input data-f="DueDate"></td><td><input data-f="ManualBillNo"></td><td><input data-f="BalanceAmount"></td><td><input data-f="PaidAmount"></td><td><input data-f="Remarks"></td><td></td></tr>
                    </thead>
                    <tbody id="invBody"></tbody>
                    <tfoot><tr id="invFoot"></tr></tfoot>
                </table>
            </div>
            <div class="navr"><span id="invNav">Record 0 of 0</span></div>
        </div>
    </div>
    <!-- tabPage2 "History": the desktop page has no controls -->
    <div class="page" id="tabPage2"></div>
    <div class="tabs"><button type="button" class="on" data-tab="tabPage1">Form</button><button type="button" data-tab="tabPage2">History</button></div>
</div>
</div>
<div class="wait" id="waitForm" hidden><div class="box"><i class="fa fa-spinner fa-spin"></i>Please wait...</div></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gv}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20261002gv}"></script>
<script>
(function () {
    'use strict';
    var API = '/api/accounts/advance-adjustment';
    var adv = [], inv = [], invFilters = {}, loadedSupplier = null, saving = false;

    function esc(s) { return AccF.esc(s == null ? '' : s); }
    function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
    /* FormatString "0,0": integer with thousands separators */
    function f00(v) { var n = Math.round(num(v)); return n.toLocaleString('en-US'); }
    /* TotalFormatString "#,##0.##" */
    function fTot(v) { return num(v).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
    /* double.ToString() of the grid total (15 significant digits) */
    function dstr(v) { return String(Number(num(v).toPrecision(15))); }
    function busy(on) { $('#waitForm').prop('hidden', !on); }
    function call(method, path, body) {
        return new Promise(function (resolve, reject) {
            $.ajax({ url: API + path, type: method, contentType: 'application/json', dataType: 'json', data: body ? JSON.stringify(body) : undefined })
                .done(function (r) { if (r && r.success === false) { var e = new Error(r.message); e.warning = !!r.warning; reject(e); } else resolve(r.data); })
                .fail(function (x) { reject(new Error((x.responseJSON && x.responseJSON.message) || ('HTTP ' + x.status))); });
        });
    }

    // ------------------------------------------------------------------ grids
    function advTotals() { var a = 0, b = 0; adv.forEach(function (r) { a += num(r.AvailableAmount); b += num(r.AdjustmentAmount); }); return { avail: a, adj: b }; }
    function renderAdv() {
        var h = [];
        adv.forEach(function (r, i) {
            h.push('<tr data-i="' + i + '"><td class="sel"><input type="checkbox" data-sel="' + i + '"' + (r.Select ? ' checked' : '') + '></td>'
                + '<td>' + esc(r.AccountTitle) + '</td><td class="n">' + f00(r.AvailableAmount) + '</td>'
                + '<td class="ed n"><input data-ed="AdjustmentAmount" data-i="' + i + '" value="' + f00(r.AdjustmentAmount) + '"></td>'
                + '<td class="ed"><input data-ed="Remarks" data-i="' + i + '" value="' + esc(r.Remarks) + '"></td><td></td></tr>');
        });
        $('#advBody').html(h.join(''));
        var t = advTotals();
        $('#advFoot').html(adv.length ? '<td></td><td></td><td>' + fTot(t.avail) + '</td><td>' + fTot(t.adj) + '</td><td></td><td></td>' : '');
        $('#advAll').prop('checked', adv.length > 0 && adv.every(function (r) { return r.Select; }));
        $('#advNav').text('Record ' + (adv.length ? 1 : 0) + ' of ' + adv.length);
    }
    function invShown() {
        return inv.filter(function (r) {
            return ['VoucherDate', 'DocumentType', 'DueDate', 'ManualBillNo', 'BalanceAmount', 'PaidAmount', 'Remarks'].every(function (k) {
                var t = (invFilters[k] || '').toLowerCase(); if (!t) return true;
                var v = (k === 'BalanceAmount' || k === 'PaidAmount') ? f00(r[k]) : r[k];
                return String(v == null ? '' : v).toLowerCase().indexOf(t) >= 0;
            });
        });
    }
    function renderInv() {
        var shown = invShown(), h = [];
        shown.forEach(function (r) {
            var i = inv.indexOf(r);
            h.push('<tr data-i="' + i + '"><td class="sel"><input type="checkbox" data-isel="' + i + '"' + (r.Select ? ' checked' : '') + '></td>'
                + '<td>' + esc(r.VoucherDate) + '</td><td>' + esc(r.DocumentType) + '</td><td>' + esc(r.DueDate) + '</td><td>' + esc(r.ManualBillNo) + '</td>'
                + '<td class="n">' + f00(r.BalanceAmount) + '</td>'
                + '<td class="ed n"><input data-ied="PaidAmount" data-i="' + i + '" value="' + f00(r.PaidAmount) + '"></td>'
                + '<td class="ed"><input data-ied="Remarks" data-i="' + i + '" value="' + esc(r.Remarks) + '"></td><td></td></tr>');
        });
        $('#invBody').html(h.join(''));
        var a = 0, b = 0; shown.forEach(function (r) { a += num(r.BalanceAmount); b += num(r.PaidAmount); });
        $('#invFoot').html(inv.length ? '<td></td><td></td><td></td><td></td><td></td><td>' + fTot(a) + '</td><td>' + fTot(b) + '</td><td></td><td></td>' : '');
        $('#invAll').prop('checked', inv.length > 0 && inv.every(function (r) { return r.Select; }));
        $('#invNav').text('Record ' + (shown.length ? 1 : 0) + ' of ' + shown.length);
    }

    /* grdAdvancesAdjustment_CellUpdated / CellEdited: txtAdjustedAmount = GetTotal(AdjustmentAmount).ToString() */
    function syncAdjusted() { $('#txtAdjustedAmount').val(adv.length ? dstr(advTotals().adj) : $('#txtAdjustedAmount').val()); }

    /* grdAdvancesAdjustment_CellValueChanged (Select column only): selected rows with Available > 0 take the available amount, all others 0 */
    function advSelectChanged() {
        adv.forEach(function (r) { r.AdjustmentAmount = (num(r.AvailableAmount) > 0 && r.Select) ? num(r.AvailableAmount) : 0; });
        syncAdjusted(); renderAdv();
    }
    $('#advBody').on('change', 'input[data-sel]', function () { adv[$(this).data('sel')].Select = this.checked; advSelectChanged(); });
    $('#advAll').on('change', function () { var c = this.checked; adv.forEach(function (r) { r.Select = c; }); advSelectChanged(); });
    $('#advBody').on('focus', 'input[data-ed="AdjustmentAmount"]', function () { this.value = String(num(adv[$(this).data('i')].AdjustmentAmount)); this.select(); });
    $('#advBody').on('blur', 'input[data-ed="AdjustmentAmount"]', function () {
        adv[$(this).data('i')].AdjustmentAmount = num(this.value); syncAdjusted(); renderAdv();
    });
    $('#advBody').on('input', 'input[data-ed="Remarks"]', function () { adv[$(this).data('i')].Remarks = this.value; });

    /* grdInvoices_CellUpdated / CellEdited: UpdateData only */
    $('#invBody').on('change', 'input[data-isel]', function () { inv[$(this).data('isel')].Select = this.checked; renderInv(); });
    $('#invAll').on('change', function () { var c = this.checked; inv.forEach(function (r) { r.Select = c; }); renderInv(); });
    $('#invBody').on('focus', 'input[data-ied="PaidAmount"]', function () { this.value = String(num(inv[$(this).data('i')].PaidAmount)); this.select(); });
    $('#invBody').on('blur', 'input[data-ied="PaidAmount"]', function () { inv[$(this).data('i')].PaidAmount = num(this.value); renderInv(); });
    $('#invBody').on('input', 'input[data-ied="Remarks"]', function () { inv[$(this).data('i')].Remarks = this.value; });
    $('#grdInvoices thead').on('input', '.flt input', function () { invFilters[$(this).data('f')] = this.value; renderInv(); });

    // ------------------------------------------------------------------ load / Leave / reset
    function setDocNo(n) { if (n) $('#txtDocNo').val(n); }

    /* frmAdvanceAdjustment_Load: AccountsComboBind, SupplierCustomerFill, GenerateDocNo, cmbSupplier.Focus */
    function load() {
        busy(true);
        return call('GET', '/load').then(function (d) {
            if (d.suppliers && d.suppliers.length) AccF.fillSelect('#cmbSupplier', d.suppliers, 'Id', 'Name', null);
            $('#cmbSupplier').val('').trigger('change');
            fillHidden('#CmbAgainstAc', d.accounts); fillHidden('#CmbWithHoldingAc', d.accounts);
            setDocNo(d.docNo);
        }).catch(function (e) { alert(e.message); }).then(function () { busy(false); AccF.focus('#cmbSupplier'); });
    }
    function fillHidden(sel, rows) {
        var $s = $(sel).empty();
        (rows || []).forEach(function (r) { $s.append($('<option>').val(r.Id).text(r.AccountTitle)); });
        $s.val('');
    }

    /* cmbSupplier_Leave: GetInvoiceNoByPaymentByInvoice, then GetAdvanceAmountByAccountId.
       No invoices: the desktop clears grdAdvancesAdjustment (not grdInvoices); no advances: grdAdvancesAdjustment.ClearStructure(). */
    function supplierLeave() {
        var id = $('#cmbSupplier').val() || '0';
        if (loadedSupplier === id) return;
        loadedSupplier = id;
        call('GET', '/supplier/' + encodeURIComponent(id)).then(function (d) {
            if (d.invoices && d.invoices.length) { inv = d.invoices.map(function (r) { r.Select = false; return r; }); invFilters = {}; $('#grdInvoices .flt input').val(''); }
            adv = (d.advances || []).map(function (r) { r.Select = false; return r; });
            renderInv(); renderAdv();
        }).catch(function (e) { loadedSupplier = null; alert(e.message); });
    }
    $('#cmbSupplier').on('change', supplierLeave);
    $(document).on('focusout', '.dtcombo-wrap', function () {
        var w = this;
        setTimeout(function () { if (!w.contains(document.activeElement) && $(w).find('#cmbSupplier').length) supplierLeave(); }, 150);
    });

    /* Reset (New_Click) */
    function reset() {
        $('#txtDocDate').val(AccF.today());
        $('#cmbSupplier').val('').trigger('change');
        $('#txtAdjustedAmount').val(''); $('#txtRemarks').val('');
        loadedSupplier = null;
        adv = []; inv = []; invFilters = {}; $('#grdInvoices .flt input').val('');
        renderAdv(); renderInv();
        call('GET', '/doc-no').then(function (n) { setDocNo(n); }).catch(function (e) { alert(e.message); });
        AccF.focus('#cmbSupplier');
    }
    $('#BtnNew').on('click', reset);

    /* btnSave_Click: validation(), the grid checks and the save are repeated by the server in the desktop's order */
    $('#btnSave').on('click', function () {
        if (saving) return;
        var sup = $('#cmbSupplier').val();
        saving = true; $('#btnSave').prop('disabled', true);
        call('POST', '/save', {
            docDate: $('#txtDocDate').val(), docNo: $('#txtDocNo').val(), adjustedAmount: $('#txtAdjustedAmount').val(), remarks: $('#txtRemarks').val(),
            supplierId: sup || '',
            invoices: inv.map(function (r) { return { refDocumentTypeId: r.RefDocumentTypeId, refDocNoId: r.RefDocNoId, paidAmount: num(r.PaidAmount), remarks: r.Remarks || '' }; }),
            advances: adv.map(function (r) { return { accountId: r.AccountId, adjustmentAmount: num(r.AdjustmentAmount), remarks: r.Remarks || '' }; })
        }).then(function () { alert('SAVED SECCESSFULLY'); reset(); })
          .catch(function (e) { alert(e.message); })
          .then(function () { saving = false; $('#btnSave').prop('disabled', false); });
    });

    /* Print / Refresh: no click handler on the desktop form */

    $('.tabs').on('click', 'button', function () {
        $('.tabs button').removeClass('on'); $(this).addClass('on');
        $('.page').removeClass('on'); $('#' + $(this).data('tab')).addClass('on');
    });

})();
