<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day Book (Off Set)</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20261002gd}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261002gd}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_desk_d.css?v=20261002gd}">
    <style>
        /* frmDayBook.cs designer: ClientSize 1256x563, tabControl1 Alignment=Bottom, tab pages 1248x537 (panel2 padding 3).
           Form: panel3 30 (toolstrip) | panel4 293 = panel6 teal 36 + MainBox "Main" (3,35) 1239x138
                 + groupBox2 "Detail" (3,173) 1239x116 holding flowLayoutPanel1 (2,16) 1212x97 | grdDetail Dock=Fill.
           frmDayBook_Load / MultiCurrencyFeature() runtime changes reproduced below:
             TemporaryAccountId <= 0 -> Temporary Ac hidden, MainBox 122 high, remarks 78 high, Sub Code / Cr Total / Dr Total panels hidden,
                                        CreditAccountPanel 290 (combo 288); and with no subsidiary feature also both remarks panels 600 (box 595);
             no multi-currency      -> Fcy Code / Exchange Rate / Fcy Amount hidden, Print Preview + Preview Format II move to x771. */
        .flow { position: absolute; left: 2px; top: 16px; width: 1212px; height: 97px; display: flex; flex-wrap: wrap; align-content: flex-start; }
        .flow > .fp { position: relative; flex: none; height: 47px; }
        .flow > .fp > .fpin { position: absolute; inset: 0; }
        body:has(#rowTemporary[hidden]) #MainBox { height: 122px !important; }
        body:has(#rowTemporary[hidden]) #txtVoucherRemarks { height: 78px !important; }
        body:has(#rowTemporary[hidden]) #CreditAccountPanel { width: 290px !important; }
        body:has(#rowTemporary[hidden]) #CreditAccountPanel .dtcombo-wrap { width: 288px !important; }
        body:has(#rowTemporary[hidden]):has(#CreditSubsidiaryPanel[hidden]) #CrRemarksPanel,
        body:has(#rowTemporary[hidden]):has(#CreditSubsidiaryPanel[hidden]) #DrRemarksPanel { width: 600px !important; }
        body:has(#rowTemporary[hidden]):has(#CreditSubsidiaryPanel[hidden]) #txtCrRemarks,
        body:has(#rowTemporary[hidden]):has(#CreditSubsidiaryPanel[hidden]) #txtDrRemarks { width: 595px !important; }
        body:has(#lblFcyCode[hidden]) .pp { left: 771px !important; }
        #lblRemarksMain { background: #fff; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<body class="dk erp-viewport-page">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="dk-shell">
<div class="dk-body">

<!-- ====================================================== tabPage1 "Form" -->
<div class="dk-page" id="pageForm" style="width:1248px;">
    <!-- panel3 -->
    <div class="dk-dock" style="height:30px;">
        <div class="dk-ts">
            <button type="button" class="dk-tsb sm" id="btnNew" onclick="DBO.newForm()"><i class="fa fa-file-o"></i><span><u>N</u>ew</span></button>
            <button type="button" class="dk-tsb" id="btnRefresh" onclick="DBO.refresh()"><i class="fa fa-refresh g"></i><span>Refresh</span></button>
            <button type="button" class="dk-tsb sm" id="btnsave" onclick="DBO.save(false)"><i class="fa fa-floppy-o"></i><span><u>S</u>ave</span></button>
            <button type="button" class="dk-tsb" id="btnUpdate" hidden onclick="DBO.save(true)"><i class="fa fa-pencil-square-o"></i><span>Update</span></button>
            <button type="button" class="dk-tsb" disabled title="Attachments are not ported to the web."><i class="fa fa-paperclip"></i><span><u>A</u>ttachment</span></button>
            <button type="button" class="dk-tsb" onclick="DBO.shortcuts()"><span>ShortCut Keys</span></button>
        </div>
    </div>
    <!-- panel4 -->
    <div class="dk-dock" style="height:293px;">
        <div class="dk-teal" style="position:absolute;left:0;top:0;width:100%;height:36px;"><span class="dk-cap" style="left:7px;top:7px;">Day Book</span></div>

        <div class="dk-gb" id="MainBox" style="left:3px;top:35px;width:1239px;height:138px;">
            <span class="dk-gbcap">Main</span>
            <label class="dk-l" style="left:12px;top:26px;" for="txtDocNo">Vocher Code</label>
            <input type="text" class="dk-t" id="txtDocNo" readonly style="left:93px;top:22px;width:116px;">
            <label class="dk-l" style="left:209px;top:26px;" for="txtDocDate">Date</label>
            <input type="date" class="dk-t" id="txtDocDate" style="left:255px;top:22px;width:135px;">
            <label class="dk-l" id="lblRemarksMain" style="left:394px;top:26px;" for="txtVoucherRemarks">Remarks</label>
            <textarea class="dk-t" id="txtVoucherRemarks" style="left:447px;top:22px;width:319px;height:108px;"></textarea>

            <label class="dk-l" style="left:12px;top:54px;">Cash Account</label>
            <select id="cmbCashAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="position:absolute;left:93px;top:48px;width:297px;height:26px;" onchange="DBO.cashLeave()"></select>
            <label class="dk-l" style="left:12px;top:81px;">Opening</label>
            <input type="text" class="dk-t r" id="txtOpening" readonly style="left:93px;top:77px;width:116px;">
            <label class="dk-l" style="left:209px;top:81px;">Closing</label>
            <input type="text" class="dk-t r" id="txtClosing" readonly style="left:255px;top:77px;width:135px;">
            <div id="rowTemporary" hidden style="position:absolute;left:0;top:0;width:0;height:0;">
                <label class="dk-l" style="left:12px;top:110px;">Temporary Ac</label>
                <select id="CmbTemporaryAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Temporary Account" style="position:absolute;left:93px;top:104px;width:297px;height:26px;"></select>
            </div>

            <label class="dk-l mc" id="lblFcyCode" style="left:772px;top:26px;">Fcy Code</label>
            <select id="cmbCurrency" class="dtcombo mc" data-dtcombo-caption="FcyCode" style="position:absolute;left:856px;top:20px;width:128px;height:26px;" onchange="DBO.currencyLeave()"></select>
            <label class="dk-l mc" style="left:772px;top:54px;">Exchange Rate</label>
            <input type="text" class="dk-t r mc" id="txtExchangeRate" style="left:856px;top:50px;width:128px;" oninput="DBO.rateChanged()" onblur="DBO.rateLeave()">
            <label class="dk-l mc" style="left:772px;top:80px;">Fcy Amount</label>
            <input type="text" class="dk-t r mc" id="txtFcyAmount" disabled style="left:856px;top:76px;width:128px;">
            <label class="dk-chk pp" style="left:990px;top:56px;"><input type="checkbox" id="ChkBoxPrintPreview" checked> Print Preview</label>
            <label class="dk-chk pp" style="left:990px;top:79px;"><input type="checkbox" id="chkformat2"> Preview Format II</label>
        </div>

        <div class="dk-gb" id="groupBox2" style="left:3px;top:173px;width:1239px;height:116px;">
            <span class="dk-gbcap">Detail</span>
            <div class="flow" id="flowLayoutPanel1">
                <div class="fp tmp" id="SubCodePanel" style="width:79px;">
                    <label class="dk-l" style="left:1px;top:3px;">Sub Code</label>
                    <input type="text" class="dk-t" id="txtSubCode" readonly style="left:1px;top:23px;width:76px;">
                </div>
                <div class="fp" id="CreditAccountPanel" style="width:210px;">
                    <label class="dk-l" style="left:0;top:2px;">Credit Account</label>
                    <span class="dk-l" id="CrBalance" hidden style="left:92px;top:2px;"></span>
                    <select id="cmbCreditAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Credit Account" style="position:absolute;left:1px;top:20px;width:209px;height:26px;" onchange="DBO.creditLeave()"></select>
                </div>
                <div class="fp sub" id="CreditSubsidiaryPanel" style="width:172px;">
                    <label class="dk-l" style="left:1px;top:1px;">Credit Subsidiary Account</label>
                    <select id="CmbCrSubsidiaryAccount" class="dtcombo" data-dtcombo="gdSubsidiary4" data-dtcombo-caption="Account Title" style="position:absolute;left:1px;top:21px;width:171px;height:26px;" onchange="DBO.subPicked('cr')"></select>
                </div>
                <div class="fp tmp" id="CrTotalAmountPanel" style="width:130px;height:46px;">
                    <label class="dk-l" style="left:4px;top:1px;">Cr Total Amount</label>
                    <input type="text" class="dk-t r" id="txtTotalCrAmount" style="left:1px;top:21px;width:129px;" oninput="DBO.commas(this)">
                </div>
                <div class="fp" id="CrRemarksPanel" style="width:329px;">
                    <label class="dk-l" style="left:1px;top:2px;">Credit Remarks</label>
                    <input type="text" class="dk-t" id="txtCrRemarks" style="left:1px;top:22px;width:328px;" onblur="DBO.crRemarksLeave()">
                </div>
                <div class="fp" id="CheqNoPanel" style="width:154px;">
                    <div class="fpin" id="pnlChequeNo">
                        <label class="dk-l" style="left:1px;top:1px;">Cheque No</label>
                        <select id="CmbChequeNo" class="dtcombo" data-dtcombo-caption="CheqNo" style="position:absolute;left:1px;top:19px;width:153px;height:26px;"></select>
                    </div>
                    <div class="fpin" id="pnlChequeRef">
                        <label class="dk-l" style="left:1px;top:1px;">Cheque Ref</label>
                        <input type="text" class="dk-t" id="txtChequeRef" style="left:1px;top:21px;width:149px;">
                    </div>
                </div>
                <div class="fp" id="AmountPanel" style="width:133px;">
                    <label class="dk-l" style="left:2px;top:2px;">Amount</label>
                    <input type="text" class="dk-t r" id="txtAmount" style="left:1px;top:22px;width:130px;" oninput="DBO.commas(this)">
                </div>
                <div class="fp" id="DebitAccountPanel" style="width:290px;">
                    <label class="dk-l" style="left:2px;top:1px;">Debit Account</label>
                    <span class="dk-l" id="DrBalance" hidden style="left:169px;top:2px;"></span>
                    <select id="cmbDebitAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Debit Account" style="position:absolute;left:1px;top:20px;width:288px;height:26px;" onchange="DBO.debitLeave()"></select>
                </div>
                <div class="fp tmp" id="DrTotalAmountPanel" style="width:131px;">
                    <label class="dk-l" style="left:4px;top:2px;">Dr Total Amount</label>
                    <input type="text" class="dk-t r" id="txtTotalDrAmount" style="left:1px;top:23px;width:130px;" oninput="DBO.commas(this)">
                </div>
                <div class="fp sub" id="DebitSubsidiaryAccountPanel" style="width:172px;">
                    <label class="dk-l" style="left:1px;top:1px;">Debit Subsidiary Account</label>
                    <select id="CmbDrSubsidiaryAccount" class="dtcombo" data-dtcombo="gdSubsidiary4" data-dtcombo-caption="Account Title" style="position:absolute;left:1px;top:20px;width:171px;height:26px;" onchange="DBO.subPicked('dr')"></select>
                </div>
                <div class="fp" id="DrRemarksPanel" style="width:329px;">
                    <label class="dk-l" style="left:1px;top:2px;">Debit Remarks</label>
                    <input type="text" class="dk-t" id="txtDrRemarks" style="left:1px;top:23px;width:328px;">
                </div>
                <div class="fp" id="ButtonsPanel" style="width:138px;">
                    <button type="button" class="dk-btn b" id="btnAddDetail" style="left:1px;top:19px;width:46px;height:27px;" onclick="DBO.addDetail()">+</button>
                    <button type="button" class="dk-btn b" id="btnUpdateDetail" hidden style="left:1px;top:19px;width:68px;height:27px;" onclick="DBO.updateDetail()">Update </button>
                    <button type="button" class="dk-btn b" id="btnCancelDetail" hidden style="left:68px;top:19px;width:66px;height:27px;" onclick="DBO.cancelDetail()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <!-- grdDetail Dock=Fill -->
    <div class="dk-grid" tabindex="-1" style="min-height:208px;"><table data-gridbar="DayBookOffset:grdDetail" class="g" id="grdDetail" data-colw='{"Delete":50}'></table></div>
</div>

<!-- ====================================================== tabPage2 "History" -->
<div class="dk-page" id="pageHistory" hidden style="width:1248px;">
    <!-- panel10 -->
    <div class="dk-dock" style="height:29px;">
        <div class="dk-ts">
            <button type="button" class="dk-tsb" id="btnPrint144" onclick="DBO.print144()" data-rpt="144-DayBookSlip.rpt"><i class="fa fa-print"></i><span>144-Print</span></button>
            <button type="button" class="dk-tsb" id="btnRefreshHistory" onclick="DBO.loadVoucherDates()"><i class="fa fa-refresh g"></i><span>Refresh</span></button>
        </div>
    </div>
    <!-- panel11 -->
    <div class="dk-dock dk-teal" style="height:33px;"><span class="dk-cap" style="left:7px;top:7px;">DAY BOOK HISTORY</span></div>
    <!-- panel5 -->
    <div class="dk-dock" style="height:57px;">
        <label class="dk-l" style="left:5px;top:5px;">Voucher Date</label>
        <select id="datVouchderDateForHistory" class="dtcombo" data-dtcombo-caption="Voucher Date" style="position:absolute;left:5px;top:26px;width:178px;height:26px;"></select>
        <label class="dk-l" style="left:187px;top:5px;">Cash Account</label>
        <select id="CmbCashAccountForHistory" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="position:absolute;left:185px;top:26px;width:235px;height:26px;"></select>
        <button type="button" class="dk-btn b" id="BtnShow" style="left:420px;top:26px;width:58px;height:26px;" onclick="DBO.history()">Show</button>
        <label class="dk-chk plain" style="left:425px;top:6px;"><input type="checkbox" id="chkZkipCashTransaction"> Print Preview Without Cash Account Transactions</label>
    </div>
    <div class="dk-fill" style="min-height:412px;">
        <div class="dk-col" style="width:627px;">
            <div class="dk-bar dk-teal s12" style="height:30px;">Credit Transactions</div>
            <div class="dk-grid"><table data-gridbar="DayBookOffset:DataGridCreditHistory" class="g" id="DataGridCreditHistory" data-colw='{"Edit":50,"Print":50}'></table></div>
        </div>
        <div class="dk-col" style="width:688px;">
            <div class="dk-bar dk-teal s12" style="height:30px;">Debit Transactions</div>
            <div class="dk-grid"><table data-gridbar="DayBookOffset:DataGridDebitHistory" class="g" id="DataGridDebitHistory" data-colw='{"Edit":50,"Print":50}'></table></div>
        </div>
    </div>
</div>

</div>
<!-- tabControl1 (Alignment = Bottom) + History on the right of the footer -->
<div class="dk-tabs">
    <button type="button" class="dk-tab on" id="tabForm" onclick="DBO.tab(0)">Form</button>
    <button type="button" class="dk-tab" id="tabHistory" onclick="DBO.tab(1)">History</button>
    <button type="button" class="dk-hist" id="btnHistoryFooter" onclick="DBO.tab(1)"><i class="fa fa-history"></i> History</button>
</div>
</div>

<script th:src="@{/build/js/countx_prod_combo.js?v=20261002gd}"></script>
<script th:src="@{/build/js/countx_accounts_groupd.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_desk_d.js?v=20261002gd}"></script>
<script th:src="@{/build/js/countx_day_book_offset.js?v=20261002gd}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
