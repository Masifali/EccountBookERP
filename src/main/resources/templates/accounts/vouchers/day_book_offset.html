<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day Book (Off Set)</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Verdana, sans-serif; font-size: 12px; background: #f0f0f0; margin: 0; color: #222; }
        .tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #dcdcdc; }
        .tabs button { border: 1px solid #aaa; border-bottom: none; background: #e9e9e9; padding: 4px 16px; cursor: pointer; font-size: 12px; }
        .tabs button.on { background: #fff; font-weight: bold; }
        .page { background: #fff; border: 1px solid #aaa; margin: 0 6px 6px; padding: 4px; }
        .toolbar { display: flex; gap: 4px; padding: 3px; background: linear-gradient(#fdfdfd, #e6e6e6); border: 1px solid #c8c8c8; }
        .toolbar button { font-size: 12px; padding: 3px 10px; border: 1px solid #aaa; background: #fafafa; cursor: pointer; }
        .toolbar button:disabled { color: #999; cursor: default; }
        .strip { background: #00796b; color: #fff; font-weight: bold; font-size: 14px; padding: 4px 8px; margin-top: 3px; }
        fieldset { border: 1px solid #b5b5b5; margin: 4px 0; padding: 4px 8px 8px; }
        legend { font-weight: bold; font-size: 12px; padding: 0 4px; width: auto; }
        .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
        .fld { display: flex; flex-direction: column; }
        .fld label { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
        input[type=text], input[type=date], select, textarea { font-size: 12px; border: 1px solid #9a9a9a; padding: 2px 4px; height: 24px; box-sizing: border-box; }
        textarea { height: 78px; resize: none; }
        input[readonly], input:disabled, select:disabled { background: #eee; }
        .num { text-align: right; }
        .bar { background: #00796b; color: #fff; font-weight: bold; padding: 3px 6px; }
        .grid { border: 1px solid #aaa; overflow: auto; height: 300px; background: #fff; }
        table.g { border-collapse: collapse; width: 100%; font-size: 11px; }
        table.g th { background: #e4e4e4; border: 1px solid #b9b9b9; padding: 3px 4px; text-align: center; position: sticky; top: 0; white-space: nowrap; }
        table.g td { border: 1px solid #d3d3d3; padding: 2px 4px; white-space: nowrap; }
        table.g tr.cur td { background: #cfe5ff; }
        table.g tfoot td { font-weight: bold; background: #f3f3f3; }
        .bal { font-size: 11px; color: #004d40; font-weight: bold; margin-left: 6px; }
        .sides { display: flex; gap: 6px; }
        .side { flex: 1; min-width: 0; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="tabs">
    <button type="button" id="tabForm" class="on" onclick="DBO.tab(0)">Form</button>
    <button type="button" id="tabHistory" onclick="DBO.tab(1)">History</button>
</div>

<!-- ====================================================== tabPage1 "Form" -->
<div class="page" id="pageForm">
    <div class="toolbar">
        <button type="button" onclick="DBO.newForm()">New</button>
        <button type="button" onclick="DBO.refresh()">Refresh</button>
        <button type="button" id="btnsave" onclick="DBO.save(false)">Save</button>
        <button type="button" id="btnUpdate" hidden onclick="DBO.save(true)">Update</button>
        <button type="button" disabled title="Attachments are not ported to the web.">Attachment</button>
        <button type="button" onclick="DBO.shortcuts()">ShortCut Keys</button>
    </div>
    <div class="strip">Day Book</div>

    <fieldset id="MainBox">
        <legend>Main</legend>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
            <div>
                <div class="row">
                    <div class="fld"><label>Vocher Code</label><input type="text" id="txtDocNo" readonly style="width:110px;"></div>
                    <div class="fld"><label>Date</label><input type="date" id="txtDocDate" style="width:130px;"></div>
                </div>
                <div class="row">
                    <div class="fld"><label>Cash Account</label>
                        <select id="cmbCashAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="width:270px;" onchange="DBO.cashLeave()"></select>
                    </div>
                </div>
                <div class="row">
                    <div class="fld"><label>Opening</label><input type="text" id="txtOpening" readonly class="num" style="width:110px;"></div>
                    <div class="fld"><label>Closing</label><input type="text" id="txtClosing" readonly class="num" style="width:130px;"></div>
                </div>
                <div class="row" id="rowTemporary" hidden>
                    <div class="fld"><label>Temporary Ac</label>
                        <select id="CmbTemporaryAccount" disabled style="width:270px;"></select>
                    </div>
                </div>
            </div>
            <div class="fld"><label>Remarks</label><textarea id="txtVoucherRemarks" style="width:319px;"></textarea></div>
            <div>
                <div class="row mc"><div class="fld"><label>Fcy Code</label>
                    <select id="cmbCurrency" style="width:130px;" onchange="DBO.currencyLeave()"></select></div></div>
                <div class="row mc"><div class="fld"><label>Exchange Rate</label>
                    <input type="text" id="txtExchangeRate" class="num" style="width:130px;" oninput="DBO.rateChanged()" onblur="DBO.rateLeave()"></div></div>
                <div class="row mc"><div class="fld"><label>Fcy Amount</label>
                    <input type="text" id="txtFcyAmount" class="num" disabled style="width:130px;"></div></div>
            </div>
            <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:4px;">
                <label><input type="checkbox" id="ChkBoxPrintPreview" checked> Print Preview</label>
                <label><input type="checkbox" id="chkformat2"> Preview Format II</label>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Detail</legend>
        <div class="row">
            <div class="fld tmp"><label>Sub Code</label><input type="text" id="txtSubCode" readonly style="width:74px;"></div>
            <div class="fld"><label>Credit Account <span class="bal" id="CrBalance" hidden></span></label>
                <select id="cmbCreditAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Credit Account" style="width:288px;" onchange="DBO.creditLeave()"></select>
            </div>
            <div class="fld sub"><label>Credit Subsidiary Account</label>
                <select id="CmbCrSubsidiaryAccount" class="dtcombo" data-dtcombo="gdSubsidiary" data-dtcombo-caption="Account Title" style="width:168px;" onchange="DBO.subPicked('cr')"></select>
            </div>
            <div class="fld tmp"><label>Cr Total Amount</label><input type="text" id="txtTotalCrAmount" class="num" style="width:126px;" oninput="DBO.commas(this)"></div>
            <div class="fld"><label>Credit Remarks</label><input type="text" id="txtCrRemarks" style="width:324px;" onblur="DBO.crRemarksLeave()"></div>
            <div class="fld" id="pnlChequeNo"><label>Cheque No</label><select id="CmbChequeNo" style="width:150px;"></select></div>
            <div class="fld" id="pnlChequeRef"><label>Cheque Ref</label><input type="text" id="txtChequeRef" style="width:150px;"></div>
            <div class="fld"><label>Amount</label><input type="text" id="txtAmount" class="num" style="width:130px;" oninput="DBO.commas(this)"></div>
        </div>
        <div class="row">
            <div class="fld"><label>Debit Account <span class="bal" id="DrBalance" hidden></span></label>
                <select id="cmbDebitAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Debit Account" style="width:288px;" onchange="DBO.debitLeave()"></select>
            </div>
            <div class="fld tmp"><label>Dr Total Amount</label><input type="text" id="txtTotalDrAmount" class="num" style="width:126px;" oninput="DBO.commas(this)"></div>
            <div class="fld sub"><label>Debit Subsidiary Account</label>
                <select id="CmbDrSubsidiaryAccount" class="dtcombo" data-dtcombo="gdSubsidiary" data-dtcombo-caption="Account Title" style="width:168px;" onchange="DBO.subPicked('dr')"></select>
            </div>
            <div class="fld"><label>Debit Remarks</label><input type="text" id="txtDrRemarks" style="width:324px;"></div>
            <button type="button" id="btnAddDetail" onclick="DBO.addDetail()">+</button>
            <button type="button" id="btnUpdateDetail" hidden onclick="DBO.updateDetail()">Update </button>
            <button type="button" id="btnCancelDetail" hidden onclick="DBO.cancelDetail()">Cancel</button>
        </div>
    </fieldset>
    <div class="grid"><table class="g" id="grdDetail"></table></div>
</div>

<!-- ====================================================== tabPage2 "History" -->
<div class="page" id="pageHistory" hidden>
    <div class="toolbar">
        <button type="button" id="btnPrint144" onclick="DBO.print144()" data-rpt="144-DayBookSlip.rpt">144-Print</button>
        <button type="button" onclick="DBO.loadVoucherDates()">Refresh</button>
    </div>
    <div class="strip">DAY BOOK HISTORY</div>
    <div class="row" style="margin-top:4px;">
        <div class="fld"><label>Voucher Date</label><select id="datVouchderDateForHistory" style="width:178px;"></select></div>
        <div class="fld"><label>Cash Account</label>
            <select id="CmbCashAccountForHistory" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="width:235px;"></select>
        </div>
        <button type="button" onclick="DBO.history()">Show</button>
        <label><input type="checkbox" id="chkZkipCashTransaction"> Print Preview Without Cash Account Transactions</label>
    </div>
    <div class="sides">
        <div class="side"><div class="bar">Credit Transactions</div><div class="grid" style="height:560px;"><table class="g" id="DataGridCreditHistory"></table></div></div>
        <div class="side"><div class="bar">Debit Transactions</div><div class="grid" style="height:560px;"><table class="g" id="DataGridDebitHistory"></table></div></div>
    </div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_accounts_groupd.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_day_book_offset.js?v=20260930s}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
