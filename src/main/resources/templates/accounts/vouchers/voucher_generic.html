<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Voucher - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 24px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 12px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -15px -15px 15px -15px;
        }

        .erp-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            background: #eceff1;
            padding: 6px;
            border: 1px solid #cfd8dc;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
        }

        .erp-form-group {
            margin-bottom: 10px;
        }

        .erp-form-group label {
            font-weight: bold;
            color: #37474f;
            margin-bottom: 3px;
            display: block;
        }

        .erp-input {
            width: 100%;
            height: 28px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid #b0bec5;
            border-radius: 2px;
        }

        .erp-input:focus {
            border-color: #00796B;
            outline: none;
            box-shadow: 0 0 4px rgba(0,121,107,0.4);
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: 600;
            border: 1px solid #004d40;
            text-align: left;
        }

        .erp-table td {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
        }

        .erp-table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .erp-table tbody tr:hover {
            background-color: #e0f2f1;
        }
    </style>
</head>
<body>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-arrow-right" style="margin-right:8px;"></i> Golden Ace ERP</div>
        <div class="header-item"><i class="fa fa-user" style="margin-right:6px;"></i> Numan Rasheed (Admin)</div>
        <div class="header-item" style="margin-left:auto; color:#ffeb3b;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <i class="fa fa-window-maximize" style="margin-right: 6px;"></i>
        <span>Screens &gt; Accounts &gt; <strong th:text="${moduleTitle}">Voucher</strong></span>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header">
                <span th:text="${moduleTitle}"><i class="fa fa-book"></i> Voucher Entry</span>
                <span style="font-size:12px; font-weight:normal; background:#004d40; padding:2px 8px; border-radius:2px;">C# WinForms ERP Mode</span>
            </div>

            <!-- Toolbar Buttons -->
            <div class="erp-toolbar">
                <button type="button" class="btn-erp"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
                <button type="button" class="btn-erp"><i class="fa fa-save"></i> Save (Ctrl+S)</button>
                <button type="button" class="btn-erp"><i class="fa fa-trash"></i> Delete</button>
                <button type="button" class="btn-erp"><i class="fa fa-refresh"></i> Refresh (Ctrl+R)</button>
                <button type="button" class="btn-erp"><i class="fa fa-print"></i> Print (Ctrl+P)</button>
                <a th:href="@{/accounts/dashboard}" class="btn-erp" style="margin-left:auto; text-decoration:none;"><i class="fa fa-times"></i> Close</a>
            </div>

            <!-- Voucher Header Form -->
            <div class="row" style="margin-bottom:15px;">
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Voucher No</label>
                    <input type="text" class="erp-input" value="AUTO-2026-001" readonly style="background:#f5f5f5;"/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Voucher Date</label>
                    <input type="date" class="erp-input" value="2026-09-07"/>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Location / Branch</label>
                    <select class="erp-input">
                        <option>GOLDEN ACE FOODS</option>
                    </select>
                </div>
                <div class="col-md-3 col-sm-6 erp-form-group">
                    <label>Cheque / Ref No</label>
                    <input type="text" class="erp-input" placeholder="Ref No..."/>
                </div>
            </div>

            <!-- Detail Entries Table -->
            <div style="overflow-x:auto; margin-top:10px;">
                <table class="erp-table">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th style="width:150px;">Account Code</th>
                            <th>Account Title</th>
                            <th>Narration / Remarks</th>
                            <th style="width:140px; text-align:right;">Debit (PKR)</th>
                            <th style="width:140px; text-align:right;">Credit (PKR)</th>
                            <th style="width:60px; text-align:center;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td><input type="text" class="erp-input" value="15010101"/></td>
                            <td><input type="text" class="erp-input" value="Paddy Kainat 1121 Stock Account"/></td>
                            <td><input type="text" class="erp-input" value="Opening Balance Entry"/></td>
                            <td><input type="number" class="erp-input" value="0.00" style="text-align:right;"/></td>
                            <td><input type="number" class="erp-input" value="0.00" style="text-align:right;"/></td>
                            <td style="text-align:center;"><button type="button" class="btn-erp" style="padding:1px 6px; color:red; border-color:red;"><i class="fa fa-trash"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center; background:#eceff1; padding:8px 12px; border:1px solid #cfd8dc;">
                <span style="font-weight:bold; color:#00796B;">Total Voucher Amount: PKR 0.00</span>
                <span>Status: <strong style="color:green;">Ready</strong></span>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
</body>
</html>
