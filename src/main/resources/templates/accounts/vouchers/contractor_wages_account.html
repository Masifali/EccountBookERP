<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wages Account</title>

    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/select2/dist/css/select2.min.css}">
    <style>
        /* frmContractorWagesAccount.cs - ClientSize 1048 x 488, AutoScrollMinSize 1150 x 620.
           panel1 (Fill, White): panel2 (33, toolStrip1) / panel3 (26: panel6 teal 25 "Wages Account")
           / panel4 (91: groupBox1 "Filters" at 8,5 size 963 x 83) / panel5 (Fill: panel25 teal 28
           "History" + ctrlGrdWagesAccount / grdWagesAccount Fill, Verdana 8.25). */
        html, body { margin: 0; padding: 0; }
        body { font-family: Verdana, "Segoe UI", sans-serif; background: #fff; font-size: 9.75pt; color: #000; }
        *, *::before, *::after { box-sizing: border-box; }
        .cw-form { min-width: 1048px; height: max(100vh, 488px); display: flex; flex-direction: column; background: #fff; }
        .teal { background: #008080; color: #fff; }

        #panel2 { flex: 0 0 33px; }
        .tool { height: 27px; display: flex; align-items: stretch; gap: 1px; background: linear-gradient(#f7f9fb, #e3e8ee);
                border-bottom: 1px solid #c9d1da; font: 9.75pt Verdana, sans-serif; padding-left: 4px; }
        .tool button { background: none; border: 1px solid transparent; font: inherit; padding: 0 6px; cursor: pointer; color: #000;
                       display: inline-flex; align-items: center; gap: 5px; }
        .tool button .fa { font-size: 14px; }
        .tool button:hover:not(:disabled) { background: #c2e0ff; border-color: #3399ff; }
        .tool .sep { width: 1px; margin: 4px 3px; background: #b7c3cc; }
        .ic-new { color: #1e88e5; } .ic-save { color: #1565c0; } .ic-upd { color: #2e7d32; }

        #panel3 { flex: 0 0 26px; }
        #panel6 { height: 25px; position: relative; }
        #panel6 span { position: absolute; left: 5px; top: 2px; font: bold 12pt Tahoma, sans-serif; }

        #panel4 { flex: 0 0 91px; position: relative; }
        #groupBox1 { position: absolute; left: 8px; top: 5px; width: 963px; height: 83px; margin: 0; padding: 0;
                     border: 1px solid #b7c3cc; font: bold 9.75pt Tahoma, sans-serif; }
        #groupBox1 legend { padding: 0 3px; margin-left: 6px; }
        #groupBox1 .g { position: absolute; }
        .lbl { font: bold 9pt "Segoe UI Semibold", "Segoe UI", sans-serif; white-space: nowrap; }
        #txtWagesAccount { font: 9.75pt Verdana, sans-serif; height: 23px; border: 1px solid #7a9a9e; padding: 1px 3px; }
        .ck { font: bold 9pt "Segoe UI Semibold", "Segoe UI", sans-serif; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .ck input { margin: 0; }
        .ck input:disabled + span { color: #8a8a8a; }

        /* UltraCombo look for select2: 26px, square, Verdana 9.75 */
        .select2-container--default .select2-selection--single { height: 26px; border: 1px solid #7a9a9e; border-radius: 0; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 24px; font: 9.75pt Verdana, sans-serif; padding-left: 4px; }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 24px; }
        .select2-dropdown { font: 9pt Verdana, sans-serif; border-radius: 0; }

        #panel5 { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 200px; }
        #panel25 { flex: 0 0 28px; position: relative; }
        #panel25 .ttl { position: absolute; left: 3px; top: 3px; font: bold 12pt Tahoma, sans-serif; }
        #panel25 .gear { position: absolute; right: 3px; top: 2px; width: 41px; height: 24px; background: #fff; border: 1px solid #c8d0d8;
                         color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 13px; }
        #panel25 .gear .fa-caret-down { font-size: 10px; }
        .gear-menu { position: absolute; right: 3px; top: 27px; background: #fff; border: 1px solid #888; box-shadow: 0 3px 10px rgba(0,0,0,.25);
                     z-index: 40; font: 9pt "Segoe UI", sans-serif; min-width: 140px; }
        .gear-menu div { padding: 4px 10px; cursor: pointer; }
        .gear-menu div:hover { background: #cce8ff; }

        #cwGridBox { flex: 1 1 auto; overflow: auto; background: #fff; }
        .grid { border-collapse: collapse; font: 8.25pt Verdana, sans-serif; table-layout: fixed; }
        .grid th { background: linear-gradient(to bottom, #f6f9fd 0%, #dbe7f5 100%); color: #1f4e8c; border: 1px solid #a7bcd6;
                   padding: 3px 4px; text-align: center; font-weight: normal; position: sticky; top: 0; z-index: 2; height: 30px; }
        .grid td { border: 1px dotted #b7c7da; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 17px; }
        .grid tbody tr { cursor: pointer; }
        .grid tbody tr.selected td { background: #cce8ff; }
        .grid tfoot td { border: 1px solid #a7bcd6; height: 17px; background: #f3f6fa; }
        #cwGridBox.cw-fullscreen { position: fixed; inset: 0; z-index: 3000; padding: 6px; }

        #cwMessage { display: none; position: fixed; right: 12px; bottom: 12px; z-index: 5000; padding: 6px 12px; font: bold 9pt "Segoe UI", sans-serif;
                     box-shadow: 0 3px 10px rgba(0,0,0,.2); }
        #cwMessage.ok  { display: block; background: #e6f4ea; color: #0a6b2e; border: 1px solid #a8d5b5; }
        #cwMessage.err { display: block; background: #fdecea; color: #a3160b; border: 1px solid #f0b3ad; }
        #lblRecordCount { display: none; }

        .btn-busy { opacity: .6; pointer-events: none; }
        .sc-modal { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 6000; display: flex; align-items: center; justify-content: center; }
        .sc-dlg { background: #fff; border: 1px solid #555; box-shadow: 0 6px 24px rgba(0,0,0,.4); font: 9pt "Segoe UI", sans-serif; }
        .sc-dlg .cap { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: #008080; color: #fff; font-weight: bold; }
        .sc-dlg .cap button { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .sc-dlg table { border-collapse: collapse; margin: 8px; }
        .sc-dlg th, .sc-dlg td { border: 1px solid #ccc; padding: 3px 10px; text-align: left; }
        .sc-dlg th { background: #eef2f5; }
    </style>
</head>
<body>
<div class="cw-form" id="frmContractorWagesAccount">
    <div id="panel2">
        <div class="tool" id="toolStrip1">
            <button type="button" id="btnRefresh" onclick="cwRefresh()"><i class="fa fa-refresh"></i><u>R</u>efresh&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
            <span class="sep"></span>
            <button type="button" id="btnNew" onclick="cwNew()"><i class="fa fa-plus-circle ic-new"></i><u>N</u>ew</button>
            <button type="button" id="btnSave" onclick="cwSave()"><i class="fa fa-floppy-o ic-save"></i><u>S</u>ave</button>
            <button type="button" id="btnUpdate" onclick="cwUpdate()" style="display:none;"><i class="fa fa-check-circle ic-upd"></i><u>U</u>pdate</button>
            <span class="sep"></span>
            <button type="button" id="btnShortcutKeys" onclick="cwShortcutKeys()"><i class="fa fa-key"></i>ShortCut Keys</button>
        </div>
    </div>

    <div id="panel3"><div id="panel6" class="teal"><span>Wages Account</span></div></div>

    <div id="panel4">
        <fieldset id="groupBox1">
            <legend>Filters</legend>
            <span class="g lbl" style="left:6px; top:12px;">Labour / Wages Activity</span>
            <input type="text" id="txtWagesAccount" class="g" maxlength="200" style="left:6px; top:34px; width:200px;" tabindex="1">

            <span class="g lbl" style="left:212px; top:13px;">Activity Type</span>
            <div class="g" style="left:209px; top:32px; width:203px;">
                <select id="cmbWagesType" class="cw-searchable" style="width:100%;" tabindex="2"><option value="0"></option></select>
            </div>

            <span class="g lbl" style="left:414px; top:13px;">Activity Nature</span>
            <div class="g" style="left:414px; top:32px; width:203px;">
                <select id="cmbActivityNature" class="cw-searchable" style="width:100%;" tabindex="3"><option value="0"></option></select>
            </div>

            <span class="g lbl" style="left:619px; top:13px;">Gl Account</span>
            <div class="g" style="left:619px; top:32px; width:263px;">
                <select id="cmbGlAccount" class="cw-searchable" style="width:100%;" tabindex="4"><option value="0"></option></select>
            </div>

            <!-- reset() leaves IsActive checked AND disabled on a new record (form :258-260);
                 grdWagesAccount_DoubleClick enables it when a record is loaded (form :383). -->
            <label class="g ck" style="left:886px; top:35px;"><input type="checkbox" id="chkIsActive" checked disabled><span>Is Active</span></label>
        </fieldset>
    </div>

    <div id="panel5">
        <div id="panel25" class="teal">
            <span class="ttl">History</span>
            <button type="button" class="gear" id="ctrlGrdWagesAccount" onclick="cwGearMenu()" title="Grid options">
                <i class="fa fa-cog"></i><i class="fa fa-caret-down"></i>
            </button>
            <div class="gear-menu" id="gearMenu" style="display:none;">
                <div onclick="cwToggleFullscreen(); cwGearMenu();">Full screen</div>
            </div>
        </div>
        <div id="cwGridBox">
            <table class="grid" id="grdWagesAccount">
                <colgroup>
                    <col style="width:320px"><col style="width:150px"><col style="width:100px"><col style="width:300px"><col style="width:70px">
                </colgroup>
                <thead>
                    <tr>
                        <th>Labour / Wages Activity</th>
                        <th>Activity Type</th>
                        <th>Activity Nature</th>
                        <th>Gl Account</th>
                        <th>Is Active</th>
                    </tr>
                </thead>
                <tbody id="grdWagesAccountBody">
                    <tr><td colspan="5" style="text-align:center; color:#777;">Loading…</td></tr>
                </tbody>
                <tfoot><tr><td></td><td></td><td></td><td></td><td></td></tr></tfoot>
            </table>
        </div>
    </div>
    <span id="lblRecordCount">0 of 0</span>
    <div id="cwMessage"></div>
</div>

<script>
    function cwGearMenu() {
        var m = document.getElementById('gearMenu');
        m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }
    /* MakeShortCutKeys, form :509-525 - the desktop's own rows. */
    function cwShortcutKeys() {
        var rows = [['Ctrl+S', 'For show data'], ['Ctrl+E', 'For Close'], ['Ctrl+R', 'For Refresh'], ['Ctrl+N', 'For New'],
                    ['Ctrl+P', 'For Print'], ['Ctrl+F5', 'For Focus on Date Type'], ['Ctrl+alt', 'To Show ShortCut Date Type'],
                    ['Ctrl+ArrowDown', 'For Focus On Grid']];
        var m = document.createElement('div');
        m.className = 'sc-modal';
        m.innerHTML = '<div class="sc-dlg"><div class="cap">ShortCut Keys<button type="button">&times;</button></div><table>'
            + '<tr><th>KeyCombination</th><th>Description</th></tr>'
            + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table></div>';
        document.body.appendChild(m);
        function close() { m.remove(); document.removeEventListener('keydown', key, true); }
        function key(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } }
        document.addEventListener('keydown', key, true);
        m.querySelector('button').addEventListener('click', close);
        m.addEventListener('click', function (e) { if (e.target === m) close(); });
    }
</script>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/select2/dist/js/select2.full.min.js}"></script>
<script th:src="@{/build/js/countx_contractor_wages_account.js?v=20260929a}"></script>
</body>
</html>
