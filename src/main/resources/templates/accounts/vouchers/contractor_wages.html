<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contractor Wages Account - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; font-size: 11px; color: #333; margin: 0; padding: 0; }
        .erp-header { background-color: #00796B; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .erp-toolbar { background-color: #e2e8f0; border-bottom: 1px solid #cbd5e1; padding: 4px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-erp { background-color: #ffffff; border: 1px solid #94a3b8; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #1e293b; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .btn-erp:hover { background-color: #f1f5f9; border-color: #64748b; text-decoration: none; }
        .btn-erp-primary { background-color: #00796B; color: white; border: 1px solid #004d40; }
        .btn-erp-primary:hover { background-color: #004d40; color: white; }
        .btn-erp-danger { background-color: #dc2626; color: white; border: 1px solid #991b1b; }
        .btn-erp-danger:hover { background-color: #991b1b; color: white; }
        .erp-fieldset { background: white; border: 1px solid #cbd5e1; border-radius: 3px; padding: 10px; margin-bottom: 10px; }
        .erp-fieldset legend { font-size: 11px; font-weight: bold; color: #00796B; width: auto; padding: 0 4px; margin-bottom: 6px; border: none; }
        .form-label-erp { font-weight: 600; color: #334155; margin-bottom: 2px; font-size: 11px; }
        .form-control-erp { border: 1px solid #94a3b8; border-radius: 2px; padding: 2px 6px; font-size: 11px; height: 24px; box-sizing: border-box; background-color: #fff; width: 100%; }
        .form-control-erp:focus { border-color: #00796B; outline: none; }
        .erp-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
        .erp-table th { background-color: #00796B; color: white; padding: 5px 6px; text-align: left; border: 1px solid #004d40; font-weight: 600; }
        .erp-table td { padding: 3px 6px; border: 1px solid #cbd5e1; vertical-align: middle; }
        .erp-table tr:nth-child(even) { background-color: #f8fafc; }
        .totals-bar { background: #e0f2f1; font-weight: bold; color: #004d40; font-size: 12px; padding: 6px 12px; border: 1px solid #00796B; border-radius: 2px; display: flex; justify-content: space-between; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="erp-header">
        <div><i class="fa fa-book"></i> Contractor Wages Account</div>
        <div><a href="/accounts/dashboard" style="color: white; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Back to Accounts Dashboard</a></div>
    </div>
    <div class="erp-toolbar">
        <button type="button" class="btn-erp"><i class="fa fa-file-o"></i> New (Ctrl+N)</button>
        <button type="button" class="btn-erp btn-erp-primary"><i class="fa fa-save"></i> Save (Ctrl+S)</button>
        <button type="button" class="btn-erp"><i class="fa fa-refresh"></i> Refresh</button>
        <button type="button" class="btn-erp"><i class="fa fa-print"></i> Print Voucher</button>
        <button type="button" class="btn-erp btn-erp-danger"><i class="fa fa-trash"></i> Delete</button>
    </div>
    <div style="padding: 10px;">
        <form id="voucherForm">
            <div class="erp-fieldset">
                <legend>Voucher Header Information</legend>
                <div class="row">
                    <div class="col-md-2">
                        <label class="form-label-erp">Voucher No</label>
                        <input type="text" class="form-control-erp" value="CWA-2026-0001" readonly/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-erp">Voucher Date</label>
                        <input type="date" class="form-control-erp" value="2026-09-07"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label-erp">Ref / Manual Bill No</label>
                        <input type="text" class="form-control-erp" placeholder="Reference No"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Account Title / Cash & Bank</label>
                        <select class="form-control-erp">
                            <option value="">-- Select Cash/Bank Account --</option>
                            <option value="1">101001 - CASH IN HAND</option>
                            <option value="2">101002 - MAIN BANK ACCOUNT</option>
                            <option value="3">101003 - PETTY CASH ACCOUNT</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-erp">Location / Branch</label>
                        <select class="form-control-erp">
                            <option value="1">GOLDEN ACE FOODS (PVT) LTD</option>
                        </select>
                    </div>
                </div>
                
                <div class="row" style="margin-top: 6px;">
                    <div class="col-md-12">
                        <label class="form-label-erp">Narration / Remarks</label>
                        <input type="text" class="form-control-erp" placeholder="Enter transaction narration or remarks..."/>
                    </div>
                </div>
            </div>

            <div class="erp-fieldset">
                <legend>Transaction Details Grid</legend>
                <table class="erp-table">
                    <thead>
                        <tr>
                            <th style="width: 5%;">Sr #</th>
                            <th style="width: 25%;">Account Title</th>
                            <th style="width: 35%;">Particulars / Line Remarks</th>
                            <th style="width: 15%; text-align: right;">Debit Amount</th>
                            <th style="width: 15%; text-align: right;">Credit Amount</th>
                            <th style="width: 5%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="lineItemsBody">
                        <tr>
                            <td style="text-align: center;">1</td>
                            <td>
                                <select class="form-control-erp">
                                    <option value="">-- Select Account --</option>
                                    <option value="101">401001 - OFFICE EXPENSES</option>
                                    <option value="102">401002 - UTILITIES EXPENSES</option>
                                    <option value="103">201001 - SUNDRY CREDITORS</option>
                                </select>
                            </td>
                            <td><input type="text" class="form-control-erp" placeholder="Particulars..."/></td>
                            <td><input type="number" step="0.01" class="form-control-erp line-debit" value="0.00" style="text-align: right;"/></td>
                            <td><input type="number" step="0.01" class="form-control-erp line-credit" value="0.00" style="text-align: right;"/></td>
                            <td style="text-align: center;"><button type="button" class="btn-erp btn-erp-danger" style="padding: 1px 6px;">&times;</button></td>
                        </tr>
                    </tbody>
                </table>
                <div style="margin-top: 8px;">
                    <button type="button" class="btn-erp" onclick="addRow()"><i class="fa fa-plus"></i> Add Row</button>
                </div>
                <div class="totals-bar">
                    <div>Total Debit: <span id="lblTotalDebit">0.00</span></div>
                    <div>Total Credit: <span id="lblTotalCredit">0.00</span></div>
                    <div>Difference: <span id="lblDiff">0.00</span></div>
                </div>
            </div>
        </form>
    </div>
    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        function updateTotals() {
            let totDebit = 0, totCredit = 0;
            $('.line-debit').each(function() { totDebit += parseFloat($(this).val() || 0); });
            $('.line-credit').each(function() { totCredit += parseFloat($(this).val() || 0); });
            $('#lblTotalDebit').text(totDebit.toFixed(2));
            $('#lblTotalCredit').text(totCredit.toFixed(2));
            const diff = Math.abs(totDebit - totCredit);
            $('#lblDiff').text(diff.toFixed(2));
        }

        function reindexRows() {
            $('#lineItemsBody tr').each(function(i) {
                $(this).find('td:first').text(i + 1);
            });
            updateTotals();
        }

        function addRow() {
            const count = $('#lineItemsBody tr').length + 1;
            const tr = `
                <tr>
                    <td style="text-align: center;">${count}</td>
                    <td>
                        <select class="form-control-erp">
                            <option value="">-- Select Account --</option>
                            <option value="101">401001 - OFFICE EXPENSES</option>
                            <option value="102">401002 - UTILITIES EXPENSES</option>
                            <option value="103">201001 - SUNDRY CREDITORS</option>
                        </select>
                    </td>
                    <td><input type="text" class="form-control-erp" placeholder="Particulars..."/></td>
                    <td><input type="number" step="0.01" class="form-control-erp line-debit" value="0.00" style="text-align: right;" onchange="updateTotals()"/></td>
                    <td><input type="number" step="0.01" class="form-control-erp line-credit" value="0.00" style="text-align: right;" onchange="updateTotals()"/></td>
                    <td style="text-align: center;"><button type="button" class="btn-erp btn-erp-danger" style="padding: 1px 6px;" onclick="removeRow(this)">&times;</button></td>
                </tr>
            `;
            $('#lineItemsBody').append(tr);
            updateTotals();
        }

        function removeRow(btn) {
            if ($('#lineItemsBody tr').length > 1) {
                $(btn).closest('tr').remove();
                reindexRows();
            } else {
                alert('At least one line item row is required.');
            }
        }

        $(document).on('input change', '.line-debit, .line-credit', function() {
            updateTotals();
        });

        $(document).keydown(function(e) {
            if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
                e.preventDefault();
                location.reload();
            } else if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                alert('Voucher saved successfully.');
            }
        });
    </script>
</body>
</html>
