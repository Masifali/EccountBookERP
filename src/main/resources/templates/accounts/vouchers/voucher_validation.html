<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voucher Validation</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_acc_rpt_f.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260930s}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260930s}">
</head>
<!--
  Screen 83 "Voucher Validation" - Architecture.WinApp.Account_Reports.VoucherValidation (route /accounts/vouchers/voucher-validation).
  Load: RdAll; AllowEditOnVoucherNoinReports; MultiLanguagesGetAll (hidden, Ctrl+L), VouchertypeFill (checked list -> multi),
  GetAllDetailAccount, CustomeGroupsDefine(1); fromdate = Now, todate keeps today. Nothing runs until Show.
  Show (btnshow_Click): VoucherReports.VoucherValidationReport -> Sp_Accounts_VouchersValidation_Rpt through
  /accounts/api/voucher-validation/report (VoucherValidationService: @UserId, doc or entry dates, doc-no range, account,
  custom group, @DocumentTypeIds as the desktop builds it (",id,id"), @IsApproved unless All, @ManualBillNo, @IsCGS, @LanguageId).
  Grid (GridSettings): grouped on VoucherCode (V.Code), Debit/Credit summed in stringFormatsingle, AccountCode -> General Ledger,
  V.Code -> the voucher when AllowEditOnVoucherNoinReports.
-->
<body class="accf">
<div class="win-title-bar">
    <span><i class="fa fa-check-square-o"></i> Voucher Validation</span>
    <a href="/accounts/dashboard"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
</div>
<div class="win-toolbar">
    <button type="button" class="win-btn" onclick="resetForm()"><i class="fa fa-plus text-success"></i> Reset</button>
    <button type="button" class="win-btn" onclick="refreshForm()"><i class="fa fa-refresh text-primary"></i> Refresh</button>
    <button type="button" class="win-btn" onclick="window.print()" data-rpt="115-AcRptVoucherValidation.rpt"><i class="fa fa-print"></i> 115-Print</button>
    <button type="button" class="win-btn" onclick="window.print()" data-rpt="119-AcRptVoucherValidation2.rpt"><i class="fa fa-print"></i> 119-Print</button>
</div>
<div class="win-header-panel">
    <span>Voucher Validation</span>
    <label class="vv-lang hidden-ctl">Language <select id="CmbLanguage" class="inp" style="width:170px;" data-dtcombo-caption="Language Name"></select></label>
</div>

<div class="filters">
    <div class="gb" style="width:620px;">
        <span class="gb-title">Filters</span>
        <div class="fgrid" style="grid-template-columns: 95px 150px 80px 1fr;">
            <span class="lbl">From Date</span><input type="date" id="fromdate" class="inp">
            <span class="lbl">Manual No</span><input type="text" id="txtManualNo" class="inp">

            <span class="lbl">To Date</span><input type="date" id="todate" class="inp">
            <span class="lbl">Account Title</span><select id="CmbAccountTitle" class="inp" data-dtcombo-caption="AccountTitle"></select>

            <span class="lbl">Document Type</span><select id="cmbdoctype" class="inp" multiple></select>
            <span class="lbl">Custom Group</span><select id="CmbCustomGroup" class="inp" data-dtcombo-caption="Custome Group"></select>

            <span class="lbl">Doc No From &amp; To</span>
            <span style="display:flex; gap:4px;"><input type="text" id="txtdocnofrom" class="inp"><input type="text" id="txtdocnoto" class="inp"></span>
            <span></span>
            <span style="text-align:right;"><button type="button" id="button1" class="win-btn-show" onclick="btnshow_Click()"><i class="fa fa-eye"></i> Show</button></span>
        </div>
    </div>
    <div class="gb">
        <span class="gb-title">Approval</span>
        <div class="fcol" style="gap:5px; margin-top:3px;">
            <label class="chk"><input type="radio" id="rdApproved" name="rdApproval" value="Approved"> Approved</label>
            <label class="chk"><input type="radio" id="RdUnApproved" name="rdApproval" value="UnApproved"> Un Approved</label>
            <label class="chk"><input type="radio" id="RdAll" name="rdApproval" value="All" checked> All</label>
            <label class="chk"><input type="checkbox" id="chkSkipCgs"> Skip CGS Entries</label>
        </div>
    </div>
    <div class="gb">
        <span class="gb-title">Filter Type</span>
        <div class="fcol" style="gap:5px; margin-top:3px;">
            <label class="chk"><input type="radio" id="rdDocFromToDate" name="rdFilterType" value="DocDate" checked> Doc Date</label>
            <label class="chk"><input type="radio" id="rdEntryFromToDate" name="rdFilterType" value="EntryDate"> Entry Date</label>
        </div>
    </div>
</div>

<div class="grid-caption"><span>History</span><span id="lblStatusText"></span></div>
<div class="grid-wrap"><table class="wg" id="grd"></table></div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_doc_link.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_acc_rpt_f.js?v=20260930s}"></script>
<script>
    let VV_CTX = null, vvRows = [];
    function pick(r, a, b) { return r[a] !== undefined ? r[a] : r[b]; }

    async function fillLists() {
        AccF.fillSelect('#CmbLanguage', await AccF.lookup('languages'), 'Id', 'LanguageDescription', '');
        AccF.fillSelect('#cmbdoctype', await AccF.lookup('document-types'), 'Id', 'DocumentTypeDescription', null);
        AccF.fillSelect('#CmbAccountTitle', await AccF.lookup('detail-accounts'), 'Id', 'AccountTitle', '');
        AccF.fillSelect('#CmbCustomGroup', await AccF.lookup('custom-groups'), 'Id', 'AcLookUpsDescription', '');
    }

    function btnshow_Click() {
        const ids = AccF.selectedIds('#cmbdoctype');
        const lang = $('#CmbLanguage').val();
        const req = {
            fromDate: $('#fromdate').val(), toDate: $('#todate').val(),
            manualNo: $('#txtManualNo').val(),
            accountId: $('#CmbAccountTitle').val() ? parseInt($('#CmbAccountTitle').val(), 10) : null,
            /* btnshow_Click builds DocumentTypeIds as "," + id for every checked row -> ",5,6" */
            documentTypeIds: ids ? ',' + ids : null,
            customGroupId: $('#CmbCustomGroup').val() ? parseInt($('#CmbCustomGroup').val(), 10) : null,
            docNoFrom: parseInt($('#txtdocnofrom').val(), 10) || null,
            docNoTo: parseInt($('#txtdocnoto').val(), 10) || null,
            approvedFilter: $('input[name="rdApproval"]:checked').val(),
            filterType: $('input[name="rdFilterType"]:checked').val(),
            skipCgs: $('#chkSkipCgs').is(':checked'),
            languageId: lang ? parseInt(lang, 10) : null
        };
        const btn = $('#button1');
        AccF.busy(btn, true);
        $.ajax({ url: '/accounts/api/voucher-validation/report', type: 'POST', contentType: 'application/json', data: JSON.stringify(req), dataType: 'json' })
            .done(function (res) {
                if (res && res.success === false) { vvRows = []; render(); alert(res.message || 'Unable to load Voucher Validation Report.'); return; }
                vvRows = (res && res.data) || [];
                render();
            })
            .fail(function (x) {
                vvRows = []; render();
                alert((x.responseJSON && x.responseJSON.message) || 'Unable to load Voucher Validation Report.');
            })
            .always(function () { AccF.busy(btn, false); });
    }

    /* GridSettings */
    function render() {
        const voucherLink = VV_CTX && VV_CTX.allowEditOnVoucherNoinReports;
        const rows = vvRows.map(function (r) {
            return {
                Id: pick(r, 'id', 'Id'), AccountId: pick(r, 'accountId', 'AccountId'), DocumentType: pick(r, 'documentType', 'DocumentType'),
                DocumentTypeId: pick(r, 'documentTypeId', 'DocumentTypeId'), DocumentTypeSrNo: pick(r, 'documentTypeSrNo', 'DocumentTypeSrNo'),
                VoucherCode: pick(r, 'voucherCode', 'VoucherCode'), VoucherDate: pick(r, 'voucherDate', 'VoucherDate'),
                AccountCode: pick(r, 'accountCode', 'AccountCode'), AccountTitle: pick(r, 'accountTitle', 'AccountTitle'),
                AccountTitleCoag: pick(r, 'offsetAccount', 'OffsetAccount'),
                DebitAmount: pick(r, 'debitAmount', 'DebitAmount'), CreditAmount: pick(r, 'creditAmount', 'CreditAmount'),
                ChequeNo: pick(r, 'chequeNo', 'ChequeNo'), ManualBillNo: pick(r, 'manualBillNo', 'ManualBillNo'),
                RefInvoiceNo: pick(r, 'refInvoiceNo', 'RefInvoiceNo'), Comments: pick(r, 'comments', 'Comments'),
                NoOfAttachments: pick(r, 'noOfAttachments', 'NoOfAttachments'), print: 'print'
            };
        });
        AccF.renderGrid({
            table: '#grd', rows: rows, emptyText: '', groupBy: 'VoucherCode', groupCaption: 'V.Code', groupTotals: true,
            columns: [
                { key: 'DocumentType' },
                { key: 'VoucherDate' },
                { key: 'AccountCode', link: function (r) { AccF.openLedger(r.AccountId, $('#fromdate').val(), $('#todate').val()); } },
                { key: 'AccountTitle' },
                { key: 'AccountTitleCoag', caption: 'Offset Account' },
                { key: 'DebitAmount', type: 'single', sum: true },
                { key: 'CreditAmount', type: 'single', sum: true },
                { key: 'ChequeNo' }, { key: 'ManualBillNo' }, { key: 'RefInvoiceNo' },
                { key: 'Comments', wrap: true },
                { key: 'NoOfAttachments', align: 'c' },
                { key: 'print', caption: 'print', align: 'c' }
            ]
        });
        if (voucherLink) {
            $('#grd tr.grp').each(function () {
                const $td = $(this).find('td').first();
                const code = $td.text().replace(/^.*V\.Code:\s*/, '').replace(/\s*\(\d+\)\s*$/, '');
                const first = rows.find(function (r) { return String(r.VoucherCode) === code; });
                if (!first) return;
                $td.append($('<a class="lnk" style="margin-left:8px;">').text('open').on('click', function (e) {
                    e.preventDefault(); e.stopPropagation(); AccF.editLinked(first.DocumentTypeId, first.Id, first.DocumentTypeSrNo, 0);
                }));
            });
        }
        $('#lblStatusText').text(vvRows.length ? 'Records: ' + vvRows.length : '');
    }

    /* VoucherValidation.reset(): doc-no range, Account Title and Custom Group cleared, RdAll; nothing re-run */
    function resetForm() {
        $('#txtdocnofrom, #txtdocnoto').val('');
        $('#CmbAccountTitle, #CmbCustomGroup').val('');
        $('#RdAll').prop('checked', true);
        $('#cmbdoctype').focus();
    }
    /* btnRefresh_Click: the four fills again */
    async function refreshForm() { try { await fillLists(); } catch (e) { alert(e.message); } }

    $(document).on('keydown', function (e) {
        if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); $('.vv-lang').removeClass('hidden-ctl'); AccF.focus('#CmbLanguage'); }
        if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); resetForm(); }
    });

    $(function () { (async function () {
        $('#fromdate').val(AccF.today());
        $('#todate').val(AccF.today());
        try {
            VV_CTX = await AccF.context();
            await fillLists();
            document.getElementById('fromdate').focus();
        } catch (e) { alert(e.message); }
    })(); });
</script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
