<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Journal Voucher</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_voucher.css?v=20260930s}">
    <!--
      Screen 19 "Jounal Voucher" (ScreenDefinition 19, ScreenName VoucherEntry, TargetUrl
      Architecture.WinApp.Account_Definition.VoucherEntry) - DocumentTypeId 5.
      Layout, captions, validations and grid behaviour follow VoucherEntry.cs; the save goes through
      /accounts/api/desktop-voucher/voucher-entry/save (the desktop's procedure chain).
    -->
</head>
<body class="dv">

<div class="dv-tabs" id="tabBar">
    <button type="button" data-tab="form" class="active">Form</button>
    <button type="button" data-tab="history">History</button>
</div>

<!-- ============================================================== FORM (tabPage1) -->
<div id="pgForm">
    <div class="dv-toolstrip">
        <button type="button" id="btnNew" title="Ctrl+N">&amp;New</button>
        <button type="button" id="btnUpdate" class="dv-hidden" title="Ctrl+U">&amp;Update</button>
        <button type="button" id="btnSave" title="Ctrl+S">&amp;Save</button>
        <button type="button" id="btnSaveAs" class="dv-hidden">SaveAs</button>
        <button type="button" id="btnRefresh" title="Ctrl+R">Refresh</button>
        <button type="button" id="btnAttachment" disabled title="Attachments are not ported to the web yet">&amp;Attachment</button>
        <button type="button" id="btnPrint" title="102 - Payment / Receipt Voucher Slip" data-rpt="102-ANewAcRptPaymentReceiptsVoucherSlip.rpt" data-rpt-need="id" data-rpt-need-msg="Save or open a voucher first.">102-Print</button>
        <button type="button" id="btnShortCutKey">ShortCut Keys</button>
    </div>
    <div class="dv-titlebar"><span>Journal Voucher</span>
        <a class="dv-right" href="/accounts/dashboard">Back to Dashboard</a></div>

    <div class="dv-page">
        <fieldset class="dv-group">
            <legend>Main</legend>
            <div class="dv-grid-form" style="grid-template-columns: 240px minmax(260px,1fr) 230px 210px;">
                <div class="dv-field">
                    <label for="cmbProject">Cost Center</label>
                    <div id="cmbProject"></div>
                    <label>Doc No &amp; Date</label>
                    <div class="dv-inline">
                        <input class="dv-in" id="txtDocNo" readonly style="width:70px">
                        <input class="dv-in" type="date" id="dtDocDate">
                    </div>
                </div>
                <div class="dv-field">
                    <label for="txtVoucherRemarks">Voucher Remarks</label>
                    <textarea class="dv-in" id="txtVoucherRemarks" rows="3"></textarea>
                </div>
                <div class="dv-field fcy">
                    <label>Fcy Code</label>
                    <div id="cmbCurrency"></div>
                    <label for="txtExchangeRate">Exchange Rate</label>
                    <input class="dv-in dv-num" id="txtExchangeRate">
                </div>
                <div class="dv-field">
                    <label class="fcy" for="txtFcyAmount">Fcy Amount</label>
                    <input class="dv-in dv-num fcy" id="txtFcyAmount" disabled>
                    <label class="dv-radio" style="margin-top:6px"><input type="checkbox" id="chkPrintPreview" checked disabled> Print Preview</label>
                </div>
            </div>
        </fieldset>

        <fieldset class="dv-group">
            <legend>Detail</legend>
            <!-- flowLayoutPanel1, first line: debit side -->
            <div class="dv-row">
                <div class="dv-field" style="width:238px">
                    <div class="dv-inline"><span class="dv-lbl">Debit Ac</span>
                        <label class="dv-radio"><input type="radio" name="rdDr" id="rdDrTitle" checked> Title</label>
                        <label class="dv-radio"><input type="radio" name="rdDr" id="rdDrCode"> Code</label>
                        <span class="dv-bal" id="lblDebitBal"></span></div>
                    <div id="cmbDebitAccount"></div>
                </div>
                <div class="dv-field sub" style="width:168px">
                    <div class="dv-inline"><span class="dv-lbl">Dr Subsidiary</span><span class="dv-bal" id="lblDrSubBal"></span></div>
                    <div id="cmbDrSubsidiary"></div>
                </div>
                <div class="dv-field" id="pnlDrComments" style="flex:1;min-width:185px">
                    <label for="txtDrRmks">Dr Comments</label>
                    <input class="dv-in" id="txtDrRmks">
                </div>
                <div class="dv-field" style="width:135px">
                    <label>Dr Job Lot</label>
                    <div id="cmbDrJobLot"></div>
                </div>
                <div class="dv-field br" style="width:147px">
                    <label>Dr Branch</label>
                    <div id="cmbDrBranch"></div>
                </div>
                <div class="dv-field cc" style="width:123px">
                    <label>Dr Cost Center</label>
                    <div id="cmbDrCostCenter"></div>
                </div>
                <div class="dv-field" style="width:184px">
                    <div class="dv-inline"><span class="dv-lbl" style="width:82px">Cheq / Ref</span><span class="dv-lbl">Amount</span></div>
                    <div class="dv-inline">
                        <input class="dv-in" id="txtCheq" style="width:82px">
                        <input class="dv-in dv-num" id="txtAmount" style="width:96px">
                    </div>
                </div>
            </div>
            <!-- second line: credit side -->
            <div class="dv-row" style="margin-top:4px">
                <div class="dv-field" style="width:238px">
                    <div class="dv-inline"><span class="dv-lbl">Credit Ac</span>
                        <label class="dv-radio"><input type="radio" name="rdCr" id="rdCrTitle" checked> Title</label>
                        <label class="dv-radio"><input type="radio" name="rdCr" id="rdCrCode"> Code</label>
                        <span class="dv-bal" id="lblCreditBal"></span></div>
                    <div id="cmbCreditAccount"></div>
                </div>
                <div class="dv-field sub" style="width:168px">
                    <div class="dv-inline"><span class="dv-lbl">Cr Subsidiary</span><span class="dv-bal" id="lblCrSubBal"></span></div>
                    <div id="cmbCrSubsidiary"></div>
                </div>
                <div class="dv-field" id="pnlCrComments" style="flex:1;min-width:185px">
                    <label for="txtCrRmks">Cr Comments</label>
                    <input class="dv-in" id="txtCrRmks">
                </div>
                <div class="dv-field" style="width:135px">
                    <label>Cr Job Lot</label>
                    <div id="cmbCrJobLot"></div>
                </div>
                <div class="dv-field br" style="width:147px">
                    <label>Cr Branch</label>
                    <div id="cmbCrBranch"></div>
                </div>
                <div class="dv-field cc" style="width:123px">
                    <label>Cr Cost Center</label>
                    <div id="cmbCrCostCenter"></div>
                </div>
                <div class="dv-inline" style="width:184px;padding-bottom:1px">
                    <button type="button" class="dv-btn dv-btn-plus" id="btnPlus" title="Add">+</button>
                    <button type="button" class="dv-btn dv-hidden" id="btnUpdateDetail">Update</button>
                    <button type="button" class="dv-btn dv-hidden" id="btnCancelDetail">Cancel</button>
                </div>
            </div>
        </fieldset>

        <div class="dv-subhead"><span>Detail</span></div>
        <div class="dv-gridwrap" style="max-height:340px">
            <table class="dv-grid" id="grd">
                <thead></thead><tbody></tbody><tfoot></tfoot>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ HISTORY (tabPage2) -->
<div id="pgHistory" class="dv-hidden">
    <div class="dv-toolstrip">
        <button type="button" id="btnNewHistory" title="Ctrl+N">&amp;Reset</button>
    </div>
    <div class="dv-titlebar"><span>Journal Voucher History</span></div>
    <div class="dv-page">
        <div class="dv-row" style="align-items:stretch">
            <fieldset class="dv-group" style="flex:1">
                <legend>Filters</legend>
                <div class="dv-row">
                    <div class="dv-field"><label>From Date</label>
                        <div class="dv-inline"><input type="checkbox" id="chkFromDate" checked><input class="dv-in" type="date" id="dtFromHistory" style="width:135px"></div></div>
                    <div class="dv-field"><label>To Date</label>
                        <div class="dv-inline"><input type="checkbox" id="chkToDate" checked><input class="dv-in" type="date" id="dtToHistory" style="width:134px"></div></div>
                    <div class="dv-field"><label for="txtFromDocNoHistory">From Doc No</label><input class="dv-in" id="txtFromDocNoHistory" style="width:100px"></div>
                    <div class="dv-field"><label for="txtToDocNoHistory">To Doc No</label><input class="dv-in" id="txtToDocNoHistory" style="width:100px"></div>
                    <div class="dv-field"><label>Approved Status</label>
                        <select class="dv-in" id="cmbApproveStatus" style="width:170px">
                            <option value="notapproved">Not Apporved</option>
                            <option value="approved">Approved</option>
                            <option value="all">All</option>
                        </select></div>
                    <button type="button" class="dv-btn" id="btnShow" title="Ctrl+S">Show</button>
                    <div class="dv-field" style="font-size:11px">
                        <label class="dv-radio"><input type="radio" name="rdHistDate" value="doc" checked> Doc Date</label>
                        <label class="dv-radio"><input type="radio" name="rdHistDate" value="entry"> Entry Date</label>
                    </div>
                    <div class="dv-field" style="font-size:11px">
                        <label class="dv-radio"><input type="radio" name="rdHistDate" value="modify"> Modify Date</label>
                        <label class="dv-radio"><input type="radio" name="rdHistDate" value="approved"> Approved Date</label>
                    </div>
                </div>
            </fieldset>
            <div class="dv-infobox dv-hidden" id="voucherInfoBox" style="align-self:center">
                <span>Total Vouchers</span><b id="lblTotalVouchers">0</b>
                <span>Approved Vouchers</span><b id="lblApprovedVouchers">0</b>
                <span>UnApproved Vouchers</span><b id="lblUnApprovedVouchers">0</b>
            </div>
        </div>
        <div class="dv-gridwrap" style="max-height:300px">
            <table class="dv-grid" id="grdHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="dv-subhead" style="margin-top:6px"><span>Detail of above selected row</span></div>
        <div class="dv-gridwrap" style="max-height:260px">
            <table class="dv-grid" id="grdDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_desktop_voucher.js?v=20260930s}"></script>
<script th:inline="none">
(function () {
    'use strict';
    var API = DV.api('voucher-entry');
    var $ = function (id) { return document.getElementById(id); };

    var ctx = null;                 // /context
    var F = { multi: false, branch: false, sub: false, booking: false };
    var amountDec = 2, rateDec = 2;
    var baseCurrency = 0, baseRate = 0;
    var accounts = [], subsidiaries = [], jobLots = [], branches = [], costCenters = [];
    var table = [];                 // the form's DataTable "table", in its own (insertion) order
    var RecId = 0;
    /* print-rpt.js reads the open voucher's id (desktop: RecId == VoucherHeadId) */
    try { Object.defineProperty(window, 'RecId', { get: function () { return RecId; }, configurable: true });
          Object.defineProperty(window, 'VoucherHeadId', { get: function () { return RecId; }, configurable: true }); } catch (e) { }

    var updateRowIndex = -1;        // the LineId of the row double-clicked for editing
    var drSubLen = 0, crSubLen = 0; // SubsdiaryAccountDr/CrDatasourceLength
    var mode = 'new';               // new | update | saveas

    // ---------------------------------------------------------------------------- combos
    var acCols = [{ key: 'AccountTitle', caption: 'AccountTitle' }, { key: 'AccountCode', caption: 'AccountCode' },
                  { key: 'ParentAccountTitle', caption: 'ParentAccountTitle' }, { key: 'AccountClass', caption: 'AccountClass' }];
    var cmbProject = new DV.Combo($('cmbProject'), { valueKey: 'Id', displayKey: 'ProjectName', header: 'Cost Center' });
    var cmbCurrency = new DV.Combo($('cmbCurrency'), { valueKey: 'Id', displayKey: 'CurrencyCode', header: 'Currency',
        onLeave: currencyLeave });
    var cmbDebit = new DV.Combo($('cmbDebitAccount'), { valueKey: 'Id', displayKey: 'AccountTitle', header: 'Debit Account',
        columns: acCols, onLeave: function () { drLeave(); } });
    var cmbCredit = new DV.Combo($('cmbCreditAccount'), { valueKey: 'Id', displayKey: 'AccountTitle', header: 'Credit Account',
        columns: acCols, onLeave: function () { crLeave(); } });
    var subCols = [{ key: 'SubsidiaryAccount', caption: 'Account Title' }, { key: 'SubsidiaryType', caption: 'SubsidiaryType' },
                   { key: 'Code', caption: 'Code' }];
    var cmbDrSub = new DV.Combo($('cmbDrSubsidiary'), { valueKey: 'Id', displayKey: 'SubsidiaryAccount', columns: subCols,
        onChange: function (r) { subPicked(r, cmbDebit, drLeave); subBalance(cmbDebit, cmbDrSub, 'lblDrSubBal'); } });
    var cmbCrSub = new DV.Combo($('cmbCrSubsidiary'), { valueKey: 'Id', displayKey: 'SubsidiaryAccount', columns: subCols,
        onChange: function (r) { subPicked(r, cmbCredit, crLeave); subBalance(cmbCredit, cmbCrSub, 'lblCrSubBal'); } });
    var cmbDrJobLot = new DV.Combo($('cmbDrJobLot'), { valueKey: 'Id', displayKey: 'JobLotDescription', header: 'JobLot' });
    var cmbCrJobLot = new DV.Combo($('cmbCrJobLot'), { valueKey: 'Id', displayKey: 'JobLotDescription', header: 'JobLot' });
    var cmbDrBranch = new DV.Combo($('cmbDrBranch'), { valueKey: 'BranchId', displayKey: 'BranchName', header: 'Dr Branch',
        onLeave: function () { if (!cmbCrBranch.text()) cmbCrBranch.setValue(cmbDrBranch.value, true); } });
    var cmbCrBranch = new DV.Combo($('cmbCrBranch'), { valueKey: 'BranchId', displayKey: 'BranchName', header: 'Cr Branch' });
    var cmbDrCost = new DV.Combo($('cmbDrCostCenter'), { valueKey: 'Id', displayKey: 'CostCenterName', header: 'Cost Center' });
    var cmbCrCost = new DV.Combo($('cmbCrCostCenter'), { valueKey: 'Id', displayKey: 'CostCenterName', header: 'Cost Center' });

    // ------------------------------------------------------------------------ formatting
    function fmtAmt(v) { return DV.fmtAmount(v, amountDec); }
    function fmtRate(v) { return DV.fmtAmount(v, rateDec); }
    /** stringFormatboth "#,##0.x;(0,0.x); 0" */
    function fmtBoth(v) {
        var n = Number(v) || 0;
        if (n === 0) return ' 0';
        if (n > 0) return fmtAmt(n);
        var s = DV.fmtAmount(Math.abs(n), amountDec);
        if (Math.abs(n) < 10) s = '0' + s;
        return '(' + s + ')';
    }

    // ------------------------------------------------------------------------------ load
    function cfg(k) { return ctx && ctx.config ? ctx.config[k] : null; }
    function toBool(v) { if (v === true) return true; if (v == null) return false; var s = String(v).trim().toLowerCase(); return s === '1' || s === 'true'; }

    function load() {
        return API.get('/context').then(function (c) {
            ctx = c;
            F.multi = !!c.multiCurrency; F.branch = !!c.branchFeature; F.sub = !!c.subsidiaryFeature; F.booking = !!c.isBookingOffice;
            amountDec = parseInt(cfg('Default NoofDecimal Points For Amount'), 10) || 0;
            var r = parseInt(cfg('Default NoofDecimal Points For Rate'), 10) || 0;
            rateDec = r > 0 ? r : 2;
            // DayBookVoucher_Load :1380-1383 - rights on the buttons
            $('btnSave').disabled = !c.rights.save;
            $('btnUpdate').disabled = !c.rights.update;
            // MultiCurrencyFeature :1341 / subsidiary :1410 / branch :1433 / booking office :1484
            document.querySelectorAll('.fcy').forEach(function (e) { e.classList.toggle('dv-hidden', !F.multi); });
            document.querySelectorAll('.sub').forEach(function (e) { e.classList.toggle('dv-hidden', !F.sub); });
            document.querySelectorAll('.br').forEach(function (e) { e.classList.toggle('dv-hidden', !F.branch); });
            document.querySelectorAll('.cc').forEach(function (e) { e.classList.toggle('dv-hidden', !F.booking); });
            $('txtDocNo').value = c.nextVoucherCode;
            return Promise.all([
                API.get('/currencies').then(function (d) { cmbCurrency.setData(d); }),
                API.get('/branches').then(function (d) { branches = d; cmbDrBranch.setData(d); cmbCrBranch.setData(d);
                    cmbDrBranch.setValue(c.userBranchId, true); cmbCrBranch.setValue(c.userBranchId, true); }),
                API.get('/projects').then(function (d) { cmbProject.setData(d); if (d.length) cmbProject.setValue(DV.pick(d[0], 'Id'), true); }),
                loadJobLots(), loadAccounts(),
                API.get('/cost-centers').then(function (d) { costCenters = d; cmbDrCost.setData(d, true); cmbCrCost.setData(d, true); }),
                F.sub ? loadSubsidiaries() : Promise.resolve()
            ]);
        }).then(function () {
            defaultConfigurations();
            renderGrid();
        });
    }
    function loadJobLots() {
        return API.get('/job-lots').then(function (d) { jobLots = d; cmbDrJobLot.setData(d, true); cmbCrJobLot.setData(d, true); });
    }
    function loadAccounts() {
        return API.get('/accounts').then(function (d) { accounts = d; cmbDebit.setData(d, true); cmbCredit.setData(d, true); });
    }
    function loadSubsidiaries() {
        // BindAllSubsidiaryaccounts :2732 - VoucherHead.BindSubsidiaryAccount(CompanyId, 0, null)
        return API.get('/subsidiary-accounts').then(function (d) { subsidiaries = d; cmbDrSub.setData(d); cmbCrSub.setData(d); });
    }
    /** DefaultConfigurations :1568 */
    function defaultConfigurations() {
        var job = parseInt(cfg('Job/Lot'), 10) || 0;
        if (cfg('Job/Lot') != null) { cmbDrJobLot.setValue(job, true); cmbCrJobLot.setValue(job, true); }
        if (cfg('Base Currency') != null) { baseCurrency = parseInt(cfg('Base Currency'), 10) || 0; cmbCurrency.setValue(baseCurrency, true); }
        if (cfg('BaseCurrencyRate') != null) { baseRate = DV.num(cfg('BaseCurrencyRate')); $('txtExchangeRate').value = fmtRate(baseRate); }
    }

    // ---------------------------------------------------------------- balances / subsidiary
    /** CmbDr_Leave :530 - rounded balance with Dr/Cr suffix; subsidiary rebind. */
    function drLeave() {
        showBalance(cmbDebit, 'lblDebitBal', true);
        if (F.sub) { if (cmbDebit.row) bindSubsidiary(cmbDebit, cmbDrSub, 'dr'); else bindAllSubsidiaries(); }
    }
    /** CmbCr_Leave :574 - the credit balance is NOT rounded. */
    function crLeave() {
        showBalance(cmbCredit, 'lblCreditBal', false);
        if (F.sub) { if (cmbCredit.row) bindSubsidiary(cmbCredit, cmbCrSub, 'cr'); else bindAllSubsidiaries(); }
    }
    function showBalance(combo, lbl, round) {
        var el = $(lbl);
        if (!combo.value) { el.textContent = ''; return; }
        API.get('/balance', { accountId: combo.value, date: $('dtDocDate').value }).then(function (r) {
            if (!r.hasRow) { el.textContent = '0'; return; }
            var b = round ? Math.round(r.balance) : r.balance;
            el.textContent = fmtBoth(b) + (b > 0 ? 'Dr' : (b < 0 ? 'Cr' : ''));
        }).catch(function () { el.textContent = ''; });
    }
    function bindAllSubsidiaries() { cmbDrSub.setData(subsidiaries); cmbCrSub.setData(subsidiaries); }
    /** BindDebitSubsidiaryAccount :2606 / BindCreditSubsidiaryAccount :2520 */
    function bindSubsidiary(acCombo, subCombo, side) {
        var len = 0;
        if (acCombo.row && subsidiaries.length) {
            var keep = subCombo.value;
            var m = subsidiaries.filter(function (s) { return Number(DV.pick(s, 'AccountId')) === acCombo.value; });
            if (m.length) { len = m.length; subCombo.rows = m; if (!subCombo.setValue(keep, true)) subCombo.clear(true); }
            else { subCombo.rows = []; subCombo.clear(true); }
        } else { subCombo.rows = []; subCombo.clear(true); }
        if (side === 'dr') drSubLen = len; else crSubLen = len;
    }
    /** CmbDr/CrSubsidiaryAccount_AfterCloseUp :3283 - picking a subsidiary selects its GL account. */
    function subPicked(row, acCombo, leave) {
        if (!row || updateRowIndex > -1) return;
        var gl = Number(DV.pick(row, 'AccountId')) || 0;
        if (gl && gl !== acCombo.value) { acCombo.setValue(gl, true); leave(); }
    }
    /** CmbDr/CrSubsidiaryAccount_ValueChanged :2753 */
    function subBalance(acCombo, subCombo, lbl) {
        var el = $(lbl);
        if (!(acCombo.value > 0 && subCombo.value > 0)) { el.textContent = ''; return; }
        API.get('/subsidiary-balance', { accountId: acCombo.value, subsidiaryId: subCombo.value, date: $('dtDocDate').value })
            .then(function (r) { var b = r.balance;
                el.textContent = (b === 0 ? '0' : DV.fmtBal(b)) + ' ' + (b > 0 ? 'Dr' : (b === 0 ? 'Nill' : 'Cr')); });
    }

    // ------------------------------------------------------------------------ currency
    /** cmbCurrency_Leave :3185 */
    function currencyLeave() {
        if (!cmbCurrency.value) return;
        if (cmbCurrency.value !== baseCurrency) {
            API.get('/last-exchange-rate', { currencyId: cmbCurrency.value }).then(function (r) {
                $('txtExchangeRate').value = r.found ? fmtRate(r.LastExchRate) : '0';
                exchangeRateChanged();
            });
        } else { $('txtExchangeRate').value = fmtRate(baseRate); exchangeRateChanged(); }
    }
    /** txtExchangeRate_TextChanged :3109 */
    function exchangeRateChanged() {
        var rate = DV.num($('txtExchangeRate').value);
        table.forEach(function (r) { r.fcyAmount = rate > 0 ? (DV.num(r.amountDr) + DV.num(r.amountCr)) / rate : 0; });
        renderGrid();
    }
    /** CalculateTotalInformation :3142 - Fcy of the debit rows only. */
    function calculateTotal() {
        if (!table.length) { $('txtFcyAmount').value = '0'; return; }
        var t = 0;
        table.forEach(function (r) { if (DV.num(r.amountDr) > 0) t += DV.num(r.fcyAmount); });
        $('txtFcyAmount').value = DV.fmt3(t);
    }
    $('txtExchangeRate').addEventListener('input', exchangeRateChanged);
    $('txtExchangeRate').addEventListener('blur', function () { $('txtExchangeRate').value = fmtRate(DV.num($('txtExchangeRate').value)); });
    DV.decimalOnly($('txtExchangeRate'));
    DV.decimalOnly($('txtAmount'));
    $('txtAmount').addEventListener('blur', function () { var n = DV.num($('txtAmount').value); if ($('txtAmount').value) $('txtAmount').value = n.toLocaleString('en-US', { maximumFractionDigits: 6 }); });
    $('txtDrRmks').addEventListener('blur', function () {   // txtDrRmks_Leave :2891
        if (!$('txtCrRmks').value && $('txtDrRmks').value) $('txtCrRmks').value = $('txtDrRmks').value.trim();
    });
    $('rdDrTitle').addEventListener('change', function () { cmbDebit.setDisplayKey('AccountTitle', 'Debit Account'); });
    $('rdDrCode').addEventListener('change', function () { cmbDebit.setDisplayKey('AccountCode', 'Account Code'); });
    $('rdCrTitle').addEventListener('change', function () { cmbCredit.setDisplayKey('AccountTitle', 'Credit Account'); });
    $('rdCrCode').addEventListener('change', function () { cmbCredit.setDisplayKey('AccountCode', 'Account Code'); });

    // ------------------------------------------------------------------------- the grid
    function shown() {
        return table.slice().sort(function (a, b) { return (a.sortIndex || 0) - (b.sortIndex || 0); });
    }
    /** gridsetting :788 - captions are the DataTable column names, as RetrieveStructure leaves them. */
    function renderGrid() {
        var cols = [
            { k: 'accountCode', c: 'AccountCode' }, { k: 'accountTitle', c: 'AccountTitle' },
            { k: 'subsidiaryAccount', c: 'SubsidiaryAccount', on: F.sub }, { k: 'remarks', c: 'Remarks' },
            { k: 'jobLot', c: 'JobLot' }, { k: 'cheqNo', c: 'CheqNo' },
            { k: 'amountDr', c: 'AmountDr', n: 1 }, { k: 'amountCr', c: 'AmountCr', n: 1 },
            { k: 'branchName', c: 'BranchName', on: F.branch }, { k: 'costCenter', c: 'CostCenter', on: F.booking },
            { k: 'fcyAmount', c: 'FcyAmount', n: 3, on: F.multi }
        ].filter(function (c) { return c.on !== false; });

    /** grd_ColumnButtonClick :1236 - a row and its partner (LineId -1 for an even one, +1 for an odd one). */
    function deletePair(lineId) {

    /** FormValidation :369 */
    function formValidation() {
        var err = function (m, f) { return DV.msg(m).then(function () { if (f) f.focus(); return false; }); };
        if (!cmbDebit.value) return err('Debit Account Field is Required', cmbDebit);
        if (F.sub && drSubLen > 0 && !cmbDrSub.row) return err('Debit Subsidiary Account Field Required', cmbDrSub);
        if (!$('txtDrRmks').value.trim()) return err('Debit Remarks Field is Required', $('txtDrRmks'));
        if (!cmbDrJobLot.value) return err('Dr JobLot Field is Required', cmbDrJobLot);
        if (DV.num($('txtAmount').value.trim()) === 0) return err('Amount Field is Required', $('txtAmount'));
        if (!cmbCredit.value) return err('Credit Account Field is Required', cmbCredit);
        if (F.sub && crSubLen > 0 && !cmbCrSub.row) return err('Credit Subsidiary Account Field Required', cmbCrSub);
        if (!$('txtCrRmks').value.trim()) return err('Credit Remarks Field is Required', $('txtCrRmks'));
        if (!cmbCrJobLot.value) return err('Cr JobLot Field is Required', cmbCrJobLot);
        if (F.branch && !cmbDrBranch.value) return err('Dr Branch Field is Required', cmbDrBranch);
        if (F.branch && !cmbCrBranch.value) return err('Cr Branch Field is Required', cmbCrBranch);
        return Promise.resolve(true);
    }
    function sideValues(side, forUpdate) {
        var ac = side === 'dr' ? cmbDebit : cmbCredit, other = side === 'dr' ? cmbCredit : cmbDebit;
        var sub = side === 'dr' ? cmbDrSub : cmbCrSub, len = side === 'dr' ? drSubLen : crSubLen;
        var job = side === 'dr' ? cmbDrJobLot : cmbCrJobLot, br = side === 'dr' ? cmbDrBranch : cmbCrBranch;
        var cc = side === 'dr' ? cmbDrCost : cmbCrCost;
        var o = {
            accountCode: ac.cell('AccountCode'), accountId: ac.value, accountTitle: ac.cell('AccountTitle'),
            againstAccountId: other.value,
            remarks: forUpdate ? $(side === 'dr' ? 'txtDrRmks' : 'txtCrRmks').value : $(side === 'dr' ? 'txtDrRmks' : 'txtCrRmks').value.trim(),
            jobLotId: job.value, jobLot: job.text(), cheqNo: forUpdate ? $('txtCheq').value : $('txtCheq').value.trim(),
            costCenterId: cc.value > 0 ? cc.value : 0, costCenter: cc.value > 0 ? cc.text() : ''
        };
        if (!F.sub) { o.subsidiaryAccountId = 0; o.subsidiaryAccount = ''; o.subsidiaryAccountTypeId = 0; }
        else if (forUpdate ? (sub.row && sub.text() !== '') : len > 0) {
            o.subsidiaryAccountId = sub.value; o.subsidiaryAccount = sub.text(); o.subsidiaryAccountTypeId = Number(sub.cell('SubsidiaryTypeId')) || 0;
        } else { o.subsidiaryAccountId = ac.value; o.subsidiaryAccount = forUpdate ? ac.cell('AccountTitle') : ac.text(); o.subsidiaryAccountTypeId = 4; }
        if (forUpdate) { o.branchId = br.value; o.branchName = br.text(); }
        else { o.branchId = F.branch ? br.value : 0; o.branchName = F.branch ? br.text() : ''; }
        return o;
    }
    /** btnplus_Click :754 */
    function addPair() {
        formValidation().then(function (ok) {
            if (!ok) return null;
            if (cmbDebit.value === cmbCredit.value) {
                return DV.confirm('Debit Account and Credit Account should not be same please check ... ', 'Confirm');
            }
            return true;
        }).then(function (go) {
            if (!go) return;
            var n = 1;
            if (table.length) { n = Math.max.apply(null, table.map(function (r) { return r.lineId; })) + 1; }
            var amt = DV.num($('txtAmount').value.trim()), rate = DV.num($('txtExchangeRate').value);
            var fcy = (rate > 0 && amt > 0) ? amt / rate : 0;
            var cr = sideValues('cr', false), dr = sideValues('dr', false);
            cr.amountDr = 0; cr.amountCr = amt; cr.lineId = n; cr.fcyAmount = fcy;
            cr.sortIndex = ((n - 1) % 2 === 0) ? (n - 1 + 2) : (n - 1);
            dr.amountDr = amt; dr.amountCr = 0; dr.lineId = n + 1; dr.fcyAmount = fcy;
            dr.sortIndex = (n % 2 === 0) ? (n + 2) : n;          // (++n - 1) evaluated after the increment
            table.push(cr); table.push(dr);
            renderGrid();
            $('txtDrRmks').value = ''; $('txtCrRmks').value = ''; $('txtAmount').value = ''; $('txtCheq').value = '';
            cmbDebit.focus();
        });
    }
    /** grd_DoubleClick :833 */
    function editPair(lineId) {
        var r = byLine(lineId);
        if (!r) return;
        updateRowIndex = lineId;
        $('btnPlus').classList.add('dv-hidden'); $('btnUpdateDetail').classList.remove('dv-hidden'); $('btnCancelDetail').classList.remove('dv-hidden');
        var even = lineId % 2 === 0;
        var drRow = even ? r : byLine(lineId + 1), crRow = even ? byLine(lineId - 1) : r;
        if (drRow) {
            cmbDebit.setValue(drRow.accountId, true); drLeave();
            if (drRow.subsidiaryAccountId > 0) { if (!cmbDrSub.setValue(drRow.subsidiaryAccountId, true)) cmbDrSub.setFree(drRow.subsidiaryAccountId, drRow.subsidiaryAccount); }
            $('txtDrRmks').value = drRow.remarks || '';
            if (drRow.jobLotId > 0) cmbDrJobLot.setValue(drRow.jobLotId, true);
            if (drRow.costCenterId > 0) cmbDrCost.setValue(drRow.costCenterId, true);
            if (F.branch) cmbDrBranch.setValue(drRow.branchId, true);
        }
        if (crRow) {
            cmbCredit.setValue(crRow.accountId, true); crLeave();
            if (crRow.subsidiaryAccountId > 0) { if (!cmbCrSub.setValue(crRow.subsidiaryAccountId, true)) cmbCrSub.setFree(crRow.subsidiaryAccountId, crRow.subsidiaryAccount); }
            $('txtCrRmks').value = crRow.remarks || '';
            if (crRow.jobLotId > 0) cmbCrJobLot.setValue(crRow.jobLotId, true);
            if (F.branch) cmbCrBranch.setValue(crRow.branchId, true);
            if (crRow.costCenterId > 0) cmbCrCost.setValue(crRow.costCenterId, true);
        }
        /* the partner row's cheque and amount win - they are read last on the desktop */
        $('txtCheq').value = (even ? (crRow ? crRow.cheqNo : r.cheqNo) : (drRow ? drRow.cheqNo : r.cheqNo)) || '';
        $('txtAmount').value = even ? (crRow ? crRow.amountCr : r.amountDr) : (drRow ? drRow.amountDr : r.amountCr);
        cmbDebit.focus();
    }
    /** btnUpdateDetail_Click :1020 */
    function updatePair() {
        formValidation().then(function (ok) {
            if (!ok) return;
            if (updateRowIndex > -1) {
                var isDr = updateRowIndex % 2 === 0;
                var dr = sideValues('dr', true), cr = sideValues('cr', true);
                dr.amountDr = DV.num($('txtAmount').value); dr.amountCr = 0; dr.lineId = isDr ? updateRowIndex : updateRowIndex + 1;
                cr.amountDr = 0; cr.amountCr = DV.num($('txtAmount').value); cr.lineId = !isDr ? updateRowIndex : updateRowIndex - 1;
                var di = 0, ci = 0, i;

                for (i = 0; i < table.length; i++) if (table[i].lineId === cr.lineId) { ci = i; break; }
                if (table[di]) { dr.sortIndex = table[di].sortIndex; dr.fcyAmount = table[di].fcyAmount; table[di] = dr; }
                if (table[ci]) { cr.sortIndex = table[ci].sortIndex; cr.fcyAmount = table[ci].fcyAmount; table[ci] = cr; }
                updateRowIndex = -1;

    /** Insert() :1625 - the checks the desktop makes before its Yes/No, then the save. */
    function insert() {
        if (!cmbProject.value) { DV.msg('Cost Center Field is Required'); cmbProject.focus(); return; }
        if (!table.length) { DV.msg('Grid Fields Required'); return; }
        if (F.multi) {
            if (!cmbCurrency.value) { DV.msg('Fcy Code Field is Required'); return; }
            if (DV.num($('txtExchangeRate').value) === 0) { DV.msg('Exchange Rate Field is Required'); return; }
            if (DV.num($('txtFcyAmount').value) === 0) { DV.msg('Fcy Amount Field is Required'); return; }
        } else {
            if (!cmbCurrency.value) { DV.msg('Please Configure Your Base Currency In configurations'); return; }
            var er = $('txtExchangeRate').value.trim();
            if (er === '' || er === '0') { DV.msg('Please Configure Your Base Currency Rate In configurations'); return; }
        }
        DV.confirm(RecId > 0 ? 'Are you sure to Update?' : 'Are you sure to Save?', 'Confirm').then(function (yes) {
            if (!yes) return;
            var payload = {
                id: RecId, voucherCode: parseInt($('txtDocNo').value, 10) || 0, voucherDate: $('dtDocDate').value,
                projectId: cmbProject.value, remarks: $('txtVoucherRemarks').value,
                multiCurrencyId: cmbCurrency.value, exchangeCurrencyRate: DV.num($('txtExchangeRate').value),
                fcAmount: DV.num($('txtFcyAmount').value),
                rows: table.map(function (r) { return {
                    accountCode: r.accountCode, accountId: r.accountId, accountTitle: r.accountTitle,
                    againstAccountId: r.againstAccountId, subsidiaryAccountId: r.subsidiaryAccountId,
                    subsidiaryAccount: r.subsidiaryAccount, subsidiaryAccountTypeId: r.subsidiaryAccountTypeId,
                    remarks: r.remarks, jobLotId: r.jobLotId, jobLot: r.jobLot, cheqNo: r.cheqNo,
                    amountDr: DV.num(r.amountDr), amountCr: DV.num(r.amountCr), lineId: r.lineId,
                    branchId: r.branchId, costCenterId: r.costCenterId, fcyAmount: DV.num(r.fcyAmount), sortIndex: r.sortIndex }; })
            };
            document.body.classList.add('dv-busy');
            return DV.saveWithConfirm(API.base + '/save', payload).then(function (res) {
                document.body.classList.remove('dv-busy');
                if (!res) return;
                return DV.msg(res.message).then(function () { reset(); });
            }).catch(function (e) {
                document.body.classList.remove('dv-busy');
                DV.msg(e.message, e.dvTitle || 'Database Error');
            });
        });
    }

                { c: 'JobLot', v: function (d) { return DV.pick(d, 'JobLotDescription'); } },
                { c: 'Remarks', v: function (d) { return DV.pick(d, 'Comments'); } },
                { c: 'CheqNo', v: function (d) { return DV.pick(d, 'CheqNoDetail'); } },
                { c: 'Debit', n: 1, v: function (d) { return DV.pick(d, 'DebitAmount'); } },
                { c: 'Credit', n: 1, v: function (d) { return DV.pick(d, 'CreditAmount'); } },
                { c: 'BranchName', on: F.branch, v: function (d) { return DV.pick(d, 'BranchName'); } },
                { c: 'CostCenter', on: F.booking, v: function (d) { return DV.pick(d, 'CostCenterName'); } },
                { c: 'Fcy Debit', n: 3, on: F.multi, v: function (d) { return DV.num(DV.pick(d, 'DebitAmount')) > 0 ? DV.pick(d, 'DCurrencyAmount') : 0; } },
                { c: 'Fcy Credit', n: 3, on: F.multi, v: function (d) { return DV.num(DV.pick(d, 'CreditAmount')) > 0 ? DV.pick(d, 'DCurrencyAmount') : 0; } }
            ].filter(function (c) { return c.on !== false; });
            renderSimple($('grdDetail'), cols, lines.map(function (x) { return x.d; }));
        }).catch(function (e) { DV.msg(e.message, 'Error Message'); });
    }
    function renderSimple(g, cols, rows) {
        g.tHead.innerHTML = '<tr>' + cols.map(function (c) { return '<th' + (c.n ? ' class="n"' : '') + '>' + c.c + '</th>'; }).join('') + '</tr>';
        var sums = cols.map(function () { return 0; });
        g.tBodies[0].innerHTML = rows.map(function (d) {
            return '<tr>' + cols.map(function (c, j) {
                var v = c.v(d);
                if (c.n) { sums[j] += DV.num(v); v = c.n === 3 ? DV.fmt3(v) : fmtAmt(v); }
                return '<td' + (c.n ? ' class="n"' : '') + '>' + DV.esc(v) + '</td>';
            }).join('') + '</tr>';
        }).join('');
        g.tFoot.innerHTML = rows.length ? '<tr>' + cols.map(function (c, j) {
            return c.n ? '<td class="n">' + (c.n === 3 ? DV.fmt3(sums[j]) : fmtAmt(sums[j])) + '</td>' : '<td></td>'; }).join('') + '</tr>' : '';
    }
    $('btnShow').addEventListener('click', historyFill);
    /** btnNewHistory_Click :3252 */
    function resetHistory() {
        $('dtFromHistory').value = DV.today(); $('dtToHistory').value = DV.today();
        $('txtFromDocNoHistory').value = ''; $('txtToDocNoHistory').value = '';
        $('cmbApproveStatus').value = 'notapproved';
        historyRows = []; renderHistory();
    }
    $('btnNewHistory').addEventListener('click', resetHistory);
    DV.digitsOnly($('txtFromDocNoHistory')); DV.digitsOnly($('txtToDocNoHistory'));

    // ---------------------------------------------------------------------- tabs / keys
    var tabs = DV.tabs($('tabBar'), { form: $('pgForm'), history: $('pgHistory') }, function (t) {
        if (t === 'history') $('dtFromHistory').focus();
    });
    var SHORTCUTS = [['Ctrl+S', 'For Save'], ['Ctrl+U', 'For Update'], ['Ctrl+E', 'For Close'], ['Ctrl+R', 'For Refresh'],
        ['Ctrl+N', 'For New'], ['Ctrl+P', 'For Print'], ['Ctrl+F5', 'For Focus on Doc Date'], ['Ctrl+F10', 'For Open Attachments'],
        ['Ctrl+T', 'For Tab Transfer'], ['Ctrl+L', 'For Load All Records'], ['Ctrl+alt', 'To Show ShortCut Keys Form'],
        ['Ctrl+ArrowDown', 'For Focus On Detail Grid'], ['Ctrl+ArrowUp', 'For Focus On Debit Account in Detail Box'],
        ['Ctrl+Enter', 'When Focus On Any Grid For Update Record'], ['Ctrl+Space', "When Focus On Any Grid To Call Function's On Button Or Link"]];
    $('btnShortCutKey').addEventListener('click', function () { DV.showShortcuts(SHORTCUTS); });
    /** DayBookVoucher_KeyDown :2363 */
    document.addEventListener('keydown', function (e) {
        if (document.querySelector('.dv-modal-back')) return;
        var t = tabs.current();
        if (e.ctrlKey && e.altKey) { DV.showShortcuts(SHORTCUTS); return; }
        if (!e.ctrlKey) return;
        var k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); if (t === 'form') { if (!$('btnSave').classList.contains('dv-hidden') && !$('btnSave').disabled) $('btnSave').click(); } else historyFill(); }
        else if (k === 'u') { e.preventDefault(); if (!$('btnUpdate').classList.contains('dv-hidden') && !$('btnUpdate').disabled) $('btnUpdate').click(); }
        else if (k === 'n') { e.preventDefault(); if (t === 'form') reset(); else resetHistory(); }
        else if (k === 't') { e.preventDefault(); tabs.show(t === 'history' ? 'form' : 'history'); if (t === 'history') $('dtDocDate').focus(); }
        else if (k === 'r') { if (t === 'form') { e.preventDefault(); $('btnRefresh').click(); } }
        else if (e.key === 'F5') { e.preventDefault(); if (t === 'form') $('dtDocDate').focus(); else $('dtFromHistory').focus(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); var b = document.querySelector(t === 'form' ? '#grd button' : '#grdHistory button'); if (b) b.focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (t === 'form') cmbDebit.focus(); else $('dtFromHistory').focus(); }
    });

    // ------------------------------------------------------------------------------ start
    $('dtDocDate').value = DV.today();
    $('dtFromHistory').value = DV.today(); $('dtToHistory').value = DV.today();
    setMode('new');
    load().then(function () {
        var q = new URLSearchParams(location.search);
        var id = parseInt(q.get('id') || q.get('Id'), 10);
        var code = parseInt(q.get('voucherCode') || q.get('VoucherCode'), 10);
        if (id > 0) return readById(id, false);
        if (code > 0) {
            return API.get('/history', { fromDocNo: code, toDocNo: code, approvedStatus: 'all' }).then(function (rows) {
                if (rows && rows.length) return readById(Number(DV.pick(rows[0], 'Id')), false);
            });
        }
    }).catch(function (e) { DV.msg(e.message); });
    window.VoucherEntryReadById = function (id) { reset(); return readById(id, false); };
})();
</script>
