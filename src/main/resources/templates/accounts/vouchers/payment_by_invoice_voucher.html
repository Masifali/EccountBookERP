<!-- Architecture.WinApp.Account_Definition.PaymentByInvoiceVoucherNew (ScreenDefinition 41) - ClientSize 1174 x 711, Maximized, KeyPreview.
     tabControl1 (Alignment Bottom): "Form" | "History".
     Form: panel3 (30) toolStrip2 New | Update (hidden) | Save | 102-Print | Attachment | SMS (hidden) | Delete (hidden) | Refresh | Load Invoices
           + ctrlGrdBar1; panel4 (36, rgb 10,110,110) "PAYMENT BY INVOICE VOUCHER"; panel5 (263): groupBox3 "Company" (4,6) 322x125,
           groupBox2 "Voucher Type" (326,6) 832x125, groupboxdetail "Detail" (4,135) 1154x126; panel6: grd (0,3) 1158x253 and the
           WHT / totals controls below it. Every control below carries its designer Location / Size (px) as --x --y --w --h.
     History: panel13 LoadAll; DataGridHistory (325 high, filter row, totals, View / Print / Edit buttons); grdDetail (fill).

<body class="pd-body hrm-body pbi-body" data-screen="41">

            </div>
            <div class="pbi-caption" id="PaymentVoucherLable">PAYMENT BY INVOICE VOUCHER</div>
