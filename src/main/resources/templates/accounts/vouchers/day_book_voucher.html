<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day Book</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Tahoma, Verdana, sans-serif; font-size: 12px; background: #f0f0f0; margin: 0; color: #222; }
        .tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #dcdcdc; }
        .tabs button { border: 1px solid #aaa; border-bottom: none; background: #e9e9e9; padding: 4px 16px; cursor: pointer; font-size: 12px; }
        .tabs button.on { background: #fff; font-weight: bold; }
        .page { background: #fff; border: 1px solid #aaa; margin: 0 6px 6px; padding: 4px; }
        .toolbar { display: flex; gap: 4px; padding: 3px; background: linear-gradient(#fdfdfd, #e6e6e6); border: 1px solid #c8c8c8; }
        .toolbar button { font-size: 12px; padding: 3px 10px; border: 1px solid #aaa; background: #fafafa; cursor: pointer; }
        .toolbar button:disabled { color: #999; cursor: default; }
        .strip { background: #00796b; color: #fff; font-weight: bold; font-size: 14px; padding: 4px 8px; margin-top: 3px; }
        fieldset { border: 1px solid #b5b5b5; margin: 4px 0; padding: 4px 8px 8px; }
        legend { font-weight: bold; font-size: 12px; padding: 0 4px; width: auto; }
        .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
        .fld { display: flex; flex-direction: column; }
        .fld label { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
        input[type=text], input[type=date], select, textarea { font-size: 12px; border: 1px solid #9a9a9a; padding: 2px 4px; height: 24px; box-sizing: border-box; }
        textarea { height: 44px; resize: none; }
        input[readonly], input:disabled { background: #eee; }
        .num { text-align: right; }
        .sides { display: flex; gap: 6px; }
        .side { flex: 1; min-width: 0; }
        .bar { background: #00796b; color: #fff; font-weight: bold; padding: 3px 6px; }
        .grid { border: 1px solid #aaa; overflow: auto; height: 330px; background: #fff; }
        table.g { border-collapse: collapse; width: 100%; font-size: 11px; }
        table.g th { background: #e4e4e4; border: 1px solid #b9b9b9; padding: 3px 4px; text-align: center; position: sticky; top: 0; white-space: nowrap; }
        table.g td { border: 1px solid #d3d3d3; padding: 2px 4px; white-space: nowrap; }
        table.g tr.sel td { background: #cfe5ff; }
        table.g tfoot td { font-weight: bold; background: #f3f3f3; }
        table.g tr.grp td { background: #dfe9f5; font-weight: bold; }
        .bal { font-size: 11px; color: #004d40; font-weight: bold; }
        .hint { color: #666; font-size: 11px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="tabs">
    <button type="button" id="tabForm" class="on" onclick="DB.tab(0)">Form</button>
    <button type="button" id="tabHistory" onclick="DB.tab(1)">History</button>
</div>

<!-- ====================================================== tabPage1 "Form" -->
<div class="page" id="pageForm">
    <div class="toolbar">
        <button type="button" onclick="DB.newForm()">New</button>
        <button type="button" id="btnSave" onclick="DB.save(false)">Save</button>
        <button type="button" id="btnUpdate" hidden onclick="DB.save(true)">Update</button>
        <button type="button" onclick="DB.refresh()">Refresh</button>
        <button type="button" disabled title="Attachments are not ported to the web.">Attachment</button>
    </div>
    <div class="strip">Day Book</div>

    <fieldset>
        <legend>Main Information</legend>
        <div class="row">
            <div class="fld"><label>Vocher Code &amp; Date</label>
                <div style="display:flex;gap:2px;">
                    <input type="text" id="txtDocNo" readonly disabled style="width:82px;">
                    <input type="date" id="txtDocDate" style="width:130px;" onchange="DB.cashLeave()">
                </div>
            </div>
            <div class="fld"><label>Cash Account</label>
                <select id="cmbCashAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="width:216px;" onchange="DB.cashLeave()"></select>
            </div>
            <div class="fld" style="min-width:210px;">
                <div><b>Opening</b> <span class="bal" id="lblOpeningBalance">0</span> <span id="lblCreditOrDebit"></span></div>
                <div><b>Closing</b> <span class="bal" id="lblClosingBalance">0</span> <span id="lblCreditOrDebitForClosing"></span></div>
            </div>
        </div>
        <div class="row">
            <div class="fld"><label>Vocher Remarks</label><textarea id="txtHeaderRemarks" style="width:515px;"></textarea></div>
            <label><input type="checkbox" id="ChkPrintPreview" checked> Print Preview</label>
        </div>
    </fieldset>

    <div class="sides">
        <!-- ================= Receipt (panel2, left) ================= -->
        <div class="side">
            <fieldset>
                <legend>Receipt</legend>
                <div class="row">
                    <div class="fld"><label>Credit Account <span class="bal" id="lblCreditAccountBalance">0</span> <span id="lblCreditAccountBalanceCaption"></span></label>
                        <select id="CmbCreditAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Credit Account" style="width:214px;" onchange="DB.detailLeave('cr')"></select>
                    </div>
                    <div class="fld sub"><label>Subsidiary Account</label>
                        <select id="CmbSubsidiaryAccountReceipt" class="dtcombo" data-dtcombo="gdSubsidiary" data-dtcombo-caption="Subsidiary Account" style="width:166px;" onchange="DB.subLeave('cr')"></select>
                    </div>
                    <div class="fld"><label>Amount</label><input type="text" id="txtCreditAmount" class="num" style="width:104px;" onblur="DB.amountLeave(this)" oninput="DB.onlyDecimal(this)"></div>
                    <div class="fld"><label>Page No</label><input type="text" id="txtCrPageNo" style="width:61px;"></div>
                </div>
                <div class="row">
                    <div class="fld"><label>Cheque Date</label><input type="date" id="datCrChequeDate" style="width:120px;"></div>
                    <div class="fld"><label>Cheq / Ref</label><input type="text" id="txtCrCheqRef" style="width:89px;"></div>
                    <div class="fld"><label>Remarks</label><input type="text" id="txtCrRemarks" style="width:224px;"></div>
                    <button type="button" id="btnAddCrditRow" onclick="DB.addRow('cr')">+</button>
                    <button type="button" id="btnUpdateCreditRow" hidden onclick="DB.updateRow('cr')">Update</button>
                    <button type="button" id="btnCreditRowCancel" hidden onclick="DB.cancelRow('cr')">Cancel</button>
                </div>
            </fieldset>
            <div class="bar">Receipt</div>
            <div class="grid"><table class="g" id="ReceiptGrid"></table></div>
        </div>
        <!-- ================= Payment (panel4, right) ================= -->
        <div class="side">
            <fieldset>
                <legend>Payment</legend>
                <div class="row">
                    <div class="fld"><label>Debit Account <span class="bal" id="lblDebitAccountBalance">0</span> <span id="lblDebitAccountBalanceCaption"></span></label>
                        <select id="CmbDebitAccount" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Debit Account" style="width:214px;" onchange="DB.detailLeave('dr')"></select>
                    </div>
                    <div class="fld sub"><label>Subsidiary Account</label>
                        <select id="CmbSubsidiaryAccountPayment" class="dtcombo" data-dtcombo="gdSubsidiary" data-dtcombo-caption="Subsidiary Account" style="width:166px;" onchange="DB.subLeave('dr')"></select>
                    </div>
                    <div class="fld"><label>Amount</label><input type="text" id="txtDebitAmount" class="num" style="width:104px;" onblur="DB.amountLeave(this)" oninput="DB.onlyDecimal(this)"></div>
                    <div class="fld"><label>Page No</label><input type="text" id="txtDrPageNo" style="width:61px;"></div>
                </div>
                <div class="row">
                    <div class="fld"><label>Cheque Date</label><input type="date" id="datDrCheqDate" style="width:120px;"></div>
                    <div class="fld"><label>Cheq / Ref</label><input type="text" id="txtDrCheqRef" style="width:89px;"></div>
                    <div class="fld"><label>Remarks</label><input type="text" id="txtDrRemarks" style="width:224px;"></div>
                    <button type="button" id="btnAddDebitRow" onclick="DB.addRow('dr')">+</button>
                    <button type="button" id="btnUpdateDebitRow" hidden onclick="DB.updateRow('dr')">Update</button>
                    <button type="button" id="btnDebitRowCancel" hidden onclick="DB.cancelRow('dr')">Cancel</button>
                </div>
            </fieldset>
            <div class="bar">Payment</div>
            <div class="grid"><table class="g" id="PaymentGrid"></table></div>
        </div>
    </div>
    <div class="hint">Double-click a grid row to edit it; X removes it. Ctrl+Left / Ctrl+Right focus the Credit / Debit account.</div>
</div>

<!-- ====================================================== tabPage2 "History" -->
<div class="page" id="pageHistory" hidden>
    <div class="toolbar">
        <button type="button" onclick="DB.print144()" data-rpt="144-DayBookSlip.rpt">144-Print</button>
        <button type="button" onclick="DB.loadVoucherDates()">Refresh</button>
    </div>
    <div class="strip">DAY BOOK HISTORY</div>
    <div class="row" style="margin-top:4px;">
        <div class="fld"><label>Voucher Date</label><select id="datVouchderDateForHistory" style="width:178px;"></select></div>
        <div class="fld"><label>Cash Account</label>
            <select id="CmbCashAccountForHistory" class="dtcombo" data-dtcombo="gdAccount" data-dtcombo-caption="Cash Account" style="width:235px;"></select>
        </div>
        <button type="button" onclick="DB.history()">Show</button>
    </div>
    <div class="sides">
        <div class="side"><div class="bar">Receipt Side</div><div class="grid" style="height:560px;"><table class="g" id="DataGridCreditHistory"></table></div></div>
        <div class="side"><div class="bar">Payment Side</div><div class="grid" style="height:560px;"><table class="g" id="DataGridDebitHistory"></table></div></div>
    </div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_accounts_groupd.js?v=20260930s}"></script>
<script th:src="@{/build/js/countx_day_book_cash.js?v=20260930s}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
