<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccountBookERP - Accounts Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/accounts.css}" href="/css/accounts.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="top-header">
        <div class="header-left-group">
            <button class="nav-arrow-btn" title="Back">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <button class="nav-arrow-btn" title="Forward">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <select class="select-box" id="screenSearchSelect">
                <option value="">...Select Any Value...</option>
                <option value="Define Bank">Define Bank</option>
                <option value="Bank Payment Voucher">Bank Payment Voucher</option>
                <option value="Bank Receipt Voucher">Bank Receipt Voucher</option>
                <option value="Bank Balance Entry">Bank Balance Entry</option>
                <option value="Cheque Printing">Cheque Printing</option>
                <option value="Bank Balances Report">Bank Balances Report</option>
                <option value="General Ledger Report">General Ledger Report</option>
            </select>

            <span class="user-info" th:text="${userName}">Numan Rasheed (Admin)</span>
            <span class="company-name" th:text="${companyName}">Golden Ace Rice Mills (Pvt) Ltd.</span>
        </div>

        <div class="header-right-group">
            <span class="clock-display" id="liveClock">5:58:48 pm</span>
            <span class="fy-badge" th:text="${fiscalYear}">2026-27</span>

            <div class="update-banner" title="Click to download software update">
                <span>New Update is Available! Current Version: 0.0.0.0</span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            </div>

            <div class="window-controls">
                <button class="win-btn" title="Minimize">&#9472;</button>
                <button class="win-btn" title="Maximize">&#9633;</button>
                <button class="win-btn" title="Close">&#10005;</button>
            </div>
        </div>
    </header>

    <!-- Main Application Body -->
    <div class="app-body">
        <!-- Left Navigation Sidebar -->
        <aside class="sidebar">
            <button class="sidebar-item" title="Navigation Menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <button class="sidebar-item active" title="Dashboard Analytics">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            </button>
            <button class="sidebar-item" title="Home">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            </button>
            <button class="sidebar-item" title="Favorites">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button class="sidebar-item" title="History">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
            <button class="sidebar-item" title="User Rights & Access">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            </button>
        </aside>

        <!-- Main Workspace Area -->
        <main class="workspace">
            <div class="dash-header-panel">
                <div>
                    <div class="dash-breadcrumbs">
                        <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        <span>Screens</span>
                    </div>
                    <h1 class="dash-title" id="moduleTitle" th:text="${moduleName}">Accounts</h1>
                </div>
            </div>

            <!-- Sub-Module Top Cards Container -->
            <div class="submodules-container" id="submodulesContainer">
                <!-- Dynamically loaded via accounts.js -->
            </div>

            <!-- Screen Cards Grid Container -->
            <div class="screens-section">
                <div class="screens-grid" id="screensGrid">
                    <!-- Dynamically loaded via accounts.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Screen Modal Popup -->
    <div class="modal-overlay" id="screenModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modalTitle">Define Bank</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <!-- Dynamically populated per screen in accounts.js -->
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script th:src="@{/js/api.js}" src="/js/api.js"></script>
    <script th:src="@{/js/accounts.js}" src="/js/accounts.js"></script>
</body>
</html>
