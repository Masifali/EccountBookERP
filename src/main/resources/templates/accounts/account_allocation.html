<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Allocation - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        .erp-top-header {
            background-color: #00796B;
            color: #ffffff;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .erp-top-header .header-item {
            margin-right: 18px;
            display: flex;
            align-items: center;
        }

        .erp-sub-bar {
            background-color: #b0bec5;
            height: 24px;
            padding: 2px 10px;
            font-size: 11px;
            color: #37474f;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #90a4ae;
        }

        .erp-main-canvas {
            padding: 12px;
        }

        .erp-panel {
            background: #ffffff;
            border: 1px solid #00796B;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .erp-panel-header {
            background: #00796B;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -15px -15px 15px -15px;
        }

        .btn-erp {
            background-color: #ffffff;
            color: #00796B;
            border: 1px solid #00796B;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-erp:hover {
            background-color: #00796B;
            color: #ffffff;
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
        }

        .erp-table th {
            background-color: #00796B;
            color: #ffffff;
            padding: 6px 10px;
            font-weight: 600;
            border: 1px solid #004d40;
            text-align: left;
        }

        .erp-table td {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
        }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>

    <div class="erp-top-header">
        <div class="header-item"><i class="fa fa-sitemap" style="margin-right:8px;"></i> Accounts Allocation</div>
        <div class="header-item" style="margin-left:auto; color:#ffeb3b;"><a th:href="@{/accounts/dashboard}" style="color:#ffeb3b; text-decoration:none;"><i class="fa fa-dashboard"></i> Back to Accounts Dashboard</a></div>
    </div>

    <div class="erp-sub-bar">
        <button type="button" class="btn-erp" id="btnRefresh" style="padding:1px 10px;"><i class="fa fa-refresh"></i> Refresh</button>
    </div>

    <div class="erp-main-canvas">
        <div class="erp-panel">
            <div class="erp-panel-header"><span>Accounts Allocation</span></div>

            <div class="form-inline" style="margin-bottom:10px; background:#f5f5f5; padding:10px; border:1px solid #e0e0e0; display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
                <div><label style="display:block; font-weight:bold;">To Company</label>
                    <select id="cmbToCompany" class="form-control" style="min-width:220px;"></select></div>
                <div><label style="display:block; font-weight:bold;">Financial Year</label>
                    <select id="CmbFinancialYear" class="form-control" style="min-width:140px;"></select></div>
                <div><label style="display:block; font-weight:bold;">Account Type</label>
                    <select id="CmbAccountType" class="form-control" style="min-width:200px;"></select></div>
                <div><button type="button" class="btn-erp" id="btnShow">Show</button></div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#00796B; color:#fff; padding:4px 8px;">
                        <strong>Pending Accounts For Allocation</strong>
                        <button type="button" class="btn-erp" id="BtnAllocateAccounts" style="padding:1px 8px;"><i class="fa fa-arrow-right"></i> Allocate</button>
                    </div>
                    <div style="overflow:auto; max-height:460px;">
                        <table class="erp-table" id="GridUnAllocatedAccounts">
                            <thead><tr><th style="width:60px; text-align:center;"><input type="checkbox" class="chk-all" data-grid="GridUnAllocatedAccounts"/> Select</th><th style="width:90px;">AccountCode</th><th>AccountTitle</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="col-md-6">
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#00796B; color:#fff; padding:4px 8px;">
                        <strong>Allocated Accounts</strong>
                        <button type="button" class="btn-erp" id="btnDeAllocate" style="padding:1px 8px;"><i class="fa fa-arrow-left"></i> Un-Allocate</button>
                    </div>
                    <div style="overflow:auto; max-height:460px;">
                        <table class="erp-table" id="GridAllocatedAccounts">
                            <thead><tr><th style="width:60px; text-align:center;"><input type="checkbox" class="chk-all" data-grid="GridAllocatedAccounts"/> Select</th><th style="width:90px;">AccountCode</th><th>AccountTitle</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/vendors/bootstrap/dist/js/bootstrap.min.js}"></script>
    <script>
        /* AcfrmAcAllocation, event for event (see AccountAllocationDesktopService). */
        (function () {
            function v(r, k) { if (!r) return null; if (r[k] !== undefined) return r[k]; var l = k.toLowerCase(); for (var x in r) if (x.toLowerCase() === l) return r[x]; return null; }
            function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
            function bind(sel, rows, idKey, textKey) {
                var cur = $(sel).val(), html = '<option value=""></option>';
                (rows || []).forEach(function (r) { html += '<option value="' + esc(v(r, idKey)) + '">' + esc(v(r, textKey)) + '</option>'; });
                $(sel).html(html);
                if (cur && $(sel).find('option[value="' + cur + '"]').length) $(sel).val(cur);
            }
            function selText(sel) { var o = $(sel).find('option:selected'); return o.length && o.val() !== '' ? o.text() : ''; }

            function grid(id, rows) {
                var html = '';
                (rows || []).forEach(function (r) {
                    html += '<tr><td style="text-align:center;"><input type="checkbox" class="chk-row" data-id="' + esc(v(r, 'Id')) + '" data-title="' + esc(v(r, 'AccountTitle')) + '"/></td><td>'
                         + esc(v(r, 'AccountCode')) + '</td><td>' + esc(v(r, 'AccountTitle')) + '</td></tr>';
                });
                $('#' + id + ' tbody').html(html);
                $('#' + id + ' .chk-all').prop('checked', false);
            }
            function clearAll() {
                $('#CmbFinancialYear').html('<option value=""></option>');
                $('#GridAllocatedAccounts tbody, #GridUnAllocatedAccounts tbody').html('');
            }

            /* companytofill + AccountTypeFill */
            function load() {
                $.get('/accounts/allocation/lookups', function (res) {
                    $('#cmbToCompany').prop('disabled', false);
                    bind('#cmbToCompany', res.companies, 'Id', 'CompName');
                    bind('#CmbAccountType', res.accountTypes, 'Id', 'AccountType');
                    var own = null;
                    (res.companies || []).forEach(function (c) { if (String(v(c, 'Id')) === String(res.currentCompanyId)) own = c; });
                    if (own && v(own, 'CompType') === 'Branch') {
                        $('#cmbToCompany').val(String(res.currentCompanyId)).prop('disabled', true);
                        if ($('#GridAllocatedAccounts tbody tr').length === 0 && $('#GridUnAllocatedAccounts tbody tr').length === 0) show(true);
                    }
                });
            }

            /* cmbToCompany_Leave (withYears) / btnShow_Click */
            function show(withYears) {
                var company = parseInt($('#cmbToCompany').val() || 0);
                if (!company) { clearAll(); alert('Select Company First'); return; }
                $.get('/accounts/allocation/show', { companyId: company, accountTypeIds: $('#CmbAccountType').val() || '', withYears: withYears }, function (res) {
                    if (!res.success) { alert(res.message); return; }
                    grid('GridUnAllocatedAccounts', res.pending);
                    grid('GridAllocatedAccounts', res.allocated);
                    if (withYears) { $('#CmbFinancialYear').html(''); bind('#CmbFinancialYear', res.years, 'Id', 'FinancialYearCode'); $('#CmbFinancialYear').val(''); }
                });
            }

            function allocate() {
                if (selText('#cmbToCompany').trim() === '') { alert('Select Company First'); $('#cmbToCompany').focus(); return; }
                if (selText('#CmbFinancialYear').trim() === '') { alert('Select Financial Year First'); $('#CmbFinancialYear').focus(); return; }
                var rows = [];
                $('#GridUnAllocatedAccounts .chk-row:checked').each(function () { rows.push({ id: parseInt($(this).attr('data-id')), accountTitle: $(this).attr('data-title') }); });
                if (rows.length === 0) { alert("Select Row's First To Allocate"); return; }
                $.ajax({
                    url: '/accounts/allocation/save', type: 'POST', contentType: 'application/json',
                    data: JSON.stringify({ companyId: parseInt($('#cmbToCompany').val()), companyText: selText('#cmbToCompany'),
                                           financialYearId: parseInt($('#CmbFinancialYear').val() || 0), financialYearText: selText('#CmbFinancialYear'), rows: rows }),
                    success: function (res) { alert(res.message); if (res.success) show(false); },
                    error: function () { alert('Server error while allocating.'); }
                });
            }

            function unAllocate() {
                var ids = [];
                $('#GridAllocatedAccounts .chk-row:checked').each(function () { ids.push(parseInt($(this).attr('data-id'))); });
                if (ids.length === 0) { alert("Checked Row's first To Un-Allocate Accounts"); return; }
                var company = parseInt($('#cmbToCompany').val() || 0);
                if (!(company > 0)) { alert('Select Company First To Un-Allocate Accounts'); return; }
                if (!confirm('Are you sure to UnAllocate Accounts?')) return;
                $.ajax({
                    url: '/accounts/allocation/unallocate?companyId=' + company, type: 'POST', contentType: 'application/json',
                    data: JSON.stringify(ids),
                    success: function (res) { alert(res.message); if (res.success) show(false); },
                    error: function () { alert('Server error while un-allocating.'); }
                });
            }

            $(function () {
                $('#cmbToCompany').on('change', function () { show(true); });
                $('#btnShow').on('click', function () { show(false); });
                $('#BtnAllocateAccounts').on('click', allocate);
                $('#btnDeAllocate').on('click', unAllocate);
                $('#btnRefresh').on('click', load);
                $(document).on('change', '.chk-all', function () { $('#' + $(this).data('grid') + ' .chk-row').prop('checked', this.checked); });
                $(document).on('keydown', function (e) { if (e.ctrlKey && e.keyCode === 78) { e.preventDefault(); load(); } });
                load();
            });
        })();
    </script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
