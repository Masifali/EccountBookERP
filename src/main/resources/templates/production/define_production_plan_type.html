<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Define Plan Type - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
</head>
<!-- DefineProductionPlanType.cs (Architecture.WinApp.Production) - ClientSize 605 x 450.
     panel2 (27, Top): toolStrip1 New / Save / Update(hidden) + ctrlGrdBar1 at the right (MyGrid = grddefine).
     panel3 (46, Top): panel6 rgb(10,110,110) with label23 "Define Plan Type", Microsoft Sans Serif 13.8.
     panel5 (55, Top, White): label2 "Description" (13,7) + txtDescription (13,24) 207 x 23, Calibri 9.75.
     panel4 (Fill): grddefine, Verdana 8.25, columns Id (hidden) + Description, TotalRow at the bottom. -->
<body class="pd-body" data-define="plan-type" data-form="DefineProductionPlanType"
      data-api="/api/production/master-data/plan-type" data-desc-col="PlanTypeDescription">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:605px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ProdDefine.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="ProdDefine.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="ProdDefine.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <span id="gridBarMount" class="pd-gridbar-mount"></span>
    </div>
    <div class="pd-caption pd-caption-tall">Define Plan Type</div>
    <div class="pd-entry pd-entry-type">
        <label for="txtDescription">Description</label>
        <input type="text" id="txtDescription" class="win-textbox" style="width:207px;" autocomplete="off"/>
    </div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="grddefine" data-gridbar="DefineProductionPlanType:grddefine" data-gridbar-mount="#gridBarMount">
                <thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Description">Description</th></tr></thead>
                <tbody id="gridBody"></tbody>
                <tfoot><tr class="pd-total-row"><td style="display:none;"></td><td>&nbsp;</td></tr></tfoot>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_define_type.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
