<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production PackingMaterial Consumption Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}">
    <style>
        html, body { overflow-x: hidden; }
        body { font-family: "Segoe UI", Verdana, Tahoma, sans-serif; background-color: #d4d0c8; font-size: 11px; color: #000; margin: 0; }
        .win-tool-strip { background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #999; height: 30px; display: flex; align-items: center; padding: 0 4px; gap: 4px; }
        .win-btn-tool { background: transparent; border: 1px solid transparent; padding: 3px 8px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; height: 24px; border-radius: 2px; }
        .win-btn-tool:hover { background-color: #ffe4a0; border-color: #e59d00; }
        .win-teal-header { background-color: #008080; color: #fff; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        .win-teal-header-title { font-family: Tahoma, sans-serif; font-size: 11pt; font-weight: bold; }
        .win-form-body { background-color: #ece9d8; padding: 6px; }
        .win-group-box { border: 1px solid #999; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; background-color: #f7f5ed; }
        .win-group-box legend { font-family: Tahoma, sans-serif; font-size: 9pt; font-weight: bold; color: #004d40; width: auto; padding: 0 4px; margin-bottom: 4px; border: none; }
        .win-label { font-size: 8.5pt; font-weight: 600; color: #222; white-space: nowrap; margin-bottom: 2px; display: block; }
        .win-textbox, .win-datepicker, .win-combo { font-family: Verdana, sans-serif; font-size: 9pt; height: 24px; border: 1px solid #7a9a9e; padding: 2px 4px; box-sizing: border-box; background: #fff; width: 100%; }
        .win-textbox[readonly] { background: #f0f0f0; color: #333; }
        .win-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .win-field { display: flex; flex-direction: column; min-width: 150px; flex: 1 1 180px; }
        .win-btn-action { background-color: #008080; color: #fff; font-family: Verdana, sans-serif; font-size: 9pt; font-weight: bold; border: 1px solid #004d40; height: 26px; padding: 0 14px; cursor: pointer; border-radius: 2px; }
        .win-btn-action:hover { background-color: #005959; }
        .win-btn-action:disabled { cursor: not-allowed; }
        .is-busy { opacity: .65; cursor: progress !important; }
        .is-busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; vertical-align: -1px; animation: cxspin .6s linear infinite; }
        @keyframes cxspin { to { transform: rotate(360deg); } }

        .cx-multi { position: relative; }
        .cx-multi-panel { position: absolute; z-index: 900; top: 100%; left: 0; min-width: 230px; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #7a9a9e; box-shadow: 0 3px 8px rgba(0,0,0,.25); display: none; }
        .cx-multi.is-open .cx-multi-panel { display: block; }
        .cx-multi-head { background: linear-gradient(to bottom, #ece9d8 0%, #dbd6c6 100%); border-bottom: 1px solid #999; font-size: 8pt; font-weight: 700; color: #004d40; padding: 3px 6px; }
        .cx-multi-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; font-size: 8.5pt; cursor: pointer; }
        .cx-multi-row:hover { background: #e0f2f1; }

        .win-grid-container { border: 1px solid #7a9a9e; background: #fff; width: 100%; }
        .win-grid-scroll { max-height: 460px; overflow: auto; max-width: 100%; }
        .win-grid { width: 100%; border-collapse: collapse; font-family: Verdana, sans-serif; font-size: 8pt; background: #fff; }
        .win-grid th { background: linear-gradient(to bottom, #ece9d8 0%, #dbd6c6 100%); border: 1px solid #999; padding: 4px 5px; text-align: center; position: sticky; top: 0; z-index: 5; white-space: nowrap; }
        .win-grid td { border: 1px solid #d0d0d0; padding: 3px 5px; white-space: nowrap; }
        .win-grid td.num { text-align: right; }
        .win-grid tr:nth-child(even) { background: #fcfcf8; }
        .win-grid tr.cx-grand td { background: #dbd6c6; font-weight: 700; border-top: 2px solid #999; }
        .win-grid-toolbar { display: flex; align-items: center; justify-content: space-between; background: #e0f2f1; border-bottom: 1px solid #7a9a9e; padding: 2px 6px; font-size: 8.5pt; font-weight: 600; color: #004d40; }
        .win-grid-toolbar button { background: #fff; border: 1px solid #7a9a9e; font-size: 8pt; padding: 1px 6px; cursor: pointer; }
        .win-grid-container.is-fullscreen { position: fixed; inset: 0; z-index: 10000; background: #fff; border: none; padding: 6px; display: flex; flex-direction: column; }
        .win-grid-container.is-fullscreen .win-grid-scroll { max-height: calc(100vh - 80px); flex: 1; }
        .cx-note { font-size: 8pt; color: #7a5c00; background: #fff8e1; border: 1px solid #e6c200; padding: 4px 8px; margin-bottom: 6px; }
        @media print {
            .win-tool-strip, .win-group-box, .win-grid-toolbar, button { display: none !important; }
            body { background: #fff !important; }
            .win-grid-scroll { max-height: none !important; overflow: visible !important; }
            .win-grid th, .win-grid td { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" onclick="window.print()"><i class="fa fa-print"></i> Print</button>
    <button type="button" class="win-btn-tool" onclick="PackingMaterialConsumption.exportCsv()"><i class="fa fa-file-excel-o"></i> Export CSV</button>
    <button type="button" class="win-btn-tool" onclick="PackingMaterialConsumption.reset()"><i class="fa fa-file-o"></i> New</button>
    <div style="margin-left:auto;">
        <a href="/production" style="color:#004d40; text-decoration:none; font-weight:bold; font-size:11px;">
            <i class="fa fa-arrow-left"></i> Exit to Dashboard</a>
    </div>
</div>

<div class="win-teal-header">
    <div class="win-teal-header-title"><i class="fa fa-cubes"></i> Production PackingMaterial Consumption Register</div>
    <div><span id="lblCount" style="font-size:9pt;">&nbsp;</span></div>
</div>

<div class="win-form-body">
    <div class="cx-note">
        Shows the same rows as the desktop register. Printing is browser output rather than the
        Crystal layout, and CSV export is additional.
    </div>

    <fieldset class="win-group-box">
        <legend>Filters</legend>
        <div class="win-row">
            <!-- Mandatory: with nothing ticked the desktop refuses to query at all. -->
            <div class="win-field cx-multi" id="branchBox">
                <label class="win-label">Branch Name <span style="color:#a00;">*</span></label>
                <input type="text" id="txtBranchName" class="win-textbox" readonly
                       placeholder="(required)" onclick="PackingMaterialConsumption.toggle()"/>
                <div class="cx-multi-panel">
                    <div class="cx-multi-head">Branch Name</div>
                    <div id="branchRows"></div>
                </div>
            </div>
            <div class="win-field" style="flex:2 1 240px;">
                <label class="win-label">Item Name</label>
                <select id="cmbItem" class="win-combo dtcombo"
                        data-dtcombo="single" data-dtcombo-caption="Item Name"></select>
            </div>
            <div class="win-field" style="flex:2 1 240px;">
                <label class="win-label">PM Item Name</label>
                <select id="cmbPmItem" class="win-combo dtcombo"
                        data-dtcombo="single" data-dtcombo-caption="PM ItemName"></select>
            </div>
            <div class="win-field" style="flex:0 1 150px;">
                <label class="win-label">From Date</label>
                <input type="date" id="datFromDate" class="win-datepicker"/>
            </div>
            <div class="win-field" style="flex:0 1 150px;">
                <label class="win-label">To Date</label>
                <input type="date" id="datToDate" class="win-datepicker"/>
            </div>
            <div class="win-field" style="flex:0 0 auto; min-width:0;">
                <button type="button" id="btnShow" class="win-btn-action"
                        onclick="PackingMaterialConsumption.show()">
                    <i class="fa fa-search"></i> Show</button>
            </div>
        </div>
    </fieldset>

    <div class="win-grid-container" id="gridBox">
        <div class="win-grid-toolbar">
            <span>Consumption Register</span>
            <button type="button" onclick="PackingMaterialConsumption.toggleFullscreen('gridBox')"><i class="fa fa-arrows-alt"></i> Fullscreen</button>
        </div>
        <div class="win-grid-scroll">
            <table class="win-grid">
                <thead><tr id="gridHead"></tr></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_desktop_combo.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_packing_material_consumption.js?v=20260920a}"></script>
</body>
</html>
