<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Order Summary Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <style>
        body { font-family: "Segoe UI", Verdana, Tahoma, sans-serif; background-color: #d4d0c8; font-size: 11px; color: #000; margin: 0; }
        .win-tool-strip { background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #999; height: 30px; display: flex; align-items: center; padding: 0 4px; gap: 4px; }
        .win-btn-tool { background: transparent; border: 1px solid transparent; padding: 3px 8px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; height: 24px; border-radius: 2px; }
        .win-btn-tool:hover { background-color: #ffe4a0; border-color: #e59d00; }
        .win-teal-header { background-color: #008080; color: #fff; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        .win-teal-header-title { font-family: Tahoma, sans-serif; font-size: 11pt; font-weight: bold; }
        .win-form-body { background-color: #ece9d8; padding: 6px; }
        .win-group-box { border: 1px solid #999; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; background-color: #f7f5ed; }
        .win-group-box legend { font-family: Tahoma, sans-serif; font-size: 9pt; font-weight: bold; color: #004d40; width: auto; padding: 0 4px; margin-bottom: 4px; border: none; }
        .win-label { font-size: 8.5pt; font-weight: 600; color: #222; white-space: nowrap; margin-bottom: 2px; display: block; }
        .win-textbox, .win-datepicker { font-family: Verdana, sans-serif; font-size: 9pt; height: 24px; border: 1px solid #7a9a9e; padding: 2px 4px; box-sizing: border-box; background: #fff; width: 100%; }
        .win-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .win-field { display: flex; flex-direction: column; }
        .win-radio-inline { display: inline-flex; align-items: center; gap: 4px; font-weight: normal; margin-right: 12px; cursor: pointer; font-size: 9pt; }
        .win-btn-action { background-color: #008080; color: #fff; font-family: Verdana, sans-serif; font-size: 9pt; font-weight: bold; border: 1px solid #004d40; height: 26px; padding: 0 14px; cursor: pointer; border-radius: 2px; }
        .win-btn-action:hover { background-color: #005959; }
        .is-busy { opacity: .65; cursor: progress !important; }
        .is-busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; vertical-align: -1px; animation: cxspin .6s linear infinite; }
        @keyframes cxspin { to { transform: rotate(360deg); } }
        .win-grid-container { border: 1px solid #7a9a9e; background: #fff; width: 100%; }
        .win-grid-scroll { max-height: 430px; overflow: auto; max-width: 100%; }
        .win-grid { width: 100%; border-collapse: collapse; font-family: Verdana, sans-serif; font-size: 8pt; background: #fff; }
        .win-grid th { background: linear-gradient(to bottom, #ece9d8 0%, #dbd6c6 100%); border: 1px solid #999; padding: 4px 5px; text-align: left; position: sticky; top: 0; z-index: 5; white-space: nowrap; }
        .win-grid td { border: 1px solid #d0d0d0; padding: 3px 5px; white-space: nowrap; }
        .win-grid td.num, .win-grid th.num { text-align: right; }
        .win-grid tfoot td { background: #ececec; font-weight: bold; border-top: 2px solid #999; }
        .win-grid a.jo-link { color: #0645ad; text-decoration: underline; cursor: pointer; }
        .win-grid tbody tr.is-current td { background: #cce8ff; }
        .win-grid tr:nth-child(even) { background: #fcfcf8; }
        .win-grid tbody tr:hover { background: #e0f2f1; }
        .win-grid-toolbar { display: flex; align-items: center; justify-content: space-between; background: #e0f2f1; border-bottom: 1px solid #7a9a9e; padding: 2px 6px; font-size: 8.5pt; font-weight: 600; color: #004d40; }
        .win-grid-toolbar button { background: #fff; border: 1px solid #7a9a9e; font-size: 8pt; padding: 1px 6px; cursor: pointer; }
        .win-grid-container.is-fullscreen { position: fixed; inset: 0; z-index: 10000; background: #fff; border: none; padding: 6px; display: flex; flex-direction: column; }
        .win-grid-container.is-fullscreen .win-grid-scroll { max-height: calc(100vh - 80px); flex: 1; }
        .cx-note { font-size: 8pt; color: #7a5c00; background: #fff8e1; border: 1px solid #e6c200; padding: 4px 8px; margin-bottom: 6px; }
        @media print {
            .win-tool-strip, .win-group-box, .win-grid-toolbar, button { display: none !important; }
            body { background: #fff !important; }
            .win-grid-scroll { max-height: none !important; overflow: visible !important; }
            .win-grid th, .win-grid td { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<!-- frmProductionJobOrderSummaryRpt (screen 975). toolStrip3: &New, &Refresh (no Click handler on
     the desktop - kept, inert), 672-Register, ShortCutKeys. panel3 (Teal): title + the three
     approval radios on the right, Un Approved checked. panel4 (White): From Date (checkbox,
     unticked), To Date, Show. panel5: "Filtered Records" bar + grid. -->
<div class="win-tool-strip">
    <button type="button" class="win-btn-tool" id="btnNew" onclick="JobOrderSummary.reset()" title="Ctrl+N"><i class="fa fa-file-o"></i> <span><u>N</u>ew</span></button>
    <button type="button" class="win-btn-tool" id="btnRefresh" title="The desktop Refresh button has no Click handler."><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
    <button type="button" class="win-btn-tool" id="btnPrint" onclick="JobOrderSummary.print()" title="Ctrl+P"><i class="fa fa-print"></i> 672-Register</button>
    <button type="button" class="win-btn-tool" onclick="JobOrderSummary.shortcuts()" title="Ctrl+Alt"><i class="fa fa-keyboard-o"></i> ShortCutKeys</button>
    <button type="button" class="win-btn-tool" onclick="JobOrderSummary.exportCsv()"><i class="fa fa-file-excel-o"></i> Export CSV</button>
    <div style="margin-left:auto;">
        <a href="/production" style="color:#004d40; text-decoration:none; font-weight:bold; font-size:11px;" title="Ctrl+E / Esc">
            <i class="fa fa-arrow-left"></i> Exit to Dashboard</a>
    </div>
</div>

<div class="win-teal-header">
    <div class="win-teal-header-title">Production Job Order Summary</div>
    <div style="display:flex; gap:14px; align-items:center; font-size:9pt;">
        <label class="win-radio-inline" style="color:#fff;"><input type="radio" name="approval" value="Approved"/> Approved</label>
        <label class="win-radio-inline" style="color:#fff;"><input type="radio" name="approval" value="Unapproved" checked/> Un Approved</label>
        <label class="win-radio-inline" style="color:#fff;"><input type="radio" name="approval" value="All"/> All</label>
    </div>
</div>

<div class="win-form-body" style="background:#fff;">
    <div class="win-row" style="padding:2px 6px 6px;">
        <div class="win-field">
            <label class="win-label" for="datFromDate">
                <input type="checkbox" id="chkFromDate" onchange="JobOrderSummary.toggleFrom()"/> From Date
            </label>
            <input type="date" id="datFromDate" class="win-datepicker" style="width:140px;"/>
        </div>
        <div class="win-field">
            <label class="win-label" for="datToDate">To Date</label>
            <input type="date" id="datToDate" class="win-datepicker" style="width:140px;" required/>
        </div>
        <div class="win-field">
            <button type="button" id="btnShow" class="win-btn-action" onclick="JobOrderSummary.load()" title="Ctrl+S">Show</button>
        </div>
        <div style="margin-left:auto; align-self:center;"><span id="lblCount" style="font-size:9pt;"></span></div>
    </div>

    <div class="win-grid-container" id="gridBox">
        <div class="win-grid-toolbar" style="background:#008080; color:#fff;">
            <span>Filtered Records</span>
            <button type="button" onclick="JobOrderSummary.toggleFullscreen('gridBox')"><i class="fa fa-arrows-alt"></i> Fullscreen</button>
        </div>
        <div class="win-grid-scroll" style="max-height:calc(100vh - 190px); min-height:260px;">
            <table class="win-grid" id="tblSummary">
                <thead><tr id="summaryHead"></tr></thead>
                <tbody id="summaryBody"></tbody>
                <tfoot id="summaryFoot"></tfoot>
            </table>
        </div>
    </div>

    <div class="win-grid-container" id="detailBox" style="margin-top:6px; display:none;">
        <div class="win-grid-toolbar">
            <span id="lblDetailTitle">613_02 Production Settlement</span>
            <button type="button" onclick="JobOrderSummary.toggleFullscreen('detailBox')"><i class="fa fa-arrows-alt"></i> Fullscreen</button>
        </div>
        <div class="win-grid-scroll" style="max-height:300px;">
            <table class="win-grid">
                <thead><tr id="detailHead"></tr></thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_report_kit.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_job_order_summary_report.js?v=20260924a}"></script>
</body>
</html>
