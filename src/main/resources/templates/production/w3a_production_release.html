<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Release - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260928b}">
    <style>
        body { background: #fff; margin: 0; padding-bottom: 12px; }
        .pr-root { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .pr-title { background: #0a6e6e; color: #fff; font: bold 16px Tahoma, sans-serif; padding: 5px 6px; }
        .pr-tabs { display: flex; border-bottom: 1px solid #8fbcbc; }
        .pr-tab { padding: 4px 14px; cursor: pointer; border: 1px solid #8fbcbc; border-bottom: 0; background: #e6f7f7; font: 12px Verdana, sans-serif; }
        .pr-tab.on { background: #fff; font-weight: bold; }
        .pr-filters { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 6px; border-bottom: 1px solid #d0d0d0; align-items: flex-end; }
        .pr-f { display: flex; flex-direction: column; gap: 2px; }
        .pr-f label { font: bold 12px "Segoe UI", Tahoma, sans-serif; white-space: nowrap; }
        .pr-f input, .pr-f select { font: 13px Verdana, sans-serif; height: 26px; border: 1px solid #7a7a7a; padding: 0 3px; box-sizing: border-box; width: 170px; }
        .pr-f input[type=date] { width: 130px; } .pr-f input.sm { width: 90px; }
        .pr-btn { background: #0a6e6e; color: #fff; border: 1px solid #054d4d; font: bold 13px Verdana, sans-serif; height: 26px; padding: 0 14px; cursor: pointer; }
        .pr-btn:hover { background: #054d4d; }
        .pr-host { overflow: auto; max-height: 320px; min-height: 80px; }
        .pr-sub { background: #008080; color: #fff; font: bold 13px "Segoe UI", Tahoma, sans-serif; padding: 2px 6px; }
        table.pr-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; border-collapse: collapse; }
        table.pr-grid th { background: linear-gradient(to bottom, #e6f7f7 0%, #bfe6e6 100%); border: 1px solid #8fbcbc; font-weight: normal; white-space: nowrap; padding: 2px 4px; position: sticky; top: 0; }
        table.pr-grid td { border: 1px solid #d5e6e6; white-space: nowrap; padding: 1px 4px; }
        table.pr-grid td.n { text-align: right; }
        table.pr-grid td a { color: #0000ee; text-decoration: underline; cursor: pointer; }
        table.pr-grid tbody tr.sel td { background: #cde8ff; }
        .pr-msg { padding: 4px 8px; font: 12px Verdana, sans-serif; display: none; }
        .pr-msg.err { color: #b00020; } .pr-msg.ok { color: #0a6e0a; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pr-root" id="prRoot">
    <div class="pr-title">Production Release</div>
    <div class="pr-msg" id="prMsg" role="alert"></div>
    <div class="pr-tabs"><div class="pr-tab on" id="tabPending">Pending Productions</div><div class="pr-tab" id="tabHistory">History</div></div>
    <div id="paneP">
        <div class="pr-filters" id="fP"></div>
        <div class="pr-host" id="gridP"></div>
        <div class="pr-sub">Production Input</div><div class="pr-host" id="gridIn" style="max-height:170px"></div>
        <div class="pr-sub">Production Output</div><div class="pr-host" id="gridOut" style="max-height:170px"></div>
        <div style="padding:6px"><button class="pr-btn" id="btnSave" type="button">Save</button></div>
    </div>
    <div id="paneH" class="is-hidden">
        <div class="pr-filters" id="fH"></div>
        <div class="pr-host" id="gridH"></div>
    </div>
</div>
<script th:src="@{/build/js/countx_w3a_production_release.js?v=20261014w3a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
</body>
</html>
