<!DOCTYPE html>

    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <style>
        /* frmDailyPlantConsumedHours.cs (screen 877) - ClientSize 964 x 461, maximized,
           AutoScrollMinSize 980 x 500. Teal = Color.Teal (#008080). Docking, top to bottom:
           panel1 (136: panel2 50 = menuStrip1 27 + title) / panel4 (26, "History") /
           panel3 (73, groupBox2 "Filters") / grdfrm (Fill). */
        html, body { margin: 0; padding: 0; }
        body { font-family: "Microsoft Sans Serif", "Segoe UI", Verdana, sans-serif; background: #fff; font-size: 9.75pt; color: #000; }
        *, *::before, *::after { box-sizing: border-box; }
        .dp-form { min-width: 980px; min-height: max(100vh, 500px); display: flex; flex-direction: column; }
        .teal { background: #008080; color: #fff; }

        #panel1 { position: relative; height: 136px; flex: 0 0 136px; background: #fff; }
        #panel2 { position: absolute; left: 0; top: 0; right: 0; height: 50px; background: #008080; }
        .dp-menu { position: absolute; left: 0; top: 0; right: 0; height: 27px; display: flex; align-items: stretch;
                   background: linear-gradient(#f7f9fb, #e3e8ee); border-bottom: 1px solid #c9d1da; font: 9.75pt Verdana, sans-serif; }
        .dp-menu button { background: none; border: 1px solid transparent; font: inherit; padding: 0 9px; cursor: pointer; color: #000; }
        .dp-menu button:hover:not(:disabled) { background: #c2e0ff; border-color: #3399ff; }
        .dp-menu button:disabled { color: #888; cursor: not-allowed; }
        #label4 { position: absolute; left: 3px; top: 28px; font: bold 12pt Tahoma, sans-serif; color: #fff; white-space: nowrap; }

        .p1 { position: absolute; }
        .lbl { font: bold 9pt "Segoe UI Semibold", "Segoe UI", sans-serif; white-space: nowrap; }
        .p1.win-combo, .p1 .win-combo { font: 9pt "Microsoft Sans Serif", sans-serif; height: 24px; }
        #panel1 .dtcombo-wrap { position: absolute; }
        .txt { font: 9.75pt "Microsoft Sans Serif", sans-serif; height: 22px; border: 1px solid #7a9a9e; padding: 1px 3px; }
        .txt[readonly] { background: #f0f0f0; }
        .dt { font: 9pt Verdana, sans-serif; height: 22px; border: 1px solid #7a9a9e; }
        .tbtn { background: #008080; color: #fff; font: bold 9.75pt Verdana, sans-serif; border: 1px solid #008080; cursor: pointer; padding: 0; }
        .tbtn:hover:not(:disabled) { background: #006666; }
        .tbtn:disabled { background: #9e9e9e; border-color: #7a7a7a; cursor: not-allowed; }

        #panel4 { height: 26px; flex: 0 0 26px; position: relative; }
        #panel4 .ttl { position: absolute; left: 8px; top: 3px; font: bold 12pt Tahoma, sans-serif; color: #fff; }

        #panel3 { height: 73px; flex: 0 0 73px; position: relative; }
        #groupBox2 { position: absolute; left: 4px; top: 0; width: 958px; height: 70px; margin: 0; padding: 0;
                     border: 1px solid #b7c3cc; font: bold 9.75pt Tahoma, sans-serif; }
        #groupBox2 legend { padding: 0 3px; margin-left: 6px; }
        #groupBox2 .g { position: absolute; }
        #groupBox2 .dtcombo-wrap { position: absolute; }
        .hdt { display: inline-flex; align-items: center; gap: 3px; border: 1px solid #7a9a9e; height: 23px; padding: 0 3px; background: #fff; font: 9.75pt Verdana, sans-serif; }
        .hdt input[type=date] { border: none; font: inherit; width: 112px; }
        .hdt input[type=date]:disabled { color: #999; background: #fff; }
        .rd { font: bold 9pt "Segoe UI Semibold", "Segoe UI", sans-serif; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; cursor: pointer; }
        #groupBox2 .win-combo { font: 9.75pt Verdana, sans-serif; height: 26px; }

        .grid-wrap { flex: 1 1 auto; min-height: 120px; overflow: auto; border: 1px solid #7a9a9e; width: 100%; }
        .grid-wrap:focus { outline: 1px dotted #008080; }
        .grid { border-collapse: collapse; font: 8.25pt Verdana, sans-serif; min-width: 100%; }
        .grid th { background: linear-gradient(to bottom, #fdfdfd 0%, #e4e4e4 100%); border: 1px solid #b8b8b8; padding: 2px 4px; text-align: center;
                   font-weight: normal; position: sticky; top: 0; z-index: 2; white-space: normal; line-height: 1.15; height: 32px; }
        .grid td { border: 1px solid #dcdcdc; padding: 1px 4px; white-space: nowrap; height: 19px; }
        .grid td.num { text-align: right; }
        .grid tbody tr { cursor: default; }
        .grid tbody tr.cur td { background: #cce8ff; }
        .grid a.lnk { color: #0645ad; text-decoration: underline; cursor: pointer; }

        .status { font: 8.5pt "Segoe UI", sans-serif; color: #333; padding: 2px 6px; min-height: 18px; background: #f4f4f4; border-top: 1px solid #ccc; }
        .is-hidden { display: none !important; }
        .is-busy { opacity: .65; cursor: progress !important; }
        .is-busy::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 4px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; vertical-align: -1px; animation: dpspin .6s linear infinite; }
        @keyframes dpspin { to { transform: rotate(360deg); } }

        .dp-modal { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .dp-dlg { background: #fff; border: 1px solid #555; box-shadow: 0 6px 24px rgba(0,0,0,.4); font: 9pt "Segoe UI", sans-serif; max-width: 94vw; }
        .dp-dlg .cap { height: 26px; display: flex; align-items: center; padding: 0 8px; background: #f0f0f0; border-bottom: 1px solid #ccc; }
        .dp-dlg .msg { padding: 14px 16px; white-space: pre-wrap; display: flex; gap: 10px; max-width: 560px; }
        .dp-dlg .msg i { font-size: 22px; }
        .dp-dlg .btns { padding: 8px 12px; background: #f0f0f0; text-align: right; }
        .dp-dlg .btns button { min-width: 72px; margin-left: 6px; height: 24px; }
    </style>

<div class="dp-form" id="frmDailyPlantConsumedHours">

        <span class="p1 lbl" style="left:10px; top:88px;">Plant Name</span>

        <span class="p1 lbl" style="left:361px; top:62px;">Total Working Hours</span>
        <input id="txtTotalWorkingHours" class="p1 txt" data-guard="decimal" autocomplete="off"
               style="left:484px; top:58px; width:125px;" tabindex="3">
        <span class="p1 lbl" style="left:361px; top:87px;">Actual Hours</span>
        <input id="txtConsumedHours" class="p1 txt" data-guard="decimal" autocomplete="off"

        <input id="txtDocdate" type="date" class="p1 dt" style="left:719px; top:85px; width:125px;" tabindex="6">
    </div>

    <!-- ================================================================ panel4 (teal 26) -->
    <div id="panel4" class="teal"><span class="ttl">History</span></div>

    <!-- ================================================================ panel3 (73) + groupBox2 -->
    <div id="panel3">
        <fieldset id="groupBox2">
            <legend>Filters</legend>
            <span class="g lbl" style="left:3px; top:20px;">From Date</span>

            </label>
            <span class="g lbl" style="left:151px; top:19px;">To Date</span>

            </label>
            <span class="g lbl" style="left:293px; top:20px;">Job Order</span>
            <select id="CmbInvoiceNoHistory" class="g win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="job Order No"

            <span class="g lbl" style="left:474px; top:19px;">Reason</span>
            <select id="CmbReasonHistory" class="g win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="DownTime Reason"

            <button type="button" id="btnShowHistory" class="g tbtn" style="left:656px; top:37px; width:60px; height:26px;" tabindex="16">Show</button>
            <label class="g rd" style="left:696px; top:18px;"><input type="radio" name="histDate" id="drdocdate" value="doc" checked tabindex="17">Report Date</label>
            <label class="g rd" style="left:784px; top:18px;"><input type="radio" name="histDate" id="rdentrydate" value="entry" tabindex="18">Entry Date</label>

        </fieldset>
