<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Define Plant - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
</head>
<!-- DefineProductionPlant.cs (Architecture.WinApp.Production) - ClientSize 479 x 529.
     panel2 (27, Top): toolStrip1 New / Save / Update(hidden) / "Warehouse Allocation to Plant", Verdana 9.75.
     panel3 (29, Top, Teal): label23 "Define Plant", Tahoma 12 bold white.
     panel5 (142, Top, White): Code (155,7) 228x23, Description (155,35), Branch Name UltraCombo (155,64) 228x24,
       labels Segoe UI Semibold 9 at x=70; Cancel (229,94), Save (308,94), Update (308,94, hidden) - 75x28 teal.
     panel4 (Fill): panel6 (29, Teal) "History" + ctrlGrdBar1 (MyGrid = null), then grddefine, Verdana 8.25,
       columns Id (hidden), Code, Description, BranchName; TotalRow at the bottom. -->
<body class="pd-body">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form" style="max-width:479px;">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ProdPlant.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="ProdPlant.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="ProdPlant.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnWarehouseAllocation" class="win-btn-tool" accesskey="w" onclick="ProdPlant.btnWarehouseAllocation(this)"><span><u>W</u>arehouse Allocation to Plant</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Define Plant</div>
    <div class="pd-entry pd-entry-plant">
        <div class="pd-row"><label for="txtcountrycode">Code</label><input type="text" id="txtcountrycode" class="win-textbox" autocomplete="off"/></div>
        <div class="pd-row"><label for="txtcountryName">Description</label><input type="text" id="txtcountryName" class="win-textbox" autocomplete="off"/></div>
        <div class="pd-row"><label for="cmbbranch">Branch Name</label>
            <select id="cmbbranch" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select></div>
        <div class="pd-row pd-buttons"><span></span><div>
            <button type="button" id="BtnCancel" class="win-btn-action" onclick="ProdPlant.cancel()">Cancel</button>
            <button type="button" id="BtnSavef" class="win-btn-action" onclick="ProdPlant.btnsave(this)">Save</button>
            <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="ProdPlant.btnUpdate(this)">Update</button>
        </div></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>History</span><span id="gridBarMount" class="pd-gridbar-mount"></span></div>
    <div class="pd-grid-box">
        <div class="win-grid-scroll">
            <table class="win-grid" id="grddefine" data-gridbar="DefineProductionPlant:grddefine" data-gridbar-mount="#gridBarMount" data-gridbar-nullgrid="true">
                <thead><tr><th data-col="Id" style="display:none;">Id</th><th data-col="Code">Code</th><th data-col="Description">Description</th><th data-col="BranchName">BranchName</th></tr></thead>
                <tbody id="gridBody"></tbody>
                <tfoot><tr class="pd-total-row"><td style="display:none;"></td><td>&nbsp;</td><td></td><td></td></tr></tfoot>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_prod_define_plant.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
