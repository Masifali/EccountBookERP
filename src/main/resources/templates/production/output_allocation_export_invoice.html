<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Production Output Allocation With Export Invoice</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <style>
        /* ProductionOutputAllocationWithExportInvoice.cs - ClientSize 609 x 591, maximized,
           AutoScrollMinSize 1100 x 800. tabControl1 (Fill, Alignment Bottom): "Form" | "History".
           Teal = Color.Teal (#008080); btnShow = Color.FromArgb(10,110,110). */
        html, body { margin: 0; padding: 0; height: 100%; }
        body { font-family: Verdana, "Segoe UI", sans-serif; background: #fff; font-size: 9.75pt; color: #000; }
        *, *::before, *::after { box-sizing: border-box; }
        .pa-form { min-width: 609px; height: 100vh; min-height: 591px; display: flex; flex-direction: column; }
        .pa-pages { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; border: 1px solid #b7c3cc; margin: 4px 4px 0; }
        .pa-page { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 3px; }
        .pa-tabs { flex: 0 0 24px; display: flex; gap: 2px; padding: 0 6px 4px; }
        .pa-tabs button { font: 9pt "Segoe UI", sans-serif; border: 1px solid #b7c3cc; border-top: none; background: #eef2f5; padding: 2px 12px; cursor: pointer; border-radius: 0 0 3px 3px; }
        .pa-tabs button.on { background: #fff; font-weight: bold; margin-top: -1px; }
        .teal { background: #008080; color: #fff; }

        .tool { flex: 0 0 27px; display: flex; align-items: stretch; gap: 1px; background: linear-gradient(#f7f9fb, #e3e8ee); border-bottom: 1px solid #c9d1da; font: 9.75pt Verdana, sans-serif; }
        .tool button { background: none; border: 1px solid transparent; font: inherit; padding: 0 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: #000; }
        .tool button:hover:not(:disabled) { background: #c2e0ff; border-color: #3399ff; }
        .tool button:disabled { color: #888; cursor: not-allowed; }
        .tool .fa { color: #1b6f8a; }
        .bar29 { flex: 0 0 29px; position: relative; }
        .bar29 > span, .bar26 > span { position: absolute; left: 2px; top: 3px; font: bold 12pt Tahoma, sans-serif; color: #fff; white-space: nowrap; }
        .bar26 { flex: 0 0 26px; position: relative; }
        .bar29 > .gb-gear, .bar26 > .gb-gear { position: absolute; right: 4px; top: 2px; }
        .bar26 > span { left: 5px; top: 2px; font: bold 11pt Tahoma, sans-serif; }
        .lbl { font: bold 9pt "Segoe UI Semibold", "Segoe UI", sans-serif; white-space: nowrap; position: absolute; }
        #panel5 { flex: 0 0 37px; position: relative; background: #fff; }
        #panel20 { flex: 0 0 53px; position: relative; background: #fff; }
        #panel5 .dtcombo-wrap, #panel20 .dtcombo-wrap { position: absolute; }
        .abs { position: absolute; }
        .win-combo { font: 9.75pt Verdana, sans-serif; height: 26px; }
        .hdt { display: inline-flex; align-items: center; gap: 3px; border: 1px solid #7a9a9e; height: 23px; padding: 0 3px; background: #fff; font: 9.75pt Verdana, sans-serif; }
        .hdt input[type=date] { border: none; font: inherit; width: 104px; }
        .hdt input[type=date]:disabled { color: #999; background: #fff; }
        #btnShow { background: rgb(10,110,110); color: #fff; font: bold 9.75pt Verdana, sans-serif; border: 1px solid rgb(10,110,110); cursor: pointer; }
        #btnShow:disabled { background: #9e9e9e; }

        .grid-wrap { flex: 1 1 auto; min-height: 120px; overflow: auto; border: 1px solid #7a9a9e; width: 100%; background: #fff; }
        .grid-wrap:focus { outline: 1px dotted #008080; }
        .grid { border-collapse: collapse; font: 8.25pt Verdana, sans-serif; min-width: 100%; table-layout: fixed; }
        .grid th { background: linear-gradient(to bottom, #fdfdfd 0%, #e4e4e4 100%); border: 1px solid #b8b8b8; padding: 2px 4px; text-align: center;
                   font-weight: normal; position: sticky; top: 0; z-index: 3; white-space: normal; line-height: 1.15; overflow: hidden; }
        .grid td { border: 1px solid #dcdcdc; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 20px; }
        .grid td.num { text-align: right; }
        .grid td.frz, .grid th.frz { position: sticky; z-index: 2; background: #f6f6f6; }
        .grid th.frz { z-index: 4; }
        .grid tbody tr.cur td { background: #cce8ff; }
        .grid tfoot td { background: #ececec; font-weight: bold; border-top: 2px solid #999; position: sticky; bottom: 0; }
        .grid a.lnk { color: #0645ad; text-decoration: underline; cursor: pointer; }
        .grid input.edit { width: 100%; height: 18px; border: 1px solid #7a9a9e; font: 8.25pt Verdana, sans-serif; text-align: right; padding: 0 2px; }
        .grid select.edit { width: 100%; height: 19px; font: 8.25pt Verdana, sans-serif; }
        .grid button.cb { width: 100%; height: 18px; font: bold 8pt Verdana, sans-serif; padding: 0; cursor: pointer; }

        .status { font: 8.5pt "Segoe UI", sans-serif; color: #333; padding: 2px 6px; min-height: 18px; background: #f4f4f4; border-top: 1px solid #ccc; }
        .is-hidden { display: none !important; }
        .is-busy { opacity: .65; cursor: progress !important; }
        .is-busy::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 4px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; vertical-align: -1px; animation: paspin .6s linear infinite; }
        @keyframes paspin { to { transform: rotate(360deg); } }

        .pa-modal { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .pa-dlg { background: #fff; border: 1px solid #555; box-shadow: 0 6px 24px rgba(0,0,0,.4); font: 9pt "Segoe UI", sans-serif; max-width: 94vw; }
        .pa-dlg .cap { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: #f0f0f0; border-bottom: 1px solid #ccc; }
        .pa-dlg .cap button { border: none; background: none; font-size: 15px; cursor: pointer; }
        .pa-dlg .msg { padding: 14px 16px; white-space: pre-wrap; display: flex; gap: 10px; max-width: 560px; }
        .pa-dlg .msg i { font-size: 22px; }
        .pa-dlg .btns { padding: 8px 12px; background: #f0f0f0; text-align: right; }
        .pa-dlg .btns button { min-width: 72px; margin-left: 6px; height: 24px; }
        #dlgInvoice .grid-wrap { width: 560px; height: 380px; max-width: 94vw; }
        #dlgInvoice .flt { padding: 4px 6px; border-bottom: 1px solid #ddd; }
        #dlgInvoice .flt input { width: 100%; height: 22px; font: 9pt Verdana, sans-serif; }
    </style>
</head>
<body>
<div class="pa-form" id="ProductionOutputAllocationWithExportInvoice">
    <div class="pa-pages">
        <!-- ============================================================ tabPage1 "Form" -->
        <div class="pa-page" id="tabPage1">
            <div class="tool" id="toolStrip1">
                <button type="button" id="btnnew"><i class="fa fa-plus-circle"></i><u>N</u>ew</button>
                <button type="button" id="btnsave"><i class="fa fa-floppy-o"></i><u>S</u>ave</button>
                <button type="button" id="btnUpdate" class="is-hidden"><i class="fa fa-pencil"></i><u>U</u>pdate</button>
                <button type="button" id="btnPrint627"><i class="fa fa-print"></i>Print-627</button>
            </div>
            <div class="bar29 teal" id="panel3"><span>Production Output Allocation With Export Invoice</span></div>
            <div id="panel5">
                <span class="lbl" style="left:7px; top:11px;">Job Order</span>
                <select id="CmbJobOrder" class="abs win-combo dtcombo" data-dtcombo="poaJobOrder" data-dtcombo-caption="Job Order No"
                        style="left:92px; top:5px; width:228px;"></select>
            </div>
            <div class="bar29 teal" id="panel6"><span>Output Items Information Against Job Order </span></div>
            <div class="grid-wrap" id="wrapGrd" tabindex="0"><table class="grid" id="grd" data-gridbar="ProductionOutputAllocationWithExportInvoice:grd" data-gridbar-mount="#panel6"></table></div>
        </div>

        <!-- ============================================================ tabPage2 "History" -->
        <div class="pa-page is-hidden" id="tabPage2">
            <div class="tool" id="toolStrip2">
                <button type="button" id="btnResetHistory"><i class="fa fa-plus-circle"></i><u>N</u>ew</button>
                <button type="button" id="btnRefreshHistory"><i class="fa fa-refresh"></i>Refresh</button>
            </div>
            <div class="bar29 teal" id="panel1"><span>History</span></div>
            <div id="panel20">
                <span class="lbl" style="left:7px; top:4px;">Date From </span>
                <label class="abs hdt" style="left:7px; top:25px; width:135px;">
                    <input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory">
                </label>
                <span class="lbl" style="left:144px; top:4px;">Date To</span>
                <label class="abs hdt" style="left:144px; top:25px; width:132px;">
                    <input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory">
                </label>
                <span class="lbl" style="left:278px; top:4px;">Job Order No</span>
                <select id="CmbJobOrderNoHistory" class="abs win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Job Order No"
                        style="left:278px; top:23px; width:239px;"></select>
                <button type="button" id="btnShow" class="abs" style="left:519px; top:23px; width:68px; height:26px;">Show</button>
            </div>
            <div class="bar26 teal" id="panel11"><span>Filtered Records</span></div>
            <div class="grid-wrap" id="wrapHistory" tabindex="0"><table class="grid" id="DataGridHistory" data-gridbar="ProductionOutputAllocationWithExportInvoice:DataGridHistory" data-gridbar-mount="#panel11"></table></div>
        </div>
    </div>
    <div class="pa-tabs" id="tabControl1">
        <button type="button" data-tab="0" class="on">Form</button>
        <button type="button" data-tab="1">History</button>
    </div>
    <div class="status" id="lblStatus"></div>
</div>

<!-- GrdPopUp(dtInvoice, "Id", "InvoiceNo") - F1 on the Export Invoice cell -->
<div class="pa-modal is-hidden" id="dlgInvoice">
    <div class="pa-dlg">
        <div class="cap"><span>Export Invoice</span><button type="button" data-close>&times;</button></div>
        <div class="flt"><input type="text" id="txtInvoiceFilter" placeholder="Search"></div>
        <div class="grid-wrap" tabindex="0"><table class="grid" id="grdInvoicePopup" style="table-layout:auto"></table></div>
    </div>
</div>

<script th:src="@{/build/js/countx_report_kit.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_output_allocation.js?v=20260925g}"></script>
</body>
</html>
