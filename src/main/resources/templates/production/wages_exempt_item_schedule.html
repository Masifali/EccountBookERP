<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Wages Exempt Item Schedule - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <style>
        /* WagesExemptItemSchedule (Architecture.WinApp.Lookups) - 479 x 594, CenterScreen. Form BackColor Teal
           (Load), panel1 White (Fill): toolStrip1, panel2 (the entry, 180 high), panel6 "History" bar
           rgb(10,110,110), panel3 with the grid (Fill). */
        html, body { height: 100%; }
        body { font-family: "Segoe UI", Verdana, Tahoma, sans-serif; background-color: teal; font-size: 11px; color: #000; margin: 0; }
        *, *::before, *::after { box-sizing: border-box; }
        .we-form { background: #fff; max-width: 720px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
        .win-tool-strip { background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #999; min-height: 27px; display: flex; align-items: center; padding: 0 4px; gap: 2px; flex-wrap: wrap; font-family: Verdana, sans-serif; }
        .win-btn-tool { background: transparent; border: 1px solid transparent; padding: 2px 8px; font-size: 9.75pt; font-family: Verdana, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; height: 24px; border-radius: 2px; color: #000; }
        .win-btn-tool:hover:not(:disabled) { background-color: #cce8ff; border-color: #99d1ff; }
        .win-btn-tool:disabled { color: #999; cursor: not-allowed; }
        .we-entry { padding: 8px 16px 4px 16px; }
        .we-row { display: grid; grid-template-columns: 110px minmax(0, 272px); gap: 6px; align-items: center; margin-bottom: 4px; }
        .we-row label { font-family: "Segoe UI Semibold", "Segoe UI", sans-serif; font-weight: bold; font-size: 9.75pt; margin: 0; white-space: pre-line; line-height: 1.1; }
        .win-textbox, .win-combo, .win-datepicker { font-family: Verdana, sans-serif; font-size: 9.75pt; height: 25px; border: 1px solid #7a9a9e; padding: 2px 4px; background: #fff; border-radius: 0; width: 100%; }
        .we-buttons { display: grid; grid-template-columns: 110px minmax(0, 272px); gap: 6px; }
        .we-buttons > div { display: flex; justify-content: flex-end; gap: 4px; }
        .win-btn-action { background-color: teal; color: #fff; font-family: Tahoma, sans-serif; font-size: 9.75pt; font-weight: bold; border: 1px solid #004d40; height: 28px; width: 75px; cursor: pointer; }
        .win-btn-action:hover:not(:disabled) { background-color: #005959; }
        .win-btn-action:disabled { background: #9e9e9e; border-color: #7a7a7a; cursor: not-allowed; }
        .we-bar { background: rgb(10,110,110); color: #fff; height: 31px; display: flex; align-items: center; padding: 0 8px; font: bold 12pt Tahoma, sans-serif; }
        .we-grid-box { flex: 1; min-height: 240px; display: flex; flex-direction: column; }
        .win-grid-scroll { flex: 1; overflow: auto; max-width: 100%; max-height: calc(100vh - 290px); min-height: 200px; }
        .win-grid { width: 100%; border-collapse: collapse; font-family: Verdana, sans-serif; font-size: 8.25pt; background: #fff; }
        .win-grid th { background: linear-gradient(to bottom, #fdfdfd 0%, #e4e4e4 100%); border: 1px solid #b8b8b8; padding: 3px 5px; text-align: left; position: sticky; top: 0; z-index: 5; white-space: nowrap; font-weight: normal; }
        .win-grid td { border: 1px solid #dcdcdc; padding: 2px 5px; white-space: nowrap; }
        .win-grid tbody tr { cursor: default; }
        .win-grid tbody tr.is-current td { background: #cce8ff; }
        .win-grid .we-edit { border: 1px solid #9a9a9a; background: #f3f3f3; font-size: 8pt; padding: 0 6px; cursor: pointer; }
        .is-hidden { display: none !important; }
        .is-busy { opacity: .65; cursor: progress !important; pointer-events: none; }
        .is-busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; vertical-align: -1px; animation: cxspin .6s linear infinite; }
        @keyframes cxspin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .we-row, .we-buttons { grid-template-columns: 1fr; } .we-entry { padding: 8px; } }
    </style>
</head>
<body>
<div class="we-form">
    <!-- toolStrip1: New / Save / Update (Update hidden until a history row is read). -->
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="WagesExempt.btnnew()"><i class="fa fa-file-o"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="WagesExempt.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="WagesExempt.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
    </div>

    <!-- panel2 -->
    <div class="we-entry">
        <div class="we-row"><label for="EffectiveDateFrom">Effective From</label><input type="date" id="EffectiveDateFrom" class="win-datepicker" title="dd-MMM-yy"/></div>
        <div class="we-row"><label for="EffectiveDateTo">Effective To</label><input type="date" id="EffectiveDateTo" class="win-datepicker" title="dd-MMM-yy"/></div>
        <div class="we-row"><label for="cmbRefDocType">Documnet Type</label>
            <select id="cmbRefDocType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Document Type"></select></div>
        <div class="we-row"><label for="cmbItem">Item Name</label>
            <select id="cmbItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <div class="we-row"><label for="cmbWagesAccount">Labour /
Wages Activity</label>
            <select id="cmbWagesAccount" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Wages Account"></select></div>
        <div class="we-buttons"><span></span><div>
            <button type="button" id="BtnCancel" class="win-btn-action" onclick="WagesExempt.cancel()">Cancel</button>
            <button type="button" id="BtnSavef" class="win-btn-action" onclick="WagesExempt.btnsave(this)">Save</button>
            <button type="button" id="btnUpdateF" class="win-btn-action is-hidden" onclick="WagesExempt.btnUpdate(this)">Update</button>
        </div></div>
    </div>

    <!-- panel6 + panel3: the history grid (Edit button first; double-click reads the row). -->
    <div class="we-bar">History</div>
    <div class="we-grid-box">
        <div class="win-grid-scroll"><table class="win-grid" id="tblHistory"><thead><tr id="histHead"></tr></thead><tbody id="gridHistory"></tbody></table></div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_wages_exempt.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
