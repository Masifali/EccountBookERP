<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Work Station - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_w3b_mfg.css?v=20261014a}"/>
</head>
<body>
<div class="rc-page" style="min-width:650px;max-width:900px;">
    <!-- Screen 771 - ProductionWorkStation (InitializeComponent: toolStrip1, teal title, panel1 input panel 650 wide, grdDetail fill grouped by Department). -->
    <div class="rc-strip" id="toolStrip1">
        <button type="button" class="rc-tool" id="btnnew" onclick="Ws.reset()" title="Ctrl+N"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="rc-tool" id="btnsave" onclick="Ws.save()" title="Ctrl+S"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="rc-tool is-hidden" id="btnUpdate" onclick="Ws.update()" title="Ctrl+U"><i class="fa fa-pencil-square-o"></i> Update</button>
        <button type="button" class="rc-tool" id="btnRefresh" onclick="Ws.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
        <button type="button" class="rc-tool" id="BtnDefineDepartment" onclick="Ws.defineDepartment()"><i class="fa fa-building-o"></i> Define Department</button>
        <button type="button" class="rc-tool" id="btnShortcutkeys" onclick="Ws.shortcutKeys()">ShortCut Keys</button>
        <a class="rc-exit" href="/production" title="Ctrl+E / Esc"><i class="fa fa-sign-out"></i> Exit</a>
    </div>
    <div class="rc-teal" style="height:28px;"><span class="rc-teal-title" style="left:5px;top:4px;font-size:16px;line-height:19px;">Production Work Station</span></div>
    <div class="w3-form" style="height:122px;">
        <label class="rc-abs rc-lbl" for="cmbDepartmentTo" style="left:5px;top:14px;">Department</label>
        <select id="cmbDepartmentTo" class="rc-abs rc-cmb dtcombo" data-dtcombo="single" data-dtcombo-caption="Department" style="left:121px;top:8px;width:231px;"></select>
        <label class="rc-abs rc-lbl" for="txtStationName" style="left:5px;top:41px;">Work Station Name</label>
        <input type="text" id="txtStationName" class="rc-abs rc-in" style="left:121px;top:37px;width:231px;" maxlength="150" autocomplete="off">
        <label class="rc-abs rc-lbl" for="txtWorkStationcode" style="left:5px;top:67px;">Work Station Code</label>
        <input type="text" id="txtWorkStationcode" class="rc-abs rc-in" style="left:121px;top:63px;width:231px;" maxlength="50" autocomplete="off">
        <label class="rc-abs rc-lbl" for="txtelectricityCost" style="left:5px;top:94px;">Electricity Cost</label>
        <input type="text" id="txtelectricityCost" class="rc-abs rc-in num" style="left:121px;top:90px;width:231px;" inputmode="decimal" data-dec="1">
        <label class="rc-abs rc-lbl" for="txtproductionCapacity" style="left:368px;top:14px;">Production Capacity</label>
        <input type="text" id="txtproductionCapacity" class="rc-abs rc-in num" style="left:482px;top:10px;width:150px;" inputmode="decimal" data-dec="1">
        <label class="rc-abs rc-lbl" for="txtrentCost" style="left:368px;top:41px;">Rent Cost</label>
        <input type="text" id="txtrentCost" class="rc-abs rc-in num" style="left:482px;top:37px;width:150px;" inputmode="decimal" data-dec="1">
        <label class="rc-abs rc-lbl" for="txtwages" style="left:368px;top:67px;">Wages</label>
        <input type="text" id="txtwages" class="rc-abs rc-in num" style="left:482px;top:63px;width:150px;" inputmode="decimal" data-dec="1">
        <label class="rc-abs rc-lbl" style="left:482px;top:92px;display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chkIsActive" checked style="margin:0">Active</label>
        <button type="button" id="BtnSaveII" class="rc-abs rc-btn" style="left:550px;top:88px;width:75px;height:26px;" onclick="Ws.saveII()">Save</button>
    </div>
    <div class="w3-host" id="grdDetailHost" style="height:400px;">
        <table class="rc-grid" id="grdDetail" title="Double click a row to edit"></table>
    </div>
</div>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_w3b_common.js?v=20261014a}"></script>
<script th:src="@{/build/js/countx_w3b_production_work_station.js?v=20261014a}"></script>
</body>
</html>
