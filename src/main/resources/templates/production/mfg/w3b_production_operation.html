<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Operation - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_w3b_mfg.css?v=20261014a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="rc-page" style="min-width:340px;max-width:620px;">
    <!-- Screen 770 - ProductionOperation (InitializeComponent: toolStrip1, panel4 teal title, panel1 white input panel, grdDetail fill). -->
    <div class="rc-strip" id="toolStrip1">
        <button type="button" class="rc-tool" id="btnnew" onclick="Op.reset()" title="Ctrl+N"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="rc-tool" id="btnsave" onclick="Op.save()" title="Ctrl+S"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="rc-tool is-hidden" id="btnUpdate" onclick="Op.update()" title="Ctrl+U"><i class="fa fa-pencil-square-o"></i> Update</button>
        <button type="button" class="rc-tool" id="btnShortcutkeys" onclick="Op.shortcutKeys()">ShortCut Keys</button>
        <a class="rc-exit" href="/production" title="Ctrl+E / Esc"><i class="fa fa-sign-out"></i> Exit</a>
    </div>
    <div class="rc-teal" style="height:28px;"><span class="rc-teal-title" style="left:5px;top:4px;font-size:16px;line-height:19px;">Production Operation</span></div>
    <div class="w3-form" style="height:71px;">
        <label class="rc-abs rc-lbl" for="txtOperationName" style="left:7px;top:14px;">Operation Name</label>
        <input type="text" id="txtOperationName" class="rc-abs rc-in" style="left:106px;top:10px;width:196px;" maxlength="150" autocomplete="off">
        <button type="button" id="BtnSaveII" class="rc-abs rc-btn" style="left:227px;top:39px;width:75px;height:26px;" onclick="Op.saveII()">Save</button>
    </div>
    <div class="w3-host" id="grdDetailHost" style="height:420px;">
        <table class="rc-grid" id="grdDetail" title="Double click a row to edit"></table>
    </div>
</div>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_w3b_common.js?v=20261014a}"></script>
<script th:src="@{/build/js/countx_w3b_production_operation.js?v=20261014a}"></script>
</body>
</html>
