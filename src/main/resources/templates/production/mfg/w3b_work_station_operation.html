<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work Station Operation - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_w3b_mfg.css?v=20261014a}"/>
</head>
<body>
<div class="rc-page" style="min-width:709px;max-width:1000px;">
    <!-- Screen 595 - WorkStationOperation (InitializeComponent: toolStrip1, teal title, panel1 58 high, grdDetail (left 350) | grdII (350)). -->
    <div class="rc-strip" id="toolStrip1">
        <button type="button" class="rc-tool" id="btnnew" onclick="Wso.reset()" title="Ctrl+N"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="rc-tool" id="btnRefresh" onclick="Wso.refresh()" title="Ctrl+R"><i class="fa fa-refresh"></i> Refresh</button>
        <button type="button" class="rc-tool" id="btnsave" onclick="Wso.save()" title="Ctrl+S"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="rc-tool is-hidden" id="btnUpdate" onclick="Wso.update()" title="Ctrl+U"><i class="fa fa-pencil-square-o"></i> Update</button>
        <button type="button" class="rc-tool" id="BtnOperation" onclick="Wso.defineOperations()" title="Ctrl+F1"><i class="fa fa-cogs"></i> Define Operations</button>
        <button type="button" class="rc-tool" id="btnShortcutkeys" onclick="Wso.shortcutKeys()">ShortCut Keys</button>
        <a class="rc-exit" href="/production" title="Ctrl+E / Esc"><i class="fa fa-sign-out"></i> Exit</a>
    </div>
    <div class="rc-teal" style="height:28px;"><span class="rc-teal-title" style="left:5px;top:4px;font-size:16px;line-height:19px;">Work Station Operation</span></div>
    <div class="w3-form" style="height:58px;">
        <label class="rc-abs rc-lbl" style="left:25px;top:6px;">Work Station Name</label>
        <select id="cmbworkstationname" class="rc-abs rc-cmb dtcombo" data-dtcombo="single" data-dtcombo-caption="Station Name" style="left:28px;top:24px;width:201px;"></select>
        <label class="rc-abs rc-lbl" style="left:235px;top:6px;">Operation Name</label>
        <select id="cmboperationname" class="rc-abs rc-cmb dtcombo" data-dtcombo="single" data-dtcombo-caption="Operation Name" style="left:235px;top:24px;width:201px;"></select>
        <label class="rc-abs rc-lbl" for="txtOpHoursPerDay" style="left:439px;top:6px;">Hours/Day</label>
        <input type="text" id="txtOpHoursPerDay" class="rc-abs rc-in num" style="left:439px;top:26px;width:150px;" inputmode="decimal">
        <button type="button" id="BtnSaveII" class="rc-abs rc-btn" style="left:600px;top:26px;width:75px;height:26px;" onclick="Wso.saveII()">Save</button>
    </div>
    <div style="display:flex;gap:0;">
        <div class="w3-host" id="grdDetailHost" style="height:470px;flex:1 1 50%;"><table class="rc-grid" id="grdDetail" title="Grouped by Work Station - double click a row to edit"></table></div>
        <div class="w3-host" id="grdIIHost" style="height:470px;flex:1 1 50%;"><table class="rc-grid" id="grdII" title="Grouped by Operation - double click a row to edit"></table></div>
    </div>
</div>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_w3b_common.js?v=20261014a}"></script>
<script th:src="@{/build/js/countx_w3b_work_station_operation.js?v=20261014a}"></script>
</body>
</html>
