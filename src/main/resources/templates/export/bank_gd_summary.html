<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Bank Gd Summary Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpta.css?v=20260930a}"/>
</head>
<!-- BankGdSummary.cs (Architecture.WinApp.ExportReports), screen 272 "Bank Gd Summary", ClientSize 800 x 450.
     tsItemType: btnnew "&New" / btnPrint "289-Print" / btnShortCutKey "ShortCut Keys". panel5 (Teal) "Bank Gd Summary Register".
     panel1: label50 "From  Balance", txtzerBalance (KeyPress OnlytextNumberFunction), btnShow "Show" (Teal).
     panel2 (Teal) "History" + ctrlGrdBar1. grdfrm (Fill): GdId / DocumentTypeId hidden, GdNo link -> frmGDBreakUp.
     Events: Load (focus txtzerBalance, btnShow_Click), KeyDown (Enter, Ctrl+E/Esc, Ctrl+P, Ctrl+S, Ctrl+N, Ctrl+F5, Ctrl+Down,
     Ctrl+Up, Ctrl+Alt), btnnew (Reset: clears the text only), btnShow (GridFill), btnPrint (289), btnShortCutKey, grdfrm LinkClicked. -->
<body class="pd-body" data-export-page="bgd">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ExportBgd.btnNew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" onclick="ExportBgd.print(this)" data-rpt="289-BankGdsSummaryRegister.rpt"><i class="fa fa-print"></i> <span>289-Print</span></button>
        <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportBgd.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal" style="height:28px;"><span>Bank Gd Summary Register</span></div>
    <div class="rpta-filter" id="panel1">
        <div class="ex-field" style="width:auto;"><label for="txtzerBalance" style="width:95px;">From  Balance</label>
            <input type="text" id="txtzerBalance" class="win-textbox num" data-guard="integer" style="width:180px;" autocomplete="off"/>
            <button type="button" id="btnShow" class="win-btn-small" style="width:75px;height:26px;margin-left:9px;background:teal;color:#fff;" onclick="ExportBgd.show(this)">Show</button></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:28px;"><span>History</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdfrm" tabindex="0"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip" id="bgdFooter">
        <span class="ex-footer-left">BankGdSummary - screen 272 - Print 289</span>
        <button type="button" class="win-btn-history" id="btnBgdFooterHistory" onclick="ExportBgd.show(document.getElementById('btnShow'))"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpta_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_rptn_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_bank_gd_summary.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
