<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Export Shipment Weight Audit - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rptb.css?v=20260930a}"/>
</head>
<!-- frmAuditByWeightReport.cs (Architecture.WinApp.Audit_Dashboard), screen 261 "5016 Export Shipment Weight Audit", ClientSize 969 x 648
     (AutoScrollMinSize 980 x 600), form Text "Summary By Month".
     tsItemType: btnnew "&New" | btnPrint "618-Print" | btnPrint618_01 "618_01-Print" | btnShortCutKey "ShortCut Keys".
     panel5 (Teal) label3 "Export Shipment Weight Audit".
     Filters: cmbperemeter "Date Type" (CommonServices.DateType, Rows[1] = This Week on load), txtdatefrom "Date From *", txtdateto "Date To *",
       CmbInvoiceNo "InvoiceNo", CmbContractNo "Contract No", rdAll "All" (checked) / rdCompleted "Completed" / RdInProcess "In Process", btnShow "Show".
     panel6 (Teal) label2 "Main Information" + ctrlGrdBar1; grd (SelectionChanged fills grdDetail; LinkClicked InvoiceNo 618 by invoice,
       DoGrossWeight > 0 -> DeliveryOrderHistory Export / with second weight; ColumnButtonClick "Print" 501 - no such column is added).
     panel8 (Teal) label6 "Detail Information Of Above Selected Row" + ctrlGrdBar2; grdDetail (LinkClicked GpNo 258 gate pass with WB, DONo 396 DO slip).
     Events: Load, cmbperemeter ValueChanged, btnShow Click/Leave, btnnew/btnPrint/btnPrint618_01/btnShortCutKey Click, grd KeyDown, KeyDown. -->
<body class="pd-body" data-export-page="rptb-261">
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportWgt.reset(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" onclick="ExportWgt.print618(this)"><i class="fa fa-print"></i> <span>618-Print</span></button>
        <button type="button" id="btnPrint618_01" class="win-btn-tool" onclick="ExportWgt.print618_01(this)"><i class="fa fa-print"></i> <span>618_01-Print</span></button>
        <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportWgt.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="rptb-title"><span id="label3">Export Shipment Weight Audit</span></div>

    <fieldset class="rptb-filters"><legend>Filters</legend>
        <div class="rptb-row">
            <div class="ex-field w-m"><label for="cmbperemeter">Date Type</label>
                <select id="cmbperemeter" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
            <div class="ex-field w-s"><label for="txtdatefrom">Date From <span class="rptb-req">*</span></label><input type="date" id="txtdatefrom" class="win-date"/></div>
            <div class="ex-field w-s"><label for="txtdateto">Date To <span class="rptb-req">*</span></label><input type="date" id="txtdateto" class="win-date"/></div>
            <div class="ex-field w-m"><label for="CmbInvoiceNo">InvoiceNo</label>
                <select id="CmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field w-m"><label for="CmbContractNo">Contract No</label>
                <select id="CmbContractNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Contract No"></select></div>
            <div class="ex-field"><label>&nbsp;</label>
                <div class="rptb-radios">
                    <label><input type="radio" name="status" id="rdAll" value="" checked/> All</label>
                    <label><input type="radio" name="status" id="rdCompleted" value="Completed"/> Completed</label>
                    <label><input type="radio" name="status" id="RdInProcess" value="In Process"/> In Process</label>
                </div></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShow" class="win-btn-small rptb-show" onclick="ExportWgt.show(this)">Show</button></div>
        </div>
    </fieldset>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span id="label2">Main Information</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount1" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-h300">
            <table class="win-grid" id="grd" data-gridbar="frmAuditByWeightReport:grd" data-gridbar-mount="#gridBarMount1" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span id="label6">Detail Information Of Above Selected Row</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdDetailBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount2" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdDetailBox">
        <div class="ex-grid-scroll ex-h240">
            <table class="win-grid" id="grdDetail" data-gridbar="frmAuditByWeightReport:grdDetail" data-gridbar-mount="#gridBarMount2" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <div class="win-footer-strip"><span class="ex-footer-left">frmAuditByWeightReport</span></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_rptb_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_shipment_weight_audit.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
