    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">

    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>

</head>
<!-- frmExportShipingLineBookingRpt.cs (Architecture.WinApp.ExportReports), screen 266 "5010 Shipment CRO Booking Report", ClientSize 931 x 564.
     tsItemType: btnnew "&New" | btnRefresh "Refresh" | btnPrintRegister "Print-509" | btnShortCutKey "ShortCut Keys".
     panel5 (Teal) label3 "Shipping Line Booking /CRO". panel2: cmbSupplierName "Customer Name", cmbExportInvoice "Export Invoice#",
       cmbDestinationPort "Destination Port", btnShow "Show". panel3 + ctrlGrdBar1; grdfrm (GroupByBox visible after a load, Id hidden,
       BookingCroNo link -> 560 CRO slip by booking Id).
     Events: Load (GridBind first, then AllComboBind), btnShow/btnnew/btnRefresh/btnPrintRegister/btnShortCutKey Click, grdfrm LinkClicked, KeyDown. -->
<body class="pd-body" data-export-page="rptb-266">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportCro.reset(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportCro.refresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnPrintRegister" class="win-btn-tool" onclick="ExportCro.print509(this)"><i class="fa fa-print"></i> <span>Print-509</span></button>
        <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportCro.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="rptb-title"><span id="label3">Shipping Line Booking /CRO</span></div>

    <div class="rptb-filters">
        <div class="rptb-row">
            <div class="ex-field w-xl"><label for="cmbSupplierName">Customer Name</label>
                <select id="cmbSupplierName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
            <div class="ex-field w-l"><label for="cmbExportInvoice">Export Invoice#</label>
                <select id="cmbExportInvoice" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Export Invoice No"></select></div>
            <div class="ex-field w-l"><label for="cmbDestinationPort">Destination Port</label>
                <select id="cmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Destination Port"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShow" class="win-btn-small rptb-show" onclick="ExportCro.show(this)">Show</button></div>
        </div>
    </div>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Booking Register</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-hfill">
            <table class="win-grid" id="grdfrm" data-gridbar="frmExportShipingLineBookingRpt:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip"><span class="ex-footer-left">frmExportShipingLineBookingRpt</span></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>

<script th:src="@{/build/js/countx_export_shipment_cro_booking_report.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
