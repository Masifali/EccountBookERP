<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Loading Sheet - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rptb.css?v=20260930a}"/>
</head>
<!-- ExportLoadingSheet.cs (Architecture.WinApp.ExportReports), screen 262 "5013 Loading Sheet", ClientSize 788 x 450 (AutoScrollMinSize 780 x 489).
     toolStrip1: btnnew "&New" | btnprint "556--Print" | btnRefresh "Refresh" | btnshortcutkey "ShortCut Keys".
     panel4 (Teal) label15 "Loading Sheet". groupBox1 "Filters": cmbDateType "Date Type" (Rows[2] = This Week on load), txtdatefrom "Date From",
       txtdateto "Date To", cmbinvoiceno "Invoice No", cmbsupcut "Party", btnShow "Show". panel2 (Teal) label5 "History" + ctrlGrdBar1; grd.
     Events: Load, btnnew/btnRefresh/btnShow/btnprint/btnshortcutkey Click, btnShow Leave, cmbDateType ValueChanged, KeyDown. -->
<body class="pd-body" data-export-page="rptb-262">
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportLds.reset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnprint" class="win-btn-tool" onclick="ExportLds.print556(this)"><i class="fa fa-print"></i> <span>556--Print</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportLds.refresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnshortcutkey" class="win-btn-tool" onclick="ExportLds.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="rptb-title"><span id="label15">Loading Sheet</span></div>

    <fieldset class="rptb-filters" id="groupBox1"><legend>Filters</legend>
        <div class="rptb-row">
            <div class="ex-field w-m"><label for="cmbDateType">Date Type</label>
                <select id="cmbDateType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
            <div class="ex-field w-s"><label for="txtdatefrom">Date From</label><input type="date" id="txtdatefrom" class="win-date"/></div>
            <div class="ex-field w-s"><label for="txtdateto">Date To</label><input type="date" id="txtdateto" class="win-date"/></div>
            <div class="ex-field w-m"><label for="cmbinvoiceno">Invoice No</label>
                <select id="cmbinvoiceno" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field w-l"><label for="cmbsupcut">Party</label>
                <select id="cmbsupcut" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Party"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShow" class="win-btn-small rptb-show" onclick="ExportLds.show(this)">Show</button></div>
        </div>
    </fieldset>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span id="label5">History</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-hfill">
            <table class="win-grid" id="grd" data-gridbar="ExportLoadingSheet:grd" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip"><span class="ex-footer-left">ExportLoadingSheet</span></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_export_rptb_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_loading_sheet.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
