<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Define Third Party Type - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_q.css?v=20261003q}"/>
</head>
<!-- DefineThirdPartyType.cs (Architecture.WinApp.Export), no ScreenDefinition row (opened from 857 / 858 "Define Third Party Type"),
     ClientSize 439 x 369, ScreenName "DefineThirdPartyType".
     menuStrip1: New (btnnew_Click), Save (btnSave_Click - RecId = 0, always an insert), Update (hidden; btnupdate_Click), ShortCut Keys.
     panel (Teal) label4 "Define Third Party Type"; panel2: Party Type Code (txtbrandCode), Party Type Name (txtBrandName),
     chkIsActive "Active" (Checked = true), btnAdd "Save" / "Update".
     panel4 (Teal) label3 "History" + ctrlGrdBar1; grdfrm (Id hidden; PartyTypeCode, PartyTypeName, EntryUser, EntryDate, ModifyUser, ModifyDate
     "dd-MM-yyyy hh:mm tt", Active) - DoubleClick / Ctrl+Enter -> ReadById.
     KeyDown: Ctrl+S Save (when visible), Ctrl+U Update (when visible), Ctrl+N New, Ctrl+E / Esc close, Ctrl+F5 code, Ctrl+Down grid, Ctrl+Alt shortcuts.
     Page parameter: ?id=<ThirdPartyTypeID> opens that type (as a history double-click). -->
<body class="pd-body" data-export-page="define-third-party-type">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ExportDefineThirdPartyType.resetForm(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnSave" class="win-btn-tool" accesskey="s" onclick="ExportDefineThirdPartyType.toolSave(this)"><i class="fa fa-save"></i> <span>Save</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" accesskey="u" onclick="ExportDefineThirdPartyType.toolUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnShortCutKeys" class="win-btn-tool" onclick="ExportDefineThirdPartyType.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal">Define Third Party Type</div>
    <div class="ex-entry exq-tpt-entry">
        <div class="ex-field"><label for="txtbrandCode">Party Type Code</label><input type="text" id="txtbrandCode" class="win-textbox" autocomplete="off"/></div>
        <div class="ex-field"><label for="txtBrandName">Party Type Name</label><input type="text" id="txtBrandName" class="win-textbox" autocomplete="off"/></div>
        <div class="ex-field"><label>&nbsp;</label><label class="ex-check" for="chkIsActive"><input type="checkbox" id="chkIsActive" checked/> Active</label></div>
        <div class="ex-actions"><button type="button" id="btnAdd" class="win-btn-small" onclick="ExportDefineThirdPartyType.add(this)">Save</button></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" id="historyBar"><span>History</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400">
            <table class="win-grid" id="grdfrm" tabindex="0" data-gridbar="DefineThirdPartyType:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr>
                    <th data-col="PartyTypeCode">PartyTypeCode</th><th data-col="PartyTypeName">PartyTypeName</th>
                    <th data-col="EntryUser">EntryUser</th><th data-col="EntryDate">EntryDate</th><th data-col="ModifyUser">ModifyUser</th><th data-col="ModifyDate">ModifyDate</th>
                    <th class="ctr" data-col="Active">Active</th>
                </tr></thead>
                <tbody id="histBody"></tbody>
            </table>
        </div>
        <div class="ex-grid-empty is-hidden" id="histEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left">DefineThirdPartyType</span>
        <button type="button" class="win-btn-history" id="btnFooterHistory" onclick="ExportDefineThirdPartyType.history(this)"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_export_q_common.js?v=20261003q}"></script>
<script th:src="@{/build/js/countx_export_define_third_party_type.js?v=20261003q}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
