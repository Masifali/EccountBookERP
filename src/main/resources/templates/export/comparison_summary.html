<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Export Comparisons Summery Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpta.css?v=20260930a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rptn.css?v=20261003a}"/>
</head>
<!-- ExportComparisonSummaryReport.cs (Architecture.WinApp.ExportReports), screen 248 "Export Comparison Summary", AutoScrollMinSize 980 x 600.
     panel2 (Teal): tsItemType btnnew "&New" / btnRefreshSummary "&Refresh" / btnReport "536-CustomerWiseComparison" / btnShortcut "ShortCut Keys",
     label3 "Export Comparisons Summery Report". panel3: From Date datFromDate / To Date datToDate (ShowCheckBox, "dd-MMM-yy"), Item Category,
     Item Type, Item Name, Customer Name, Destination Port CmbSeaPort, Report Type CmbReportType, CmbContractNo + "Contract No" (Visible = false),
     BtnShow "Show" (Teal). panel5 (Teal) "Filtered Records" + ctrlGrdBar1. grdfrm: GroupCaption / TotalMTons hidden, GroupName caption = GroupCaption,
     GridWrappingAndColumnSettings(grdfrm, 3).
     Events: Load (From = ActiveYr.Start_Period, binds, GridBind), FormClosed, KeyDown (Enter / Ctrl+E,Esc (Hide) / Ctrl+Alt, Ctrl+N, Ctrl+R, Ctrl+S,
     Ctrl+P or Alt+1, Ctrl+F5, Ctrl+Up, Ctrl+Down), btnnew (Reset), btnRefreshSummary, BtnShow, btnReport (536), btnShortcut. -->
<body class="pd-body" data-export-page="cmp">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ExportCmp.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefreshSummary" class="win-btn-tool" accesskey="r" onclick="ExportCmp.refresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btnReport" class="win-btn-tool" onclick="ExportCmp.print(this)" data-rpt="536-ExportCustomerWiseComparisonReport.rpt"><i class="fa fa-print"></i> <span>536-CustomerWiseComparison</span></button>
        <button type="button" id="btnShortcut" class="win-btn-tool" onclick="ExportCmp.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal" style="height:26px;"><span>Export Comparisons Summery Report</span></div>
    <div class="rptn-cols" id="panel3">
        <div class="ex-field"><label for="datFromDate">From Date</label><span class="ex-check" style="flex:1;"><input type="checkbox" id="datFromDateChk" checked/><input type="date" id="datFromDate" class="win-date"/></span></div>
        <div class="ex-field"><label for="CmbItemType">Item Type</label><select id="CmbItemType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Type"></select></div>
        <div class="ex-field"><label for="CmbSeaPort">Destination Port</label><select id="CmbSeaPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Port Name"></select></div>
        <div class="ex-field is-hidden"><label for="CmbContractNo">Contract No</label><select id="CmbContractNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Contract No"></select></div>
        <div class="ex-field"><label for="datToDate">To Date</label><span class="ex-check" style="flex:1;"><input type="checkbox" id="datToDateChk" checked/><input type="date" id="datToDate" class="win-date"/></span></div>
        <div class="ex-field"><label for="CmbItemName">Item Name</label><select id="CmbItemName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <div class="ex-field"><label for="CmbReportType">Report Type</label><select id="CmbReportType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="ReportName"></select></div>
        <div></div>
        <div class="ex-field"><label for="CmbItemCategory">Item Category</label><select id="CmbItemCategory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Category"></select></div>
        <div class="ex-field"><label for="CmbCustomerName">Customer Name</label><select id="CmbCustomerName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
        <div style="text-align:right;"><button type="button" id="BtnShow" class="win-btn-small rptn-teal-btn" style="width:64px;height:26px;" onclick="ExportCmp.show(this)">Show</button></div>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:26px;"><span>Filtered Records</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid rptn-wrap-head" id="grdfrm" tabindex="0"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip" id="cmpFooter">
        <span class="ex-footer-left">ExportComparisonSummaryReport - screen 248 - Print 536</span>
        <button type="button" class="win-btn-history" id="btnCmpFooterHistory" onclick="ExportCmp.show(document.getElementById('BtnShow'))"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpta_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_rptn_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_comparison_summary.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
