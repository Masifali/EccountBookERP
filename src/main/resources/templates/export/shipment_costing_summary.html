    <title>Shipment Costing Summary - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">

</head>
<!-- frmExImShipmentCostingSummary.cs (Architecture.WinApp.ExportReports), screen 919 "5005 Shipment Costing Summary", ClientSize 968 x 612,
     form Text "Shipment Costing Register".
     tsItemType: btnnew "&New" | btnRefresh "Refresh" | btnRegister "542_01-ShipmentCostingSummary". panel5 (Teal) label3 "Shipment Costing Summary".
     panel2 filters: DateFrom / DateTo "From && To Date" (From = FY start), CmbSupplierCustomer "Customer Name", CmbDestinationPort "Destination Port",
       cmbInvoiceNo "Invoice No", btnShow "Show". panel4 + ctrlGrdBar1; grdfrm (InvoiceNo link -> ExImShipmentCosting(InvoiceId); the eight charge
       columns show only when their total > 0; PLValue green > 0 / red < 0).
     Events: Load, btnShow/btnnew/btnRefresh/btnRegister Click, grdfrm LinkClicked / FormattingRow, KeyDown (Enter, Ctrl+E/Esc, Ctrl+N, Ctrl+R, Ctrl+S). -->
<body class="pd-body" data-export-page="rptb-919">
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportCss.reset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportCss.refresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnRegister" class="win-btn-tool" onclick="ExportCss.print542(this)"><i class="fa fa-print"></i> <span>542_01-ShipmentCostingSummary</span></button>
    </div>
    <div class="rptb-title"><span id="label3">Shipment Costing Summary</span></div>

    <div class="rptb-filters">
        <div class="rptb-row">
            <div class="ex-field w-l"><label for="DateFrom">From &amp; To Date</label>
                <div class="ex-pair" style="grid-template-columns:1fr 1fr;"><input type="date" id="DateFrom" class="win-date"/><input type="date" id="DateTo" class="win-date"/></div></div>
            <div class="ex-field w-xl"><label for="CmbSupplierCustomer">Customer Name</label>
                <select id="CmbSupplierCustomer" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
            <div class="ex-field w-l"><label for="CmbDestinationPort">Destination Port</label>
                <select id="CmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Destination Port"></select></div>
            <div class="ex-field w-m"><label for="cmbInvoiceNo">Invoice No</label>
                <select id="cmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShow" class="win-btn-small rptb-show" onclick="ExportCss.show(this)">Show</button></div>
        </div>
    </div>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Shipment Costing Summary</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-hfill">
            <table class="win-grid" id="grdfrm" data-gridbar="frmExImShipmentCostingSummary:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip"><span class="ex-footer-left">frmExImShipmentCostingSummary</span></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260930a}"></script>

<script th:src="@{/build/js/countx_export_shipment_costing_summary.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
