<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Shipment Schedule History - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpto.css?v=20261003a}"/>
</head>
<!-- ExImShipmentScheduleHistory.cs (Architecture.WinApp.ExportReports), no ScreenDefinition row, ClientSize 1047 x 772,
     Text "frmExportShipingLineBookingRpt". panel2/tsItemType: New, "527-Print Register", "527-Register Customer Wise".
     panel3 (white): panel5 "Shipment Schedule" (white on rgb(10,110,110)) + ctrlGrdBar1; Date From (txtdatefrom, dd-MMM-yy,
     default today), Date To (txtdateto = ActiveYr.End_Period), Contract No (cmbcontractNo, CommonServices.GetLcOrderNo),
     Customer Name (cmbSupplierName, SupplierCustomer.ReadByOrganizationCompanyIdForExport), Show. panel4: grdfrm (RetrieveStructure).
     Events: Load (combos + GridBind), btnShow, btnnew (combos + Reset -> GridBind), toolStripButton2 (527), btnregister523 (527 CW),
     KeyDown (Enter = Tab, Ctrl+N, Ctrl+E / Esc), grdfrm_ColumnButtonClick "Print" (501) - unreachable: the procedure returns no
     Print column and RetrieveStructure creates no button column. -->
<body class="pd-body" data-export-page="ssh">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip" id="tsItemType">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportSsh.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="toolStripButton2" class="win-btn-tool" onclick="ExportSsh.print527(this)"><i class="fa fa-print"></i> <span>527-Print Register</span></button>
        <button type="button" id="btnregister523" class="win-btn-tool" onclick="ExportSsh.print527Cw(this)"><i class="fa fa-print"></i> <span>527-Register Customer Wise</span></button>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" id="panel5" style="height:32px;"><span id="label3" style="font-size:12pt;">Shipment Schedule</span>
        <span class="ex-bar-right"><span id="gbSsh" class="pd-gridbar-mount"></span><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="rpto-filter" id="panel3">
        <div class="ex-field w100"><label for="txtdatefrom" id="label51">Date From</label><input type="date" id="txtdatefrom" class="win-date"/></div>
        <div class="ex-field w100"><label for="txtdateto" id="label5">Date To</label><input type="date" id="txtdateto" class="win-date"/></div>
        <div class="ex-field w170"><label for="cmbcontractNo" id="label2">Contract No</label><select id="cmbcontractNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Contract No"></select></div>
        <div class="ex-field w200"><label for="cmbSupplierName" id="label50">Customer Name</label><select id="cmbSupplierName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
        <button type="button" id="btnShow" class="win-btn-small" style="height:26px;" onclick="ExportSsh.show(this)">Show</button>
    </div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdfrm" tabindex="0" data-gridbar="ExImShipmentScheduleHistory:grdfrm" data-gridbar-mount="#gbSsh"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left">ExImShipmentScheduleHistory - Shipment Schedule History</span>
        <button type="button" class="win-btn-history" id="btnSshFooterHistory" onclick="ExportSsh.show(this)"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpto_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_shipment_schedule_history.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
