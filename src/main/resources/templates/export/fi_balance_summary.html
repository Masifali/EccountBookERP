<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>FI Balance Summary - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpt_c.css?v=20260930c}"/>
</head>
<!-- FIBalanceSummary.cs (Architecture.WinApp.ExportReports), screen 246, ClientSize 800 x 450.
     tsItemType: btnnew "&New" | btnPrint "300_01-Print" | btnShortCutKey. panel5 "FI Balance Summary"; ChkSkipZero "Skip Zero" + btnShow "Show";
     panel2 "Filtered Records" + ctrlGrdBar1; grdfrm (Id / PaymentTermId / DocumentTypeId hidden, EFormNo is a link -> FIBalanceDetailByFI popup "FI Balance Detail").
     Load runs btnShow_Click at once. Events: btnShow/btnnew/btnPrint/btnShortCutKey Click, grdfrm.LinkClicked, KeyDown. -->
<body class="pd-body exr-page" data-export-page="fib246">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportFiBalance.reset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button> <button type="button" id="btnPrint" class="win-btn-tool" onclick="ExportFiBalance.print(this)"><i class="fa fa-print"></i> <span>300_01-Print</span></button> <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportFiBalance.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="exr-title">FI Balance Summary</div>
    <div class="exr-filters" style="border:0;">
        <div class="exr-row">
            <div class="ex-field"><label>&nbsp;</label><span class="ex-check"><input type="checkbox" id="ChkSkipZero"/><label for="ChkSkipZero" style="margin:0;font-weight:normal;">Skip Zero</label></span></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShow" class="exr-btn" onclick="ExportFiBalance.show(this)">Show</button></div>
        </div>
    </div>
    <div class="pd-caption pd-caption-dark pd-history-bar"><span>Filtered Records</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400">
            <table class="win-grid" id="grdfrm" data-gridbar="FIBalanceSummary:grdfrm" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left" id="footerInfo"></span>
        <button type="button" class="win-btn-history" id="btnFooterHistory" onclick="ExportFiBalance.toggleHistory()"><i class="fa fa-history"></i> <span>History</span></button>
    </div>

    <div class="exr-modal is-hidden" id="fiDetailModal">
        <div class="exr-modal-box">
            <div class="exr-title teal"><span>FI Balance Detail</span><button type="button" class="exr-close" onclick="ExportFiBalance.closeDetail()" title="Close">&times;</button></div>
            <div class="ex-grid-box" id="grdDetailBox"><div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
            <div class="ex-grid-empty is-hidden" id="grdDetailEmpty">No record found.</div></div>
        </div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_export_rpt_c.js?v=20260930c}"></script>
<script th:src="@{/build/js/countx_export_fi_balance_summary.js?v=20260930c}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
