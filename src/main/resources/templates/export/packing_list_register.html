<!-- PackingListRegister_Export.cs (Architecture.WinApp.ExportReports), screen 243 "Export Packing List Register", ClientSize 893 x 664.
     tabControl1 / tabPage2 "Register": panel8 (Teal) "Packing List Register Export" + toolStrip2 BtnNewSummary "&New" | btnRefreshSummary "&Refresh" | btnPrintSumm "563-Print" | btnshortcut.
     groupBox2 "Filter Criteria's": Date Type (CmbDateTypeSumm, Rows[1] "This Week"), From && To Date (txtFromDateSumm / txtToDateSumm dd-MMM-yy), Customer (cmbCustomer),
     Inoice No (cmbInvoice), Item Name (cmbItemName), Packing Type (cmbpackingtype), Crop Year (cmbcropyear), Job Lot (cmbJobLotSumm), Warehouse (Cmbware),
     Destination Port (cmbDestination), BtnShowSumm "Show" (rgb 10,110,110). panel9 (Teal) "Filtered Records" + ctrlGrdBar5; DataGridHistory (22 columns, ExImInvoiceId hidden).
     Events: CmbDateTypeSumm.ValueChanged, BtnShowSumm.Click/Leave, New/Refresh/Print/ShortCut, KeyDown. -->
<body class="pd-body exr-page" data-export-page="plr243">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="exr-title teal" style="display:flex;justify-content:space-between;align-items:center;"><span>Packing List Register Export</span></div>
    <div class="win-tool-strip">
        <button type="button" id="BtnNewSummary" class="win-btn-tool" onclick="ExportPackingListRegister.reset(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button> <button type="button" id="btnRefreshSummary" class="win-btn-tool" onclick="ExportPackingListRegister.refresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button> <button type="button" id="btnPrintSumm" class="win-btn-tool" onclick="ExportPackingListRegister.print(this)"><i class="fa fa-print"></i> <span>563-Print</span></button> <button type="button" id="btnshortcut" class="win-btn-tool" onclick="ExportPackingListRegister.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <fieldset class="exr-filters"><legend>Filter Criteria's</legend>
        <div class="exr-row">
            <div class="ex-field w150"><label>Date Type</label><select id="CmbDateTypeSumm" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
            <div class="ex-field w320"><label>From &amp; To Date</label><div class="ex-pair" style="grid-template-columns:1fr 1fr;"><input type="date" id="txtFromDateSumm" class="win-date"/><input type="date" id="txtToDateSumm" class="win-date"/></div></div>
            <div class="ex-field w260"><label>Customer</label><select id="cmbCustomer" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div> <div class="ex-field w200"><label>Inoice No</label><select id="cmbInvoice" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div> <div class="ex-field w200"><label>Item Name</label><select id="cmbItemName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item"></select></div> <div class="ex-field w150"><label>Packing Type</label><select id="cmbpackingtype" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Packing Type"></select></div> <div class="ex-field w120"><label>Crop Year</label><select id="cmbcropyear" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Crpo Year"></select></div> <div class="ex-field w150"><label>Job Lot</label><select id="cmbJobLotSumm" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLot"></select></div> <div class="ex-field w200"><label>Warehouse</label><select id="Cmbware" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Warehouse"></select></div> <div class="ex-field w200"><label>Destination Port</label><select id="cmbDestination" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Destination Port"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="BtnShowSumm" class="exr-btn dark" onclick="ExportPackingListRegister.show(this)">Show</button></div>
        </div>
    </fieldset>
    <div class="pd-caption pd-caption-teal pd-history-bar"><span>Filtered Records</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="DataGridHistoryBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="DataGridHistoryBox">
        <div class="ex-grid-scroll ex-h400">
            <table class="win-grid" id="DataGridHistory" data-gridbar="PackingListRegister_Export:DataGridHistory" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="DataGridHistoryEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left" id="footerInfo"></span>
        <button type="button" class="win-btn-history" id="btnFooterHistory" onclick="ExportPackingListRegister.toggleHistory()"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
