<!-- DefineCustomGroup.cs (Architecture.WinApp.SDT), screen 621 "Define Custom Group", ClientSize 479 x 450.
     toolStrip1: New | Save (DoHaveSaveRight) | Update (hidden until Edit, DoHaveUpdateRights) | ShortCut Keys. label23 (Teal) "Custom Group".
     panel5 (white): Custom Group (txtCustomGroup), Active (chk, checked on load).
     panel7 (Teal) "History" + ctrlGrdBar3 + grdcropyear (Edit button column first, frozen; CustomGroup | Active | EntryUser | EntryDate | ModifyUser | ModifyDate, dates "dd-MM-yyyy hh:mm tt").
     KeyDown: Enter=Tab, Ctrl+N new, Ctrl+S save, Ctrl+U update, Ctrl+E/Esc close, Ctrl+Alt shortcut keys, Ctrl+Down grid, Ctrl+Up / Ctrl+F5 text; grid Ctrl+Space / Ctrl+Enter = Edit. -->
<body class="pd-body" data-export-page="sdt-621">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ExportCustomGroup.reset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" accesskey="s" onclick="ExportCustomGroup.save(this, false)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" accesskey="u" onclick="ExportCustomGroup.save(this, true)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="ExportCustomGroup.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal" id="label23">Custom Group</div>
    <div class="sdt-entry" id="panel5">
        <label for="txtCustomGroup">Custom Group</label><input type="text" id="txtCustomGroup" class="win-textbox" maxlength="150" autocomplete="off"/>
        <label for="chk">&nbsp;</label><label class="ex-check" style="font-weight:normal;"><input type="checkbox" id="chk" checked/> Active</label>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" id="panel7"><span id="label1">History</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdcropyearBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdcropyearBox">
        <div class="ex-grid-scroll ex-h400">
            <table class="win-grid" id="grdcropyear" data-gridbar="DefineCustomGroup:grdcropyear" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false">
                <thead><tr><th>Edit</th><th>Custom Group</th><th class="ctr">Active</th><th>Entry User</th><th>Entry Date</th><th>Modify User</th><th>Modify Date</th></tr></thead>
                <tbody id="histBody"></tbody>
            </table>
        </div>
        <div class="ex-grid-empty is-hidden" id="histEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left" id="footerInfo">DefineCustomGroup</span>
        <button type="button" class="win-btn-history" id="btnFooterHistory" onclick="ExportCustomGroup.toggleHistory()"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_export_sdt_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_define_custom_group.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridheader}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
