<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Forwarding - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>

</head>
<!-- EximForwarding.cs (Architecture.WinApp.Export), screen 212 "Export Forwarding", Text "Forwarding", ClientSize 1307 x 749,
     ScreenName / rights "EximForwarding", DocumentTypeId 205.
     tabControl1: "Form" | "History".
     Form: toolStrip1 New / Refresh / Save / Update(hidden) / Delete(hidden until a record is read) / 507-Print / Attachment /
       Generate Stock / Stock Report / ShortCut Keys; panel12 (Teal) "Export Goods Forwarding" + btnRecordsUpdate
       "Auto Update Records" (red, Visible = false, Ctrl+Shift+A shows it);
       panel3 (white): Doc No && Date (txtdocno read-only), GP NO. && Date (cmbGpNo + txtGPDate disabled), Invoice No#,
       No Of Invoices (disabled), Customer, Transporter, Vehicle && Bilty No (disabled), Driver Name, Driver Cell No, CNIC No,
       Loading Port / Destination Port (disabled), Shipping Line, Shipping Agent, Freight (disabled), Other Charges (hidden),
       ContainerNo-1 / -2 (read-only), No. Of Container, Shipped Container (disabled), Completed Date + "Date Active",
       Fct Weight / Dispatch Wt / Bal Weight / Do Gross Wt / Do Total Weight / Do Net Weight (disabled), Print Preview (checked).
       tabControl2 "Detail" | "Other Items".
         Detail: panel5 Item Name (read-only), PackType (read-only), Item Description, Master Qty, Pack UOM, Eb Weight, Eb Total
         (disabled), Inner Qty, Pack UOM, Eb Weight, Eb Total (disabled), AddLess, NetWeight / Gross Weight / Stock Weight
         (read-only), WareHouse, JobLot, CropYear, Container #, Seal #, + (Visible = false, never shown) / Update / Cancel;
         panel14 (Teal) "Export Goods Forwarding Detail" + ctrlGrdBar1, grdDetail (+ and X columns, Loader with
         StockLoaderVisibleInForwardingDetail, AvailableStock link); panel16 (Teal) "Gate Pass information" + grdgpInfo (Load).
         Other Items: Item Name, Qty, Rate (read-only), Amount (read-only), Container No, Remarks, + (hidden, no handler) /
         Update / Cancel; grdotheritems.
     History: toolStrip2 New / Refresh; panel8 (Teal) "Export Forwarding History"; groupBox2 "Filters": From Date, To Date,
       Doc Date / Entry Date / Modify Date / Approved Date, From && To Doc No, Customer, Gate Pass #, Invoice No, Show (Teal);
       panel6 "Filtered Records" + DataGridHistory (Edit, Print, NoOfAttachments link); panel13 "Detail of the Selected above Row"
       + grdHistoryDetail.
     Events: Load, KeyDown, tabControl1_SelectedIndexChanged, cmbGpNo TextChanged / Leave, cmbInvoiceNo Leave, cmbItem Leave,
       cmbcontainerNo Leave, chkdateisactive CheckedChanged, txtQtyMaster / txtQtyInner / txtEbUnitMaster / txtEbUnitInner /
       txtAddLess TextChanged, CmbPackUomMaster / CmbPackUomInner ValueChanged, txtoQty TextChanged, grdDetail DoubleClick /
       ColumnButtonClick / LinkClicked / KeyDown, grdotheritems DoubleClick / KeyDown, grdgpInfo ColumnButtonClick / LinkClicked,
       DataGridHistory DoubleClick / ColumnButtonClick / SelectionChanged / LinkClicked / KeyDown, every toolbar button. -->
<body class="pd-body">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tabs" data-tabs="main">
        <button type="button" class="win-tab is-active" data-tab="tabForm">Form</button>
        <button type="button" class="win-tab" data-tab="tabHistory">History</button>
    </div>

    <!-- ===================================================== Form -->
    <div class="win-tab-panel is-active" id="tabForm">
        <div class="win-tool-strip">
            <button type="button" id="BtnNew" class="win-btn-tool" onclick="ExportFw.newForm()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportFw.refresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnSave" class="win-btn-tool" onclick="ExportFw.save(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="ExportFw.update(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="ExportFw.remove(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="BtnPrint" class="win-btn-tool" onclick="ExportFw.print(this)"><i class="fa fa-print"></i> <span>507-Print</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" onclick="ExportFw.attachment()"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="btnGenerateAvailableStock" class="win-btn-tool" onclick="ExportFw.generateStock(this)"><i class="fa fa-cubes"></i> <span>Generate Stock</span></button>
            <button type="button" id="btnStockReport" class="win-btn-tool" onclick="ExportFw.stockReport()"><i class="fa fa-bar-chart"></i> <span>Stock Report</span></button>
            <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportFw.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="pd-caption pd-caption-teal fw-caption-bar"><span>Export Goods Forwarding</span>
            <span class="fw-caption-right"><button type="button" id="btnRecordsUpdate" class="fw-btn-red is-hidden" onclick="ExportFw.autoUpdate(this)">Auto Update Records</button></span></div>

        <!-- panel3 -->
        <div class="fw-header">
            <div class="ex-field"><label for="txtdocno">Doc No &amp; Date</label>
                <div class="ex-pair"><input type="text" id="txtdocno" class="win-textbox num" readonly/><input type="date" id="DocDate" class="win-date"/></div></div>
            <div class="ex-field"><label for="cmbGpNo">GP NO. &amp; Date</label>
                <div class="ex-pair"><select id="cmbGpNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="GatePass No"></select><input type="date" id="txtGPDate" class="win-date" disabled/></div></div>
            <div class="ex-field"><label for="cmbInvoiceNo">Invoice No#</label>
                <select id="cmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field"><label for="txtNoofInvoices">No Of Invoices</label><input type="text" id="txtNoofInvoices" class="win-textbox num" disabled/></div>

            <div class="ex-field"><label for="cmbCustomer">Customer</label>
                <select id="cmbCustomer" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer"></select></div>
            <div class="ex-field"><label for="cmbtransporter">Transporter</label>
                <select id="cmbtransporter" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Transporter"></select></div>
            <div class="ex-field"><label for="txtVehicleNo">Vehicle &amp; Bilty No</label>
                <div class="ex-pair"><input type="text" id="txtVehicleNo" class="win-textbox" disabled/><input type="text" id="txtBilityNo" class="win-textbox" disabled/></div></div>
            <div class="ex-field"><label for="txtDriverName">Driver Name</label><input type="text" id="txtDriverName" class="win-textbox" autocomplete="off"/></div>

            <div class="ex-field"><label for="txtDriverCellNo">Driver Cell No</label><input type="text" id="txtDriverCellNo" class="win-textbox" autocomplete="off"/></div>
            <div class="ex-field"><label for="txtCNICNO">CNIC No</label><input type="text" id="txtCNICNO" class="win-textbox" autocomplete="off"/></div>
            <div class="ex-field"><label for="cmbLoadingPort">Loading Port</label>
                <select id="cmbLoadingPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Port Name" disabled></select></div>
            <div class="ex-field"><label for="cmbDestinationPort">Destination Port</label>
                <select id="cmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Port Name" disabled></select></div>

            <div class="ex-field"><label for="cmbShippingLIne">Shipping Line</label>
                <select id="cmbShippingLIne" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Shipping Line"></select></div>
            <div class="ex-field"><label for="cmbShippingAgent">Shipping Agent</label>
                <select id="cmbShippingAgent" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Shipping Agent"></select></div>
            <div class="ex-field"><label for="txtFreight">Freight</label><input type="text" id="txtFreight" class="win-textbox num" disabled/></div>
            <div class="ex-field is-hidden"><label id="label15" for="txtOtherCharges">Other Charges</label><input type="text" id="txtOtherCharges" class="win-textbox num"/></div>
            <div class="ex-field"><label for="txtconainer1">ContainerNo-1</label><input type="text" id="txtconainer1" class="win-textbox" readonly/></div>

            <div class="ex-field"><label for="txtContainer2">ContainerNo-2</label><input type="text" id="txtContainer2" class="win-textbox" readonly/></div>
            <div class="ex-field"><label for="txtNoOfContainer">No. Of Container</label><input type="text" id="txtNoOfContainer" class="win-textbox num" data-guard="integer" autocomplete="off"/></div>
            <div class="ex-field"><label for="txtShippedContainer">Shipped Container</label><input type="text" id="txtShippedContainer" class="win-textbox num" disabled/></div>
            <div class="ex-field"><label for="txtCompletedDate">Completed Date</label>
                <div class="ex-pair"><input type="date" id="txtCompletedDate" class="win-date" disabled/><span class="ex-check"><input type="checkbox" id="chkdateisactive"/><label for="chkdateisactive">Date Active</label></span></div></div>

            <div class="ex-field"><label for="txtFactoryWeight">Fct Weight</label><input type="text" id="txtFactoryWeight" class="win-textbox num" value="0" disabled/></div>
            <div class="ex-field"><label for="txtDispatchWeight">Dispatch Wt</label><input type="text" id="txtDispatchWeight" class="win-textbox num" disabled/></div>
            <div class="ex-field"><label for="txtBalFcWeight">Bal Weight</label><input type="text" id="txtBalFcWeight" class="win-textbox num" disabled/></div>
            <div class="ex-field"><label for="txtDoGrossWeight">Do Gross Wt</label><input type="text" id="txtDoGrossWeight" class="win-textbox num" disabled/></div>

            <div class="ex-field"><label for="txtDoNetWeight">Do Total Weight</label><input type="text" id="txtDoNetWeight" class="win-textbox num" disabled/></div>
            <div class="ex-field"><label for="txtInvoiceNetWeight">Do Net Weight</label><input type="text" id="txtInvoiceNetWeight" class="win-textbox num" disabled/></div>
            <div class="ex-field"><label>&nbsp;</label><span class="ex-check"><input type="checkbox" id="ChkPrintPreview" checked/><label for="ChkPrintPreview">Print Preview</label></span></div>
        </div>

        <!-- tabControl2 -->
        <div class="win-tabs" data-tabs="detail">
            <button type="button" class="win-tab is-active" data-tab="tabPage3">Detail</button>
            <button type="button" class="win-tab" data-tab="tabPage4">Other Items</button>
        </div>
        <div class="win-tab-panel is-active" id="tabPage3">
            <div class="fw-detail">
                <div class="ex-field fw-wide"><label for="cmbItem">Item Name</label>
                    <select id="cmbItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item" disabled></select></div>
                <div class="ex-field"><label for="cmbPackType">PackType</label>
                    <select id="cmbPackType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Pack Type" disabled></select></div>
                <div class="ex-field fw-wide"><label for="txtItemDesc">Item Description</label><input type="text" id="txtItemDesc" class="win-textbox" autocomplete="off"/></div>
                <div class="ex-field"><label for="txtQtyMaster">Master Qty</label><input type="text" id="txtQtyMaster" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>

                <div class="ex-field"><label for="CmbPackUomMaster">Pack UOM</label>
                    <select id="CmbPackUomMaster" class="win-combo dtcombo" data-columns="Pack Uom|Equivalent" data-dtcombo-caption="Pack Uom"></select></div>
                <div class="ex-field"><label for="txtEbUnitMaster">Eb Weight</label><input type="text" id="txtEbUnitMaster" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field"><label for="txtEbTotalMaster">Eb Total</label><input type="text" id="txtEbTotalMaster" class="win-textbox num" disabled/></div>
                <div class="ex-field"><label for="txtQtyInner">Inner Qty</label><input type="text" id="txtQtyInner" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field"><label for="CmbPackUomInner">Pack UOM</label>
                    <select id="CmbPackUomInner" class="win-combo dtcombo" data-columns="Pack Uom|Equivalent" data-dtcombo-caption="Pack Uom"></select></div>
                <div class="ex-field"><label for="txtEbUnitInner">Eb Weight</label><input type="text" id="txtEbUnitInner" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>

                <div class="ex-field"><label for="txtEbTotalInner">Eb Total</label><input type="text" id="txtEbTotalInner" class="win-textbox num" disabled/></div>
                <div class="ex-field"><label for="txtAddLess">AddLess</label><input type="text" id="txtAddLess" class="win-textbox num" data-guard="decimal-signed" autocomplete="off"/></div>
                <div class="ex-field"><label for="txtNetWeight">NetWeight</label><input type="text" id="txtNetWeight" class="win-textbox num" readonly/></div>
                <div class="ex-field"><label for="txtGrossWeight">Gross Weight</label><input type="text" id="txtGrossWeight" class="win-textbox num" readonly/></div>
                <div class="ex-field"><label for="txtStockWeight">Stock Weight</label><input type="text" id="txtStockWeight" class="win-textbox num" readonly/></div>
                <div class="ex-field"><label for="CmbWareHouse">WareHouse</label>
                    <select id="CmbWareHouse" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Godown Name"></select></div>

                <div class="ex-field"><label for="CmbJobLot">JobLot</label>
                    <select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLot Description"></select></div>
                <div class="ex-field"><label for="CmbCropYear">CropYear</label>
                    <select id="CmbCropYear" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="CropYear"></select></div>
                <div class="ex-field"><label for="cmbcontainerNo">Container #</label>
                    <select id="cmbcontainerNo" class="win-combo dtcombo" data-columns="Container No|SealNo" data-dtcombo-caption="Container No"></select></div>
                <div class="ex-field"><label for="txtSeal">Seal #</label><input type="text" id="txtSeal" class="win-textbox" autocomplete="off"/></div>
                <div class="ex-actions fw-wide">
                    <button type="button" id="btnAddinGrid" class="win-btn-small is-hidden">+</button>
                    <button type="button" id="btnDetailUpdate" class="win-btn-small is-hidden" onclick="ExportFw.detailUpdate()">Update</button>
                    <button type="button" id="btnDetailCancel" class="win-btn-small is-hidden" onclick="ExportFw.detailCancel()">Cancel</button>
                </div>
            </div>
            <div class="pd-caption pd-caption-teal pd-history-bar" style="height:23px;"><span>Export Goods Forwarding Detail</span>
                <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdDetailBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMountDetail" class="pd-gridbar-mount"></span></span></div>
            <div class="ex-grid-box" id="grdDetailBox">
                <div class="ex-grid-scroll ex-h240">
                    <table class="win-grid" id="grdDetail" data-gridbar="EximForwarding:grdDetail" data-gridbar-mount="#gridBarMountDetail" data-gridbar-reorder="false">
                        <thead id="detailHead"></thead><tbody id="detailBody"></tbody><tfoot id="detailFoot"></tfoot>
                    </table>
                </div>
            </div>
            <div class="pd-caption pd-caption-teal pd-history-bar" style="height:23px;"><span>Gate Pass information</span>
                <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdgpInfoBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMountGp" class="pd-gridbar-mount"></span></span></div>
            <div class="ex-grid-box" id="grdgpInfoBox">
                <div class="ex-grid-scroll ex-h240">
                    <table class="win-grid" id="grdgpInfo" data-gridbar="EximForwarding:grdgpInfo" data-gridbar-mount="#gridBarMountGp" data-gridbar-reorder="false">
                        <thead id="gpHead"></thead><tbody id="gpBody"></tbody><tfoot id="gpFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
        <div class="win-tab-panel" id="tabPage4">
            <div class="fw-detail">
                <div class="ex-field fw-wide"><label for="CmbOtherItem">Item Name</label>
                    <select id="CmbOtherItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
                <div class="ex-field"><label for="txtoQty">Qty</label><input type="text" id="txtoQty" class="win-textbox num" value="0" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field"><label for="txtoRate">Rate</label><input type="text" id="txtoRate" class="win-textbox num" value="0" readonly/></div>
                <div class="ex-field"><label for="txtoAmount">Amount</label><input type="text" id="txtoAmount" class="win-textbox num" value="0" readonly/></div>
                <div class="ex-field"><label for="txtOContainer">Container No</label><input type="text" id="txtOContainer" class="win-textbox" autocomplete="off"/></div>
                <div class="ex-field fw-wide"><label for="txtoRemarks">Remarks</label><input type="text" id="txtoRemarks" class="win-textbox" autocomplete="off"/></div>
                <div class="ex-actions">
                    <button type="button" id="btnoadd" class="win-btn-small is-hidden">+</button>
                    <button type="button" id="btnoUpdate" class="win-btn-small is-hidden" onclick="ExportFw.otherUpdate()">Update</button>
                    <button type="button" id="btnoCancel" class="win-btn-small is-hidden" onclick="ExportFw.otherCancel()">Cancel</button>
                </div>
            </div>
            <div class="pd-caption pd-caption-teal pd-history-bar" style="height:23px;"><span>Other Items</span>
                <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdotheritemsBox" title="Fullscreen table">&#x26F6;</button></span></div>
            <div class="ex-grid-box" id="grdotheritemsBox">
                <div class="ex-grid-scroll ex-h240">
                    <table class="win-grid" id="grdotheritems">
                        <thead><tr><th>Item Name</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th>Container No</th><th>Remarks</th></tr></thead>
                        <tbody id="otherBody"></tbody><tfoot id="otherFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================================================== History -->
    <div class="win-tab-panel" id="tabHistory">
        <div class="win-tool-strip">
            <button type="button" id="btnResetHistory" class="win-btn-tool" onclick="ExportFw.historyReset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="ExportFw.historyRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="pd-caption pd-caption-teal">Export Forwarding History</div>
        <fieldset class="ex-groupbox"><legend>Filters</legend>
            <div class="ex-filter">
                <div class="ex-field" style="width:170px;"><label for="FromDateHistory">From Date</label>
                    <span class="ex-check"><input type="checkbox" id="FromDateHistoryChk" checked/><input type="date" id="FromDateHistory" class="win-date" style="flex:1;"/></span></div>
                <div class="ex-field" style="width:170px;"><label for="ToDateHistory">To Date</label>
                    <span class="ex-check"><input type="checkbox" id="ToDateHistoryChk" checked/><input type="date" id="ToDateHistory" class="win-date" style="flex:1;"/></span></div>
                <div class="ex-field"><label>&nbsp;</label>
                    <div class="ex-radios ex-radios-row">
                        <label class="ex-check"><input type="radio" name="fwDateMode" id="drdocdate" value="doc" checked/>Doc Date</label>
                        <label class="ex-check"><input type="radio" name="fwDateMode" id="rdentrydate" value="entry"/>Entry Date</label>
                        <label class="ex-check"><input type="radio" name="fwDateMode" id="rdmodifydate" value="modify"/>Modify Date</label>
                        <label class="ex-check"><input type="radio" name="fwDateMode" id="rdapproveddate" value="approved"/>Approved Date</label>
                    </div></div>
                <div class="ex-field" style="width:170px;"><label for="FromDocNoHistory">From &amp; To Doc No</label>
                    <div class="ex-pair" style="grid-template-columns:1fr 1fr;"><input type="text" id="FromDocNoHistory" class="win-textbox num" data-guard="integer"/><input type="text" id="ToDocNoHistory" class="win-textbox num" data-guard="integer"/></div></div>
                <div class="ex-field" style="width:220px;"><label for="CmbCustomerHistory">Customer</label>
                    <select id="CmbCustomerHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Party"></select></div>
                <div class="ex-field" style="width:150px;"><label for="CmbGpNoHistory">Gate Pass #</label>
                    <select id="CmbGpNoHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Gp No"></select></div>
                <div class="ex-field" style="width:170px;"><label for="CmbInvoiceNoHistory">Invoice No</label>
                    <select id="CmbInvoiceNoHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
                <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnShowHistory" class="win-btn-small" style="width:57px;" onclick="ExportFw.historyShow(this)">Show</button></div>
            </div>
        </fieldset>
        <div class="pd-caption pd-caption-dark pd-history-bar"><span>Filtered Records</span>
            <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="DataGridHistoryBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMountHist" class="pd-gridbar-mount"></span></span></div>
        <div class="ex-grid-box" id="DataGridHistoryBox">
            <div class="ex-grid-scroll ex-h300">
                <table class="win-grid" id="DataGridHistory" data-gridbar="EximForwarding:DataGridHistory" data-gridbar-mount="#gridBarMountHist" data-gridbar-reorder="false">
                    <thead id="histHead"></thead><tbody id="histBody"></tbody><tfoot id="histFoot"></tfoot>
                </table>
            </div>
            <div class="ex-grid-empty is-hidden" id="histEmpty">No record found.</div>
        </div>
        <div class="pd-caption pd-caption-dark pd-history-bar"><span>Detail of the Selected above Row</span>
            <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdHistoryDetailBox" title="Fullscreen table">&#x26F6;</button></span></div>
        <div class="ex-grid-box" id="grdHistoryDetailBox">
            <div class="ex-grid-scroll ex-h240">
                <table class="win-grid" id="grdHistoryDetail"><thead id="histDetHead"></thead><tbody id="histDetBody"></tbody><tfoot id="histDetFoot"></tfoot></table>
            </div>
