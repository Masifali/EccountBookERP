<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Summary By Month - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>

</head>
<!-- frmExportInvoiceSummaryByMonth.cs (Architecture.WinApp.ExportReports), no ScreenDefinition row, ClientSize 969 x 633,
     Text "Summary By Month". tsItemType: New, Refresh (no handler on the desktop), "531-Print Register", "ShortCut Keys".
     panel3: panel5 "Export Invoice Summary By Month" (white on rgb(10,110,110)); Date Type (cmbperemeter, CommonServices.DateType,
     Load activates row 1 = "This Week"), Date From * / Date To * (dd-MMM-yy, red asterisks), Show (white). panel4 = ctrlGrdBar1 strip.
     grdContractRegister: the form's DataTable (Customer, FcyCode, Fcy/Pkr July..June, totals), "#,##0.###" with Σ on every amount.
     Events: Load, cmbperemeter_ValueChanged, btnShow (+ Leave -> Date Type unless Shift+Tab), btnnew (Reset -> GridBind), btnPrint (531),
     btnShortCutKey, KeyDown (Enter, Ctrl+N, Ctrl+E/Esc, Ctrl+F5, Ctrl+S, Ctrl+Down, Ctrl+Alt), grid KeyDown / ColumnButtonClick "Print"
     (501) - unreachable: the grid has no Print or Id column. -->
<body class="pd-body" data-export-page="ism">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip" id="tsItemType">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportIsm.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" title="No handler on the desktop"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnPrint" class="win-btn-tool" onclick="ExportIsm.btnPrint(this)"><i class="fa fa-print"></i> <span>531-Print Register</span></button>
        <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportIsm.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="pd-caption pd-caption-teal" id="panel5" style="height:30px;"><span id="label3">Export Invoice Summary By Month</span></div>
    <div class="rpto-filter" id="panel3">
        <div class="ex-field w130"><label for="cmbperemeter" id="label11">Date Type</label><select id="cmbperemeter" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
        <div class="ex-field w130"><label for="txtdatefrom" id="label51">Date From<span class="rpto-req" id="label1">*</span></label><input type="date" id="txtdatefrom" class="win-date"/></div>
        <div class="ex-field w130"><label for="txtdateto" id="label5">Date To<span class="rpto-req" id="label4">*</span></label><input type="date" id="txtdateto" class="win-date"/></div>
        <button type="button" id="btnShow" class="win-btn-small rpto-btn-teal" onclick="ExportIsm.show(this)">Show</button>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" id="panel4" style="height:24px;"><span></span>
        <span class="ex-bar-right"><span id="gbIsm" class="pd-gridbar-mount"></span><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdContractRegister" tabindex="0" data-gridbar="frmExportInvoiceSummaryByMonth:grdContractRegister" data-gridbar-mount="#gbIsm"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left">frmExportInvoiceSummaryByMonth - Summary By Month</span>
        <button type="button" class="win-btn-history" id="btnIsmFooterHistory" onclick="ExportIsm.show(this)"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpto_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_invoice_summary_by_month.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
