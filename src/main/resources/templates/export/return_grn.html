<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Export Return GRN - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_m.css?v=20261003a}"/>
</head>
<!-- ExportReturn_Grn.cs (Architecture.WinApp.Export), screen 190 "Export Return GRN", ScreenName ExportReturn_Grn,
     DocumentTypeId 241. tabControl1: "Form" | "History".
     Form: toolStrip1 New / Refresh / Save / Update(hidden) / Delete(hidden) / Attachment / 215-Print / Load Invoices
       (EnableExportReturnReverseFlow) / ShortCut Keys / Print Preview (checked); "GRN For Export Return";
       panel3: Doc No (RO), Doc Date, Inward Gp # (cmbGpNo: TextChanged + Leave), Inward Gp Date (disabled), Outward Gp #
       (cmbForwardingNo: Leave; hidden in the reverse flow) | Customer, Destination Port, Loading Port, Transporter, Remarks |
       Freight, Vehicle No. (disabled), Bility No (disabled), Factory Wt (disabled), No. Of Ctr | Driver Name, Driver Cell No,
       CNIC No, ContainerNo-1, ContainerNo-2; Shipping Line / Shipping Agent (Visible = false).
       tabControl2 "Detail": panel5 (hidden in the reverse flow) WareHouse, Item (Name/Code, ReadOnly; Leave binds the pack UOMs),
       CropYear, JobLot, PackType, Pack UOM (TextChanged), No of Bags (TextChanged), Gross Weight (TextChanged), EbUnit (TextChanged),
       EB Total (RO), AddLess (TextChanged), NetWeight (RO), Stock Weight (RO), Item Description, Container #, Seal #, + / Update /
       Cancel; grdDetail (X, + and Edit columns; ItemDescription edits; reverse flow: Bags / Gross / EbUnit / AddLess edit;
       F1 pickers on Warehouse / JobLot / CropYear / PackingType, Container# / Seal# in the reverse flow).
       "Other Items" tab: removed from tabControl2 at load (TabPages.Remove(tabPage4)) - its rows are still loaded and saved.
     History: toolStrip2 New / Refresh; "GRN For Export Return History"; panel10 Date From,To (checkable), Doc From,To, Invoice No,
       Customer, Show; "Filtered Records" DataGridHistory (Edit / Print + attachments link); "Detail of above Selected Row". -->
<body class="pd-body exm-page">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tabs" data-tabs="grn">
        <button type="button" class="win-tab is-active" data-tab="grnForm">Form</button>
        <button type="button" class="win-tab" data-tab="grnHistory">History</button>
    </div>

    <div class="win-tab-panel is-active" id="grnForm">
        <div class="win-tool-strip">
            <button type="button" id="BtnNew" class="win-btn-tool" onclick="ExportReturnGrn.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportReturnGrn.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnSave" class="win-btn-tool" onclick="ExportReturnGrn.save(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="ExportReturnGrn.update(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="ExportReturnGrn.btnDelete(this)"><i class="fa fa-trash"></i> <span><u>D</u>elete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" onclick="ExportReturnGrn.attachment()"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="BtnPrint" class="win-btn-tool" onclick="ExportReturnGrn.print(this)"><i class="fa fa-print"></i> <span>215-Print</span></button>
            <button type="button" id="btnInvoiceLoader" class="win-btn-tool is-hidden" onclick="ExportReturnGrn.loaderOpen(this)"><i class="fa fa-download"></i> <span>Load Invoices</span></button>
            <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportReturnGrn.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
            <label class="ex-check" style="margin-left:8px;"><input type="checkbox" id="ChkPrintPreview" checked/> Print Preview</label>
        </div>
        <div class="pd-caption pd-caption-teal" style="height:26px;">GRN For Export Return</div>
        <div class="exm-head" style="--exm-cols:4;">
            <div class="ex-col">
                <div class="ex-field"><label for="txtdocno">Doc No</label><input type="text" id="txtdocno" class="win-textbox" readonly/></div>
                <div class="ex-field"><label for="DocDate">Doc Date</label><input type="date" id="DocDate" class="win-date"/></div>
                <div class="ex-field"><label class="ex-req" for="cmbGpNo">Inward Gp #</label>
                    <select id="cmbGpNo" class="win-combo dtcombo" data-dtcombo="single" data-columns="GatePass No|OrderType"></select></div>
                <div class="ex-field"><label for="txtGPDate">Inward Gp Date</label><input type="date" id="txtGPDate" class="win-date" disabled/></div>
                <div class="ex-field" id="forwardingWrap"><label class="ex-req" for="cmbForwardingNo">Outward Gp #</label>
                    <select id="cmbForwardingNo" class="win-combo dtcombo" data-dtcombo="single" data-columns="Outward GpNo|GatePassOutwardId|GpDate|ForwardingNo|ForwardingDate"></select></div>
            </div>
            <div class="ex-col">
                <div class="ex-field"><label class="ex-req" for="cmbCustomer">Customer</label>
                    <select id="cmbCustomer" class="win-combo dtcombo" data-dtcombo="single" data-columns="Customer Name|PartyCode|CityName|MobileNo"></select></div>
                <div class="ex-field"><label class="ex-req" for="cmbDestinationPort">Destination Port</label>
                    <select id="cmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Destination Port"></select></div>
                <div class="ex-field"><label class="ex-req" for="cmbLoadingPort">Loading Port</label>
                    <select id="cmbLoadingPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Loading Port"></select></div>
                <div class="ex-field"><label for="cmbtransporter">Transporter</label>
                    <select id="cmbtransporter" class="win-combo dtcombo" data-dtcombo="single" data-columns="Transporter|PartyCode|CityName|MobileNo"></select></div>
                <div class="ex-field"><label for="txtRemarksHeader">Remarks</label><input type="text" id="txtRemarksHeader" class="win-textbox"/></div>
            </div>
            <div class="ex-col">
                <div class="ex-field"><label for="txtFreight">Freight</label><input type="text" id="txtFreight" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field"><label class="ex-req" for="txtVehicleNo">Vehicle No.</label><input type="text" id="txtVehicleNo" class="win-textbox" disabled/></div>
                <div class="ex-field"><label for="txtBilityNo">Bility No</label><input type="text" id="txtBilityNo" class="win-textbox" disabled/></div>
                <div class="ex-field"><label class="ex-req" for="txtFactoryWeight">Factory Wt</label><input type="text" id="txtFactoryWeight" class="win-textbox num" value="0" disabled/></div>
                <div class="ex-field"><label class="ex-req" for="txtNoOfContainer">No. Of Ctr</label><input type="text" id="txtNoOfContainer" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
            </div>
            <div class="ex-col">
                <div class="ex-field"><label for="txtDriverName">Driver Name</label><input type="text" id="txtDriverName" class="win-textbox"/></div>
                <div class="ex-field"><label for="txtDriverCellNo">Driver Cell No</label><input type="text" id="txtDriverCellNo" class="win-textbox"/></div>
                <div class="ex-field"><label for="txtCNICNO">CNIC No</label><input type="text" id="txtCNICNO" class="win-textbox"/></div>
                <div class="ex-field"><label for="txtconainer1">ContainerNo-1</label><input type="text" id="txtconainer1" class="win-textbox"/></div>
                <div class="ex-field"><label for="txtContainer2">ContainerNo-2</label><input type="text" id="txtContainer2" class="win-textbox"/></div>
                <div class="ex-field is-hidden"><label for="cmbShippingLIne">Shipping Line</label><select id="cmbShippingLIne" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Shipping Line"></select></div>
                <div class="ex-field is-hidden"><label for="cmbShippingAgent">Shipping Agent</label><select id="cmbShippingAgent" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Shipping Agent"></select></div>
            </div>
        </div>

        <div class="win-tabs exm-subtabs" data-tabs="grnDet">
            <button type="button" class="win-tab is-active" data-tab="tabPage3">Detail</button>
        </div>
        <div class="win-tab-panel is-active" id="tabPage3">
            <div class="exm-entry" id="panel5">
                <div class="ex-field"><label for="CmbWareHouse">WareHouse</label><select id="CmbWareHouse" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="WareHouse Name"></select></div>
                <div class="ex-field w-l"><label for="cmbItem">Item <span class="ex-check" style="height:auto;margin-left:8px;"><input type="radio" name="itemBy" id="rdbtnItemName" value="name" checked/> Name <input type="radio" name="itemBy" id="rdbtnItemCode" value="code"/> Code</span></label>
                    <select id="cmbItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name" disabled></select></div>
                <div class="ex-field w-s"><label for="CmbCropYear">CropYear</label><select id="CmbCropYear" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select></div>
                <div class="ex-field"><label for="CmbJobLot">JobLot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLot"></select></div>
                <div class="ex-field"><label for="cmbPackType">PackType</label><select id="cmbPackType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Packing Type"></select></div>
                <div class="ex-field w-s"><label for="cmbPackUOM">Pack UOM</label><select id="cmbPackUOM" class="win-combo dtcombo" data-dtcombo="single" data-columns="Pack UOM|Equivalent"></select></div>
                <div class="ex-field w-s"><label for="txtNoOfBags">No of Bags</label><input type="text" id="txtNoOfBags" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field w-s"><label for="txtGrossWeight">Gross Weight</label><input type="text" id="txtGrossWeight" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div style="flex-basis:100%;height:0;"></div>
                <div class="ex-field w-s"><label for="txtEbUnit">EbUnit</label><input type="text" id="txtEbUnit" class="win-textbox num" data-guard="decimal" autocomplete="off"/></div>
                <div class="ex-field w-s"><label for="txtEbTotal">EB Total</label><input type="text" id="txtEbTotal" class="win-textbox num" readonly/></div>
                <div class="ex-field w-s"><label for="txtAddLess">AddLess</label><input type="text" id="txtAddLess" class="win-textbox num" data-guard="decimal-signed" autocomplete="off"/></div>
                <div class="ex-field w-s"><label for="txtNetWeight">NetWeight</label><input type="text" id="txtNetWeight" class="win-textbox num" readonly/></div>
                <div class="ex-field w-s"><label for="txtStockWeight">Stock Weight</label><input type="text" id="txtStockWeight" class="win-textbox num" readonly/></div>
                <div class="ex-field w-l"><label for="txtItemDesc">Item Description</label><input type="text" id="txtItemDesc" class="win-textbox"/></div>
                <div class="ex-field"><label for="cmbcontainerNo">Container #</label><select id="cmbcontainerNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="ContainerNo"></select></div>
                <div class="ex-field"><label for="txtSeal">Seal #</label><input type="text" id="txtSeal" class="win-textbox"/></div>
                <div class="ex-actions">
                    <button type="button" id="btnAddinGrid" class="win-btn-small" onclick="ExportReturnGrn.btnAddinGrid()">+</button>
                    <button type="button" id="btnDetailUpdate" class="win-btn-small is-hidden" onclick="ExportReturnGrn.btnDetailUpdate()">Update</button>
                    <button type="button" id="btnDetailCancel" class="win-btn-small is-hidden" onclick="ExportReturnGrn.btnDetailCancel()">Cancel</button>
                </div>
            </div>
            <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Detail</span>
                <span class="ex-bar-right"><span class="exm-note" id="grnDetailNote"></span><button type="button" class="ex-fs-btn" data-fullscreen="grdDetailBox" title="Fullscreen table">&#x26F6;</button></span></div>
            <div class="ex-grid-box" id="grdDetailBox"><div class="ex-grid-scroll ex-h300"><table class="win-grid" id="grdDetail"></table></div></div>
        </div>
    </div>

    <div class="win-tab-panel" id="grnHistory">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="ExportReturnGrn.historyReset()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefreshHistory" class="win-btn-tool" onclick="ExportReturnGrn.historyRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="pd-caption pd-caption-teal" style="height:24px;">GRN For Export Return History</div>
        <div class="ex-filter">
            <div class="ex-field" style="width:320px;"><label for="fromdateHistory">Date From,To</label>
                <span class="ex-check"><input type="checkbox" id="fromdateHistoryChk" checked/><input type="date" id="fromdateHistory" class="win-date" style="flex:1;"/>
                    <input type="checkbox" id="ToDateHistoryChk" checked/><input type="date" id="ToDateHistory" class="win-date" style="flex:1;"/></span></div>
            <div class="ex-field" style="width:200px;"><label for="txtFromNoHistory">Doc From,To</label>
                <div class="ex-pair" style="grid-template-columns:1fr 1fr;"><input type="text" id="txtFromNoHistory" class="win-textbox num" data-guard="integer" autocomplete="off"/><input type="text" id="txtToDocNoHistory" class="win-textbox num" data-guard="integer" autocomplete="off"/></div></div>
            <div class="ex-field" style="width:220px;"><label for="CmbInvoiceNoHistory">Invoice No</label>
                <select id="CmbInvoiceNoHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="InvoiceNo"></select></div>
            <div class="ex-field" style="width:240px;"><label for="CmbCustomerHistory">Customer</label>
                <select id="CmbCustomerHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnshowHistory" class="win-btn-small" style="width:62px;height:26px;" onclick="ExportReturnGrn.historyShow(this)">Show</button></div>
        </div>
        <div class="pd-caption pd-caption-teal pd-history-bar" style="height:26px;"><span>Filtered Records</span>
            <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="DataGridHistoryBox" title="Fullscreen table">&#x26F6;</button></span></div>
        <div class="ex-grid-box" id="DataGridHistoryBox"><div class="ex-grid-scroll ex-h300"><table class="win-grid" id="DataGridHistory"></table></div>
            <div class="ex-grid-empty is-hidden" id="DataGridHistoryEmpty">No record found.</div></div>
        <div class="pd-caption pd-caption-teal" style="height:24px;">Detail of above Selected Row</div>
        <div class="ex-grid-box" id="DataGridHistoryDetailBox"><div class="ex-grid-scroll ex-h240"><table class="win-grid" id="DataGridHistoryDetail"></table></div></div>
    </div>

    <div class="win-footer-strip">
        <span class="ex-footer-left" id="grnFooterInfo"></span>
        <button type="button" class="win-btn-history" id="btnGrnFooterHistory" onclick="ExportReturnGrn.toggleHistory()"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>

<!-- frmLoadExportReurnInvoiceForGrn (ShowDialog) -->
<div id="loaderModal" class="exm-modal is-hidden">
    <div class="exm-modal-box">
        <div class="pd-caption pd-caption-teal exm-modal-cap"><span>Load Export Return Invoice For GRN</span>
            <button type="button" class="ex-fs-btn" onclick="ExportReturnGrn.loaderClose()">&times;</button></div>
        <div class="win-tool-strip">
            <button type="button" id="ldBtnNew" class="win-btn-tool" onclick="ExportReturnGrn.loaderReset(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="ldBtnRefresh" class="win-btn-tool" onclick="ExportReturnGrn.loaderRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" class="win-btn-tool" onclick="ExportReturnGrn.loaderShortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="ex-filter">
            <div class="ex-field" style="width:150px;"><label for="ldFromDate">From Date</label><input type="date" id="ldFromDate" class="win-date"/></div>
            <div class="ex-field" style="width:150px;"><label for="ldTodate">To Date</label><input type="date" id="ldTodate" class="win-date"/></div>
            <div class="ex-field" style="width:200px;"><label for="ldCmbInvoiceNo">Invoice No</label><select id="ldCmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field" style="width:230px;"><label for="ldCmbCustomer">Customer</label><select id="ldCmbCustomer" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
            <div class="ex-field" style="width:200px;"><label for="ldCmbItem">Item</label><select id="ldCmbItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item"></select></div>
            <div class="ex-field" style="width:160px;"><label for="ldCmbJobLot">JobLot</label><select id="ldCmbJobLot" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLot"></select></div>
            <div class="ex-field" style="width:140px;"><label for="ldCmbCrop">Crop Year</label><select id="ldCmbCrop" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="ldBtnShow" class="win-btn-small" style="height:26px;" onclick="ExportReturnGrn.loaderShow(this)">Show</button></div>
        </div>
        <div class="pd-caption pd-caption-teal" style="height:22px;">Return Invoices</div>
        <div class="ex-grid-box"><div class="ex-grid-scroll ex-h240"><table class="win-grid" id="ldGrdMain"></table></div></div>
        <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Detail</span>
            <span class="ex-bar-right"><button type="button" id="ldBtnLoad" class="win-btn-small" onclick="ExportReturnGrn.loaderLoad(this)">Load</button></span></div>
        <div class="ex-grid-box"><div class="ex-grid-scroll ex-h240"><table class="win-grid" id="ldGrdDetail"></table></div></div>
        <div class="exm-totals">
            <div class="ex-field"><label for="txtOrderQtyHeader">Invoice Qty</label><input type="text" id="txtOrderQtyHeader" class="win-textbox num" readonly/></div>
            <div class="ex-field"><label for="txtUsedQtyHeader">Used Qty</label><input type="text" id="txtUsedQtyHeader" class="win-textbox num" readonly/></div>
            <div class="ex-field"><label for="txtBalanceQtyHeader">Balance Qty</label><input type="text" id="txtBalanceQtyHeader" class="win-textbox num" readonly/></div>
            <div class="ex-field"><label for="txtQrderWeightHeader">Invoice Weight</label><input type="text" id="txtQrderWeightHeader" class="win-textbox num" readonly/></div>
            <div class="ex-field"><label for="txtUsedWeightHeader">Used Weight</label><input type="text" id="txtUsedWeightHeader" class="win-textbox num" readonly/></div>
            <div class="ex-field"><label for="txtBalanceWeightHeader">Balance Weight</label><input type="text" id="txtBalanceWeightHeader" class="win-textbox num" readonly/></div>
        </div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_export_m_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_return_grn.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
