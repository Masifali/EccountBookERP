<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Export Summary - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpto.css?v=20261003a}"/>
</head>
<!-- ExportReportSummaries.cs (Architecture.WinApp.ExportReports), no ScreenDefinition row, ClientSize 1034 x 564, Text "Export Summary".
     tsItemType: New, "538-Summary". panel3: panel5 "Export Summary" (teal) + ctrlGrdBar1; From Date / To Date (dd-MMM-yy, default today),
     Contract No (GetLcOrderNo), Customer Name (ReadByOrganizationCompanyIdForExport), Item Name (GetExportItemsByOrganizationCompanyId),
     Destination Port (SeaPorts), Report Type (SpStaticColumnNames 'ExportSummary': ReportType / ReportName), Show (button1).
     panel4: grdfrm (RetrieveStructure of the procedure's DataTable; cleared when empty).
     Events: Load (combos + GridBind), button1 (GridBind), btnnew (Reset: texts blank, GridBind), btnReport (538 of dtdetail),
     KeyDown (Enter = Tab, Ctrl+N, Ctrl+E / Esc). -->
<body class="pd-body" data-export-page="sum">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip" id="tsItemType">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="ExportSum.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnReport" class="win-btn-tool" onclick="ExportSum.btnReport(this)"><i class="fa fa-print"></i> <span>538-Summary</span></button>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" id="panel5" style="height:34px;"><span id="label3" style="font-size:12pt;">Export Summary</span>
        <span class="ex-bar-right"><span id="gbSum" class="pd-gridbar-mount"></span><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="rpto-filter" id="panel3">
        <div class="ex-field w120"><label for="datFromDate" id="label1">From Date</label><input type="date" id="datFromDate" class="win-date"/></div>
        <div class="ex-field w120"><label for="datToDate" id="label4">To Date</label><input type="date" id="datToDate" class="win-date"/></div>
        <div class="ex-field w170"><label for="CmbContractNo" id="label2">Contract No</label><select id="CmbContractNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Contract No"></select></div>
        <div class="ex-field w200"><label for="CmbCustomerName" id="label50">Customer Name</label><select id="CmbCustomerName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
    </div>
    <div class="rpto-filter">
        <div class="ex-field w240"><label for="CmbItemName" id="label6">Item Name</label><select id="CmbItemName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <div class="ex-field w170"><label for="CmbSeaPort" id="label9">Destination Port</label><select id="CmbSeaPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Port Name"></select></div>
        <div class="ex-field w200"><label for="CmbReportType" id="label5">Report Type</label><select id="CmbReportType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="ReportName"></select></div>
        <button type="button" id="button1" class="win-btn-small" style="height:26px;" onclick="ExportSum.show(this)">Show</button>
    </div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdfrm" tabindex="0" data-gridbar="ExportReportSummaries:grdfrm" data-gridbar-mount="#gbSum"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left">ExportReportSummaries - Export Summary</span>
        <button type="button" class="win-btn-history" id="btnSumFooterHistory" onclick="ExportSum.show(this)"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpto_common.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_export_report_summaries.js?v=20261003a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
