<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Service Bill Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rptb.css?v=20260930a}"/>
</head>
<!-- frmServiceBillHistory.cs (Architecture.WinApp.Service), screen 912 "Service Bill Register", ClientSize 1333 x 743, form Text "Service Bill History".
     toolStrip3: btnNew "&Reset" | btnRefresh "Refresh" | btnRegister "541-Register" | btnShortCutKey "ShortCut Keys".
     panel3 (Teal) label23 "Service Bill History". panel2 filters: cmbperemeter "Date Type" (Rows[1] = This Week on load), datFromDate "From Date",
       dateToDate "To Date", cmbInvoiceNo "Invoice No", CmbSupplier "Bill To / Party", cmbLoadingPort "Loading Port", CmbDestinationPort
       "Destination Port", CmbServiceItem "Service Item ", btnshow "Show". panel4 + ctrlGrdBar1; DataGridHistory (Id hidden; gridHisory runs on load).
     Events: Load, cmbperemeter ValueChanged, btnshow/btnNew/btnRefresh/btnRegister/btnShortCutKey Click, KeyDown. -->
<body class="pd-body" data-export-page="rptb-912">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="ExportSvc.reset()"><i class="fa fa-eraser"></i> <span><u>R</u>eset</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="ExportSvc.refresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        <button type="button" id="btnRegister" class="win-btn-tool" onclick="ExportSvc.print541(this)"><i class="fa fa-print"></i> <span>541-Register</span></button>
        <button type="button" id="btnShortCutKey" class="win-btn-tool" onclick="ExportSvc.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="rptb-title"><span id="label23">Service Bill History</span></div>

    <div class="rptb-filters">
        <div class="rptb-row">
            <div class="ex-field w-m"><label for="cmbperemeter">Date Type</label>
                <select id="cmbperemeter" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
            <div class="ex-field w-s"><label for="datFromDate">From Date</label><input type="date" id="datFromDate" class="win-date"/></div>
            <div class="ex-field w-s"><label for="dateToDate">To Date</label><input type="date" id="dateToDate" class="win-date"/></div>
            <div class="ex-field w-m"><label for="cmbInvoiceNo">Invoice No</label>
                <select id="cmbInvoiceNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Invoice No"></select></div>
            <div class="ex-field w-xl"><label for="CmbSupplier">Bill To / Party</label>
                <select id="CmbSupplier" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
            <div class="ex-field w-m"><label for="cmbLoadingPort">Loading Port</label>
                <select id="cmbLoadingPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Loading Port"></select></div>
            <div class="ex-field w-m"><label for="CmbDestinationPort">Destination Port</label>
                <select id="CmbDestinationPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Destination Port"></select></div>
            <div class="ex-field w-l"><label for="CmbServiceItem">Service Item </label>
                <select id="CmbServiceItem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Service Item's"></select></div>
            <div class="ex-field"><label>&nbsp;</label><button type="button" id="btnshow" class="win-btn-small rptb-show" onclick="ExportSvc.show(this)">Show</button></div>
        </div>
    </div>

    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Service Bills</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdBox" title="Fullscreen table">&#x26F6;</button><span id="gridBarMount" class="pd-gridbar-mount"></span></span></div>
    <div class="ex-grid-box" id="grdBox">
        <div class="ex-grid-scroll ex-hfill">
            <table class="win-grid" id="DataGridHistory" data-gridbar="frmServiceBillHistory:DataGridHistory" data-gridbar-mount="#gridBarMount" data-gridbar-reorder="false"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ex-grid-empty is-hidden" id="grdEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip"><span class="ex-footer-left">frmServiceBillHistory</span></div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/countx_export_rptb_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_service_bill_register.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
