<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Export Detail History Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20260925a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_export_rpta.css?v=20260930a}"/>
</head>
<!-- ExportDetailHistoryReport.cs (Architecture.WinApp.ExportReports), screen 249 "Export Detail History (Not Use)", ClientSize 1141 x 564.
     tsItemType: New / 537-ExportDetail; "Export Detail History Report"; filters: From Date, To Date, Report Type, Customer Name, Contract No,
     Item Name, Item Category, Item Type, Destination Port, JobLot (all combos without a blank row), Show. grdfrm bound to the procedure's
     DataTable; GridSetting groups by the report type's column with group totals. Events: Load, KeyDown (Enter, Ctrl+N, Ctrl+E/Esc), btnnew, button1, btnReport. -->
<body class="pd-body" data-export-page="dth">
<div class="pd-form ex-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" accesskey="n" onclick="ExportDth.btnNew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnReport" class="win-btn-tool" onclick="ExportDth.btnReport(this)" data-rpt="537-ExportDetailHistoryReport.rpt"><i class="fa fa-print"></i> <span>537-ExportDetail</span></button>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:28px;"><span>Export Detail History Report</span>
        <span class="ex-bar-right"><span id="gridBarMountDth" class="pd-gridbar-mount"></span></span></div>
    <div class="rpta-filter">
        <div class="ex-field w200"><label for="datFromDate">From Date</label><input type="date" id="datFromDate" class="win-date"/></div>
        <div class="ex-field w200"><label for="datToDate">To Date</label><input type="date" id="datToDate" class="win-date"/></div>
        <div class="ex-field"><label for="CmbReportType">Report Type</label><select id="CmbReportType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="ReportName"></select></div>
        <div class="ex-field"><label for="CmbCustomerName">Customer Name</label><select id="CmbCustomerName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Customer Name"></select></div>
        <div class="ex-field"><label for="CmbContractNo">Contract No</label><select id="CmbContractNo" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Contract No"></select></div>
        <div class="ex-field"><label for="CmbItemName">Item Name</label><select id="CmbItemName" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <div class="ex-field"><label for="CmbItemCategory">Item Category</label><select id="CmbItemCategory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Category"></select></div>
        <div class="ex-field"><label for="CmbItemType">Item Type</label><select id="CmbItemType" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item Type"></select></div>
        <div class="ex-field"><label for="CmbSeaPort">Destination Port</label><select id="CmbSeaPort" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Port Name"></select></div>
        <div class="ex-field"><label for="CmbJobLot">JobLot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLotDescription"></select></div>
        <button type="button" id="button1" class="win-btn-small" style="width:70px;height:26px;" onclick="ExportDth.show(this)">Show</button>
    </div>
    <div class="pd-caption pd-caption-teal pd-history-bar" style="height:24px;"><span>Export Detail</span>
        <span class="ex-bar-right"><button type="button" class="ex-fs-btn" data-fullscreen="grdfrmBox" title="Fullscreen table">&#x26F6;</button></span></div>
    <div class="ex-grid-box" id="grdfrmBox">
        <div class="ex-grid-scroll ex-h400"><table class="win-grid" id="grdfrm" tabindex="0"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div class="ex-grid-empty is-hidden" id="grdfrmEmpty">No record found.</div>
    </div>
    <div class="win-footer-strip">
        <span class="ex-footer-left">ExportDetailHistoryReport - screen 249</span>
        <button type="button" class="win-btn-history" id="btnDthFooterHistory" onclick="ExportDth.show(document.getElementById('button1'))"><i class="fa fa-history"></i> <span>History</span></button>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260924a}"></script>
<script th:src="@{/build/js/countx_export_rpta_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_export_detail_history.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20260925a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
</body>
</html>
