<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${ppTitle} + ' Party Processing - EccountBookERP'">Goods Receiving Notes Party Processing - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        table.hrm-grid .ppb-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        table.hrm-grid .hrm-cell-input, table.hrm-grid .hrm-cell-select { min-width: 70px; }
        .ppb-caption-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .ppb-caption-right .hrm-check { color: #fff; }
        .ppb-date-chk { display: flex; align-items: center; gap: 4px; }
        .ppb-date-chk input[type=date] { flex: 1 1 auto; min-width: 0; }
        .ppb-radios { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .ppb-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
        .ppb-with-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; }
        .ppb-grids .hrm-grid-box { min-height: 160px; }
        .ppb-grids .hrm-grid-wrap { max-height: 320px; min-height: 110px; }
        .ppb-subtabs { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; }
        .ppb-subtabs .hrm-tab { font-size: 8.5pt; }
        /* Template I: Empty Bag and Gate Pass Info side by side under the detail grid; Template II: three tabs. */
        .ppb-other { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 6px; }
        .ppb-t2 .ppb-other { display: block; }
        .ppb-t2 .ppb-pane { display: none; }
        .ppb-t2 .ppb-pane.is-active { display: block; }
        .ppb-t1 .ppb-subtabs [data-sub="eb"], .ppb-t1 .ppb-subtabs [data-sub="gp"] { display: none; }
        @media (max-width: 900px) { .ppb-other { grid-template-columns: minmax(0, 1fr); } }
        .ppb-sel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .ppb-sel input { width: 110px; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.PartyProcessing.PartyProGrnAndGdn (687 Tag GoodsReceivingNotesPartyProcessing, DocumentTypeId 49, gate pass 54 /
     688 Tag GoodsDispatchNotesPartyProcessing, 89, gate pass 55). tabControl1: Form | History.
     Form: toolStrip1 New | Refresh | Save | Update | Delete | Attachment | 333-Print (GRN) | 339-Gdn (GDN) | City | Define Reference Party |
     Load Data (GDN) | ShortCut Keys; lblFormCaption + Print Preview; panel4: Doc No + date, Stock Party, Ref Party, Trade to Company |
     Transporter, Freight Amt, Gate Pass, Remarks | Vehicle Type, Vehicle No, Bilty No | Supp Weight, Fact Weight, Weight Diff |
     Template I / II; panel5 detail entry; tabControl2 Detail grid, Empty Bag grid, Gate Pass Info grid (Template I: the last two under it).
     History: toolStrip2 Reset | Refresh; Filters; GrdHistory (Edit, Print); "Detail of above selected row". -->
<body class="pd-body hrm-body" data-hrm="grn-gdn" th:attr="data-screen=${ppScreen},data-mode=${ppMode}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <div class="hrm-tab-page is-active" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnNew" class="win-btn-tool" onclick="PpGg.btnNew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="toolStripButton1" class="win-btn-tool" onclick="PpGg.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
            <button type="button" id="btnSave" class="win-btn-tool" onclick="PpGg.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="PpGg.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="PpGg.btnDelete(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" disabled title="Attachments are not ported to the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="printToolStripButton" class="win-btn-tool" onclick="PpGg.print333(this)" data-rpt-skip><i class="fa fa-print"></i> <span>333-Print</span></button>
            <button type="button" id="btnGdn339" class="win-btn-tool is-hidden" onclick="PpGg.print339(this)" data-rpt-skip><i class="fa fa-print"></i> <span>339-Gdn</span></button>
            <button type="button" id="CityDefine" class="win-btn-tool" disabled title="Opens the Define City form (not part of this page)"><i class="fa fa-map-marker"></i> <span>City</span></button>
            <button type="button" id="btnDefineReferenceParty" class="win-btn-tool" disabled title="Opens the Define Reference Parties form (not part of this page)"><i class="fa fa-users"></i> <span>Define Reference Party</span></button>
            <button type="button" id="btnLoadAvailableData" class="win-btn-tool is-hidden" onclick="PpGg.btnLoadAvailableData()"><i class="fa fa-download"></i> <span>Load Data</span></button>
            <button type="button" id="BtnShortCutkeys" class="win-btn-tool" onclick="PpGg.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span id="lblFormCaption" th:text="${ppTitle}">Goods Receiving Notes</span>
            <span class="ppb-caption-right"><label class="hrm-check"><input type="checkbox" id="ChkBox" checked> Print Preview</label></span></div>
        <fieldset class="hrm-group">
            <legend>Main</legend>
            <div class="hrm-entry hrm-cols-4" style="align-items:start">
                <div class="hrm-field"><label for="txtdocno">Doc No</label>
                    <div class="ppb-pair"><input type="text" id="txtdocno" class="win-textbox" readonly tabindex="-1"/><input type="date" id="DocDate" class="win-textbox"/></div></div>
                <div class="hrm-field"><label for="CmbTransport">Transporter</label><select id="CmbTransport" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="combvehtyp">Vehicle Type</label><select id="combvehtyp" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field" id="fldSuppWt"><label for="txtsuppwt">Supp Weight</label><input type="text" id="txtsuppwt" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="CmbStockParty">Stock Party</label><select id="CmbStockParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="txtcarramount">Freight Amt</label><input type="text" id="txtcarramount" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtvehno">Vehicle No</label><input type="text" id="txtvehno" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtfctwt">Fact Weight</label><input type="text" id="txtfctwt" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="CmbRefParty">Ref Party</label><select id="CmbRefParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="combgatepass">Gate Pass</label><input type="text" id="combgatepass" class="win-textbox" inputmode="numeric" autocomplete="off" readonly/></div>
                <div class="hrm-field"><label for="txtbltyno">Bilty No</label><input type="text" id="txtbltyno" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtwtdiff">Weight Diff</label><input type="text" id="txtwtdiff" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
                <div class="hrm-field"><label for="CmbTradeToCompany">Trade to Company</label>
                    <div class="ppb-with-btn"><select id="CmbTradeToCompany" class="win-combo dtcombo" data-dtcombo="single"></select>
                        <button type="button" id="BtnLookup" class="win-btn-action" disabled title="Opens the Lookup form (not part of this page)">...</button></div></div>
                <div class="hrm-field hrm-span-2"><label for="txtremarks">Remarks</label><input type="text" id="txtremarks" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label>Template</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="rdTemplate" id="rdTemplate1" value="1" checked> Template I</label>
                        <label class="hrm-check"><input type="radio" name="rdTemplate" id="rdTemplate2" value="2"> Template II</label>
                    </div></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group" id="panel5">
            <legend>Detail</legend>
            <div class="hrm-entry hrm-cols-4" style="align-items:end">
                <div class="hrm-field hrm-stack"><label for="CmbWareHouse">Warehouse</label><select id="CmbWareHouse" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbItem">Item Name</label><select id="CmbItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbCropYear">Crop Year</label><select id="CmbCropYear" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobLot">Job Lot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbPackingtype">Packing Type</label><select id="CmbPackingtype" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbPackUom">Pack UOM</label><select id="CmbPackUom" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtQty">Qty</label><input type="text" id="txtQty" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtGrossWeight">Gross Weight</label><input type="text" id="txtGrossWeight" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtebu">E.b / Unit</label><input type="text" id="txtebu" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtEmptyBagsTotal">E.b Total</label><input type="text" id="txtEmptyBagsTotal" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtadlswt">Ad/Ls</label><input type="text" id="txtadlswt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtstockwt">Stock Weight</label><input type="text" id="txtstockwt" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
                <div class="hrm-field hrm-stack"><label for="CmbCity">City/Area</label><select id="CmbCity" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack" id="fldComments"><label for="txtCommentsDetail">Comments</label><input type="text" id="txtCommentsDetail" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack is-hidden" id="fldContainer"><label for="txtContainerNo">Container#</label><input type="text" id="txtContainerNo" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack is-hidden" id="fldSeal"><label for="txtSealNo">Seal#</label><input type="text" id="txtSealNo" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="hrm-inline">
                        <button type="button" id="Add" class="win-btn-action" onclick="PpGg.add()">+</button>
                        <button type="button" id="btnUpdateDetail" class="win-btn-action is-hidden" onclick="PpGg.btnUpdateDetail()">Update</button>
                        <button type="button" id="btnCancelUpdateDetial" class="win-btn-action is-hidden" onclick="PpGg.btnCancelUpdateDetial()">Cancel</button>
                    </div></div>
            </div>
        </fieldset>
        <div id="ppbGrids" class="ppb-grids ppb-t1">
            <div class="ppb-subtabs">
                <button type="button" class="hrm-tab is-active" data-sub="detail">Detail</button>
                <button type="button" class="hrm-tab" data-sub="eb">Empty Bag</button>
                <button type="button" class="hrm-tab" data-sub="gp">Gate Pass Info</button>
            </div>
            <div class="hrm-grid-box ppb-pane is-active" data-pane="detail">
                <div class="hrm-subcaption"><span>Detail Grid</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnGdn:grd" id="grd"></table></div>
            </div>
            <div class="ppb-other">
                <div class="hrm-grid-box ppb-pane" data-pane="eb">
                    <div class="hrm-subcaption"><span>Empty Bag Grid</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                    <div class="hrm-grid-wrap"><table id="grdEmptyBags"></table></div>
                </div>
                <div class="hrm-grid-box ppb-pane" data-pane="gp">
                    <div class="hrm-subcaption"><span>Gate Pass Info Grid</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                    <div class="hrm-grid-wrap"><table data-gridbar="GrnGdn:grdGp" id="grdGp"></table></div>
                </div>
            </div>
        </div>
    </div>

    <div class="hrm-tab-page" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="PpGg.btnNewHistory()"><i class="fa fa-plus"></i> <span><u>R</u>eset</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="PpGg.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        </div>
        <div class="hrm-caption"><span id="lblHistory" th:text="${ppHistoryTitle}">Goods Receiving Notes Party Processing History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">From Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use From Date"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">To Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use To Date"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">From Doc No</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">To Doc No</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="cmbStockPartyHistory">Stock Party</label><select id="cmbStockPartyHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="cmbReferencePartyHistory">Reference Party</label><select id="cmbReferencePartyHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnshowHistory" class="win-btn-action" onclick="PpGg.btnshowHistory(this)">Show</button></div>
                <div class="hrm-field hrm-stack" id="fldReffered"><label>&nbsp;</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="histRef" value="0" checked> All</label>
                        <label class="hrm-check"><input type="radio" name="histRef" value="1"> Reffered</label>
                        <label class="hrm-check"><input type="radio" name="histRef" value="2"> Not Reffered</label>
                    </div></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="histDateType" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="modify"> Modify Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="ppb-grids">
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnGdn:GrdHistory" id="GrdHistory"></table></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail of above selected row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnGdn:GrdHistoryDetail" id="GrdHistoryDetail"></table></div>
            </div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppb_common.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_pp_grn_gdn.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
