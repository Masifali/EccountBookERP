<!-- Architecture.WinApp.PartyProcessing.DefItemCatagoryPartyProcessing (685) - ClientSize 1036 x 704, KeyPreview.
     toolStrip1: New | Update (hidden until a row is loaded) | Save.  panel2 (40): "Item Category".
     panel6 (67): Code* txtItemCategoryCode (95,7) | Description* txtItemCategoryDescription (451,7) | Serial From* txtItemCategorySerialFrom (774,9) /
     Serial To* txtItemCategorySerialTo (95,33) | Item Parent Category CmbItemParentCategory (451,33) | Is Active chkstatus (678,36, checked).
     panel4 grdfrm GridEX (Fill): Id hidden, CategoryCode, CategoryDescription, SerialFrom, SerialTo, CategoryStatus. -->
<body class="pd-body hrm-body" data-pp="item-category" data-screen="685">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="PpItemCategory.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="PpItemCategory.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="PpItemCategory.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="hrm-caption">Item Category</div>
    <div class="hrm-entry hrm-cols-3">
        <div class="hrm-field"><label for="txtItemCategoryCode" class="hrm-req">Code</label><input type="text" id="txtItemCategoryCode" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtItemCategoryDescription" class="hrm-req">Description</label><input type="text" id="txtItemCategoryDescription" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtItemCategorySerialFrom" class="hrm-req">Serial From</label><input type="text" id="txtItemCategorySerialFrom" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
        <div class="hrm-field"><label for="txtItemCategorySerialTo" class="hrm-req">Serial To</label><input type="text" id="txtItemCategorySerialTo" class="win-textbox" data-guard="integer" inputmode="numeric" autocomplete="off"/></div>
        <div class="hrm-field"><label for="CmbItemParentCategory">Item Parent Category</label><select id="CmbItemParentCategory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
        <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="chkstatus" checked> Is Active</label></div>
    </div>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table id="grdfrm"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_item_category.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
</body>
</html>
