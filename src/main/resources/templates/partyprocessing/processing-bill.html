<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Processing Bill - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_pp_ppc.css?v=20260930a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.PartyProcessing.ProductionPartyProcessingBill (675, DocumentTypeId 123). tabControl1: Form | History.
     Form: toolStrip1 New | Refresh | Save | Update | Delete | Attachment | 611-Print | ShortCut Keys; caption "Processing Bill" +
     Print Preview; panel5 four columns - Bill Date (No + Date), Job Order No, Remarks | Stock Party, Credit Account |
     Processing Rate, Rate_Uom, No of Bags, Processsing Amount | Over Head, Packing Material, BP Total Amt, Bill Amount;
     InPut Detail (grdInput) | OutPut By Products (grdByProducts); Packing Material (grdPM) | Over Heads (grdOH).
     History: toolStrip2 Reset; Filters: Date From / To, Doc From / To, Job Order, Show; Doc / Entry / Modify / Approve Date;
     GrdHistoryMain (Edit, Print, Voucher); InPut Detail | Purchased By Product Detail; Packing Material Detail | Over Heads Detail. -->
<body class="pd-body hrm-body" data-hrm="pp-processing-bill" th:attr="data-screen=${ppScreen}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs" data-tabs="main">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <div class="hrm-tab-page is-active" data-group="main" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnnew" class="win-btn-tool" onclick="PpPb.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="PpPb.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="PpPb.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="PpPb.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="PpPb.btnDelete(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="btnattachment" class="win-btn-tool" disabled title="Attachments are not ported to the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="BtnPrint" class="win-btn-tool" onclick="PpPb.print(this)" data-rpt-skip><i class="fa fa-print"></i> <span>611-<u>P</u>rint</span></button>
            <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="PpPb.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span>Processing Bill</span>
            <span class="ppc-caption-right"><label class="hrm-check"><input type="checkbox" id="ChkBox"> Print Preview</label></span></div>
        <div class="hrm-entry hrm-cols-4" style="align-items:start">
            <div class="hrm-field"><label for="txtBillNo">Bill Date</label>
                <div class="ppc-pair"><input type="text" id="txtBillNo" class="win-textbox" readonly tabindex="-1"/><input type="date" id="datBillDate" class="win-textbox"/></div></div>
            <div class="hrm-field"><label for="CmbStockParty">Stock Party</label><select id="CmbStockParty" class="win-combo"></select></div>
            <div class="hrm-field"><label for="txtRate">Processing Rate</label><input type="text" id="txtRate" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
            <div class="hrm-field"><label for="txtOHAmount">Over Head</label><input type="text" id="txtOHAmount" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>

            <div class="hrm-field"><label for="CmbJobOrderNo">Job Order No</label><select id="CmbJobOrderNo" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbCreditAc">Credit Account</label><select id="CmbCreditAc" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbRateUom">Rate_Uom</label><select id="CmbRateUom" class="win-combo"></select></div>
            <div class="hrm-field"><label for="txtPMAmount">Packing Material</label><input type="text" id="txtPMAmount" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>

            <div class="hrm-field hrm-span-2" style="grid-row:span 2;align-self:start"><label for="txtRemarks">Remarks</label><textarea id="txtRemarks" class="win-textbox" rows="3"></textarea></div>
            <div class="hrm-field"><label for="txtNoOfBags">No of Bags</label><input type="text" id="txtNoOfBags" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
            <div class="hrm-field"><label for="txtBPPurchaseTotalAmt">BP Total Amt</label><input type="text" id="txtBPPurchaseTotalAmt" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
            <div class="hrm-field"><label for="txtProcesssingAmount">Processsing Amount</label><input type="text" id="txtProcesssingAmount" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
            <div class="hrm-field"><label for="txtBillAmount">Bill Amount</label><input type="text" id="txtBillAmount" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
        </div>
        <div class="ppc-two">
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>InPut Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grdInput"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>OutPut By Products <small>Please remove the row that you don't want to save</small></span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grdByProducts"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>Packing Material</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grdPM"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>Over Heads</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grdOH"></table></div></div>
        </div>
    </div>

    <div class="hrm-tab-page" data-group="main" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="PpPb.btnNewHistory()"><i class="fa fa-undo"></i> <span><u>R</u>eset</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="PpPb.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="hrm-caption"><span>Processing Bill History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">Date From</label>
                    <div class="ppc-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use Date From"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">Date To</label>
                    <div class="ppc-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use Date To"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">Doc From</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">Doc To</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobOrderHistory">Job Order</label><select id="CmbJobOrderHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="BtnShowHistory" class="win-btn-action" onclick="PpPb.BtnShowHistory(this)">Show</button></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label>&nbsp;</label>
                    <div class="ppc-radios">
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="modify"> Modify Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="approved"> Approve Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table data-gridbar="ProcessingBill:GrdHistoryMain" id="GrdHistoryMain"></table></div>
        </div>
        <div class="ppc-two">
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>InPut Detail</span></div><div class="hrm-grid-wrap"><table id="GrdHistoryInput"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>Purchased By Product Detail</span></div><div class="hrm-grid-wrap"><table id="grdhistoryBpPurchased"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>Packing Material Detail</span></div><div class="hrm-grid-wrap"><table id="grdHistoryPM"></table></div></div>
            <div class="hrm-grid-box hrm-grid-short"><div class="hrm-subcaption"><span>Over Heads Detail</span></div><div class="hrm-grid-wrap"><table id="grdhistoryOH"></table></div></div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppc_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_pp_processing_bill.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
