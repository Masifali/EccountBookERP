<!-- Architecture.WinApp.PartyProcessing.DefPartyProcessingItemType (686) - ClientSize 808 x 563, Maximized, KeyPreview.
     tsItemType: New | Update (hidden until a row is loaded) | Save.  panel10 (Teal, 46): "Item Type".
     panel11 (64): Code txtItemTypeCode (12,33) 151 | Description txtItemTypeDescription (167,33) 163 | Type cmbItemTypeType (333,33) 155
     (UltraCombo, LimitToList, InvLookUp type 6).  panel2 grdhistory GridEX (Fill, filter row, total row): Id hidden, Code, Description, Type. -->
<body class="pd-body hrm-body" data-pp="item-type" data-screen="686">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form hrm-medium">
    <div class="win-tool-strip">
        <button type="button" id="btnnew" class="win-btn-tool" onclick="PpItemType.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="PpItemType.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" id="btnsave" class="win-btn-tool" onclick="PpItemType.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
    </div>
    <div class="hrm-caption">Item Type</div>
    <div class="hrm-entry hrm-cols-3">
        <div class="hrm-field hrm-stack"><label for="txtItemTypeCode">Code</label><input type="text" id="txtItemTypeCode" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field hrm-stack"><label for="txtItemTypeDescription">Description</label><input type="text" id="txtItemTypeDescription" class="win-textbox" autocomplete="off"/></div>
        <div class="hrm-field hrm-stack"><label for="cmbItemTypeType">Type</label><select id="cmbItemTypeType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
    </div>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
        <div class="hrm-grid-wrap"><table data-gridbar="ItemType:grdhistory" id="grdhistory"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>

<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
