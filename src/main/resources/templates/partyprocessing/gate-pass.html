<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${ppTitle} + ' - EccountBookERP'">Gate Pass - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        table.hrm-grid .ppb-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        .ppb-caption-right { display: flex; align-items: center; gap: 10px; }
        .ppb-caption-right .hrm-check { color: #fff; }
        .ppb-date-chk { display: flex; align-items: center; gap: 4px; }
        .ppb-date-chk input[type=date] { flex: 1 1 auto; min-width: 0; }
        .ppb-radios { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .ppb-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
    </style>
</head>
<!-- Architecture.WinApp.PartyProcessing.GatePassInwardPartyProcessing (681 Tag GatePassInwardPartyProcessing, DocumentTypeId 54 /
     682 Tag GatePassOutwardParyProcessing, 55). tabControl1: Form | History.
     Form: toolStrip1 New | Refresh | Update | Save | Delete | Attachment | DefineCity | 299-Print | ShortCut Keys; panel6 caption +
     Preview (ChkBox); panel4 (946x201) three columns - x 7: Gp No & Date, Gp Type (& ADO #), Stock Party, Ref Party Name (+ define),
     City Name, Variety Name, Remarks (full width); x 371: Item Qty, Vehicle Type, Vehicle No, Bilty No, Bilty Freight, Gp Status;
     x 659: Supplier Weight, Factory Weight (disabled), Difference Weight, W.b Status, Is Weighable. panel9 "Open Gate Passes" grid (Print, Edit).
     History: toolStrip2 New | Refresh; groupBox3 Filters: From / To Date (check boxes), From / To Doc No, Stock Party, Show,
     Doc / Entry / Modify Date radios; grdhistory (Print, Edit). Supplier / Difference Weight are hidden on 55. -->
<body class="pd-body hrm-body" data-hrm="gate-pass" th:attr="data-screen=${ppScreen},data-mode=${ppMode}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <!-- ============================================================ Form -->
    <div class="hrm-tab-page is-active" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnnew" class="win-btn-tool" onclick="PpGp.btnnew(this)"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="PpGp.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnupdate" class="win-btn-tool is-hidden" onclick="PpGp.btnupdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="PpGp.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="PpGp.btnDelete(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" disabled title="Attachments are not ported to the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="toolStripButton3" class="win-btn-tool" onclick="PpGp.defineCity()"><i class="fa fa-map-marker"></i> <span>DefineCity</span></button>
            <button type="button" id="btnPrint" class="win-btn-tool" onclick="PpGp.btnPrint(this)" data-rpt-skip><i class="fa fa-print"></i> <span>299-Print</span></button>
            <button type="button" id="BtnShortCutkeys" class="win-btn-tool" onclick="PpGp.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span id="lblFormName" th:text="${ppTitle}">GatePass Inward</span>
            <span class="ppb-caption-right"><label class="hrm-check"><input type="checkbox" id="ChkBox" checked> Preview</label></span></div>
        <div class="hrm-entry hrm-cols-3" style="align-items:start">
            <div class="hrm-field"><label for="txtgpno">Gp No &amp; Date</label>
                <div class="ppb-pair"><input type="text" id="txtgpno" class="win-textbox" readonly tabindex="-1"/><input type="date" id="txtgpdate" class="win-textbox"/></div></div>
            <div class="hrm-field"><label for="txtqty">Item Qty</label><input type="text" id="txtqty" class="win-textbox hrm-al-right" inputmode="numeric" autocomplete="off"/></div>
            <div class="hrm-field" id="rowSupplierWeight"><label for="txtSupplierWeight">Supplier Weight</label><input type="text" id="txtSupplierWeight" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>

            <div class="hrm-field"><label for="cmbgptype" id="labelGpType">Gp Type</label>
                <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbgptype" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <div class="hrm-grow is-hidden" id="boxAdvanceDo"><select id="CmbAdvanceDo" class="win-combo dtcombo" data-dtcombo="single"></select></div></div></div>
            <div class="hrm-field"><label for="cmbvehicletype">Vehicle Type</label><select id="cmbvehicletype" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtFactoryWeight">Factory Weight</label><input type="text" id="txtFactoryWeight" class="win-textbox hrm-al-right" disabled/></div>

            <div class="hrm-field"><label for="cmbStockParty">Stock Party</label><select id="cmbStockParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtvehicleno">Vehicle No</label><input type="text" id="txtvehicleno" class="win-textbox" autocomplete="off"/></div>
            <div class="hrm-field" id="rowDifferenceWeight"><label for="txtDifferenceWeight">Difference Weight</label><input type="text" id="txtDifferenceWeight" class="win-textbox hrm-al-right" autocomplete="off"/></div>

            <div class="hrm-field"><label for="cmbsupp">Ref Party Name</label>
                <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbsupp" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <button type="button" id="btnFormReferenceParty" class="win-btn-action" style="min-width:0;width:30px;height:23px;padding:0" title="Define Reference Parties" tabindex="-1" onclick="PpGp.defineReferenceParty()"><i class="fa fa-plus"></i></button></div></div>
            <div class="hrm-field"><label for="txtbiltyno">Bilty No</label><input type="text" id="txtbiltyno" class="win-textbox" autocomplete="off"/></div>
            <div class="hrm-field"><label for="cmbWeighBridge">W.b Status</label><select id="cmbWeighBridge" class="win-combo"></select></div>

            <div class="hrm-field"><label for="cmbcity">City Name</label><select id="cmbcity" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtfreight">Bilty Freight</label><input type="text" id="txtfreight" class="win-textbox hrm-al-right" inputmode="numeric" autocomplete="off"/></div>
            <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="ChkIsWeighable" checked disabled> Is Weighable</label></div>

            <div class="hrm-field"><label for="CmbVariety">Variety Name</label><select id="CmbVariety" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbStatus">Gp Status</label><select id="CmbStatus" class="win-combo"></select></div>
            <div class="hrm-field"></div>

            <div class="hrm-field hrm-span-all"><label for="txtremarks">Remarks</label><input type="text" id="txtremarks" class="win-textbox" autocomplete="off"/></div>
        </div>
        <div class="hrm-grid-box" id="boxOpen">
            <div class="hrm-subcaption"><span>Open Gate Passes</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grd"></table></div>
        </div>
    </div>

    <!-- ============================================================ History -->
    <div class="hrm-tab-page" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="PpGp.btnNewHistory()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="PpGp.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="hrm-caption"><span>History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">From Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use From Date"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">To Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use To Date"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">From Doc No</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">To Doc No</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="CmbStockPartyHistory">Stock Party</label><select id="CmbStockPartyHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnShowHistory" class="win-btn-action" onclick="PpGp.btnShowHistory(this)">Show</button></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label>&nbsp;</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="histDateType" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="modify"> Modify Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box" id="boxHistory">
            <div class="hrm-subcaption"><span>History</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="grdhistory"></table></div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppb_common.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_pp_gate_pass.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
