<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>GRN For Purchase - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        table.hrm-grid .ppb-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        table.hrm-grid .hrm-cell-input, table.hrm-grid .hrm-cell-select { min-width: 70px; }
        .ppb-caption-right .hrm-check { color: #fff; }
        .ppb-date-chk { display: flex; align-items: center; gap: 4px; }
        .ppb-date-chk input[type=date] { flex: 1 1 auto; min-width: 0; }
        .ppb-radios { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .ppb-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
        .ppb-grids .hrm-grid-box { min-height: 150px; }
        .ppb-grids .hrm-grid-wrap { max-height: 320px; min-height: 100px; }
        .ppb-sel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .ppb-sel input { width: 110px; }
        .ppb-label-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    </style>
</head>
<!-- Architecture.WinApp.PartyProcessing.GRNForPurchaseFromPartyProcessing (ScreenId 613, DocumentTypeId 217). tabControl1: Form | History.
     Form: toolStrip1 New | Refresh | Update | Save | Delete | Attachment | 211-Print | City | ShortCut Keys | Load Data; caption
     "Goods Receiving Notes - Direct" + Print; panel4: Doc No & Date, Supplier Name, Delivery Term, Transporter, Remarks | Freight Amt,
     Gp No, Vehicle Type, Vehicle No | Bilty No, Ticket No, Fact Weight, Add Wages; panel5 detail entry; "Detail" grid (X, Edit) and the
     Empty Bags grid (+). History: toolStrip2 Reset | Refresh | GrnHistory; Filters; "Filtered Records" (Print, Edit) and "Detail of the
     Selected above row". -->
<body class="pd-body hrm-body" data-hrm="grn-purchase" th:attr="data-screen=${ppScreen}">
<div class="hrm-form">
    <div class="hrm-tabs">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <div class="hrm-tab-page is-active" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnNew" class="win-btn-tool" onclick="PpGp.btnNew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefresh" class="win-btn-tool" onclick="PpGp.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="PpGp.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnSave" class="win-btn-tool" onclick="PpGp.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="PpGp.btnDelete(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" disabled title="Attachments are not ported to the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="BtnPrint" class="win-btn-tool" onclick="PpGp.btnPrint(this)" data-rpt-skip><i class="fa fa-print"></i> <span>211-Print</span></button>
            <button type="button" id="CityDefine" class="win-btn-tool" disabled title="Opens the Define City form (not part of this page)"><i class="fa fa-map-marker"></i> <span>City</span></button>
            <button type="button" id="BtnShortCutkeys" class="win-btn-tool" onclick="PpGp.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
            <button type="button" id="btnLoadAvailableData" class="win-btn-tool" onclick="PpGp.btnLoadAvailableData()"><i class="fa fa-download"></i> <span>Load Data</span></button>
        </div>
        <div class="hrm-caption"><span>Goods Receiving Notes - Direct</span>
            <span class="ppb-caption-right"><label class="hrm-check"><input type="checkbox" id="ChkBox" checked> Print</label></span></div>
        <fieldset class="hrm-group">
            <legend>Main</legend>
            <div class="hrm-entry hrm-cols-3" style="align-items:start">
                <div class="hrm-field"><label for="txtdocno">Doc No &amp; Date</label>
                    <div class="ppb-pair"><input type="text" id="txtdocno" class="win-textbox" disabled/><input type="date" id="DocDate" class="win-textbox"/></div></div>
                <div class="hrm-field"><label for="txtcarramount">Freight Amt</label><input type="text" id="txtcarramount" class="win-textbox hrm-al-right" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtbltyno">Bilty No</label><input type="text" id="txtbltyno" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="combsupplier">Supplier Name *</label><select id="combsupplier" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="txtGpNo">Gp No</label><input type="text" id="txtGpNo" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field"><label for="CmbTicketNo">Ticket No</label><select id="CmbTicketNo" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="CmbDeliveryTerm">Delivery Term *</label><select id="CmbDeliveryTerm" class="win-combo"></select></div>
                <div class="hrm-field"><label for="combvehtyp">Vehicle Type</label><select id="combvehtyp" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="txtfctwt">Fact Weight *</label><input type="text" id="txtfctwt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field"><label for="CmbTransport">Transporter</label><select id="CmbTransport" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field"><label for="txtvehno">Vehicle No</label><input type="text" id="txtvehno" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label>&nbsp;</label><label class="hrm-check"><input type="checkbox" id="chkAddWages"> Add Wages</label></div>
                <div class="hrm-field hrm-span-2"><label for="txtremarks">Remarks</label><input type="text" id="txtremarks" class="win-textbox" autocomplete="off"/></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group" id="panel5">
            <legend>Detail</legend>
            <div class="hrm-entry hrm-cols-4" style="align-items:end">
                <div class="hrm-field hrm-stack"><label for="CmbWareHouse">Warehouse From</label><select id="CmbWareHouse" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbWarehouseTo">Warehouse To</label><select id="CmbWarehouseTo" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><div class="ppb-label-row"><label for="combitem">Item</label>
                    <span class="ppb-radios"><label class="hrm-check"><input type="radio" name="itemSearch" id="rdSearchByName" value="name" checked> Name</label>
                        <label class="hrm-check"><input type="radio" name="itemSearch" id="rdSearchByCode" value="code"> Code</label></span></div>
                    <select id="combitem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="combcropyear">Crop Year</label><select id="combcropyear" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobLot">JobLot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="combpcktyp">Packing Type</label><select id="combpcktyp" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="combpckuom">Pack UOM</label><select id="combpckuom" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtqty">Qty</label><input type="text" id="txtqty" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtgwt">Gross Weight</label><input type="text" id="txtgwt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtebu">E.b / Unit</label><input type="text" id="txtebu" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtEmptyBagsTotal">E.b Total</label><input type="text" id="txtEmptyBagsTotal" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtadlswt">Ad/Ls</label><input type="text" id="txtadlswt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtnetwt">Net Weight</label><input type="text" id="txtnetwt" class="win-textbox hrm-al-right" disabled/></div>
                <div class="hrm-field hrm-stack"><label for="txtstockwt">Stock Weight</label><input type="text" id="txtstockwt" class="win-textbox hrm-al-right" disabled/></div>
                <div class="hrm-field hrm-stack"><label for="CmbCity">City/Area</label><select id="CmbCity" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="hrm-inline">
                        <button type="button" id="Add" class="win-btn-action" onclick="PpGp.add()">+</button>
                        <button type="button" id="btnUpdateDetail" class="win-btn-action is-hidden" onclick="PpGp.btnUpdateDetail()">Update</button>
                        <button type="button" id="btnCancelUpdateDetial" class="win-btn-action is-hidden" onclick="PpGp.btnCancelUpdateDetial()">Cancel</button>
                    </div></div>
            </div>
        </fieldset>
        <div class="ppb-grids">
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grd"></table></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>This Grid show Empty Bags Info.User Can Add Empty Bags Info Here</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="grdEmptyBags"></table></div>
            </div>
        </div>
    </div>

    <div class="hrm-tab-page" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="PpGp.btnNewHistory()"><i class="fa fa-plus"></i> <span><u>R</u>eset</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="PpGp.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
            <button type="button" id="btnGrnFormHistory" class="win-btn-tool" disabled title="Opens the GRN History form (not part of this page)"><i class="fa fa-print"></i> <span>GrnHistory</span></button>
        </div>
        <div class="hrm-caption"><span>Goods Receiving Notes  History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">From Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use From Date"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">To Date</label>
                    <div class="ppb-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use To Date"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">From Doc</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">To Doc</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="cmbSupplierNameHistory">Supplier</label><select id="cmbSupplierNameHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnshow" class="win-btn-action" onclick="PpGp.btnshow(this)">Show</button></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="histRef" value="0" checked> All</label>
                        <label class="hrm-check"><input type="radio" name="histRef" value="1"> Reffered</label>
                        <label class="hrm-check"><input type="radio" name="histRef" value="2"> Not Reffered</label>
                    </div></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label>&nbsp;</label>
                    <div class="ppb-radios">
                        <label class="hrm-check"><input type="radio" name="histDateType" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="modify"> Modify Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" value="approved"> Approved Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="ppb-grids">
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="GrdHistory"></table></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail of the Selected above row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table id="GrdHistoryDetail"></table></div>
            </div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppb_common.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_pp_grn_purchase.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260929a}"></script>
<script src="/js/print-rpt.js?v=20261001a"></script>
</body>
</html>
