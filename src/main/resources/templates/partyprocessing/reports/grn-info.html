<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Grn History - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm_reports.css?v=20260929a}"/>
    <style>
        table.hrm-grid .pp-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        table.hrm-grid tr.pp-group td { background: #dfeeee; font-weight: bold; }
        table.hrm-grid tr.pp-group-total td { background: #f3f7f7; font-style: italic; }
        .pp-checks { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- Architecture.WinApp.PartyProcessingReports.frmPartyProcessingGrnInfo (690) - AutoScrollMinSize 1202 x 648, KeyPreview.
     toolStrip3: Reset | Refresh | 169-Register | ShortCut Keys.  caption "Grn History".
     groupBox1 "Filters": Date Type cmbDateType (124,14) | GP No From & To GpsNoFrom / GpsNoTo | Reference Party cmbRefParty /
     Date From & To GRNfromdate / GRNToDate | Item Name CmbItem | Warehouse CmbWarehouseName /
     GRN No From & To txtGrnNoFrom / txtGrnNoTo | Stock Party CmbSupplier | JobLot CmbJobLotName | Type CmbGrnType | Show.
     "History" + DataGridHistory: Print button (frozen), Id / DocumentTypeId hidden, sums on ItemQty, GrossWeight, EBWTotal, AdLsWeight,
     NetBillWeight, StockWeight, CarriageAmount. -->
<body class="pd-body hrm-body" data-pp="grn-info" data-screen="690">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnNew" class="win-btn-tool" onclick="PpGrnInfo.btnNew(this)"><i class="fa fa-eraser"></i> <span><u>R</u>eset</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool" onclick="PpGrnInfo.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="btn334Register" class="win-btn-tool" onclick="PpGrnInfo.btn334Register(this)" data-rpt-own data-rpt="169-InvPartyProcessingGrnInfo.rpt"><i class="fa fa-print"></i> <span>169-Register</span></button>
        <button type="button" id="btnShortCut" class="win-btn-tool" onclick="PpGrnInfo.shortCuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="hrm-caption">Grn History</div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-3">
            <div class="hrm-field"><label for="cmbDateType">Date Type</label><select id="cmbDateType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="GpsNoFrom">GP No From &amp; To</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><input type="text" id="GpsNoFrom" class="win-textbox" data-guard="integer" inputmode="numeric"/></div><div class="hrm-grow"><input type="text" id="GpsNoTo" class="win-textbox" data-guard="integer" inputmode="numeric"/></div></div></div>
            <div class="hrm-field"><label for="cmbRefParty">Reference Party</label><select id="cmbRefParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="GRNfromdate">Date From &amp; To</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><input type="date" id="GRNfromdate" class="win-textbox"/></div><div class="hrm-grow"><input type="date" id="GRNToDate" class="win-textbox"/></div></div></div>
            <div class="hrm-field"><label for="CmbItem">Item Name</label><select id="CmbItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbWarehouseName">Warehouse</label><select id="CmbWarehouseName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtGrnNoFrom">GRN No From &amp; To</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><input type="text" id="txtGrnNoFrom" class="win-textbox" data-guard="integer" inputmode="numeric"/></div><div class="hrm-grow"><input type="text" id="txtGrnNoTo" class="win-textbox" data-guard="integer" inputmode="numeric"/></div></div></div>
            <div class="hrm-field"><label for="CmbSupplier">Stock Party</label><select id="CmbSupplier" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbJobLotName">JobLot</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="CmbJobLotName" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <span class="hrm-lbl">Type</span><div class="hrm-grow"><select id="CmbGrnType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <button type="button" id="btnshow" class="win-btn-action" style="min-width:0;width:auto;padding:0 10px" onclick="PpGrnInfo.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="PpGrnInfo.exportGrid()"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap"><table data-gridbar="GrnInfo:DataGridHistory" id="DataGridHistory"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_grn_info.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
