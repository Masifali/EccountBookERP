<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Stock Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm_reports.css?v=20260929a}"/>
    <style>
        table.hrm-grid .pp-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        table.hrm-grid tr.pp-group td { background: #dfeeee; font-weight: bold; }
        table.hrm-grid tr.pp-group-total td { background: #f3f7f7; font-style: italic; }
        .pp-checks { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<!-- Architecture.WinApp.PartyProcessingReports.frmStockReportPartyProcessing (694) - AutoScrollMinSize 1099 x 634, KeyPreview.
     toolStrip1: Reset | Refresh (Ctrl+R) | Print (its text = the 466_0x template of the report type; hidden without a report type) | ShortCut Keys.
     "Stock Report" caption with Bill Weight Show / Item Wise Stock / Skip Zero (checked).
     groupBox1 "Filters": Date Type | Category | Stock Party / Date From & To | Item | CropYear | JobLot / Item Type | WareHouse |
     Report Type | Show.  grdfrm GridEX: one layout per report type (ItemId hidden, the grouped columns hidden, group totals,
     ItemName a link to the Inventory Transaction report). -->
<body class="pd-body hrm-body" data-pp="stock-report" data-screen="694">
<div class="hrm-form">
    <div class="win-tool-strip">
        <button type="button" id="btnReset" class="win-btn-tool" onclick="PpStockRpt.btnReset(this)"><i class="fa fa-eraser"></i> <span><u>R</u>eset</span></button>
        <button type="button" id="btnRefresh" class="win-btn-tool"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" id="Register" class="win-btn-tool" onclick="PpStockRpt.Register(this)" data-rpt-own><i class="fa fa-print"></i> <span id="RegisterText"><u>P</u>rint</span></button>
        <button type="button" id="btnShortCut" class="win-btn-tool" onclick="PpStockRpt.shortCuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
    </div>
    <div class="hrm-caption"><span>Stock Report</span><span class="pp-checks" style="font:9pt 'Segoe UI',sans-serif">
        <label class="hrm-check"><input type="checkbox" id="chkBillWeightColumnsShow"> Bill Weight Show</label>
        <label class="hrm-check"><input type="checkbox" id="ChkItemWiseStock"> Item Wise Stock</label>
        <label class="hrm-check"><input type="checkbox" id="chkSikeZero" checked> Skip Zero</label></span></div>
    <fieldset class="hrm-group"><legend>Filters</legend>
        <div class="hrm-entry hrm-cols-3">
            <div class="hrm-field"><label for="cmbDateType">Date Type</label><select id="cmbDateType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbCategory">Category</label><select id="cmbCategory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="CmbStockParty">Stock Party</label><select id="CmbStockParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="txtDateFrom">Date From &amp; To</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><input type="date" id="txtDateFrom" class="win-textbox"/></div><div class="hrm-grow"><input type="date" id="txtDateTo" class="win-textbox"/></div></div></div>
            <div class="hrm-field"><label for="cmbItem">Item</label><select id="cmbItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbCropYear">CropYear</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbCropYear" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <span class="hrm-lbl">JobLot</span><div class="hrm-grow"><select id="cmbJobLot" class="win-combo dtcombo" data-dtcombo="single"></select></div></div></div>
            <div class="hrm-field"><label for="cmbItemType">Item Type</label><select id="cmbItemType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbWareHouse">WareHouse</label><select id="cmbWareHouse" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbReportType">Report Type</label><div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbReportType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <button type="button" id="btnshow" class="win-btn-action" style="min-width:0;width:auto;padding:0 10px" onclick="PpStockRpt.btnshow(this)">Show</button></div></div>
        </div>
    </fieldset>
    <div class="hrm-grid-box" id="historyBox">
        <div class="hrm-subcaption"><span>History</span><span class="hrm-bar-tools"><button type="button" class="hrm-bar-btn" title="Grid Control: Export" onclick="PpStockRpt.exportGrid()"><i class="fa fa-file-excel-o"></i> Export</button><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></span></div>
        <div class="hrm-grid-wrap" id="grdWrap"><table id="grdfrm"></table></div>
    </div>
    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_stock_report.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js?v=20260920a}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260929a}"></script>
</body>
</html>
