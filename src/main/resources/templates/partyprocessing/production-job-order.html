<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Production Job Order - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20260928b}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_pp_ppc.css?v=20260930a}"/>
</head>
<!-- Architecture.WinApp.PartyProcessing.ProductionJobOrderPartyProcessing (676, DocumentTypeId 120). tabControl1: Form | History.
     Form: toolStrip1 New | Refresh | Save | Save As | Update | Delete | Print | Attachment | Define Warehouse | ShortCut Keys;
     panel3 caption "Production Job Order" + Is Print Preview; panel4 three columns - x 8: Plan Code & Date, Mannual Report No,
     Stock Party, Ware House, WIP Item (Name / Code); x 366: Other Ref, Plant / Feader (+ define), Production Type (+ define),
     Other Instruction; x 661: Start Date, End Date, Status.
     History: toolStrip2 New | Refresh; panel20 Date From / To, Doc No From / To, Stock Party, Job Order No, Show,
     Doc / Entry / Modify / Approved Date radios; DataGridHistory (Edit, Print, SaveAs). -->
<body class="pd-body hrm-body" data-hrm="pp-production-job-order" th:attr="data-screen=${ppScreen}">
<div class="hrm-form">
    <div class="hrm-tabs" data-tabs="main">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <div class="hrm-tab-page is-active" data-group="main" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnnew" class="win-btn-tool" onclick="PpJo.btnnew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="btnRefresh" class="win-btn-tool" onclick="PpJo.btnRefresh(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
            <button type="button" id="btnsave" class="win-btn-tool" onclick="PpJo.btnsave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="BtnSaveAs" class="win-btn-tool is-hidden" onclick="PpJo.btnSaveAs(this)"><i class="fa fa-files-o"></i> <span><u>S</u>ave As</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" onclick="PpJo.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="BtnDelete" class="win-btn-tool is-hidden" onclick="PpJo.btnDelete(this)"><i class="fa fa-trash"></i> <span><u>D</u>elete</span></button>
            <button type="button" id="Print" class="win-btn-tool" onclick="PpJo.print(this)" data-rpt-skip><i class="fa fa-print"></i> <span><u>P</u>rint</span></button>
            <button type="button" id="btnattachment" class="win-btn-tool" disabled title="Attachments are not ported to the web"><i class="fa fa-paperclip"></i> <span><u>A</u>ttachment</span></button>
            <button type="button" id="btnDefineWarehouse" class="win-btn-tool" disabled title="Opens the Define Warehouse desktop form (not part of this page)"><i class="fa fa-building"></i> <span>Define Warehouse</span></button>
            <button type="button" id="btnshortcutkeys" class="win-btn-tool" onclick="PpJo.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span>Production Job Order</span>
            <span class="ppc-caption-right"><label class="hrm-check"><input type="checkbox" id="chkPrint"> Is Print Preview</label></span></div>
        <div class="hrm-entry hrm-cols-3" style="align-items:start">
            <div class="hrm-field"><label for="txtPlanCode">Plan Code &amp; Date</label>
                <div class="ppc-pair"><input type="text" id="txtPlanCode" class="win-textbox" readonly tabindex="-1"/><input type="date" id="txtPlanDate" class="win-textbox"/></div></div>
            <div class="hrm-field"><label for="txtOtherReference">Other Ref</label><input type="text" id="txtOtherReference" class="win-textbox" autocomplete="off"/></div>
            <div class="hrm-field"><label for="txtstartDate">Start Date</label><input type="date" id="txtstartDate" class="win-textbox"/></div>

            <div class="hrm-field"><label for="txtJobOrderNo">Mannual Report No</label><input type="text" id="txtJobOrderNo" class="win-textbox" autocomplete="off"/></div>
            <div class="hrm-field"><label for="cmbPlantFeader">Plant / Feader</label>
                <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbPlantFeader" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <button type="button" id="btnProductionPlant" class="win-btn-action" style="min-width:0;width:30px;height:23px;padding:0" disabled title="Opens the Define Production Plant desktop form (not part of this page)"><i class="fa fa-plus"></i></button></div></div>
            <div class="hrm-field"><label for="txtEndDate">End Date</label><input type="date" id="txtEndDate" class="win-textbox"/></div>

            <div class="hrm-field"><label for="CmbStockParty">Stock Party</label><select id="CmbStockParty" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field"><label for="cmbProductionType">Production Type</label>
                <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="cmbProductionType" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <button type="button" id="BtnProductionType" class="win-btn-action" style="min-width:0;width:30px;height:23px;padding:0" disabled title="Opens the Define Production Type desktop form (not part of this page)"><i class="fa fa-plus"></i></button></div></div>
            <div class="hrm-field"><label for="cmbStatus">Status</label><select id="cmbStatus" class="win-combo" disabled></select></div>

            <div class="hrm-field"><label for="cmbWareHouse">Ware House</label><select id="cmbWareHouse" class="win-combo dtcombo" data-dtcombo="single"></select></div>
            <div class="hrm-field hrm-span-2"><label for="txtOtherInstruction">Other Instruction</label><textarea id="txtOtherInstruction" class="win-textbox" rows="3"></textarea></div>

            <div class="hrm-field"><label for="CmbWipItem">WIP Item</label>
                <div class="hrm-inline" style="flex-wrap:nowrap"><div class="hrm-grow"><select id="CmbWipItem" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                    <label class="hrm-check"><input type="radio" name="rdItem" id="rdbtnItemName" value="name" checked> Name</label>
                    <label class="hrm-check"><input type="radio" name="rdItem" id="rdbtnItemCode" value="code"> Code</label></div></div>
        </div>
    </div>

    <div class="hrm-tab-page" data-group="main" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="PpJo.btnNewHistory()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefreshHistory" class="win-btn-tool" onclick="PpJo.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span>Refresh</span></button>
        </div>
        <div class="hrm-caption"><span>Job Order History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">Date From</label>
                    <div class="ppc-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use Date From"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">Date To</label>
                    <div class="ppc-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use Date To"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">Doc No From</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">Doc No To</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="CmbStockPartyHistory">Stock Party</label><select id="CmbStockPartyHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobOrderNoHistory">Job Order No</label><select id="CmbJobOrderNoHistory" class="win-combo dtcombo" data-dtcombo="single"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnshowHistory" class="win-btn-action" onclick="PpJo.btnshowHistory(this)">Show</button></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label>&nbsp;</label>
                    <div class="ppc-radios">
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="modify"> Modify Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateMode" value="approved"> Approved Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="hrm-grid-box">
            <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
            <div class="hrm-grid-wrap"><table id="DataGridHistory"></table></div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppc_common.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_pp_job_order.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20260928a}"></script>
<script th:src="@{/build/js/countx_input_guards.js}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260929a}"></script>
</body>
</html>
