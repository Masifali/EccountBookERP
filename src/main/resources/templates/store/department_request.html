<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department Request - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* frmDepartmentRequest designer geometry, 1:1 in px (ClientSize 986 x 582).
           tabControl1 (Alignment Bottom): tabPage1 "Form" / tabPage2 "History", 978 x 553, Padding 2. */
        body { background: #fff; padding-bottom: 36px; }
        .fx-scroll { overflow-x: auto; }
        .fx-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .fx-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .fx-rel { position: relative; }
        .fx-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .fx-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .fx-txt[readonly] { background: #f0f0f0; }
        .fx-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .fx-txt.r { text-align: right; }
        .fx-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dtc { display: flex; align-items: center; gap: 2px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 18px; width: 100%; min-width: 0; padding: 0; }
        .fx-gb { position: absolute; box-sizing: border-box; }
        .fx-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .fx-gb > .fx-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .fx-chk { display: inline-flex; align-items: center; gap: 3px; font-family: Verdana, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .fx-chk input { margin: 0; }
        .fx-teal { background: #008080; position: relative; }
        .fx-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .fx-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .fx-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; color: #000; text-decoration: none; }
        .fx-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .fx-tool:disabled { color: #9a9a9a; cursor: default; }
        .fx-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; }
        .fx-btn { background: #008080; color: #fff; border: 1px solid #005959; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; padding: 0; cursor: pointer; border-radius: 0; height: auto; }
        .fx-btn:hover:not(:disabled) { background: #005959; }
        .fx-lb { background: #d3d3d3; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .fx-grid-host { overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; box-sizing: border-box; }
        .fx-grid-host.win-grid-scroll { max-height: none; }
        .fx-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .fx-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .fx-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .fx-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .fx-gbar { width: 38px; height: 23px; background: transparent; color: #fff; border: 1px solid transparent; font-size: 14px; cursor: default; }
        /* desktop TabControl, Alignment = Bottom */
        .fx-tabs { display: flex; gap: 2px; padding-left: 2px; margin: 0; border-bottom: none; border-top: 1px solid #7a9a9e; background: #f0f0f0; height: 25px; box-sizing: border-box; font-family: Verdana, sans-serif; }
        .fx-tabs .win-tab { border: 1px solid #999; border-top: none; border-radius: 0 0 3px 3px; padding: 3px 12px; font-size: 13px; font-weight: normal; height: 22px; box-sizing: border-box; line-height: 15px; }
        .fx-tabs .win-tab.is-active { top: -1px; height: 24px; background: #fff; color: #000; }
        .fx-modal-box { width: 964px; max-width: 98vw; background: #fff; max-height: 96vh; }
        .fx-modal-box .cx-modal-body { padding: 0; }
    </style>
</head>
<body>
<div class="fx-scroll">
<div class="fx-root" style="width:986px;">

    <div id="rightsNote" class="cx-denied is-hidden" style="margin:0;"></div>

    <!-- ============================================================== tabPage1 "Form" -->
    <div id="tabForm" class="win-tab-panel is-active" style="padding:2px;">

        <!-- panel2 (2,2) 974 x 25 / toolStrip1 -->
        <div class="fx-strip" style="height:25px;">
            <button type="button" class="fx-tool" style="width:61px" onclick="DeptRequest.reset()"><i class="fa fa-plus-circle" style="color:#2e7d32"></i> New</button>
            <button type="button" class="fx-tool" style="width:80px" onclick="DeptRequest.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="fx-tool is-hidden" id="btnUpdate" style="width:82px" onclick="DeptRequest.update()"><i class="fa fa-pencil"></i> Update</button>
            <button type="button" class="fx-tool" id="btnSave" style="width:66px" onclick="DeptRequest.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="fx-tool is-hidden" id="btnDelete" style="width:76px" onclick="DeptRequest.del()"><i class="fa fa-trash"></i> Delete</button>
            <button type="button" class="fx-tool" id="btnPrint451" style="width:98px" onclick="DeptRequest.print()"><i class="fa fa-print"></i> 451-Print</button>
            <button type="button" class="fx-tool" style="width:114px" disabled title="Attachments are not ported"><i class="fa fa-paperclip"></i> Attachment</button>
            <button type="button" class="fx-tool" style="width:126px" disabled title="The shortcut-key popup is not ported"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
            <a href="/modules" class="fx-tool" style="margin-left:auto;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>

        <!-- panel3 (2,27) 974 x 26, RGB(10,110,110) -->
        <div class="fx-teal" style="height:26px;background:rgb(10,110,110);">
            <span class="fx-teal-title" style="left:4px;top:3px;">Department Request</span>
            <span id="lblRecId" class="is-hidden"></span>
            <label class="fx-abs fx-chk" style="left:887px;top:3px;height:20px;color:#fff;"><input type="checkbox" id="ChkBok" checked> Preview</label>
        </div>

        <!-- panel4 (2,53) 974 x 151 -->
        <div class="fx-rel" style="height:151px;">

            <!-- groupBox1 (5,3) 963 x 77 "Main Information" -->
            <div class="fx-gb" style="left:5px;top:3px;width:963px;height:77px;">
                <span class="fx-cap">Main Information</span>
                <label class="fx-abs fx-lbl" for="txtdocno" style="left:5px;top:22px;">Doc No</label>
                <input type="text" id="txtdocno" class="fx-abs fx-txt" style="left:60px;top:18px;width:125px;" readonly tabindex="-1">
                <label class="fx-abs fx-lbl" for="DocDate" style="left:5px;top:50px;">Doc Date</label>
                <input type="date" id="DocDate" class="fx-abs fx-dt" style="left:60px;top:46px;width:125px;">
                <label class="fx-abs fx-lbl" for="cmbDepartmentTo" style="left:187px;top:22px;">Department To</label>
                <select id="cmbDepartmentTo" class="fx-abs fx-cmb win-combo" style="left:291px;top:16px;width:192px;"></select>
                <button type="button" id="button2" class="fx-abs" style="padding:0;left:484px;top:16px;width:27px;height:27px;background:#fff;border:1px solid #7a7a7a;" tabindex="-1" onclick="DeptRequest.defineDepartment()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>
                <label class="fx-abs fx-lbl" for="cmbDepartmentFrom" style="left:187px;top:50px;">Department From</label>
                <select id="cmbDepartmentFrom" class="fx-abs fx-cmb win-combo" style="left:291px;top:44px;width:220px;"></select>
                <label class="fx-abs fx-lbl" for="txtremarks" style="left:514px;top:22px;">Remarks</label>
                <textarea id="txtremarks" class="fx-abs fx-txt" style="left:564px;top:16px;width:392px;height:53px;resize:none;font-size:12px;"></textarea>
            </div>

            <!-- groupBox2 (5,80) 963 x 68 "Detail Information" (Tahoma 8.75pt bold) -->
            <div class="fx-gb" style="left:5px;top:80px;width:963px;height:68px;">
                <span class="fx-cap" style="font-size:12px;">Detail Information</span>
                <label class="fx-abs fx-lbl" for="txtBarcodeReader" style="left:7px;top:17px;">Bar Code No.</label>
                <input type="text" id="txtBarcodeReader" class="fx-abs fx-txt" style="left:6px;top:38px;width:117px;" onkeydown="if(event.key==='Enter'){event.preventDefault();DeptRequest.barcode();}">
                <label class="fx-abs fx-lbl" for="cmbItem" style="left:128px;top:17px;">Item</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:163px;top:15px;height:19px;"><input type="radio" name="srch" id="rdbtnItemName" checked onchange="DeptRequest.searchModeChanged()"> Name</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:219px;top:15px;height:19px;"><input type="radio" name="srch" id="rdbtnItemCode" onchange="DeptRequest.searchModeChanged()"> Code</label>
                <span id="lblStockQty" class="fx-abs fx-lbl is-hidden" style="left:279px;top:17px;">0</span>
                <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:125px;top:36px;width:222px;" onblur="DeptRequest.itemLeave()"></select>
                <label class="fx-abs fx-lbl" for="CmbItemCondition" style="left:348px;top:17px;">Item Condition</label>
                <select id="CmbItemCondition" class="fx-abs fx-cmb win-combo" style="left:348px;top:36px;width:132px;" onblur="DeptRequest.balanceStock()"></select>
                <label class="fx-abs fx-lbl" for="cmbItemUOM" style="left:481px;top:17px;">UOM</label>
                <select id="cmbItemUOM" class="fx-abs fx-cmb win-combo" style="left:481px;top:36px;width:81px;"></select>
                <label class="fx-abs fx-lbl" for="CmbAssetName" style="left:565px;top:17px;">AssetName</label>
                <select id="CmbAssetName" class="fx-abs fx-cmb win-combo" style="left:563px;top:36px;width:174px;"></select>
                <label class="fx-abs fx-lbl" for="txtRequestedQty" style="left:738px;top:17px;">Requested Qty</label>
                <input type="text" id="txtRequestedQty" class="fx-abs fx-txt" style="left:738px;top:38px;width:84px;" onkeypress="return DeptRequest.decimalKey(event)">
                <button type="button" id="Add" class="fx-abs fx-btn" style="left:823px;top:37px;width:35px;height:25px;font-family:Tahoma,sans-serif;" onclick="DeptRequest.add()">+</button>
                <button type="button" id="btnUpdateDetail" class="fx-abs fx-btn is-hidden" style="left:823px;top:37px;width:69px;height:25px;font-family:Tahoma,sans-serif;" onclick="DeptRequest.updateDetail()">Update</button>
                <button type="button" id="btnCancelUpdateDetial" class="fx-abs fx-btn is-hidden" style="left:893px;top:37px;width:63px;height:25px;font-family:Tahoma,sans-serif;" onclick="DeptRequest.resetDetail()">Cancel</button>
            </div>
        </div>

        <!-- panel6 (2,204) 974 x 347: panel5 teal 21 + grdDetail 326 -->
        <div class="fx-teal" style="height:21px;">
            <span class="fx-teal-title" style="left:3px;top:2px;font-size:13px;line-height:17px;">Detail</span>
            <button type="button" class="fx-abs fx-gbar" style="left:933px;top:1px;height:19px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
        </div>
        <div class="fx-grid-host win-grid-scroll" style="height:326px;">
            <table class="win-grid" id="grdDetail"><thead></thead><tbody></tbody></table>
        </div>
    </div>

    <!-- ============================================================== tabPage2 "History" -->
    <div id="tabHistory" class="win-tab-panel" style="padding:2px;">

        <!-- panel8 (2,2) 55 high, teal: btnLoadall toolstrip (white) 31 -->
        <div class="fx-teal" style="height:55px;">
            <div class="fx-strip" style="height:31px;background:#fff;">
                <button type="button" class="fx-tool" style="width:63px;height:28px;" onclick="DeptRequest.newHistory()"><i class="fa fa-plus-circle" style="color:#2e7d32"></i> New</button>
            </div>
        </div>

        <!-- panel11 (2,57) 51 high; groupBox3 (3,-2) 948 x 51 "Filters" -->
        <div class="fx-rel" style="height:51px;">
            <div class="fx-gb" style="left:3px;top:-2px;width:948px;height:51px;">
                <span class="fx-cap">Filters</span>
                <label class="fx-abs fx-lbl" style="left:4px;top:22px;">From Date</label>
                <div class="fx-abs fx-dtc" style="left:67px;top:18px;width:137px;"><input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory"></div>
                <label class="fx-abs fx-lbl" style="left:207px;top:22px;">To Date</label>
                <div class="fx-abs fx-dtc" style="left:256px;top:18px;width:131px;"><input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory"></div>
                <label class="fx-abs fx-lbl" for="txtFromDocNoHistory" style="left:390px;top:22px;">From Doc No</label>
                <input type="text" id="txtFromDocNoHistory" class="fx-abs fx-txt fx-lbl" style="left:469px;top:18px;width:72px;" onkeypress="return DeptRequest.numberKey(event)">
                <label class="fx-abs fx-lbl" for="txtToDocNoHistory" style="left:545px;top:22px;">To Doc No</label>
                <input type="text" id="txtToDocNoHistory" class="fx-abs fx-txt fx-lbl" style="left:614px;top:18px;width:72px;" onkeypress="return DeptRequest.numberKey(event)">
                <button type="button" id="btnshow" class="fx-abs fx-btn win-btn-action" style="left:689px;top:18px;width:60px;height:23px;background:rgb(10,110,110);" onclick="DeptRequest.showHistory(this)">Show</button>
                <label class="fx-abs fx-chk fx-lbl" style="left:763px;top:12px;height:19px;"><input type="radio" name="hdate" id="drdocdate" checked> Doc Date</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:844px;top:12px;height:19px;"><input type="radio" name="hdate" id="rdmodifydate"> Modify Date</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:763px;top:31px;height:19px;"><input type="radio" name="hdate" id="rdentrydate"> Entry Date</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:844px;top:31px;height:19px;"><input type="radio" name="hdate" id="rdapproveddate"> Approved Date</label>
            </div>
        </div>

        <!-- panel7 (2,108) 26 high, teal -->
        <div class="fx-teal" style="height:26px;">
            <span class="fx-teal-title" style="left:3px;top:3px;">Department Request History</span>
            <button type="button" class="fx-abs fx-gbar" style="right:2px;top:1px;width:42px;height:25px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
        </div>

        <!-- DataGridHistory (2,134) fill 189 -->
        <div class="fx-grid-host win-grid-scroll" style="height:189px;">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody></table>
        </div>

        <!-- panel9 (2,323) 22 high, RGB(10,110,110); label14 Tahoma 10pt bold -->
        <div class="fx-teal" style="height:22px;background:rgb(10,110,110);">
            <span class="fx-teal-title" style="left:4px;top:2px;font-size:13px;line-height:17px;">Detail Of Above Selected Row</span>
        </div>

        <!-- DataGridHistoryDetail (2,345) 206 high -->
        <div class="fx-grid-host win-grid-scroll" style="height:206px;">
            <table class="win-grid" id="DataGridHistoryDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <!-- tabControl1 tab headers (Alignment Bottom) -->
    <div class="win-tabs fx-tabs">
        <div class="win-tab is-active" data-tab="tabForm" onclick="DeptRequest.tab('tabForm')">Form</div>
        <div class="win-tab" data-tab="tabHistory" onclick="DeptRequest.tab('tabHistory')">History</div>
    </div>
</div>
</div>

<!-- The page footer with the right-aligned History button is added by countx_store_common.js
     (it switches the tabHistory / tabForm tabs above). -->

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_define_lookups.js?v=20260925f}"></script>
<script th:src="@{/build/js/countx_store_department_request.js?v=20260925d}"></script>
</body>
</html>
