<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Issuance Direct - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* StoreIssuanceDirect designer geometry, 1:1 in px (ClientSize 1178 x 624).
           tabControlGsIssuance (Alignment Bottom): tabPage1 "Form" / tabPage2 "History", 1170 x 595, Padding 3. */
        body { background: #fff; padding-bottom: 36px; }
        .fx-scroll { overflow-x: auto; }
        .fx-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .fx-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .fx-rel { position: relative; }
        .fx-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .fx-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .fx-txt[readonly] { background: #f0f0f0; }
        .fx-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .fx-txt.r { text-align: right; }
        .fx-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dtc { display: flex; align-items: center; gap: 2px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .fx-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 18px; width: 100%; min-width: 0; padding: 0; }
        .fx-gb { position: absolute; box-sizing: border-box; }
        .fx-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .fx-gb > .fx-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .fx-chk { display: inline-flex; align-items: center; gap: 3px; font-family: Verdana, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .fx-chk input { margin: 0; }
        .fx-teal { background: #008080; position: relative; }
        .fx-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .fx-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .fx-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; color: #000; text-decoration: none; }
        .fx-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .fx-tool:disabled { color: #9a9a9a; cursor: default; }
        .fx-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; }
        .fx-btn { background: #008080; color: #fff; border: 1px solid #005959; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; padding: 0; cursor: pointer; border-radius: 0; height: auto; }
        .fx-btn:hover:not(:disabled) { background: #005959; }
        .fx-lb { background: #d3d3d3; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .fx-grid-host { overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; box-sizing: border-box; }
        .fx-grid-host.win-grid-scroll { max-height: none; }
        .fx-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .fx-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .fx-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .fx-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .fx-gbar { width: 38px; height: 23px; background: transparent; color: #fff; border: 1px solid transparent; font-size: 14px; cursor: default; }
        /* desktop TabControl, Alignment = Bottom */
        .fx-tabs { display: flex; gap: 2px; padding-left: 2px; margin: 0; border-bottom: none; border-top: 1px solid #7a9a9e; background: #f0f0f0; height: 25px; box-sizing: border-box; font-family: Verdana, sans-serif; }
        .fx-tabs .win-tab { border: 1px solid #999; border-top: none; border-radius: 0 0 3px 3px; padding: 3px 12px; font-size: 13px; font-weight: normal; height: 22px; box-sizing: border-box; line-height: 15px; }
        .fx-tabs .win-tab.is-active { top: -1px; height: 24px; background: #fff; color: #000; }
        .fx-modal-box { width: 964px; max-width: 98vw; background: #fff; max-height: 96vh; }
        .fx-modal-box .cx-modal-body { padding: 0; }
        #RatesListView.cx-rates { max-height: none; overflow: auto; border: 1px solid #7a7a7a; font-family: Verdana, sans-serif; font-size: 12px; }
    </style>
</head>
<body>
<div class="fx-scroll">
<div class="fx-root" style="width:1178px;">

    <div id="rightsNote" class="cx-denied is-hidden" style="margin:0;"></div>

    <!-- ============================================================== tabPage1 "Form" -->
    <div id="tabForm" class="win-tab-panel is-active" style="padding:3px;">

        <!-- panel3 (0,0) 1164 x 29 / toolStrip1 1164 x 27 -->
        <div style="height:29px;">
            <div class="fx-strip">
                <button type="button" class="fx-tool" style="width:59px" onclick="IssDirect.reset()"><i class="fa fa-plus-circle" style="color:#2e7d32"></i> New</button>
                <button type="button" class="fx-tool" style="width:80px" onclick="IssDirect.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
                <button type="button" class="fx-tool" id="btnSave" style="width:64px" onclick="IssDirect.save()"><i class="fa fa-save"></i> Save</button>
                <button type="button" class="fx-tool is-hidden" id="btnUpdate" style="width:78px" onclick="IssDirect.update()"><i class="fa fa-pencil"></i> Update</button>
                <button type="button" class="fx-tool is-hidden" id="btnDelete" style="width:73px" onclick="IssDirect.remove()"><i class="fa fa-trash"></i> Delete</button>
                <button type="button" class="fx-tool" id="btnPrint" style="width:92px" onclick="IssDirect.print()"><i class="fa fa-print"></i> 452-Print</button>
                <button type="button" class="fx-tool" style="width:115px" disabled title="The voucher view is not ported"><i class="fa fa-file-text-o"></i> 118-Voucher</button>
                <span id="lblVoucher" style="font-family:Verdana,sans-serif;font-size:11px;color:#004d40;padding:0 4px;white-space:nowrap;"></span>
                <button type="button" class="fx-tool" style="width:114px" disabled title="Attachments are not ported"><i class="fa fa-paperclip"></i> Attachment</button>
                <button type="button" class="fx-tool" style="width:126px" disabled title="The shortcut-key popup is not ported"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
                <a href="/modules" class="fx-tool" style="margin-left:auto;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
            </div>
        </div>

        <!-- panel4 (0,29) 1164 x 26, teal -->
        <div class="fx-teal" style="height:26px;">
            <span class="fx-teal-title" style="left:6px;top:2px;">Store Issuance Direct (Consumption)</span>
            <span id="lblRecId" class="is-hidden"></span>
            <!-- BtnStoreReturnLink (866,1) 144 x 25 "Add Replacement" with ChkStoreReturnLink (869,7) on it -->
            <button type="button" class="fx-abs" style="left:866px;top:1px;width:144px;height:25px;background:#fff;color:#00f;border:1px solid #000;font-family:Verdana,sans-serif;font-size:12px;font-weight:bold;text-align:right;padding:0 4px;cursor:pointer;"
                    onclick="window.open('/store/store-return','_blank')">Add Replacement</button>
            <input type="checkbox" id="ChkStoreReturnLink" class="fx-abs" style="left:869px;top:7px;width:13px;height:13px;" checked title="Open Store Return after saving">
            <!-- ChkPrintPreview "Print Preview" (1039,4) -->
            <label class="fx-abs fx-chk" style="left:1039px;top:4px;height:20px;color:#fff;"><input type="checkbox" id="ChkPrintPreview" checked> Print Preview</label>
        </div>

        <!-- panel5 (0,55) 1164 x 228, white -->
        <div class="fx-rel" style="height:228px;">

            <!-- groupBox1 (4,1) 889 x 65 "Main" -->
            <div class="fx-gb" style="left:4px;top:1px;width:889px;height:65px;">
                <span class="fx-cap">Main</span>
                <label class="fx-abs fx-lbl" for="txtDocNo" style="left:4px;top:17px;">Doc No</label>
                <input type="text" id="txtDocNo" class="fx-abs fx-txt" style="left:80px;top:13px;width:75px;" readonly tabindex="-1">
                <label class="fx-abs fx-lbl" for="txtBranchSrNo" style="left:4px;top:42px;">Branch Sr No</label>
                <input type="text" id="txtBranchSrNo" class="fx-abs fx-txt" style="left:80px;top:38px;width:75px;" readonly tabindex="-1">
                <label class="fx-abs fx-lbl" for="txtDocdate" style="left:160px;top:17px;">Doc Date</label>
                <input type="date" id="txtDocdate" class="fx-abs fx-dt" style="left:229px;top:13px;width:140px;" onchange="IssDirect.docDateLeave()">
                <label class="fx-abs fx-lbl" for="txtManualNo" style="left:160px;top:42px;">Manual No</label>
                <input type="text" id="txtManualNo" class="fx-abs fx-txt" style="left:229px;top:38px;width:140px;">
                <label class="fx-abs fx-lbl" for="txtRemarks" style="left:372px;top:17px;">Remarks</label>
                <textarea id="txtRemarks" class="fx-abs fx-txt" style="left:430px;top:13px;width:455px;height:48px;resize:none;"></textarea>
            </div>

            <!-- groupBox2 (4,67) 889 x 158 "Detail" -->
            <div class="fx-gb" style="left:4px;top:67px;width:889px;height:158px;">
                <span class="fx-cap">Detail</span>
                <!-- row 1 -->
                <label class="fx-abs fx-lbl" style="left:5px;top:18px;">Item</label>
                <div class="fx-abs" style="left:32px;top:12px;width:129px;height:26px;">
                    <label class="fx-abs fx-chk fx-lbl" style="left:3px;top:4px;height:19px;"><input type="radio" name="catType" id="RadCategory" checked onchange="IssDirect.catTypeChanged()"> Category</label>
                    <label class="fx-abs fx-chk fx-lbl" style="left:73px;top:4px;height:19px;"><input type="radio" name="catType" id="RadType" onchange="IssDirect.catTypeChanged()"> Type</label>
                </div>
                <select id="CmbCategory" class="fx-abs fx-cmb win-combo" style="left:5px;top:37px;width:160px;" onchange="IssDirect.categoryLeave()"></select>
                <label class="fx-abs fx-lbl" for="txtBarcodeReader" style="left:164px;top:18px;">BCN</label>
                <input type="text" id="txtBarcodeReader" class="fx-abs fx-txt" style="left:166px;top:39px;width:41px;" onkeydown="if(event.key==='Enter'){event.preventDefault();IssDirect.barcode();}">
                <label class="fx-abs fx-lbl" for="cmbItem" style="left:209px;top:18px;">Item</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:242px;top:16px;height:19px;"><input type="radio" name="search" id="rdSearchByName" checked onchange="IssDirect.itemBind()"> Name</label>
                <label class="fx-abs fx-chk fx-lbl" style="left:299px;top:16px;height:19px;"><input type="radio" name="search" id="rdSearchByCode" onchange="IssDirect.itemBind()"> Code</label>
                <select id="cmbItem" class="fx-abs fx-cmb win-combo" style="left:208px;top:37px;width:200px;" onchange="IssDirect.itemLeave()"></select>
                <label class="fx-abs fx-lbl" for="txtBalanceQty" style="left:420px;top:8px;width:59px;text-align:center;white-space:normal;">Available Stock Qty</label>
                <input type="text" id="txtBalanceQty" class="fx-abs fx-txt r" style="left:409px;top:39px;width:81px;" readonly>
                <label class="fx-abs fx-lbl" for="CmbWarehouse" style="left:491px;top:18px;">Warehouse</label>
                <select id="CmbWarehouse" class="fx-abs fx-cmb win-combo" style="left:491px;top:37px;width:196px;" onchange="IssDirect.warehouseLeave()"></select>
                <label class="fx-abs fx-lbl" for="CmbRackName" style="left:689px;top:18px;">Rack Name</label>
                <select id="CmbRackName" class="fx-abs fx-cmb win-combo" style="left:689px;top:37px;width:196px;" onchange="IssDirect.rackChanged()"></select>
                <!-- row 2 -->
                <label class="fx-abs fx-lbl" for="CmbItemCondition" style="left:5px;top:65px;">Condition</label>
                <select id="CmbItemCondition" class="fx-abs fx-cmb win-combo" style="left:5px;top:82px;width:129px;" onchange="IssDirect.conditionLeave()"></select>
                <label class="fx-abs fx-lbl" for="cmbUOM" style="left:136px;top:65px;">UOM</label>
                <select id="cmbUOM" class="fx-abs fx-cmb win-combo" style="left:136px;top:82px;width:90px;"></select>
                <label class="fx-abs fx-lbl" for="txtItemQty" style="left:228px;top:65px;">Item Qty</label>
                <input type="text" id="txtItemQty" class="fx-abs fx-txt r" style="left:228px;top:84px;width:80px;" oninput="IssDirect.amount()">
                <label class="fx-abs fx-lbl" for="txtItemRate" style="left:309px;top:65px;">Item Rate</label>
                <input type="text" id="txtItemRate" class="fx-abs fx-txt r" style="left:309px;top:84px;width:80px;" readonly tabindex="-1">
                <label class="fx-abs fx-lbl" for="txtItemAmount" style="left:390px;top:65px;">Item Amount</label>
                <input type="text" id="txtItemAmount" class="fx-abs fx-txt r" style="left:390px;top:84px;width:100px;" readonly>
                <label class="fx-abs fx-lbl" for="CmbDepartment" style="left:491px;top:65px;">Department</label>
                <select id="CmbDepartment" class="fx-abs fx-cmb win-combo" style="left:491px;top:82px;width:170px;"></select>
                <button type="button" id="btnDepartment" class="fx-abs" style="padding:0;left:661px;top:82px;width:27px;height:26px;background:#fff;border:1px solid #7a7a7a;" tabindex="-1" onclick="IssDirect.defineDepartment()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>
                <label class="fx-abs fx-lbl" for="cmbAssetsRef" style="left:689px;top:65px;">Assets Ref</label>
                <select id="cmbAssetsRef" class="fx-abs fx-cmb win-combo" style="left:689px;top:82px;width:170px;"></select>
                <button type="button" id="btnAssetDefine" class="fx-abs" style="padding:0;left:860px;top:82px;width:25px;height:26px;background:#fff;border:1px solid #7a7a7a;" tabindex="-1" onclick="IssDirect.defineAsset()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>
                <!-- row 3 -->
                <label class="fx-abs fx-lbl" for="txtRemarksDetail" style="left:2px;top:111px;">Remarks</label>
                <input type="text" id="txtRemarksDetail" class="fx-abs fx-txt" style="left:5px;top:130px;width:280px;">
                <label class="fx-abs fx-lbl" for="CmbCategory1" style="left:286px;top:111px;">Category-I</label>
                <select id="CmbCategory1" class="fx-abs fx-cmb win-combo" style="left:286px;top:128px;width:160px;" onchange="IssDirect.category1Leave()"></select>
                <label class="fx-abs fx-lbl" for="CmbInvoiceNo" style="left:447px;top:111px;">Schedule / Invoice No</label>
                <select id="CmbInvoiceNo" class="fx-abs fx-cmb win-combo" style="left:447px;top:128px;width:140px;" disabled></select>
                <label class="fx-abs fx-lbl" for="cmbDrAc" style="left:588px;top:111px;">Debit Ac</label>
                <select id="cmbDrAc" class="fx-abs fx-cmb win-combo" style="left:588px;top:128px;width:196px;"></select>
                <button type="button" id="btnCancelDetail" class="fx-abs fx-btn is-hidden" style="left:785px;top:109px;width:65px;height:22px;font-size:12px;" onclick="IssDirect.resetDetail()">Cancel</button>
                <button type="button" id="Add" class="fx-abs fx-btn" style="left:785px;top:130px;width:38px;height:23px;" onclick="IssDirect.add()">+</button>
                <button type="button" id="btnUpdateDetail" class="fx-abs fx-btn is-hidden" style="left:785px;top:130px;width:65px;height:23px;font-size:12px;" onclick="IssDirect.updateDetail()">Update</button>
            </div>

            <!-- label21 (897,3) 261 x 23 + RatesListView (897,26) 261 x 199 -->
            <div class="fx-abs" style="left:897px;top:3px;width:261px;height:23px;border:1px solid #000;color:#008080;font-family:Tahoma,sans-serif;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;">Last Issuance Information (3 Rows)</div>
            <div class="fx-abs cx-rates" id="RatesListView" style="left:897px;top:26px;width:261px;height:199px;"></div>
        </div>

        <!-- panel6 (0,283) 1164 x 306: panel8 teal 26 + grdDetail 280 -->
        <div class="fx-teal" style="height:26px;">
            <span class="fx-teal-title" style="left:6px;top:2px;">Detail</span>
            <button type="button" class="fx-abs fx-gbar" style="left:1120px;top:1px;width:39px;height:22px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
        </div>
        <div class="fx-grid-host win-grid-scroll" style="height:280px;">
            <table class="win-grid" id="grdDetail"><thead></thead><tbody></tbody></table>
        </div>
    </div>

    <!-- ============================================================== tabPage2 "History" -->
    <div id="tabHistory" class="win-tab-panel" style="padding:3px;">

        <!-- panel7 (3,3) 1164 x 48, teal: toolStrip2 (white) 25 + label4 (3,26) -->
        <div class="fx-teal" style="height:48px;">
            <div class="fx-strip" style="height:25px;background:#fff;">
                <button type="button" class="fx-tool" style="width:55px;height:22px;" onclick="IssDirect.newHistory()"><i class="fa fa-plus-circle" style="color:#2e7d32"></i> New</button>
            </div>
            <span class="fx-teal-title" style="left:3px;top:26px;">History</span>
        </div>

        <!-- panel10 (3,51) 1164 x 54; groupBox3 (7,2) 789 x 47 "Filters" -->
        <div class="fx-rel" style="height:54px;">
            <div class="fx-gb" style="left:7px;top:2px;width:789px;height:47px;">
                <span class="fx-cap">Filters</span>
                <label class="fx-abs fx-lbl" style="left:3px;top:20px;">From Date</label>
                <div class="fx-abs fx-dtc" style="left:69px;top:16px;width:142px;"><input type="checkbox" id="chkFromDate" checked><input type="date" id="FromDateHistory"></div>
                <label class="fx-abs fx-lbl" style="left:214px;top:20px;">To Date</label>
                <div class="fx-abs fx-dtc" style="left:262px;top:16px;width:142px;"><input type="checkbox" id="chkToDate" checked><input type="date" id="ToDateHistory"></div>
                <label class="fx-abs fx-lbl" for="FromDocNoHistory" style="left:408px;top:20px;">From Doc No</label>
                <input type="text" id="FromDocNoHistory" class="fx-abs fx-txt" style="left:489px;top:16px;width:78px;" inputmode="numeric">
                <label class="fx-abs fx-lbl" for="ToDocNoHistory" style="left:571px;top:20px;">To Doc No</label>
                <input type="text" id="ToDocNoHistory" class="fx-abs fx-txt" style="left:638px;top:16px;width:78px;" inputmode="numeric">
                <button type="button" id="btnShowHistory" class="fx-abs fx-btn win-btn-action" style="left:718px;top:14px;width:62px;height:26px;" onclick="IssDirect.showHistory(this)">Show</button>
            </div>
        </div>

        <!-- panel9 (3,105) 1164 x 25, teal -->
        <div class="fx-teal" style="height:25px;">
            <span class="fx-teal-title" style="left:3px;top:3px;">Filtered Records</span>
            <button type="button" class="fx-abs fx-gbar" style="left:1122px;top:1px;width:37px;height:21px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
        </div>

        <!-- DataGridHistory (3,130) 1164 x 254 -->
        <div class="fx-grid-host win-grid-scroll" style="height:254px;">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody></table>
        </div>

        <!-- panel12 (3,384) 1164 x 23, teal; label20 (2,1) Tahoma 10pt bold -->
        <div class="fx-teal" style="height:23px;">
            <span class="fx-teal-title" style="left:2px;top:1px;font-size:13px;line-height:17px;">Detail Of Above Selected Row</span>
        </div>

        <!-- grddetailofmain (3,407) 1164 x 185 -->
        <div class="fx-grid-host win-grid-scroll" style="height:185px;">
            <table class="win-grid" id="grddetailofmain"><thead></thead><tbody></tbody></table>
        </div>
    </div>

    <!-- tabControlGsIssuance tab headers (Alignment Bottom) -->
    <div class="win-tabs fx-tabs">
        <div class="win-tab is-active" data-tab="tabForm" onclick="IssDirect.tab('tabForm')">Form</div>
        <div class="win-tab" data-tab="tabHistory" onclick="IssDirect.tab('tabHistory')">History</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" id="btnFooterHistory" onclick="IssDirect.tab('tabHistory'); IssDirect.showHistory();"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_define_lookups.js?v=20260925f}"></script>
<script th:src="@{/build/js/countx_store_issuance_direct.js?v=20260925d}"></script>
</body>
</html>
