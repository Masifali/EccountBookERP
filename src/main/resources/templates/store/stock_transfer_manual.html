<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Transfer Manual - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* frmStockTransferManual designer geometry, 1:1 in px (ClientSize 964 x 661).
           tabControl1 (Alignment Bottom) fills the form; each TabPage is (4,4) 956 x 632 with Padding 2.
           tabControl2 (tabs on top: Detail / Other Charges) holds the two grids. */
        body { background: #fff; padding-bottom: 36px; }
        .wf-scroll { overflow-x: auto; }
        .wf-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .wf-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .wf-rel { position: relative; }
        .wf-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .wf-lbl-ml { white-space: normal; }
        .wf-grey { background: #f0f0f0; font-family: "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 13px; display: flex; align-items: center; padding-left: 3px; white-space: nowrap; }
        .wf-ctr { justify-content: center; text-align: center; }
        .wf-op { font-family: Verdana, sans-serif; font-size: 15px; font-weight: bold; line-height: 18px; }
        .wf-txt { box-sizing: border-box; font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .wf-txt[readonly] { background: #f0f0f0; }
        .wf-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .wf-txt.r { text-align: right; }
        .wf-txt.big { font-size: 16px; font-weight: bold; height: 27px; }
        .wf-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .wf-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 22px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .wf-dtc { display: flex; align-items: center; gap: 2px; height: 22px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .wf-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 18px; width: 100%; min-width: 0; padding: 0; }
        .wf-gb { position: absolute; box-sizing: border-box; background: #fff; }
        .wf-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .wf-gb > .wf-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .wf-radio, .wf-check { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; white-space: nowrap; }
        .wf-radio input, .wf-check input { margin: 0; }
        .wf-check-w { color: #fff; font-family: Verdana, sans-serif; font-size: 13px; }
        .wf-teal { background: #008080; position: relative; }
        .wf-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .wf-teal-sub { position: absolute; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 16px; }
        .wf-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .wf-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 5px; cursor: pointer; box-sizing: border-box; white-space: nowrap; color: #000; text-decoration: none; }
        .wf-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .wf-tool:disabled { color: #9a9a9a; cursor: default; }
        .wf-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; }
        .wf-exit { margin-left: auto; color: #004d40; font-size: 11px; font-weight: bold; }
        .wf-gbar { width: 41px; height: 21px; border: 1px solid transparent; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
        .wf-btn { background: #008080; color: #fff; border: 1px solid #005959; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; }
        .wf-grid.win-grid-scroll { overflow: auto; background: #fff; border: 1px solid #9eb6ce; box-sizing: border-box; max-height: none; max-width: none; }
        .wf-grid .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .wf-grid .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .wf-grid .win-grid td { border: 1px solid #d5e1f0; }
        .wf-grid .win-grid tbody tr:hover { background: #fff0cf; }
        .wf-grid .win-grid tfoot td { font-weight: bold; background: #eef4fb; }
        .wf-tabctl { border: 1px solid #a0a0a0; background: #fff; box-sizing: border-box; }
        .wf-tabs { display: flex; gap: 0; padding-left: 2px; border-top: 1px solid #a0a0a0; background: #f0f0f0; height: 24px; }
        .wf-tabs .win-tab { width: 58px; text-align: center; padding: 3px 0; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13px; font-weight: normal; background: #f0f0f0; border: 1px solid #a0a0a0; border-top: none; border-radius: 0 0 3px 3px; color: #000; }
        .wf-tabs .win-tab.is-active { background: #fff; top: -1px; }
        .wf-ms { position: absolute; }
        .wf-ms .wf-ms-list { position: absolute; top: 100%; left: 0; z-index: 20; background: #fff; border: 1px solid #888; max-height: 200px; overflow: auto; min-width: 100%; display: none; }
        .wf-ms.is-open .wf-ms-list { display: block; }
        .wf-ms .wf-ms-list label { display: block; padding: 2px 6px; white-space: nowrap; font-size: 12px; }
        .wf-ms .wf-txt { cursor: pointer; background: #fff; width: 100%; height: 26px; }
        .wf-root { width: 964px; }
        .st-page { position: relative; margin-left: 4px; width: 956px; padding: 2px; box-sizing: border-box; background: #fff; }
        .st-tabs2 { height: 25px; display: flex; align-items: flex-end; padding-left: 2px; border-bottom: 1px solid #a0a0a0; box-sizing: border-box; }
        .st-tabs2 .win-tab { height: 22px; line-height: 20px; padding: 0 10px; border: 1px solid #a0a0a0; border-bottom: none; border-radius: 0; background: #f0f0f0; font-family: Verdana, sans-serif; font-size: 13px; font-weight: normal; color: #000; position: relative; top: 1px; }
        .st-tabs2 .win-tab.is-active { background: #fff; height: 24px; }
        .st-lbl8 { font-family: Verdana, sans-serif; font-size: 11px; }
        .st-gb-cap { font-family: Verdana, sans-serif; font-size: 11px; }
    </style>
</head>
<body>
<div class="wf-scroll">
<div class="wf-root wf-tabctl">

<!-- ======================================================================= tabPage1 "Form" -->
<div id="tabForm" class="win-tab-panel is-active st-page">

    <!-- panel2 (2,2) 952 x 28: toolStrip1 (0,0) 799 x 27, BackColor White, Dock None -->
    <div style="height:28px;">
        <div class="wf-strip" style="width:799px;background:#fff;border-bottom:none;">
            <button type="button" class="wf-tool" id="btnnew" onclick="StockTrM.btnNew()"><i class="fa fa-file-o"></i> New</button>
            <button type="button" class="wf-tool" id="btnRefresh" onclick="StockTrM.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="wf-tool is-hidden" id="btnupdate" onclick="StockTrM.update()"><i class="fa fa-refresh"></i> Update</button>
            <button type="button" class="wf-tool" id="btnsave" onclick="StockTrM.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="wf-tool is-hidden" id="btnDelete" onclick="StockTrM.del()"><i class="fa fa-trash"></i> Delete</button>
            <button type="button" class="wf-tool" id="btnprint" onclick="StockTrM.print()"><i class="fa fa-print"></i> 407-Print</button>
            <button type="button" class="wf-tool" id="btnAttachment" disabled title="Attachments are not ported to the web page"><i class="fa fa-paperclip"></i> Attachment</button>
            <button type="button" class="wf-tool" id="btnLoadInvoices" onclick="StockTrM.openLoader()"><i class="fa fa-download"></i> Loader</button>
            <button type="button" class="wf-tool" id="btnGenerateRate" onclick="StockTrM.generateRate()"><i class="fa fa-calculator"></i> Generate Rate</button>
            <a href="/modules" class="wf-tool wf-exit"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
    </div>

    <!-- panel4 (2,30) 952 x 285 -->
    <div class="wf-rel" style="height:285px;">
        <!-- panel12 (0,0) 952 x 29 teal -->
        <div class="wf-teal" style="height:29px;">
            <span class="wf-teal-title" style="left:5px;top:3px;">Stock Transfer</span>
            <span id="lblRecId" style="display:none;">&nbsp;</span>
            <label class="wf-abs wf-check wf-check-w" style="left:863px;top:5px;width:84px;height:20px;"><input type="checkbox" id="ChkBoxPrintPreview"> Preview</label>
        </div>

        <!-- groupBox1 (4,34) 936 x 96 "Main" -->
        <div class="wf-gb" style="left:4px;top:34px;width:936px;height:96px;">
            <span class="wf-cap st-gb-cap">Main</span>
            <label class="wf-abs wf-lbl" for="txtdocno" style="left:4px;top:19px;">Doc No</label>
            <input type="text" id="txtdocno" class="wf-abs wf-txt" style="left:60px;top:15px;width:111px;background:#fff;" readonly tabindex="-1">
            <label class="wf-abs wf-lbl" for="DocDate" style="left:4px;top:47px;">Doc Date</label>
            <input type="date" id="DocDate" class="wf-abs wf-dt" style="left:60px;top:43px;width:111px;">
            <label class="wf-abs wf-lbl" for="txtRemarksHead" style="left:4px;top:72px;">Remarks</label>
            <input type="text" id="txtRemarksHead" class="wf-abs wf-txt" style="left:60px;top:68px;width:387px;">
            <label class="wf-abs wf-lbl" for="CmbTransferType" style="left:175px;top:19px;">Trans.Type</label>
            <select id="CmbTransferType" class="wf-abs wf-cmb win-combo" style="left:238px;top:13px;width:209px;"></select>
            <label class="wf-abs wf-lbl" for="txtWorkingReportNo" style="left:175px;top:47px;">ReportNo</label>
            <input type="text" id="txtWorkingReportNo" class="wf-abs wf-txt" style="left:238px;top:43px;width:209px;">
            <label class="wf-abs wf-lbl" for="cmbGatePass" style="left:451px;top:19px;">Gate Pass#</label>
            <input type="text" id="cmbGatePass" class="wf-abs wf-txt" style="left:541px;top:15px;width:114px;">
            <label class="wf-abs wf-lbl" for="cmbTicketNo" style="left:451px;top:47px;">Ticket No#</label>
            <input type="text" id="cmbTicketNo" class="wf-abs wf-txt" style="left:541px;top:43px;width:114px;">
            <label class="wf-abs wf-lbl" for="txtHeadNetWeight" style="left:451px;top:72px;">Factory Weight</label>
            <input type="text" id="txtHeadNetWeight" class="wf-abs wf-txt r" style="left:541px;top:68px;width:114px;">
        </div>

        <!-- groupBox2 (4,131) 936 x 150 "Detail" -->
        <div class="wf-gb" style="left:4px;top:131px;width:936px;height:150px;">
            <span class="wf-cap st-gb-cap">Detail</span>
            <label class="wf-abs wf-lbl" for="CmbWareHouseFrom" style="left:3px;top:15px;">WareHouse From</label>
            <select id="CmbWareHouseFrom" class="wf-abs wf-cmb win-combo" style="left:3px;top:31px;width:171px;" onchange="StockTrM.stockAndRate()"></select>
            <label class="wf-abs wf-lbl" for="cmbWareHouseTo" style="left:176px;top:15px;">WareHouse To</label>
            <select id="cmbWareHouseTo" class="wf-abs wf-cmb win-combo" style="left:176px;top:31px;width:176px;"></select>
            <label class="wf-abs wf-lbl" for="cmbJobLot" style="left:354px;top:15px;">Job Lot From</label>
            <select id="cmbJobLot" class="wf-abs wf-cmb win-combo" style="left:354px;top:31px;width:145px;" onchange="StockTrM.stockAndRate()"></select>
            <label class="wf-abs wf-lbl" for="CmbJobLotTo" style="left:501px;top:15px;">Job Lot To</label>
            <select id="CmbJobLotTo" class="wf-abs wf-cmb win-combo" style="left:501px;top:31px;width:146px;" onchange="StockTrM.stockAndRate()"></select>
            <label class="wf-abs wf-lbl" for="cmbCropYear" style="left:649px;top:15px;">Crop Year</label>
            <select id="cmbCropYear" class="wf-abs wf-cmb win-combo" style="left:649px;top:31px;width:89px;" onchange="StockTrM.stockAndRate()"></select>
            <label class="wf-abs wf-lbl" for="cmbItemName" style="left:739px;top:15px;">Item Name</label>
            <select id="cmbItemName" class="wf-abs wf-cmb win-combo" style="left:739px;top:31px;width:192px;" onchange="StockTrM.itemChanged()"></select>

            <label class="wf-abs wf-lbl" for="cmbPackingType" style="left:3px;top:61px;">Packing Type</label>
            <select id="cmbPackingType" class="wf-abs wf-cmb win-combo" style="left:3px;top:77px;width:97px;"></select>
            <label class="wf-abs wf-lbl" for="CmbPackUom" style="left:99px;top:61px;">Pack UOM</label>
            <select id="CmbPackUom" class="wf-abs wf-cmb win-combo" style="left:102px;top:77px;width:70px;" onchange="StockTrM.qtyChanged()"></select>
            <label class="wf-abs wf-lbl" for="txtQty" style="left:176px;top:61px;">Qty</label>
            <input type="text" id="txtQty" class="wf-abs wf-txt r" style="left:176px;top:79px;width:68px;" oninput="StockTrM.qtyChanged()">
            <label class="wf-abs wf-lbl" for="txtGrossWeight" style="left:252px;top:61px;">Gross Weight</label>
            <input type="text" id="txtGrossWeight" class="wf-abs wf-txt r" style="left:247px;top:79px;width:105px;" oninput="StockTrM.weightCalc()">
            <label class="wf-abs wf-lbl" for="txtEbUnit" style="left:353px;top:61px;">EbUnit</label>
            <input type="text" id="txtEbUnit" class="wf-abs wf-txt r" style="left:354px;top:79px;width:63px;" value="0" oninput="StockTrM.weightCalc()">
            <label class="wf-abs wf-lbl" for="txtEbTotal" style="left:417px;top:61px;">EbTotal</label>
            <input type="text" id="txtEbTotal" class="wf-abs wf-txt r" style="left:418px;top:79px;width:81px;" value="0" readonly tabindex="-1">
            <label class="wf-abs wf-lbl" for="txtAdLsWeight" style="left:501px;top:61px;">Ad/Ls Wt</label>
            <input type="text" id="txtAdLsWeight" class="wf-abs wf-txt r" style="left:501px;top:79px;width:56px;" value="0" oninput="StockTrM.weightCalc()">
            <label class="wf-abs wf-lbl" for="txtDetailNetWeight" style="left:559px;top:61px;">Stock Weight</label>
            <input type="text" id="txtDetailNetWeight" class="wf-abs wf-txt r" style="left:559px;top:79px;width:88px;" readonly tabindex="-1">
            <label class="wf-abs wf-lbl" for="txtAvailableStock" style="left:648px;top:61px;">Available Stock</label>
            <input type="text" id="txtAvailableStock" class="wf-abs wf-txt r" style="left:649px;top:79px;width:89px;background:#fff;" readonly tabindex="-1">
            <label class="wf-abs wf-lbl fin is-hidden" id="lblAvgRate" for="txtAvgRate" style="left:739px;top:61px;">Avg Rate</label>
            <input type="text" id="txtAvgRate" class="wf-abs wf-txt r fin is-hidden" style="left:739px;top:79px;width:88px;" value="0" oninput="StockTrM.avgAmount()">
            <label class="wf-abs wf-lbl fin is-hidden" id="lblAmount" for="txtAmount" style="left:828px;top:61px;">Amount</label>
            <input type="text" id="txtAmount" class="wf-abs wf-txt r fin is-hidden" style="left:828px;top:79px;width:103px;" readonly tabindex="-1">

            <label class="wf-abs wf-lbl" for="txtRemarksDetail" style="left:3px;top:106px;">Remarks</label>
            <input type="text" id="txtRemarksDetail" class="wf-abs wf-txt" style="left:3px;top:122px;width:796px;">
            <button type="button" class="wf-abs wf-btn" id="btnplus" style="left:802px;top:120px;width:39px;height:26px;font-size:12px;" onclick="StockTrM.add()">+</button>
            <button type="button" class="wf-abs wf-btn is-hidden" id="btnUpdateDetail" style="left:802px;top:120px;width:64px;height:26px;font-size:12px;" onclick="StockTrM.updateDetail()">Update</button>
            <button type="button" class="wf-abs wf-btn is-hidden" id="btnCancelUpdateDetial" style="left:869px;top:120px;width:62px;height:26px;font-size:12px;" onclick="StockTrM.cancelDetail()">Cancel</button>
        </div>
    </div>

    <!-- panel6 / tabControl2 (2,315) Fill 952 x 315 -->
    <div class="st-tabs2">
        <div class="win-tab is-active" data-sub="tabPage3" onclick="StockTrM.subTab('tabPage3')">Detail</div>
        <div class="win-tab is-hidden" id="tabHeadOther" data-sub="tabPage4" onclick="StockTrM.subTab('tabPage4')">Other Charges</div>
    </div>
    <div style="padding:3px 4px 4px 4px;border:1px solid #a0a0a0;border-top:none;">
        <!-- tabPage3 "Detail" (4,25) 944 x 286, Padding 3 -->
        <div id="tabPage3" class="win-sub-panel">
            <!-- panel11 (3,3) 938 x 26 teal -->
            <div class="wf-teal" style="height:26px;">
                <span class="wf-teal-sub" style="left:5px;top:5px;">Detail</span>
                <span class="wf-abs" style="left:509px;top:3px;width:25px;height:23px;background:#fff;display:flex;align-items:center;justify-content:center;color:#008080;font-size:14px;" title="Click to 'Update Same In All Rows' Button To Update Checked Column (Warehouse or JobLot) In All rows"><i class="fa fa-info-circle"></i></span>
                <label class="wf-abs wf-check" style="left:543px;top:5px;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;"><input type="checkbox" id="chkUpdateWareHouse"> WareHouse</label>
                <label class="wf-abs wf-check" style="left:636px;top:5px;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;"><input type="checkbox" id="chkUpdateJobLot"> JobLot</label>
                <button type="button" class="wf-abs" id="BtnSameUpdateWarehouse" style="left:703px;top:3px;width:188px;height:21px;background:#004040;color:#fff;border:1px solid #002a2a;font-family:Verdana,sans-serif;font-size:12px;font-weight:bold;cursor:pointer;padding:0;" onclick="StockTrM.sameInAllRows()">Update Same In All Rows</button>
                <button type="button" class="wf-abs wf-gbar" id="ctrlGrdBar5" style="left:894px;top:1px;width:40px;height:24px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
            </div>
            <!-- panel5 / grd Fill, designer 938 x 254 -->
            <div class="wf-grid win-grid-scroll" style="height:calc(100vh - 440px);min-height:254px;"><table class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
        <!-- tabPage4 "Other Charges" (4,25) 944 x 286, Padding 3 -->
        <div id="tabPage4" class="win-sub-panel is-hidden">
            <!-- panel13 (3,3) 938 x 26 teal -->
            <div class="wf-teal" style="height:26px;">
                <span class="wf-teal-sub" style="left:5px;top:5px;">Other Charges Detail</span>
                <button type="button" class="wf-abs wf-gbar" id="ctrlGrdBar4" style="left:890px;top:0;width:45px;height:25px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
            </div>
            <!-- panel14 / grdOtherCharges Fill, designer 938 x 254 -->
            <div class="wf-grid win-grid-scroll" style="height:calc(100vh - 440px);min-height:254px;"><table class="win-grid" id="grdOtherCharges"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
    </div>
</div>

<!-- ==================================================================== tabPage2 "History" -->
<div id="tabHistory" class="win-tab-panel st-page">
    <!-- toolStrip2 (0,0) 952 x 27 -->
    <div class="wf-strip">
        <button type="button" class="wf-tool" id="btnNewHistory" onclick="StockTrM.historyReset()"><i class="fa fa-file-o"></i> Reset</button>
        <button type="button" class="wf-tool" id="btnRefreshHistory" onclick="StockTrM.historyRefresh()"><i class="fa fa-repeat"></i> Refresh</button>
    </div>
    <!-- panel10 (0,27) 952 x 27 teal -->
    <div class="wf-teal" style="height:27px;"><span class="wf-teal-title" style="left:4px;top:3px;">Stock Transfer&nbsp; History</span></div>
    <!-- panel16 (0,54) 952 x 67: groupBox3 (3,1) 944 x 66 "Filters" -->
    <div class="wf-rel" style="height:67px;">
        <div class="wf-gb" style="left:3px;top:1px;width:944px;height:66px;">
            <span class="wf-cap">Filters</span>
            <label class="wf-abs wf-lbl" style="left:5px;top:20px;">From Date</label>
            <div class="wf-abs wf-dtc" style="left:5px;top:38px;width:128px;height:23px;"><input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory"></div>
            <label class="wf-abs wf-lbl" style="left:136px;top:19px;">To Date</label>
            <div class="wf-abs wf-dtc" style="left:136px;top:38px;width:131px;height:23px;"><input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory"></div>
