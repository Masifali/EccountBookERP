<!DOCTYPE html>

        .dz-chk input { margin: 0; }
        .dz-chk.wt { color: #fff; }
        .dz-teal { background: #008080; position: relative; }
        .dz-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .dz-teal-title.s { font-size: 15px; line-height: 18px; }
        .dz-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .dz-strip.white { background: #fff; }
        .dz-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; color: #000; white-space: nowrap; }
        .dz-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .dz-tool:disabled { color: #9a9a9a; cursor: default; }
        .dz-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; flex: none; }
        .dz-btn { font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; background: #008080; color: #fff; border: 1px solid #005959; cursor: pointer; padding: 0; }
        .dz-btn:disabled { opacity: .6; cursor: default; }
        .dz-gbar { width: 38px; height: 22px; background: transparent; color: #fff; border: 1px solid transparent; font-size: 14px; }
        .dz-host { overflow: auto; background: #fff; border-top: 1px solid #9eb6ce; max-height: none; }
        .dz-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .dz-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .dz-host .win-grid td { border: 1px solid #d5e1f0; }
        .dz-host .win-grid tbody tr:hover { background: #fff0cf; }
        .dz-tabs { display: flex; gap: 0; padding-left: 2px; height: 25px; align-items: flex-end; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs .win-tab { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 14px; font-weight: normal; padding: 1px 8px; height: 21px; line-height: 19px; background: #f0f0f0; border: 1px solid #9a9a9a; border-bottom: none; border-radius: 2px 2px 0 0; color: #000; box-sizing: border-box; }
        .dz-tabs .win-tab.is-active { background: #fff; height: 24px; top: 1px; color: #000; }
        .dz-tabs.bottom { border-bottom: none; border-top: 1px solid #9a9a9a; align-items: flex-start; height: 25px; }
        .dz-tabs.bottom .win-tab { font-family: Verdana, sans-serif; font-size: 13px; border-radius: 0 0 2px 2px; border-top: none; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs.bottom .win-tab.is-active { top: -1px; }
        .dz-page { border: 1px solid #9a9a9a; border-top: none; background: #fff; box-sizing: border-box; }
        .dz-modal-box { width: auto !important; max-width: 98vw; background: #fff !important; }
        .dz-modal-box .cx-modal-body { padding: 0; }
        .dz-root { width: 1004px; }
        .dz-tp { width: 996px; margin: 4px 4px 0 4px; padding: 3px; box-sizing: border-box; background: #fff; }
        .is-hidden { display: none !important; }
        .dz-cell { font-family: Verdana, sans-serif; font-size: 11px; width: 100%; box-sizing: border-box; border: 1px solid #b8c7d8; background: #fff; padding: 0 2px; height: 20px; }
        .dz-cell.r { text-align: right; }
        .dz-mini { background: #fff; border: 1px solid #adadad; font-size: 11px; padding: 0 4px; color: #333; cursor: pointer; }
        .win-grid tr.is-selected { background: #cfe3fb; }
        .win-grid tr.dz-total td { background: #eef3f9; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="dz-scroll">
<div class="dz-root">

<!-- ======= tabPage1 "Form" : tabControl1 (Alignment Bottom), page 996 x 632 ======= -->
<div id="tabForm" class="win-tab-panel is-active dz-tp">
    <!-- panel2 / toolStrip1 -->
    <div style="height:29px;background:#fff;">
        <div class="dz-strip">
            <button type="button" class="dz-tool" id="btnNew" style="width:59px" onclick="GpInward.newDoc()"><i class="fa fa-file-o"></i> New</button>
            <button type="button" class="dz-tool" id="btnRefresh" style="width:80px" onclick="GpInward.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="dz-tool is-hidden" id="btnUpdate" style="width:78px" onclick="GpInward.update()"><i class="fa fa-pencil"></i> Update</button>
            <button type="button" class="dz-tool" id="btnSave" style="width:64px" onclick="GpInward.save()"><i class="fa fa-floppy-o"></i> Save</button>
            <button type="button" class="dz-tool" id="btnPrint" style="width:92px" onclick="GpInward.print()"><i class="fa fa-print"></i> 254-Print</button>
            <button type="button" class="dz-tool" id="btnAttachment" style="width:109px" onclick="GpInward.openAtt()"><i class="fa fa-paperclip"></i> Attachment</button>

    <!-- panel6 : title bar -->

        <span class="dz-teal-title" style="left:4px;top:2px;font-size:15px;">Gate Pass Inward (General)</span>
        <label class="dz-chk wt dz-abs" style="left:868px;top:2px;"><input type="checkbox" id="ChkBox" checked> Print Preview</label>
    </div>
    <!-- PanelHeaderInfo 992 x 116 -->
    <div style="position:relative;height:116px;background:#fff;">

        <input type="date" id="txtgpdate" class="dz-abs dz-dt" style="left:93px;top:7px;width:130px;">
        <label class="dz-abs dz-lbl" style="left:228px;top:10px;">Gp Doc</label>
        <input type="text" id="txtgpno" class="dz-abs dz-txt" style="left:295px;top:7px;width:112px;" readonly tabindex="-1">
        <label class="dz-abs dz-lbl" style="left:411px;top:10px;">Manual No</label>
        <input type="text" id="txtManualNo" class="dz-abs dz-txt" style="left:501px;top:7px;width:201px;" maxlength="50">
        <label class="dz-abs dz-lbl" style="left:714px;top:10px;">Gp Status</label>
        <span class="dz-abs dz-lbl" style="left:791px;top:8px;color:#f00;font-size:14px;">*</span>
        <select id="CmbStatus" class="dz-abs dz-cmb" style="left:811px;top:6px;width:130px;"></select>

        <label class="dz-abs dz-lbl" style="left:5px;top:38px;">G.P Type</label>
        <span class="dz-abs dz-lbl" style="left:82px;top:36px;color:#f00;font-size:14px;">*</span>
        <select id="CmbGatePassType" class="dz-abs dz-cmb" style="left:93px;top:34px;width:314px;" onchange="GpInward.gpTypeLeave()"></select>
        <label id="lblDeliveryChallanNo" class="dz-abs dz-lbl is-hidden" style="left:228px;top:38px;">D.C No</label>

        <label class="dz-abs dz-lbl" style="left:411px;top:38px;">Vehicle Type</label>
        <span class="dz-abs dz-lbl" style="left:486px;top:36px;color:#f00;font-size:14px;">*</span>
        <select id="cmbvehicletype" class="dz-abs dz-cmb" style="left:501px;top:34px;width:201px;"></select>
        <label class="dz-abs dz-lbl" style="left:714px;top:38px;">WB Status</label>
        <select id="CmbWeighBridge" class="dz-abs dz-cmb" style="left:811px;top:34px;width:130px;" onchange="GpInward.factoryWeight()"></select>

        <label class="dz-abs dz-lbl" style="left:5px;top:66px;">Party Name</label>
        <input type="text" id="txtPartyName" list="dlParty" class="dz-abs dz-txt" style="left:93px;top:63px;width:314px;" autocomplete="off">
        <datalist id="dlParty"></datalist>
        <label class="dz-abs dz-lbl" style="left:411px;top:66px;">Vehicle No</label>
        <input type="text" id="txtvehicleno" class="dz-abs dz-txt" style="left:501px;top:63px;width:201px;" maxlength="50">
        <label id="lblFactoryWt" class="dz-abs dz-lbl" style="left:714px;top:66px;">FactoryWeight</label>
        <input type="text" id="txtFactoryWeight" class="dz-abs dz-txt r" style="left:811px;top:63px;width:130px;" value="0" readonly disabled>

        <label class="dz-abs dz-lbl" style="left:5px;top:92px;">Remarks</label>
        <input type="text" id="txtremarks" class="dz-abs dz-txt" style="left:93px;top:89px;width:609px;">
        <label class="dz-abs dz-lbl" style="left:714px;top:92px;">Party Weight</label>
        <input type="text" id="txtSupplierWeight" class="dz-abs dz-txt r" style="left:811px;top:89px;width:130px;" value="0" onkeypress="return GpInward.decimalKey(event,this)">
    </div>
    <!-- PanelDetailInfo 992 x 62 / groupBox2 (1,2) 964 x 60 -->
    <div id="PanelDetailInfo" style="position:relative;height:62px;background:#fff;">
        <div class="dz-gb" style="left:1px;top:2px;width:964px;height:60px;">

            <label class="dz-chk dz-abs" style="left:92px;top:11px;"><input type="radio" name="itemSearch" id="rdbtnItemCode" onchange="GpInward.searchModeChanged()"> Code</label>

            <select id="cmbJobLot" class="dz-abs dz-cmb" style="left:378px;top:30px;width:159px;"></select>
            <label class="dz-abs dz-lbl" style="left:539px;top:13px;">UOM</label>
            <select id="cmbUOM" class="dz-abs dz-cmb" style="left:539px;top:30px;width:90px;"><option value="0"></option></select>
            <label class="dz-abs dz-lbl" style="left:631px;top:13px;">Qty</label>
            <input type="text" id="txtqty" class="dz-abs dz-txt r" style="left:631px;top:30px;width:70px;" value="0" onkeypress="return GpInward.decimalKey(event,this)">

            <input type="text" id="txtRemarksDetail" class="dz-abs dz-txt" style="left:702px;top:30px;width:197px;">
            <button type="button" class="dz-abs dz-btn" id="Add" style="left:900px;top:31px;width:40px;height:24px;" onclick="GpInward.add()">+</button>

        <label class="dz-abs" style="left:353px;top:7px;color:#c0ffff;font-size:12px;">WareHouse</label>
        <select id="CmbWareHouseToUpdate" class="dz-abs dz-cmb" style="left:424px;top:1px;width:148px;height:25px;"></select>
        <label class="dz-abs" style="left:576px;top:7px;color:#c0ffff;font-size:12px;">JobLot</label>

    <div class="dz-host win-grid-scroll" style="height:186px;"><table class="win-grid" id="grd"><thead></thead><tbody></tbody></table></div>

        <span class="dz-teal-title" style="left:0;top:2px;font-size:13px;line-height:17px;">Gate Pass With Open Status</span>
    </div>

</div>

<!-- ======= tabPage2 "History" ======= -->

        <div class="dz-strip" style="height:24px;">

</div>
</div>

        <div class="cx-modal-body"><table class="win-grid"><tbody id="keysBody"></tbody></table></div>
    </div>
</div>
