<div class="dr-scroll">
<div class="dr-root">

                <input type="checkbox" id="ChkBok" checked style="margin:0;">Preview</label>
        </div>

        <!-- panel4 (2,53) 968 x 183 -->
        <div style="position:relative;height:183px;background:#fff;">

            <!-- groupBox1 (4,3) 960 x 103 "Main Information", Tahoma 9.75pt bold -->

                <span class="dr-cap" style="font-size:13px;">Main Information</span>

                <label class="dr-abs dr-lbl" for="cmbProject" style="left:6px;top:25px;">Project Name</label>
                <select id="cmbProject" class="dr-abs dr-cmb win-combo" style="left:96px;top:19px;width:220px;"></select>

                <label class="dr-abs dr-lbl" for="cmbworkno" style="left:321px;top:25px;">Work Order</label>
                <select id="cmbworkno" class="dr-abs dr-cmb win-combo" style="left:424px;top:19px;width:220px;"></select>

                <label class="dr-abs dr-lbl" for="cmbDepartmentTo" style="left:648px;top:25px;">Department To</label>
                <select id="cmbDepartmentTo" class="dr-abs dr-cmb win-combo" style="left:737px;top:19px;width:190px;"></select>
                <button type="button" id="BtnDepartmentDefine" class="dr-abs dr-sqbtn" style="padding:0;left:930px;top:19px;width:27px;height:27px;" tabindex="-1" onclick="DeptReqConsumable.defineDepartment()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>

                <label class="dr-abs dr-lbl" for="txtdocno" style="left:6px;top:54px;">Doc No &amp; Date</label>
                <input type="text" id="txtdocno" class="dr-abs dr-txt f13" style="left:96px;top:50px;width:72px;" readonly onblur="DeptReqConsumable.docNoLeave()">

                <label class="dr-abs dr-lbl" for="cmbDepartmentFrom" style="left:321px;top:54px;">Department From</label>
                <select id="cmbDepartmentFrom" class="dr-abs dr-cmb win-combo" style="left:424px;top:48px;width:220px;"></select>

                <label class="dr-abs dr-lbl" for="txtremarks" style="left:6px;top:81px;">Remarks</label>
                <input type="text" id="txtremarks" class="dr-abs dr-txt" style="left:96px;top:77px;width:548px;">
            </div>

            <!-- groupBox2 (6,105) 958 x 73 "Detail Information", Tahoma 9pt bold -->

                <span class="dr-cap" style="font-size:12px;">Detail Information</span>

                <label class="dr-abs dr-lbl" for="txtBarcodeReader" style="left:4px;top:18px;">Bar Code No.</label>
                <input type="text" id="txtBarcodeReader" class="dr-abs dr-txt" style="left:4px;top:40px;width:157px;"
                       onkeydown="if(event.key==='Enter'){event.preventDefault();DeptReqConsumable.barcode();}">

                <label class="dr-abs dr-lbl" for="cmbItem" style="left:166px;top:18px;">Item</label>
                <label class="dr-abs dr-radio" style="left:210px;top:16px;width:57px;"><input type="radio" name="srch" id="rdbtnItemName" checked onchange="DeptReqConsumable.searchModeChanged()">Name</label>
                <label class="dr-abs dr-radio" style="left:284px;top:16px;width:52px;"><input type="radio" name="srch" id="rdbtnItemCode" onchange="DeptReqConsumable.searchModeChanged()">Code</label>

                <select id="cmbItem" class="dr-abs dr-cmb f12 win-combo" style="left:164px;top:39px;width:221px;" onblur="DeptReqConsumable.itemLeave()"></select>

                <label class="dr-abs dr-lbl" for="cmbItemUOM" style="left:388px;top:18px;">UOM</label>
                <select id="cmbItemUOM" class="dr-abs dr-cmb f12 win-combo" style="left:389px;top:39px;width:67px;"></select>

                <label class="dr-abs dr-lbl" for="CmbAssetName" style="left:460px;top:18px;">AssetName</label>
                <select id="CmbAssetName" class="dr-abs dr-cmb f12 win-combo" style="left:459px;top:39px;width:140px;"></select>
                <button type="button" id="button1" class="dr-abs dr-sqbtn" style="padding:0;left:597px;top:38px;width:27px;height:27px;" tabindex="-1" onclick="DeptReqConsumable.defineAsset()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>

                <label class="dr-abs dr-lbl" for="txtRequestedQty" style="left:624px;top:18px;">Requested Qty</label>

                <button type="button" id="Add" class="dr-abs dr-tealbtn" style="left:716px;top:39px;width:35px;height:25px;" onclick="DeptReqConsumable.add()">+</button>
                <button type="button" id="btnUpdateDetail" class="dr-abs dr-tealbtn is-hidden" style="left:714px;top:39px;width:66px;height:25px;" onclick="DeptReqConsumable.updateDetail()">Update</button>
                <button type="button" id="btnCancelUpdateDetial" class="dr-abs dr-tealbtn is-hidden" style="left:783px;top:39px;width:63px;height:25px;" onclick="DeptReqConsumable.cancelDetail()">Cancel</button>

        <div class="dr-teal t2" style="height:26px;">
            <span class="dr-teal-title s10" style="left:3px;top:3px;">Detail</span>
        </div>

            <table class="win-grid" id="grdDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>

    <!-- ============================================================ tabPage2 "History" -->
