<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening Stock Store - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* frmStoreOpeningStockBalancing designer geometry, 1:1 in px (ClientSize 1034 x 625).
           Docked panels stretch with the window like the maximized form; every control keeps its
           designer Location/Size inside its container. */
        body { background: #fff; padding-bottom: 36px; }
        .os-scroll { overflow-x: auto; }
        .os-root { min-width: 1034px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .os-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .os-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; line-height: 17px; color: #000; }
        .os-lbl9 { font-size: 12px; line-height: 15px; }
        .os-lbl-c { text-align: center; white-space: normal; }
        .os-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .os-txt[readonly] { background: #f0f0f0; }
        .os-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .os-txt.r { text-align: right; }
        .os-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .os-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 22px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .os-dtc { display: flex; align-items: center; gap: 2px; height: 22px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .os-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 18px; width: 100%; min-width: 0; padding: 0; }
        .os-gb { position: absolute; box-sizing: border-box; }
        .os-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .os-gb > .os-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .os-radio { display: inline-flex; align-items: center; gap: 3px; background: #fff; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; }
        .os-radio input { margin: 0; }
        .os-teal { background: #008080; position: relative; }
        .os-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .os-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; }
        .os-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; }
        .os-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .os-tool:disabled { color: #9a9a9a; cursor: default; }
        .os-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; }
        .os-hbtn { width: 31px; height: 25px; border: 1px solid #b5b5b5; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .os-grid-host { height: calc(100vh - 415px); min-height: 270px; overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; }
        .os-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .os-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .os-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .os-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .os-nav { font-family: Verdana, sans-serif; font-size: 11px; padding: 2px 6px; border-top: 1px solid #9eb6ce; background: #eef4fb; }
    </style>
</head>
<body>
<div class="os-scroll">
<div class="os-root">

    <!-- panel2 / toolStrip3 (0,0) 1034 x 27 -->
    <div class="os-strip">
        <button type="button" class="os-tool" id="BtnNew" style="width:59px" onclick="OpenStore.newClick()"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="os-tool" id="btnRefresh" style="width:80px" onclick="OpenStore.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
        <button type="button" class="os-tool" id="btnSave" style="width:64px" onclick="OpenStore.save()"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="os-tool is-hidden" id="btnUpdate" style="width:78px" onclick="OpenStore.update()"><i class="fa fa-refresh"></i> Update</button>
        <span class="os-sep"></span>
        <button type="button" class="os-tool" id="btnPrint" style="width:92px" onclick="OpenStore.print()"><i class="fa fa-print"></i> 416-Print</button>
        <button type="button" class="os-tool" id="btnAttachment" style="width:109px" onclick="OpenStore.attachment()"><i class="fa fa-paperclip"></i> Attachment</button>
        <button type="button" class="os-tool" id="btnUploadOpening" style="width:133px" onclick="OpenStore.uploadOpening()"><i class="fa fa-file-excel-o" style="color:#1d6f42"></i> Upload Opening</button>
        <a href="/modules" class="os-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel3 (0,25) 1034 x 29, teal; label24 (2,4) Tahoma 12pt bold -->
    <div class="os-teal" style="height:29px;">
        <span class="os-teal-title" style="left:2px;top:4px;">Store Opening Stock Balancing</span>
    </div>

    <!-- panel4 (0,54) 1034 x 195, white -->
    <div style="position:relative;height:195px;background:#fff;">

        <!-- groupBox1 (5,2) 1026 x 64 -->
        <div class="os-gb" style="left:5px;top:2px;width:1026px;height:64px;background:#fff;">
            <label class="os-abs os-lbl" for="txtDocNo" style="left:5px;top:14px;">Doc No</label>
            <input type="text" id="txtDocNo" class="os-abs os-txt" style="left:67px;top:11px;width:141px;" readonly tabindex="-1">
            <label class="os-abs os-lbl" for="txtDocdate" style="left:5px;top:40px;">Doc Date</label>
            <input type="date" id="txtDocdate" class="os-abs os-dt" style="left:67px;top:37px;width:141px;">
            <span class="os-abs" style="left:211px;top:11px;width:73px;height:23px;background:#d3d3d3;font-family:'Segoe UI Semibold','Segoe UI',Tahoma,sans-serif;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;">Remarks</span>
            <textarea id="txtRemarks" class="os-abs os-txt" style="left:287px;top:11px;width:660px;height:48px;resize:none;" maxlength="500"></textarea>
        </div>

        <!-- groupBox2 (4,67) 1027 x 124, Tahoma 9.75pt bold, no caption -->
        <div class="os-gb" style="left:4px;top:67px;width:1027px;height:124px;background:#fff;">
            <label class="os-abs os-lbl" for="cmbItem" style="left:2px;top:12px;">Item Name</label>
            <label class="os-abs os-radio" style="left:36px;top:11px;width:57px;"><input type="radio" name="srch" id="rdSearchByName" checked onchange="OpenStore.searchModeChanged()">Name</label>
            <label class="os-abs os-radio" style="left:95px;top:11px;width:52px;"><input type="radio" name="srch" id="rdSearchByCode" onchange="OpenStore.searchModeChanged()">Code</label>
            <select id="cmbItem" class="os-abs os-cmb win-combo" style="left:2px;top:32px;width:210px;"></select>

            <label class="os-abs os-lbl" for="cmbWarehouse" style="left:213px;top:12px;">WareHouse</label>
            <select id="cmbWarehouse" class="os-abs os-cmb win-combo" style="left:213px;top:32px;width:180px;"></select>

            <label class="os-abs os-lbl" for="CmbRackName" style="left:395px;top:12px;">Rack Name</label>
            <select id="CmbRackName" class="os-abs os-cmb win-combo" style="left:395px;top:32px;width:160px;"></select>

            <label class="os-abs os-lbl" for="cmbJobLot" style="left:556px;top:12px;">JobLot</label>
            <select id="cmbJobLot" class="os-abs os-cmb win-combo" style="left:556px;top:32px;width:160px;"></select>

            <label class="os-abs os-lbl os-lbl9" for="CmbItemCondition" style="left:717px;top:13px;">Item Condition</label>
            <select id="CmbItemCondition" class="os-abs os-cmb win-combo" style="left:717px;top:32px;width:140px;"></select>

            <label class="os-abs os-lbl" for="cmbUOM" style="left:859px;top:12px;">Pack UOM</label>
            <select id="cmbUOM" class="os-abs os-cmb win-combo" style="left:859px;top:31px;width:90px;"></select>

            <label class="os-abs os-lbl" for="txtQty" style="left:952px;top:12px;">Item Qty</label>
            <input type="text" id="txtQty" class="os-abs os-txt r" style="left:950px;top:33px;width:75px;" autocomplete="off">

            <label class="os-abs os-lbl os-lbl9 os-lbl-c" for="CmbSecondaryUom" style="left:11px;top:61px;width:63px;">Secondary<br>Uom</label>
            <select id="CmbSecondaryUom" class="os-abs os-cmb win-combo" style="left:2px;top:91px;width:80px;"></select>

            <label class="os-abs os-lbl os-lbl9 os-lbl-c" for="txtSecondaryUomQty" style="left:89px;top:61px;width:75px;">Secondary<br>Uom Weight</label>
            <input type="text" id="txtSecondaryUomQty" data-acc="SecondaryUomQty" class="os-abs os-txt" style="left:83px;top:93px;width:75px;" autocomplete="off">

            <label class="os-abs os-lbl os-lbl9" for="txtPerItemWeight" style="left:163px;top:61px;width:55px;white-space:normal;">Per Item<br>Weight</label>
            <input type="text" id="txtPerItemWeight" data-acc="PerItemWeight" class="os-abs os-txt" style="left:160px;top:93px;width:60px;" autocomplete="off">

            <label class="os-abs os-lbl os-lbl9" for="txtSecondaryUomRate" style="left:221px;top:61px;width:63px;white-space:normal;">Secondary<br>Uom Rate</label>
            <input type="text" id="txtSecondaryUomRate" data-acc="SecondaryUomRate" class="os-abs os-txt" style="left:221px;top:93px;width:75px;" autocomplete="off">

            <label class="os-abs os-lbl" for="txtRate" style="left:297px;top:68px;">Item Rate</label>
            <input type="text" id="txtRate" data-acc="ItemRate" class="os-abs os-txt r" style="left:297px;top:93px;width:75px;" autocomplete="off">

            <label class="os-abs os-lbl" for="cmbRateUOM" style="left:374px;top:68px;">Rate UOM</label>
            <select id="cmbRateUOM" class="os-abs os-cmb win-combo" style="left:374px;top:91px;width:90px;"></select>

            <label class="os-abs os-lbl" for="txtAmount" style="left:465px;top:68px;">Total Amount</label>
            <input type="text" id="txtAmount" class="os-abs os-txt r" style="left:465px;top:93px;width:115px;" readonly disabled tabindex="-1">

            <label class="os-abs os-lbl" for="cmbStockCreditAcc" style="left:581px;top:68px;">Stock Credit&nbsp; A/c</label>
            <select id="cmbStockCreditAcc" class="os-abs os-cmb win-combo" style="left:581px;top:91px;width:444px;"></select>
        </div>
    </div>

    <!-- panel5 (0,249) fill: panel7 teal 32 / panel9 filters 74 / panel10 grid -->
    <div id="historySection">
        <div class="os-teal" style="height:32px;">
            <span class="os-teal-title" style="left:2px;top:5px;">Opening Store Balancing History</span>
            <button type="button" class="os-abs os-hbtn" id="BtnResetHistory" title="Reset" style="left:292px;top:3px;background:#fff;color:#008080;" onclick="OpenStore.resetHistory()"><i class="fa fa-plus-circle"></i></button>
            <button type="button" class="os-abs os-hbtn" id="BtnRefreshHistory" title="Refresh" style="left:321px;top:3px;background:transparent;color:#fff;border-color:transparent;" onclick="OpenStore.refreshHistory()"><i class="fa fa-refresh"></i></button>
            <!-- ctrlGrdBar3 (993,4) 38 x 24, anchored Top|Right -->
            <button type="button" class="os-abs os-hbtn" id="ctrlGrdBar3" title="Grid layout / print / export options are not ported" style="right:3px;top:4px;width:38px;height:24px;background:transparent;color:#fff;border-color:transparent;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div style="position:relative;height:74px;background:#fff;">
            <!-- groupBox3 (6,6) 961 x 65 "Filters" -->
            <div class="os-gb" style="left:6px;top:6px;width:961px;height:65px;background:#fff;">
                <span class="os-cap">Filters</span>
                <label class="os-abs os-lbl os-lbl9" style="left:5px;top:17px;">Date From</label>
                <div class="os-abs os-dtc" style="left:5px;top:36px;width:130px;"><input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory"></div>
                <label class="os-abs os-lbl os-lbl9" style="left:137px;top:17px;">Date To</label>
                <div class="os-abs os-dtc" style="left:137px;top:36px;width:130px;"><input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory"></div>
                <label class="os-abs os-lbl os-lbl9" for="FromDocNoHistory" style="left:268px;top:17px;">Doc From</label>
                <input type="text" id="FromDocNoHistory" class="os-abs os-txt" style="left:268px;top:36px;width:70px;" inputmode="numeric">
                <label class="os-abs os-lbl os-lbl9" for="ToDocNoHistory" style="left:339px;top:17px;">Doc To</label>
                <input type="text" id="ToDocNoHistory" class="os-abs os-txt" style="left:339px;top:36px;width:70px;" inputmode="numeric">
                <label class="os-abs os-lbl os-lbl9" for="CmbItemNameHistory" style="left:415px;top:17px;">Item Name</label>
                <select id="CmbItemNameHistory" class="os-abs os-cmb win-combo" style="left:411px;top:34px;width:160px;"></select>
                <label class="os-abs os-lbl os-lbl9" for="CmbStockAccountHistory" style="left:573px;top:17px;">Stock Credit A/c</label>
                <select id="CmbStockAccountHistory" class="os-abs os-cmb win-combo" style="left:573px;top:34px;width:160px;"></select>
                <label class="os-abs os-lbl os-lbl9" for="CmbItemStockAccountHistory" style="left:735px;top:17px;">Item Stock A/c</label>
                <select id="CmbItemStockAccountHistory" class="os-abs os-cmb win-combo" style="left:735px;top:34px;width:164px;"></select>
                <button type="button" id="btnshow" class="os-abs" style="left:901px;top:35px;width:55px;height:25px;background:#008080;color:#fff;border:1px solid #005959;font-family:Verdana,sans-serif;font-size:12px;font-weight:bold;cursor:pointer;" onclick="OpenStore.showHistory()">Show</button>
            </div>
        </div>
        <!-- panel10 / DataGridHistory (fill) -->
        <div class="os-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody></table>
        </div>
        <div class="os-nav" id="historyNavigator">&nbsp;</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the history section). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="OpenStore.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<!-- btnAttachment → Attachment form (AT) -->
<div class="cx-modal" id="dlgAttachment">
    <div class="cx-modal-box small">
        <div class="cx-modal-head"><span id="attTitle">Attachments</span><button type="button" onclick="StoreCommon.closeModal('dlgAttachment')">&times;</button></div>
        <div class="cx-modal-body">
            <div id="attAdd" style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
                <input type="file" id="attFiles" multiple>
                <button type="button" class="win-btn-small" onclick="OpenStore.attachmentAdd()">Add</button>
            </div>
            <div class="win-grid-container"><div class="win-grid-scroll"><table class="win-grid" id="grdAttachments"><thead></thead><tbody></tbody></table></div></div>
            <div style="font-size:8pt;color:#555;margin-top:4px;" id="attNote">Attachments are saved with the document (Save / Update).</div>
        </div>
    </div>
</div>

<!-- btnUploadOpening → frmItemDefineExcelSheetUpload (ItemDefinitionType 2) -->
<div class="cx-modal" id="dlgUpload">
    <div class="cx-modal-box">
        <div class="cx-modal-head" style="height:34px;font-family:'Segoe UI',sans-serif;font-size:16pt;"><span>Item Definition Data Upload</span><button type="button" onclick="StoreCommon.closeModal('dlgUpload')">&times;</button></div>
        <div class="cx-modal-body" style="background:#fff;">
            <div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;height:40px;">
                <input type="file" id="upFile" accept=".xlsx">
                <button type="button" id="btnUpload" style="background:green;color:#fff;border:none;font-family:'Segoe UI',sans-serif;font-size:10pt;font-weight:bold;width:74px;height:34px;cursor:pointer;" onclick="OpenStore.uploadRead()">Upload</button>
            </div>
            <div style="background:#008080;color:#fff;height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-family:'Segoe UI',sans-serif;font-size:16pt;font-weight:bold;">
                <span>Sheet Data</span>
                <span style="display:flex;gap:3px;">
                    <button type="button" id="btnUploadClear" style="background:green;color:#fff;border:none;font-family:'Segoe UI',sans-serif;font-size:11pt;font-weight:bold;width:70px;height:28px;cursor:pointer;" onclick="OpenStore.uploadClear()">Clear</button>
                    <button type="button" id="btnUploadSave" style="background:green;color:#fff;border:none;font-family:'Segoe UI',sans-serif;font-size:11pt;font-weight:bold;width:70px;height:28px;cursor:pointer;" onclick="OpenStore.uploadSave()">Save</button>
                </span>
            </div>
            <div class="win-grid-container"><div class="win-grid-scroll" style="max-height:60vh;"><table class="win-grid" id="grdExcelDataView"><thead></thead><tbody></tbody></table></div></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_opening_stock_store.js?v=20260925a}"></script>
</body>
</html>
