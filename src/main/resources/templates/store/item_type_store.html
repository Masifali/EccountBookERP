<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Type Store - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* InvDeffrmItemType designer geometry, 1:1 in px (ClientSize 809 x 461). The form keeps its
           designer width; every control sits at its designer Location/Size inside its panel. */
        body { background: #fff; padding-bottom: 36px; }
        .it-scroll { overflow-x: auto; }
        .it-root { width: 809px; position: relative; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-size: 12px; font-weight: bold; }
        .it-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .it-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .it-txt { font-family: Verdana, sans-serif; font-size: 13px; font-weight: normal; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .it-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .it-cmb { font-family: Verdana, sans-serif; font-size: 13px; font-weight: normal; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .it-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; }
        .it-chk input { margin: 0; }
        .it-teal { background: #008080; position: relative; }
        .it-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .it-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .it-tool { font-family: Verdana, sans-serif; font-size: 13px; font-weight: normal; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; }
        .it-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .it-tool:disabled { color: #9a9a9a; cursor: default; }
        .it-grid-host { height: calc(100vh - 198px); min-height: 313px; overflow: auto; background: #fff; border: 1px solid #9eb6ce; box-sizing: border-box; }
        .it-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; font-weight: normal; }
        .it-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .it-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .it-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
    </style>
</head>
<body>
<!-- Screen 337 "Item Type Store" (ScreenName ItemTypeStore) - ScreenDefinition TargetUrl
     Architecture.WinApp.Inventory_Definition.InvDeffrmItemType, opened with Tag only (FormTypeId 0). -->
<div class="it-scroll">
<div class="it-root">

    <!-- tsItemType (0,0) 809 x 27 -->
    <div class="it-strip">
        <button type="button" class="it-tool" id="btnnew" style="width:59px" onclick="ItemTypeStore.reset()"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="it-tool" id="toolStripButton1" style="width:80px" onclick="ItemTypeStore.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
        <button type="button" class="it-tool is-hidden" id="btnupdate" style="width:78px" onclick="ItemTypeStore.update()"><i class="fa fa-refresh"></i> Update</button>
        <button type="button" class="it-tool is-hidden" id="btnsave" style="width:64px" onclick="ItemTypeStore.save()"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="it-tool is-hidden" id="btnMultiLingo" style="width:101px" onclick="ItemTypeStore.multiLingo()"><i class="fa fa-language"></i> Multi Lingo</button>
        <a href="/modules" class="it-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel10 (0,27) 809 x 23 teal; label47 (5,2) Tahoma 12pt bold -->
    <div class="it-teal" style="height:23px;">
        <span class="it-teal-title" id="label47" style="left:5px;top:2px;">Item Type</span>
        <span id="lblRecId" style="display:none;">&nbsp;</span>
    </div>

    <!-- panel1 (0,50) 809 x 73 white -->
    <div id="panel1" style="position:relative;height:73px;background:#fff;">
        <label class="it-abs it-lbl" for="txtItemTypeCode" style="left:9px;top:9px;">Code</label>
        <input type="text" id="txtItemTypeCode" class="it-abs it-txt" style="left:80px;top:5px;width:289px;">
        <label class="it-abs it-lbl" for="txtItemTypeDescription" style="left:9px;top:37px;">Description</label>
        <input type="text" id="txtItemTypeDescription" class="it-abs it-txt" style="left:80px;top:33px;width:289px;">

        <label class="it-abs it-lbl" for="cmbItemTypeType" style="left:374px;top:9px;">Type</label>
        <select id="cmbItemTypeType" class="it-abs it-cmb win-combo" style="left:468px;top:3px;width:249px;"></select>
        <label class="it-abs it-lbl" for="CmbParentCategory" style="left:374px;top:37px;">Parent Category</label>
        <select id="CmbParentCategory" class="it-abs it-cmb win-combo" style="left:468px;top:31px;width:249px;"></select>

        <label class="it-abs it-chk" style="left:721px;top:36px;width:74px;"><input type="checkbox" id="ChkIsMother">IsMother</label>
    </div>

    <!-- panel2 (0,123) fill: panel3 teal 25 "History" + grdhistory (fill) -->
    <div id="histBox">
        <div class="it-teal" style="height:25px;">
            <span class="it-teal-title" style="left:5px;top:2px;">History</span>
            <!-- ctrlGrdBar2 (761,-2) 43 x 27 -->
            <button type="button" class="it-abs" id="ctrlGrdBar2" title="Grid layout / print / export options are not ported" style="left:761px;top:0;width:43px;height:25px;background:transparent;color:#fff;border:none;font-size:14px;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div class="it-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdhistory"><thead></thead><tbody></tbody></table>
        </div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the history section). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="ItemTypeStore.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_item_type_store.js?v=20260925a}"></script>
</body>
</html>
