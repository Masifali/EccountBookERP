<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Party To Party Packing Material Transfer - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* PartyToPartyPackingMaterialTransfer designer geometry, 1:1 in px (ClientSize 940 x 657).
           tabControl1 fills the form with its tabs at the BOTTOM (Alignment = Bottom); each tab page has
           Padding 3. Docked panels stretch with the window like the maximized form; every control keeps
           its designer Location/Size inside its container. */
        body { background: #fff; }
        .pp-scroll { overflow-x: auto; }
        .pp-root { min-width: 940px; position: relative; font-family: Verdana, sans-serif; font-size: 13px; }
        .pp-page { padding: 3px; box-sizing: border-box; background: #fff; }
        .pp-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .pp-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .pp-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .pp-txt[readonly] { background: #f0f0f0; }
        .pp-txt.r { text-align: right; }
        .pp-txt.sb { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; }
        select.pp-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .pp-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .pp-dtc { display: flex; align-items: center; gap: 2px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .pp-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 19px; width: 100%; min-width: 0; padding: 0; }
        .pp-gb { position: absolute; box-sizing: border-box; background: #fff; }
        .pp-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .pp-gb > .pp-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .pp-radio { display: inline-flex; align-items: center; gap: 3px; background: #fff; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; white-space: nowrap; }
        .pp-radio input { margin: 0; }
        .pp-teal { background: #008080; position: relative; }
        .pp-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-weight: bold; color: #fff; white-space: nowrap; }
        .pp-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; }
        .pp-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
        .pp-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .pp-tool:disabled { color: #9a9a9a; cursor: default; }
        .pp-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; }
        .pp-tealbtn { background: #008080; color: #fff; border: 1px solid #005959; font-weight: bold; cursor: pointer; padding: 0; }
        .pp-grid-host { overflow: auto; background: #fff; border-top: 1px solid #9eb6ce; }
        .pp-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .pp-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; white-space: normal; line-height: 13px; }
        .pp-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .pp-grid-host .win-grid tbody tr { cursor: default; }
        .pp-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .pp-grid-host .win-grid tbody tr.is-selected { background: #d6ecff; }
        .pp-grid-host .win-grid tfoot td { background: #eef4fb; font-weight: bold; border: 1px solid #9eb6ce; }
        .pp-grid-host .win-grid td.num { text-align: right; }
        .pp-cellbtn { font-family: Verdana, sans-serif; font-size: 10px; height: 18px; padding: 0 4px; cursor: pointer; background: #f0f0f0; border: 1px solid #9a9a9a; }
        .pp-doclink { color: #004d40; text-decoration: underline; cursor: pointer; }
        /* the desktop's tab strip is at the bottom of tabControl1 */
        .pp-tabs { display: flex; gap: 2px; border-top: 1px solid #7a9a9e; margin: 0; padding: 0 2px; background: #fff; height: 25px; }
        .pp-tabs .win-tab { font-family: Verdana, sans-serif; font-size: 13px; border-radius: 0 0 3px 3px; border-top: none; border-bottom: 1px solid #999; top: 0; }
        .pp-tabs .win-tab.is-active { top: -1px; background: #fff; }
        #gridFormHost { height: calc(100vh - 36px - 25px - 6px - 27px - 213px - 20px); min-height: 200px; }
        #gridHistoryHost { height: 253px; }
        #gridDetailHost { height: calc(100vh - 36px - 25px - 6px - 28px - 23px - 75px - 253px - 18px); min-height: 64px; }
    </style>
</head>
<body>
<div class="pp-scroll">
<div class="pp-root">

    <!-- ===================================================================== tabForm "Form" -->
    <div id="tabForm" class="win-tab-panel is-active pp-page">

        <!-- btn (ToolStrip) (3,3) 926 x 27 -->
        <div class="pp-strip">
            <button type="button" class="pp-tool" id="btnNew" style="width:59px" onclick="P2PPm.newClick()"><i class="fa fa-file-o"></i> New</button>
            <button type="button" class="pp-tool" id="btnRefresh" style="width:80px" onclick="P2PPm.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="pp-tool is-hidden" id="btnUpdate" style="width:78px" onclick="P2PPm.update()"><i class="fa fa-refresh"></i> Update</button>
            <button type="button" class="pp-tool" id="btnSave" style="width:64px" onclick="P2PPm.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="pp-tool" id="btnprint" style="width:92px" onclick="P2PPm.print()"><i class="fa fa-print"></i> 219-Print</button>
            <button type="button" class="pp-tool" id="btnattachment" style="width:109px" disabled title="Attachments are not ported for this screen"><i class="fa fa-paperclip"></i> Attachment</button>
            <span class="pp-sep"></span>
            <button type="button" class="pp-tool" id="btnshortcut" style="width:126px" disabled title="Keyboard shortcuts are not ported"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
            <a href="/modules" class="pp-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>

        <!-- panel7 (3,30) 926 x 213, dock Top -->
        <div style="position:relative;height:213px;background:#fff;">
            <!-- panel2 (0,0) 926 x 24, teal -->
            <div class="pp-teal" style="height:24px;">
                <span class="pp-teal-title" style="left:3px;top:2px;font-size:16px;line-height:19px;">Party To Party Packing Material Transfer</span>
                <!-- ChkBox (823,2) 102 x 19, Checked -->
                <label class="pp-abs" style="left:823px;top:2px;width:102px;height:19px;display:flex;align-items:center;gap:3px;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;font-weight:bold;font-size:12px;white-space:nowrap;">
                    <input type="checkbox" id="ChkBox" checked style="margin:0;"> Print Preview</label>
            </div>

            <!-- groupBox1 "Main" (3,25) 790 x 70, Tahoma 9.75pt bold -->
            <div class="pp-gb" style="left:3px;top:25px;width:790px;height:70px;">
                <span class="pp-cap" style="font-family:Tahoma,sans-serif;">Main</span>
                <label class="pp-abs pp-lbl" for="txtVoucherCode" style="left:9px;top:21px;">Doc No</label>
                <input type="text" id="txtVoucherCode" class="pp-abs pp-txt r" style="left:7px;top:41px;width:88px;" readonly tabindex="-1">
                <label class="pp-abs pp-lbl" for="datDocDate" style="left:97px;top:21px;">Doc Date</label>
                <input type="date" id="datDocDate" class="pp-abs pp-dt" style="left:96px;top:41px;width:116px;">
                <label class="pp-abs pp-lbl" for="txtRemarksHeader" style="left:214px;top:21px;">Remarks</label>
                <input type="text" id="txtRemarksHeader" class="pp-abs pp-txt" style="left:213px;top:41px;width:569px;" autocomplete="off">
            </div>

            <!-- groupBox2 "Detail" (6,94) 787 x 116, Segoe UI 9.75pt bold -->
            <div class="pp-gb" style="left:6px;top:94px;width:787px;height:116px;">
                <span class="pp-cap" style="font-family:'Segoe UI',Tahoma,sans-serif;">Detail</span>
                <label class="pp-abs pp-lbl" for="cmbitem" style="left:3px;top:21px;">Item Name</label>
                <label class="pp-abs pp-radio" style="left:79px;top:19px;width:57px;"><input type="radio" name="p2pSrch" id="rdSearchByName" onchange="P2PPm.searchModeChanged()">Name</label>
                <label class="pp-abs pp-radio" style="left:139px;top:19px;width:52px;"><input type="radio" name="p2pSrch" id="rdSearchByCode" onchange="P2PPm.searchModeChanged()">Code</label>
                <select id="cmbitem" class="pp-abs pp-cmb win-combo" style="left:3px;top:40px;width:223px;" onchange="P2PPm.itemLeave()"></select>

                <label class="pp-abs pp-lbl" for="cmbItemUom" style="left:227px;top:21px;">UOM</label>
                <select id="cmbItemUom" class="pp-abs pp-cmb win-combo" style="left:227px;top:40px;width:76px;"></select>

                <label class="pp-abs pp-lbl" for="CmbItemcondition" style="left:304px;top:21px;">Item Condition</label>
                <select id="CmbItemcondition" class="pp-abs pp-cmb win-combo" style="left:304px;top:40px;width:200px;"></select>

                <label class="pp-abs pp-lbl" for="txtItemQty" style="left:505px;top:21px;">Qty</label>
                <input type="text" id="txtItemQty" class="pp-abs pp-txt r" style="left:505px;top:42px;width:75px;" autocomplete="off" inputmode="decimal">

                <label class="pp-abs pp-lbl" for="cmbSupplierFrom" style="left:581px;top:21px;">Supplier From</label>
                <select id="cmbSupplierFrom" class="pp-abs pp-cmb win-combo" style="left:581px;top:40px;width:200px;"></select>

                <label class="pp-abs pp-lbl" for="cmbSupplierTo" style="left:4px;top:66px;">Supplier To</label>
                <select id="cmbSupplierTo" class="pp-abs pp-cmb win-combo" style="left:4px;top:85px;width:222px;"></select>

                <label class="pp-abs pp-lbl" for="txtRemarksDetail" style="left:227px;top:69px;">Remarks</label>
                <input type="text" id="txtRemarksDetail" class="pp-abs pp-txt" style="left:227px;top:87px;width:414px;" autocomplete="off">

                <button type="button" id="BtnAdd" class="pp-abs pp-tealbtn" style="left:642px;top:85px;width:29px;height:26px;font-family:Tahoma,sans-serif;font-size:13px;" onclick="P2PPm.add()">+</button>
                <button type="button" id="btnUpdateDetail" class="pp-abs pp-tealbtn is-hidden" style="left:642px;top:85px;width:69px;height:26px;font-family:Verdana,sans-serif;font-size:13px;" onclick="P2PPm.updateDetail()">Update</button>
                <button type="button" id="btnCancelUpdateDetial" class="pp-abs pp-tealbtn is-hidden" style="left:712px;top:85px;width:67px;height:26px;font-family:Verdana,sans-serif;font-size:13px;" onclick="P2PPm.cancelUpdateDetail()">Cancel</button>
            </div>
        </div>

        <!-- panel1 (3,243) fill: panel3 teal 20 "Detail History" / panel5 grdPartyPmTransfer -->
        <div class="pp-teal" style="height:20px;">
            <span class="pp-teal-title" style="left:3px;top:1px;font-size:13px;line-height:16px;">Detail History</span>
            <!-- ctrlGrdBar3 (885,-2) 38 x 22 -->
            <button type="button" class="pp-abs" title="Grid layout / print / export options are not ported" style="right:3px;top:-1px;width:38px;height:22px;background:transparent;color:#fff;border:none;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div id="gridFormHost" class="pp-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdPartyPmTransfer"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <!-- ================================================================== tabHistory "History" -->
    <div id="tabHistory" class="win-tab-panel pp-page">
        <!-- panel4 (3,3) 864 x 28: toolStrip2 -->
        <div class="pp-strip" style="height:28px;">
            <button type="button" class="pp-tool" id="btnNewHistory" style="width:64px;height:22px;" onclick="P2PPm.resetHistory()"><i class="fa fa-file-o"></i> Reset</button>
        </div>
        <!-- panel6 (3,31) 864 x 23, teal: label10 "History" Tahoma 12pt bold -->
        <div class="pp-teal" style="height:23px;">
            <span class="pp-teal-title" style="left:2px;top:1px;font-size:16px;line-height:19px;">History</span>
            <!-- ctrlGrdBar2 (818,-1) 44 x 23 -->
            <button type="button" class="pp-abs" title="Grid layout / print / export options are not ported" style="right:2px;top:0;width:44px;height:23px;background:transparent;color:#fff;border:none;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <!-- panel8 (3,54) 864 x 75: groupBox3 "Filters" (3,3) 792 x 69, Tahoma 9.75pt bold -->
        <div id="historySection" style="position:relative;height:75px;background:#fff;">
            <div class="pp-gb" style="left:3px;top:3px;width:792px;height:69px;">
                <span class="pp-cap" style="font-family:Tahoma,sans-serif;">Filters</span>
                <label class="pp-abs pp-lbl" style="left:5px;top:19px;">From Date</label>
                <div class="pp-abs pp-dtc" style="left:5px;top:38px;width:131px;"><input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory"></div>
                <label class="pp-abs pp-lbl" style="left:139px;top:19px;">To Date</label>
                <div class="pp-abs pp-dtc" style="left:139px;top:38px;width:131px;"><input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory"></div>
                <label class="pp-abs pp-lbl" for="txtFromDocNoHistory" style="left:274px;top:19px;">From Doc No</label>
                <input type="text" id="txtFromDocNoHistory" class="pp-abs pp-txt sb" style="left:274px;top:38px;width:100px;" inputmode="numeric" autocomplete="off">
                <label class="pp-abs pp-lbl" for="txtToDocNoHistory" style="left:376px;top:19px;">To Doc No</label>
                <input type="text" id="txtToDocNoHistory" class="pp-abs pp-txt sb" style="left:376px;top:38px;width:100px;" inputmode="numeric" autocomplete="off">
                <button type="button" id="btnshow" class="pp-abs" style="left:481px;top:36px;width:53px;height:26px;background:rgb(10,110,110);color:#fff;border:1px solid #064848;font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;font-weight:bold;cursor:pointer;" onclick="P2PPm.showHistory()">Show</button>
                <label class="pp-abs pp-radio" style="left:540px;top:22px;width:75px;"><input type="radio" name="p2pHist" id="rdpqtydoc" checked>Doc Date</label>
                <label class="pp-abs pp-radio" style="left:624px;top:22px;width:91px;"><input type="radio" name="p2pHist" id="rdpqtymodify">Modify Date</label>
                <label class="pp-abs pp-radio" style="left:541px;top:45px;width:80px;"><input type="radio" name="p2pHist" id="rdpqtyentry">Entry Date</label>
                <label class="pp-abs pp-radio" style="left:624px;top:45px;width:105px;"><input type="radio" name="p2pHist" id="rdapproved">Approved Date</label>
            </div>
        </div>
        <!-- panel9 (3,129) 864 x 253: grdhistory -->
        <div id="gridHistoryHost" class="pp-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdhistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <!-- panel10 (3,382) 864 x 18, teal -->
        <div class="pp-teal" style="height:18px;">
            <span class="pp-teal-title" style="left:2px;top:1px;font-size:13px;line-height:16px;">Detail Of Above Selected Row</span>
        </div>
        <!-- panel11 fill: grddetail -->
        <div id="gridDetailHost" class="pp-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grddetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>

    <!-- tabControl1 tab strip (Alignment = Bottom) -->
    <div class="win-tabs pp-tabs">
        <div class="win-tab is-active" data-tab="tabForm" onclick="P2PPm.tab('tabForm')">Form</div>
        <div class="win-tab" data-tab="tabHistory" onclick="P2PPm.tab('tabHistory')">History</div>
    </div>
</div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_party_to_party_pm_transfer.js?v=20260925a}"></script>
</body>
</html>
