<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Purchase Demand Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* StorePurchaseDemandRegister designer geometry, 1:1 in px (ClientSize 957 x 561).
           Docked panels stretch with the window; every control keeps its designer Location/Size. */
        body { background: #fff; padding-bottom: 36px; }
        .ra-scroll { overflow-x: auto; }
        .ra-root { min-width: 957px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .ra-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .ra-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; line-height: 17px; color: #000; background: #fff; }
        .ra-lbl9 { font-size: 12px; line-height: 15px; }
        .ra-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .ra-txt.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-cmb.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-gb { position: absolute; box-sizing: border-box; }
        .ra-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .ra-gb > .ra-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .ra-teal { background: #008080; position: relative; }
        .ra-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .ra-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; }
        .ra-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
        .ra-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .ra-tool:disabled { color: #9a9a9a; cursor: default; }
        .ra-show { background: #008080; color: #fff; border: 1px solid #005959; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; }
        .ra-hbtn { border: 1px solid transparent; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
        .ra-grid-host { height: calc(100vh - 234px - 36px - 21px); min-height: 240px; overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; }
        .ra-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .ra-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; white-space: nowrap; }
        .ra-grid-host .win-grid td { border: 1px solid #d5e1f0; white-space: nowrap; }
        .ra-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .ra-grid-host .win-grid tfoot td { background: #f3f1e7; font-weight: bold; border: 1px solid #c9c3a8; }
        .ra-grid-host .win-grid td a.rpta-link { color: #0645ad; text-decoration: underline; cursor: pointer; }
        .ra-grid-host .win-grid td .rpta-cellbtn { font-size: 8pt; padding: 0 6px; height: 20px; }
        .ra-nav { font-family: Verdana, sans-serif; font-size: 11px; padding: 2px 6px; border-top: 1px solid #9eb6ce; background: #eef4fb; height: 20px; box-sizing: border-box; }
        /* CmbBranchName — UltraCombo with a checked list (BranchesFill:249-261) */
        .ra-branch > summary { list-style: none; height: 26px; line-height: 22px; border: 1px solid #7a7a7a; padding: 1px 18px 1px 3px; background: #fff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-branch > summary::-webkit-details-marker { display: none; }
        .ra-branch > summary::after { content: "\25BE"; position: absolute; right: 5px; top: 4px; }
        .ra-branch > div { position: absolute; z-index: 50; background: #fff; border: 1px solid #7a7a7a; min-width: 100%; max-height: 220px; overflow: auto; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
        .ra-branch label { display: flex; gap: 6px; align-items: center; padding: 2px 6px; font-size: 12px; white-space: nowrap; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; }
        .ra-branch label.hdr { border-bottom: 1px solid #ddd; font-weight: bold; }
        .ra-branch > summary { font-family: Verdana, sans-serif; font-size: 13px; }
        .ra-lbl { background: transparent; }
        .ra-show { font-family: Verdana, sans-serif; }
        .ra-grid-host .win-grid td input.rpta-remarks { min-width: 130px; height: 20px; font-size: 8pt; }
        .ra-grid-host .win-grid th.rpta-frozen, .ra-grid-host .win-grid td.rpta-frozen { position: sticky; left: 0; z-index: 6; background: #f7f5ed; }
    </style>
</head>
<body>
<!-- Screen 452, StorePurchaseDemandRegister.cs (Architecture.WinApp.Inventory_Reports), module 46. -->
<div class="ra-scroll">
<div class="ra-root">

    <!-- panel2 (0,0) 957 x 54, teal: toolStrip3 (0,0) 957 x 27 white + label23 (8,30) -->
    <div class="ra-teal" style="height:54px;">
        <div class="ra-strip" style="background:#fff;">
            <button type="button" class="ra-tool" id="btnNew" style="width:59px" onclick="RptPDR.newForm()"><i class="fa fa-plus-circle" style="color:#008080"></i> New</button>
            <button type="button" class="ra-tool" id="toolStripButton1" style="width:80px" onclick="RptPDR.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
            <button type="button" class="ra-tool" id="print" style="width:115px" onclick="RptPDR.printRegister()"><i class="fa fa-print"></i> 456-Register</button>
            <button type="button" class="ra-tool" id="btnShortCutKeys" style="width:121px" disabled title="Keyboard shortcuts are not ported"><i class="fa fa-keyboard-o"></i> ShortCutKeys</button>
            <a href="/modules" class="ra-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
        <span class="ra-teal-title" id="label23" style="left:8px;top:30px;">Store Purchase Demand Register</span>
    </div>

    <!-- panel4 (0,54) 957 x 157, white, Verdana 9.75; labels Segoe UI Semibold 9 bold -->
    <div style="position:relative;height:157px;background:#fff;">
        <span class="ra-abs ra-lbl ra-lbl9" style="left:6px;top:13px;">Branch Name</span>
        <details class="ra-abs ra-branch" id="CmbBranchName" style="left:98px;top:7px;width:234px;"><summary id="CmbBranchNameText">&nbsp;</summary><div id="CmbBranchNameList"></div></details>

        <label class="ra-abs ra-lbl ra-lbl9" for="cmbperemeter" style="left:6px;top:42px;">Date Type</label>
        <select id="cmbperemeter" class="ra-abs ra-cmb win-combo" style="left:98px;top:36px;width:234px;" onchange="RptPDR.dateTypeChanged()"></select>

        <span class="ra-abs ra-lbl ra-lbl9" style="left:6px;top:71px;">From &amp; To Date</span>
        <input type="date" id="fromdate" class="ra-abs ra-dt" style="left:98px;top:67px;width:116px;">
        <input type="date" id="ToDate" class="ra-abs ra-dt" style="left:216px;top:67px;width:116px;">

        <!-- label3 reads "From && To Date" on the desktop although the two boxes are the Doc No range. -->
        <span class="ra-abs ra-lbl ra-lbl9" style="left:6px;top:99px;">From &amp; To Date</span>
        <input type="text" id="txtGrnNoFrom" class="ra-abs ra-txt rpta-int" style="left:98px;top:95px;width:116px;" autocomplete="off">
        <input type="text" id="txtGrnNoTo" class="ra-abs ra-txt rpta-int" style="left:216px;top:95px;width:116px;" autocomplete="off">

        <label class="ra-abs ra-lbl ra-lbl9" for="CmbParentCategory" style="left:6px;top:127px;">Parent Category</label>
        <select id="CmbParentCategory" class="ra-abs ra-cmb win-combo" style="left:98px;top:121px;width:234px;"></select>

        <label class="ra-abs ra-lbl ra-lbl9" for="CmbItemCategory" style="left:333px;top:13px;">Item Category</label>
        <select id="CmbItemCategory" class="ra-abs ra-cmb win-combo" style="left:417px;top:7px;width:220px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbItemType" style="left:333px;top:42px;">Item Type</label>
        <select id="CmbItemType" class="ra-abs ra-cmb win-combo" style="left:417px;top:36px;width:220px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbJobLotName" style="left:333px;top:71px;">JobLot</label>
        <select id="CmbJobLotName" class="ra-abs ra-cmb win-combo" style="left:417px;top:65px;width:220px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbItem" style="left:333px;top:99px;">Item Name</label>
        <select id="CmbItem" class="ra-abs ra-cmb win-combo" style="left:417px;top:93px;width:220px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbDepartment" style="left:333px;top:127px;">Department</label>
        <select id="CmbDepartment" class="ra-abs ra-cmb win-combo" style="left:417px;top:121px;width:220px;"></select>

        <label class="ra-abs ra-lbl ra-lbl9" for="cmbAssetsRef" style="left:641px;top:13px;">Fixed Assets</label>
        <select id="cmbAssetsRef" class="ra-abs ra-cmb win-combo" style="left:734px;top:7px;width:214px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbStatus" style="left:641px;top:42px;">Status</label>
        <select id="CmbStatus" class="ra-abs ra-cmb win-combo" style="left:734px;top:36px;width:214px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbApproved" style="left:641px;top:71px;">Approval Status</label>
        <select id="CmbApproved" class="ra-abs ra-cmb win-combo" style="left:734px;top:65px;width:144px;"></select>

        <button type="button" id="btnshow" class="ra-abs ra-show" style="left:883px;top:65px;width:65px;height:26px;" onclick="RptPDR.show()">Show</button>
    </div>

    <!-- panel5 (0,211) fill: panel6 teal 23 / grdPurchaseDemandRegister -->
    <div id="historySection">
        <div class="ra-teal" style="height:23px;">
            <span class="ra-teal-title" id="label1" style="left:3px;top:1px;">Filtered Records</span>
            <!-- ctrlGrdBar2 (903,0) 51 x 22, anchored Top|Right -->
            <button type="button" class="ra-abs ra-hbtn" id="ctrlGrdBar2" title="Grid layout / print / export options are not ported" style="right:3px;top:0;width:51px;height:22px;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div class="ra-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdPurchaseDemandRegister"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ra-nav" id="gridNavigator">&nbsp;</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the grid). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="RptPDR.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<!-- NoOfAttachments link → AttachmentView (AttachmentName, CustomName, EntryDate) -->
<div class="cx-modal" id="dlgAttachment">
    <div class="cx-modal-box small">
        <div class="cx-modal-head"><span>Attachments</span><button type="button" onclick="StoreCommon.closeModal('dlgAttachment')">&times;</button></div>
        <div class="cx-modal-body">
            <div class="win-grid-container"><div class="win-grid-scroll"><table class="win-grid" id="grdAttachments"><thead></thead><tbody></tbody></table></div></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_rpt_store_purchase_demand_register.js?v=20260925a}"></script>
</body>
