<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Purchase Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* StorePurchaseRegister designer geometry, 1:1 in px (ClientSize 964 x 588, maximized).
           Docked panels stretch with the window; every control keeps its designer Location/Size. */
        body { background: #fff; padding-bottom: 36px; }
        .ra-scroll { overflow-x: auto; }
        .ra-root { min-width: 964px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .ra-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .ra-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; line-height: 17px; color: #000; background: #fff; }
        .ra-lbl9 { font-size: 12px; line-height: 15px; }
        .ra-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .ra-txt.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-cmb.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-gb { position: absolute; box-sizing: border-box; }
        .ra-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .ra-gb > .ra-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .ra-teal { background: #008080; position: relative; }
        .ra-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .ra-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; }
        .ra-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
        .ra-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .ra-tool:disabled { color: #9a9a9a; cursor: default; }
        .ra-show { background: #008080; color: #fff; border: 1px solid #005959; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; }
        .ra-hbtn { border: 1px solid transparent; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
        .ra-grid-host { height: calc(100vh - 251px - 36px - 21px); min-height: 240px; overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; }
        .ra-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .ra-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; white-space: nowrap; }
        .ra-grid-host .win-grid td { border: 1px solid #d5e1f0; white-space: nowrap; }
        .ra-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .ra-grid-host .win-grid tfoot td { background: #f3f1e7; font-weight: bold; border: 1px solid #c9c3a8; }
        .ra-grid-host .win-grid td a.rpta-link { color: #0645ad; text-decoration: underline; cursor: pointer; }
        .ra-grid-host .win-grid td .rpta-cellbtn { font-size: 8pt; padding: 0 6px; height: 20px; }
        .ra-nav { font-family: Verdana, sans-serif; font-size: 11px; padding: 2px 6px; border-top: 1px solid #9eb6ce; background: #eef4fb; height: 20px; box-sizing: border-box; }
        /* cmbBranchName — UltraCombo with a checked list (BranchesFill:173-185) */
        .ra-branch > summary { list-style: none; height: 26px; line-height: 22px; border: 1px solid #7a7a7a; padding: 1px 18px 1px 3px; background: #fff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-branch > summary::-webkit-details-marker { display: none; }
        .ra-branch > summary::after { content: "\25BE"; position: absolute; right: 5px; top: 4px; }
        .ra-branch > div { position: absolute; z-index: 50; background: #fff; border: 1px solid #7a7a7a; min-width: 100%; max-height: 220px; overflow: auto; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
        .ra-branch label { display: flex; gap: 6px; align-items: center; padding: 2px 6px; font-size: 12px; white-space: nowrap; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; }
        .ra-branch label.hdr { border-bottom: 1px solid #ddd; font-weight: bold; }
    </style>
</head>
<body>
<!-- Screen 333, StorePurchaseRegister.cs (Architecture.WinApp.Inventory_Reports), module 46. -->
<div class="ra-scroll">
<div class="ra-root">

    <!-- panel1 (0,0) 964 x 30, white / toolStrip1 (0,0) 964 x 27, Verdana 9.75 -->
    <div style="height:30px;background:#fff;">
        <div class="ra-strip">
            <button type="button" class="ra-tool" id="btnRefresh" style="width:59px" onclick="RptSPR.newForm()"><i class="fa fa-plus-circle" style="color:#008080"></i> New</button>
            <button type="button" class="ra-tool" id="toolStripButton1" style="width:80px" onclick="RptSPR.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
            <button type="button" class="ra-tool" id="BtnPrintRegister" style="width:92px" onclick="RptSPR.printRegister()"><i class="fa fa-print"></i> Print-458</button>
            <button type="button" class="ra-tool" id="btnShortCutKey" style="width:126px" disabled title="Keyboard shortcuts are not ported"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
            <a href="/modules" class="ra-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
    </div>

    <!-- panel3 (0,30) 964 x 29, teal; lblCaption (6,4) Tahoma 12pt bold -->
    <div class="ra-teal" style="height:29px;">
        <span class="ra-teal-title" id="lblCaption" style="left:6px;top:4px;">Store Purchase Register</span>
    </div>

    <!-- panel5 (0,59) 964 x 163 -->
    <div style="position:relative;height:163px;background:#fff;">
        <!-- groupBox1 (5,2) 946 x 156 "Filters", Tahoma 9.75 bold -->
        <div class="ra-gb" style="left:5px;top:2px;width:946px;height:156px;background:#fff;">
            <span class="ra-cap">Filters</span>

            <span class="ra-abs ra-lbl ra-lbl9" style="left:4px;top:21px;">Branch Name</span>
            <details class="ra-abs ra-branch" id="cmbBranchName" style="left:115px;top:15px;width:233px;"><summary id="cmbBranchNameText">&nbsp;</summary><div id="cmbBranchNameList"></div></details>

            <span class="ra-abs ra-lbl" style="left:4px;top:47px;">Date From &amp; To</span>
            <input type="date" id="FromDate" class="ra-abs ra-dt" style="left:115px;top:44px;width:114px;">
            <input type="date" id="ToDate" class="ra-abs ra-dt" style="left:234px;top:44px;width:114px;">

            <span class="ra-abs ra-lbl ra-lbl9" style="left:4px;top:75px;">P . O No From &amp; To</span>
            <input type="text" id="txtOrderNoFrm" class="ra-abs ra-txt rpta-int" style="left:115px;top:71px;width:114px;" autocomplete="off">
            <input type="text" id="txtOrderNoTo" class="ra-abs ra-txt rpta-int" style="left:234px;top:71px;width:114px;" autocomplete="off">

            <span class="ra-abs ra-lbl ra-lbl9" style="left:4px;top:102px;">GRN No From &amp; To</span>
            <input type="text" id="txtGrnNoFrom" class="ra-abs ra-txt ms rpta-int" style="left:115px;top:98px;width:114px;" autocomplete="off">
            <input type="text" id="txtGrnNoTo" class="ra-abs ra-txt ms rpta-int" style="left:234px;top:98px;width:114px;" autocomplete="off">

            <span class="ra-abs ra-lbl ra-lbl9" style="left:4px;top:128px;">GP NoFrom &amp; To</span>
            <input type="text" id="GpsNoFrom" class="ra-abs ra-txt ms rpta-int" style="left:115px;top:124px;width:114px;" autocomplete="off">
            <input type="text" id="GpsNoTo" class="ra-abs ra-txt ms rpta-int" style="left:234px;top:124px;width:114px;" autocomplete="off">

            <label class="ra-abs ra-lbl" for="CmbItemParentCategory" style="left:353px;top:20px;">Parent Category</label>
            <select id="CmbItemParentCategory" class="ra-abs ra-cmb win-combo" style="left:461px;top:15px;width:172px;"></select>
            <label class="ra-abs ra-lbl" for="CmbItemCategory" style="left:353px;top:47px;">Item Category</label>
            <select id="CmbItemCategory" class="ra-abs ra-cmb win-combo" style="left:461px;top:42px;width:172px;"></select>
            <label class="ra-abs ra-lbl" for="CmbItemType" style="left:353px;top:74px;">Item Type</label>
            <select id="CmbItemType" class="ra-abs ra-cmb win-combo" style="left:461px;top:69px;width:172px;"></select>
            <label class="ra-abs ra-lbl ra-lbl9" for="CmbWarehouseName" style="left:353px;top:102px;">WarehouseName</label>
            <select id="CmbWarehouseName" class="ra-abs ra-cmb ms win-combo" style="left:461px;top:96px;width:172px;"></select>
            <label class="ra-abs ra-lbl" for="CmbItemName" style="left:353px;top:129px;">Item Name</label>
            <select id="CmbItemName" class="ra-abs ra-cmb win-combo" style="left:461px;top:124px;width:172px;"></select>

            <label class="ra-abs ra-lbl ra-lbl9" for="CmbSupplier" style="left:637px;top:21px;">Supplier Name</label>
            <select id="CmbSupplier" class="ra-abs ra-cmb win-combo" style="left:724px;top:15px;width:218px;"></select>

            <button type="button" id="btnshow" class="ra-abs ra-show" style="left:880px;top:42px;width:61px;height:26px;" onclick="RptSPR.show()">Show</button>
        </div>
    </div>

    <!-- panel2 (0,222) fill: panel4 teal 29 / panel6 grid -->
    <div id="historySection">
        <div class="ra-teal" style="height:29px;">
            <span class="ra-teal-title" id="label5" style="left:4px;top:5px;">Detailed Information</span>
            <!-- ctrlGrdBar1 (914,2) 45 x 24, anchored Top|Right -->
            <button type="button" class="ra-abs ra-hbtn" id="ctrlGrdBar1" title="Grid layout / print / export options are not ported" style="right:5px;top:2px;width:45px;height:24px;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div class="ra-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ra-nav" id="grdfrmNavigator">&nbsp;</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the grid). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="RptSPR.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<!-- NoOfAttachments link → AttachmentView (AttachmentName, CustomName, EntryDate) -->
<div class="cx-modal" id="dlgAttachment">
    <div class="cx-modal-box small">
        <div class="cx-modal-head"><span>Attachments</span><button type="button" onclick="StoreCommon.closeModal('dlgAttachment')">&times;</button></div>
        <div class="cx-modal-body">
            <div class="win-grid-container"><div class="win-grid-scroll"><table class="win-grid" id="grdAttachments"><thead></thead><tbody></tbody></table></div></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_rpt_store_purchase_register.js?v=20260925a}"></script>
</body>
</html>
