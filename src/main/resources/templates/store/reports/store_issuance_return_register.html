<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Issuance Return Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* StoreIssuanceReturnRegister designer geometry, 1:1 in px (ClientSize 1109 x 610).
           Docked panels stretch with the window; every control keeps its designer Location/Size. */
        body { background: #fff; padding-bottom: 36px; }
        .ra-scroll { overflow-x: auto; }
        .ra-root { min-width: 1109px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .ra-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .ra-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 13px; white-space: nowrap; line-height: 17px; color: #000; background: #fff; }
        .ra-lbl9 { font-size: 12px; line-height: 15px; }
        .ra-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .ra-txt.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-cmb.ms { font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 13.5px; }
        .ra-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ra-gb { position: absolute; box-sizing: border-box; }
        .ra-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .ra-gb > .ra-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .ra-teal { background: #008080; position: relative; }
        .ra-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .ra-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; }
        .ra-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
        .ra-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .ra-tool:disabled { color: #9a9a9a; cursor: default; }
        .ra-show { background: #008080; color: #fff; border: 1px solid #005959; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; }
        .ra-hbtn { border: 1px solid transparent; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
        .ra-grid-host { height: calc(100vh - 210px - 36px - 21px); min-height: 240px; overflow: auto; border-top: 1px solid #9eb6ce; background: #fff; }
        .ra-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .ra-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; white-space: nowrap; }
        .ra-grid-host .win-grid td { border: 1px solid #d5e1f0; white-space: nowrap; }
        .ra-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .ra-grid-host .win-grid tfoot td { background: #f3f1e7; font-weight: bold; border: 1px solid #c9c3a8; }
        .ra-grid-host .win-grid td a.rpta-link { color: #0645ad; text-decoration: underline; cursor: pointer; }
        .ra-grid-host .win-grid td .rpta-cellbtn { font-size: 8pt; padding: 0 6px; height: 20px; }
        .ra-nav { font-family: Verdana, sans-serif; font-size: 11px; padding: 2px 6px; border-top: 1px solid #9eb6ce; background: #eef4fb; height: 20px; box-sizing: border-box; }
        .ra-tool.segoe { font-family: "Segoe UI", Tahoma, sans-serif; }
        .ra-show { font-family: Verdana, sans-serif; }
        .ra-grid-host .win-grid th { white-space: normal; }
        .ra-grid-host .win-grid th.rpta-frozen, .ra-grid-host .win-grid td.rpta-frozen { position: sticky; z-index: 6; background: #f7f5ed; }
        .ra-grid-host .win-grid td.c { text-align: center; }
    </style>
</head>
<body>
<!-- Screen 453, StoreIssuanceReturnRegister.cs (Architecture.WinApp.Inventory_Reports), module 46. -->
<div class="ra-scroll">
<div class="ra-root">

    <!-- panel1 (0,0) 1109 x 30, white / toolStrip1 (0,0) 1109 x 27, Segoe UI 9.75 -->
    <div style="height:30px;background:#fff;">
        <div class="ra-strip">
            <button type="button" class="ra-tool segoe" id="btnRefresh" style="width:58px" onclick="RptSRR.newForm()"><i class="fa fa-plus-circle" style="color:#008080"></i> New</button>
            <button type="button" class="ra-tool segoe" id="toolStripButton1" style="width:76px" onclick="RptSRR.refresh()"><i class="fa fa-refresh"></i> Refresh</button>
            <!-- tsPrintDropDown lists the desktop's "StoreIssuancReturn" report folder (D2): one entry here -->
            <button type="button" class="ra-tool segoe" id="tsPrintDropDown" style="width:67px" onclick="RptSRR.printRegister()"><i class="fa fa-print"></i> Print <i class="fa fa-caret-down" style="font-size:10px"></i></button>
            <a href="/modules" class="ra-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
    </div>

    <!-- panel3 (0,30) 1109 x 30, teal; lblCaption (4,4) Tahoma 12pt bold -->
    <div class="ra-teal" style="height:30px;">
        <span class="ra-teal-title" id="lblCaption" style="left:4px;top:4px;">Store Issuance Return Register</span>
    </div>

    <!-- panel5 (0,60) 1109 x 120, Verdana 9.75; labels Segoe UI Semibold 9 bold -->
    <div style="position:relative;height:120px;background:#fff;">
        <span class="ra-abs ra-lbl ra-lbl9" style="left:10px;top:8px;">Date From</span>
        <input type="date" id="FromDate" class="ra-abs ra-dt" style="left:13px;top:31px;width:100px;">
        <span class="ra-abs ra-lbl ra-lbl9" style="left:113px;top:8px;">Date To</span>
        <input type="date" id="ToDate" class="ra-abs ra-dt" style="left:116px;top:31px;width:98px;">
        <label class="ra-abs ra-lbl ra-lbl9" for="txtFromDocNo" style="left:214px;top:8px;">DocNo From</label>
        <input type="text" id="txtFromDocNo" class="ra-abs ra-txt rpta-int" style="left:217px;top:31px;width:100px;" autocomplete="off">
        <label class="ra-abs ra-lbl ra-lbl9" for="txtDocNoTo" style="left:317px;top:8px;">DocNo To</label>
        <input type="text" id="txtDocNoTo" class="ra-abs ra-txt rpta-int" style="left:320px;top:31px;width:100px;" autocomplete="off">
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbDepartmentName" style="left:419px;top:8px;">Department Name</label>
        <select id="CmbDepartmentName" class="ra-abs ra-cmb win-combo" style="left:422px;top:29px;width:179px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbAssetName" style="left:601px;top:8px;">Asset Name</label>
        <select id="CmbAssetName" class="ra-abs ra-cmb win-combo" style="left:604px;top:29px;width:179px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbItemName" style="left:784px;top:8px;">Item Name</label>
        <select id="CmbItemName" class="ra-abs ra-cmb win-combo" style="left:787px;top:29px;width:305px;"></select>

        <label class="ra-abs ra-lbl ra-lbl9" for="CmbAccountTitle" style="left:12px;top:64px;">Account Title</label>
        <select id="CmbAccountTitle" class="ra-abs ra-cmb win-combo" style="left:12px;top:84px;width:302px;"></select>
        <label class="ra-abs ra-lbl ra-lbl9" for="CmbWareHouse" style="left:317px;top:64px;background:transparent;">WareHouse</label>
        <select id="CmbWareHouse" class="ra-abs ra-cmb win-combo" style="left:320px;top:84px;width:258px;"></select>
        <button type="button" id="btnshow" class="ra-abs ra-show" style="left:582px;top:84px;width:61px;height:26px;" onclick="RptSRR.show()">Show</button>
    </div>

    <!-- panel2 (0,180) fill: panel4 teal 30 / grdfrm -->
    <div id="historySection">
        <div class="ra-teal" style="height:30px;">
            <span class="ra-teal-title" id="label10" style="left:4px;top:4px;">History</span>
            <!-- ctrlGrdBar2 (1059,0) 47 x 30, anchored Top|Right -->
            <button type="button" class="ra-abs ra-hbtn" id="ctrlGrdBar2" title="Grid layout / print / export options are not ported" style="right:3px;top:0;width:47px;height:30px;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div class="ra-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="ra-nav" id="grdfrmNavigator">&nbsp;</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the grid). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="RptSRR.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<!-- NoOfAttachments link → AttachmentView (AttachmentName, CustomName, EntryDate) -->
<div class="cx-modal" id="dlgAttachment">
    <div class="cx-modal-box small">
        <div class="cx-modal-head"><span>Attachments</span><button type="button" onclick="StoreCommon.closeModal('dlgAttachment')">&times;</button></div>
        <div class="cx-modal-body">
            <div class="win-grid-container"><div class="win-grid-scroll"><table class="win-grid" id="grdAttachments"><thead></thead><tbody></tbody></table></div></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_rpt_store_issuance_return_register.js?v=20260925a}"></script>
</body>
</html>
