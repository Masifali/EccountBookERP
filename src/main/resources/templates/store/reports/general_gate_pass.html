<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>General Gate Pass Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* frmGatePassGeneral designer geometry, 1:1 in px (ClientSize 851 x 561). Docked panels
           stretch with the window like the maximized form; every control keeps its designer
           Location/Size inside its container. */
        body { background: #fff; padding-bottom: 36px; margin: 0; }
        .rc-scroll { overflow-x: auto; }
        .rc-root { min-width: 851px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .rc-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .rc-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; line-height: 15px; white-space: nowrap; color: #000; }
        .rc-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .rc-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .rc-dt { font-family: Verdana, sans-serif; font-size: 12px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .rc-gb { position: absolute; box-sizing: border-box; }
        .rc-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .rc-gb > .rc-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .rc-teal { background: #008080; position: relative; }
        .rc-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .rc-strip { height: 25px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .rc-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
        .rc-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .rc-show { background: #008080; color: #fff; border: 1px solid #005959; font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; padding: 0; }
        .rc-hbtn { height: 24px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; background: transparent; color: #fff; }
        .rc-grid-host { height: calc(100vh - 300px); min-height: 250px; overflow: auto; background: #fff; }
        .rc-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .rc-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; text-align: center; }
        .rc-grid-host .win-grid td { border: 1px solid #d5e1f0; white-space: nowrap; }
        .rc-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
        .rc-grid-host .cx-filter-row th { padding: 1px; background: #f4f8f8; }
        .rc-grid-host .cx-filter-row input { height: 20px; font-size: 8pt; width: 100%; min-width: 50px; box-sizing: border-box; }
        .rc-grid-host tfoot td { background: #eef5f5; border-top: 2px solid #7a9a9e; position: sticky; bottom: 0; }
        #DataGridHistory .cx-frozen { position: sticky; left: 0; z-index: 1; background: #fff; }
        #DataGridHistory thead .cx-frozen { background: #e0f2f1; z-index: 2; }
        #DataGridHistory tfoot .cx-frozen { background: #eef5f5; z-index: 2; }
        .rc-nav { font-family: Verdana, sans-serif; font-size: 11px; padding: 2px 6px; border-top: 1px solid #9eb6ce; background: #eef4fb; }
    </style>
</head>
<body>
<!-- Screen 460 "General Gate Pass  Report", frmGatePassGeneral.cs, ScreenName frmGatePassGeneral (a register — no save). -->
<div class="rc-scroll">
<div class="rc-root">

    <!-- panel2 (0,0) 851 x 25 / toolStrip3 (Verdana 9.75pt): New, Refresh, 255-Register, ShortCut Keys -->
    <div class="rc-strip">
        <button type="button" class="rc-tool" id="btnNew" style="width:59px" onclick="RptGatePassGeneral.reset()"><i class="fa fa-plus-circle" style="color:#2e7d32"></i> New</button>
        <button type="button" class="rc-tool" id="btnRefresh" style="width:80px" onclick="RptGatePassGeneral.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
        <button type="button" class="rc-tool" id="btnPrint" style="width:115px" onclick="RptGatePassGeneral.print255()"><i class="fa fa-print"></i> 255-Register</button>
        <button type="button" class="rc-tool" id="btnshortcut" style="width:106px" onclick="RptGatePassGeneral.shortcutKeys()">ShortCut Keys</button>
        <a href="/modules" class="rc-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel3 (0,25) 851 x 29 teal; label23 (2,5) Tahoma 12pt bold -->
    <div class="rc-teal" style="height:29px;">
        <span class="rc-teal-title" id="label23" style="left:2px;top:5px;">GatePass General</span>
    </div>

    <!-- panel4 (0,54) 851 x 138 white -->
    <div style="position:relative;height:138px;background:#fff;">
        <!-- groupBox1 (4,3) 662 x 131 "Filters", Tahoma 9.75pt bold. DOM order = designer TabIndex. -->
        <div class="rc-gb" style="left:4px;top:3px;width:662px;height:131px;background:#fff;">
            <span class="rc-cap">Filters</span>
            <label class="rc-abs rc-lbl" for="cmbDateType" style="left:10px;top:22px;">Date Type</label>
            <select id="cmbDateType" class="rc-abs rc-cmb win-combo" style="left:78px;top:16px;width:250px;" onchange="RptGatePassGeneral.dateTypeChanged()"></select>
            <label class="rc-abs rc-lbl" for="fromdate" style="left:10px;top:50px;">From Date</label>
            <input type="date" id="fromdate" class="rc-abs rc-dt" style="left:78px;top:46px;width:250px;">
            <label class="rc-abs rc-lbl" for="ToDate" style="left:10px;top:77px;">To Date</label>
            <input type="date" id="ToDate" class="rc-abs rc-dt" style="left:78px;top:73px;width:250px;">
            <label class="rc-abs rc-lbl" for="GpsNoFrom" style="left:10px;top:101px;">GP From</label>
            <input type="text" id="GpsNoFrom" class="rc-abs rc-txt" style="left:78px;top:97px;width:98px;" inputmode="numeric" autocomplete="off">
            <label class="rc-abs rc-lbl" for="GpsNoTo" style="left:182px;top:101px;">GP To</label>
            <input type="text" id="GpsNoTo" class="rc-abs rc-txt" style="left:231px;top:97px;width:97px;" inputmode="numeric" autocomplete="off">
            <label class="rc-abs rc-lbl" for="cmbWeightStatus" style="left:335px;top:22px;">Weight Status</label>
            <select id="cmbWeightStatus" class="rc-abs rc-cmb win-combo" style="left:435px;top:16px;width:217px;"></select>
            <label class="rc-abs rc-lbl" for="cmbStatus" style="left:335px;top:50px;">Status</label>
            <select id="cmbStatus" class="rc-abs rc-cmb win-combo" style="left:435px;top:44px;width:217px;"></select>
            <label class="rc-abs rc-lbl" for="cmbDocumentType" style="left:335px;top:77px;">Document Type</label>
            <select id="cmbDocumentType" class="rc-abs rc-cmb win-combo" style="left:434px;top:71px;width:218px;"></select>
            <button type="button" id="btnshow" class="rc-abs rc-show" style="left:581px;top:99px;width:71px;height:26px;" onclick="RptGatePassGeneral.show()">Show</button>
        </div>
    </div>

    <!-- panel5 (0,192) fill: panel6 teal 29 "History" + ctrlGrdBar1 (803,1) 41x24 Top|Right; DataGridHistory fill -->
    <div id="historySection">
        <div class="rc-teal" style="height:29px;">
            <span class="rc-teal-title" style="left:2px;top:5px;">History</span>
            <button type="button" class="rc-abs rc-hbtn" id="ctrlGrdBar1" title="Grid layout / print / export options are not ported" style="right:7px;top:1px;width:41px;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <div class="rc-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="DataGridHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="rc-nav" id="DataGridHistoryNavigator">&nbsp;</div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (the history grid is on the same screen, below the filters). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="RptGatePassGeneral.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_rpt_general_gate_pass.js?v=20260925a}"></script>
</body>
</html>
