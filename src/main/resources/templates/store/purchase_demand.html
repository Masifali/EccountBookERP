<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Demand - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* Screen 340, frmPurchaseDemand designer geometry 1:1 in px (ClientSize 1087 x 588).
           tabControl1 (Alignment Bottom): tabPage1 "Form" / tabPage2 "History" at (4,4) 1079 x 559; docked panels at x=3, 1073 wide. */
        body { background: #fff; margin: 0; padding-bottom: 36px; }
        .dz-scroll { overflow-x: auto; }
        .dz-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .dz-p { position: relative; background: #fff; }
        .dz-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .dz-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; line-height: 15px; white-space: nowrap; color: #000; }
        .dz-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .dz-txt[readonly] { background: #f0f0f0; }
        .dz-txt.w[readonly] { background: #fff; }
        .dz-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .dz-txt.r { text-align: right; }
        .dz-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-cmb:disabled { background: #f0f0f0; color: #6d6d6d; }
        .dz-dt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-dtc { display: flex; align-items: center; gap: 2px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 19px; width: 100%; min-width: 0; padding: 0; }
        .dz-dtc input[type=checkbox] { margin: 0; }
        .dz-gb { position: absolute; box-sizing: border-box; }
        .dz-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .dz-gb > .dz-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .dz-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; white-space: nowrap; cursor: pointer; }
        .dz-chk input { margin: 0; }
        .dz-chk.wt { color: #fff; }
        .dz-teal { background: #008080; position: relative; }
        .dz-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .dz-teal-title.s { font-size: 15px; line-height: 18px; }
        .dz-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .dz-strip.white { background: #fff; }
        .dz-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; color: #000; white-space: nowrap; }
        .dz-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .dz-tool:disabled { color: #9a9a9a; cursor: default; }
        .dz-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; flex: none; }
        .dz-btn { font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; background: #008080; color: #fff; border: 1px solid #005959; cursor: pointer; padding: 0; }
        .dz-btn:disabled { opacity: .6; cursor: default; }
        .dz-gbar { width: 38px; height: 22px; background: transparent; color: #fff; border: 1px solid transparent; font-size: 14px; }
        .dz-host { overflow: auto; background: #fff; border-top: 1px solid #9eb6ce; max-height: none; }
        .dz-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .dz-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .dz-host .win-grid td { border: 1px solid #d5e1f0; }
        .dz-host .win-grid tbody tr:hover { background: #fff0cf; }
        .dz-tabs { display: flex; gap: 0; padding-left: 2px; height: 25px; align-items: flex-end; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs .win-tab { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 14px; font-weight: normal; padding: 1px 8px; height: 21px; line-height: 19px; background: #f0f0f0; border: 1px solid #9a9a9a; border-bottom: none; border-radius: 2px 2px 0 0; color: #000; box-sizing: border-box; }
        .dz-tabs .win-tab.is-active { background: #fff; height: 24px; top: 1px; color: #000; }
        .dz-tabs.bottom { border-bottom: none; border-top: 1px solid #9a9a9a; align-items: flex-start; height: 25px; }
        .dz-tabs.bottom .win-tab { font-family: Verdana, sans-serif; font-size: 13px; border-radius: 0 0 2px 2px; border-top: none; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs.bottom .win-tab.is-active { top: -1px; }
        .dz-page { border: 1px solid #9a9a9a; border-top: none; background: #fff; box-sizing: border-box; }
        .dz-modal-box { width: auto !important; max-width: 98vw; background: #fff !important; }
        .dz-modal-box .cx-modal-body { padding: 0; }
        .dz-root { width: 1087px; }
        .dz-tp { width: 1079px; margin: 4px 4px 0 4px; padding: 3px; box-sizing: border-box; background: #fff; }
        .dz-gb.v9 > .dz-cap { font-family: Verdana, sans-serif; font-size: 12px; }
        .dz-gb.v8 > .dz-cap { font-family: Verdana, sans-serif; font-size: 11px; }
        .dz-mini { background: #fff; border: 1px solid #adadad; font-size: 12px; padding: 0; color: #333; }
    </style>
</head>
<body>
<div class="dz-scroll">
<div class="dz-root">

<!-- ============================== tabPage1 "Form" ============================== -->
<div id="tabForm" class="win-tab-panel is-active dz-tp">
    <!-- panel2 (3,3) 1073 x 30; toolStrip3 -->
    <div style="height:30px;background:#fff;">
        <div class="dz-strip">
            <button type="button" class="dz-tool" id="btnNew" style="width:59px" onclick="PurDemand.newDoc()"><i class="fa fa-file-o"></i> New</button>
            <button type="button" class="dz-tool" id="btnRefresh" style="width:80px" onclick="PurDemand.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="dz-tool" id="btnSave" style="width:64px" onclick="PurDemand.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="dz-tool is-hidden" id="btnUpdate" style="width:78px" onclick="PurDemand.update()"><i class="fa fa-refresh"></i> Update</button>
            <span class="dz-sep"></span>
            <button type="button" class="dz-tool" id="btnPrint" style="width:92px" onclick="PurDemand.print()"><i class="fa fa-print"></i> 454-Print</button>
            <button type="button" class="dz-tool" id="btnAttachment" style="width:109px" disabled title="Attachments are not ported"><i class="fa fa-paperclip"></i> Attachment</button>
            <button type="button" class="dz-tool" id="btnCity" style="width:83px" disabled title="Define City form is not ported">Define City</button>
            <button type="button" class="dz-tool" id="btnshortcutkeys" style="width:126px" disabled title="Shortcut key popup is not ported"><i class="fa fa-keyboard-o"></i> ShortCut Keys</button>
            <a href="/modules" class="dz-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
    </div>
    <!-- panel3 (3,33) 1073 x 23 teal -->
    <div class="dz-teal" style="height:23px;">
        <span class="dz-teal-title" id="labelFormCaption" style="left:5px;top:1px;">Purchase Demand Store</span>
        <span id="lblRecId" class="dz-abs" style="left:300px;top:4px;color:#e0f2f1;font-family:Verdana,sans-serif;font-size:11px;"></span>
        <label class="dz-abs dz-chk wt" style="left:989px;top:1px;width:84px;height:20px;font-family:Verdana,sans-serif;font-size:13px;"><input type="checkbox" id="chkPrintPreview" checked> Preview</label>
    </div>
    <div id="rightsNote" class="cx-denied is-hidden"></div>

    <!-- panel4 (3,56) 1073 x 188 -->
    <div class="dz-p" style="height:188px;">
        <!-- groupBox1 "Main Information" (3,2) 1065 x 72 -->
        <div class="dz-gb v9" style="left:3px;top:2px;width:1065px;height:72px;">
            <span class="dz-cap">Main Information</span>
            <label class="dz-abs dz-lbl" for="txtdocnumber" style="left:3px;top:20px;">Doc No,Date</label>
            <input type="text" id="txtdocnumber" class="dz-abs dz-txt r" style="left:94px;top:16px;width:91px;" readonly tabindex="-1">
            <input type="date" id="txtDocdate" class="dz-abs dz-dt" style="left:187px;top:16px;width:125px;height:22px;font-size:12px;" onchange="PurDemand.docDateChanged()">
            <label class="dz-abs dz-lbl" for="CmbParentCategory" style="left:3px;top:48px;">Parent Category</label>
            <select id="CmbParentCategory" class="dz-abs dz-cmb win-combo" style="left:94px;top:42px;width:218px;" disabled></select>
            <label class="dz-abs dz-lbl" for="txtRemarks" style="left:316px;top:19px;width:60px;height:17px;font-size:13px;text-align:center;background:#fff;">Remarks</label>
            <textarea id="txtRemarks" class="dz-abs dz-txt" style="left:382px;top:16px;width:677px;height:52px;resize:none;"></textarea>
        </div>

        <!-- groupBox2 "Detail Information" (3,74) 1065 x 112 -->
        <div class="dz-gb v8" style="left:3px;top:74px;width:1065px;height:112px;">
            <span class="dz-cap">Detail Information</span>
            <label class="dz-abs dz-lbl" for="cmbDepartment" style="left:4px;top:12px;">Department</label>
            <select id="cmbDepartment" class="dz-abs dz-cmb win-combo" style="left:4px;top:29px;width:160px;"></select>
            <button type="button" id="button2" class="dz-abs dz-mini" style="padding:0;left:165px;top:29px;width:26px;height:26px;" onclick="PurDemand.defineDepartment()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>
            <label class="dz-abs dz-lbl" for="txtRequisition" style="left:192px;top:12px;">Requisition By</label>
            <input type="text" id="txtRequisition" class="dz-abs dz-txt" style="left:192px;top:31px;width:140px;">
            <label class="dz-abs dz-lbl" for="txtBarcodeReader" style="left:333px;top:12px;">Bar Code No</label>
            <input type="text" id="txtBarcodeReader" class="dz-abs dz-txt" style="left:333px;top:31px;width:73px;" onkeydown="PurDemand.barcodeKey(event)">
            <label class="dz-abs dz-lbl" for="cmbItem" style="left:409px;top:12px;">Item</label>
            <label class="dz-abs dz-chk" style="left:441px;top:10px;width:57px;"><input type="radio" name="srch" id="rdSearchByName" checked onchange="PurDemand.searchModeChanged()"> Name</label>
            <label class="dz-abs dz-chk" style="left:498px;top:10px;width:52px;"><input type="radio" name="srch" id="rdSearchByCode" onchange="PurDemand.searchModeChanged()"> Code</label>
            <select id="cmbItem" class="dz-abs dz-cmb win-combo" style="left:408px;top:29px;width:190px;" onchange="PurDemand.itemLeave()"></select>
            <label class="dz-abs dz-lbl" for="cmbUOM" style="left:600px;top:12px;">UOM</label>
            <select id="cmbUOM" class="dz-abs dz-cmb win-combo" style="left:600px;top:29px;width:80px;"></select>
            <label class="dz-abs dz-lbl" for="txtRequiredQty" style="left:682px;top:12px;">Required Qty</label>
            <input type="text" id="txtRequiredQty" class="dz-abs dz-txt r" style="left:682px;top:31px;width:77px;" onkeypress="return PurDemand.decimalKey(event, this)" autocomplete="off">
            <label class="dz-abs dz-lbl" for="CmbItemCondition" style="left:761px;top:12px;">Condition</label>
            <select id="CmbItemCondition" class="dz-abs dz-cmb win-combo" style="left:761px;top:29px;width:148px;" onchange="PurDemand.conditionLeave()"></select>
            <label class="dz-abs dz-lbl" for="cmbLot" style="left:911px;top:12px;">JobLot</label>
            <select id="cmbLot" class="dz-abs dz-cmb win-combo" style="left:911px;top:29px;width:150px;"></select>

            <label class="dz-abs dz-lbl" for="cmbAssetsRef" style="left:6px;top:61px;">Assets Ref</label>
            <button type="button" id="btnAssetRefDefine" class="dz-abs dz-mini" style="padding:0;left:142px;top:57px;width:23px;height:22px;" onclick="PurDemand.defineAsset()"><i class="fa fa-plus-circle" style="color:#2e9e3e;font-size:17px;line-height:1;"></i></button>
            <select id="cmbAssetsRef" class="dz-abs dz-cmb win-combo" style="left:4px;top:79px;width:160px;"></select>
            <label class="dz-abs dz-lbl" for="txtRemarksDetail" style="left:168px;top:62px;">Remarks Detail</label>
            <input type="text" id="txtRemarksDetail" class="dz-abs dz-txt" style="left:165px;top:82px;width:167px;">
            <label class="dz-abs dz-lbl" for="txtLastDate" style="left:334px;top:62px;">Purchase Last Date</label>
            <input type="text" id="txtLastDate" class="dz-abs dz-txt" style="left:333px;top:82px;width:131px;" readonly tabindex="-1">
            <label class="dz-abs dz-lbl" for="txtLastQty" style="left:466px;top:62px;">Last Purchase Qty</label>
            <input type="text" id="txtLastQty" class="dz-abs dz-txt r" style="left:466px;top:82px;width:101px;" readonly tabindex="-1">
            <label class="dz-abs dz-lbl" for="txtLastRate" style="left:569px;top:62px;">Last Purchase Rate</label>
            <input type="text" id="txtLastRate" class="dz-abs dz-txt r" style="left:569px;top:82px;width:107px;" readonly tabindex="-1">
            <label class="dz-abs dz-lbl" for="txtOutstandingDemandAndPOQty" style="left:678px;top:62px;">Outstanding Demand And PO Qty</label>
            <input type="text" id="txtOutstandingDemandAndPOQty" class="dz-abs dz-txt r" style="left:678px;top:82px;width:188px;" readonly tabindex="-1">
            <label class="dz-abs dz-lbl" for="txtAvaialableStockQty" style="left:868px;top:62px;">Avaialable Stock Qty</label>
            <input type="text" id="txtAvaialableStockQty" class="dz-abs dz-txt r" style="left:868px;top:82px;width:124px;" readonly tabindex="-1">
            <button type="button" class="dz-abs dz-btn" id="Add" style="left:993px;top:82px;width:41px;height:24px;" onclick="PurDemand.add()">+</button>
            <button type="button" class="dz-abs dz-btn is-hidden" id="btnCancelDetail" style="left:993px;top:59px;width:70px;height:24px;font-size:12px;" onclick="PurDemand.resetDetail()">Cancel</button>
            <button type="button" class="dz-abs dz-btn is-hidden" id="btnUpdateDetail" style="left:993px;top:82px;width:70px;height:24px;font-size:12px;" onclick="PurDemand.updateDetail()">Update</button>
        </div>
    </div>

    <!-- panel5 (fill): panel11 teal 24 + grdPurchaseDemand -->
    <div class="dz-teal" style="height:24px;">
        <span class="dz-teal-title" style="left:5px;top:3px;">Detail</span>
        <button type="button" class="dz-abs dz-gbar" style="left:1026px;top:0;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
    </div>
    <div class="dz-host win-grid-scroll" style="height:calc(100vh - 336px);min-height:288px;"><table class="win-grid" id="grdPurchaseDemand"><thead></thead><tbody></tbody></table></div>
</div>

<!-- ============================== tabPage2 "History" ============================== -->
<div id="tabHistory" class="win-tab-panel dz-tp">
    <!-- panel6 (3,3) 1073 x 57: panel7 toolStrip2 28 + panel8 teal 29 -->
    <div style="height:28px;background:#fff;">
        <div class="dz-strip">
            <span class="dz-sep"></span>
            <button type="button" class="dz-tool" id="btnNewHistory" style="width:68px" onclick="PurDemand.newHistory()"><i class="fa fa-plus-circle" style="color:#008080"></i> Reset</button>
            <!-- btnRefreshHistory: no Click handler wired on the desktop -->
            <button type="button" class="dz-tool" id="btnRefreshHistory" style="width:80px"><i class="fa fa-refresh"></i> Refresh</button>
        </div>
    </div>
    <div class="dz-teal" style="height:29px;">
        <span class="dz-teal-title" style="left:3px;top:4px;">Purchase Demand History</span>
        <button type="button" class="dz-abs dz-gbar" style="left:1026px;top:1px;height:27px;" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
    </div>
    <!-- panel10 (3,60) 1073 x 50; groupBox3 "Filters" (3,1) 1001 x 49 -->
    <div class="dz-p" style="height:50px;">
        <div class="dz-gb" style="left:3px;top:1px;width:1001px;height:49px;">
            <span class="dz-cap">Filters</span>
            <label class="dz-abs dz-lbl" style="left:3px;top:23px;">From Date</label>
            <div class="dz-abs dz-dtc" style="left:66px;top:19px;width:139px;"><input type="checkbox" id="chkFromDate" checked><input type="date" id="FromDateHistory"></div>
            <label class="dz-abs dz-lbl" style="left:208px;top:23px;">To Date</label>
            <div class="dz-abs dz-dtc" style="left:258px;top:19px;width:139px;"><input type="checkbox" id="chkToDate" checked><input type="date" id="ToDateHistory"></div>
            <label class="dz-abs dz-lbl" for="txtFromDocNoHistory" style="left:401px;top:23px;">From Doc No</label>
            <input type="text" id="txtFromDocNoHistory" class="dz-abs dz-txt" style="left:485px;top:19px;width:84px;" onkeypress="return PurDemand.digitKey(event)">
            <label class="dz-abs dz-lbl" for="txtToDocNoHistory" style="left:571px;top:23px;">To Doc No</label>
            <input type="text" id="txtToDocNoHistory" class="dz-abs dz-txt" style="left:640px;top:19px;width:84px;" onkeypress="return PurDemand.digitKey(event)">
            <button type="button" id="btnshow" class="dz-abs dz-btn" style="left:730px;top:17px;width:62px;height:26px;background:#0a6e6e;" onclick="PurDemand.showHistory()">Show</button>
            <label class="dz-abs dz-chk" style="left:800px;top:12px;width:75px;"><input type="radio" name="histDate" id="drdocdate" value="doc" checked> Doc Date</label>
            <label class="dz-abs dz-chk" style="left:800px;top:29px;width:80px;"><input type="radio" name="histDate" id="rdentrydate" value="entry"> Entry Date</label>
            <label class="dz-abs dz-chk" style="left:881px;top:12px;width:91px;"><input type="radio" name="histDate" id="rdmodifydate" value="modify"> Modify Date</label>
            <label class="dz-abs dz-chk" style="left:881px;top:29px;width:105px;"><input type="radio" name="histDate" id="rdapproveddate" value="approved"> Approved Date</label>
        </div>
    </div>
    <!-- panel12 (3,110) 1073 x 25 teal + DatagridHistory (fill) -->
    <div class="dz-teal" style="height:25px;">
        <span class="dz-teal-title" style="left:2px;top:3px;font-size:13px;line-height:17px;">Filtered Records</span>
    </div>
    <div class="dz-host win-grid-scroll" style="height:calc(100vh - 438px);min-height:186px;"><table class="win-grid" id="DatagridHistory"><thead></thead><tbody></tbody></table></div>
    <!-- panel13 (3,321) 1073 x 22 teal + grdDetail (3,343) 1073 x 213 (Dock Bottom) -->
    <div class="dz-teal" style="height:22px;">
        <span class="dz-teal-title" style="left:4px;top:3px;font-size:13px;line-height:17px;">Detail of Above Selected Row</span>
    </div>
    <div class="dz-host win-grid-scroll" style="height:213px;"><table class="win-grid" id="grdDetail"><thead></thead><tbody></tbody></table></div>
</div>

<!-- tabControl1 tab strip (Alignment = Bottom) -->
<div class="dz-tabs bottom" style="margin:0 4px;">
    <div class="win-tab is-active" data-tab="tabForm" onclick="PurDemand.tab('tabForm')">Form</div>
    <div class="win-tab" data-tab="tabHistory" onclick="PurDemand.tab('tabHistory')">History</div>
</div>

</div>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_define_lookups.js?v=20260925f}"></script>
<script th:src="@{/build/js/countx_store_purchase_demand.js?v=20260925d}"></script>
</body>
</html>
