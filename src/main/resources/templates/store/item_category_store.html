<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Category Store - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* InvDeffrmItemCatagory designer geometry, 1:1 in px (ClientSize 964 x 566). The form keeps its
           designer width; every control sits at its designer Location/Size inside groupBox1.
           PanelAttributes (Dock Left, 350) is never shown from this menu entry (AttributesForItemFeature
           is never assigned), so panel4 (history) fills the full width as on the desktop. */
        body { background: #fff; padding-bottom: 36px; }
        .ic-scroll { overflow-x: auto; }
        .ic-root { width: 964px; position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; }
        .ic-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .ic-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; white-space: nowrap; line-height: 15px; color: #000; }
        .ic-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .ic-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .ic-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .ic-cmb:disabled { background: #f0f0f0; color: #6d6d6d; }
        .ic-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; }
        .ic-chk input { margin: 0; }
        .ic-gb { position: absolute; box-sizing: border-box; }
        .ic-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .ic-gb > .ic-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 11px; font-weight: bold; line-height: 14px; color: #000; }
        .ic-teal { background: #008080; position: relative; }
        .ic-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .ic-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .ic-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; }
        .ic-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .ic-tool:disabled { color: #9a9a9a; cursor: default; }
        .ic-grid-host { height: calc(100vh - 248px); min-height: 354px; overflow: auto; background: #fff; border: 1px solid #9eb6ce; box-sizing: border-box; }
        .ic-grid-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 13px; }
        .ic-grid-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .ic-grid-host .win-grid td { border: 1px solid #d5e1f0; }
        .ic-grid-host .win-grid tbody tr:hover { background: #fff0cf; }
    </style>
</head>
<body>
<!-- Screen 336 "Item Category Store" (ScreenName ItemCategoryStore) - ScreenDefinition TargetUrl
     Architecture.WinApp.Inventory_Definition.InvDeffrmItemCatagory, opened with Tag only (ParentCategoryId 0). -->
<div class="ic-scroll">
<div class="ic-root">

    <!-- panel1 (0,0) 964 x 29 / toolStrip1 (0,0) 964 x 27 -->
    <div style="height:29px;background:#f0f0f0;">
        <div class="ic-strip">
            <button type="button" class="ic-tool" id="btnnew" style="width:59px" onclick="ItemCatStore.reset()"><i class="fa fa-file-o"></i> New</button>
            <button type="button" class="ic-tool" id="btnRefresh" style="width:80px" onclick="ItemCatStore.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="ic-tool is-hidden" id="btnupdate" style="width:78px" onclick="ItemCatStore.update()"><i class="fa fa-refresh"></i> Update</button>
            <button type="button" class="ic-tool is-hidden" id="btnsave" style="width:64px" onclick="ItemCatStore.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="ic-tool is-hidden" id="btnMultiLingo" style="width:101px" onclick="ItemCatStore.multiLingo()"><i class="fa fa-language"></i> Multi Lingo</button>
            <a href="/modules" class="ic-tool" style="margin-left:auto;text-decoration:none;color:#004d40;font-size:11px;font-weight:bold;"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
    </div>

    <!-- panel2 (0,29) 964 x 25 teal; lblCategoryDescription (5,2) Tahoma 12pt bold -->
    <div class="ic-teal" style="height:25px;">
        <span class="ic-teal-title" id="lblCategoryDescription" style="left:5px;top:2px;">Item Category</span>
        <span id="lblRecId" style="display:none;">&nbsp;</span>
    </div>

    <!-- panel3 (0,54) 964 x 135 white -->
    <div style="position:relative;height:135px;background:#fff;">
        <!-- groupBox1 (0,0) 960 x 132 "Detail", Tahoma 8.25pt bold -->
        <div class="ic-gb" id="groupBox1" style="left:0;top:0;width:960px;height:132px;background:#fff;">
            <span class="ic-cap">Detail</span>

            <label class="ic-abs ic-lbl" for="txtItemCategoryCode" style="left:3px;top:18px;">Code</label>
            <input type="text" id="txtItemCategoryCode" class="ic-abs ic-txt" style="left:105px;top:14px;width:190px;">
            <label class="ic-abs ic-lbl" for="txtItemCategoryDescription" style="left:3px;top:47px;">Description</label>
            <input type="text" id="txtItemCategoryDescription" class="ic-abs ic-txt" style="left:105px;top:43px;width:190px;">
            <label class="ic-abs ic-lbl" for="txtItemCategorySerialFrom" style="left:3px;top:75px;">Serial From &amp; To</label>
            <input type="text" id="txtItemCategorySerialFrom" class="ic-abs ic-txt" style="left:105px;top:71px;width:89px;" inputmode="numeric">
            <input type="text" id="txtItemCategorySerialTo" class="ic-abs ic-txt" style="left:195px;top:71px;width:99px;" inputmode="numeric">
            <label class="ic-abs ic-lbl" id="lblAccumlatedDepricition" for="cmbItemCategoryRevenueAccount" style="left:3px;top:102px;">Revenue Account</label>
            <select id="cmbItemCategoryRevenueAccount" class="ic-abs ic-cmb win-combo" style="left:105px;top:96px;width:190px;"></select>

            <label class="ic-abs ic-lbl" id="lblWipCapital" for="cmbItemCategoryInventoryAccount" style="left:300px;top:19px;">Inventory Account</label>
            <select id="cmbItemCategoryInventoryAccount" class="ic-abs ic-cmb win-combo" style="left:404px;top:13px;width:229px;"></select>
            <label class="ic-abs ic-lbl" id="lblDepresitionExpenses" for="cmbItemCategoryCGSAccount" style="left:300px;top:47px;">CGS Account</label>
            <select id="cmbItemCategoryCGSAccount" class="ic-abs ic-cmb win-combo" style="left:404px;top:41px;width:229px;"></select>
            <label class="ic-abs ic-lbl" id="lblParentCategory" for="CmbItemParentCategory" style="left:300px;top:77px;">Parent Category</label>
            <select id="CmbItemParentCategory" class="ic-abs ic-cmb win-combo" style="left:404px;top:71px;width:229px;"></select>
            <label class="ic-abs ic-lbl" for="CmbItemClassGroup" style="left:300px;top:106px;">Class Group</label>
            <select id="CmbItemClassGroup" class="ic-abs ic-cmb win-combo" style="left:404px;top:100px;width:229px;"></select>

            <label class="ic-abs ic-lbl" for="CmbProductionStag" style="left:634px;top:17px;">Production Stage</label>
            <select id="CmbProductionStag" class="ic-abs ic-cmb win-combo" style="left:739px;top:11px;width:215px;"></select>
            <label class="ic-abs ic-lbl" for="CmbVarityNature" style="left:634px;top:47px;">Variety Nature</label>
            <select id="CmbVarityNature" class="ic-abs ic-cmb win-combo" style="left:739px;top:41px;width:215px;"></select>
            <label class="ic-abs ic-chk" style="left:883px;top:71px;width:71px;"><input type="checkbox" id="chkstatus" checked>Is Active</label>
        </div>
    </div>

    <!-- panel4 (fill): panel5 teal 23 "History" + grdfrm (fill) -->
    <div id="histBox">
        <div class="ic-teal" style="height:23px;">
            <span class="ic-teal-title" style="left:4px;top:2px;">History</span>
            <!-- ctrlGrdBar1 (569,2) 40 x 19, anchored Top|Right -->
            <button type="button" class="ic-abs" id="ctrlGrdBar1" title="Grid layout / print / export options are not ported" style="right:5px;top:2px;width:40px;height:19px;background:transparent;color:#fff;border:none;font-size:13px;padding:0;" disabled><i class="fa fa-cog"></i></button>
        </div>
        <!-- grdfrm GroupByBoxVisible is left at the GridEX default (true) -->
        <div style="background:#e3efff;padding:4px 8px;border-left:1px solid #9eb6ce;border-right:1px solid #9eb6ce;font-family:Verdana,sans-serif;font-size:11px;color:#6d6d6d;">Drag a column header here to group by that column.</div>
        <div class="ic-grid-host win-grid-scroll" style="max-height:none;">
            <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody></table>
        </div>
    </div>
</div>
</div>

<!-- Footer: right-aligned History button (scrolls to the history section). -->
<div class="cx-footer">
    <span class="cx-footer-left"></span>
    <button type="button" class="win-btn-action cx-footer-history" onclick="ItemCatStore.gotoHistory()"><i class="fa fa-history"></i> <span>History</span></button>
</div>

<script th:src="@{/build/js/countx_store_common.js?v=20260925c}"></script>
<script th:src="@{/build/js/countx_store_item_category_store.js?v=20260925a}"></script>
</body>
</html>
