<body class="nav-sm">
<div class="container body">
    <div class="main_container">
        8
        <!-- sidebar and top navigation -->
        <div th:replace="fragments/fixed_sidebar :: div">
        </div>
        <!-- /sidebar and top navigation -->

        <!-- page content -->
        <div class="right_col" role="main">
            <div class="">
                <div class="row">
                    <div class="col-md-12">
                        <ol class="breadcrumb">
                            <li><a href="../index">AGRICULTURE PRODUCT</a></li>
                            <li>MILL RATE</li>
                        </ol>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 col-sm-12 col-xs-12">

                        <div class="x_panel">
                            <div class="x_title" style="text-align: center;">
                                <h2>AGRICULTURE PRODUCT - MILL RATE</h2>
                                <!-- <h3>MILL RATE</h3> -->
                                <div class="clearfix"></div>
                            </div>
                        </div>

                        <div class="x_content">
                            <div class="row">
                                <div class="col-md-12 col-sm-12 col-xs-12">
                                    <!-- th:action="@{/stock/mill-rates}"  -->
                                    <form action="#" class="form-horizontal form-label-left" id="stockmillrates"
                                          method="post" th:object="${millRateList}">

                                        <table class="table table-striped table-bordered" id="mill_rate_table">

                                            <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>DATE</th>
                                                <th>PRODUCT</th>
                                                <th>MILL NAME</th>
                                                <th>MILL RATE</th>
                                                <th>PUR RATE</th>
                                                <th>CASH RATE</th>
                                                <th>REMARKS</th>
                                                <th>ACTION</th>
                                            </tr>
                                            </thead>

                                            <tbody>
                                            <tr th:each="Entry, rowStat : ${millRate.millRateEntries}">
                                                <td style="min-width: 2%; max-width: 2%;" width="15%">
                                                    <span id="serial_no" th:text="${rowStat.count}"></span>
                                                    <input th:field="${millRate.millRateEntries[__${rowStat.index}__].id}"
                                                           type="hidden"/>
                                                </td>
                                                <td style="min-width: 5%; max-width: 5%;" width="5%">
                                                    <input class="form-control entryDate" required="required"
                                                           th:field="${millRate.millRateEntries[__${rowStat.index}__].entryDate}"
                                                           type="date">
                                                    <!-- th:field="${prePurchase.prePurchaseEntries[__${rowStat.index}__].entryDate}" -->
                                                </td>
                                                <td style="min-width: 15%; max-width: 15%;" width="15%">
                                                    <!-- th:field="${millRates[__${rowStat.index}__].itemDef}" -->
                                                    <select class="form-control select2_single itemDef"
                                                            required="required"
                                                            th:field="${millRate.millRateEntries[__${rowStat.index}__].itemDef}">
                                                        <!-- <option value="0"></option> -->
                                                        <th:block
                                                                th:each="itemSubCategory : ${itemSubCategories}">
                                                            <option
                                                                    th:each="itemDef : ${itemSubCategory.itemDefs}"
                                                                    th:text="${itemDef.formattedCode + '&emsp;' + itemDef.itemSubCategory.name + ' ' + itemDef.name}"
                                                                    th:value="${itemDef.id}">
                                                            </option>
                                                        </th:block>
                                                    </select>
                                                </td>

                                                <td style="min-width: 15%; max-width: 15%;" width="15%">
                                                    <!-- th:field="${millRates[__${rowStat.index}__].itemDef}" -->
                                                    <select class="form-control select2_single mill"
                                                            required="required"
                                                            th:field="${millRate.millRateEntries[__${rowStat.index}__].mill.id}">
                                                        <option
                                                                th:each="mill : ${mills}"
                                                                th:text="${mill.accountName}"
                                                                th:value="${mill.id}">
                                                        </option>
                                                    </select>
                                                </td>
                                                <td style="min-width: 5%; max-width: 5%;" width="5%">
                                                    <!-- th:field="${purchaseOrder.purchaseOrderEntries[__${rowStat.index}__].rate}" -->
                                                    <input class="form-control rate" onfocus="this.select()" step="any"
                                                           th:field="${millRate.rate}" type="number">
                                                </td>
                                                <td style="min-width: 5%; max-width: 5%;" width="5%">
                                                    <!-- th:field="${purchaseOrder.purchaseOrderEntries[__${rowStat.index}__].rate}" -->
                                                    <input class="form-control cashRate" onfocus="this.select()"
                                                           step="any"
                                                           th:field="${millRate.cashRate}" type="number">
                                                </td>
                                                <td style="min-width: 15%; max-width: 15%;" width="15%">
                                                    <textarea class="form-control remarks"
                                                              onfocus="this.select()"></textarea>
                                                </td>
                                                <td style="min-width: 10%; max-width: 10%;" width="10%">
                                                    <a class="btn btn-success entry_add"
                                                       href="javascript:void(0)"
                                                       style="font-size: 15px; font-weight: 600; text-decoration: none;">
                                                        ADD</a>
                                                    <a class="btn btn-danger entry_delete"
                                                       href="javascript:void(0)"
                                                       style="font-size: 15px; font-weight: 600; text-decoration: none;">
                                                        DELETE</a>
                                                </td>
                                            </tr>
                                            </tbody>

                                        </table>

                                        <div class="row">
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <div class="form-group">
                                                    <button class="btn btn-success" id="submitGLForm"
                                                            style="float: right;"
                                                            type="button">SAVE
                                                    </button>
                                                    <img id="loading" style="display:none; float: right;"
                                                         th:src="@{/build/images/pac_man.gif}"></img>
                                                </div>
                                            </div>
                                        </div>


                                    </form>

                                </div>
                            </div>
                        </div>

                    </div>
                </div>


            </div>
            <!-- /page content -->
        </div>
    </div>
    <!-- footer content -->
    <footer>
        <div class="pull-right">
            Gentelella - Bootstrap Admin Template by <a href="https://colorlib.com">Colorlib</a>

        <div class="clearfix"></div>
    </footer>
