<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Item Stock Ledger</title>
<link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-item-ledger.css">
<script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script><script src="/js/inventory-request.js"></script></head><body>
<nav aria-label="Item ledger actions"><button id="btnNew" type="button">＋ New</button><button id="btnRefresh" type="button">↻ Refresh</button><button id="print" type="button" disabled title="The 421 Crystal report format is pending verification">421-Print</button><button id="btnshortcut" type="button">ShortCut Keys</button></nav>
<h1>Item Stock Ledger</h1>
<div class="filter-panel"><form id="filters"><fieldset id="groupBox1"><legend>Filters</legend>
<label class="date-label" for="cmbDateType">Date Type</label><select id="cmbDateType" tabindex="1" style="width:247px"><option value="">...Select Any Value...</option><option value="1">This Day</option><option value="2" selected>This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select>
<label class="range-label" for="fromdate">From &amp; To Date</label><input id="fromdate" type="date" tabindex="2" required><input id="todate" type="date" aria-label="To Date" tabindex="3" required>
<label class="item-label" for="CmbItem">Item Name</label><select id="CmbItem" tabindex="4" style="width:188px" required></select><button id="btnshow" tabindex="5" type="submit">Show</button></fieldset></form>
<fieldset id="GroupOpeningInfo" hidden><legend id="summaryTitle">Opening And Closing Info Of Item</legend><div class="summary-grid"><span></span><span>Bags</span><span>Weight(Kg)</span><span>Amount</span><span>Avg Rate</span>
<label>Opening</label><input id="txtQtyOpening" aria-label="Opening Bags" disabled><input id="txtWeightOpening" aria-label="Opening Weight" disabled><input id="txtAmountOpening" aria-label="Opening Amount" disabled><input id="txtAvgRateOpening" aria-label="Opening Average Rate" disabled>
<label>Closing</label><input id="txtQtyClosing" aria-label="Closing Bags" disabled><input id="txtWeightClosing" aria-label="Closing Weight" disabled><input id="txtAmountclosing" aria-label="Closing Amount" disabled><input id="txtAvgRateClosing" aria-label="Closing Average Rate" disabled></div></fieldset></div>
<section class="results"><header><h2>Filtered Records</h2><div><button id="gridPrint" type="button" disabled>Grid Print</button><button id="gridExport" type="button" disabled>Grid Export</button></div></header><p id="status" role="status"></p>
<div class="grid-scroll" id="gridScroll" tabindex="6" aria-label="Item ledger, scroll left and right"><table id="grd"><colgroup id="columnWidths"></colgroup><thead id="headers"></thead><tbody id="records"></tbody><tfoot id="totals"></tfoot></table></div><footer id="rowCount">0 records</footer></section>
<dialog id="shortcuts"><h2>ShortCut Keys</h2><p>Ctrl+S: Show · Ctrl+N: New · Ctrl+R: Refresh<br>Ctrl+E / Escape: Close<br>Ctrl+F5 / Ctrl+↑: Date Type · Ctrl+↓: Grid<br>Alt+P / Alt+2: 421-Print</p><form method="dialog"><button>Close</button></form></dialog>
<script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/vendors/select2/dist/js/select2.min.js"></script><script src="/js/report-decimal.js"></script><script src="/js/inventory-item-ledger.js?v=20260916-filter-state"></script></body></html>
