<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Evaluation Ledger Store</title><meta name="_csrf" th:content="${_csrf?.token}"><meta name="_csrf_header" th:content="${_csrf?.headerName}"><link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-store-stock.css?v=20260916-select-sizing"><link rel="stylesheet" href="/css/inventory-store-ledger.css"><script src="/js/report-loading.js"></script></head><body>
<nav><button id="reset">New</button><button id="refresh">Refresh</button><button id="shortcuts">Short Cut Keys</button><a href="/stocks/store-stock-report">×</a></nav><h1>Inventory Evaluation Ledger Store</h1><p id="message" role="status" hidden></p>
<div class="form-scroll"><div class="filter-area"><form id="filters">
<label class="field left r1">Branch Name<select id="branchIds" multiple></select></label><label class="field left r2">Date Type<select id="dateType"><option value=""></option><option value="1">Today</option><option value="2">This Week</option><option value="3">This Month</option><option value="4">This Year</option><option value="5">Financial Year</option></select></label><label class="field left r3">Date From,To</label><span class="date first"><input id="fromDate" aria-label="From Date" placeholder="dd-MMM-yy" required><input id="fromDate-calendar" type="date" aria-label="Choose From Date"></span><span class="date second"><input id="toDate" aria-label="To Date" placeholder="dd-MMM-yy" required><input id="toDate-calendar" type="date" aria-label="Choose To Date"></span><label class="field left r4">Parent Category<select id="parentIds" multiple></select></label>
<label class="field middle r1">Item Category<select id="categoryId" data-activity="ItemCategories"></select></label><label class="field middle r2">Item Type<select id="typeId" data-activity="ItemTypes"></select></label><label class="field middle r3">Warehouse<select id="warehouseId" data-activity="Warehouse"></select></label><label class="field middle r4">Rack Name<select id="rackId" data-activity="RackName"></select></label>
<label class="field right r1">Item Name<select id="itemId" data-activity="Items"></select></label><label class="field right r2">Stock Account<select id="accountId" data-activity="Stock_Account"></select></label><label class="field right r3">Document Type<select id="documentTypeId" data-activity="DocumentType"></select></label><label class="field right r4 condition">Item Condition<select id="conditionId" data-activity="ItemCondition"></select></label><button id="show">Show</button>
<fieldset class="value-kind"><label><input type="radio" name="value-kind" id="cgsValue" checked>CGS Value</label><label><input type="radio" name="value-kind" id="saleValue">Sale Value</label></fieldset></form>
<div class="totals"><table><thead><tr><th></th><th>Qty</th><th>Weight</th><th>Amount</th></tr></thead><tbody><tr><th>In</th><td id="qty-in"></td><td id="weight-in"></td><td id="amount-in"></td></tr><tr><th>Out</th><td id="qty-out"></td><td id="weight-out"></td><td id="amount-out"></td></tr><tr><th>Bal</th><td id="qty-bal"></td><td id="weight-bal"></td><td id="amount-bal"></td></tr></tbody></table></div></div></div>
<header class="result-heading">Item Ledger Detail<button id="grid-choose">Field Chooser / Layout</button></header><div class="grid-scroll" id="grid-scroll" tabindex="0" aria-label="Store item ledger; scroll left and right"><table id="stock"><thead></thead><tbody></tbody><tfoot></tfoot></table></div><p id="record-count" role="status"></p>
<dialog id="grid-dialog"><h2>Ledger Field Chooser</h2><div class="layout-scroll"><table id="grid-fields"><thead><tr><th>Show</th><th>Field</th><th>Width</th><th>Position</th></tr></thead><tbody></tbody></table></div><button id="grid-save">Save Layout</button><button id="grid-remove">Remove Layout</button><button id="grid-close">Close</button></dialog><dialog id="shortcut-dialog"><h2>Short Cut Keys</h2><p>Ctrl+S: Show · Ctrl+N: New · Ctrl+R: Refresh · Ctrl+E / Escape: Close</p><p>Ctrl+F5 / Ctrl+↑: Date Type · Ctrl+↓: Grid</p><form method="dialog"><button>Close</button></form></dialog>
<script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/vendors/select2/dist/js/select2.full.min.js"></script><script src="/js/report-decimal.js"></script><script src="/js/inventory-request.js"></script><script src="/js/inventory-store-ledger.js?v=20260916-filter-state"></script></body></html>
