<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaction Report Vehicle Wise</title>
<link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-vehicle-transactions.css">
<script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script><script src="/js/inventory-request.js"></script></head><body>
<nav aria-label="Report actions"><button id="Reset" type="button">＋ Reset</button><button id="btnRefresh" type="button">↻ Refresh</button><button id="btnPrint" type="button" disabled title="Original 621 Crystal output is awaiting runtime verification">621 -Register</button></nav>
<h1>Transaction Report Vehicle Wise</h1>
<form id="filters" aria-label="Report filters">
<div class="filter-group dates"><label for="FromDate">From Date</label><input id="FromDate" type="date" tabindex="1" required><label for="Todate">To Date</label><input id="Todate" type="date" tabindex="2" required><label for="CmbItemParentCategory">Parent Category</label><select id="CmbItemParentCategory" tabindex="3"></select></div>
<div class="filter-group items"><label for="CmbItemName">Item Name</label><select id="CmbItemName" tabindex="4"></select><label for="CmbSupplier">Party Name</label><select id="CmbSupplier" tabindex="5"></select><label for="CmbWarehouse">WareHouse Name</label><select id="CmbWarehouse" tabindex="6"></select></div>
<div class="filter-group lots"><label for="CmbJobLot">JobLot</label><select id="CmbJobLot" tabindex="7"></select><label for="CmbCropYear">CropYear</label><select id="CmbCropYear" tabindex="8"></select><label for="CmbReferenceDocument">Ref Document</label><select id="CmbReferenceDocument" multiple tabindex="9"></select></div>
<div class="filter-group packing"><label for="CmbPackingType">Packing Type</label><select id="CmbPackingType" tabindex="10"></select><label for="CmbUom">Pack Uom</label><select id="CmbUom" tabindex="11"></select><button id="BtnSearch" type="submit" tabindex="12">Show</button></div>
</form>
<section class="results"><div class="result-tools"><p id="status" role="status"></p><button id="gridPrint" type="button" disabled>Grid Print</button><button id="gridExport" type="button" disabled>Grid Export</button></div>
<div id="gridScroll" class="grid-scroll" tabindex="13" aria-label="Transaction rows, scroll left and right"><table id="grd"><colgroup id="columnWidths"></colgroup><thead id="headers"></thead><tbody id="records"></tbody><tfoot id="totals"></tfoot></table></div><footer><button id="firstRow" type="button" aria-label="First record">|◀</button><button id="previousRow" type="button" aria-label="Previous record">◀</button><span id="rowCount">0 records</span><button id="nextRow" type="button" aria-label="Next record">▶</button><button id="lastRow" type="button" aria-label="Last record">▶|</button></footer></section>
<script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/vendors/select2/dist/js/select2.min.js"></script><script src="/js/report-decimal.js"></script><script src="/js/inventory-vehicle-transactions.js?v=20260916-filter-state"></script></body></html>
