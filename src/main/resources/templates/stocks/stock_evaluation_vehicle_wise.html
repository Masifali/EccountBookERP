<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Evaluation Report Vehicle Wise</title>
<link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-stock-evaluation-vehicle-wise.css?v=20261005a"><link rel="stylesheet" href="/build/css/countx_desktop_combo.css?v=20260930s"><link rel="stylesheet" href="/build/css/countx_prod_combo.css?v=20261002gv">
<script src="/js/report-loading.js"></script><script src="/js/inventory-ui.js"></script><script src="/js/inventory-request.js"></script><link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head><body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!-- Desktop: StockEvaluationReportVehicleWise (ScreenDefinition 292). panel1 / ToolStrip btnPrint622A -->
<nav aria-label="Report actions"><button id="Reset" type="button" title="Reset">＋ Reset</button><button id="btnRefresh" type="button" title="Refresh">↻ Refresh</button><button id="btnPrint" type="button" data-rpt="622-StockEvalaution_VehicleWiseTransaction.rpt" data-rpt-own>622-Register</button><button id="btnPrint622" type="button" title="622A_StockEvalaution_VehicleWiseTransaction" data-rpt="622A_StockEvalaution_VehicleWiseTransaction.rpt" data-rpt-own>622-A -Register</button><button id="btnStockHold" type="button" hidden>Stock Hold For Fumigation</button></nav>
<!-- panelheading (Teal) + ctrlGrdBar1 (MyGrid = grd) -->
<div class="panelheading"><h1>Stock Evaluation Report Vehicle Wise</h1><span id="gearMount"></span></div>
<!-- panel4 -->
<form id="filters" aria-label="Report filters" novalidate>
<div class="filter-group g1"><label for="FromDate">From Date</label><input id="FromDate" type="date" tabindex="1" required><label for="Todate">To Date</label><input id="Todate" type="date" tabindex="2" required><label for="CmbClassGroup">Class Group</label><select id="CmbClassGroup" tabindex="3"></select><label for="CmbItemParentCategory" class="two-line">Parent<br>Category</label><select id="CmbItemParentCategory" multiple tabindex="4" data-native-select data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Parent Categories"></select></div>
<div class="filter-group g2"><label for="cmbItemCategory">Item Category</label><select id="cmbItemCategory" multiple tabindex="5" data-native-select data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Item Category"></select><label for="cmbItemType">Item Type</label><select id="cmbItemType" multiple tabindex="6" data-native-select data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Item Type"></select><label for="CmbItemName">Item Name</label><select id="CmbItemName" tabindex="7"></select><label for="CmbSupplier">Party Name</label><select id="CmbSupplier" tabindex="8"></select></div>
<div class="filter-group g3"><label for="CmbWarehouse">Warehouse</label><select id="CmbWarehouse" tabindex="9"></select><label for="CmbJobLot">Job Lot</label><select id="CmbJobLot" tabindex="10"></select><label for="CmbCropYear">Crop Year</label><select id="CmbCropYear" tabindex="11"></select><label for="CmbReferenceDocument">Ref Document</label><select id="CmbReferenceDocument" multiple tabindex="12" data-native-select data-dtcombo="single" data-dtcombo-checked data-dtcombo-caption="Document Type"></select></div>
<div class="filter-group g4"><label for="CmbPackingType">Packing Type</label><select id="CmbPackingType" tabindex="13"></select><label for="CmbUom">Pack Uom</label><select id="CmbUom" tabindex="14"></select><span></span><div class="skip-row"><label class="check"><input id="ChkSkipZero" type="checkbox" checked tabindex="15"> Skip Zero</label><button id="BtnSearch" type="submit" tabindex="16">Show</button></div></div>
</form>
<!-- panel2: grd (Janus GridEX, filter row, total row at bottom, record navigator) -->
<section class="results"><p id="status" role="status"></p>
<div id="gridScroll" class="grid-scroll" tabindex="17" aria-label="Stock evaluation rows"><table id="grd" data-gridbar="StockEvaluationReportVehicleWise:grd" data-gridbar-mount="#gearMount" data-gridbar-title="Stock Evaluation Report Vehicle Wise"><colgroup id="columnWidths"></colgroup><thead id="headers"></thead><tbody id="records"></tbody><tfoot id="totals"></tfoot></table></div>
<footer><button id="firstRow" type="button" aria-label="First record">|◀</button><button id="previousRow" type="button" aria-label="Previous record">◀</button><span id="rowCount">0 records</span><button id="nextRow" type="button" aria-label="Next record">▶</button><button id="lastRow" type="button" aria-label="Last record">▶|</button></footer></section>
<!-- StockTransactionDetail (grd_ColumnButtonClick "TranDetail") -->
<dialog id="tranDetail" class="popup" aria-labelledby="tranDetailTitle"><div class="panelheading"><h2 id="tranDetailTitle">Stock Transaction Detail</h2><span id="detailGearMount"></span><button type="button" class="close" data-close aria-label="Close">✕</button></div>
<div class="grid-scroll detail-scroll"><table id="grdDetail" data-gridbar="StockTransactionDetail:grd" data-gridbar-mount="#detailGearMount" data-gridbar-title="Stock Transaction Detail"><thead id="detailHeaders"></thead><tbody id="detailRecords"></tbody><tfoot id="detailTotals"></tfoot></table></div></dialog>
<!-- RemarksPopUp (StockHold) -->
<dialog id="remarksPopup" class="popup remarks" aria-labelledby="remarksTitle"><div class="panelheading"><h2 id="remarksTitle">Remarks</h2><button type="button" class="close" data-close aria-label="Close">✕</button></div>
<div class="remarks-body"><label for="txtRemarks">Enter Remarks: </label><textarea id="txtRemarks" rows="4"></textarea><button id="btnOk" type="button">OK</button></div></dialog>
<script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/build/js/countx_prod_combo.js?v=20261002gv"></script><script src="/vendors/select2/dist/js/select2.min.js"></script><script src="/js/report-decimal.js"></script><script src="/js/inventory-stock-evaluation-vehicle-wise.js?v=20261005a"></script><script src="/js/print-rpt.js?v=20261003erp"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridheader}"></script>
</body></html>
