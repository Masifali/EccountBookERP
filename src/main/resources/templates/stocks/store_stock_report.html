<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Report Store</title><meta name="_csrf" th:content="${_csrf?.token}"><meta name="_csrf_header" th:content="${_csrf?.headerName}"><link rel="stylesheet" href="/vendors/select2/dist/css/select2.min.css"><link rel="stylesheet" href="/css/report-loading.css"><link rel="stylesheet" href="/css/inventory-store-stock.css?v=20260916-select-sizing"><script src="/js/report-loading.js"></script></head><body>
<nav><button id="refresh">Refresh</button><button id="print" hidden>Print</button><button id="update" hidden>Update</button><a href="/inventory">×</a></nav><h1>Stock Report With Values For Store</h1><p id="message" role="status" hidden></p>
<div class="form-scroll"><form id="filters"><label class="field left r1">Branch Name<select id="branchIds" multiple></select></label><label class="field left r2">Date From,To</label><span class="date first"><input id="fromDate" aria-label="From Date" placeholder="dd-MMM-yy" required><input id="fromDate-calendar" type="date" aria-label="Choose From Date"></span><span class="date second"><input id="toDate" aria-label="To Date" placeholder="dd-MMM-yy" required><input id="toDate-calendar" type="date" aria-label="Choose To Date"></span>
<label class="field left r3">Parent Category<select id="parentIds" multiple></select></label><label class="field left r4">Item Category<select id="categoryId" data-activity="ItemCategories"></select></label>
<label class="field middle r1">Item Type<select id="typeId" data-activity="ItemTypes"></select></label><label class="field middle r2">Warehouse<select id="warehouseId" data-activity="Warehouse"></select></label><label class="field middle r3">Item Name<select id="itemId" data-activity="Items"></select></label><label class="field middle r4">Stock Account<select id="accountId" data-activity="Stock_Account"></select></label>
<label class="field right r1">Item Condition<select id="conditionId" data-activity="ItemCondition"></select></label><label class="field right r2">Rack Name<select id="rackId" data-activity="RackName"></select></label><label class="field right r3">Report Type<select id="reportType"><option value="ItemStockSummary">Item Stock Summary</option><option value="WarehouseAndItem">Warehouse and Item Stock Summary</option><option value="ItemAndWarehouse">Item and WareHouse Stock Summary</option><option value="ItemandPackSizeStockSummary">Item and PackSize Stock Summary</option></select></label>
<label class="item-wise"><input id="itemWise" type="checkbox" checked>Item Wise Stock</label><label class="skip-zero"><input id="skipZero" type="checkbox" checked>Skip Zero</label><button id="show">Show</button><fieldset class="value-kind"><label><input type="radio" name="value-kind" id="cgsValue" checked>CGS Value</label><label><input type="radio" name="value-kind" id="saleValue">Sale Value</label></fieldset>
<div class="summary-box"><table><thead><tr><th></th><th>Qty</th><th>Amount</th></tr></thead><tbody><tr><th>In</th><td id="summary-qty-in">0</td><td id="summary-amt-in">0</td></tr><tr><th>Out</th><td id="summary-qty-out">0</td><td id="summary-amt-out">0</td></tr><tr><th>Bal</th><td id="summary-qty-bal">0</td><td id="summary-amt-bal">0</td></tr></tbody></table></div></form></div>
<header class="result-heading">Stock Report With Value Store</header><div class="grid-scroll" id="grid-scroll" tabindex="0" aria-label="Store stock; scroll left and right"><table id="stock"><thead></thead><tbody></tbody><tfoot></tfoot></table></div><p id="record-count" role="status"></p>
<script src="/vendors/jquery/dist/jquery.min.js"></script><script src="/vendors/select2/dist/js/select2.full.min.js"></script><script src="/js/report-decimal.js"></script><script src="/js/inventory-request.js"></script><script src="/js/inventory-store-stock.js?v=20260916-winforms-design"></script></body></html>
