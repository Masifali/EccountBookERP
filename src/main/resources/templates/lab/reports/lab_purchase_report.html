<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Lab Purchase Analysis Report (Not Use) - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_other_reports.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- 627 "Lab Purchase Analysis Report (Not Use)" (ScreenName InvLabPurchaseReport) - Architecture.WinApp.Lab.InvLabPurchaseReport
     (module 1011 Lab Report). Controls, captions and coordinates from InitializeComponent (InvLabPurchaseReport.cs:490-931):
     tsItemTaxSchedule { All Record (btnAllRecord), &New (btnnew) }, panel7 caption "Purchase Analysis Report" + ctrlGrdBar1,
     panel8 filters (1207 x 70), panel4 grdhistory, panel5 griddetail (left) + panel6 pictures (right). -->
<body class="pr lab-or lab-purchase" th:attr="data-screen-id=${screenId},data-screen-name=${screenName}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnAllRecord">All Record</button>
    <button type="button" id="btnnew" accesskey="n">New</button>
    <a class="pr-right" href="/quality">Exit</a>
</nav>
<div class="pr-caption" id="label43" style="height:34px;line-height:34px">Purchase Analysis Report</div>
<div id="prMessage" role="status" aria-live="polite" hidden></div>
<!-- panel8: TabIndex txtdatef 0, txtdatet 1, cmbsupplier 2, txtgpnof 3, txtgpnot 4, btnsearch 5 -->
<div class="pr-filters lab-panel" id="panel8" style="height:70px;min-width:745px">
    <label class="pr-abs" style="left:12px;top:9px" for="txtdatef">Date From</label>
    <div class="pr-abs" style="left:10px;top:33px;width:108px"><input type="date" id="txtdatef"></div>
    <label class="pr-abs" style="left:121px;top:9px" for="txtdatet">Date To</label>
    <div class="pr-abs" style="left:122px;top:33px;width:108px"><input type="date" id="txtdatet"></div>
    <label class="pr-abs" style="left:232px;top:9px" for="cmbsupplier">Supplier Name</label>
    <div class="pr-abs" style="left:235px;top:33px;width:252px"><select id="cmbsupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select></div>
    <label class="pr-abs" style="left:490px;top:10px" for="txtgpnof">GpNo From</label>
    <div class="pr-abs" style="left:493px;top:33px;width:93px"><input type="text" id="txtgpnof" autocomplete="off"></div>
    <label class="pr-abs" style="left:589px;top:10px" for="txtgpnot">GpNo To</label>
    <div class="pr-abs" style="left:590px;top:33px;width:84px"><input type="text" id="txtgpnot" autocomplete="off"></div>
    <button type="button" class="pr-abs" id="btnsearch" style="left:679px;top:33px;width:62px;height:25px">Search</button>
</div>
<!-- panel4: grdhistory (no caption on the desktop; the bar carries ctrlGrdBar1's tools and the fullscreen toggle) -->
<section id="historySection">
    <div class="pr-grid-bar" id="historyBar">History <span id="lblCount"></span>
        <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen" title="Fullscreen">Fullscreen</button></span>
    </div>
    <div class="pr-wrap" tabindex="0" id="historyWrap"><table data-gridbar="LabPurchaseReport:grdhistory" class="pr-grid" id="grdhistory"></table></div>
</section>
<div class="lab-or-bottom">
    <!-- panel5: griddetail -->
    <div class="lab-or-detail"><div class="pr-wrap" tabindex="0" id="detailWrap"><table data-gridbar="LabPurchaseReport:griddetail" class="pr-grid" id="griddetail"></table></div></div>
    <!-- panel6 472 x 326: label5 "Analysis Pic", label4 "Cooking Pic", two picture boxes, two Preview buttons -->
    <div class="lab-or-pics" id="panel6">
        <label style="left:81px;top:9px">Analysis Pic</label>
        <label style="left:310px;top:9px">Cooking Pic</label>
        <div class="lab-or-pic" style="left:10px;top:27px;width:216px;height:168px"><img id="sampleanalysispicture" alt="Analysis Pic" hidden></div>
        <div class="lab-or-pic" style="left:254px;top:27px;width:213px;height:168px"><img id="cookingpic" alt="Cooking Pic" hidden></div>
        <button type="button" id="btnimgpreanalysispic" style="left:79px;top:201px">Preview</button>
        <button type="button" id="btnimgpreviewcookingpic" style="left:322px;top:201px">Preview</button>
    </div>
</div>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/lab/countx_lab_purchase_report.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
