<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">In-Process Analysis Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_register_reports.css?v=20261001a}">
</head>
<!-- 631 "In-Process Analysis Report": Architecture.WinApp.Lab.InProcessLabAnalysisRegister
     (ScreenName InProcessLabAnalysisRegister, module 1011). Controls, captions and coordinates from
     InProcessLabAnalysisRegister.cs InitializeComponent (:595). -->
<body class="pr lab-rr lab-inprocess" th:attr="data-screen-id=${screenId},data-screen-name=${screenName}">
<div id="prLoading" hidden role="status">Please wait...</div>
<!-- panel3: toolStrip3 { btnNew "&New", print "660-Print", toolStripButton2 "ShortCut Keys" } + label23 -->
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N / Ctrl+R">New</button>
    <button type="button" id="print" title="Ctrl+P">660-Print</button>
    <button type="button" id="toolStripButton2" title="Ctrl+Alt">ShortCut Keys</button>
    <a class="pr-right" href="/quality" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption">In Process Analysis Register</div>
<div id="prMessage" role="status" aria-live="polite" hidden></div>
<div class="pr-panel pr-scroll">
    <!-- panel5 1084 x 38 -->
    <div class="pr-filters" style="height:38px;min-width:1084px">
        <label class="pr-abs" style="left:5px;top:12px" for="cmbPlantName">Plant Name</label>
        <div class="pr-abs" style="left:73px;top:6px;width:150px"><select id="cmbPlantName" data-dtcombo="single" data-dtcombo-caption="Plant"></select></div>
        <label class="pr-abs" style="left:226px;top:12px" for="CmbJobOrderNo">Job Order No</label>
        <div class="pr-abs" style="left:306px;top:6px;width:200px"><select id="CmbJobOrderNo" data-dtcombo="single" data-dtcombo-caption="Job Order"></select></div>
        <label class="pr-abs" style="left:508px;top:12px" for="cmbItemName">Item Name</label>
        <div class="pr-abs" style="left:578px;top:6px;width:230px"><select id="cmbItemName" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <label class="pr-abs" style="left:811px;top:12px" for="cmbDocDate">Doc Date</label>
        <div class="pr-abs" style="left:869px;top:6px;width:150px"><select id="cmbDocDate" data-dtcombo="single" data-dtcombo-caption="DocDate"></select></div>
        <button type="button" class="pr-show pr-abs" id="btnshow" style="left:1020px;top:6px;width:58px" title="Ctrl+S">Show</button>
    </div>
    <!-- panel9: label3 + ctrlGrdBar1, then grdStepAnalysis -->
    <section id="stepSection" style="min-width:1084px">
        <div class="pr-grid-bar">Plant's In Process Step Analysis Detail <span id="lblStepCount"></span>
            <span class="pr-right"><button type="button" id="btnStepPrint">Grid Print</button><button type="button" id="btnStepExport">Export</button><button type="button" id="btnStepFullscreen" title="Show the grid on the whole window (Esc to leave)">Fullscreen</button></span>
        </div>
        <div class="pr-wrap" tabindex="0" id="stepWrap"><table class="pr-grid" id="grdStepAnalysis"></table></div>
    </section>
    <!-- panel12: label4 + ctrlGrdBar2, then grdGroupAnalysis -->
    <section id="recoverySection" style="min-width:1084px">
        <div class="pr-grid-bar">Plant's In Process Recovery Analysis Detail <span id="lblRecoveryCount"></span>
            <span class="pr-right"><button type="button" id="btnRecoveryPrint">Grid Print</button><button type="button" id="btnRecoveryExport">Export</button><button type="button" id="btnRecoveryFullscreen" title="Show the grid on the whole window (Esc to leave)">Fullscreen</button></span>
        </div>
        <div class="pr-wrap" tabindex="0" id="recoveryWrap"><table class="pr-grid" id="grdGroupAnalysis"></table></div>
    </section>
</div>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20260930a}"></script>
<script th:src="@{/build/js/lab/countx_lab_report_tools.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_inprocess_analysis_register.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
</body>
</html>
