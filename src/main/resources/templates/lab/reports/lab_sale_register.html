<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Lab Sale Analysis Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_other_reports.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- 628 "Lab Sale Analysis Report" (ScreenName InvLabSaleRegister) - Architecture.WinApp.Lab.InvLabSaleRegister
     (module 1011 Lab Report). Controls, captions and coordinates from InitializeComponent (InvLabSaleRegister.cs:437-1260):
     toolStrip3 { &Refresh (btnNew), 662-Print }, panel3 caption "Sale Analysis Register" + ctrlGrdBar2,
     panel5 filters (989 x 102), grdGroupAnalysis (Dock Fill). -->
<body class="pr lab-or lab-sale" th:attr="data-screen-id=${screenId},data-screen-name=${screenName}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N">Refresh</button>
    <button type="button" id="print" title="Ctrl+P">662-Print</button>
    <a class="pr-right" href="/quality" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption" id="label23" style="height:33px;line-height:33px">Sale Analysis Register</div>
<div id="prMessage" role="status" aria-live="polite" hidden></div>
<!-- panel5: TabIndex CmbParentCategory 0, txtdatef 1, txtdatet 2, txtgpnof 3, txtgpnot 4, CmbOrder 5, cmbsupplier 6,
     cmbItemName 7, cmbstatus 8, btnshow 9 (the markup is in that order) -->
<div class="pr-filters lab-panel" id="panel5" style="height:102px;min-width:800px">
    <label class="pr-abs" style="left:7px;top:10px" for="CmbParentCategory">Parent Category</label>
    <div class="pr-abs" style="left:99px;top:5px;width:135px"><select id="CmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select></div>
    <label class="pr-abs" style="left:7px;top:40px" for="txtdatef">Date From</label>
    <div class="pr-abs" style="left:99px;top:35px;width:135px"><input type="date" id="txtdatef"></div>
    <label class="pr-abs" style="left:7px;top:69px" for="txtdatet">Date To</label>
    <div class="pr-abs" style="left:99px;top:64px;width:135px"><input type="date" id="txtdatet"></div>

    <label class="pr-abs" style="left:245px;top:10px" for="txtgpnof">GpNo From</label>
    <div class="pr-abs" style="left:322px;top:5px;width:135px"><input type="text" id="txtgpnof" autocomplete="off"></div>
    <label class="pr-abs" style="left:245px;top:40px" for="txtgpnot">GpNo To</label>
    <div class="pr-abs" style="left:322px;top:35px;width:135px"><input type="text" id="txtgpnot" autocomplete="off"></div>
    <label class="pr-abs" style="left:245px;top:69px" for="CmbOrder">Order No</label>
    <div class="pr-abs" style="left:322px;top:64px;width:135px"><select id="CmbOrder" data-dtcombo="single" data-dtcombo-caption="OrderNo"></select></div>

    <label class="pr-abs" style="left:465px;top:10px" for="cmbsupplier">Customer Name</label>
    <div class="pr-abs" style="left:560px;top:5px;width:234px"><select id="cmbsupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select></div>
    <label class="pr-abs" style="left:471px;top:41px" for="cmbItemName">Item Name</label>
    <div class="pr-abs" style="left:560px;top:35px;width:234px"><select id="cmbItemName" data-dtcombo="single" data-dtcombo-caption="ItemName"></select></div>
    <label class="pr-abs" style="left:473px;top:69px" for="cmbstatus">Status</label>
    <div class="pr-abs" style="left:560px;top:64px;width:155px"><select id="cmbstatus" data-dtcombo="single" data-dtcombo-caption="Status"></select></div>
    <button type="button" class="lab-show pr-abs" id="btnshow" style="left:729px;top:65px;width:65px;height:26px">Show</button>
</div>
<section id="gridSection">
    <div class="pr-grid-bar" id="gridBar">History <span id="lblCount"></span>
        <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen" title="Fullscreen">Fullscreen</button></span>
    </div>
    <div class="pr-wrap" tabindex="0" id="gridWrap"><table data-gridbar="LabSaleRegister:grdGroupAnalysis" class="pr-grid" id="grdGroupAnalysis"></table></div>
</section>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/lab/countx_lab_sale_register.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
