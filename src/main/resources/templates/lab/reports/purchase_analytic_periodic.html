<!-- 630 Architecture.WinApp.Lab.LabPurchaseAnalyticPeriodic "Lab Purchase Analysis Periodic Report" (module 1011 Lab Report).
     Controls, captions and coordinates from InitializeComponent (LabPurchaseAnalyticPeriodic.cs:222-457):
     tsItemType { &New (no Click handler on the desktop), Define Season Year Schedule }, panel5 caption,
     panel1 / groupBox1 "Filters" (572x70), flowLayoutPanel1 of DynamicCards.LabPurchaseAnalyticCard. -->
<body class="pr">
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnnew" title="The desktop button has no Click handler (LabPurchaseAnalyticPeriodic.cs:249-253)">New</button>
    <button type="button" id="btnSeasonYearSchedule">Define Season Year Schedule</button>
    <a class="pr-right" href="/quality">Exit</a>
</nav>
<div class="pr-caption" id="label3">Lab Purchase Analytic Periodic Report</div>
<div id="panel1" style="height:75px;position:relative;background:#fff">
    <fieldset class="pr-filters lab-filters pr-abs" style="left:6px;top:3px;width:572px;height:70px;margin:0;background:#fff">
        <legend>Filters</legend>
        <label class="pr-abs" style="left:10px;top:20px" for="DateFrom">From Date</label>
        <div class="pr-abs" style="left:10px;top:40px;width:121px"><input type="date" id="DateFrom"></div>
        <label class="pr-abs" style="left:133px;top:20px" for="DateTo">To Date</label>
        <div class="pr-abs" style="left:133px;top:40px;width:119px"><input type="date" id="DateTo"></div>
        <label class="pr-abs" style="left:253px;top:20px" for="datSeasonStartDate">Season Start Date</label>
        <div class="pr-abs" style="left:253px;top:40px;width:126px"><input type="date" id="datSeasonStartDate" disabled></div>
        <label class="pr-abs" style="left:381px;top:20px" for="datSeasonEndDate">Season End Date</label>
        <div class="pr-abs" style="left:381px;top:40px;width:125px"><input type="date" id="datSeasonEndDate" disabled></div>
        <button type="button" class="lab-show pr-abs" id="btnshow" style="left:508px;top:38px;width:56px;height:26px" disabled>Show</button>
    </fieldset>
</div>
<div class="lab-flow" id="flowLayoutPanel1"></div>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/lab/countx_lab_report_tools.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_purchase_analytic_periodic.js?v=20261001a}"></script>
