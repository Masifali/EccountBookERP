<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Analysis Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_purchase_reports.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- 633 Architecture.WinApp.Lab.InvLabPurchaseRegister "Purchase Analylsis Report" (module 1011 Lab Report).
     Controls, captions and coordinates from InitializeComponent (InvLabPurchaseRegister.cs:578-1441):
     toolStrip3 { &Refresh (btnNew), 661-Print }, panel3 caption "Purchase Analysis Register", panel5 filters (964x94),
     panel7 "History" bar with ctrlGrdBar2 (MyGrid = grdGroupAnalysis), grdGroupAnalysis. -->
<body class="pr">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N">Refresh</button>
    <button type="button" id="print" title="Ctrl+P">661-Print</button>
    <a class="pr-right" href="/quality" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption" id="label23" style="height:29px;line-height:29px">Purchase Analysis Register</div>
<div class="pr-filters lab-panel" id="panel5" style="height:94px;min-width:964px">
    <label class="pr-abs" style="left:9px;top:11px" for="txtdatef">Date From</label>
    <div class="pr-abs" style="left:78px;top:7px;width:130px"><input type="date" id="txtdatef"></div>
    <label class="pr-abs" style="left:9px;top:40px" for="txtdatet">Date To</label>
    <div class="pr-abs" style="left:78px;top:36px;width:130px"><input type="date" id="txtdatet"></div>
    <label class="pr-abs lab-wrap" style="left:9px;top:60px;width:61px;height:33px" for="txtgpnof">GpNo From,To</label>
    <div class="pr-abs" style="left:78px;top:65px;width:64px"><input type="text" id="txtgpnof" autocomplete="off"></div>
    <div class="pr-abs" style="left:143px;top:65px;width:65px"><input type="text" id="txtgpnot" autocomplete="off" aria-label="GpNo To"></div>

    <label class="pr-abs" style="left:212px;top:11px" for="CmbOrder">Order No</label>
    <div class="pr-abs" style="left:308px;top:5px;width:202px"><select id="CmbOrder" data-dtcombo="single" data-dtcombo-caption="Order No"></select></div>
    <label class="pr-abs" style="left:212px;top:40px" for="cmbsupplier">Supplier Name</label>
    <div class="pr-abs" style="left:308px;top:34px;width:202px"><select id="cmbsupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>
    <label class="pr-abs" style="left:212px;top:69px" for="CmbParentCategory">Parent Category</label>
    <div class="pr-abs" style="left:308px;top:63px;width:202px"><select id="CmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select></div>

    <label class="pr-abs" style="left:515px;top:11px" for="cmbItemName">Item Name</label>
    <div class="pr-abs" style="left:628px;top:5px;width:202px"><select id="cmbItemName" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
    <label class="pr-abs" style="left:515px;top:40px" for="cmbstatus">Accepted / Rejected</label>
    <div class="pr-abs" style="left:628px;top:34px;width:202px"><select id="cmbstatus" data-dtcombo="single" data-dtcombo-caption="Status"></select></div>
    <button type="button" class="lab-show pr-abs" id="btnshow" style="left:765px;top:63px;width:65px;height:26px" title="Ctrl+S">Show</button>
</div>
<section id="gridSection">
    <div class="pr-grid-bar" id="panel7">History <span id="lblCount"></span>
        <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen" title="Show the grid on the whole window (Esc to leave)">Fullscreen</button></span>
    </div>
    <div class="pr-wrap lab-register-wrap" tabindex="0" id="gridWrap"><table data-gridbar="PurchaseAnalysisRegister:grdGroupAnalysis" class="pr-grid lab-two-line" id="grdGroupAnalysis"></table></div>
</section>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/lab/countx_lab_report_tools.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_purchase_analysis_register.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
