<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Analysis By Vehicle - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_purchase_reports.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- 626 Architecture.WinApp.Lab.LabDataVehicleWiseByParent "Purchase Analysis By Vehicle" (module 1011 Lab Report).
     Controls, captions and coordinates from InitializeComponent (LabDataVehicleWiseByParent.cs:859-1636):
     toolStrip3 { &New, 665-&Register, ShortCut Keys }, panel5 caption, panel3 = groupBox1 "Filters" (600x182) beside
     grdLabSummary, panel4 "Detail " bar with ctrlGrdBar1 (MyGrid = grdLabSummary), grdLabDetail. -->
<body class="pr">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N">New</button>
    <button type="button" id="Print">665-Register</button>
    <button type="button" id="btnShortCut">ShortCut Keys</button>
    <a class="pr-right" href="/quality" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption" id="label3">Purchase Analysis By Vehicle</div>
<div class="lab-top">
    <div class="lab-top-left">
        <fieldset class="pr-filters lab-filters" style="width:600px;height:182px">
            <legend>Filters</legend>
            <label class="pr-abs" style="left:5px;top:24px" for="datFromDate">From Date</label>
            <div class="pr-abs pr-date" style="left:98px;top:20px;width:177px"><input type="checkbox" id="chkFromDate" checked aria-label="Use From Date"><input type="date" id="datFromDate"></div>
            <label class="pr-abs" style="left:5px;top:52px" for="datToDate">To Date</label>
            <div class="pr-abs pr-date" style="left:98px;top:48px;width:177px"><input type="checkbox" id="chkToDate" checked aria-label="Use To Date"><input type="date" id="datToDate"></div>
            <label class="pr-abs" style="left:5px;top:77px" for="txtOrderNo">Order No</label>
            <div class="pr-abs" style="left:98px;top:73px;width:177px"><input type="text" id="txtOrderNo" autocomplete="off"></div>
            <label class="pr-abs" style="left:5px;top:102px" for="txtMoistureFrom">Moisture From</label>
            <div class="pr-abs" style="left:98px;top:98px;width:177px"><input type="text" id="txtMoistureFrom" autocomplete="off"></div>
            <label class="pr-abs" style="left:5px;top:127px" for="txtMoistureTo">Moisture To</label>
            <div class="pr-abs" style="left:98px;top:123px;width:177px"><input type="text" id="txtMoistureTo" autocomplete="off"></div>
            <label class="pr-abs" style="left:5px;top:154px" for="CmbParentCategory">Parent Category</label>
            <div class="pr-abs" style="left:98px;top:150px;width:177px"><select id="CmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Categories"></select></div>

            <label class="pr-abs" style="left:278px;top:24px" for="CmbItemName">Item Name</label>
            <div class="pr-abs" style="left:380px;top:18px;width:208px"><select id="CmbItemName" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
            <label class="pr-abs" style="left:278px;top:52px" for="CmbSupplier">Supplier Name</label>
            <div class="pr-abs" style="left:380px;top:46px;width:208px"><select id="CmbSupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>
            <label class="pr-abs" style="left:278px;top:77px" for="txtSlab1From">Slab1 From &amp; To</label>
            <div class="pr-abs" style="left:380px;top:73px;width:103px"><input type="text" id="txtSlab1From" class="lab-right" value="20" autocomplete="off"></div>
            <div class="pr-abs" style="left:485px;top:73px;width:103px"><input type="text" id="txtSlab1To" class="lab-right" value="22" autocomplete="off" aria-label="Slab1 To"></div>
            <label class="pr-abs" style="left:278px;top:102px" for="txtSlab2From">Slab2 From &amp; To</label>
            <div class="pr-abs" style="left:380px;top:98px;width:103px"><input type="text" id="txtSlab2From" class="lab-right" value="23" autocomplete="off"></div>
            <div class="pr-abs" style="left:485px;top:98px;width:103px"><input type="text" id="txtSlab2To" class="lab-right" value="24" autocomplete="off" aria-label="Slab2 To"></div>
            <label class="pr-abs" style="left:278px;top:127px" for="txtSlab3From">Slab3 From &amp; To</label>
            <div class="pr-abs" style="left:380px;top:123px;width:103px"><input type="text" id="txtSlab3From" class="lab-right" value="25" autocomplete="off"></div>
            <div class="pr-abs" style="left:485px;top:123px;width:103px"><input type="text" id="txtSlab3To" class="lab-right" value="30" autocomplete="off" aria-label="Slab3 To"></div>
            <button type="button" class="lab-show pr-abs" id="btnshow" style="left:530px;top:151px;width:58px;height:23px" title="Ctrl+S">Show</button>
        </fieldset>
    </div>
    <div class="lab-top-right">
        <div class="pr-wrap" tabindex="0" id="summaryWrap"><table data-gridbar="PurchaseAnalysisByVehicle:grdLabSummary" class="pr-grid" id="grdLabSummary"></table></div>
    </div>
</div>
<section id="gridSection">
    <div class="pr-grid-bar" id="panel4">Detail <span id="lblCount"></span>
        <span class="pr-right"><button type="button" id="btnGridPrint" title="Summary grid (ctrlGrdBar1.MyGrid = grdLabSummary)">Grid Print</button><button type="button" id="btnGridExport" title="Summary grid (ctrlGrdBar1.MyGrid = grdLabSummary)">Export</button><button type="button" id="btnFullscreen" title="Show the grid on the whole window (Esc to leave)">Fullscreen</button></span>
    </div>
    <div class="pr-wrap lab-detail-wrap" tabindex="0" id="detailWrap"><table class="pr-grid" id="grdLabDetail"></table></div>
</section>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20261005lab665}"></script>
<script th:src="@{/build/js/lab/countx_lab_report_tools.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_purchase_analysis_by_vehicle.js?v=20261005lab665}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body>
</html>
