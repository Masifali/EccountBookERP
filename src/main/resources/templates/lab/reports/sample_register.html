<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleTitle} + ' - EccountBookERP'">Sample Analysis Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_register_reports.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- 629 "Lab Sample Analysis Report" (ScreenName InvLabSampleRegister) and 632 "Sample Analysis Register"
     (ScreenName SampleAnalysisRegister): both are Architecture.WinApp.Lab.InvLabSampleRegister (module 1011).
     Controls, captions and coordinates from InvLabSampleRegister.cs InitializeComponent (:433). -->
<body class="pr lab-rr lab-sample" th:attr="data-screen-id=${screenId},data-screen-name=${screenName}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<!-- toolStrip3: btnNew "&Refresh", print "664-Print" -->
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N">Refresh</button>
    <button type="button" id="print" title="Ctrl+P">664-Print</button>
    <a class="pr-right" href="/quality" title="Ctrl+E / Esc">Exit</a>
</nav>
<!-- panel3: label23 + ctrlGrdBar2 (grid print / export of grdGroupAnalysis) -->
<div class="pr-caption">Sample Analysis Register <span class="pr-sub" id="lblCount"></span>
    <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen">Fullscreen</button></span>
</div>
<div id="prMessage" role="status" aria-live="polite" hidden></div>
<div class="pr-panel">
    <!-- panel5 854 x 102 -->
    <div class="pr-filters" style="height:102px;min-width:854px">
        <label class="pr-abs" style="left:7px;top:10px" for="CmbParentCategory">Parent Category</label>
        <div class="pr-abs" style="left:99px;top:5px;width:135px"><select id="CmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select></div>
        <label class="pr-abs" style="left:7px;top:40px" for="txtdatef">Date From</label>
        <div class="pr-abs" style="left:99px;top:35px;width:135px"><input type="date" id="txtdatef"></div>
        <label class="pr-abs" style="left:7px;top:69px" for="txtdatet">Date To</label>
        <div class="pr-abs" style="left:99px;top:64px;width:135px"><input type="date" id="txtdatet"></div>

        <label class="pr-abs" style="left:238px;top:10px" for="cmbsupplier">Supplier Name</label>
        <div class="pr-abs" style="left:324px;top:5px;width:234px"><select id="cmbsupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select></div>
        <label class="pr-abs" style="left:238px;top:41px" for="cmbItemName">Item Name</label>
        <div class="pr-abs" style="left:324px;top:35px;width:234px"><select id="cmbItemName" data-dtcombo="single" data-dtcombo-caption="ItemName"></select></div>
        <label class="pr-abs" style="left:238px;top:69px" for="cmbstatus">Status</label>
        <div class="pr-abs" style="left:324px;top:64px;width:155px"><select id="cmbstatus" data-dtcombo="single" data-dtcombo-caption="Status"></select></div>
        <button type="button" class="pr-show pr-abs" id="btnshow" style="left:493px;top:65px;width:65px">Show</button>
    </div>
    <section id="gridSection">
        <div class="pr-wrap" tabindex="0" id="gridWrap"><table data-gridbar="SampleRegister:grdGroupAnalysis" class="pr-grid" id="grdGroupAnalysis"></table></div>
    </section>
</div>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20260930h}"></script>
<script th:src="@{/build/js/countx_crystal_print.js?v=20261003erp}"></script>
<script th:src="@{/build/js/lab/countx_lab_report_tools.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_sample_register.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
