<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab Standard Policy For Deduction - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_standard_policy_for_deduction.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 166 "Lab Standard Policy For Deduction (Not Use)" —
    Architecture.WinApp.Lab/InvLabStandardPolicyForDeduction.cs (ScreenName InvLabStandardPolicyForDeduction).
    Designer: tabControl1 Dock Fill (742 x 428), tab pages "Form" / "History"; on the Form page panel1 (teal, 53),
    panel7 (90), panel8 (57), panel2 (teal, 21) are docked Top and grd is docked Fill. The docked panels and
    the grids stretch to the page width (the form is shown maximised); the controls inside panel7 / panel8
    keep the designer's Location / Size in px. Every id below is the desktop control name; the controls
    are in TabIndex order.
-->
<div id="rightsNote" class="spd-denied" hidden></div>
<div class="wf-root" th:attr="data-screen-id=${screenId}">

<!-- ========================================================================= tabForm "Form" -->
<div id="tabForm" class="spd-page is-active">

    <!-- panel1 (3,3) 728 x 53, Teal, Dock Top: btn (ToolStrip, 27) + label21 (3,30) -->
    <div class="wf-teal" id="panel1" style="height:53px;">
        <!-- btn.Items (:1664) = btnNew, btnSave, btnUpdate (Visible false), btnattachment (Visible false),
             toolStripSeparator, btnprint (no Click handler on the desktop) -->
        <div class="wf-strip" id="btn">
            <button type="button" class="wf-tool" id="btnNew"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" class="wf-tool" id="btnSave"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" class="wf-tool" id="btnUpdate" hidden><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <span class="wf-sep" id="toolStripSeparator"></span>
            <button type="button" class="wf-tool" id="btnprint" disabled title="The desktop Print button has no action on this form"><i class="fa fa-print"></i> <span><u>P</u>rint</span></button>
            <a href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
        </div>
        <span class="wf-teal-title" id="label21" style="left:3px;top:30px;">Lab Analysis Standard Policy for Deductions</span>
    </div>

    <!-- panel7 (3,56) 728 x 90, Dock Top, Segoe UI 9.75pt -->
    <div class="wf-rel" id="panel7" style="height:90px;">
        <label class="wf-abs wf-lbl" for="cmbApplyOn" id="label1" style="left:5px;top:11px;">Apply On</label>
        <span class="wf-abs wf-star" id="label30" style="left:71px;top:10px;">*</span>
        <select id="cmbApplyOn" class="wf-abs wf-cmb" style="left:85px;top:5px;width:268px;" data-dtcombo="single" data-dtcombo-caption="ApplyOn"></select>

        <label class="wf-abs wf-lbl" for="cmbitem" id="label8" style="left:5px;top:39px;">Item Name</label>
        <span class="wf-abs wf-star" id="label6" style="left:71px;top:38px;">*</span>
        <select id="cmbitem" class="wf-abs wf-cmb" style="left:85px;top:33px;width:268px;" data-dtcombo="labSpdItem" data-dtcombo-caption="Item Name"></select>

        <label class="wf-abs wf-lbl" for="txtremarks" id="label7" style="left:5px;top:65px;">Remarks</label>
        <input type="text" id="txtremarks" class="wf-abs wf-txt" style="left:85px;top:61px;width:552px;" autocomplete="off">

        <label class="wf-abs wf-lbl" for="txtAffectiveDate" id="label4" style="left:356px;top:11px;">Effective Date From</label>
        <span class="wf-abs wf-star" id="label13" style="left:464px;top:10px;">*</span>
        <input type="date" id="txtAffectiveDate" class="wf-abs wf-dt" style="left:478px;top:7px;width:159px;">

        <label class="wf-abs wf-lbl" for="TxtAffectiveDateTo" id="label2" style="left:356px;top:39px;">Effective Date To</label>
        <span class="wf-abs wf-star" id="label14" style="left:464px;top:38px;">*</span>
        <input type="date" id="TxtAffectiveDateTo" class="wf-abs wf-dt" style="left:478px;top:35px;width:159px;">

        <!-- chkIsaccepted (640,63): Checked, never read by the form and not saved -->
        <label class="wf-abs wf-check" style="left:640px;top:63px;"><input type="checkbox" id="chkIsaccepted" checked> Is Active</label>
    </div>

    <!-- panel8 (3,146) 728 x 57, Dock Top -->
    <div class="wf-rel" id="panel8" style="height:57px;">
        <label class="wf-abs wf-lbl" for="cmbparameter" id="label3" style="left:5px;top:8px;">Analysis Parameter</label>
        <span class="wf-abs wf-star" id="label15" style="left:113px;top:7px;">*</span>
        <select id="cmbparameter" class="wf-abs wf-cmb" style="left:5px;top:26px;width:162px;" data-dtcombo="single" data-dtcombo-caption="Analysis Perameter"></select>

        <label class="wf-abs wf-lbl" for="txtRangeFrom" id="label5" style="left:170px;top:8px;">Range From</label>
        <span class="wf-abs wf-star" id="label16" style="left:239px;top:7px;">*</span>
        <input type="text" id="txtRangeFrom" class="wf-abs wf-txt" style="left:170px;top:28px;width:83px;" autocomplete="off" inputmode="decimal">

        <label class="wf-abs wf-lbl" for="txtrangeTo" id="label9" style="left:256px;top:8px;">Range To</label>
        <span class="wf-abs wf-star" id="label17" style="left:318px;top:7px;">*</span>
        <input type="text" id="txtrangeTo" class="wf-abs wf-txt" style="left:256px;top:28px;width:76px;" autocomplete="off" inputmode="decimal">

        <label class="wf-abs wf-lbl" for="cmbdeduction" id="label10" style="left:334px;top:8px;">Deduction On</label>
        <span class="wf-abs wf-star" id="label18" style="left:414px;top:7px;">*</span>
        <select id="cmbdeduction" class="wf-abs wf-cmb" style="left:334px;top:26px;width:94px;" data-dtcombo="single" data-dtcombo-caption="DeductionOn"></select>

        <label class="wf-abs wf-lbl" for="TxtDecValue" id="label11" style="left:430px;top:8px;">Deduction Value</label>
        <span class="wf-abs wf-star" id="label19" style="left:531px;top:7px;">*</span>
        <input type="text" id="TxtDecValue" class="wf-abs wf-txt" style="left:430px;top:28px;width:115px;" autocomplete="off" inputmode="decimal">

        <label class="wf-abs wf-lbl" for="cmbweight" id="label12" style="left:547px;top:8px;">Weight Kg</label>
        <span class="wf-abs wf-star" id="label20" style="left:623px;top:7px;">*</span>
        <select id="cmbweight" class="wf-abs wf-cmb" style="left:547px;top:26px;width:90px;" data-dtcombo="single" data-dtcombo-caption="Weight Kg"></select>

        <button type="button" class="wf-abs wf-btn teal" id="btnAdd" style="left:640px;top:27px;width:40px;height:24px;">+</button>
        <button type="button" class="wf-abs wf-btn teal" id="btnUpdateDetail" style="left:640px;top:28px;width:83px;height:22px;" hidden>Update</button>
        <button type="button" class="wf-abs wf-btn teal" id="btnCancelDetail" style="left:640px;top:4px;width:83px;height:22px;" hidden>Cancel</button>
    </div>

    <div class="spd-gridbox" id="grdBox">
        <!-- panel2 (3,203) 728 x 21, Teal, Dock Top -->
        <div class="wf-teal spd-cap" id="panel2" style="height:21px;">
            <button type="button" class="spd-full-btn" id="grdFull" title="Full screen"><i class="fa fa-expand"></i></button>
        </div>
        <!-- grd (3,224) Dock Fill — AllowEdit False, GroupByBox hidden, RecordNavigator -->
        <div class="wf-grid" id="grdWrap"><table class="win-grid" id="grd"><thead></thead><tbody></tbody></table></div>
        <div class="spd-nav" id="grdNav"></div>
    </div>
</div>

<!-- ===================================================================== tabHistory "History" -->
<div id="tabHistory" class="spd-page">
    <div class="spd-gridbox" id="grdhistoryBox">
        <!-- panel4 (3,3) 728 x 47, Teal, Dock Top (no controls) -->
        <div class="wf-teal spd-cap" id="panel4" style="height:47px;">
            <button type="button" class="spd-full-btn" id="grdhistoryFull" title="Full screen"><i class="fa fa-expand"></i></button>
        </div>
        <!-- grdhistory (3,50) — AllowEdit / AllowDelete False, GroupByBox hidden, RecordNavigator -->
        <div class="wf-grid" id="grdhistoryWrap"><table class="win-grid" id="grdhistory"><thead></thead><tbody></tbody></table></div>
        <div class="spd-nav" id="grdhistoryNav"></div>
    </div>
</div>

<!-- tabControl1 headers + the History button at the right of the footer -->
<div class="wf-tabs" id="footer">
    <div class="win-tab is-active" data-tab="tabForm" id="tabBtnForm">Form</div>
    <div class="win-tab" data-tab="tabHistory" id="tabBtnHistory">History</div>
    <button type="button" class="wf-btn teal spd-history" id="btnHistory"><i class="fa fa-history"></i> History</button>
</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_standard_policy_for_deduction.js?v=20260930a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body>
</html>
