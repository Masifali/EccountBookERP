<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Analysis Parameter - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_stock_in_transit.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_analysis_group.css?v=20261001a}">
    <style>
        /* panel2 28 + panel3 155 above the grid, record navigator 24 below it. */
        .lab-grid.lab-grid-156 { height: calc(100vh - 28px - 155px - 20px - 24px - 40px); }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_page_kit.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 156 "Item Analysis Parameter" — Architecture.WinApp.Lab/InvLabAnalysisItems.cs (ScreenName InvLabAnalysisItems).
    Designer: ClientSize 637 x 532, WindowState Maximized (:906-911). panel1 (Fill) holds, top to bottom:
    panel2 (0,0) 637 x 28 with tsItemTaxSchedule · panel3 (0,28) 637 x 155 · panel4 (0,183) Fill with grdfrm.
    Every id below is the desktop control name. The form has no tabs, no History page, no Delete and no Print.
-->
<div id="rightsNote" class="sit-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root wf-tabctl lab-root">

    <!-- tsItemTaxSchedule — items in designer order (:876): btnnew, btnupdate, btnsave. -->
    <div class="wf-strip lab-strip" id="tsItemTaxSchedule" style="height:28px;">
        <button type="button" class="wf-tool" id="btnnew"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="wf-tool" id="btnupdate" hidden><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" class="wf-tool" id="btnsave"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <a th:href="@{/quality}" href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel3 (0,28) 637 x 155, BackColor White: panel5 teal (Top, 27) + groupBox1 "Information" (Left, 408 x 128) -->
    <div class="lab-panel" style="height:155px;">
        <div class="wf-teal" style="height:27px;">
            <span class="wf-teal-title lab-title" style="left:5px;top:3px;">Analysis Parameters</span>
        </div>
        <div class="wf-rel" style="height:128px;">
            <div class="wf-gb" id="groupBox1" style="left:0;top:0;width:408px;height:128px;">
                <span class="wf-cap">Information</span>

                <label class="wf-abs wf-lbl" for="CmbMasterParameter" id="label2" style="left:10px;top:21px;">Master Parameter</label>
                <!-- CmbMasterParameter (138,15) 261 x 26, TabIndex 0, LimitToList; header caption "Master Parameter" (:312) -->
                <select id="CmbMasterParameter" class="wf-abs wf-cmb" style="left:138px;top:15px;width:261px;"
                        data-dtcombo="single" data-dtcombo-caption="Master Parameter"></select>

                <label class="wf-abs wf-lbl" for="txtdescription" id="label45" style="left:10px;top:48px;">Parameter Description</label>
                <input type="text" id="txtdescription" class="wf-abs wf-txt" style="left:138px;top:44px;width:199px;" autocomplete="off">
                <label class="wf-abs wf-check" style="left:344px;top:47px;"><input type="checkbox" id="ChkIsSub"> IsSub</label>

                <label class="wf-abs wf-lbl" for="txtMinValue" id="label3" style="left:10px;top:74px;">Min Value</label>
                <input type="text" id="txtMinValue" class="wf-abs wf-txt" style="left:138px;top:70px;width:94px;" autocomplete="off">
                <label class="wf-abs wf-lbl" for="txtMaxValue" id="label4" style="left:238px;top:74px;">Max Value</label>
                <input type="text" id="txtMaxValue" class="wf-abs wf-txt" style="left:305px;top:70px;width:94px;" autocomplete="off">

                <!-- label6 + CmbParentParameter are Visible only while IsSub is ticked (ChkIsSub_CheckedChanged :398-417) -->
                <label class="wf-abs wf-lbl" for="CmbParentParameter" id="label6" style="left:11px;top:102px;" hidden>Parent Parameter</label>
                <div class="wf-abs" id="CmbParentParameterBox" style="left:138px;top:96px;width:261px;height:26px;" hidden>
                    <!-- CmbParentParameter (138,96) 261 x 26, TabIndex 5, LimitToList; header caption "Parent Parameter" (:241) -->
                    <select id="CmbParentParameter" class="wf-cmb" style="width:261px;"
                            data-dtcombo="single" data-dtcombo-caption="Parent Parameter"></select>
                </div>
            </div>
        </div>
    </div>

    <!-- panel4 (0,183) Fill: grdfrm — Janus GridEX, AllowEdit False, AllowDelete False (:258), FilterMode Automatic
         (filter row), GroupByBoxVisible False, RecordNavigator True, TotalRow True (:618-634).
         Columns (gridfill :228-234): Id (hidden :259), AnalysisParameter 250, ParentParameter 250,
         MasterParId (hidden :260), MasterParameter 250, MinValue 80, MaxValue 80 (:261-265). -->
    <div class="lab-fullbox" id="grdfrmBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Analysis Parameters</span><button type="button" class="lab-full-btn" data-full="grdfrmBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid lab-grid lab-grid-156" id="grdfrmWrap" tabindex="0">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="lab-nav" id="grdfrmNav">
        <span>Record:</span>
        <button type="button" id="navFirst" title="First">|&lt;</button>
        <button type="button" id="navPrev" title="Previous">&lt;</button>
        <input type="text" id="navPos" readonly>
        <span id="navCount">of 0</span>
        <button type="button" id="navNext" title="Next">&gt;</button>
        <button type="button" id="navLast" title="Last">&gt;|</button>
    </div>
    </div>

</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_page_kit.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab_item_analysis_parameter.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
