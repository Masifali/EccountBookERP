<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analysis Group - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_stock_in_transit.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_analysis_group.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_page_kit.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 157 "Analysis Group" — Architecture.WinApp.Lab/InvLabAnalysisGroup.cs (ScreenName InvLabAnalysisGroup).
    Designer: ClientSize 632 x 450, WindowState Maximized (:718-723). panel3 (Fill) holds, top to bottom:
    tsItemTaxSchedule (0,0) 632 x 27 · panel8 (0,27) 632 x 101 · panel4 (0,128) Fill with grdfrm.
    Every id below is the desktop control name. The form has no tabs, no History page, no Delete and no Print.
-->
<div id="rightsNote" class="sit-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root wf-tabctl lab-root" th:attr="data-screen-id=${screenId}">

    <!-- tsItemTaxSchedule — items in designer order (:688): btnnew, btnupdate, btnsave. btnupdate.Visible = false (:707). -->
    <div class="wf-strip lab-strip">
        <button type="button" class="wf-tool" id="btnnew"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="wf-tool" id="btnupdate" hidden><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" class="wf-tool" id="btnsave"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <a th:href="@{/quality}" href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel8 (0,27) 632 x 101, BackColor White: panel5 teal (Top, 27) + groupBox1 "Information" (Left, 453 x 74) -->
    <div class="lab-panel" style="height:101px;">
        <div class="wf-teal" style="height:27px;">
            <span class="wf-teal-title lab-title" style="left:5px;top:3px;">Analysis Group</span>
        </div>
        <div class="wf-rel" style="height:74px;">
            <div class="wf-gb" id="groupBox1" style="left:0;top:0;width:453px;height:74px;">
                <span class="wf-cap">Information</span>

                <label class="wf-abs wf-lbl" for="CmbGroupType" id="label8" style="left:10px;top:25px;">Group Type</label>
                <!-- CmbGroupType (84,19) 128 x 26, TabIndex 0, LimitToList; header caption "Group Type" (:332) -->
                <select id="CmbGroupType" class="wf-abs wf-cmb" style="left:84px;top:19px;width:128px;"
                        data-dtcombo="single" data-dtcombo-caption="Group Type"></select>

                <label class="wf-abs wf-lbl" for="txtcode" id="label44" style="left:218px;top:25px;">Group Code</label>
                <input type="text" id="txtcode" class="wf-abs wf-txt" style="left:294px;top:21px;width:151px;" autocomplete="off">

                <label class="wf-abs wf-lbl" for="txtdescription" id="label45" style="left:10px;top:52px;">Description</label>
                <input type="text" id="txtdescription" class="wf-abs wf-txt" style="left:84px;top:48px;width:361px;" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- panel4 (0,128) Fill: grdfrm — Janus GridEX, AllowEdit False, FilterMode Automatic (filter row),
         GroupByBoxVisible False, RecordNavigator True, TotalRow True (:535-551).
         Columns (gridfill :182-185): Id (hidden :211), GroupType (grouped + HideColumnsWhenGrouped :206-207),
         GroupCode 200, Description 200 (:208-209). -->
    <div class="lab-fullbox" id="grdfrmBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Analysis Groups</span><button type="button" class="lab-full-btn" data-full="grdfrmBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid lab-grid" id="grdfrmWrap" tabindex="0">
        <table class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="lab-nav" id="grdfrmNav">
        <span>Record:</span>
        <button type="button" id="navFirst" title="First">|&lt;</button>
        <button type="button" id="navPrev" title="Previous">&lt;</button>
        <input type="text" id="navPos" readonly>
        <span id="navCount">of 0</span>
        <button type="button" id="navNext" title="Next">&gt;</button>
        <button type="button" id="navLast" title="Last">&gt;|</button>
    </div>
    </div>

</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_page_kit.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_analysis_group.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-grid-control-placement}"></script>
</body>
</html>
