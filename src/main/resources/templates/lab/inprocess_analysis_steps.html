<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InProcess Analysis Steps Schedule - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_stock_in_transit.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_inprocess_analysis_steps.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_page_kit.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 163 "InProcess Analysis Steps Schedule" -
    Architecture.WinApp.Lab/LabInProcessAnalysisStepAndParameterSchedule.cs (ScreenName
    LabInProcessAnalysisStepAndParameterSchedule). Designer: ClientSize 783 x 535, WindowState Maximized;
    panel2 (toolstrip) Top 28, panel3 Top 133 = panel5 (teal) 26 + groupBox1 "Information" 501 x 107
    docked Left, panel4 Fill = grdfrm. Every id below is the desktop control name.
    The form has no tab control, no History tab, no Delete and no Print.
-->
<div id="rightsNote" class="sit-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root ips-root" th:attr="data-screen-id=${screenId}">
<div class="ips-page">

    <!-- panel2 / tsItemTaxSchedule - items in designer order (:1010): btnnew, btnRefresh, btnupdate, btnsave.
         btnRefresh has no image on the desktop. -->
    <div class="wf-strip ips-strip">
        <button type="button" class="wf-tool" id="btnnew" accesskey="n"><i class="fa fa-plus"></i> <u>N</u>ew</button>
        <button type="button" class="wf-tool" id="btnRefresh">Refresh</button>
        <button type="button" class="wf-tool" id="btnupdate" accesskey="u" hidden><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
        <button type="button" class="wf-tool" id="btnsave" accesskey="s"><i class="fa fa-save"></i> <u>S</u>ave</button>
        <a href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel5 (0,0) 783 x 26, Teal; label3 (3,3) Tahoma 12 bold white; ctrlGrdBar1 38 x 21 anchored Top,Right -->
    <div class="wf-teal" style="height:26px;">
        <span class="wf-teal-title" style="left:3px;top:3px;">Lab In Process Analysis Step And Parameter Schedule</span>
        <button type="button" class="wf-gbar ips-gbar" id="ctrlGrdBar1" disabled
                title="grid.User_Conrtols.CtrlGrdBar (the desktop's grid-layout bar) is not in the source set and is not ported"><i class="fa fa-bars"></i></button>
    </div>

    <!-- groupBox1 "Information" (0,26) 501 x 107, docked Left -->
    <div class="wf-rel" style="height:107px;">
        <div class="wf-gb" style="left:0;top:0;width:501px;height:107px;">
            <span class="wf-cap">Information</span>

            <label class="wf-abs wf-lbl" for="cmbPlantName" style="left:8px;top:26px;">Plant Name</label>
            <select id="cmbPlantName" class="wf-abs wf-cmb ips-cmb" style="left:165px;top:20px;width:254px;"
                    data-dtcombo="single" data-dtcombo-caption="Plant/Feader "></select>
            <button type="button" class="wf-abs ips-plus" id="btnPlant" style="left:421px;top:20px;" tabindex="-1"
                    title="Define Production Plant"><i class="fa fa-plus"></i></button>
            <!-- txtSortNo (452,22) 41 x 23: ReadOnly, Visible = false -->
            <input type="hidden" id="txtSortNo">

            <label class="wf-abs wf-lbl" for="cmbProcessStepName" style="left:8px;top:54px;">Process Analysis Step Name</label>
            <select id="cmbProcessStepName" class="wf-abs wf-cmb ips-cmb" style="left:165px;top:48px;width:254px;"
                    data-dtcombo="single" data-dtcombo-caption="Process Step Name"></select>
            <button type="button" class="wf-abs ips-plus" id="BtnStep" style="left:421px;top:48px;" tabindex="-1"
                    title="Define Process Step"><i class="fa fa-plus"></i></button>

            <label class="wf-abs wf-lbl" for="CmbParentParameter" style="left:8px;top:82px;">Parameter Name</label>
            <select id="CmbParentParameter" class="wf-abs wf-cmb ips-cmb" style="left:165px;top:76px;width:254px;"
                    data-dtcombo="single" data-dtcombo-caption="Item"></select>
            <button type="button" class="wf-abs ips-plus" id="btnDefineParameter" style="left:421px;top:76px;" tabindex="-1"
                    title="Item Analysis Parameter"><i class="fa fa-plus"></i></button>
        </div>
    </div>

    <!-- panel4 Fill: grdfrm (Janus GridEX, filter row, total row, record navigator) -->
    <div class="lab-fullbox" id="grdfrmBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Step And Parameter Schedule</span><button type="button" class="lab-full-btn" data-full="grdfrmBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid ips-grid" id="grdfrmWrap" tabindex="0">
        <table data-gridbar="InprocessAnalysisSteps:grdfrm" class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="ips-nav"><span>Record:</span> <span id="grdfrmNav">0 of 0</span></div>
    </div>

</div>
</div>
</div>

<!-- ============================ Architecture.WinApp/DefineProcessStep.cs (BtnStep -> new DefineProcessStep(UserAccount).Show()) -->
<div class="sit-modal" id="dlgProcessStep" hidden>
    <div class="sit-modal-box dps-box">
        <div class="sit-modal-head"><span>EccountBookERP</span><button type="button" id="dpsClose">&times;</button></div>
        <div class="sit-modal-body dps-body">
            <!-- toolStrip1 - designer order (dps:381): btnnew, btnUpdate, btnsave -->
            <div class="wf-strip dps-strip">
                <button type="button" class="wf-tool" id="dps_btnnew"><i class="fa fa-plus"></i> <u>N</u>ew</button>
                <button type="button" class="wf-tool" id="dps_btnUpdate" hidden><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
                <button type="button" class="wf-tool" id="dps_btnsave"><i class="fa fa-save"></i> <u>S</u>ave</button>
            </div>
            <!-- panel3 / panel6 (10,110,110); label23 (11,12) -->
            <div class="dps-band"><span>Production Process Steps</span></div>
            <!-- panel5 628 x 48: label2 (3,21), txtProcessStepName (147,21) 388 x 22; txtSortNo Visible = false -->
            <div class="dps-entry">
                <label for="dps_txtProcessStepName">Process Step Name</label>
                <input type="text" id="dps_txtProcessStepName" autocomplete="off">
                <input type="hidden" id="dps_txtSortNo">
            </div>
            <!-- panel4 Fill: grd -->
            <div class="wf-grid dps-grid"><table class="win-grid" id="dps_grd"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_page_kit.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_inprocess_analysis_steps.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
