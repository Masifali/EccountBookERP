<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VCI Parameter - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_stock_in_transit.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_vci_parameter.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 809 "VCI Parameter" — Architecture.WinApp.Lookups/ExImVCIParameter.cs (ScreenName ExImVCIParameter).
    Designer: ClientSize 542 x 450, WindowState Maximized, KeyPreview. Top to bottom:
    toolStrip1 (0,0) 542 x 27 · panel4 teal (0,27) 542 x 28 · panel1 white (0,55) 542 x 64 ·
    panel2 teal "History" (0,119) 542 x 29 · grdDetail (0,148) Fill.
    Every id below is the desktop control name. The form has no Delete and no Print.
-->
<div id="rightsNote" class="sit-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root wf-tabctl vcp-root" th:attr="data-screen-id=${screenId},data-vci-category-url=${vciCategoryUrl}">

    <!-- toolStrip1 — items in designer order: btnnew, btnRefresh, btnsave, btnUpdate (Visible = false), btnVCICategoryDefine -->
    <div class="wf-strip vcp-strip">
        <button type="button" class="wf-tool" id="btnnew"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="wf-tool" id="btnRefresh"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
        <button type="button" class="wf-tool" id="btnsave"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" class="wf-tool" id="btnUpdate" hidden><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" class="wf-tool" id="btnVCICategoryDefine"><span>VCI Category Define</span></button>
        <a th:href="@{/quality}" href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel4 (0,27) 542 x 28, Teal: label15 (5,4) Tahoma 12 bold, ControlLightLight -->
    <div class="wf-teal vcp-teal" style="height:28px;">
        <span class="wf-teal-title" id="label15" style="left:5px;top:4px;">Vehicle / Cargo Inspection  Parameters</span>
    </div>

    <!-- panel1 (0,55) 542 x 64, White -->
    <div class="vcp-panel" id="panel1">
        <label class="wf-abs wf-lbl" for="cmbvciCategory" id="label1" style="left:7px;top:10px;">VCI Category</label>
        <!-- cmbvciCategory (112,6) 248 x 24, TabIndex 0, LimitToList; column caption "VciCategory" (ParameterCategoryfill) -->
        <select id="cmbvciCategory" class="wf-abs wf-cmb" style="left:112px;top:6px;width:248px;height:24px;"
                data-dtcombo="single" data-dtcombo-caption="VciCategory"></select>

        <label class="wf-abs wf-lbl" for="txtDescription" id="label3" style="left:7px;top:38px;">Parameter Name</label>
        <!-- txtDescription (112,34) 248 x 23, TabIndex 1 -->
        <input type="text" id="txtDescription" class="wf-abs wf-txt" style="left:112px;top:34px;width:248px;" autocomplete="off">
    </div>

    <div class="vcp-gridbox" id="gridBox">
        <!-- panel2 (0,119) 542 x 29, Teal: label4 "History" (3,3); ctrlGrdBar1 40 x 26 anchored Top,Right -->
        <div class="wf-teal vcp-cap" id="panel2">
            <span class="wf-teal-title" id="label4" style="left:3px;top:3px;font-size:16px;">History</span>
            <span class="vcp-cap-tools">
                <button type="button" id="btnFull" title="Full screen"><i class="fa fa-arrows-alt"></i></button>
                <button type="button" id="ctrlGrdBar1" disabled title="Grid layout / print / export options are not ported"><i class="fa fa-cog"></i></button>
            </span>
        </div>

        <!-- grdDetail — Janus GridEX, AllowEdit False, RecordNavigator True, TotalRow True, GroupByBoxVisible False.
             Columns (FormHistory): Id (hidden), CategoryDescription (the group, hidden while grouped),
             ParameterDescription 250 (GrdSetting). -->
        <div class="wf-grid vcp-grid" id="grdDetailWrap" tabindex="0">
            <table data-gridbar="VciParameter:grdDetail" class="win-grid" id="grdDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="vcp-nav" id="grdDetailNav">
            <span>Record:</span>
            <button type="button" id="navFirst" title="First">|&lt;</button>
            <button type="button" id="navPrev" title="Previous">&lt;</button>
            <input type="text" id="navPos" readonly>
            <span id="navCount">of 0</span>
            <button type="button" id="navNext" title="Next">&gt;</button>
            <button type="button" id="navLast" title="Last">&gt;|</button>
        </div>
    </div>

    <!-- Web footer: History button at the right side (runs FormHistory() and takes the user to the History grid). -->
    <div class="vcp-foot">
        <button type="button" class="wf-btn" id="btnHistory"><i class="fa fa-history"></i> <span>History</span></button>
    </div>

</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_vci_parameter.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
