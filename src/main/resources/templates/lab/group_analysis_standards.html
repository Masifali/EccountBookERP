<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Group Analysis Standards - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_stock_in_transit.css?v=20260930a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_group_analysis_standards.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_page_kit.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 158 "Group Analysis Standards" - Architecture.WinApp.Lab/InvLabGroupAnalysisStandards.cs
    (ScreenName InvLabGroupAnalysisStandards). Designer: ClientSize 764 x 532, WindowState Maximized;
    panel3 (toolstrip) Top 31, panel4 Top 130 = panel6 (teal) 27 + groupBox1 "Information" 537 x 103
    docked Left, panel5 Fill = grdfrm. Every id below is the desktop control name.
    The form has no tab control, no History tab, no Delete and no Print.
-->
<div id="rightsNote" class="sit-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root gas-root" th:attr="data-screen-id=${screenId}">
<div class="gas-page">

    <!-- panel3 / tsItemTaxSchedule - items in designer order (:948): btnnew, btnRefresh, btnupdate, btnsave -->
    <div class="wf-strip gas-strip">
        <button type="button" class="wf-tool" id="btnnew" accesskey="n"><i class="fa fa-plus"></i> <u>N</u>ew</button>
        <button type="button" class="wf-tool" id="btnRefresh"><i class="fa fa-refresh"></i> Refresh</button>
        <button type="button" class="wf-tool" id="btnupdate" accesskey="u" hidden><i class="fa fa-pencil"></i> <u>U</u>pdate</button>
        <button type="button" class="wf-tool" id="btnsave" accesskey="s"><i class="fa fa-save"></i> <u>S</u>ave</button>
        <a href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel6 (0,0) 764 x 27, Teal; label3 (9,3) Tahoma 12 bold white -->
    <div class="wf-teal" style="height:27px;">
        <span class="wf-teal-title" style="left:9px;top:3px;">Group Analysis Standard </span>
    </div>

    <!-- groupBox1 "Information" (0,27) 537 x 103, docked Left -->
    <div class="wf-rel" style="height:103px;">
        <div class="wf-gb" style="left:0;top:0;width:537px;height:103px;">
            <span class="wf-cap">Information</span>

            <label class="wf-abs wf-lbl" for="cmbgroup" style="left:9px;top:24px;">Analysis Group</label>
            <select id="cmbgroup" class="wf-abs wf-cmb" style="left:124px;top:18px;width:244px;" tabindex="1"
                    data-dtcombo="single" data-dtcombo-caption="Analysis Group"></select>

            <label class="wf-abs wf-lbl" for="cmbitem" style="left:9px;top:52px;">Analysis Parameter</label>
            <select id="cmbitem" class="wf-abs wf-cmb" style="left:124px;top:46px;width:244px;" tabindex="2"
                    data-dtcombo="single" data-dtcombo-caption="Analysis Parameter Item"></select>

            <label class="wf-abs wf-lbl" for="txtminvalue" style="left:9px;top:79px;">Min Value</label>
            <input type="text" id="txtminvalue" class="wf-abs wf-txt r" style="left:124px;top:75px;width:94px;" tabindex="3" autocomplete="off">
            <label class="wf-abs gas-lbl-regular" for="txtmaxvalue" style="left:219px;top:78px;">Max Value</label>
            <input type="text" id="txtmaxvalue" class="wf-abs wf-txt r" style="left:288px;top:75px;width:80px;" tabindex="4" autocomplete="off">

            <label class="wf-abs wf-check" style="left:371px;top:78px;width:163px;height:20px;">
                <input type="checkbox" id="chkEditableAfterApproval" tabindex="5"> Is Editable After Approval</label>
        </div>
    </div>

    <!-- panel5 Fill: grdfrm (Janus GridEX, filter row, grouped by AnalysisGroup, total row, record navigator) -->
    <div class="lab-fullbox" id="grdfrmBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Group Analysis Standards</span><button type="button" class="lab-full-btn" data-full="grdfrmBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid gas-grid" id="grdfrmWrap" tabindex="6">
        <table data-gridbar="GroupAnalysisStandards:grdfrm" class="win-grid" id="grdfrm"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="gas-nav"><span>Record:</span> <span id="grdfrmNav">0 of 0</span></div>
    </div>

</div>
</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_page_kit.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_group_analysis_standards.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
