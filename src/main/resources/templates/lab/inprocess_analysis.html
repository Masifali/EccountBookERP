<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>In-Process Analysis - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_inprocess_analysis.css?v=20261001b}">
</head>
<body>
<!--
    Screen 162 "In-Process Analysis" — Architecture.WinApp.Lab/InvLabAnalysisInProcess.cs (DocumentTypeId 306).
    Designer geometry 1:1 in px (InitializeComponent :1934-3812): ClientSize 1184 x 611; tabControl1 Alignment
    Bottom; tabForm / tabHistory 1176 x 582, Padding 3. Every id below is the desktop control name.
    Line references (:n) are InvLabAnalysisInProcess.cs.
-->
<div id="rightsNote" class="ipa-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root wf-tabctl" th:attr="data-screen-id=${screenId},data-document-type-id=${documentTypeId}">

<!-- ========================================================================= tabForm "Form" -->
<div id="tabForm" class="ipa-page is-active">

    <!-- btn (ToolStrip) (3,3) 1170 x 27 — items in designer order (:2441): btnNew, BtnRefresh, btnUpdate, btnSave, btnprint, btnattachment -->
    <div class="wf-strip">
        <button type="button" class="wf-tool" id="btnNew"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="wf-tool" id="BtnRefresh"><i class="fa fa-repeat"></i> Refresh</button>
        <button type="button" class="wf-tool" id="btnUpdate" hidden><i class="fa fa-pencil"></i> Update</button>
        <button type="button" class="wf-tool" id="btnSave"><i class="fa fa-save"></i> Save</button>
        <button type="button" class="wf-tool" id="btnprint"><i class="fa fa-print"></i> Print-659</button>
        <button type="button" class="wf-tool" id="btnattachment" disabled title="Attachments (DMS) are not ported to the web page"><i class="fa fa-paperclip"></i> Attachment</button>
        <a href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
    </div>

    <!-- panel7 (3,30) 1170 x 199, Dock Top -->
    <div class="wf-rel" style="height:199px;">
        <!-- panel15 (0,0) 1170 x 31, Teal -->
        <div class="wf-teal wf-abs" style="left:0;top:0;right:0;height:31px;">
            <span class="wf-teal-title" style="left:4px;top:6px;">In-Process Analysis</span>
            <span class="ipa-teal-lbl" style="left:772px;top:9px;">Analysis Picture</span>
            <span class="ipa-teal-lbl" style="left:983px;top:9px;">Cooking Picture</span>
            <label class="wf-abs wf-check wf-check-w" style="left:1089px;top:7px;width:81px;height:18px;"><input type="checkbox" id="chkPreview" checked> Preview</label>
        </div>

        <!-- DOM order = desktop TabIndex order (txtdocno 0, txtdocdate 1, cmbPlantName 2, cmbproductionNo 3, cmbitem 4,
             txtremarks 5, cmbCropYear 6, cmbanalysisGroup 7, txtAnalystPerson 8, txtanalysistime 9, btnimg1 10 ... 15) -->
        <label class="wf-abs wf-lbl" for="txtdocno" style="left:7px;top:41px;">Document No</label>
        <input type="text" id="txtdocno" class="wf-abs wf-txt" style="left:97px;top:37px;width:73px;" disabled>
        <label class="wf-abs wf-lbl" for="txtdocdate" style="left:172px;top:41px;">Doc Date</label>
        <input type="date" id="txtdocdate" class="wf-abs wf-dt" style="left:230px;top:37px;width:116px;height:22px;">

        <label class="wf-abs wf-lbl" for="cmbPlantName" style="left:7px;top:68px;">Plant Name</label>
        <select id="cmbPlantName" class="wf-abs wf-cmb" style="left:97px;top:62px;width:249px;" data-dtcombo="single" data-dtcombo-caption="Plant"></select>

        <label class="wf-abs wf-lbl" for="cmbproductionNo" style="left:7px;top:95px;">Job Order No</label>
        <select id="cmbproductionNo" class="wf-abs wf-cmb" style="left:97px;top:89px;width:249px;" data-dtcombo="single" data-dtcombo-caption="JobOrderNo"></select>

        <label class="wf-abs wf-lbl" for="cmbitem" style="left:7px;top:122px;">Item Name</label>
        <select id="cmbitem" class="wf-abs wf-cmb" style="left:97px;top:116px;width:249px;" data-dtcombo="labIpaItem" data-dtcombo-caption="Item Name"></select>

        <label class="wf-abs wf-lbl" for="txtremarks" style="left:7px;top:149px;">Remarks</label>
        <textarea id="txtremarks" class="wf-abs wf-txt" style="left:97px;top:145px;width:609px;height:48px;"></textarea>

        <label class="wf-abs wf-lbl" for="cmbCropYear" style="left:351px;top:41px;">Crop Year</label>
        <select id="cmbCropYear" class="wf-abs wf-cmb" style="left:457px;top:35px;width:249px;" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select>

        <label class="wf-abs wf-lbl" for="cmbanalysisGroup" style="left:351px;top:68px;">Analysis Group</label>
        <select id="cmbanalysisGroup" class="wf-abs wf-cmb" style="left:457px;top:62px;width:249px;" data-dtcombo="single" data-dtcombo-caption="Analysis Group"></select>

        <label class="wf-abs wf-lbl" for="txtAnalystPerson" style="left:351px;top:95px;">Analyst Person</label>
        <input type="text" id="txtAnalystPerson" class="wf-abs wf-txt" style="left:457px;top:91px;width:249px;">

        <label class="wf-abs wf-lbl-lg" for="txtanalysistime" style="left:458px;top:120px;">Analysis Time</label>
        <input type="time" step="1" id="txtanalysistime" class="wf-abs wf-dt" style="left:574px;top:116px;width:132px;height:27px;font-size:14px;">

        <!-- sampleanalysispicture (712,36) 211 x 133 ; cookingpic (930,36) 212 x 133 — FixedSingle, StretchImage -->
        <div class="ipa-pic" id="sampleanalysispicture" style="left:712px;top:36px;width:211px;height:133px;"><img id="sampleanalysispictureImg" alt="" hidden></div>
        <div class="ipa-pic" id="cookingpic" style="left:930px;top:36px;width:212px;height:133px;"><img id="cookingpicImg" alt="" hidden></div>

        <button type="button" class="wf-abs wf-btn" id="btnimg1" style="left:714px;top:170px;width:64px;height:25px;">Browse</button>
        <button type="button" class="wf-abs wf-btn" id="btnAnalysisPictureClear" style="left:782px;top:170px;width:66px;height:25px;">Clear</button>
        <button type="button" class="wf-abs wf-btn" id="btnprv" style="left:852px;top:170px;width:70px;height:25px;">Preview</button>
        <button type="button" class="wf-abs wf-btn" id="btnimage2" style="left:931px;top:170px;width:65px;height:25px;">Browse</button>
        <button type="button" class="wf-abs wf-btn" id="btnCookingPicClear" style="left:1000px;top:170px;width:66px;height:25px;">Clear</button>
        <button type="button" class="wf-abs wf-btn" id="btnimgprevcookingpic" style="left:1070px;top:170px;width:73px;height:25px;">Preview</button>
        <!-- OpenFileDialog filter (:1737): *.jpg; *.jpeg; *.gif; *.PNG; *.png -->
        <input type="file" id="fileAnalysisPic" accept=".jpg,.jpeg,.gif,.png" hidden>
        <input type="file" id="fileCookingPic" accept=".jpg,.jpeg,.gif,.png" hidden>
    </div>

    <!-- panel1 (3,229) 1170 x 350, Fill: panel3 Fill 710 (Step Analysis) + panel2 Right 460 (Analysis Group) -->
    <div style="display:flex;">
        <div class="wf-block" id="blkStep" style="flex:710 1 0;">
            <div class="ipa-teal-center wf-teal-rel">Step Analysis Grid<button type="button" class="wf-fullbtn" data-full="blkStep" title="Fullscreen"><i class="fa fa-arrows-alt"></i></button></div>
            <!-- grdStepAnalysis 710 x 325: grouped by StepName, TotalRow, RecordNavigator -->
            <div class="wf-grid" style="height:calc(100vh - 330px);min-height:325px;"><table class="win-grid" id="grdStepAnalysis"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
        <div class="wf-block" id="blkGroup" style="flex:460 1 0;">
            <div class="ipa-teal-center wf-teal-rel">Analysis Group Grid<button type="button" class="wf-fullbtn" data-full="blkGroup" title="Fullscreen"><i class="fa fa-arrows-alt"></i></button></div>
            <!-- grdAnalysisGroup 460 x 325: TotalRow, RecordNavigator -->
            <div class="wf-grid" style="height:calc(100vh - 330px);min-height:325px;"><table class="win-grid" id="grdAnalysisGroup"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
    </div>
</div>

<!-- ====================================================================== tabHistory "History" -->
<div id="tabHistory" class="ipa-page">
    <!-- panel5 / toolStrip1 (0,0) 1170 x 30: btnNewHistory, btnRefreshHistory -->
    <div class="wf-strip" style="height:30px;">
        <button type="button" class="wf-tool" id="btnNewHistory"><i class="fa fa-file-o"></i> New</button>
        <button type="button" class="wf-tool" id="btnRefreshHistory"><i class="fa fa-repeat"></i> Refresh</button>
    </div>

    <!-- panel16 (0,0) 1170 x 33, Teal: label6 "History" -->
    <div class="wf-teal" style="height:33px;">
        <span class="wf-teal-title" style="left:1px;top:3px;font-size:19px;line-height:24px;">History</span>
    </div>

    <!-- panel20 (0,33) 1170 x 105: groupBox2 "Filters" (5,2) 765 x 99 -->
    <div class="wf-rel" style="height:105px;">
        <div class="wf-gb" style="left:5px;top:2px;width:765px;height:99px;">
            <span class="wf-cap">Filters</span>

            <label class="wf-abs wf-lbl" for="FromDateHistory" style="left:6px;top:19px;">From &amp; To Date</label>
            <div class="wf-abs wf-dtc" style="left:116px;top:15px;width:134px;"><input type="checkbox" id="chkFromDateHistory" checked><input type="date" id="FromDateHistory"></div>
            <div class="wf-abs wf-dtc" style="left:251px;top:15px;width:134px;"><input type="checkbox" id="chkToDateHistory" checked><input type="date" id="ToDateHistory"></div>

            <label class="wf-abs wf-lbl" for="FromDocNoHistory" style="left:6px;top:46px;">From &amp; To Doc No</label>
            <input type="text" id="FromDocNoHistory" class="wf-abs wf-txt" style="left:116px;top:42px;width:134px;">
            <input type="text" id="ToDocNoHistory" class="wf-abs wf-txt" style="left:251px;top:42px;width:134px;">

            <label class="wf-abs wf-lbl" for="CmbJobOrderHistory" style="left:6px;top:73px;">Job Order</label>
            <select id="CmbJobOrderHistory" class="wf-abs wf-cmb" style="left:116px;top:67px;width:269px;" data-dtcombo="single" data-dtcombo-caption="Job Order"></select>

            <label class="wf-abs wf-lbl" for="CmbPlantHistory" style="left:389px;top:19px;">Plant Name</label>
            <select id="CmbPlantHistory" class="wf-abs wf-cmb" style="left:472px;top:13px;width:218px;" data-dtcombo="single" data-dtcombo-caption="Plant"></select>

            <label class="wf-abs wf-lbl" for="CmbItemHistory" style="left:389px;top:46px;">Item Name</label>
            <select id="CmbItemHistory" class="wf-abs wf-cmb" style="left:472px;top:40px;width:218px;" data-dtcombo="single" data-dtcombo-caption="Item Name"></select>

            <label class="wf-abs wf-lbl" for="CmbAnalystHistory" style="left:389px;top:73px;">Analyst Name</label>
            <select id="CmbAnalystHistory" class="wf-abs wf-cmb" style="left:472px;top:67px;width:218px;" data-dtcombo="single" data-dtcombo-caption="Analyst Person"></select>

            <button type="button" class="wf-abs wf-btn" id="btnShowHistory" style="left:693px;top:67px;width:62px;height:26px;">Show</button>
        </div>
    </div>

    <!-- grdhistory (0,138) 1170 x 293: FilterMode Automatic, TotalRow, FrozenColumns 2 -->
    <div class="wf-block" id="blkHistory">
        <div class="wf-gcap"><span>History records &mdash; click a DocNo to open the record</span><button type="button" class="wf-fullbtn" data-full="blkHistory" title="Fullscreen"><i class="fa fa-arrows-alt"></i></button></div>
        <div class="wf-grid" style="height:calc(100vh - 400px);min-height:293px;"><table class="win-grid" id="grdhistory"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </div>

    <!-- panel8 (0,461) 1170 x 21, Teal: panel11 Left 576 "Plant Step Analysis" + panel12 Fill 594 "Group Analysis" -->
    <!-- panel9 Left 576 x 94 (grdStepAnalysisHistory) + panel10 Fill 594 x 94 (grdGroupAnalysisHistory); each half carries its own caption so both stretch -->
    <div style="display:flex;">
        <div class="wf-block" id="blkStepHistory" style="flex:576 1 0;">
            <div class="wf-teal" style="height:21px;"><span class="ipa-teal-sub" style="left:5px;top:2px;">Plant Step Analysis</span><button type="button" class="wf-fullbtn" data-full="blkStepHistory" title="Fullscreen"><i class="fa fa-arrows-alt"></i></button></div>
            <div class="wf-grid" style="height:120px;"><table class="win-grid" id="grdStepAnalysisHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
        <div class="wf-block" id="blkGroupHistory" style="flex:594 1 0;">
            <div class="wf-teal" style="height:21px;"><span class="ipa-teal-sub" style="left:5px;top:2px;">Group Analysis</span><button type="button" class="wf-fullbtn" data-full="blkGroupHistory" title="Fullscreen"><i class="fa fa-arrows-alt"></i></button></div>
            <div class="wf-grid" style="height:120px;"><table class="win-grid" id="grdGroupAnalysisHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
    </div>
</div>

<!-- tabControl1 headers (Alignment = Bottom) -->
<div class="wf-tabs">
    <div class="win-tab is-active" data-tab="tabForm" id="tabBtnForm">Form</div>
    <div class="win-tab" data-tab="tabHistory" id="tabBtnHistory">History</div>
    <!-- acceptance rule 4: the History button at the right side of the footer (switches Form <-> History) -->
    <button type="button" class="wf-foot-btn" id="btnHistory"><i class="fa fa-history"></i> History</button>
</div>
</div>
</div>

<!-- ============================ LabImagesPreview (btnprv_Click :1804, FormHelper.ShowLabImagesPreview :1409) -->
<div class="ipa-modal" id="dlgPreview" hidden>
    <div class="ipa-modal-box">
        <div class="ipa-modal-head"><span>Image Preview</span><button type="button" id="dlgPreviewClose">&times;</button></div>
        <div class="ipa-modal-body"><img id="dlgPreviewImg" alt="" hidden></div>
    </div>
</div>

<!-- ============================ AttachmentView (grdhistory_LinkClicked "NoOfAttachments" :1399 -> CommonServices.GetNoofAttachmentsByRefDocumentTypeID: AttachmentName, CustomName, EntryDate) -->
<div class="ipa-modal" id="dlgAttachments" hidden>
    <div class="ipa-modal-box" style="width:min(720px,96vw);">
        <div class="ipa-modal-head"><span>Attachments</span><button type="button" id="dlgAttachmentsClose">&times;</button></div>
        <div class="ipa-modal-body" style="text-align:left;"><div class="wf-grid" style="max-height:70vh;"><table class="win-grid" id="grdAttachments"><thead><tr><th>AttachmentName</th><th>CustomName</th><th>EntryDate</th></tr></thead><tbody></tbody></table></div></div>
    </div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_inprocess_analysis.js?v=20261001b}"></script>
</body>
</html>
