<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Log Register - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_sample_log_register.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_lab_page_kit.css?v=20261001a}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<!--
    Screen 155 "Sample Log Register" — Architecture.WinApp.Lab/InvLabSampleLogRegister.cs (DocumentTypeId 301).
    Designer geometry 1:1 in px: ClientSize 1041 x 749; tabControl1 Alignment Bottom, tab pages 1033 x 723, Padding 3.
    Every id below is the desktop control name. Controls are in TabIndex order (Enter = Tab, :920).
-->
<div id="rightsNote" class="slr-denied" hidden></div>
<div class="wf-scroll">
<div class="wf-root wf-tabctl" th:attr="data-screen-id=${screenId},data-document-type-id=${documentTypeId}">

<!-- ========================================================================= tabForm "Form" -->
<div id="tabForm" class="slr-page is-active">

    <!-- btn / toolStrip (3,3) 1027 x 28 — items in designer order: toolStripButton1, btnNew, btnUpdate, btnSave,
         btnattachment, btnLabAnalysisGroup, btnLabAnalysisItem, btnGroupPerameter, toolStripSeparator -->
    <div class="wf-strip" id="btn">
        <button type="button" class="wf-tool slr-title" id="toolStripButton1" tabindex="-1">Sample Log Register</button>
        <button type="button" class="wf-tool" id="btnNew"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
        <button type="button" class="wf-tool" id="btnUpdate" hidden><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
        <button type="button" class="wf-tool" id="btnSave"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
        <button type="button" class="wf-tool" id="btnattachment"><i class="fa fa-paperclip"></i> <span><u>A</u>ttechment</span></button>
        <button type="button" class="wf-tool" id="btnLabAnalysisGroup">Lab Analysis Group</button>
        <button type="button" class="wf-tool" id="btnLabAnalysisItem">Lab Analysis Item</button>
        <button type="button" class="wf-tool" id="btnGroupPerameter">Group Perameter</button>
        <span class="wf-sep" id="toolStripSeparator"></span>
        <a href="/quality" class="wf-tool wf-exit" id="lnkExit"><i class="fa fa-arrow-left"></i> Exit</a>
        <!-- ctrlGrdBar1 (978,3) 41 x 24, Anchor Top|Right -->
        <button type="button" class="wf-abs wf-gbar" id="ctrlGrdBar1" style="right:6px;top:1px;width:41px;" disabled title="Grid layout / print / export options (CtrlGrdBar) are not ported"><i class="fa fa-cog"></i></button>
    </div>

    <!-- panel7 (3,31) 1027 x 183, Dock Top -->
    <div class="wf-rel" id="panel7" style="height:183px;">
        <label class="wf-abs wf-lbl" for="txtsampleno" id="label1" style="left:17px;top:12px;">Sample No</label>
        <input type="text" id="txtsampleno" class="wf-abs wf-txt" style="left:122px;top:8px;width:241px;" disabled>

        <label class="wf-abs wf-lbl" for="txtsampled" id="txtsampledate" style="left:17px;top:40px;">Sample Date</label>
        <input type="date" id="txtsampled" class="wf-abs wf-dt" style="left:122px;top:36px;width:241px;">

        <label class="wf-abs wf-lbl" for="cmbsup" id="cmbsupplier" style="left:17px;top:67px;">Supplier</label>
        <select id="cmbsup" class="wf-abs wf-cmb" style="left:122px;top:63px;width:241px;" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select>

        <label class="wf-abs wf-lbl" for="cmbreferenceparty" id="txt" style="left:17px;top:95px;">Reference Party</label>
        <select id="cmbreferenceparty" class="wf-abs wf-cmb" style="left:122px;top:91px;width:241px;" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select>

        <label class="wf-abs wf-lbl" for="cmbcity" id="cmpcity" style="left:17px;top:123px;">City</label>
        <select id="cmbcity" class="wf-abs wf-cmb" style="left:122px;top:119px;width:241px;" data-dtcombo="single" data-dtcombo-caption="City Name"></select>

        <label class="wf-abs wf-lbl" for="cmbitem" id="label6" style="left:384px;top:12px;">Item</label>
        <select id="cmbitem" class="wf-abs wf-cmb" style="left:478px;top:8px;width:240px;" data-dtcombo="labSlrItem" data-dtcombo-caption="Item Name"></select>

        <label class="wf-abs wf-lbl" for="cmbCropYear" id="label7" style="left:384px;top:40px;">Crop Year</label>
        <select id="cmbCropYear" class="wf-abs wf-cmb" style="left:478px;top:36px;width:240px;" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select>

        <label class="wf-abs wf-lbl" for="cmbJobLot" id="label8" style="left:384px;top:67px;">JobLot</label>
        <select id="cmbJobLot" class="wf-abs wf-cmb" style="left:478px;top:63px;width:240px;" data-dtcombo="single" data-dtcombo-caption="Job Lot"></select>

        <label class="wf-abs wf-lbl" for="txtqty" id="label9" style="left:384px;top:95px;">Qty</label>
        <input type="text" id="txtqty" class="wf-abs wf-txt r" style="left:478px;top:91px;width:77px;" autocomplete="off">

        <label class="wf-abs wf-lbl" for="CmbPackSize" id="label2" style="left:566px;top:95px;">Pack Size</label>
        <select id="CmbPackSize" class="wf-abs wf-cmb" style="left:624px;top:91px;width:94px;" data-dtcombo="single" data-dtcombo-caption="Pack UOM"></select>

        <label class="wf-abs wf-lbl" for="txtweight" id="label10" style="left:384px;top:123px;">Weight</label>
        <input type="text" id="txtweight" class="wf-abs wf-txt r" style="left:478px;top:119px;width:240px;" readonly>

        <label class="wf-abs wf-lbl" for="txtremarks" id="label12" style="left:17px;top:151px;">Other Remarks</label>
        <input type="text" id="txtremarks" class="wf-abs wf-txt" style="left:122px;top:147px;width:596px;" autocomplete="off">

        <label class="wf-abs wf-check" style="left:723px;top:153px;"><input type="checkbox" id="isprint"> Print</label>

        <button type="button" class="wf-abs wf-btn" id="btnimg1" style="left:831px;top:147px;width:75px;height:27px;">Browse</button>
        <input type="file" id="picFile" accept=".jpg,.jpeg,.png,.PNG" hidden>

        <!-- picbox1 (735,8) 272 x 137, FixedSingle, StretchImage -->
        <div class="wf-abs slr-pic" id="picbox1" style="left:735px;top:8px;width:272px;height:137px;"><img id="picbox1Img" alt="" hidden></div>
    </div>

    <!-- panel1 (3,214) Fill — grd (TotalRow, RecordNavigator, GroupByBox hidden) -->
    <div class="lab-fullbox" id="grdBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Sample Log Register</span><button type="button" class="lab-full-btn" data-full="grdBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid" id="grdWrap" style="height:calc(100vh - 320px);min-height:280px;"><table data-gridbar="SampleLogRegister:grd" class="win-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    <div class="slr-nav" id="grdNav"></div>
    </div>
</div>

<!-- ===================================================================== tabHistory "History" -->
<div id="tabHistory" class="slr-page">
    <!-- panel2 (0,0) 1027 x 135, Dock Top -->
    <div class="wf-rel" id="panel2" style="height:135px;">
        <!-- panel3 (0,0) 1027 x 34, BackColor 10,110,110 -->
        <div class="wf-teal" id="panel3" style="height:34px;">
            <span class="wf-teal-title" id="label23" style="left:11px;top:4px;">Sample Log History</span>
            <button type="button" class="wf-abs wf-gbar w" id="ctrlGrdBar2" style="right:3px;top:4px;width:41px;" disabled title="Grid layout / print / export options (CtrlGrdBar) are not ported"><i class="fa fa-cog"></i></button>
        </div>

        <label class="wf-abs wf-lbl ms" for="FromDate" id="label27" style="left:7px;top:38px;">Date From</label>
        <input type="date" id="FromDate" class="wf-abs wf-dt ms" style="left:9px;top:58px;width:131px;">
        <label class="wf-abs wf-lbl ms" for="ToDate" id="label33" style="left:146px;top:38px;">Date To</label>
        <input type="date" id="ToDate" class="wf-abs wf-dt ms" style="left:147px;top:58px;width:131px;">

        <label class="wf-abs wf-lbl" for="CmbSupplierCriteria" id="label4" style="left:285px;top:37px;">Supplier</label>
        <select id="CmbSupplierCriteria" class="wf-abs wf-cmb" style="left:283px;top:56px;width:241px;" data-dtcombo="single" data-dtcombo-caption="Supplier Customer"></select>

        <label class="wf-abs wf-lbl" for="CmbRefrencePartyCriteria" id="label3" style="left:531px;top:37px;">Reference Party</label>
        <select id="CmbRefrencePartyCriteria" class="wf-abs wf-cmb" style="left:526px;top:56px;width:247px;" data-dtcombo="single" data-dtcombo-caption="Reference party"></select>

        <label class="wf-abs wf-lbl" for="CmbItemCriteria" id="label5" style="left:777px;top:37px;">Item</label>
        <select id="CmbItemCriteria" class="wf-abs wf-cmb" style="left:777px;top:56px;width:245px;" data-dtcombo="labSlrItem" data-dtcombo-caption="Item Name"></select>

        <label class="wf-abs wf-lbl" for="CmbCropCriteria" id="label11" style="left:7px;top:82px;">Crop Year</label>
        <select id="CmbCropCriteria" class="wf-abs wf-cmb" style="left:9px;top:103px;width:131px;" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select>

        <label class="wf-abs wf-lbl" for="CmbCityCriteria" id="label13" style="left:145px;top:82px;">City</label>
        <select id="CmbCityCriteria" class="wf-abs wf-cmb" style="left:144px;top:103px;width:142px;" data-dtcombo="single" data-dtcombo-caption="City Name"></select>

        <button type="button" class="wf-abs wf-btn teal" id="btnshow" style="left:291px;top:103px;width:58px;height:23px;">Show</button>
    </div>

    <!-- grdhistory (0,135) Fill — FilterMode Automatic, TotalRow, RecordNavigator -->
    <div class="lab-fullbox" id="grdhistoryBox">
    <!-- rule 6: grid caption with the fullscreen toggle (Esc leaves it); the block is as wide as the page -->
    <div class="lab-gridcap"><span>Sample Log History</span><button type="button" class="lab-full-btn" data-full="grdhistoryBox" title="Full screen" tabindex="-1"><i class="fa fa-expand"></i></button></div>
    <div class="wf-grid" id="grdhistoryWrap" style="height:calc(100vh - 270px);min-height:320px;"><table data-gridbar="SampleLogRegister:grdhistory" class="win-grid" id="grdhistory"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    <div class="slr-nav" id="grdhistoryNav"></div>
    </div>
</div>

<!-- tabControl1 headers (Alignment = Bottom) -->
<div class="wf-tabs">
    <div class="win-tab is-active" data-tab="tabForm" id="tabBtnForm">Form</div>
    <div class="win-tab" data-tab="tabHistory" id="tabBtnHistory">History</div>
    <!-- rule 4: the History button at the right side of the form's footer - opens the History tab and runs
         btnshow_Click (tabControl1_SelectedIndexChanged :1011); on the History tab it leads back to the form. -->
    <div class="lab-footer-right">
        <button type="button" class="lab-hist-btn" id="btnHistory" title="History"><i class="fa fa-history"></i> <span id="btnHistoryText">History</span></button>
    </div>
</div>
</div>
</div>

<!-- ============================ Attachment (Account_Definition/Attachment.cs — Text "Attachment", label2 "Attechment",
     Choose "Browse", btnClose "Close"). The camera capture of the desktop dialog is not ported. -->
<div class="slr-modal" id="dlgAttachment" hidden>
    <div class="slr-modal-box">
        <div class="slr-modal-head"><span>Attachment</span><button type="button" id="dlgAttachmentX">&times;</button></div>
        <div class="slr-modal-body">
            <div class="slr-modal-bar">
                <span class="slr-cap">Attechment</span>
                <button type="button" class="wf-btn" id="Choose">Browse</button>
                <button type="button" class="wf-btn" id="btnClose">Close</button>
                <input type="file" id="attFile" multiple hidden>
            </div>
            <div class="wf-grid" style="max-height:50vh;"><table class="win-grid" id="grdAttachment"><thead><tr><th>File</th><th>Size</th><th style="width:60px;"></th></tr></thead><tbody></tbody></table></div>
            <div class="slr-note">The files are saved with the record on Save / Update (5 MB per file, ten new files at a time).</div>
        </div>
    </div>
</div>

<!-- ============================ AttachmentView (Architecture.WinApp/AttachmentView.cs — label1 "Attachments",
     label2 "Total Files", label5 "Total Size (Mbs)") -->
<div class="slr-modal" id="dlgAttachmentView" hidden>
    <div class="slr-modal-box">
        <div class="slr-modal-head"><span>EccountBook</span><button type="button" id="dlgAttachmentViewX">&times;</button></div>
        <div class="slr-modal-body">
            <div class="slr-modal-bar">
                <span class="slr-cap">Attachments</span>
                <span>Total Files <b id="lblTotalFiles">0</b></span>
                <span>Total Size (Mbs) <b id="lblTotalSize">0</b></span>
            </div>
            <div class="wf-grid" style="max-height:50vh;"><table class="win-grid" id="grdAttachmentView"><thead><tr><th>File</th><th>Size</th><th>Entry User</th><th>Entry Date</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/lab/countx_lab_page_kit.js?v=20261001a}"></script>
<script th:src="@{/build/js/lab/countx_lab_sample_log_register.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261006-gridmount}"></script>
</body>
</html>
