<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <!-- Lab, module 7. The eight screen ids below are the real dbo.ScreenDefinition ids read from
         migration/user-rights/reconciliation-input.json - they are not matched by name. -->
    <style>
        body { font-family: "Segoe UI", Verdana, Tahoma, sans-serif; background-color: #00695c; font-size: 12px; color: #fff; margin: 0; }
        .hdr { padding: 14px 18px 4px; }
        .hdr h1 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 2px; }
        .crumb { background: #b0bec5; color: #263238; font-size: 11px; padding: 4px 18px; }
        .tiles { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px 18px 30px; }
        .tile { background: #fff; color: #263238; width: 220px; min-height: 92px; border-radius: 3px;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                text-decoration: none; padding: 12px 8px; text-align: center; }
        .tile:hover { text-decoration: none; color: #00695c; box-shadow: 0 0 0 2px #ffe082; }
        .tile .ic { font-size: 20px; color: #e91e63; margin-bottom: 8px; }
        .tile .nm { font-weight: 700; font-size: 12px; }
        .tile.pending { background: #cfd8dc; color: #546e7a; cursor: not-allowed; }
        .tile.pending .ic { color: #90a4ae; }
        .tile .sub { font-size: 10px; color: #78909c; margin-top: 4px; }
    </style>
</head>
<body>

<div class="crumb">Screens &gt; Lab</div>
<div class="hdr"><h1>Lab</h1></div>

<div class="tiles">

    <a class="tile" th:href="@{/lab/item-analysis-parameter}">
        <span class="ic"><i class="fa fa-flask"></i></span>
        <span class="nm">Item Analysis Parameter</span>
    </a>

    <!-- Not built yet. Shown, but not linked: a tile that opens someone else's page is worse than
         a tile that says it is not ready. -->
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">Sample Log Register</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">Analysis Group</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">Group Analysis Standards</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">Sample Analysis</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">Purchase Analysis</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">In-Process Analysis</span><span class="sub">not built</span></span>
    <span class="tile pending"><span class="ic"><i class="fa fa-star-o"></i></span>
        <span class="nm">InProcess Analysis Steps Schedule</span><span class="sub">not built</span></span>

</div>

</body>
</html>
