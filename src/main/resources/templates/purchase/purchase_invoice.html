<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Invoice</title>
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}"><link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css}"><link rel="stylesheet" th:href="@{/build/css/countx_direct_invoice.css}"><style>.invoice-scroll input{height:23px;width:100px;border:1px solid #aaa;font:12px Verdana}.invoice-scroll .wide-input{width:220px}.invoice-scroll .dtcombo-wrap{width:230px}.invoice-scroll select{width:230px;height:26px}.invoice-scroll td:has(select){min-width:230px}.invoice-scroll a{color:#006b6b}.invoice-dialog{position:fixed;inset:5%;z-index:15000;background:#f0f0f0;border:1px solid #777;box-shadow:0 8px 40px #0004;display:flex;flex-direction:column;padding:6px}.invoice-dialog .invoice-scroll{flex:1;max-height:none}.invoice-dialog [type=checkbox]{width:16px;height:16px}.invoice-tools [type=checkbox]{margin:0}#invoiceGrnLoader{max-width:1100px;margin:auto}.invoice-grid-actions{display:flex;gap:4px;padding:3px;background:#f0f0f0}.invoice-dialog h2{display:flex;justify-content:space-between}#invoiceHistory{margin-top:5px}</style></head><body>
<nav class="invoice-tools"><button id="invoiceNew" onclick="purchaseInvoice.newRecord(this)">New</button><button id="invoiceRefresh" onclick="purchaseInvoice.refresh(this)">Refresh</button><button id="invoiceSave" onclick="purchaseInvoice.save(this)" disabled>Save</button><button id="invoiceDelete" onclick="purchaseInvoice.remove(this)" hidden>Delete</button><button id="invoiceLoaderButton" onclick="purchaseInvoice.openLoader(this)">Load GRNs</button><button id="invoiceAttachments" onclick="purchaseInvoice.attachments(this)">Attachments</button><button id="invoiceHistoryButton" onclick="purchaseInvoice.history(this)">History</button><a href="/purchase/dashboard">Purchase</a></nav>
<h1>Purchase Invoice <span id="invoiceCode"></span><label style="font:12px Verdana"><input id="customAccounts" type="checkbox">Custom Accounts</label></h1><div id="invoiceMessage" role="status"></div><main>
<section class="invoice-panel"><div class="invoice-fields"><label class="invoice-field" style="width:70px">Doc No<input id="docNo" type="text"  style="height:23px" readonly></label>
<label class="invoice-field" style="width:62px">Branch No<input id="branchNo" type="text"  style="height:23px" readonly></label>
<label class="invoice-field" style="width:122px">Doc Date<input id="docDate" type="date"  style="height:23px" ></label>
<label class="invoice-field" style="width:63px">GRN No<input id="grnNo" type="number" step="any" style="height:23px" ></label>
<label class="invoice-field" style="width:70px">Bill No<input id="manualBill" type="text"  style="height:23px" ></label>
<label class="invoice-field" style="width:256px">Supplier Name<select id="supplier" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:212px">Location Type<select id="location" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:256px">Payment Terms<select id="paymentTerm" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:70px">Due Days<input id="dueDays" type="number" step="any" style="height:23px" ></label>
<label class="invoice-field" style="width:105px">Due Date<input id="dueDate" type="date"  style="height:22px" ></label>
<label class="invoice-field" style="width:122px">Supplier Invoice Date<input id="supplierInvoiceDate" type="date"  style="height:23px" ></label>
<label class="invoice-field" style="width:231px">Delivery Term<input id="deliveryTerm" type="text"  style="height:23px" readonly></label>
<label class="invoice-field" style="width:133px">Reference Party<input id="refParty" type="text"  style="height:23px" ></label></div><label class="invoice-remarks">Remarks<input id="remarks"></label></section>
<section class="invoice-panel"><h2>Invoice Details</h2><div class="invoice-scroll"><table><thead id="detailsHead"></thead><tbody id="detailsBody"></tbody></table></div><div class="invoice-totals"><span id="detailTotals"></span><label>Bill Amount<input id="billAmount" readonly></label></div></section>
<section class="invoice-panel"><div class="invoice-fields"><label class="invoice-field" style="width:229px">Commission Agent<select id="commissionAgent" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:85px">Commission Type<select id="commissionType" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:70px">Rate<input id="commissionRate" type="number" step="any" style="height:23px" ></label>
<label class="invoice-field" style="width:85px">UOM<select id="commissionUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:70px">Commission Amount<input id="commissionAmount" type="number" step="any" style="height:23px" readonly></label>
<label class="invoice-field" style="width:229px">Remarks<input id="commissionRemarks" type="text"  style="height:23px" ></label>
<label class="invoice-field" style="width:231px">Broker Account<select id="broker" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:85px">Brokery Type<select id="brokerType" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:70px">Brokery Rate<input id="brokerRate" type="number" step="any" style="height:23px" ></label>
<label class="invoice-field" style="width:85px">Brokery UOM<select id="brokerUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:70px">Brokery Amount<input id="brokerAmount" type="number" step="any" style="height:23px" readonly></label>
<label class="invoice-field" style="width:177px">Freight Deduction<input id="freightDeduction" type="number" step="any" style="height:22px" ></label>
<label class="invoice-field" style="width:177px">Freight Deduction Account<select id="freightAccount" class="win-combo" style="height:25px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:229px">Wages Amount<input id="wages" type="number" step="any" style="height:23px" ></label></div></section>
<section id="supplementaryGrids" class="invoice-panel"></section>
<section id="invoiceHistory" class="invoice-panel" hidden><h2>Purchase Invoice History</h2><div class="invoice-fields"><label class="invoice-field" style="width:130px">From Date<input id="historyFrom" type="date"  style="height:23px" ></label><label class="invoice-field" style="width:130px">To Date<input id="historyTo" type="date"  style="height:23px" ></label><label class="invoice-field" style="width:130px">Supplier<select id="historySupplier" class="win-combo" style="height:23px" ><option value="">Select</option></select></label><label class="invoice-field" style="width:130px">From No<input id="historyFromNo" type="number" step="any" style="height:23px" ></label><label class="invoice-field" style="width:130px">To No<input id="historyToNo" type="number" step="any" style="height:23px" ></label><label class="invoice-field">Date Type<select id="historyDateType"><option value="DocDate">Doc Date</option><option value="EntryDate">Entry Date</option><option value="ModifyDate">Modify Date</option><option value="ApprovedDate">Approved Date</option></select></label><button onclick="purchaseInvoice.history(this)">Show</button><button onclick="purchaseInvoice.resetHistory()">Reset</button></div><div class="invoice-scroll"><table><thead id="historyHead"></thead><tbody id="historyBody"></tbody></table></div></section>
</main><section id="invoiceGrnLoader" class="invoice-dialog" hidden aria-label="Load GRNs"><h2>Load GRNs<button onclick="purchaseInvoice.closeLoader()">Close</button></h2><div class="invoice-fields"><label class="invoice-field" style="width:130px">From Date<input id="loaderFrom" type="date"  style="height:23px" ></label><label class="invoice-field" style="width:130px">To Date<input id="loaderTo" type="date"  style="height:23px" ></label><label class="invoice-field" style="width:130px">Supplier<select id="loaderSupplier" class="win-combo" style="height:23px" ><option value="">Select</option></select></label><label>Branches<select id="loaderBranches" multiple class="no-dtcombo" size="3"></select></label><button onclick="purchaseInvoice.showGrns(this)">Show</button><button onclick="purchaseInvoice.loadSelectedGrns(this)">Load on Invoice</button><button onclick="purchaseInvoice.resetLoader()">Reset</button></div><div class="invoice-scroll"><table><thead id="loaderHead"></thead><tbody id="loaderBody"></tbody></table></div></section>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/build/js/countx_desktop_combo.js}"></script><script th:src="@{/build/js/countx_purchase_request.js}"></script><script th:src="@{/build/js/countx_invoice_attachments.js}"></script><script th:src="@{/build/js/countx_purchase_invoice.js}"></script></body></html>
