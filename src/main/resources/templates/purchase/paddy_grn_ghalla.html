<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Receiving Notes For Ghalla Mandi - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css?v=20260923a}" />
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_combo.css?v=20261003s}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_paddy_purchase.css?v=20261009a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_paddy_grn.css?v=20261009a}"/>
    <!--
        Screen 469 "Goods Receiving Notes For Ghalla Mandi" - Architecture.WinApp.Paddy_Purchase.frmGrnForGhallaMandi (InvGrn DocumentTypeId 167).
        Designer geometry 1:1 in px: panel1/tabControl1 1200 x 736 (tabPage1 1192 x 710, white). tabControl1 (Form / History, Alignment Bottom -> the fixed footer);
        tabPage1: panel2 toolStrip1 (2,2) 1188x31, panel4 header (2,33) 1188x121, panel5 detail entry (2,154) 1188x116,
        panel10 grd (2,270) 1188x167, panel6 fill (2,437) 1188x271 = panel3 grdEmptyBags (617 wide) + panel9 grdGp (571 wide).
        tabPage2: panel7 toolStrip2 (28), panel8 GrdHistory (354), panel11 GrdHistoryDetail (324).
        Desktop names are the element ids: combbrnch, combproject, txtdocno, DocDate, combgatepass, CmbLoadingContractor, CmbTransport (Carriage Contractor),
        txtcarramount, CmbGhallaMandi, txtremarks, combvehtyp, txtvehno, txtbltyno, txtfctwt, CmbStatus, ChkBox; combitem, combcropyear, combjoblot, combpcktyp,
        combpckuom, txtqty, txtgwt, txtebu, txtEmptyBagsTotal, txtnetwt, txtStockWeight, combwr, CmbCity, CmbContractor, Add,
        btnUpdateDetail, btnCancelUpdateDetial; grids grd, grdEmptyBags, grdGp, GrdHistory, GrdHistoryDetail. Every combo is countx_prod_combo.js.
        Unlike frmGrnForGate there is no Supp Weight, Scale Kart, Lab No or Scale Kart (detail) control.
    -->
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="pp-scroll">
<div class="pp-root" style="width:1200px;padding:0 6px;">

<!-- ======================================================= tabPage1 "Form" -->
<div id="viewForm" style="width:1188px;">
    <!-- panel2 / toolStrip1: toolStripLabel1, btnNew, btnUpdate, btnSave, printToolStripButton, btnAttachment, toolStripButton1 (Refresh), CityDefine, btnDelete (hidden) -->
    <div class="pp-strip" style="height:31px;">
        <span class="pg-title">Goods Receiving Notes</span>
        <button type="button" id="btnNew" class="pp-tool tool-btn" title="Ctrl+N"><span class="ic">&#10010;</span>New</button>
        <button type="button" id="btnUpdate" class="pp-tool tool-btn" style="display:none;" title="Ctrl+U"><span class="ic">&#9998;</span>Update</button>
        <button type="button" id="btnSave" class="pp-tool tool-btn" title="Ctrl+S"><span class="ic">&#128190;</span>Save</button>
        <button type="button" id="printToolStripButton" class="pp-tool tool-btn" title="Ctrl+P"><span class="ic">&#128438;</span>211-Print</button>
        <button type="button" id="btnAttachment" class="pp-tool tool-btn" title="Alt+A"><span class="ic">&#128206;</span>Attachment</button>
        <button type="button" id="toolStripButton1" class="pp-tool tool-btn" title="Alt+R"><span class="ic">&#8635;</span>Refresh</button>
        <button type="button" id="CityDefine" class="pp-tool tool-btn"><span class="ic">&#127970;</span>City</button>
        <button type="button" id="btnDelete" class="pp-tool tool-btn" style="display:none;"><span class="ic">&#10006;</span>Delete</button>
    </div>

    <!-- panel4 (2,33) 1188 x 121 -->
    <div class="pp-panel4" style="height:121px;" id="panel4">
        <label class="pp-lbl reg" style="left:9px;top:11px;">Branch</label>
        <select id="combbrnch" class="pp-cmb" style="left:75px;top:6px;width:107px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Branch Name"></select>
        <label class="pp-lbl reg" style="left:9px;top:39px;">Project</label>
        <select id="combproject" class="pp-cmb" style="left:75px;top:34px;width:107px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Project Name"></select>
        <label class="pp-lbl reg" style="left:9px;top:66px;">Doc No</label>
        <input type="text" id="txtdocno" class="pp-txt f9" style="left:75px;top:63px;width:107px;height:21px;background:#fff;" readonly>
        <label class="pp-lbl reg" style="left:9px;top:92px;">Doc Date</label>
        <input type="date" id="DocDate" class="pp-dt f9" style="left:75px;top:89px;width:106px;height:21px;">

        <label class="pp-lbl reg" style="left:189px;top:11px;">Gate Pass</label>
        <input type="text" id="combgatepass" class="pp-txt f9 ro" style="left:307px;top:8px;width:202px;height:21px;" readonly>
        <label class="pp-lbl reg" style="left:189px;top:37px;">Loading Contractor</label>
        <select id="CmbLoadingContractor" class="pp-cmb" style="left:307px;top:32px;width:201px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Loading Contractor"></select>
        <label class="pp-lbl reg" style="left:189px;top:64px;">Carriage Contractor</label>
        <select id="CmbTransport" class="pp-cmb" style="left:307px;top:59px;width:201px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Transport Name"></select>
        <label class="pp-lbl reg" style="left:189px;top:90px;">Freight Amount</label>
        <input type="text" id="txtcarramount" class="pp-txt f9" data-guard="digits" style="left:307px;top:87px;width:201px;height:21px;">

        <label class="pp-lbl reg" style="left:514px;top:13px;">Mandi</label>
        <select id="CmbGhallaMandi" class="pp-cmb" style="left:576px;top:8px;width:201px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Ghalla_Mandi"></select>
        <label class="pp-lbl reg" style="left:514px;top:41px;">Remarks</label>
        <textarea id="txtremarks" class="pp-txt f9" style="left:576px;top:37px;width:201px;height:71px;padding:2px 3px;resize:none;"></textarea>

        <label class="pp-lbl reg" style="left:785px;top:12px;">Vehicle Type</label>
        <select id="combvehtyp" class="pp-cmb" style="left:865px;top:9px;width:202px;height:24px;" data-dtcombo="single" data-dtcombo-caption="VehicleDescription"></select>
        <label class="pp-lbl reg" style="left:785px;top:40px;">Vehicle No</label>
        <input type="text" id="txtvehno" class="pp-txt f9" style="left:865px;top:39px;width:79px;height:21px;">
        <label class="pp-lbl reg" style="left:948px;top:42px;">Bilty No</label>
        <input type="text" id="txtbltyno" class="pp-txt f9" style="left:1003px;top:39px;width:63px;height:21px;">
        <label class="pp-lbl reg" style="left:785px;top:69px;">Fact Weight</label>
        <input type="text" id="txtfctwt" class="pp-txt f9 ro" style="left:865px;top:64px;width:201px;height:21px;" readonly>
        <label class="pp-lbl reg" style="left:788px;top:93px;">Status</label>
        <select id="CmbStatus" class="pp-cmb" style="left:865px;top:90px;width:201px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Status"></select>
        <label class="pp-chk" style="left:1071px;top:94px;font-weight:normal;font-family:'Microsoft Sans Serif',Tahoma,sans-serif;"><input type="checkbox" id="ChkBox" checked>Print Preview</label>
    </div>

    <!-- panel5 (2,154) 1188 x 116 -->
    <div class="pp-panel4" style="height:116px;" id="panel5">
        <label class="pp-lbl reg" style="left:8px;top:9px;">Item Name</label>
        <select id="combitem" class="pp-cmb" style="left:8px;top:29px;width:220px;height:24px;" data-dtcombo="single" data-dtcombo-caption="ItemName"></select>
        <label class="pp-lbl reg" style="left:233px;top:9px;">Crop Year</label>
        <select id="combcropyear" class="pp-cmb" style="left:229px;top:29px;width:121px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select>
        <label class="pp-lbl reg" style="left:357px;top:9px;">Job/Lot</label>
        <select id="combjoblot" class="pp-cmb" style="left:355px;top:29px;width:121px;height:24px;" data-dtcombo="single" data-dtcombo-caption="JobLot Description"></select>
        <label class="pp-lbl reg" style="left:482px;top:9px;">Packing type</label>
        <select id="combpcktyp" class="pp-cmb" style="left:481px;top:29px;width:121px;height:24px;" data-dtcombo="single" data-dtcombo-caption="PackingType"></select>
        <label class="pp-lbl reg" style="left:609px;top:9px;">Pack UOM</label>
        <select id="combpckuom" class="pp-cmb" style="left:606px;top:29px;width:97px;height:24px;" data-dtcombo="single" data-dtcombo-caption="PackUom"></select>
        <label class="pp-lbl reg" style="left:704px;top:9px;">Qty</label>
        <input type="text" id="txtqty" class="pp-txt f9" data-guard="decimal" style="left:705px;top:31px;width:72px;height:21px;">
        <label class="pp-lbl reg" style="left:779px;top:9px;">Gross Weight</label>
        <input type="text" id="txtgwt" class="pp-txt f9" data-guard="decimal" style="left:779px;top:31px;width:96px;height:21px;">
        <label class="pp-lbl reg" style="left:874px;top:9px;">E.b / Unit</label>
        <input type="text" id="txtebu" class="pp-txt f9" data-guard="decimal" style="left:877px;top:31px;width:53px;height:21px;background:#fff;">
        <label class="pp-lbl reg" style="left:936px;top:9px;">E.b Total</label>
        <input type="text" id="txtEmptyBagsTotal" class="pp-txt f9 ro" style="left:931px;top:31px;width:64px;height:21px;" readonly>
        <label class="pp-lbl reg" style="left:996px;top:9px;">Net Weight</label>
        <input type="text" id="txtnetwt" class="pp-txt f9 ro" style="left:997px;top:31px;width:92px;height:21px;background:#fff;" readonly>
        <label class="pp-lbl reg" style="left:1089px;top:9px;">Stock Weight</label>
        <input type="text" id="txtStockWeight" class="pp-txt f9 ro" style="left:1090px;top:31px;width:92px;height:21px;background:#fff;" readonly>

        <label class="pp-lbl reg" style="left:11px;top:61px;">UnLoading Location</label>
        <select id="combwr" class="pp-cmb" style="left:9px;top:85px;width:227px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Godown Name"></select>
        <label class="pp-lbl reg" style="left:239px;top:61px;">City</label>
        <select id="CmbCity" class="pp-cmb" style="left:238px;top:85px;width:180px;height:24px;" data-dtcombo="single" data-dtcombo-caption="City Name"></select>
        <label class="pp-lbl reg" style="left:422px;top:61px;">Contractor</label>
        <select id="CmbContractor" class="pp-cmb" style="left:421px;top:85px;width:221px;height:24px;" data-dtcombo="single" data-dtcombo-caption="Contractor"></select>
        <button type="button" id="Add" class="pp-btn" style="left:645px;top:85px;width:29px;height:25px;">+</button>
        <button type="button" id="btnUpdateDetail" class="pp-btn" style="left:675px;top:84px;width:65px;height:26px;display:none;">Update</button>
        <button type="button" id="btnCancelUpdateDetial" class="pp-btn" style="left:743px;top:84px;width:65px;height:26px;display:none;">Cancel</button>
    </div>

    <!-- panel10 (2,270) 1188 x 167: grd -->
    <div class="pp-gridwrap" id="wrapGrd" style="height:167px;">
        <table class="data-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>

    <!-- panel6 (2,437) fill: panel3 (left 617) grdEmptyBags, panel9 (571) grdGp -->
    <div class="pg-lower" style="width:1188px;">
        <div class="pp-gridwrap" id="wrapEmptyBags" style="width:617px;height:271px;">
            <table class="data-grid" id="grdEmptyBags"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
        <div class="pp-gridwrap" id="wrapGp" style="width:571px;height:271px;">
            <table class="data-grid" id="grdGp"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
    </div>
</div>

<!-- ======================================================= tabPage2 "History" -->
<div id="viewHistory" style="display:none;width:1188px;">
    <!-- toolStrip2: btnLoadAll, btnGrnFormHistory -->
    <div class="pp-strip" style="height:28px;">
        <button type="button" id="btnLoadAll" class="pp-tool tool-btn" title="Ctrl+L"><span class="ic">&#8635;</span>LoadAll</button>
        <button type="button" id="btnGrnFormHistory" class="pp-tool tool-btn" title="Ctrl+H"><span class="ic">&#128438;</span>GrnHistory</button>
    </div>
    <div class="pp-gridwrap" id="wrapHistory" style="height:354px;">
        <table class="data-grid" id="GrdHistory"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
    <div class="pp-gridwrap" id="wrapHistoryDetail" style="height:324px;">
        <table class="data-grid" id="GrdHistoryDetail"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
</div>

<div class="pp-modal" id="attModal"><div class="pp-modal-box">
    <div class="pp-modal-title"><span>Attachments</span><button type="button" id="attClose">X</button></div>
    <div style="padding:8px;" id="attBody"></div>
</div></div>

</div>
</div>

<script th:src="@{/build/js/countx_purchase_request.js?v=20260923a}"></script>
<script th:src="@{/build/js/countx_prod_combo.js?v=20261003s}"></script>
<script th:src="@{/build/js/countx_purchase_page_chrome.js?v=20261013-purchase-toolbar}"></script>
<script th:src="@{/build/js/countx_paddy_common.js?v=20261009a}"></script>
<script th:src="@{/build/js/countx_paddy_grn_ghalla.js?v=20261009a}"></script>
<script src="/js/print-rpt.js?v=20261003erp"></script>
</body>
</html>
