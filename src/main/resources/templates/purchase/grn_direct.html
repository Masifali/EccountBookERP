<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Goods Receipt Notes Direct - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_prod_define.css?v=20260929a}"/>
    <link rel="stylesheet" th:href="@{/build/css/countx_hrm.css?v=20260929a}"/>
    <style>
        table.hrm-grid .ppb-cell-btn { height: 20px; min-width: 0; width: auto; padding: 0 8px; font-size: 8pt; line-height: 18px; }
        table.hrm-grid .hrm-cell-input, table.hrm-grid .hrm-cell-select { min-width: 70px; }
        .gd-caption-right .hrm-check { color: #fff; }
        .gd-date-chk { display: flex; align-items: center; gap: 4px; }
        .gd-date-chk input[type=date] { flex: 1 1 auto; min-width: 0; }
        .gd-radios { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .gd-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
        .gd-detail { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
        .gd-grids .hrm-grid-box { min-height: 140px; }
        .gd-grids .hrm-grid-wrap { max-height: 300px; min-height: 90px; }
        .gd-label-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    </style>
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261005a}"/>
</head>
<!-- Architecture.WinApp.Purchase.InvFrmGRNDirect (ScreenDefinition 129 "frmGrnDirect", DocumentTypeId 137), KeyPreview, Maximized.
     tabControl1 (tabs at the bottom): tabPage1 "Form" | tabPage2 "History".
     Form: toolStrip1 New | Refresh | Save | Update (hidden) | Delete (hidden) | Attechment | 211-Print | City | Load Order | ShortCut Keys;
     label7 "Goods Receiving Notes (without Gatepass)" + ChkBox "Print".
     panel4 (2,55 902x146): Doc No && Date / Supplier Name* / Delivery Term* / Transporter / Remarks | Freight Amt / Gp No* /
     Vehicle Type* / Vehicle No* | Bilty No* / Supp Weight* / Fact Weight* / Weight Diff / GRN Weight.
     panel5 (2,201 902x103): Warehouse, Item (Name | Code), Crop Year, JobLot, Packing Type, Pack UOM, Qty / Gross Weight, E.b / Unit,
     E.b Total, Ad/Ls, Net Weight, Stock Weight, City/Area, "+" | Update | Cancel.
     panel10 "Detail" + grd; panel14 "This Grid show Empty Bags Info.User Can Add Empty Bags Info Here" + grdEmptyBags.
     History: toolStrip2 Reset | Refresh | GrnHistory; label12 "Goods Receiving Notes  History"; groupBox3 "Filters" + the date-type radios;
     panel8 "Filtered Records" + GrdHistory; panel11 "Detail of the Selected above row" + GrdHistoryDetail. -->
<body class="pd-body hrm-body" data-hrm="grn-direct" th:attr="data-screen=${screenId}">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="hrm-form">
    <div class="hrm-tabs">
        <button type="button" class="hrm-tab is-active" data-tab="form">Form</button>
        <button type="button" class="hrm-tab" data-tab="history">History</button>
    </div>

    <div class="hrm-tab-page is-active" data-page="form">
        <div class="win-tool-strip">
            <button type="button" id="btnNew" class="win-btn-tool" title="Ctrl_N" onclick="GrnDirect.btnNew()"><i class="fa fa-plus"></i> <span><u>N</u>ew</span></button>
            <button type="button" id="BtnRefresh" class="win-btn-tool" title="Alt_R" onclick="GrnDirect.btnRefresh(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
            <button type="button" id="btnSave" class="win-btn-tool" title="Ctrl_S" onclick="GrnDirect.btnSave(this)"><i class="fa fa-save"></i> <span><u>S</u>ave</span></button>
            <button type="button" id="btnUpdate" class="win-btn-tool is-hidden" title="Ctrl_U" onclick="GrnDirect.btnUpdate(this)"><i class="fa fa-pencil"></i> <span><u>U</u>pdate</span></button>
            <button type="button" id="btnDelete" class="win-btn-tool is-hidden" onclick="GrnDirect.btnDelete(this)"><i class="fa fa-trash"></i> <span>Delete</span></button>
            <button type="button" id="btnAttachment" class="win-btn-tool" title="Alt_A / Ctrl+F10" onclick="GrnDirect.btnAttachment(this)"><i class="fa fa-paperclip"></i> <span><u>A</u>ttechment</span></button>
            <button type="button" id="BtnPrint" class="win-btn-tool" title="Ctrl_P" onclick="GrnDirect.btnPrint(this)" data-rpt-skip><i class="fa fa-print"></i> <span>211-Print</span></button>
            <button type="button" id="CityDefine" class="win-btn-tool" title="Define City" onclick="GrnDirect.cityDefine()"><i class="fa fa-map-marker"></i> <span>City</span></button>
            <button type="button" id="BtnLoadOrder" class="win-btn-tool" title="Load Purchase Order" onclick="GrnDirect.btnLoadOrder()"><i class="fa fa-folder-open-o"></i> <span>Load Order</span></button>
            <button type="button" id="BtnShortCutkeys" class="win-btn-tool" onclick="GrnDirect.shortcuts()"><i class="fa fa-keyboard-o"></i> <span>ShortCut Keys</span></button>
        </div>
        <div class="hrm-caption"><span>Goods Receiving Notes (without Gatepass)</span>
            <span class="gd-caption-right"><label class="hrm-check"><input type="checkbox" id="ChkBox" checked> Print</label></span></div>
        <fieldset class="hrm-group" id="panel4">
            <legend>Main</legend>
            <div class="hrm-entry hrm-cols-3" style="align-items:start">
                <div class="hrm-field"><label for="txtdocno">Doc No &amp; Date</label>
                    <div class="gd-pair"><input type="text" id="txtdocno" class="win-textbox" disabled/><input type="date" id="DocDate" class="win-textbox"/></div></div>
                <div class="hrm-field"><label for="txtcarramount">Freight Amt</label><input type="text" id="txtcarramount" class="win-textbox hrm-al-right" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtbltyno" class="hrm-req">Bilty No</label><input type="text" id="txtbltyno" class="win-textbox" autocomplete="off"/></div>

                <div class="hrm-field"><label for="combsupplier" class="hrm-req">Supplier Name</label><select id="combsupplier" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>
                <div class="hrm-field"><label for="txtGpNo" class="hrm-req">Gp No</label><input type="text" id="txtGpNo" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtsuppwt" class="hrm-req">Supp Weight</label><input type="text" id="txtsuppwt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>

                <div class="hrm-field"><label for="CmbDeliveryTerm" class="hrm-req">Delivery Term</label><select id="CmbDeliveryTerm" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Delivery Term"></select></div>
                <div class="hrm-field"><label for="combvehtyp" class="hrm-req">Vehicle Type</label><select id="combvehtyp" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="VehicleDescription"></select></div>
                <div class="hrm-field"><label for="txtfctwt" class="hrm-req">Fact Weight</label><input type="text" id="txtfctwt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>

                <div class="hrm-field"><label for="CmbTransport">Transporter</label><select id="CmbTransport" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Account Title"></select></div>
                <div class="hrm-field"><label for="txtvehno" class="hrm-req">Vehicle No</label><input type="text" id="txtvehno" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtwtdiff">Weight Diff</label><input type="text" id="txtwtdiff" class="win-textbox hrm-al-right" disabled/></div>

                <div class="hrm-field hrm-span-2"><label for="txtremarks">Remarks</label><input type="text" id="txtremarks" class="win-textbox" autocomplete="off"/></div>
                <div class="hrm-field"><label for="txtBalWeight" id="lblBalwt">GRN Weight</label><input type="text" id="txtBalWeight" class="win-textbox hrm-al-right" readonly tabindex="-1"/></div>
            </div>
        </fieldset>
        <fieldset class="hrm-group" id="panel5">
            <legend>Detail</legend>
            <div class="hrm-entry gd-detail" style="align-items:end">
                <div class="hrm-field hrm-stack"><label for="CmbWareHouse">Warehouse</label><select id="CmbWareHouse" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="WareHouseName"></select></div>
                <div class="hrm-field hrm-stack hrm-span-2"><div class="gd-label-row"><label for="combitem">Item</label>
                    <span class="gd-radios"><label class="hrm-check"><input type="radio" name="itemSearch" id="rdSearchByName" value="name" checked> Name</label>
                        <label class="hrm-check"><input type="radio" name="itemSearch" id="rdSearchByCode" value="code"> Code</label></span></div>
                    <select id="combitem" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Item"></select></div>
                <div class="hrm-field hrm-stack"><label for="combcropyear">Crop Year</label><select id="combcropyear" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Crop Year"></select></div>
                <div class="hrm-field hrm-stack"><label for="CmbJobLot">JobLot</label><select id="CmbJobLot" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="JobLotDescription"></select></div>
                <div class="hrm-field hrm-stack"><label for="combpcktyp">Packing Type</label><select id="combpcktyp" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="PackingType"></select></div>
                <div class="hrm-field hrm-stack"><label for="combpckuom">Pack UOM</label><select id="combpckuom" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="UOM"></select></div>
                <div class="hrm-field hrm-stack"><label for="txtqty">Qty</label><input type="text" id="txtqty" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>

                <div class="hrm-field hrm-stack"><label for="txtgwt">Gross Weight</label><input type="text" id="txtgwt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtebu">E.b / Unit</label><input type="text" id="txtebu" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off" data-tag="EbUnit"/></div>
                <div class="hrm-field hrm-stack"><label for="txtEmptyBagsTotal">E.b Total</label><input type="text" id="txtEmptyBagsTotal" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off" data-tag="EbTotal"/></div>
                <div class="hrm-field hrm-stack"><label for="txtadlswt">Ad/Ls</label><input type="text" id="txtadlswt" class="win-textbox hrm-al-right" inputmode="decimal" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtnetwt">Net Weight</label><input type="text" id="txtnetwt" class="win-textbox hrm-al-right" disabled/></div>
                <div class="hrm-field hrm-stack"><label for="txtstockwt">Stock Weight</label><input type="text" id="txtstockwt" class="win-textbox hrm-al-right" disabled/></div>
                <div class="hrm-field hrm-stack"><label for="CmbCity">City/Area</label><select id="CmbCity" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="City Name"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="hrm-inline">
                        <button type="button" id="Add" class="win-btn-action" onclick="GrnDirect.add()">+</button>
                        <button type="button" id="btnUpdateDetail" class="win-btn-action is-hidden" onclick="GrnDirect.btnUpdateDetail()">Update</button>
                        <button type="button" id="btnCancelUpdateDetial" class="win-btn-action is-hidden" onclick="GrnDirect.btnCancelUpdateDetial()">Cancel</button>
                    </div></div>
            </div>
        </fieldset>
        <div class="gd-grids">
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnDirect:grd" id="grd"></table></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>This Grid show Empty Bags Info.User Can Add Empty Bags Info Here</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnDirect:grdEmptyBags" id="grdEmptyBags"></table></div>
            </div>
        </div>
    </div>

    <div class="hrm-tab-page" data-page="history">
        <div class="win-tool-strip">
            <button type="button" id="btnNewHistory" class="win-btn-tool" onclick="GrnDirect.btnNewHistory()"><i class="fa fa-plus"></i> <span><u>R</u>eset</span></button>
            <button type="button" id="btnRefreshHistory" class="win-btn-tool" onclick="GrnDirect.btnRefreshHistory(this)"><i class="fa fa-refresh"></i> <span><u>R</u>efresh</span></button>
            <button type="button" id="btnGrnFormHistory" class="win-btn-tool" title="Crtl_H" onclick="GrnDirect.btnGrnFormHistory()"><i class="fa fa-print"></i> <span>GrnHistory</span></button>
        </div>
        <div class="hrm-caption"><span>Goods Receiving Notes  History</span></div>
        <fieldset class="hrm-group">
            <legend>Filters</legend>
            <div class="hrm-entry" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
                <div class="hrm-field hrm-stack"><label for="FromDateHistory">From Date</label>
                    <div class="gd-date-chk"><input type="checkbox" id="chkFromDateHistory" checked title="Use From Date"><input type="date" id="FromDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="ToDateHistory">To Date</label>
                    <div class="gd-date-chk"><input type="checkbox" id="chkToDateHistory" checked title="Use To Date"><input type="date" id="ToDateHistory" class="win-textbox"/></div></div>
                <div class="hrm-field hrm-stack"><label for="txtFromDocNoHistory">From Doc</label><input type="text" id="txtFromDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="txtToDocNoHistory">To Doc</label><input type="text" id="txtToDocNoHistory" class="win-textbox" inputmode="numeric" autocomplete="off"/></div>
                <div class="hrm-field hrm-stack"><label for="cmbSupplierNameHistory">Supplier</label><select id="cmbSupplierNameHistory" class="win-combo dtcombo" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label><button type="button" id="btnshow" class="win-btn-action" onclick="GrnDirect.btnshow(this)">Show</button></div>
                <div class="hrm-field hrm-stack"><label>&nbsp;</label>
                    <div class="gd-radios">
                        <label class="hrm-check"><input type="radio" name="histRef" id="RadAll" value="0" checked> All</label>
                        <label class="hrm-check"><input type="radio" name="histRef" id="RadReffered" value="1"> Reffered</label>
                        <label class="hrm-check"><input type="radio" name="histRef" id="RadNotReffered" value="2"> Not Reffered</label>
                    </div></div>
                <div class="hrm-field hrm-stack hrm-span-2"><label>&nbsp;</label>
                    <div class="gd-radios">
                        <label class="hrm-check"><input type="radio" name="histDateType" id="drdocdate" value="doc" checked> Doc Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" id="rdentrydate" value="entry"> Entry Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" id="rdmodifydate" value="modify"> Modify Date</label>
                        <label class="hrm-check"><input type="radio" name="histDateType" id="rdapproveddate" value="approved"> Approved Date</label>
                    </div></div>
            </div>
        </fieldset>
        <div class="gd-grids">
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Filtered Records</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnDirect:GrdHistory" id="GrdHistory"></table></div>
            </div>
            <div class="hrm-grid-box">
                <div class="hrm-subcaption"><span>Detail of the Selected above row</span><button type="button" class="hrm-fs-btn" data-hrm-fullscreen title="Full screen"><i class="fa fa-expand"></i></button></div>
                <div class="hrm-grid-wrap"><table data-gridbar="GrnDirect:GrdHistoryDetail" id="GrdHistoryDetail"></table></div>
            </div>
        </div>
    </div>

    <div class="hrm-footer">
        <div class="hrm-footer-left"><span id="lblStatus"></span></div>
        <div class="hrm-footer-right"><button type="button" id="btnHistory" class="win-btn-action"><i class="fa fa-history"></i> History</button></div>
    </div>
</div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/build/js/countx_hrm.js?v=20260929a}"></script>
<script th:src="@{/build/js/countx_pp_ppb_common.js?v=20260930b}"></script>
<script th:src="@{/build/js/countx_purchase_doc_attachments.js?v=20260930o1}"></script>
<script th:src="@{/build/js/countx_grn_direct.js?v=20261001pr}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261005a}"></script>
</body>
</html>
