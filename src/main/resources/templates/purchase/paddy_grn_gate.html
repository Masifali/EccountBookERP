    <!--
        Screen 465 "Goods Receiving Notes For Gate Purchase" - Architecture.WinApp.Paddy_Purchase.frmGrnForGate (InvGrn DocumentTypeId 165).
        Designer geometry 1:1 in px: ClientSize 1248 x 736. tabControl1 (Form / History, Alignment Bottom -> the fixed footer);
        tabPage1 (white): panel2 toolStrip1 (2,2) 1236x31, panel4 header (2,33) 1236x118, panel5 detail entry (2,151) 1236x116,
        panel10 grd (2,267) 1236x167, panel6 fill (2,434) 1236x274 = panel3 grdEmptyBags (617 wide) + panel9 grdGp (619 wide).

        combvehtyp, txtvehno, txtbltyno, txtremarks, txtsuppwt, txtfctwt, CmbStatus, txtScaleKart, ChkBox; combitem, combcropyear, combjoblot, combpcktyp,
        combpckuom, txtqty, txtgwt, txtScaleKartDetail, txtebu, txtEmptyBagsTotal, txtnetwt, combwr, txtLabNo, CmbCity, CmbContractor, Add,

    -->

    <!-- panel10 (2,267) 1236 x 167: grd -->

        <table class="data-grid" id="grd"><thead></thead><tbody></tbody><tfoot></tfoot></table>

        <div class="pp-gridwrap" id="wrapEmptyBags" style="width:617px;height:274px;">
            <table class="data-grid" id="grdEmptyBags"><thead></thead><tbody></tbody><tfoot></tfoot></table>

            <table class="data-grid" id="grdGp"><thead></thead><tbody></tbody><tfoot></tfoot></table>

<div class="pp-modal" id="attModal"><div class="pp-modal-box">

    <div style="padding:8px;" id="attBody"></div>
</div></div>

</div>
</div>
