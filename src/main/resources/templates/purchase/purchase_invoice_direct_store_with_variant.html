<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Invoice Direct Store With Variant - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/vendors/font-awesome/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/build/css/countx_store.css?v=20260925c}">
    <style>
        /* Screen 904, frmPurchaseInvoiceDirectStoreWithVariant designer geometry 1:1 in px (ClientSize 946 x 711).
           tabControl1 (Alignment Bottom): tabPage "Form" / "History" 938 x 682; docked panels at x=3, 932 wide. */
        body { background: #fff; margin: 0; padding-bottom: 36px; }
        .dz-scroll { overflow-x: auto; }
        .dz-root { position: relative; font-family: "Microsoft Sans Serif", Tahoma, sans-serif; font-size: 11px; background: #fff; }
        .dz-p { position: relative; background: #fff; }
        .dz-abs { position: absolute; box-sizing: border-box; margin: 0; }
        .dz-lbl { font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; line-height: 15px; white-space: nowrap; color: #000; }
        .dz-txt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; padding: 1px 3px; background: #fff; }
        .dz-txt[readonly] { background: #f0f0f0; }
        .dz-txt.w[readonly] { background: #fff; }
        .dz-txt:disabled { background: #f0f0f0; color: #6d6d6d; }
        .dz-txt.r { text-align: right; }
        .dz-cmb { font-family: Verdana, sans-serif; font-size: 13px; height: 26px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-cmb:disabled { background: #f0f0f0; color: #6d6d6d; }
        .dz-dt { font-family: Verdana, sans-serif; font-size: 13px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-dtc { display: flex; align-items: center; gap: 2px; height: 23px; border: 1px solid #7a7a7a; background: #fff; padding: 0 2px; }
        .dz-dtc input[type=date] { border: none; font-family: Verdana, sans-serif; font-size: 12px; height: 19px; width: 100%; min-width: 0; padding: 0; }
        .dz-dtc input[type=checkbox] { margin: 0; }
        .dz-gb { position: absolute; box-sizing: border-box; }
        .dz-gb::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; bottom: 0; border: 1px solid #d5dfe5; border-radius: 3px; pointer-events: none; }
        .dz-gb > .dz-cap { position: absolute; left: 6px; top: 0; padding: 0 2px; background: #fff; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: bold; line-height: 14px; color: #000; }
        .dz-chk { display: inline-flex; align-items: center; gap: 3px; font-family: "Segoe UI Semibold", "Segoe UI", Tahoma, sans-serif; font-weight: bold; font-size: 12px; height: 19px; white-space: nowrap; cursor: pointer; }
        .dz-chk input { margin: 0; }
        .dz-chk.wt { color: #fff; }
        .dz-teal { background: #008080; position: relative; }
        .dz-teal-title { position: absolute; font-family: Tahoma, sans-serif; font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap; line-height: 19px; }
        .dz-teal-title.s { font-size: 15px; line-height: 18px; }
        .dz-strip { height: 27px; display: flex; align-items: center; background: linear-gradient(to bottom, #fcfcfc 0%, #e0e0e0 100%); border-bottom: 1px solid #b5b5b5; box-sizing: border-box; }
        .dz-strip.white { background: #fff; }
        .dz-tool { font-family: Verdana, sans-serif; font-size: 13px; height: 24px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; box-sizing: border-box; color: #000; white-space: nowrap; }
        .dz-tool:hover:not(:disabled) { background: #ffe4a0; border-color: #e59d00; }
        .dz-tool:disabled { color: #9a9a9a; cursor: default; }
        .dz-sep { width: 6px; height: 20px; border-left: 1px solid #b5b5b5; margin-left: 3px; flex: none; }
        .dz-btn { font-family: Verdana, sans-serif; font-size: 13px; font-weight: bold; background: #008080; color: #fff; border: 1px solid #005959; cursor: pointer; padding: 0; }
        .dz-btn:disabled { opacity: .6; cursor: default; }
        .dz-gbar { width: 38px; height: 22px; background: transparent; color: #fff; border: 1px solid transparent; font-size: 14px; }
        .dz-host { overflow: auto; background: #fff; border-top: 1px solid #9eb6ce; max-height: none; }
        .dz-host .win-grid { width: auto; min-width: 100%; font-family: Verdana, sans-serif; font-size: 11px; }
        .dz-host .win-grid th { background: linear-gradient(to bottom, #e3efff 0%, #c4dcf8 100%); border: 1px solid #9eb6ce; font-weight: normal; }
        .dz-host .win-grid td { border: 1px solid #d5e1f0; }
        .dz-host .win-grid tbody tr:hover { background: #fff0cf; }
        .dz-tabs { display: flex; gap: 0; padding-left: 2px; height: 25px; align-items: flex-end; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs .win-tab { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 14px; font-weight: normal; padding: 1px 8px; height: 21px; line-height: 19px; background: #f0f0f0; border: 1px solid #9a9a9a; border-bottom: none; border-radius: 2px 2px 0 0; color: #000; box-sizing: border-box; }
        .dz-tabs .win-tab.is-active { background: #fff; height: 24px; top: 1px; color: #000; }
        .dz-tabs.bottom { border-bottom: none; border-top: 1px solid #9a9a9a; align-items: flex-start; height: 25px; }
        .dz-tabs.bottom .win-tab { font-family: Verdana, sans-serif; font-size: 13px; border-radius: 0 0 2px 2px; border-top: none; border-bottom: 1px solid #9a9a9a; }
        .dz-tabs.bottom .win-tab.is-active { top: -1px; }
        .dz-page { border: 1px solid #9a9a9a; border-top: none; background: #fff; box-sizing: border-box; }
        .dz-modal-box { width: auto !important; max-width: 98vw; background: #fff !important; }
        .dz-modal-box .cx-modal-body { padding: 0; }
        .dz-root { width: 946px; }
        .dz-tp { width: 938px; margin: 4px 4px 0 4px; padding: 3px; box-sizing: border-box; background: #fff; }
        .win-grid td input[type=text], .win-grid td select { width: 100%; box-sizing: border-box; font-size: 11px; }
        .win-grid tfoot td { font-weight: bold; background: #f3f7f6; }
        #lblStockQty { color: #b71c1c; text-align: right; }
    </style>
</head>
<body>
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div class="dz-scroll">
<div class="dz-root">

<!-- ============================== tabPage "Form" ============================== -->
<div id="tabForm" class="win-tab-panel is-active dz-tp">
    <!-- panel1 (3,3) 932 x 194: toolStrip1 25 / panel3 teal 26 / groupBox2 (5,53) 919 x 133 -->
    <div class="dz-p" style="height:194px;">

            <button type="button" class="dz-tool" id="btnRefresh" style="width:76px;height:22px;" onclick="PiVariant.refresh()"><i class="fa fa-repeat"></i> Refresh</button>
            <button type="button" class="dz-tool" id="btnSave" style="width:60px;height:22px;" onclick="PiVariant.save()"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="dz-tool is-hidden" id="btnUpdate" style="width:74px;height:22px;" onclick="PiVariant.update()"><i class="fa fa-refresh"></i> Update</button>
            <button type="button" class="dz-tool is-hidden" id="btnDelete" style="width:69px;height:22px;" onclick="PiVariant.del()"><i class="fa fa-trash"></i> Delete</button>

        </div>
        <div class="dz-teal" style="height:26px;">
            <span class="dz-teal-title" id="label10" style="left:2px;top:3px;">Purchase Invoice Direct</span>

            <label class="dz-abs dz-chk wt" style="left:727px;top:4px;width:90px;height:20px;font-family:Verdana,sans-serif;font-size:13px;"><input type="checkbox" id="ChkPrintSlip" checked> Print Slip</label>
            <label class="dz-abs dz-chk wt" style="left:819px;top:4px;width:112px;height:20px;font-family:Verdana,sans-serif;font-size:13px;"><input type="checkbox" id="ChkBok"> Print Voucher</label>
        </div>
        <div id="rightsNote" class="cx-denied is-hidden" style="position:absolute;left:700px;top:55px;width:230px;z-index:2;"></div>
        <!-- groupBox2 "Main Information" (5,53) 919 x 133 -->
        <div class="dz-gb" style="left:5px;top:53px;width:919px;height:133px;">
            <span class="dz-cap">Main Information</span>
            <label class="dz-abs dz-lbl" for="comCompany" style="left:7px;top:25px;">Company</label>
            <select id="comCompany" class="dz-abs dz-cmb win-combo" style="left:89px;top:19px;width:193px;"></select>
            <label class="dz-abs dz-lbl" for="combranches" style="left:7px;top:53px;">Branch Name</label>
            <select id="combranches" class="dz-abs dz-cmb win-combo" style="left:89px;top:47px;width:193px;"></select>

            <label class="dz-abs dz-lbl" for="txtremarks" style="left:7px;top:108px;">Remarks</label>
            <input type="text" id="txtremarks" class="dz-abs dz-txt" style="left:89px;top:104px;width:817px;" >
            <label class="dz-abs dz-lbl" for="txtdocno" style="left:286px;top:25px;">Doc No &amp; Date</label>
            <input type="text" id="txtdocno" class="dz-abs dz-txt r" style="left:378px;top:21px;width:68px;" readonly tabindex="-1">
            <input type="date" id="DocDate" class="dz-abs dz-dt" style="left:448px;top:21px;width:141px;">
            <label class="dz-abs dz-lbl" for="comsupplier" style="left:286px;top:53px;">Supplier Name</label>
            <select id="comsupplier" class="dz-abs dz-cmb win-combo" style="left:378px;top:47px;width:212px;" onchange="PiVariant.supplierChanged()"></select>
            <label class="dz-abs dz-lbl" for="txtbillno" style="left:286px;top:81px;">Manual Bill No</label>
            <input type="text" id="txtbillno" class="dz-abs dz-txt" style="left:378px;top:77px;width:212px;" >
            <label class="dz-abs dz-lbl" for="txtBillAmount" style="left:596px;top:22px;">Bill Amount</label>
            <input type="text" id="txtBillAmount" class="dz-abs dz-txt w r" style="left:687px;top:19px;width:219px;height:27px;font-size:16px;" readonly tabindex="-1">
            <!-- tax controls: Visible = false in Form_Load (IsTaxable is never set on this form) -->
            <span id="fldTaxInvoice" class="is-hidden">
            <label class="dz-abs dz-lbl" for="txtTaxInvoiceNo" style="left:596px;top:53px;">Tax Invoice No</label>
            <input type="text" id="txtTaxInvoiceNo" class="dz-abs dz-txt" style="left:687px;top:49px;width:219px;" readonly>
            </span>
            <span id="fldTaxAccount" class="is-hidden">
            <label class="dz-abs dz-lbl" for="CmbTaxAccount" style="left:596px;top:81px;">Tax Account</label>
            <select id="CmbTaxAccount" class="dz-abs dz-cmb win-combo" style="left:687px;top:75px;width:219px;"></select>
            </span>
        </div>
    </div>

    <!-- panel4 (3,197) 932 x 128; groupBox1 "Detail" (7,4) 917 x 119 -->
    <div class="dz-p" style="height:128px;">
        <div class="dz-gb" style="left:7px;top:4px;width:917px;height:119px;background:#fff;">
            <span class="dz-cap">Detail</span>
            <label class="dz-abs dz-lbl" for="comWarehouse" style="left:7px;top:20px;">WareHouse Name</label>
            <select id="comWarehouse" class="dz-abs dz-cmb win-combo" style="left:7px;top:40px;width:157px;"></select>
            <label class="dz-abs dz-lbl" for="comItem" style="left:165px;top:20px;">Item</label>

            <label class="dz-abs dz-chk" style="left:265px;top:18px;width:52px;"><input type="radio" name="itemBy" id="rdbtnItemCode" onchange="PiVariant.itemByChanged()"> Code</label>
            <span id="lblStockQty" class="dz-abs dz-lbl" style="left:335px;top:20px;width:65px;visibility:hidden;">0</span>
            <select id="comItem" class="dz-abs dz-cmb win-combo" style="left:165px;top:40px;width:235px;" onchange="PiVariant.itemChanged()"></select>
            <label class="dz-abs dz-lbl" for="comjobLot" style="left:402px;top:20px;">Job Lot</label>

            <label class="dz-abs dz-lbl" for="CmbAttributeVariant" style="left:635px;top:20px;">Attribute Variant</label>

            <label class="dz-abs dz-lbl" for="txtRate" style="left:819px;top:20px;">Rate</label>

            <label class="dz-abs dz-lbl" for="comRateUOM" style="left:7px;top:69px;">Rate UOM</label>
            <select id="comRateUOM" class="dz-abs dz-cmb win-combo" style="left:7px;top:87px;width:86px;" onchange="PiVariant.rateChanged()"></select>
            <label class="dz-abs dz-lbl" for="txtAmount" style="left:95px;top:69px;">Amount</label>
            <input type="text" id="txtAmount" class="dz-abs dz-txt w r" style="left:95px;top:89px;width:102px;" readonly tabindex="-1">
            <label class="dz-abs dz-lbl" for="txtRemarksdetail" style="left:199px;top:69px;">Remarks</label>
            <input type="text" id="txtRemarksdetail" class="dz-abs dz-txt" style="left:199px;top:89px;width:356px;" >

            <button type="button" class="dz-abs dz-btn is-hidden" id="btnCancelUpdateDetial" style="left:797px;top:88px;width:59px;height:25px;font-size:12px;" onclick="PiVariant.cancelDetail()">Cancel</button>
        </div>
    </div>

    <!-- panel8 (3,325) 932 x 160: panel7 (Dock Left) 496 / panel5 (fill) 436 -->

</div>

<!-- ============================== tabPage "History" ============================== -->

    <div class="dz-teal" style="height:21px;">

    <div class="win-tab" data-tab="tabHistory" onclick="PiVariant.tab('tabHistory')">History</div>
</div>

</div>
</div>
