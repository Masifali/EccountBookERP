<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grn Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
    <link rel="stylesheet" th:href="@{/build/css/countx_grid_bar.css?v=20261007-gridbar-flow}"/>
</head>
<!-- 477 Architecture.WinApp.Inventory_Reports.frmGRNHistory "Grn Report" (module 52). -->
<body class="pr">
<div th:replace="~{fragments/erp_navigation :: navigation}"></div>
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnNew" title="Ctrl+N">New</button>
    <button type="button" id="btnRefresh" title="Ctrl+R">Refresh</button>
    <button type="button" id="btn334Register" title="Alt+1">334-Register</button>
    <button type="button" id="btn335Register" title="Alt+2">335-Register</button>
    <button type="button" id="btnRegister335_01">335_01 Register</button>
    <button type="button" id="btnShortCutKeys">ShortCutKeys</button>
    <a class="pr-right" href="/purchase/reports" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption">Grn History</div>
<div id="prMessage" role="status" aria-live="polite"></div>
<div class="pr-panel">
    <fieldset class="pr-filters" style="width:984px;height:141px">
        <legend>Filters</legend>
        <label class="pr-abs" style="left:6px;top:20px" for="cmbBranchName">Branch Name</label>
        <details class="pr-check pr-abs" id="cmbBranchName" style="left:91px;top:14px;width:161px"></details>
        <label class="pr-abs" style="left:6px;top:48px" for="cmbperemeter">Date Type</label>
        <div class="pr-abs" style="left:91px;top:42px;width:161px"><select id="cmbperemeter" data-dtcombo="single" data-dtcombo-caption="Parameters"></select></div>
        <label class="pr-abs" style="left:6px;top:77px" for="GRNfromdate">Grn Date From</label>
        <div class="pr-abs" style="left:91px;top:73px;width:161px"><input type="date" id="GRNfromdate"></div>
        <label class="pr-abs" style="left:6px;top:107px" for="GRNToDate">Grn Date To</label>
        <div class="pr-abs" style="left:91px;top:103px;width:161px"><input type="date" id="GRNToDate"></div>

        <label class="pr-abs" style="left:257px;top:20px" for="txtGrnNoFrom">Grn No From</label>
        <div class="pr-abs" style="left:335px;top:16px;width:102px"><input type="text" id="txtGrnNoFrom" inputmode="numeric"></div>
        <label class="pr-abs" style="left:257px;top:48px" for="txtGrnNoTo">Grn No To</label>
        <div class="pr-abs" style="left:335px;top:44px;width:102px"><input type="text" id="txtGrnNoTo" inputmode="numeric"></div>
        <label class="pr-abs" style="left:257px;top:77px" for="GpsNoFrom">GP No From</label>
        <div class="pr-abs" style="left:335px;top:73px;width:102px"><input type="text" id="GpsNoFrom" inputmode="numeric"></div>
        <label class="pr-abs" style="left:257px;top:107px" for="GpsNoTo">GP No To</label>
        <div class="pr-abs" style="left:335px;top:103px;width:102px"><input type="text" id="GpsNoTo" inputmode="numeric"></div>

        <label class="pr-abs" style="left:441px;top:20px" for="textBox1">Vehicle No</label>
        <div class="pr-abs" style="left:535px;top:16px;width:175px"><input type="text" id="textBox1"></div>
        <label class="pr-abs" style="left:441px;top:48px" for="cmbParentCategory">Parent Category</label>
        <div class="pr-abs" style="left:535px;top:42px;width:175px"><select id="cmbParentCategory" data-dtcombo="single" data-dtcombo-caption="Parent Category"></select></div>
        <label class="pr-abs" style="left:441px;top:77px" for="CmbJobLotName">JobLot</label>
        <div class="pr-abs" style="left:535px;top:71px;width:175px"><select id="CmbJobLotName" data-dtcombo="single" data-dtcombo-caption="JobLot"></select></div>
        <label class="pr-abs" style="left:441px;top:107px" for="CmbSupplier">Supplier Name</label>
        <div class="pr-abs" style="left:535px;top:101px;width:175px"><select id="CmbSupplier" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>

        <label class="pr-abs" style="left:714px;top:20px" for="CmbWarehouseName">Warehouse</label>
        <div class="pr-abs" style="left:784px;top:14px;width:189px"><select id="CmbWarehouseName" data-dtcombo="single" data-dtcombo-caption="WareHouse"></select></div>
        <label class="pr-abs" style="left:714px;top:48px" for="CmbItem">Item</label>
        <div class="pr-abs" style="left:784px;top:42px;width:189px"><select id="CmbItem" data-dtcombo="single" data-dtcombo-caption="Item Name"></select></div>
        <label class="pr-abs" style="left:714px;top:77px" for="CmbCityName">CityName</label>
        <div class="pr-abs" style="left:784px;top:71px;width:123px"><select id="CmbCityName" data-dtcombo="single" data-dtcombo-caption="CityName"></select></div>
        <button type="button" class="pr-show pr-abs" id="btnshow" style="left:909px;top:71px;width:65px" title="Ctrl+S">Show</button>
    </fieldset>
    <section id="gridSection">
        <div class="pr-grid-bar">History <span id="lblCount"></span>
            <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen">Fullscreen</button><span id="gridTools"></span></span>
        </div>
        <div class="pr-wrap" tabindex="0" id="gridWrap"><table data-gridbar="GrnReport:DataGridHistory" data-gridbar-mount="#gridTools" class="pr-grid" id="DataGridHistory"></table></div>
    </section>
</div>
<script th:src="@{/build/js/countx_doc_link.js?v=20261001pr}"></script>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20261005grn211}"></script>
<script th:src="@{/build/js/purchase/reports/grn_report.js?v=20261005grn211}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
<script th:src="@{/build/js/countx_grid_bar.js?v=20261007-gridbar-flow}"></script>
</body>
</html>
