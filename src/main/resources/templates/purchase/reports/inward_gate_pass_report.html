<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gate Pass Report - EccountBookERP</title>
    <link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css?v=20260920a}">
    <link rel="stylesheet" th:href="@{/build/css/purchase/purchase_reports.css?v=20260930r3}">
</head>
<!-- 478 Architecture.WinApp.Inventory_Reports.frmGatePassReport "Gate Pass Report" (module 52). -->
<body class="pr">
<div id="prLoading" hidden role="status">Please wait...</div>
<nav class="pr-toolstrip" aria-label="Toolbar">
    <button type="button" id="btnReset" title="Ctrl+N">Reset</button>
    <button type="button" id="btnRefresh" title="Ctrl+R">Refresh</button>
    <button type="button" id="btnPrint" title="Ctrl+P">253-Register</button>
    <button type="button" id="btnshortcut">ShortCut Keys</button>
    <a class="pr-right" href="/purchase/reports" title="Ctrl+E / Esc">Exit</a>
</nav>
<div class="pr-caption">Gate Pass Inward</div>
<div id="prMessage" role="status" aria-live="polite"></div>
<div class="pr-panel">
    <fieldset class="pr-filters" style="width:776px;height:130px">
        <legend>Filters</legend>
        <label class="pr-abs" style="left:4px;top:19px" for="cmbBranchName">Branch Name</label>
        <details class="pr-check pr-abs" id="cmbBranchName" style="left:87px;top:13px;width:169px"></details>
        <label class="pr-abs" style="left:4px;top:47px" for="cmbDateType">Date Type</label>
        <div class="pr-abs" style="left:87px;top:41px;width:169px"><select id="cmbDateType" data-dtcombo="single" data-dtcombo-caption="Date Type"></select></div>
        <label class="pr-abs" style="left:4px;top:75px" for="gpFromDate">GP Date From</label>
        <div class="pr-abs" style="left:87px;top:71px;width:169px"><input type="date" id="gpFromDate"></div>
        <label class="pr-abs" style="left:4px;top:103px" for="gpToDate">GP Date To</label>
        <div class="pr-abs" style="left:87px;top:99px;width:169px"><input type="date" id="gpToDate"></div>

        <label class="pr-abs" style="left:260px;top:19px" for="txtGpFrom">GP From &amp; To</label>
        <div class="pr-abs" style="left:344px;top:15px;width:90px"><input type="text" id="txtGpFrom" inputmode="numeric" aria-label="GP From"></div>
        <div class="pr-abs" style="left:435px;top:15px;width:90px"><input type="text" id="txtGPTo" inputmode="numeric" aria-label="GP To"></div>
        <label class="pr-abs" style="left:260px;top:47px" for="cmbSupplierName">Supplier</label>
        <div class="pr-abs" style="left:344px;top:41px;width:181px"><select id="cmbSupplierName" data-dtcombo="single" data-dtcombo-caption="Supplier Name"></select></div>
        <label class="pr-abs" style="left:260px;top:75px" for="cmbgptype">GatePass Type</label>
        <div class="pr-abs" style="left:344px;top:69px;width:181px"><select id="cmbgptype" data-dtcombo="single" data-dtcombo-caption="Gate Pass Type"></select></div>
        <label class="pr-abs" style="left:260px;top:103px" for="cmbIsAccept">Status</label>
        <div class="pr-abs" style="left:344px;top:97px;width:181px"><select id="cmbIsAccept" data-dtcombo="single" data-dtcombo-caption="Status"></select></div>
        <button type="button" class="pr-show pr-abs" id="btnshow" style="left:528px;top:99px;width:61px" title="Ctrl+S">Show</button>
    </fieldset>
    <section id="gridSection">
        <div class="pr-grid-bar">Gate Pass Inward <span id="lblCount"></span>
            <span class="pr-right"><button type="button" id="btnGridPrint">Grid Print</button><button type="button" id="btnGridExport">Export</button><button type="button" id="btnFullscreen">Fullscreen</button></span>
        </div>
        <div class="pr-wrap" tabindex="0" id="gridWrap"><table class="pr-grid" id="grdfrm"></table></div>
    </section>
</div>
<script th:src="@{/build/js/countx_doc_link.js?v=20261001pr}"></script>
<script th:src="@{/build/js/purchase/reports/pr_common.js?v=20261001a}"></script>
<script th:src="@{/build/js/purchase/reports/gate_pass_report.js?v=20261001a}"></script>
<script th:src="@{/build/js/countx_desktop_combo.js?v=20260927b}"></script>
</body>
</html>
