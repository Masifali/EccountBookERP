<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct Purchase Invoice</title>
<link rel="stylesheet" th:href="@{/build/css/countx_desktop_combo.css}"><link rel="stylesheet" th:href="@{/build/css/countx_purchase_request.css}"><link rel="stylesheet" th:href="@{/build/css/countx_direct_invoice.css}"></head><body>
<nav class="invoice-tools"><button id="btnNew" onclick="directInvoice.newRecord(this)">New</button><button id="btnRefresh" onclick="directInvoice.refresh(this)">Refresh</button><button id="btnSave" onclick="directInvoice.save(this)" disabled>Save</button><button id="btnDelete" onclick="directInvoice.remove(this)" hidden>Delete</button><button id="btnAttachments" onclick="directInvoice.attachments(this)">Attachments</button><button id="btnHistory" onclick="directInvoice.history(this)">History</button><a href="/purchase">Purchase</a></nav>
<h1>Purchase Invoice Direct <span id="lblVoucherDisplayHeader"></span></h1><div id="invoiceMessage" role="status"></div><input id="txtId" type="hidden" value="0">
<main><section id="invoiceHeader" class="invoice-panel"><div class="invoice-fields"><label class="invoice-field" style="width:73px">Doc No<input id="txtDocNo" type="text"  style="height:23px" readonly/></label>
<label class="invoice-field" style="width:128px">Doc Date<input id="txtDocDate" type="date"  style="height:23px" /></label>
<label class="invoice-field" style="width:61px">Branch No<input id="txtBranchSrNo" type="text"  style="height:23px" readonly/></label>
<label class="invoice-field" style="width:264px">Supplier<select id="cmbSupplier" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:264px">Bill No<input id="txtBillNo" type="text"  style="height:23px" /></label>
<label class="invoice-field" style="width:136px">Delivery Term<select id="cmbDeliveryTerm" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:136px">Payment Terms<select id="cmbPaymentTerms" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:137px">Due Days<input id="txtDueDays" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:136px">Due Date<input id="txtDueDate" type="date"  style="height:23px" /></label>
<label class="invoice-field" style="width:264px">Supplier Reference<input id="txtSupplierReference" type="text"  style="height:23px" /></label></div><label class="invoice-remarks">Remarks<input id="txtRemarks"></label></section>
<section id="lineEditor" class="invoice-panel"><div class="invoice-fields"><label class="invoice-field" style="width:156px">Warehouse<select id="cmbWarehouse" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:199px">Item<select id="cmbItem" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:121px">Crop Year<select id="cmbCropYear" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:118px">Job Lot<select id="cmbJobLot" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:122px">Packing Type<select id="cmbPackingType" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:68px">Pack UOM<select id="cmbPackUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:81px">Quantity<input id="txtQty" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:101px">Gross Weight<input id="txtGrossWeight" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:64px">Empty Bag Unit<input id="txtEmptybagsUnit" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:75px">Empty Bag Total<input id="txtEmptyBagsTotal" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:49px">Weight Cut<input id="txtWeightCut" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:79px">Weight Cut Total<input id="txtWeightCutTotal" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:58px">Add/Less<input id="txtAddLss" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:95px">Net Bill Weight<input id="txtNetBillWeight" type="number" step="any" style="height:23px" readonly/></label>
<label class="invoice-field" style="width:96px">Stock Weight<input id="txtStockWeight" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:85px">Rate<input id="txtRate" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:69px">Rate UOM<select id="cmbRateUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:54px">Rate Cut<input id="txtRateCut" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:86px">Rate Cut Amount<input id="txtRateCutAmount" type="number" step="any" style="height:23px" readonly/></label>
<label class="invoice-field" style="width:117px">Amount<input id="txtAmount" type="number" step="any" style="height:23px" readonly/></label>
<label class="invoice-field" style="width:104px">GP Date<input id="txtGpDate" type="date"  style="height:23px" /></label>
<label class="invoice-field" style="width:50px">GP No<input id="txtGpNo" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:79px">Vehicle No<input id="txtVehicleNo" type="text"  style="height:23px" /></label>
<label class="invoice-field" style="width:95px">Lab Analysis No<input id="txtLabNo" type="number" step="any" style="height:23px" /></label></div><div class="invoice-tools"><button id="btnAddRow" onclick="directInvoice.add(this)" disabled>Add</button><button id="btnCancelRow" onclick="directInvoice.cancelEdit()" hidden>Cancel Update</button></div></section>
<section class="invoice-panel"><h2>Invoice Details</h2><div class="invoice-scroll"><table><thead id="invoiceDetailHead"></thead><tbody id="invoiceDetailBody"></tbody></table></div><div class="invoice-totals"><span id="invoiceTotals"></span><label>Bill Amount <input id="txtBillAmount" readonly></label></div></section>
<section class="invoice-panel"><div class="invoice-fields"><label class="invoice-field" style="width:242px">Commission Agent<select id="cmbCommissionAgent" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:81px">Commission Type<select id="cmbCommissionType" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:88px">Commission Rate<input id="txtCommRate" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:81px">Commission UOM<select id="cmbCommUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:90px">Commission Amount<input id="txtCommAmount" type="number" step="any" style="height:23px" readonly/></label>
<label class="invoice-field" style="width:242px">Commission Remarks<input id="txtCommissionRemarks" type="text"  style="height:23px" /></label>
<label class="invoice-field" style="width:229px">Broker Account<select id="cmbBroker" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:85px">Brokery Type<select id="cmbBrokeryType" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:68px">Brokery Rate<input id="txtBrokeryRate" type="number" step="any" style="height:23px" /></label>
<label class="invoice-field" style="width:85px">Brokery UOM<select id="cmbBrokeryUom" class="win-combo" style="height:26px" ><option value="">Select</option></select></label>
<label class="invoice-field" style="width:68px">Brokery Amount<input id="txtBrokeryAmount" type="number" step="any" style="height:23px" readonly/></label></div></section>
<section id="invoiceSupplements" class="invoice-panel"></section>
<section id="invoiceHistoryPanel" class="invoice-panel" hidden><h2>History</h2><div class="invoice-fields"><label class="invoice-field" style="width:120px">From Date<input id="historyFrom" type="date"  style="height:23px" /></label><label class="invoice-field" style="width:120px">To Date<input id="historyTo" type="date"  style="height:23px" /></label><label class="invoice-field" style="width:120px">From No<input id="historyFromNo" type="number" step="any" style="height:23px" /></label><label class="invoice-field" style="width:120px">To No<input id="historyToNo" type="number" step="any" style="height:23px" /></label><label class="invoice-field">Date Type<select id="historyDateType"><option value="DocDate">Doc Date</option><option value="EntryDate">Entry Date</option><option value="ModifyDate">Modify Date</option><option value="ApprovedDate">Approved Date</option></select></label><button onclick="directInvoice.history(this)">Show</button></div><div class="invoice-scroll"><table><thead id="historyHead"></thead><tbody id="historyBody"></tbody></table></div></section></main>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script><script th:src="@{/build/js/countx_desktop_combo.js}"></script><script th:src="@{/build/js/countx_purchase_request.js}"></script><script th:src="@{/build/js/countx_invoice_attachments.js}"></script><script th:src="@{/build/js/countx_direct_invoice.js}"></script></body></html>
